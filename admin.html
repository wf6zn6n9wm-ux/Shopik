// экспорт массива объектов в CSV-файл
function exportCSV(filename, rows, columns) {
  const head = columns.map((c) => `"${c.label}"`).join(",");
  const body = rows.map((r) => columns.map((c) => {
    const v = typeof c.get === "function" ? c.get(r) : r[c.key];
    return `"${String(v ?? "").replace(/"/g, '""')}"`;
  }).join(",")).join("\n");
  const csv = "\uFEFF" + head + "\n" + body; // BOM для кириллицы в Excel
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function Delta({ v }) {
  const up = v >= 0;
  return (
    <span className={`inline-flex items-center gap-0.5 text-xs font-semibold ${up ? "text-emerald-600" : "text-rose-600"}`}>
      {up ? <TrendingUp size={13} /> : <TrendingDown size={13} />}
      {Math.abs(v)}%
    </span>
  );
}

function RoleBadge({ role }) {
  const r = ROLES[role];
  if (!r) return <span className="text-xs text-slate-400">—</span>;
  return (
    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold"
      style={{ background: r.color + "18", color: r.color }}>
      <Shield size={11} /> {r.label}
    </span>
  );
}

// выезжающая панель деталей (справа)
function Drawer({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <>
      <div className="fixed inset-0 bg-black/40 z-50" onClick={onClose} />
      <div className="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-white z-50 shadow-2xl flex flex-col"
        style={{ animation: "slideIn .2s ease" }}>
        <style>{`@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}`}</style>
        <div className="h-16 px-5 flex items-center justify-between border-b border-slate-200 shrink-0">
          <h2 className="font-bold text-slate-900">{title}</h2>
          <button onClick={onClose} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100"><X size={20} /></button>

        <div className="flex-1 overflow-y-auto p-5">{children}</div>

    </>
  );
}

      .shophub-admin[data-theme="dark"] input { color:#e2e8f0 !important; }
    `}</style>
  );
}

function AdminPanel() {

                  <span className="text-sm font-semibold text-slate-900">Уведомления</span>
                  <span className="text-[11px] text-slate-400">{NOTIFICATIONS.length} новых</span>
                </div>

        </header>

        {/* content */}

          {visibleTab === "dashboard"  && <Dashboard role={role} />}

// ============================================================
// CAMPAIGNS — рекламные ссылки и аналитика трафика
// ============================================================
function Campaigns({ flash }) {
  const [rows, setRows] = useState(CAMPAIGNS);
  const [name, setName] = useState("");
  const [sel, setSel] = useState(null);
  const [promos, setPromos] = useState(PROMOS);
  const [promoForm, setPromoForm] = useState({ code: "", discount: "" });
  const BASE = "shopik.app/r/";

  const createPromo = () => {
    if (!promoForm.code.trim() || !promoForm.discount) return;
    setPromos((p) => [{ id: Date.now(), code: promoForm.code.trim(), discount: Number(promoForm.discount), uses: 0, revenue: 0, active: true }, ...p]);
    setPromoForm({ code: "", discount: "" });
    flash(`Промокод ${promoForm.code} создан`);
  };
  const togglePromo = (id) => setPromos((p) => p.map((x) => x.id === id ? { ...x, active: !x.active } : x));

  const slugify = (s) => s.toLowerCase().trim().replace(/[^a-zа-я0-9]+/gi, "-").replace(/^-+|-+$/g, "").slice(0, 20) || "link";

  const create = () => {
    if (!name.trim()) return;
    const slug = slugify(name);
    setRows((r) => [{ id: Date.now(), name: name.trim(), slug, clicks: 0, signups: 0, lite: 0, pro: 0, premium: 0, revenue: 0, date: "сейчас" }, ...r]);
    setName("");
    flash(`Ссылка ${BASE}${slug} создана`);
  };
  const copy = (slug) => flash(`Скопировано: ${BASE}${slug}`);
  const paidOf = (c) => (c.lite || 0) + (c.pro || 0) + (c.premium || 0);

  // итоги
  const tot = rows.reduce((a, c) => ({
    clicks: a.clicks + c.clicks, signups: a.signups + c.signups,
    paid: a.paid + paidOf(c), revenue: a.revenue + c.revenue,
  }), { clicks: 0, signups: 0, paid: 0, revenue: 0 });

  return (
    <div className="space-y-5 max-w-4xl">
      <div>
        <h1 className="text-2xl font-bold text-slate-900">Реклама</h1>
        <p className="text-sm text-slate-500 mt-0.5">Рекламные ссылки и их эффективность</p>
      </div>

      {/* сводка */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        {[
          { l: "Переходы", v: tot.clicks.toLocaleString("ru"), c: "#2563EB" },
          { l: "Регистрации", v: tot.signups.toLocaleString("ru"), c: "#7C3AED" },
          { l: "Купили подписку", v: tot.paid.toLocaleString("ru"), c: "#10B981" },
          { l: "Доход", v: "₴" + tot.revenue.toLocaleString("ru"), c: "#0EA5E9" },
        ].map((s) => (
          <div key={s.l} className="bg-white rounded-2xl border border-slate-200 p-4">
            <div className="text-xs text-slate-500">{s.l}</div>
            <div className="text-xl font-bold mt-1" style={{ color: s.c }}>{s.v}</div>
          </div>
        ))}
      </div>

      {/* создать ссылку */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <h2 className="font-semibold text-slate-900 mb-3">Создать ссылку</h2>
        <div className="flex items-center gap-1.5">
          <input value={name} onChange={(e) => setName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && create()}
            placeholder="Название кампании (напр. Блогер @ivan)"
            className="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-slate-400 placeholder:text-slate-300" />
          <button onClick={create} disabled={!name.trim()}
            className="px-4 py-2.5 rounded-lg bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 disabled:opacity-30 shrink-0">
            Создать
          </button>
        </div>
        {name.trim() && <div className="text-xs text-slate-400 mt-2">Ссылка будет: <span className="font-mono text-slate-600">{BASE}{slugify(name)}</span></div>}
      </div>

      {/* список ссылок */}
      <div className="space-y-2.5">
        {rows.map((c) => {
          const paid = paidOf(c);
          const cr = c.clicks ? Math.round((paid / c.clicks) * 100) : 0;
          return (
            <div key={c.id} onClick={() => setSel(c)}
              className="bg-white rounded-2xl border border-slate-200 p-4 cursor-pointer hover:border-slate-300 transition">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="font-semibold text-slate-900">{c.name}</div>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <Link2 size={12} className="text-slate-400 shrink-0" />
                    <span className="text-xs font-mono text-slate-500 truncate">{BASE}{c.slug}</span>
                    <button onClick={(e) => { e.stopPropagation(); copy(c.slug); }} className="text-slate-400 hover:text-slate-700 shrink-0">
                      <Copy size={12} />
                    </button>
                  </div>
                </div>
                <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 shrink-0">CR {cr}%</span>
              </div>
              {/* воронка: клики → рег → доход */}
              <div className="grid grid-cols-3 gap-2 mt-3 text-center">
                {[["Клики", c.clicks, "#2563EB"], ["Рег.", c.signups, "#7C3AED"], ["Доход", "₴" + (c.revenue / 1000).toFixed(0) + "k", "#0EA5E9"]].map(([l, v, col]) => (
                  <div key={l} className="bg-slate-50 rounded-lg py-1.5">
                    <div className="text-sm font-bold" style={{ color: col }}>{typeof v === "number" ? v.toLocaleString("ru") : v}</div>
                    <div className="text-[10px] text-slate-400">{l}</div>
                  </div>
                ))}
              </div>
              {/* разбивка купивших по тарифам */}
              <div className="grid grid-cols-3 gap-2 mt-2 text-center">
                {[["Лайт", c.lite, "#60A5FA"], ["Pro", c.pro, "#7C3AED"], ["Premium", c.premium, "#F59E0B"]].map(([l, v, col]) => (
                  <div key={l} className="rounded-lg py-1.5 border border-slate-100">
                    <div className="text-sm font-bold" style={{ color: col }}>{(v || 0).toLocaleString("ru")}</div>
                    <div className="text-[10px] text-slate-400">{l}</div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>

      {/* промокоды */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <h2 className="font-semibold text-slate-900 mb-3">Промокоды</h2>
        {/* создать промокод */}
        <div className="flex items-center gap-1.5 mb-3">
          <input value={promoForm.code} onChange={(e) => setPromoForm({ ...promoForm, code: e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "") })}
            placeholder="КОД (напр. SALE20)"
            className="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2.5 text-sm font-mono outline-none focus:border-slate-400 placeholder:text-slate-300" />
          <input type="number" value={promoForm.discount} onChange={(e) => setPromoForm({ ...promoForm, discount: e.target.value })}
            placeholder="%" min={1} max={99}
            className="w-16 bg-white border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-slate-400 placeholder:text-slate-300" />
          <button onClick={createPromo} disabled={!promoForm.code || !promoForm.discount}
            className="px-4 py-2.5 rounded-lg bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 disabled:opacity-30 shrink-0">
            Создать
          </button>
        </div>
        {/* список промокодов */}
        <div className="space-y-2">
          {promos.map((p) => (
            <div key={p.id} className="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
              <div className="flex items-center gap-2.5 min-w-0">
                <span className={`font-mono text-sm font-bold px-2 py-0.5 rounded-lg ${p.active ? "bg-violet-50 text-violet-700" : "bg-slate-100 text-slate-400 line-through"}`}>{p.code}</span>
                <span className="text-xs text-slate-500">−{p.discount}%</span>
              </div>
              <div className="flex items-center gap-3 shrink-0">
                <div className="text-right">
                  <div className="text-xs font-semibold text-slate-700">{p.uses} исп. · ₴{(p.revenue / 1000).toFixed(0)}k</div>
                </div>
                <button onClick={() => togglePromo(p.id)}
                  className={`w-10 h-5.5 rounded-full transition relative ${p.active ? "bg-emerald-500" : "bg-slate-200"}`}
                  style={{ height: 22 }}>
                  <span className="absolute top-0.5 w-[18px] h-[18px] bg-white rounded-full transition-all" style={{ left: p.active ? 20 : 2 }} />
                </button>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* реферальная программа */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-semibold text-slate-900">Реферальная программа</h2>
          <span className="text-xs text-slate-400">продавец приводит продавца</span>
        </div>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 mb-4">
          {[
            { l: "Приглашено", v: REFERRAL.invited, c: "#2563EB" },
            { l: "Создали магазин", v: REFERRAL.activated, c: "#7C3AED" },
            { l: "Купили подписку", v: REFERRAL.paid, c: "#10B981" },
            { l: "Выплачено бонусов", v: "₴" + REFERRAL.bonusPaid.toLocaleString("ru"), c: "#F59E0B" },
          ].map((s) => (
            <div key={s.l} className="bg-slate-50 rounded-xl p-2.5 text-center">
              <div className="text-base font-bold" style={{ color: s.c }}>{typeof s.v === "number" ? s.v.toLocaleString("ru") : s.v}</div>
              <div className="text-[10px] text-slate-400">{s.l}</div>
            </div>
          ))}
        </div>
        <div className="text-xs font-semibold text-slate-500 mb-2">Топ рефереров</div>
        <div className="space-y-1.5">
          {REFERRAL.topReferrers.map((r, i) => (
            <div key={r.shop} className="flex items-center justify-between text-sm py-1.5 border-b border-slate-50 last:border-0">
              <span className="text-slate-700"><span className="text-slate-400 mr-1.5">{i + 1}</span>{r.shop}</span>
              <span className="text-xs text-slate-500">{r.invited} пригл. · {r.paid} купили · <span className="font-semibold text-amber-600">₴{r.bonus.toLocaleString("ru")}</span></span>
            </div>
          ))}
        </div>
      </div>

      {/* детали кампании */}
      <Drawer open={!!sel} onClose={() => setSel(null)} title={sel ? sel.name : "Кампания"}>
        {sel && (() => {
          const paid = paidOf(sel);
          const steps = [
            { l: "Переходы по ссылке", v: sel.clicks, col: "#2563EB" },
            { l: "Регистрации", v: sel.signups, col: "#7C3AED" },
            { l: "Купили подписку", v: paid, col: "#10B981" },
          ];
          const max = sel.clicks || 1;
          return (
            <div className="space-y-5">
              <div className="bg-slate-50 rounded-xl p-3">
                <div className="flex items-center gap-1.5">
                  <Link2 size={14} className="text-slate-400" />
                  <span className="text-sm font-mono text-slate-600">{BASE}{sel.slug}</span>
                  <button onClick={() => copy(sel.slug)} className="text-slate-400 hover:text-slate-700 ml-auto"><Copy size={14} /></button>
                </div>
                <div className="text-xs text-slate-400 mt-1">Запущена {sel.date}</div>
              </div>

              {/* воронка */}
              <div>
                <div className="text-xs font-semibold text-slate-500 mb-2">Воронка</div>
                <div className="space-y-2">
                  {steps.map((s, i) => {
                    const pct = Math.round((s.v / max) * 100);
                    const conv = i > 0 ? Math.round((s.v / steps[i - 1].v) * 100) : 100;
                    return (
                      <div key={s.l}>
                        <div className="flex justify-between text-sm mb-1">
                          <span className="text-slate-700">{s.l}</span>
                          <span className="text-slate-500">{s.v.toLocaleString("ru")} {i > 0 && <span className="text-slate-400">· {conv}%</span>}</span>
                        </div>
                        <div className="h-6 bg-slate-100 rounded-lg overflow-hidden">
                          <div className="h-full rounded-lg flex items-center px-2 text-[11px] font-semibold text-white" style={{ width: `${Math.max(pct, 8)}%`, background: s.col }}>{pct}%</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* разбивка по тарифам */}
              <div>
                <div className="text-xs font-semibold text-slate-500 mb-2">Купили по тарифам</div>
                <div className="grid grid-cols-3 gap-2 text-center">
                  {[["Лайт", sel.lite, "#60A5FA"], ["Pro", sel.pro, "#7C3AED"], ["Premium", sel.premium, "#F59E0B"]].map(([l, v, col]) => (
                    <div key={l} className="bg-white border border-slate-200 rounded-xl py-2.5">
                      <div className="text-lg font-bold" style={{ color: col }}>{(v || 0).toLocaleString("ru")}</div>
                      <div className="text-[11px] text-slate-400">{l}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* доход */}
              <div className="grid grid-cols-2 gap-2">
                <div className="bg-white border border-slate-200 rounded-xl p-3">
                  <div className="text-xs text-slate-500">Доход с кампании</div>
                  <div className="text-xl font-bold text-slate-900 mt-0.5">₴{sel.revenue.toLocaleString("ru")}</div>
                </div>
                <div className="bg-white border border-slate-200 rounded-xl p-3">
                  <div className="text-xs text-slate-500">Цена за клиента</div>
                  <div className="text-xl font-bold text-slate-900 mt-0.5">{paid ? "₴" + Math.round(sel.revenue / paid).toLocaleString("ru") : "—"}</div>
                </div>
              </div>
            </div>
          );
        })()}
      </Drawer>
    </div>
  );
}

// TICKETS — поддержка продавцов
// ============================================================
function Tickets({ flash }) {
  const [rows, setRows] = useState(TICKETS);
  const [filter, setFilter] = useState("open");
  const [sel, setSel] = useState(null);
  const [reply, setReply] = useState("");
  const stMeta = {
    open:    { label: "Открыт",    cls: "bg-rose-50 text-rose-700" },
    pending: { label: "В работе",  cls: "bg-amber-50 text-amber-700" },
    closed:  { label: "Закрыт",    cls: "bg-emerald-50 text-emerald-700" },
  };
  const prMeta = { high: "#F43F5E", mid: "#F59E0B", low: "#94A3B8" };
  const filtered = filter === "all" ? rows : rows.filter((t) => t.status === filter);

  const update = (id, fn) => {
    setRows((rs) => rs.map((t) => (t.id === id ? fn(t) : t)));
    setSel((cur) => (cur && cur.id === id ? fn(cur) : cur));
  };
  const setStatus = (id, status, msg) => { update(id, (t) => ({ ...t, status })); flash(msg); };

  const sendReply = (t) => {
    if (!reply.trim()) return;
    update(t.id, (x) => ({
      ...x,
      status: x.status === "open" ? "pending" : x.status,
      messages: [...x.messages, { from: "support", text: reply.trim(), time: "сейчас" }],
    }));
    setReply("");
    flash("Ответ отправлен");
  };

  return (
    <div className="space-y-4 max-w-3xl">
      <div>
        <h1 className="text-2xl font-bold text-slate-900">Поддержка</h1>
        <p className="text-sm text-slate-500 mt-0.5">Обращения продавцов</p>
      </div>
      <div className="flex items-center gap-1.5 bg-white border border-slate-200 rounded-lg p-1 w-fit">
        {[["open", "Открытые"], ["pending", "В работе"], ["closed", "Закрытые"], ["all", "Все"]].map(([k, l]) => (
          <button key={k} onClick={() => setFilter(k)}
            className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${filter === k ? "bg-slate-900 text-white" : "text-slate-500 hover:bg-slate-100"}`}>
            {l}
          </button>
        ))}
      </div>
      <div className="space-y-2.5">
        {filtered.map((t) => {
          const st = stMeta[t.status];
          const last = t.messages[t.messages.length - 1];
          return (
            <div key={t.id} onClick={() => { setSel(t); setReply(""); }}
              className="bg-white rounded-2xl border border-slate-200 p-4 cursor-pointer hover:border-slate-300 transition">
              <div className="flex items-start gap-3">
                <span className="w-2 h-2 rounded-full mt-2 shrink-0" style={{ background: prMeta[t.priority] }} />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-semibold text-slate-900">{t.shop}</span>
                    <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${st.cls}`}>{st.label}</span>
                    {t.messages.length > 1 && <span className="text-[11px] text-slate-400">{t.messages.length} сообщ.</span>}
                  </div>
                  <div className="text-sm font-medium text-slate-700 mt-0.5">{t.subject}</div>
                  <div className="text-xs text-slate-400 mt-0.5 truncate">{last.from === "support" ? "Вы: " : ""}{last.text}</div>
                </div>
                <ChevronRight size={16} className="text-slate-300 shrink-0 mt-1" />
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && <div className="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-400">Нет обращений</div>}
      </div>

      {/* переписка */}
      <Drawer open={!!sel} onClose={() => setSel(null)} title={sel ? sel.shop : "Тикет"}>
        {sel && (() => {
          const st = stMeta[sel.status];
          return (
            <div className="flex flex-col h-full -m-5">
              {/* шапка */}
              <div className="px-5 py-3 border-b border-slate-100">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="font-semibold text-slate-900">{sel.subject}</span>
                  <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${st.cls}`}>{st.label}</span>
                </div>
                <div className="text-xs text-slate-400 mt-0.5">{sel.owner} · {sel.date}</div>
              </div>

              {/* переписка */}
              <div className="flex-1 overflow-y-auto px-5 py-4 space-y-3">
                {sel.messages.map((m, i) => (
                  <div key={i} className={`flex ${m.from === "support" ? "justify-end" : "justify-start"}`}>
                    <div className={`max-w-[80%] rounded-2xl px-3.5 py-2.5
                      ${m.from === "support" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-800"}`}>
                      <div className="text-sm leading-snug">{m.text}</div>
                      <div className={`text-[10px] mt-1 ${m.from === "support" ? "text-white/50" : "text-slate-400"}`}>
                        {m.from === "support" ? "Поддержка" : sel.owner} · {m.time}
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {/* действия + ответ */}
              <div className="px-5 py-3 border-t border-slate-100 space-y-2">
                {sel.status !== "closed" ? (
                  <>
                    {/* шаблоны ответов */}
                    <div className="flex flex-wrap gap-1.5">
                      {[
                        ["Приветствие", "Здравствуйте! Спасибо за обращение, уже разбираемся с вашим вопросом."],
                        ["Взяли в работу", "Ваш вопрос взят в работу — вернёмся с ответом в течение 24 часов."],
                        ["Нужны детали", "Уточните, пожалуйста: пришлите скриншот проблемы и название вашего магазина."],
                        ["Решено", "Проблема устранена. Проверьте, пожалуйста, и напишите, если что-то ещё не так."],
                      ].map(([label, text]) => (
                        <button key={label} onClick={() => setReply(text)}
                          className="px-2.5 py-1 rounded-lg text-[11px] font-medium border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-slate-700">
                          {label}
                        </button>
                      ))}
                    </div>
                    <div className="flex items-end gap-1.5">
                      <textarea value={reply} onChange={(e) => setReply(e.target.value)}
                        placeholder="Ответить продавцу…" rows={2}
                        className="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-slate-400 placeholder:text-slate-300 resize-none" />
                      <button onClick={() => sendReply(sel)} disabled={!reply.trim()}
                        className="w-9 h-9 grid place-items-center rounded-lg bg-slate-900 text-white hover:bg-slate-800 disabled:opacity-30 shrink-0">
                        <Send size={16} />
                      </button>
                    </div>
                    <button onClick={() => setStatus(sel.id, "closed", `Тикет «${sel.shop}» закрыт`)}
                      className="w-full py-2 rounded-lg bg-emerald-50 text-emerald-700 text-sm font-semibold hover:bg-emerald-100">
                      Закрыть обращение
                    </button>
                  </>
                ) : (
                  <button onClick={() => setStatus(sel.id, "pending", `Тикет «${sel.shop}» переоткрыт`)}
                    className="w-full py-2 rounded-lg bg-slate-100 text-slate-600 text-sm font-semibold hover:bg-slate-200">
                    Переоткрыть
                  </button>
                )}
              </div>
            </div>
          );
        })()}
      </Drawer>
    </div>
  );
}

// BROADCASTS — рассылки продавцам
// ============================================================
function Broadcasts({ flash }) {
  const [sent, setSent] = useState(BROADCASTS);
  const [draft, setDraft] = useState({ title: "", audience: "Все магазины" });
  const AUDIENCES = ["Все магазины", "Free-магазины", "Pro-магазины", "Истекающие подписки"];
  const reachMap = { "Все магазины": 1580, "Free-магазины": 1198, "Pro-магазины": 382, "Истекающие подписки": 4 };

  const send = () => {
    if (!draft.title.trim()) { flash("Введите текст рассылки"); return; }
    setSent((s) => [{ id: Date.now(), title: draft.title.trim(), audience: draft.audience, reach: reachMap[draft.audience], date: "сейчас", status: "sent" }, ...s]);
    setDraft({ title: "", audience: draft.audience });
    flash(`Рассылка отправлена · ${reachMap[draft.audience]} получателей`);
  };

  return (
    <div className="space-y-5 max-w-3xl">
      <div>
        <h1 className="text-2xl font-bold text-slate-900">Рассылки</h1>
        <p className="text-sm text-slate-500 mt-0.5">Push-уведомления продавцам</p>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <h2 className="font-semibold text-slate-900 mb-3">Новая рассылка</h2>
        <div className="text-xs text-slate-400 mb-1.5">Аудитория</div>
        <div className="flex flex-wrap gap-1.5 mb-3">
          {AUDIENCES.map((a) => (
            <button key={a} onClick={() => setDraft({ ...draft, audience: a })}
              className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition ${draft.audience === a ? "border-slate-900 bg-slate-900 text-white" : "border-slate-200 text-slate-600 hover:bg-slate-50"}`}>
              {a} <span className="opacity-60">· {reachMap[a]}</span>
            </button>
          ))}
        </div>
        <textarea value={draft.title} onChange={(e) => setDraft({ ...draft, title: e.target.value })}
          placeholder="Текст уведомления…" rows={3}
          className="w-full bg-white border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-slate-400 placeholder:text-slate-300 resize-none mb-3" />
        <button onClick={send} disabled={!draft.title.trim()}
          className="w-full py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <Send size={15} /> Отправить {reachMap[draft.audience]} получателям
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 p-4">

// ============================================================
// FINANCE — финансы платформы (касса/расходы/прибыль)
// ============================================================
function Finance({ can, flash }) {
  const MONTHS_UA = ["Січень","Лютий","Березень","Квітень","Травень","Червень",
    "Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  const MONTHS = useMemo(() => {
    const out = []; let mi = 0, yr = 2026;
    for (let i = 0; i < 120; i++) { out.push(`${MONTHS_UA[mi]} ${yr}`); mi++; if (mi > 11) { mi = 0; yr++; } }
    return out;
  }, []);
  const [month, setMonth] = useState("Червень 2026");
  const monthName = month.split(" ")[0];
  // КАССА — авто из дохода платформы за месяц
  const autoIncome = (FINANCE_BY_MONTH[monthName] && month.endsWith("2026")) ? FINANCE_BY_MONTH[monthName].income : 0;

  const [ops, setOps] = useState({
    "Червень 2026": [
      { id: 1, label: "Зарплаты", value: 186584 },
      { id: 2, label: "Реклама",  value: 82836 },
      { id: 3, label: "Серверы/хостинг", value: 63265 },
      { id: 4, label: "Комиссии эквайринга", value: 25468 },
    ],
  });
  const [opForm, setOpForm] = useState({ label: "", value: "" });
  const [payFilter, setPayFilter] = useState("all");
  const monthOps = ops[month] || [];
  const expenses = monthOps.reduce((s, o) => s + o.value, 0);
  const profit = autoIncome - expenses;
  const margin = autoIncome > 0 ? Math.round(profit / autoIncome * 100) : 0;
  const fin = { income: autoIncome, expenses, profit, margin };

  const addOp = () => {
    const val = Number(opForm.value) || 0;
    if (val <= 0 || !opForm.label.trim()) return;
    setOps((prev) => ({
      ...prev,
      [month]: [...(prev[month] || []), { id: Date.now(), label: opForm.label.trim(), value: val }],
    }));
    setOpForm({ label: "", value: "" });
  };
  const removeOp = (id) => setOps((prev) => ({ ...prev, [month]: (prev[month] || []).filter((o) => o.id !== id) }));

  return (
    <div className="space-y-5 max-w-3xl">
      <div className="flex items-end justify-between gap-3 flex-wrap">
        <div>
          <h1 className="text-2xl font-bold text-slate-900">Финансы</h1>
          <p className="text-sm text-slate-500 mt-0.5">Касса, расходы и прибыль платформы</p>
        </div>
        <select value={month} onChange={(e) => setMonth(e.target.value)}
          className="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 outline-none focus:border-slate-400">
          {MONTHS.map((m) => <option key={m} value={m}>{m}</option>)}
        </select>
      </div>

      {/* прибыль */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="flex items-center justify-between">
          <span className="text-sm text-slate-500">Чистая прибыль · {monthName}</span>
          <span className="text-xs text-slate-400">маржа {fin.margin}%</span>
        </div>
        <div className={`text-3xl font-bold mt-1 ${fin.profit >= 0 ? "text-emerald-600" : "text-rose-600"}`}>
          {fin.income === 0
            ? <span className="text-slate-400 text-xl">Нет данных</span>
            : <span>{fin.profit >= 0 ? "+" : "−"}₴{Math.abs(fin.profit).toLocaleString("ru")}</span>}
        </div>
        <div className="grid grid-cols-2 gap-2 mt-4">
          <div className="bg-emerald-50 rounded-xl p-3 text-center">
            <div className="text-[11px] text-emerald-700/70">Касса · авто</div>
            <div className="text-base font-bold text-emerald-700">₴{(fin.income / 1000).toFixed(0)}k</div>
          </div>
          <div className="bg-rose-50 rounded-xl p-3 text-center">
            <div className="text-[11px] text-rose-700/70">Расходы</div>
            <div className="text-base font-bold text-rose-700">₴{(fin.expenses / 1000).toFixed(0)}k</div>
          </div>
        </div>
      </div>

      {/* список операций */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-semibold text-slate-900">Расходы за {monthName}</h2>
          {monthOps.length > 0 && (
            <button onClick={() => exportCSV(`расходы-${monthName}.csv`, monthOps, [
                { label: "Категория", key: "label" },
                { label: "Сумма, ₴", key: "value" },
              ])}
              className="flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-50">
              <Download size={13} /> Экспорт
            </button>
          )}
        </div>
        {monthOps.length > 0 ? (
          <div className="space-y-1.5">
            {monthOps.map((o) => (
              <div key={o.id} className="flex items-center justify-between text-sm py-1.5 border-b border-slate-50 last:border-0">
                <span className="text-slate-600 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-rose-400" />
                  {o.label}
                </span>
                <span className="flex items-center gap-2.5">
                  <span className="font-medium text-slate-700">₴{o.value.toLocaleString("ru")}</span>
                  <button onClick={() => removeOp(o.id)} className="text-slate-300 hover:text-rose-500">
                    <X size={15} />
                  </button>
                </span>
              </div>
            ))}
          </div>
        ) : (
          <p className="text-sm text-slate-400 py-3">Расходов пока нет — добавьте ниже</p>
        )}
      </div>

      {/* добавить операцию */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <h2 className="font-semibold text-slate-900 mb-3">Добавить расход</h2>
        <div className="text-xs text-slate-400 mb-1.5">Категория</div>
        <div className="flex flex-wrap gap-1.5 mb-3">
          {EXPENSE_CATS.map((cat) => (
            <button key={cat} onClick={() => setOpForm({ ...opForm, label: cat })}
              className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition
                ${opForm.label === cat
                  ? "border-slate-900 bg-slate-900 text-white"
                  : "border-slate-200 text-slate-600 hover:bg-slate-50"}`}>
              {cat}
            </button>
          ))}
        </div>

        <div className="flex items-center gap-1.5">
          <input type="number" inputMode="numeric" value={opForm.value}
            onChange={(e) => setOpForm({ ...opForm, value: e.target.value })}
            onKeyDown={(e) => e.key === "Enter" && addOp()}
            placeholder="Сумма, ₴"
            className="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-slate-400 placeholder:text-slate-300" />
          <button onClick={addOp}
            disabled={!opForm.label || !opForm.value}
            className="px-5 py-2.5 rounded-lg bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 disabled:opacity-30 disabled:cursor-not-allowed shrink-0">
            Добавить
          </button>
        </div>
      </div>

      {/* MRR — регулярный доход с подписок */}
      {(() => {
        const paidPlans = PLANS.filter((p) => p.id !== "free")
          .map((p) => ({ ...p, num: Number(p.price.replace(/[^\d]/g, "")), mrr: p.shops * Number(p.price.replace(/[^\d]/g, "")) }));
        const mrr = paidPlans.reduce((s, p) => s + p.mrr, 0);
        const paid = paidPlans.reduce((s, p) => s + p.shops, 0);
        return (
          <div className="bg-white rounded-2xl border border-slate-200 p-4">
            <div className="flex items-center justify-between">
              <div>
                <div className="text-sm text-slate-500">MRR · регулярный доход с подписок</div>
                <div className="text-2xl font-bold text-slate-900 mt-1">₴{mrr.toLocaleString("ru")}</div>
              </div>
              <Delta v={9.2} />
            </div>
            {/* разбивка по тарифам */}
            <div className="mt-3 pt-3 border-t border-slate-50 space-y-2">
              {paidPlans.map((p) => {
                const pct = Math.round((p.mrr / mrr) * 100);
                return (
                  <div key={p.id}>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-slate-600 font-medium">{p.name} <span className="text-slate-400">· {p.shops} × {p.price}</span></span>
                      <span className="text-slate-700 font-semibold">₴{p.mrr.toLocaleString("ru")} <span className="text-slate-400 font-normal">· {pct}%</span></span>
                    </div>
                    <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                      <div className="h-full rounded-full" style={{ width: `${pct}%`, background: p.color }} />
                    </div>
                  </div>
                );
              })}
            </div>
            <p className="text-xs text-slate-400 mt-3">{paid} платных подписок — стабильный ежемесячный доход</p>
          </div>
        );
      })()}

      {/* лог платежей */}
      {(() => {
        const filtered = payFilter === "all" ? PAYMENTS : PAYMENTS.filter((p) => p.status === payFilter);
        const planColor = { "Лайт": "#60A5FA", "Pro": "#7C3AED", "Premium": "#F59E0B" };
        return (
          <div className="bg-white rounded-2xl border border-slate-200 p-4">
            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
              <h2 className="font-semibold text-slate-900">Платежи</h2>
              <button onClick={() => exportCSV("платежи.csv", filtered, [
                  { label: "Дата", key: "date" },
                  { label: "Магазин", key: "shop" },
                  { label: "Тариф", key: "plan" },
                  { label: "Сумма, ₴", key: "amount" },
                  { label: "Промокод", get: (r) => r.promo || "" },
                  { label: "Статус", get: (r) => PAY_STATUS[r.status].label },
                ])}
                className="flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-50">
                <Download size={13} /> Экспорт
              </button>
            </div>
            <div className="flex items-center gap-1.5 mb-3 flex-wrap">
              {[["all", "Все"], ["paid", "Успешные"], ["refund", "Возвраты"], ["failed", "Ошибки"]].map(([k, l]) => (
                <button key={k} onClick={() => setPayFilter(k)}
                  className={`px-2.5 py-1.5 rounded-lg text-xs font-medium border transition
                    ${payFilter === k ? "border-slate-900 bg-slate-900 text-white" : "border-slate-200 text-slate-600 hover:bg-slate-50"}`}>
                  {l}
                </button>
              ))}
            </div>
            <div className="space-y-1">
              {filtered.map((p) => {
                const st = PAY_STATUS[p.status];
                return (
                  <div key={p.id} className="flex items-center justify-between py-2 border-b border-slate-50 last:border-0 gap-2">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm font-semibold text-slate-800">{p.shop}</span>
                        <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full"
                          style={{ background: planColor[p.plan] + "1F", color: planColor[p.plan] }}>{p.plan}</span>
                        {p.promo && <span className="text-[10px] font-mono px-1.5 py-0.5 rounded-full bg-violet-50 text-violet-600">{p.promo}</span>}
                      </div>
                      <div className="text-xs text-slate-400 mt-0.5">{p.date}</div>
                    </div>
                    <div className="text-right shrink-0">
                      <div className={`text-sm font-bold ${p.status === "refund" ? "text-amber-600" : p.status === "failed" ? "text-slate-400 line-through" : "text-slate-800"}`}>
                        {p.status === "refund" ? "−" : ""}₴{p.amount.toLocaleString("ru")}
                      </div>
                      <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded-full ${st.cls}`}>{st.label}</span>
                    </div>
                  </div>
                );
              })}
              {filtered.length === 0 && <p className="text-sm text-slate-400 py-3 text-center">Нет платежей</p>}
            </div>
          </div>
        );
      })()}

      {/* цены тарифов */}
      <div className="bg-white rounded-2xl border border-slate-200 p-5 space-y-1">
        <h2 className="font-semibold text-slate-900 mb-2">Цены тарифов</h2>
        {PLANS.map((p) => (
          <div key={p.id} className="flex items-center justify-between py-3 border-b border-slate-50 last:border-0">
            <div className="flex items-center gap-3">
              <span className="w-3 h-3 rounded-full" style={{ background: p.color }} />
              <div>
                <div className="font-semibold text-slate-900">{p.name}</div>
                <div className="text-xs text-slate-400">
                  {p.shops} магазинов · {p.id === "free" ? "7 дней бесплатно" : `${p.price}/мес`}
                </div>
              </div>
            </div>
            <button
              disabled={!can("editBilling")}
              onClick={() => flash(`Цена тарифа ${p.name} изменена`)}
              className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-900 text-white disabled:opacity-30 disabled:cursor-not-allowed">

    if (!showMoney && metric === "rev") setMetric("orders");

  const series = statMode === "days" ? STATS_DAILY : STATS_MONTHLY;
  const metricMeta = {
    rev:    { label: "Доход", unit: "тыс. ₴", color: "#7C3AED", fmt: (v) => "₴" + (Math.round(v * 10) / 10).toLocaleString("ru") + "k" },

      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-900 mb-4">Цели месяца</h2>
        <div className="grid sm:grid-cols-2 gap-x-6 gap-y-4">
          {kpiRows.map((k) => {
            const pct = Math.min(Math.round((k.fact / k.plan) * 100), 100);
            const done = k.fact >= k.plan;
            return (
              <div key={k.label}>
                <div className="flex justify-between text-sm mb-1.5">
                  <span className="text-slate-600">{k.label}</span>
                  <span className="text-slate-500"><span className="font-semibold text-slate-800">{k.fact}{k.unit}</span> / {k.plan}{k.unit}</span>
                </div>
                <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                  <div className="h-full rounded-full" style={{ width: `${pct}%`, background: done ? "#10B981" : "#7C3AED" }} />
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* сравнение с прошлым месяцем */}
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-900 mb-1">Месяц к месяцу</h2>
        <p className="text-xs text-slate-500 mb-4">червень vs травень</p>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
          {compareRows.map((c) => {
            const diff = c.now - c.prev;
            const pct = c.prev ? Math.round((diff / c.prev) * 100) : 0;
            const good = c.inverse ? diff < 0 : diff > 0;
            return (
              <div key={c.label} className="bg-slate-50 rounded-xl p-3">
                <div className="text-[11px] text-slate-500">{c.label}</div>
                <div className="text-base font-bold text-slate-900 mt-0.5">
                  {c.unit === "₴" ? "₴" + c.now.toLocaleString("ru") : c.now.toLocaleString("ru") + c.unit}
                </div>
                <div className={`text-xs font-semibold mt-0.5 ${good ? "text-emerald-600" : "text-rose-600"}`}>
                  {pct >= 0 ? "+" : ""}{pct}% к прошлому
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ДЕТАЛЬНАЯ СТАТИСТИКА по дням / месяцам */}
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
          <div>
            <h2 className="font-semibold text-slate-900">Статистика</h2>
            <p className="text-xs text-slate-500">{statMode === "days" ? "по дням (червень 2026)" : "по месяцам 2026"}</p>
          </div>
          <div className="flex items-center gap-1.5 bg-slate-100 rounded-lg p-1">
            <button onClick={() => setStatMode("days")}
              className={`px-3 py-1.5 rounded-md text-xs font-semibold transition ${statMode === "days" ? "bg-slate-900 text-white" : "text-slate-500"}`}>
              Дни
            </button>
            <button onClick={() => setStatMode("months")}
              className={`px-3 py-1.5 rounded-md text-xs font-semibold transition ${statMode === "months" ? "bg-slate-900 text-white" : "text-slate-500"}`}>
              Месяцы
            </button>
          </div>
        </div>

        {/* выбор метрики */}
        <div className="flex items-center gap-1.5 mb-4 flex-wrap">
          {METRIC_TABS.map(([k, l]) => (
            <button key={k} onClick={() => setMetric(k)}
              className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition
                ${metric === k ? "border-slate-900 bg-slate-900 text-white" : "border-slate-200 text-slate-500 hover:bg-slate-50"}`}>
              {l}
            </button>
          ))}
        </div>

        {/* мини-итоги */}
        <div className="grid grid-cols-3 gap-3 mb-4">
          <div className="bg-slate-50 rounded-xl p-3">
            <div className="text-[11px] text-slate-500">Всего за период</div>
            <div className="font-bold text-slate-900">{metricMeta.fmt(totalV)}</div>
          </div>
          <div className="bg-slate-50 rounded-xl p-3">
            <div className="text-[11px] text-slate-500">В среднем</div>
            <div className="font-bold text-slate-900">{metricMeta.fmt(avgV)}</div>
          </div>
          <div className="bg-slate-50 rounded-xl p-3">
            <div className="text-[11px] text-slate-500">Максимум</div>
            <div className="font-bold text-slate-900">{metricMeta.fmt(maxV)}</div>
          </div>
        </div>

        {/* график-бары с точными значениями */}
        <div className={`flex items-stretch gap-1 ${statMode === "days" ? "h-40 overflow-x-auto" : "h-44"}`}>
          {series.map((d, i) => (
            <div key={i} className="h-full flex flex-col items-center gap-1.5 group shrink-0"
              style={{ minWidth: statMode === "days" ? 28 : undefined, flex: statMode === "months" ? "1" : undefined }}>
              <span className="text-[10px] font-semibold text-slate-700 opacity-0 group-hover:opacity-100 transition whitespace-nowrap h-3">
                {metricMeta.fmt(d[metric])}
              </span>
              <div className="flex-1 w-full flex items-end">
                <div className="w-full rounded-t-md transition-all hover:opacity-80"
                  style={{ height: `${Math.max((d[metric] / maxV) * 100, 3)}%`, background: metricMeta.color, minHeight: 4 }} />
              </div>
              <span className="text-[9px] text-slate-400 whitespace-nowrap">{d.label}</span>
            </div>
          ))}
        </div>

        {/* точная таблица */}
        <div className="mt-4 overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-[11px] text-slate-400 uppercase tracking-wide border-b border-slate-100">
                <th className="py-2 font-semibold">{statMode === "days" ? "День" : "Месяц"}</th>
                {showMoney && <th className="py-2 font-semibold text-right">Доход</th>}
                <th className="py-2 font-semibold text-right">Подписки</th>
                <th className="py-2 font-semibold text-right">Магазины</th>
              </tr>
            </thead>
            <tbody>
              {[...series].reverse().slice(0, statMode === "days" ? 7 : 12).map((d, i) => (
                <tr key={i} className="border-b border-slate-50 last:border-0">
                  <td className="py-2 font-medium text-slate-700">{d.label}</td>
                  {showMoney && <td className="py-2 text-right text-slate-700">₴{d.rev}k</td>}
                  <td className="py-2 text-right text-slate-700">{d.orders.toLocaleString("ru")}</td>
                  <td className="py-2 text-right text-slate-700">{d.shops}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {statMode === "days" && <p className="text-[11px] text-slate-400 mt-2">Показаны последние 7 дней · всего в графике 30</p>}
        </div>
      </div>

      {/* география */}
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <div className="flex items-center gap-2 mb-1">
          <MapIcon size={16} className="text-slate-400" />
          <h2 className="font-semibold text-slate-900">География</h2>
        </div>
        <p className="text-xs text-slate-500 mb-4">магазины по городам</p>
        <div className="space-y-2.5">
          {GEO.map((g) => {
            const gmax = Math.max(...GEO.map((x) => x.shops));
            return (
              <div key={g.city}>
                <div className="flex justify-between text-sm mb-1">
                  <span className="text-slate-700">{g.city}</span>
                  <span className="text-slate-500">{g.shops}</span>
                </div>
                <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                  <div className="h-full rounded-full" style={{ width: `${(g.shops / gmax) * 100}%`, background: "#2563EB" }} />
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* mini moderation alert */}
      <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex items-center gap-3">
        <div className="w-10 h-10 rounded-xl bg-amber-100 grid place-items-center text-amber-600">
          <AlertTriangle size={20} />
        </div>
        <div className="flex-1">
          <div className="font-semibold text-amber-900 text-sm">{MOD_QUEUE.length} жалобы ждут проверки</div>
          <div className="text-xs text-amber-700">Перейдите в раздел «Модерация», чтобы разобрать очередь</div>
        </div>
      </div>

      {/* топ магазинов по обороту */}
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-900 mb-1">Топ магазинов</h2>
        <p className="text-xs text-slate-500 mb-4">по обороту за месяц</p>
        <div className="space-y-3">
          {TOP_SHOPS.map((s, i) => (
            <div key={s.name}>
              <div className="flex justify-between text-sm mb-1">
                <span className="font-medium text-slate-700">
                  <span className="text-slate-400 mr-1.5">{i + 1}</span>{s.name}
                </span>

              <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div className="h-full rounded-full" style={{ width: `${s.pct}%`, background: "#7C3AED" }} />
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Shops({ role, can, flash }) {
  const [rows, setRows] = useState(SHOPS);
  const [filter, setFilter] = useState("all");
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(null);

  const filtered = useMemo(() => {
    return rows.filter((r) => {
      const okStatus = filter === "all" || r.status === filter;
      const okQ = !q || r.name.toLowerCase().includes(q.toLowerCase()) || r.owner.toLowerCase().includes(q.toLowerCase());
      return okStatus && okQ;
    });
  }, [rows, filter, q]);

  const setStatus = (id, status, msg) => {
    setRows((rs) => rs.map((r) => (r.id === id ? { ...r, status } : r)));
    setSel((cur) => (cur && cur.id === id ? { ...cur, status } : cur));
    flash(msg);
  };

  return (
    <div className="space-y-4 max-w-6xl">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-bold text-slate-900">Магазины</h1>
          <p className="text-sm text-slate-500 mt-0.5">{filtered.length} из {rows.length} магазинов</p>
        </div>
        <button onClick={() => exportCSV("магазины.csv", filtered, [
            { label: "Магазин", key: "name" },
            { label: "Владелец", key: "owner" },
            { label: "Тариф", key: "plan" },
            { label: "Статус", key: "status" },
            ...(role !== "manager" ? [{ label: "Доход", key: "rev" }] : []),
            { label: "Жалобы", key: "flags" },
          ])}
          className="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-50">
          <Download size={14} /> Экспорт
        </button>
      </div>

      {/* поиск + фильтры */}
      <div className="flex items-center gap-2 flex-wrap">
        <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-lg px-3 py-2 flex-1 min-w-[180px]">
          <Search size={16} className="text-slate-400" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Поиск по названию или владельцу…"
            className="bg-transparent text-sm outline-none w-full placeholder:text-slate-400" />
        </div>
        <div className="flex items-center gap-1.5 bg-white border border-slate-200 rounded-lg p-1">
          {[["all", "Все"], ["active", "Активные"], ["review", "Проверка"], ["banned", "Бан"]].map(([k, l]) => (
            <button key={k} onClick={() => setFilter(k)}
              className={`px-3 py-1.5 rounded-md text-xs font-medium transition
                ${filter === k ? "bg-slate-900 text-white" : "text-slate-500 hover:bg-slate-100"}`}>
              {l}
            </button>
          ))}
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-xs text-slate-400 uppercase tracking-wide border-b border-slate-100">
                <th className="px-4 py-3 font-semibold">Магазин</th>
                <th className="px-4 py-3 font-semibold">Тариф</th>
                <th className="px-4 py-3 font-semibold">Статус</th>
                {role !== "manager" && <th className="px-4 py-3 font-semibold">Доход</th>}
                <th className="px-4 py-3 font-semibold">Жалобы</th>
                <th className="px-4 py-3 font-semibold text-right">Действия</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((s) => {
                const sm = statusMeta[s.status];
                return (
                  <tr key={s.id} onClick={() => setSel(s)}
                    className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 cursor-pointer">
                    <td className="px-4 py-3">
                      <div className="font-semibold text-slate-900">{s.name}</div>
                      <div className="text-xs text-slate-400">{s.owner}</div>
                    </td>
                    <td className="px-4 py-3">
                      <span className={`text-xs font-semibold px-2 py-0.5 rounded-full
                        ${s.plan === "Pro" ? "bg-violet-50 text-violet-700" : "bg-slate-100 text-slate-500"}`}>
                        {s.plan}
                      </span>
                    </td>
                    <td className="px-4 py-3">
                      <span className={`inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full ${sm.cls}`}>
                        <sm.Icon size={12} /> {sm.label}
                      </span>
                    </td>
                    {role !== "manager" && <td className="px-4 py-3 text-slate-700">{s.rev}</td>}
                    <td className="px-4 py-3">
                      {s.flags > 0
                        ? <span className="text-rose-600 font-semibold">{s.flags}</span>
                        : <span className="text-slate-300">0</span>}
                    </td>
                    <td className="px-4 py-3" onClick={(e) => e.stopPropagation()}>
                      <div className="flex items-center justify-end gap-1.5">
                        {s.status === "review" && can("approveShop") && (
                          <button onClick={() => setStatus(s.id, "active", `«${s.name}» одобрен`)}
                            className="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100">
                            Одобрить
                          </button>
                        )}
                        {s.status !== "banned" && can("banShop") && (
                          <button onClick={() => setStatus(s.id, "banned", `«${s.name}» заблокирован`)}
                            className="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-700 hover:bg-rose-100">
                            Бан
                          </button>
                        )}
                        {s.status === "banned" && can("banShop") && (
                          <button onClick={() => setStatus(s.id, "active", `«${s.name}» разблокирован`)}
                            className="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200">
                            Снять бан
                          </button>
                        )}
                        <button onClick={() => setSel(s)} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100" title="Открыть карточку">
                          <ChevronRight size={16} />
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {filtered.length === 0 && (
                <tr><td colSpan={6} className="px-4 py-10 text-center text-slate-400 text-sm">Ничего не найдено</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {!can("banShop") && (
        <p className="text-xs text-slate-400 flex items-center gap-1.5">
          <Shield size={13} /> Блокировка магазинов доступна ролям «Админ» и «Владелец».
        </p>
      )}

      {/* карточка магазина */}
      <Drawer open={!!sel} onClose={() => setSel(null)} title="Магазин">
        {sel && (() => {
          const sm = statusMeta[sel.status];
          return (
            <div className="space-y-5">
              <div className="flex items-center gap-3">
                <div className="w-14 h-14 rounded-2xl grid place-items-center text-white text-xl font-black"
                  style={{ background: "linear-gradient(135deg,#7C3AED,#2563EB)" }}>
                  {sel.name[0]}
                </div>
                <div>
                  <div className="text-lg font-bold text-slate-900">{sel.name}</div>
                  <span className={`inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full ${sm.cls}`}>
                    <sm.Icon size={12} /> {sm.label}
                  </span>
                </div>
              </div>

              {/* мини-метрики */}
              <div className={`grid ${role === "manager" ? "grid-cols-2" : "grid-cols-3"} gap-2`}>
                {[
                  ...(role !== "manager" ? [{ l: "Доход", v: sel.rev, Icon: DollarSign }] : []),
                  { l: "Заказы", v: sel.orders, Icon: ShoppingBag },
                  { l: "Товары", v: sel.products, Icon: Package },
                ].map((m) => (
                  <div key={m.l} className="bg-slate-50 rounded-xl p-3 text-center">
                    <m.Icon size={16} className="text-slate-400 mx-auto mb-1" />
                    <div className="font-bold text-slate-900 text-sm">{m.v}</div>
                    <div className="text-[11px] text-slate-500">{m.l}</div>
                  </div>
                ))}
              </div>

              <div className="bg-white rounded-xl">
                <Field icon={UserCog} label="Владелец" value={sel.owner} />
                <Field icon={Mail} label="Email" value={sel.ownerEmail} />
                <Field icon={MapPin} label="Город" value={sel.city} />
                <Field icon={CreditCard} label="Тариф" value={sel.plan} />
                <Field icon={Star} label="Рейтинг" value={sel.rating ? `${sel.rating} ★` : "—"} />
                <Field icon={Calendar} label="Регистрация" value={sel.joined} />
                <Field icon={Flag} label="Жалобы" value={sel.flags} />
              </div>

              <div className="flex flex-col gap-2">
                {sel.status === "review" && can("approveShop") && (
                  <button onClick={() => setStatus(sel.id, "active", `«${sel.name}» одобрен`)}
                    className="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700">
                    Одобрить магазин
                  </button>
                )}
                {sel.status !== "banned" && can("banShop") && (
                  <button onClick={() => setStatus(sel.id, "banned", `«${sel.name}» заблокирован`)}
                    className="w-full py-2.5 rounded-xl bg-rose-50 text-rose-700 text-sm font-semibold hover:bg-rose-100">
                    Заблокировать
                  </button>
                )}
                {sel.status === "banned" && can("banShop") && (
                  <button onClick={() => setStatus(sel.id, "active", `«${sel.name}» разблокирован`)}
                    className="w-full py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold hover:bg-slate-200">
                    Снять блокировку
                  </button>
                )}
                <button onClick={() => flash("Открыта витрина магазина")}
                  className="w-full py-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 text-sm font-semibold hover:bg-slate-50 flex items-center justify-center gap-1.5">
                  <ExternalLink size={15} /> Открыть витрину
                </button>
              </div>
            </div>
          );
        })()}
      </Drawer>
    </div>
  );
}

function UsersView({ role, can, flash }) {

  const [roleF, setRoleF] = useState("all");
  const [sel, setSel] = useState(null);

  const filtered = useMemo(() => rows.filter((r) => {
    const okQ = !q || r.name.toLowerCase().includes(q.toLowerCase()) || r.email.toLowerCase().includes(q.toLowerCase());
    const okRole = roleF === "all" || r.role === roleF;
    return okQ && okRole;
  }), [rows, q, roleF]);

  const remove = (id, name) => {
    setRows((rs) => rs.filter((r) => r.id !== id));
    setSel(null);
    flash(`${name} удалён`);
  };

  const toggleSuspend = (u) => {
    const ns = u.status === "suspended" ? "active" : "suspended";
    setRows((rs) => rs.map((r) => (r.id === u.id ? { ...r, status: ns } : r)));
    setSel((cur) => (cur && cur.id === u.id ? { ...cur, status: ns } : cur));
    flash(ns === "suspended" ? `${u.name} приостановлен` : `${u.name} разблокирован`);
  };

  return (
    <div className="space-y-4 max-w-5xl">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-bold text-slate-900">Юзеры</h1>
          <p className="text-sm text-slate-500 mt-0.5">{filtered.length} из {rows.length} аккаунтов</p>
        </div>
        <button onClick={() => exportCSV("юзеры.csv", filtered, [
            { label: "Имя", key: "name" },
            { label: "Email", key: "email" },
            { label: "Телефон", key: "phone" },
            { label: "Роль", key: "role" },
            { label: "Тариф", key: "plan" },
            { label: "Магазинов", key: "shops" },
            { label: "Статус", key: "status" },
            { label: "Регистрация", key: "joined" },
          ])}
          className="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg bg-white border border-slate-200 text-slate-600 hover:bg-slate-50">
          <Download size={14} /> Экспорт
        </button>
      </div>

      <div className="flex items-center gap-2 flex-wrap">
        <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-lg px-3 py-2 flex-1 min-w-[180px]">
          <Search size={16} className="text-slate-400" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Поиск по имени или email…"

function Moderation({ role, can, flash }) {
  const [queue, setQueue] = useState(MOD_QUEUE);
  const [sel, setSel] = useState(null);
  const [reply, setReply] = useState("");
  const [thread, setThread] = useState([]); // доп. сообщения в открытой жалобе

  const sevMeta = {
    high: { cls: "bg-rose-50 text-rose-700",  label: "Высокий" },
    mid:  { cls: "bg-amber-50 text-amber-700", label: "Средний" },
  };

  const open = (c) => { setSel(c); setThread(c.messages); setReply(""); };

  const resolve = (id, action, shop) => {
    setQueue((q) => q.filter((x) => x.id !== id));
    setSel(null);
    const msg = {
      ban: `«${shop}» отправлен в бан`,
      warn: `«${shop}» вынесено предупреждение`,
      dismiss: `Жалоба по «${shop}» отклонена`,
    }[action];
    flash(msg);
  };

  const sendReply = () => {
    if (!reply.trim()) return;
    setThread((t) => [...t, { from: "support", text: reply.trim(), time: "сейчас" }]);
    setReply("");
    flash("Запрос отправлен продавцу");
  };

  return (
    <div className="space-y-4 max-w-4xl">
      <div>
        <h1 className="text-2xl font-bold text-slate-900">Модерация</h1>
        <p className="text-sm text-slate-500 mt-0.5">Очередь жалоб и спорных ситуаций</p>
      </div>

      {queue.length === 0 ? (
        <div className="bg-white rounded-2xl border border-slate-200 p-10 text-center">
          <CheckCircle2 size={36} className="text-emerald-500 mx-auto mb-3" />
          <div className="font-semibold text-slate-900">Очередь пуста</div>
          <div className="text-sm text-slate-500 mt-1">Все жалобы разобраны. Хорошая работа.</div>
        </div>
      ) : (
        <div className="space-y-3">
          {queue.map((c) => {
            const sv = sevMeta[c.sev];
            return (
              <div key={c.id} onClick={() => open(c)}
                className="bg-white rounded-2xl border border-slate-200 p-4 flex items-start gap-3 cursor-pointer hover:border-slate-300 transition">
                <div className="w-10 h-10 rounded-xl bg-rose-50 grid place-items-center text-rose-500 shrink-0">
                  <Flag size={18} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-semibold text-slate-900">{c.shop}</span>
                    <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${sv.cls}`}>{sv.label}</span>
                  </div>
                  <div className="text-sm text-slate-600 mt-0.5">{c.type}</div>
                  <div className="text-xs text-slate-400 mt-0.5">Источник: {c.reporter} · {c.date}</div>
                </div>
                <ChevronRight size={18} className="text-slate-300 shrink-0 mt-1" />
              </div>
            );
          })}
        </div>
      )}

      {/* окно разбора жалобы */}
      <Drawer open={!!sel} onClose={() => setSel(null)} title={sel ? sel.shop : "Жалоба"}>
        {sel && (() => {
          const sv = sevMeta[sel.sev];
          return (
            <div className="space-y-5">
              {/* шапка */}
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="font-semibold text-slate-900 text-lg">{sel.type}</span>
                  <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${sv.cls}`}>{sv.label}</span>
                </div>
                <div className="text-xs text-slate-400 mt-0.5">{sel.shop} · {sel.owner} · {sel.reporter} · {sel.date}</div>
              </div>

              {/* детали */}
              <div className="bg-slate-50 rounded-xl p-3">
                <div className="text-xs font-semibold text-slate-500 mb-1">Суть жалобы</div>
                <p className="text-sm text-slate-700 leading-snug">{sel.details}</p>
              </div>

              {/* доказательства */}
              <div>
                <div className="text-xs font-semibold text-slate-500 mb-2">Доказательства</div>
                <div className="flex flex-wrap gap-2">
                  {sel.evidence.map((e) => (
                    <div key={e} className="flex items-center gap-1.5 text-xs text-slate-600 bg-white border border-slate-200 rounded-lg px-2.5 py-1.5">
                      <Paperclip size={13} className="text-slate-400" /> {e}
                    </div>
                  ))}
                </div>
              </div>

              {/* история нарушений */}
              <div>
                <div className="text-xs font-semibold text-slate-500 mb-2">История нарушений магазина</div>
                {sel.history.length > 0 ? (
                  <div className="space-y-1.5">
                    {sel.history.map((h, i) => (
                      <div key={i} className="flex items-start gap-2 text-xs">
                        <span className="w-1.5 h-1.5 rounded-full bg-rose-400 mt-1.5 shrink-0" />
                        <span className="text-slate-600"><span className="text-slate-400">{h.date}</span> — {h.text}</span>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p className="text-xs text-slate-400">Нарушений ранее не было — чистая история</p>
                )}

              {/* переписка с продавцом */}
              <div>
                <div className="text-xs font-semibold text-slate-500 mb-2">Переписка с продавцом</div>
                <div className="space-y-2 mb-2">
                  {thread.map((m, i) => (
                    <div key={i} className={`flex ${m.from === "support" ? "justify-end" : "justify-start"}`}>
                      <div className={`max-w-[85%] rounded-2xl px-3 py-2 text-sm
                        ${m.from === "support" ? "bg-slate-900 text-white"
                          : m.from === "system" ? "bg-amber-50 text-amber-800 border border-amber-100"
                          : "bg-slate-100 text-slate-800"}`}>
                        <div className="leading-snug">{m.text}</div>
                        <div className={`text-[10px] mt-1 ${m.from === "support" ? "text-white/50" : "text-slate-400"}`}>
                          {m.from === "support" ? "Модератор" : m.from === "system" ? "Система" : sel.owner} · {m.time}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="flex items-end gap-1.5">
                  <textarea value={reply} onChange={(e) => setReply(e.target.value)}
                    placeholder="Запросить объяснение у продавца…" rows={2}
                    className="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-slate-400 placeholder:text-slate-300 resize-none" />
                  <button onClick={sendReply} disabled={!reply.trim()}
                    className="w-9 h-9 grid place-items-center rounded-lg bg-slate-900 text-white hover:bg-slate-800 disabled:opacity-30 shrink-0">
                    <Send size={16} />
                  </button>
                </div>
              </div>

              {/* решения */}
              <div className="pt-2 border-t border-slate-100">
                <div className="text-xs font-semibold text-slate-500 mb-2">Решение</div>
                <div className="grid grid-cols-1 gap-2">
                  <button onClick={() => resolve(sel.id, "dismiss", sel.shop)}

                  )}

              </div>
            </div>
          );
        })()}
      </Drawer>
    </div>
  );
}

// SALARY — зарплаты сотрудников
// ============================================================
function Salary({ role, can, flash }) {
  const [team, setTeam] = useState(TEAM);
  const [sel, setSel] = useState(null);
  const [period, setPeriod] = useState("Червень 2026");
  // черновик формы начисления (конфиг на месяц)
  const [form, setForm] = useState({ base: "", rate: "", plan: "", bonus90: "", bonus100: "" });

  const MONTHS_UA = ["Січень","Лютий","Березень","Квітень","Травень","Червень",
    "Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  const PERIODS = useMemo(() => {
    const out = []; let mi = 5, yr = 2026;
    for (let i = 0; i < 36; i++) { out.push(`${MONTHS_UA[mi]} ${yr}`); mi++; if (mi > 11) { mi = 0; yr++; } }
    return out;
  }, []);

  const fmt = (n) => "₴" + Number(n || 0).toLocaleString("ru");
  const payroll = team.reduce((s, m) => s + m.salary, 0);
  const pending = team.filter((m) => !m.paid && m.salary > 0).reduce((s, m) => s + m.salary, 0);
  const paidSum = team.filter((m) => m.paid && m.salary > 0).reduce((s, m) => s + m.salary, 0);
  const notAssigned = team.filter((m) => !m.assigned && m.role !== "owner").length;

  // кто кому может начислять: owner — всем; admin — только менеджерам
  const canAssign = (m) => {
    if (role === "owner") return true;
    if (role === "admin") return m.role === "manager";
    return false;
  };

  const update = (id, fn) => {
    setTeam((ts) => ts.map((m) => (m.id === id ? fn(m) : m)));
    setSel((cur) => (cur && cur.id === id ? fn(cur) : cur));
  };

  // открыть карточку и подтянуть текущие параметры
  const openCard = (m) => {
    setSel(m);
    const p = m.pay || {};
    setForm({
      base: p.base || "",
      rate: p.rate || "",
      plan: p.plan || "",
      bonus90: p.bonus90 || "",
      bonus100: p.bonus100 || "",
    });
  };

  // авто-расчёт по конфигу: ставка + %·продажи + бонус по факту плана
  const calc = (m) => {
    const base = Number(form.base) || 0;
    const rate = Number(form.rate) || 0;
    const plan = Number(form.plan) || 0;
    const bonus90 = Number(form.bonus90) || 0;
    const bonus100 = Number(form.bonus100) || 0;
    const sales = m ? (m.subSales || 0) : 0;       // ФАКТ продаж подписок — авто
    const commission = Math.round(sales * rate / 100);
    const progress = plan > 0 ? Math.round((sales / plan) * 100) : 0;
    let bonus = 0, bonusLabel = "—";
    if (plan > 0) {
      if (progress >= 100) { bonus = bonus100; bonusLabel = "100%+"; }
      else if (progress >= 90) { bonus = bonus90; bonusLabel = "90–99%"; }
      else { bonus = 0; bonusLabel = "план не выполнен"; }
    }
    return { base, rate, plan, bonus90, bonus100, sales, commission, progress, bonus, bonusLabel,
      total: base + commission + bonus };
  };

  const assign = (m) => {
    const c = calc(m);
    if (c.total <= 0 && c.base === 0 && c.commission === 0) { flash("Укажите ставку или процент"); return; }
    update(m.id, (x) => ({
      ...x,
      pay: { base: c.base, rate: c.rate, plan: c.plan, bonus90: c.bonus90, bonus100: c.bonus100,
        sales: c.sales, commission: c.commission, bonus: c.bonus, progress: c.progress },
      salary: c.total,
      assigned: true,
      paid: false,
      payDate: "ожидает",
      period,
    }));
    flash(`ЗП ${m.name} начислена за ${period}`);
  };

  const markPaid = (m) => {
    update(m.id, (x) => ({ ...x, paid: true, payDate: new Date().toLocaleDateString("ru-RU") }));
    flash(`ЗП ${m.name} отмечена выплаченной`);
  };

  const payAll = () => {
    setTeam((ts) => ts.map((m) => (m.salary > 0 && !m.paid ? { ...m, paid: true, payDate: new Date().toLocaleDateString("ru-RU") } : m)));
    flash("Все начисленные зарплаты отмечены выплаченными");
  };

  return (
    <div className="space-y-4 max-w-5xl">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-2xl font-bold text-slate-900">Зарплата</h1>
          <p className="text-sm text-slate-500 mt-0.5">Начисления сотрудникам платформы</p>
        </div>
        {can("editBilling") && pending > 0 && (
          <button onClick={payAll}
            className="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg bg-slate-900 text-white hover:bg-slate-800">
            <Wallet size={14} /> Выплатить всем
          </button>
        )}
      </div>

      {/* период */}
      <div className="flex items-center gap-2 flex-wrap">
        <span className="text-xs text-slate-400 flex items-center gap-1.5"><Calendar size={14} /> Период:</span>
        <select value={period} onChange={(e) => setPeriod(e.target.value)}
          className="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium text-slate-700 outline-none focus:border-slate-400">
          {PERIODS.map((p) => <option key={p} value={p}>{p}</option>)}
        </select>
      </div>

      {/* подсказка о незаполненных */}
      {notAssigned > 0 && (
        <div className="bg-violet-50 border border-violet-200 rounded-2xl p-4 flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-violet-100 grid place-items-center text-violet-600 shrink-0"><Wallet size={20} /></div>
          <div className="flex-1">
            <div className="font-semibold text-violet-900 text-sm">ЗП не назначена: {notAssigned}</div>
            <div className="text-xs text-violet-700">Откройте сотрудника и укажите ставку, бонус и процент</div>
          </div>
        </div>
      )}

      {/* сводка */}
      <div className="grid grid-cols-3 gap-3">
        <div className="bg-white rounded-2xl border border-slate-200 p-4">
          <div className="w-9 h-9 rounded-xl bg-slate-100 grid place-items-center text-slate-500 mb-3"><Wallet size={18} /></div>
