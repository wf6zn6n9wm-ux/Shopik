// TASKS — задачи сотрудников
// ============================================================
function Tasks({ role, can, flash }) {
  const [team, setTeam] = useState(TEAM);
  const [sel, setSel] = useState(null);
  const [draft, setDraft] = useState("");

  const allTasks = team.flatMap((m) => m.tasks);
  const openCount = allTasks.filter((t) => !t.done).length;
  const doneCount = allTasks.filter((t) => t.done).length;

  const update = (id, fn) => {
    setTeam((ts) => ts.map((m) => (m.id === id ? fn(m) : m)));
    setSel((cur) => (cur && cur.id === id ? fn(cur) : cur));
  };

  const toggleTask = (mId, tId) =>
    update(mId, (m) => ({ ...m, tasks: m.tasks.map((t) => (t.id === tId ? { ...t, done: !t.done } : t)) }));

  const addTask = (mId) => {
    if (!draft.trim()) return;
    update(mId, (m) => ({ ...m, tasks: [...m.tasks, { id: Date.now(), text: draft.trim(), done: false }] }));
    setDraft("");
    flash("Задача добавлена");
  };

  return (
    <div className="space-y-4 max-w-5xl">
      <div>
        <h1 className="text-2xl font-bold text-slate-900">Задачи</h1>
        <p className="text-sm text-slate-500 mt-0.5">Рабочие задачи сотрудников</p>
      </div>

      {/* сводка */}
      <div className="grid grid-cols-3 gap-3">
        <div className="bg-white rounded-2xl border border-slate-200 p-4">
          <div className="w-9 h-9 rounded-xl bg-violet-50 grid place-items-center text-violet-600 mb-3"><ListTodo size={18} /></div>
          <div className="text-xl font-bold text-slate-900">{openCount}</div>
          <div className="text-xs text-slate-500 mt-0.5">Открытых</div>
        </div>
        <div className="bg-white rounded-2xl border border-slate-200 p-4">
          <div className="w-9 h-9 rounded-xl bg-emerald-50 grid place-items-center text-emerald-600 mb-3"><CheckSquare size={18} /></div>
          <div className="text-xl font-bold text-slate-900">{doneCount}</div>
          <div className="text-xs text-slate-500 mt-0.5">Выполнено</div>
        </div>
        <div className="bg-white rounded-2xl border border-slate-200 p-4">
          <div className="w-9 h-9 rounded-xl bg-slate-100 grid place-items-center text-slate-500 mb-3"><Users size={18} /></div>
          <div className="text-xl font-bold text-slate-900">{team.length}</div>
          <div className="text-xs text-slate-500 mt-0.5">Сотрудников</div>
        </div>
      </div>

      {/* колонки по сотрудникам */}
      <div className="grid sm:grid-cols-2 gap-3">
        {team.map((m) => {
          const done = m.tasks.filter((t) => t.done).length;
          const r = ROLES[m.role];
          return (
            <div key={m.id} className="bg-white rounded-2xl border border-slate-200 p-4">
              <div className="flex items-center gap-2.5 mb-3">
                <div className="w-9 h-9 rounded-full grid place-items-center text-white text-sm font-bold shrink-0"
                  style={{ background: r.color }}>{m.name[0]}</div>
                <div className="min-w-0 flex-1">
                  <div className="font-semibold text-slate-900 truncate">{m.name}</div>
                  <div className="text-xs text-slate-400">{done}/{m.tasks.length} готово</div>
                </div>
                <button onClick={() => setSel(m)}
                  className="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200">
                  Открыть
                </button>
              </div>
              <div className="space-y-1">
                {m.tasks.slice(0, 3).map((t) => (
                  <button key={t.id}
                    onClick={() => can("manageTasks") && toggleTask(m.id, t.id)}
                    className={`w-full flex items-center gap-2 p-2 rounded-lg text-left transition
                      ${can("manageTasks") ? "hover:bg-slate-50" : "cursor-default"}`}>
                    {t.done
                      ? <CheckSquare size={16} className="text-emerald-500 shrink-0" />
                      : <Square size={16} className="text-slate-300 shrink-0" />}
                    <span className={`text-sm truncate ${t.done ? "text-slate-400 line-through" : "text-slate-700"}`}>{t.text}</span>
                  </button>
                ))}
                {m.tasks.length > 3 && (
                  <div className="text-xs text-slate-400 pl-2 pt-1">ещё {m.tasks.length - 3}…</div>
                )}
                {m.tasks.length === 0 && <div className="text-sm text-slate-400 p-2">Задач нет</div>}
              </div>
            </div>
          );
        })}
      </div>

      {!can("manageTasks") && (
        <p className="text-xs text-slate-400 flex items-center gap-1.5">
          <Shield size={13} /> Изменять задачи могут «Менеджер», «Админ» и «Владелец».
        </p>
      )}

      {/* карточка задач сотрудника */}
      <Drawer open={!!sel} onClose={() => { setSel(null); setDraft(""); }} title="Задачи сотрудника">
        {sel && (() => {
          const r = ROLES[sel.role];
          const done = sel.tasks.filter((t) => t.done).length;
          return (
            <div className="space-y-5">
              <div className="flex items-center gap-3">
                <div className="w-14 h-14 rounded-full grid place-items-center text-white text-xl font-bold"
                  style={{ background: r.color }}>{sel.name[0]}</div>
                <div>
                  <div className="text-lg font-bold text-slate-900">{sel.name}</div>
                  <div className="text-sm text-slate-500">{sel.title} · {done}/{sel.tasks.length} готово</div>
                </div>
              </div>

              <div className="space-y-1.5">
                {sel.tasks.map((t) => (
                  <button key={t.id}
                    onClick={() => can("manageTasks") && toggleTask(sel.id, t.id)}
                    className={`w-full flex items-center gap-2.5 p-2.5 rounded-xl text-left transition
                      ${can("manageTasks") ? "hover:bg-slate-50" : "cursor-default"}`}>
                    {t.done
                      ? <CheckSquare size={18} className="text-emerald-500 shrink-0" />
                      : <Square size={18} className="text-slate-300 shrink-0" />}
                    <span className={`text-sm ${t.done ? "text-slate-400 line-through" : "text-slate-700"}`}>{t.text}</span>
                  </button>
                ))}
                {sel.tasks.length === 0 && <div className="text-sm text-slate-400 py-2">Задач пока нет</div>}
              </div>

              {can("manageTasks") && (
                <div className="flex items-center gap-2">
                  <input value={draft} onChange={(e) => setDraft(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && addTask(sel.id)}
                    placeholder="Новая задача…"
                    className="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-slate-400 placeholder:text-slate-400" />
                  <button onClick={() => addTask(sel.id)}
                    className="w-9 h-9 grid place-items-center rounded-lg bg-slate-900 text-white hover:bg-slate-800 shrink-0">
                    <Plus size={18} />
                  </button>
                </div>
              )}
            </div>
          );
        })()}
      </Drawer>
    </div>
  );
}

// SETTINGS (только owner)
// ============================================================
function SettingsView({ role }) {
  const isOwner = role === "owner";
  // локальная матрица прав (владелец может менять)
  const PERMS = [
    ["Одобрять магазины", "approveShop"],
    ["Банить магазины", "banShop"],
    ["Менять цены тарифов", "editBilling"],
    ["Удалять юзеров", "deleteUser"],
    ["Менять роли", "changeRole"],
  ];
  const [matrix, setMatrix] = useState(() => {
    const m = {};
    PERMS.forEach(([, key]) => { m[key] = {}; Object.keys(ROLES).forEach((rk) => { m[key][rk] = CAN[key].includes(rk); }); });
    return m;
  });
  const toggle = (key, rk) => {
    if (!isOwner || rk === "owner") return; // владелец всегда всё может
    setMatrix((m) => ({ ...m, [key]: { ...m[key], [rk]: !m[key][rk] } }));
  };

  // общие настройки платформы
  const [cfg, setCfg] = useState({ name: "ШОПИК", trial: 7, currency: "₴ Гривна", notifyMod: true, notifyExpiring: true, notifyChurn: false });

  return (
    <div className="space-y-5 max-w-3xl">
      <div>
        <h1 className="text-2xl font-bold text-slate-900">Настройки платформы</h1>
        <p className="text-sm text-slate-500 mt-0.5">Общие параметры, команда и доступы</p>
      </div>

      {/* общие настройки */}
      <div className="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
        <h2 className="font-semibold text-slate-900">Общие</h2>
        <div className="grid sm:grid-cols-2 gap-3">
          <label className="block">
            <span className="text-xs text-slate-500">Название платформы</span>
            <input value={cfg.name} onChange={(e) => setCfg({ ...cfg, name: e.target.value })} disabled={!isOwner}
              className="mt-1 w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-slate-400 disabled:opacity-50" />
          </label>
          <label className="block">
            <span className="text-xs text-slate-500">Пробный период (дней)</span>
            <input type="number" value={cfg.trial} onChange={(e) => setCfg({ ...cfg, trial: e.target.value })} disabled={!isOwner}
              className="mt-1 w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-slate-400 disabled:opacity-50" />
          </label>
          <label className="block sm:col-span-2">
            <span className="text-xs text-slate-500">Валюта</span>
            <select value={cfg.currency} onChange={(e) => setCfg({ ...cfg, currency: e.target.value })} disabled={!isOwner}
              className="mt-1 w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-slate-400 disabled:opacity-50">
              <option>₴ Гривна</option><option>$ Доллар</option><option>€ Евро</option>
            </select>
          </label>
        </div>
      </div>

      {/* уведомления платформы */}
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-900 mb-3">Уведомления</h2>
        <div className="space-y-1">
          {[
            ["notifyMod", "Новые жалобы на модерацию"],
            ["notifyExpiring", "Подписки на исходе"],
            ["notifyChurn", "Отток подписок"],
          ].map(([key, label]) => (
            <div key={key} className="flex items-center justify-between py-2.5 border-b border-slate-50 last:border-0">
              <span className="text-sm text-slate-700">{label}</span>
              <button onClick={() => setCfg({ ...cfg, [key]: !cfg[key] })}
                className={`w-11 h-6 rounded-full transition relative ${cfg[key] ? "bg-emerald-500" : "bg-slate-200"}`}>
                <span className={`absolute top-0.5 w-5 h-5 bg-white rounded-full transition-all ${cfg[key] ? "left-5.5" : "left-0.5"}`}
                  style={{ left: cfg[key] ? 22 : 2 }} />
              </button>
            </div>
          ))}
        </div>
      </div>

      {/* команда */}
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-900 mb-4">Команда</h2>
        <div className="space-y-3">
          {[
            { name: "Андрей (вы)", role: "owner" },
            { name: "Максим",      role: "admin" },
            { name: "Светлана",    role: "manager" },
          ].map((m, i) => (
            <div key={i} className="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full grid place-items-center text-white text-sm font-bold"
                  style={{ background: ROLES[m.role].color }}>{m.name[0]}</div>
                <span className="font-medium text-slate-800">{m.name}</span>
              </div>
              <RoleBadge role={m.role} />
            </div>
          ))}
        </div>
      </div>

      {/* матрица прав — переключаемая для владельца */}
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 className="font-semibold text-slate-900 mb-1">Матрица прав</h2>
        <p className="text-xs text-slate-500 mb-3">{isOwner ? "Нажмите на ячейку, чтобы изменить доступ" : "Только владелец может менять права"}</p>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-xs text-slate-400 uppercase">
                <th className="text-left py-2 font-semibold">Действие</th>
                {Object.entries(ROLES).map(([k, r]) => (
                  <th key={k} className="py-2 font-semibold text-center" style={{ color: r.color }}>{r.label}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {PERMS.map(([label, key]) => (
                <tr key={key} className="border-t border-slate-50">
                  <td className="py-2.5 text-slate-700">{label}</td>
                  {Object.keys(ROLES).map((rk) => {
                    const on = matrix[key][rk];
                    const locked = !isOwner || rk === "owner";
                    return (
                      <td key={rk} className="py-2.5 text-center">
                        <button onClick={() => toggle(key, rk)} disabled={locked}
                          className={locked ? "cursor-default" : "cursor-pointer hover:scale-110 transition"}>
                          {on
                            ? <CheckCircle2 size={18} className="text-emerald-500 mx-auto" />
                            : <XCircle size={18} className="text-slate-200 mx-auto" />}
                        </button>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(AdminPanel));
</script>
</body>
</html>
