name: Build

# Сборки Debug и Release для Android и iOS. Платформенные папки материализуются
# в CI через `flutter create` (в репозитории хранится только lib/ и конфиги).
# Запуск: вручную (workflow_dispatch) или по тегу vX.Y.Z.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    name: Android (APK/AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Materialize platform (android)
        run: flutter create . --platforms=android --project-name nova --org com.nova.app
      - name: Brand — иконка и splash (Kavio)
        run: |
          flutter pub global activate flutter_native_splash
          flutter pub global activate flutter_launcher_icons
          flutter pub global run flutter_native_splash:create
          flutter pub global run flutter_launcher_icons
      - name: Build APK (debug)
        run: flutter build apk --debug
      - name: Build AAB (release)
        run: flutter build appbundle --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            nova/build/app/outputs/flutter-apk/app-debug.apk
            nova/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

  ios:
    name: iOS (no codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: nova
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Materialize platform (ios)
        run: flutter create . --platforms=ios --project-name nova --org com.nova.app
      - name: Brand — иконка и splash (Kavio)
        run: |
          flutter pub global activate flutter_native_splash
          flutter pub global activate flutter_launcher_icons
          flutter pub global run flutter_native_splash:create
          flutter pub global run flutter_launcher_icons
      # Release-подпись подключается через Fastlane match + секреты (см. ios/fastlane).
      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign
