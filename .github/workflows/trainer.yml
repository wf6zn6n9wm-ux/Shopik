name: PRO Trainer

# Приложение — один index.html без сборки, поэтому «зелёный билд» здесь
# означает ровно одно: проверки прогнались. Гоняем их на каждое изменение
# внутри trainer/, чтобы правка не уехала в прод молча.

on:
  push:
    paths: ['trainer/**', '.github/workflows/trainer.yml']
  pull_request:
    paths: ['trainer/**', '.github/workflows/trainer.yml']
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # smoke.js транспилирует JSX из index.html — этим занимается bun.
      # Ставим напрямую, чтобы не зависеть от сторонних actions.
      - name: bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Приложение
        run: node trainer/tests/smoke.js

      - name: Сервер подписок
        run: node trainer/tests/licence.js

      - name: Одни и те же числа в разных файлах
        run: node trainer/tests/consistency.js

      # Документы живут в index.html, а страницы для магазинов
      # генерируются из них. Если кто-то поправил одно и забыл другое —
      # это видно здесь, а не в консоли App Store.
      # Скриншоты для магазинов рисуются из этого же кода. Если экран
      # перестал собираться, лучше узнать здесь, а не при подготовке
      # релиза, когда картинки нужны срочно.
      - name: Экраны для магазинов рисуются
        run: node trainer/store/prerender.js uk

      - name: Документы и публичные страницы не разошлись
        run: |
          node trainer/legal/sync.js export
          git diff --exit-code -- trainer/legal trainer/terms.html trainer/privacy.html trainer/delete.html \
            || { echo '::error::terms/privacy/delete не пересобраны — запустите node trainer/legal/sync.js export'; exit 1; }

  # Vercel сам продакшн из main не пересобирает. Deploy Hook принимает
  # задание и возвращает job id, но деплой так и не появляется — ни
  # успешный, ни отменённый. Связь с гитом при этом подключена, лимиты не
  # упёрты, Ignored Build Step на Automatic.
  #
  # Поэтому не просим Vercel забрать код, а заливаем сами: CLI не зависит
  # от связи с репозиторием и пишет логи сюда, где их видно.
  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Заливаем корень репозитория, а не папку trainer: Root Directory в
    # проекте уже указывает на trainer, и если зайти туда самим, Vercel
    # ищет trainer/trainer и падает.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Выложить на Vercel
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: wf6zn6n9wm-uxs-projects
          PROJECT: pro-trainer
        # pipefail обязателен: без него `| tee` съедает код возврата, и
        # шаг рапортует об успехе, когда сборка на самом деле упала.
        run: |
          set -o pipefail
          if [ -z "$TOKEN" ]; then
            echo '::warning::VERCEL_TOKEN не задан — выкладывать придётся руками'
            exit 0
          fi
          npx --yes vercel@latest link --yes --token "$TOKEN" --scope "$SCOPE" --project "$PROJECT"
          npx --yes vercel@latest deploy --prod --yes --token "$TOKEN" --scope "$SCOPE" | tee /tmp/out
          echo "Выложено: $(tail -n1 /tmp/out)"
