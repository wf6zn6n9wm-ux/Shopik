name: PRO Trainer

# Приложение — один index.html без сборки, поэтому «зелёный билд» здесь
# означает ровно одно: проверки прогнались. Гоняем их на каждое изменение
# внутри trainer/, чтобы правка не уехала в прод молча.

on:
  push:
    paths: ['trainer/**', '.github/workflows/trainer.yml']
  pull_request:
    paths: ['trainer/**', '.github/workflows/trainer.yml']
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # smoke.js транспилирует JSX из index.html — этим занимается bun.
      # Ставим напрямую, чтобы не зависеть от сторонних actions.
      - name: bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Приложение
        run: node trainer/tests/smoke.js

      - name: Сервер подписок
        run: node trainer/tests/licence.js

      - name: Одни и те же числа в разных файлах
        run: node trainer/tests/consistency.js

      # Страницы оплаты — обычный HTML с обычным JS, и трогают деньги.
      # Гоняем их в настоящем браузере: клики, переходы, параметры запроса.
      - name: Страницы оплаты в браузере
        run: node trainer/tests/browser.js

      # Скриншоты для магазинов рисуются из этого же кода. Если экран
      # перестал собираться, лучше узнать здесь, а не при подготовке
      # релиза, когда картинки нужны срочно.
      - name: Экраны для магазинов рисуются
        run: node trainer/store/prerender.js uk

      # Документы живут в index.html, а страницы для магазинов
      # генерируются из них. Если кто-то поправил одно и забыл другое —
      # это видно здесь, а не в консоли App Store.
      - name: Документы и публичные страницы не разошлись
        run: |
          node trainer/legal/sync.js export
          git diff --exit-code -- trainer/legal trainer/terms.html trainer/privacy.html trainer/delete.html \
            || { echo '::error::terms/privacy/delete не пересобраны — запустите node trainer/legal/sync.js export'; exit 1; }

  # Vercel сам продакшн из main не пересобирает. Deploy Hook принимает
  # задание и возвращает job id, но деплой так и не появляется — ни
  # успешный, ни отменённый. Связь с гитом при этом подключена, лимиты не
  # упёрты, Ignored Build Step на Automatic.
  #
  # Поэтому не просим Vercel забрать код, а заливаем сами: CLI не зависит
  # от связи с репозиторием и пишет логи сюда, где их видно.
  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Право двигать метку «вот это на сайте»
    permissions:
      contents: write
    # Несколько коммитов подряд — это одна выкладка, а не три. Отменяем
    # начатые: на сайт всё равно уедет последняя, а лимит они съедают все.
    concurrency:
      group: deploy-prod
      cancel-in-progress: true
    # Заливаем корень репозитория, а не папку trainer: Root Directory в
    # проекте уже указывает на trainer, и если зайти туда самим, Vercel
    # ищет trainer/trainer и падает.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужен предыдущий коммит, чтобы сравнить

      # Тесты, скриншоты для магазинов и нативная оболочка на сайт не
      # уезжают. Правка в них — не повод тратить выкладку: на бесплатном
      # тарифе их 100 в сутки, и однажды мы упёрлись в лимит именно так.
      # Сравниваем с тем, что реально лежит на сайте, а не с предыдущим
      # пушем. Разница не теоретическая: пара коммитов подряд упала на
      # тестах и не выложилась, следующий пуш тронул только тесты — и
      # выкладка решила, что менять нечего. Правки провисели в main
      # невыложенными, а по логам всё было зелёное.
      #
      # Метку двигает сам шаг выкладки, и только после успеха.
      - name: Проверить, менялось ли то, что уезжает на сайт
        id: what
        run: |
          set -o pipefail
          BEFORE=$(git rev-parse -q --verify refs/tags/deployed^{commit} || true)
          # Метки нет (первый раз) или она не из этой истории — сравнивать
          # не с чем, выкладываем от греха.
          if [ -z "$BEFORE" ]; then
            echo "метки выложенного нет — выкладываем"
            echo "site=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "на сайте сейчас: $BEFORE"
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- trainer \
            ':(exclude)trainer/tests/**' \
            ':(exclude)trainer/store/**' \
            ':(exclude)trainer/native/**' \
            ':(exclude)trainer/README.md')
          if [ -n "$changed" ]; then
            echo "меняется сайт:"; echo "$changed"
            echo "site=yes" >> "$GITHUB_OUTPUT"
          else
            echo "правки не доходят до сайта — выкладка не нужна"
            echo "site=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.what.outputs.site == 'yes'
        with:
          node-version: '22'

      - name: bun
        if: steps.what.outputs.site == 'yes'
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # На сайт уезжает скомпилированная версия: Babel в браузере больше
      # не нужен — минус 2,7 МБ и минус самая частая причина белого экрана.
      # index.html в репозитории остаётся с JSX: его удобно открыть и
      # править без сборки.
      - name: Скомпилировать JSX
        if: steps.what.outputs.site == 'yes'
        run: node trainer/build.js --in-place

      - name: Выложить на Vercel
        if: steps.what.outputs.site == 'yes'
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SCOPE: wf6zn6n9wm-uxs-projects
          PROJECT: pro-trainer
        # pipefail обязателен: без него `| tee` съедает код возврата, и
        # шаг рапортует об успехе, когда сборка на самом деле упала.
        run: |
          set -o pipefail
          if [ -z "$TOKEN" ]; then
            echo '::warning::VERCEL_TOKEN не задан — выкладывать придётся руками'
            exit 0
          fi
          npx --yes vercel@latest link --yes --token "$TOKEN" --scope "$SCOPE" --project "$PROJECT"
          npx --yes vercel@latest deploy --prod --yes --token "$TOKEN" --scope "$SCOPE" | tee /tmp/out
          echo "Выложено: $(tail -n1 /tmp/out)"

      # Метка «вот это на сайте». Двигаем только после удачной выкладки —
      # иначе следующий запуск решит, что упавшее уже выложено.
      - name: Отметить выложенное
        if: steps.what.outputs.site == 'yes' && success()
        run: |
          git tag -f deployed "$GITHUB_SHA"
          git push -f origin refs/tags/deployed
