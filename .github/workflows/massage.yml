name: PRO MASSAGE

# Приложение — один index.html без сборки, поэтому «зелёный билд» здесь
# означает ровно одно: проверки прогнались. Гоняем их на каждое изменение
# внутри massage/, чтобы правка не уехала молча.

on:
  push:
    paths: ['massage/**', '.github/workflows/massage.yml']
  pull_request:
    paths: ['massage/**', '.github/workflows/massage.yml']
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # smoke.js транспилирует JSX из index.html — этим занимается bun.
      # Ставим напрямую, чтобы не зависеть от сторонних actions.
      - name: bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Кабинет массажиста
        run: node massage/tests/smoke.js
