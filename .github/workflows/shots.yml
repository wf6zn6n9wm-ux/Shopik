name: Screens (pixel-perfect check)

# Рендерить реальний Flutter-web застосунок у CI (де є інтернет для CanvasKit
# та шрифтів), робить знімки екранів у телефонному вьюпорті й публікує їх в
# гілку `screens`, звідки їх забирає розробка через git (єдиний надійний канал).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Materialize platform (web)
        run: flutter create . --platforms=web --project-name nova --org com.nova.app
      - name: Drift web assets
        run: |
          SQLITE_VER=$(awk '/^  sqlite3:/{f=1} f&&/version:/{gsub(/[",]/,"",$2);print $2;exit}' pubspec.lock)
          DRIFT_VER=$(awk '/^  drift:/{f=1} f&&/version:/{gsub(/[",]/,"",$2);print $2;exit}' pubspec.lock)
          curl -fL -o web/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-$SQLITE_VER/sqlite3.wasm"
          curl -fL -o web/drift_worker.js "https://github.com/simolus3/drift/releases/download/drift-$DRIFT_VER/drift_worker.js"
      - name: Build web (root base-href для локального сервера)
        run: flutter build web --release --base-href /
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright
        run: |
          npm init -y
          npm i -D playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Serve + shoot
        run: |
          python3 -m http.server 8080 --directory build/web &
          sleep 3
          node tools/shoot.mjs
          ls -la shots
      - name: Publish shots to `screens` branch
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "ci-shots"
          git config user.email "ci@local"
          SHA=$(git rev-parse --short HEAD)
          rm -rf /tmp/shots && mkdir -p /tmp/shots
          cp nova/shots/*.png /tmp/shots/ 2>/dev/null || true
          git checkout --orphan screens
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf $(ls -A | grep -v '^\.git$') 2>/dev/null || true
          cp /tmp/shots/*.png . 2>/dev/null || true
          echo "screens for $SHA" > README.md
          git add -A
          git commit -m "screens for $SHA"
          git push -f origin screens
