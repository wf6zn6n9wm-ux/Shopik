name: Кто уже зарегистрировался

# Кнопка «сколько у нас тренеров». Раньше на этот вопрос не было ответа
# иначе как руками в панели хранилища.
#
# Показывает числа: всего кабинетов, сколько на пробном, у скольких есть
# копия базы (то есть приложением реально пользуются), сколько оплатили и
# сколько подписок выдано вручную.
#
# Галочка «список» дополнительно выводит почты. Это персональные данные
# тренеров — журнал запуска виден всем, у кого есть доступ к репозиторию,
# а он публичный. Поэтому по умолчанию галочка снята.
#
# Нужен секрет CRON_SECRET — тот же, что у писем и выдачи подписки.

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Показать список почт (репозиторий публичный — журнал увидят все)'
        required: false
        type: boolean
        default: false

jobs:
  who:
    runs-on: ubuntu-latest
    steps:
      - name: Посчитать
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
          FULL: ${{ inputs.full }}
        run: |
          set -o pipefail
          if [ -z "$SECRET" ]; then
            echo '::error::CRON_SECRET не задан в секретах репозитория'
            exit 1
          fi
          url=https://pro-trainer.pro/api/who
          if [ "$FULL" = "true" ]; then url="$url?full=1"; fi
          code=$(curl -sS -o /tmp/out -w '%{http_code}' \
            -H "authorization: Bearer $SECRET" "$url")
          echo "Ответ сервера: $code"
          cat /tmp/out; echo
          case "$code" in
            200)
              # Хранилище может оказаться памятью процесса — тогда число
              # близко к нулю не потому, что тренеров нет, а потому что
              # записи не переживают запуск функции.
              if grep -q '"storage":"memory"' /tmp/out; then
                echo '::warning::Хранилище — память процесса, а не KV. Число ничего не значит: проверьте /api/health'
              fi
              ;;
            401) echo '::error::Секрет не совпал: CRON_SECRET в Vercel и в GitHub должны быть одинаковыми'; exit 1 ;;
            503) echo '::error::Хранилище не подключено — считать негде'; exit 1 ;;
            *)   echo "::error::Неожиданный ответ $code"; exit 1 ;;
          esac
