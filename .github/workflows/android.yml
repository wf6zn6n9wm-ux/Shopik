name: Android

# Сборка нативной оболочки под Android. Запускается вручную: она долгая
# и нужна только к выпуску, а не на каждый коммит.
#
# Что получится в артефактах:
#   protrainer-aab   — .aab для загрузки в Google Play (подписан, если задан ключ)
#   protrainer-apk   — .apk, который можно поставить на телефон и потрогать руками
#
# Подпись. Google Play принимает только подписанный .aab. Ключ загрузки
# кладётся в секреты репозитория:
#   ANDROID_KEYSTORE          файл .jks в base64
#   ANDROID_KEYSTORE_PASSWORD пароль хранилища
#   ANDROID_KEY_ALIAS         имя ключа
#   ANDROID_KEY_PASSWORD      пароль ключа
# Без них сборка всё равно пройдёт, но .aab будет неподписанным — залить
# его в консоль не выйдет, зато видно, что проект собирается.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для магазина, например 1.0.0'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trainer/native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Зависимости
        run: npm install

      # www/ собирается из trainer/index.html и получает мост к магазину
      - name: Собрать веб-часть
        run: npm run sync:web

      - name: Создать проект Android
        run: npx cap add android

      - name: Перенести веб-часть в проект
        run: npx cap sync android

      # Google Play не принимает второй раз тот же versionCode, а Capacitor
      # ставит единицу всем сборкам. Берём номер запуска — он всегда растёт.
      - name: Проставить версию
        env:
          NAME: ${{ inputs.version }}
        run: |
          f=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" "$f"
          sed -i "s/versionName \"1.0\"/versionName \"${NAME}\"/" "$f"
          grep -nE 'versionCode|versionName' "$f"

      # Ключ подписи существует только внутри этого запуска.
      # Проверяем его наличие внутри шага, а не в if: контекст secrets
      # в условиях шагов недоступен.
      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "ключа нет"
            exit 0
          fi
          # Переносы строк в base64 ничего не значат, но откуда они пришли —
          # заранее не известно: base64 на macOS умеет переносить строки,
          # а буфер обмена — добавлять пробелы. Убираем всё лишнее сами.
          clean=$(printf '%s' "$KEYSTORE" | tr -d '[:space:]')
          # Длина и остаток от деления на 4 — единственное, что можно
          # напечатать безопасно. Остаток не ноль означает ровно одно:
          # секрет скопирован не целиком.
          echo "секрет: ${#clean} символов, остаток от деления на 4 — $(( ${#clean} % 4 ))"
          if ! printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/upload.jks"; then
            echo '::error::ANDROID_KEYSTORE не раскодировался. Скорее всего в секрет попала не вся строка — скопируйте её заново целиком'
            exit 1
          fi
          echo "ключ на месте, $(stat -c%s "$RUNNER_TEMP/upload.jks") байт"

      - name: Сборка
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          # Массив, а не строка: в пароле может быть пробел, и без кавычек
          # он развалился бы на два аргумента — Gradle принял бы второй за
          # имя задачи и упал с «Task ... not found».
          args=(--no-daemon bundleRelease assembleDebug)
          if [ -f "$RUNNER_TEMP/upload.jks" ]; then
            echo "Подписываем ключом из секретов"
            args+=(-Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks"
                   -Pandroid.injected.signing.store.password="$STORE_PASSWORD"
                   -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
                   -Pandroid.injected.signing.key.password="$KEY_PASSWORD")
          else
            echo "::warning::Ключ подписи не задан — .aab выйдет неподписанным, в Google Play его не примут"
          fi
          ./gradlew "${args[@]}"

      - name: Что собралось
        run: find android/app/build/outputs -name '*.aab' -o -name '*.apk' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: protrainer-aab
          path: trainer/native/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: protrainer-apk
          path: trainer/native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
