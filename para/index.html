<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>PARA — для двоих</title>

<!-- PWA / iOS home-screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PARA" />
<meta name="theme-color" content="#17121b" />

<!-- Telegram SDK (необязателен; если не загрузится — приложение всё равно работает) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root{
    --bg:#17121b; --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.03);
    --line:rgba(255,255,255,.10); --muted:rgba(255,255,255,.45); --muted2:rgba(255,255,255,.30);
    --rose:#ff5e8a; --fuchsia:#c026d3; --amber:#fbbf24;
    --grad:linear-gradient(135deg,#ff5e8a,#c026d3);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  html,body{background:var(--bg);color:#fff;min-height:100%;}
  body{overscroll-behavior-y:none;}
  ::-webkit-scrollbar{display:none;}
  button{cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
  input,textarea{font-size:16px;color:#fff;outline:none;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top);}

  /* utils */
  .wrap{padding:12px 16px 110px;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .center{justify-content:center;}
  .gap2{gap:8px;} .gap3{gap:12px;} .gap4{gap:16px;}
  .col{display:flex;flex-direction:column;}
  .flex1{flex:1;}
  .mt2{margin-top:8px;} .mt3{margin-top:12px;} .mt4{margin-top:16px;} .mt6{margin-top:24px;}
  .mb2{margin-top:0;margin-bottom:8px;} .mb3{margin-bottom:12px;} .mb4{margin-bottom:16px;}
  .muted{color:var(--muted);} .muted2{color:var(--muted2);}
  .small{font-size:12px;} .xs{font-size:11px;} .tiny{font-size:10px;}
  .b{font-weight:700;} .sb{font-weight:600;}
  .center-t{text-align:center;}
  .amber{color:var(--amber);} .rose{color:var(--rose);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:24px;
    backdrop-filter:blur(8px);}
  .p4{padding:16px;} .p5{padding:20px;} .p6{padding:24px;}

  .btn{border-radius:18px;padding:14px;font-weight:600;width:100%;transition:transform .1s,opacity .2s;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{transform:scale(.99);}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(192,38,211,.25);}
  .btn-ghost{background:var(--card2);border:1px solid var(--line);}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .btn-sm{width:auto;padding:8px 16px;font-size:13px;border-radius:14px;}

  .input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:18px;
    padding:14px 16px;transition:border-color .2s;}
  .input:focus{border-color:rgba(255,94,138,.6);}
  .input::placeholder{color:var(--muted2);}
  textarea.input{resize:none;}

  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.08em;padding:5px 10px;border-radius:999px;}

  /* countdown */
  .count{position:relative;overflow:hidden;border-radius:24px;padding:20px;
    background:linear-gradient(135deg,#3a1c3f 0%,#57223f 55%,#7a2a3a 100%);}
  .count .cake{position:absolute;right:-16px;top:-24px;font-size:120px;opacity:.15;}
  /* динамическая карточка события */
  .evc{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.30);animation:win .4s ease both;}
  .evc::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(135% 100% at 112% -12%,rgba(192,38,211,.22),transparent 50%),
              radial-gradient(90% 90% at -12% 118%,rgba(255,94,138,.10),transparent 52%);}
  .evc>*{position:relative;}
  .evc-illu{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:56px;
    filter:drop-shadow(0 6px 22px rgba(255,94,138,.5));pointer-events:none;}
  .evc.glow .evc-illu{animation:evpulse 2.4s ease-in-out infinite;}
  .evc-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.06);margin-bottom:12px;}
  .evc-title{font-size:20px;font-weight:800;line-height:1.2;max-width:68%;}
  .evc-when{font-size:14px;color:var(--muted);margin-top:9px;}
  .evc-when b{font-weight:800;font-size:16px;color:#fff;}
  .evc-tip{font-size:12.5px;color:var(--muted);margin-top:8px;max-width:74%;line-height:1.35;}
  .evc-cta{margin-top:16px;display:inline-flex;align-items:center;gap:7px;background:var(--grad);color:#fff;
    font-weight:700;font-size:13.5px;border-radius:16px;padding:11px 17px;
    box-shadow:0 8px 20px rgba(192,38,211,.30);transition:transform .12s;}
  .evc-cta:active{transform:scale(.96);}
  @keyframes evpulse{0%,100%{transform:translateY(-50%) scale(1);}50%{transform:translateY(-50%) scale(1.07);}}
  /* ✨ Для вас сегодня */
  .fy-head{font-size:15px;font-weight:800;margin:2px 0 12px;}
  .fy{display:flex;gap:14px;align-items:center;border-radius:26px;padding:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
    border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.24);}
  .fy-illu{flex:0 0 92px;height:92px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:46px;
    background:radial-gradient(circle at 50% 35%,rgba(255,94,138,.20),rgba(192,38,211,.07));}
  .fy-body{flex:1;min-width:0;}
  .fy-title{font-size:16px;font-weight:800;line-height:1.22;}
  .fy-desc{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .fy-pts{font-size:12.5px;font-weight:800;color:#fcd34d;margin-top:9px;}
  .fy-btn{margin-top:11px;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;color:#fff;
    background:var(--grad);border-radius:13px;padding:10px 16px;box-shadow:0 8px 20px rgba(192,38,211,.35);transition:transform .12s;}
  .fy-btn:active{transform:scale(.96);}
  .fy-done{border-radius:26px;padding:30px 20px;text-align:center;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
    border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.20);}
  .rec-illu{width:150px;height:150px;margin:22px auto 0;border-radius:42px;display:flex;align-items:center;justify-content:center;font-size:74px;
    background:radial-gradient(circle at 50% 34%,rgba(255,94,138,.26),rgba(192,38,211,.08));
    box-shadow:inset 0 0 52px rgba(255,94,138,.16),0 16px 42px rgba(192,38,211,.22);animation:eIll .5s cubic-bezier(.2,.8,.2,1) both;}
  /* Экран «Даты» */
  .dt-hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px;margin-bottom:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.30);animation:win .4s ease both;}
  .dt-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(135% 100% at 112% -12%,rgba(192,38,211,.22),transparent 50%),
              radial-gradient(90% 90% at -12% 118%,rgba(255,94,138,.10),transparent 52%);}
  .dt-hero>*{position:relative;}
  .dt-hero-emoji{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:56px;
    filter:drop-shadow(0 6px 22px rgba(255,94,138,.5));pointer-events:none;}
  .dt-hero-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.06);margin-bottom:12px;}
  .dt-hero-title{font-size:20px;font-weight:800;line-height:1.2;max-width:68%;}
  .dt-hero-days{font-size:14px;color:var(--muted);margin-top:9px;}
  .dt-hero-days b{font-weight:800;font-size:16px;}
  .dt-hero-tip{font-size:12.5px;color:var(--muted);margin-top:8px;max-width:74%;line-height:1.35;}
  .dt-recs{margin-top:9px;display:flex;flex-direction:column;gap:5px;max-width:74%;}
  .dt-rec{font-size:12.5px;color:var(--muted);}
  .dt-hero-btn{margin-top:16px;display:inline-flex;align-items:center;gap:7px;background:var(--grad);color:#fff;
    font-weight:700;font-size:13.5px;border-radius:16px;padding:11px 17px;
    box-shadow:0 8px 20px rgba(192,38,211,.30);transition:transform .12s;}
  .dt-hero-btn:active{transform:scale(.96);}
  .dt-row{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:20px;
    padding:18px 16px;margin-bottom:10px;border:1px solid var(--line);cursor:pointer;transition:transform .1s,background .15s;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));}
  .dt-row:active{transform:scale(.985);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));}
  .dt-row .acc{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 4px 4px 0;}
  .dt-ic{flex:0 0 auto;font-size:30px;margin-left:4px;}
  .dt-row .info{flex:1;min-width:0;}
  .dt-row .nm{font-size:15px;font-weight:700;line-height:1.2;}
  .dt-row .wh{font-size:13px;color:var(--muted);margin-top:3px;}
  .dt-chev{color:var(--muted2);font-size:22px;font-weight:300;flex:0 0 auto;}
  .dt-addcard{display:flex;align-items:center;gap:13px;border-radius:20px;padding:16px;margin-top:6px;
    border:1px dashed var(--line);background:rgba(255,255,255,.02);}
  .dt-addic{width:44px;height:44px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:rgba(192,38,211,.14);}
  .dt-addbtn{flex:0 0 auto;font-size:13px;font-weight:700;color:#fff;background:var(--grad);
    border-radius:12px;padding:9px 15px;box-shadow:0 6px 16px rgba(192,38,211,.28);}
  /* редактор конфига во встроенной админке */
  .admtab{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--muted);
    border-radius:12px;padding:11px;font-size:13px;font-weight:700;transition:all .18s;}
  .admtab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(255,94,138,.3);}
  .cfgcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;}
  .cfggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .cfgfld{display:flex;flex-direction:column;gap:3px;}
  .cfglbl{font-size:10px;color:var(--muted);font-weight:600;}
  .cfgin{background:rgba(0,0,0,.24);border:1px solid var(--line);color:#fff;border-radius:9px;
    padding:8px 10px;font-size:13px;width:100%;font-family:inherit;}
  .cfgin:focus{outline:none;border-color:var(--rose);}
  textarea.cfgin{resize:vertical;min-height:46px;line-height:1.35;}
  .cfgchk{display:flex;align-items:center;gap:7px;font-size:12px;color:#fff;}
  .cfgchk input{width:17px;height:17px;accent-color:var(--rose);}
  .cfgdel{border:1px solid rgba(248,113,113,.3);background:rgba(248,113,113,.08);color:#fca5a5;
    border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;}
  .cfgadd{width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);
    border-radius:12px;padding:10px;font-size:13px;font-weight:700;}
  /* ===== премиальный дашборд админки ===== */
  .adm-sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px;}
  .adm-sec-h .t{font-size:15px;font-weight:800;letter-spacing:-.01em;}
  .adm-sec-h .d{font-size:12.5px;color:var(--muted);font-weight:600;}
  .adm-hero{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .adm-kpi{position:relative;overflow:hidden;border-radius:18px;padding:15px 15px 14px;
    background:linear-gradient(160deg,rgba(255,94,138,.12),rgba(192,38,211,.05) 70%,rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 26px rgba(0,0,0,.22);transition:transform .12s;}
  .adm-kpi[data-act]:active{transform:scale(.98);}
  .adm-kpi .ic{font-size:15px;}
  .adm-kpi .lbl{font-size:11.5px;color:var(--muted);margin-top:7px;}
  .adm-kpi .val{font-size:28px;font-weight:800;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .adm-delta{display:inline-block;font-size:11px;font-weight:800;margin-top:8px;}
  .adm-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;}
  .adm-toggle{display:inline-flex;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;}
  .adm-toggle button{font-size:12px;font-weight:700;color:var(--muted);padding:6px 11px;border-radius:8px;transition:all .18s;}
  .adm-toggle button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(255,94,138,.3);}
  .adm-chart-wrap{position:relative;margin-top:8px;}
  .adm-badge{position:absolute;top:0;right:0;background:rgba(0,0,0,.4);border:1px solid var(--line);
    color:#fff;font-size:12px;font-weight:800;padding:5px 10px;border-radius:10px;z-index:2;}
  .adm-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted2);margin-top:6px;padding:0 2px;}
  .adm-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .adm-mini{border-radius:16px;padding:12px;background:var(--card);border:1px solid var(--line);transition:transform .12s;}
  .adm-mini[data-act]:active{transform:scale(.97);}
  .adm-mini .lbl{font-size:10.5px;color:var(--muted);}
  .adm-mini .val{font-size:21px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .adm-mini .adm-delta{margin-top:5px;font-size:10.5px;}
  .adm-link-num{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .adm-bar{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px;}
  .adm-bar>div{height:100%;border-radius:999px;background:var(--grad);
    box-shadow:0 0 20px rgba(255,94,138,.55);transition:width .8s cubic-bezier(.2,.8,.2,1);}
  .adm-cta{width:100%;margin-top:16px;border-radius:16px;padding:16px;font-weight:800;font-size:15px;color:#fff;
    background:var(--grad);display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 14px 30px rgba(192,38,211,.42),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .14s;}
  .adm-cta:active{transform:scale(.98);}
  .adm-pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);}
  .adm-pill.on{background:rgba(52,211,153,.16);color:#34d399;}
  .adm-foot{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:14px;
    border-top:1px solid var(--line);font-size:12px;color:var(--muted);}
  .adm-refresh{font-size:12px;font-weight:700;color:#ff8fb0;padding:6px 10px;border-radius:9px;background:rgba(255,94,138,.08);}
  /* раздел «Пользователи» */
  .adm-kpi-lbl{font-size:12px;color:var(--muted);}
  .adm-big{font-size:40px;font-weight:800;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .src-row{margin-bottom:13px;}
  .src-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:7px;}
  .src-bar>div{height:100%;border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1);}
  .urow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .urow:last-child{border-bottom:none;}
  .uav{width:42px;height:42px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:rgba(255,255,255,.06);}
  .uav-l{display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;background:var(--grad);}
  .urow-nm{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .udot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;display:inline-block;}
  .uchip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(52,211,153,.15);color:#34d399;}
  .uchip.wait{background:rgba(255,255,255,.06);color:var(--muted);}
  .urow-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .urow-seen{font-size:11px;color:var(--muted2);flex:0 0 auto;white-space:nowrap;}
  .urow-seen.on{color:#34d399;font-weight:700;}
  .pcode{color:var(--rose);font-weight:800;letter-spacing:.08em;font-size:14px;}
  .uchip-f{font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;}
  .uchip-f.on{background:var(--grad);color:#fff;border-color:transparent;}
  /* аналитика: кнопка календаря, кликабельные точки, показатели за период */
  .adm-cal-btn{width:38px;height:32px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:16px;cursor:pointer;line-height:1;}
  .adm-cal-btn.on{background:var(--grad);border-color:transparent;}
  .adm-range-chip{display:inline-flex;align-items:center;gap:8px;margin:2px 0 8px;padding:5px 8px 5px 12px;border-radius:999px;background:rgba(255,94,138,.14);color:#ff8fb0;font-size:12.5px;font-weight:700;}
  .adm-range-chip button{border:none;background:rgba(255,255,255,.12);color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;cursor:pointer;line-height:1;}
  .adm-dot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#ff5e8a;box-shadow:0 0 0 2px rgba(11,7,16,.9);pointer-events:none;opacity:.55;transition:.15s;}
  .adm-dot.on{opacity:1;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;box-shadow:0 0 0 3px rgba(11,7,16,.95),0 0 14px #ff5e8a;}
  .adm-hit{position:absolute;top:0;height:150px;background:transparent;border:none;padding:0;cursor:pointer;}
  .adm-guide{position:absolute;top:6px;bottom:22px;width:1.5px;margin-left:-.75px;background:linear-gradient(#ff5e8a,rgba(255,94,138,0));pointer-events:none;}
  .adm-day-card{border:1px solid rgba(255,94,138,.25);}
  .adm-day-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted);}
  .adm-day-row:last-child{border-bottom:none;}
  .adm-day-row .b{color:#fff;font-size:15px;}
  .adm-day-x{width:26px;height:26px;border-radius:50%;border:none;background:rgba(255,255,255,.06);color:var(--muted);font-size:12px;cursor:pointer;}
  .adm-pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .adm-pcell{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:11px 12px;}
  .adm-pcell .pl{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  .adm-pcell .pv{font-size:22px;font-weight:800;letter-spacing:-.02em;}
  .adm-pcell .psub{font-size:10.5px;color:#34d399;font-weight:700;margin-top:2px;}
  /* календарь */
  .cal-ovl{align-items:flex-end;}
  .cal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);}
  .cal-sheet{position:relative;width:100%;max-width:440px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.5);}
  .cal-sel{font-size:13px;color:#ff8fb0;font-weight:700;}
  .cal-nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;font-size:20px;cursor:pointer;line-height:1;}
  .cal-nav:disabled{opacity:.3;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dows{margin-bottom:4px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--muted2);padding:2px 0;}
  .cal-cell{aspect-ratio:1;border:none;background:transparent;color:#fff;font-size:14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.dis{color:var(--muted2);opacity:.35;cursor:default;}
  .cal-cell.mid{background:rgba(255,94,138,.14);border-radius:0;}
  .cal-cell.sel{background:var(--grad);color:#fff;font-weight:800;}

  /* partner switch */
  .switch{display:flex;gap:4px;padding:6px;position:relative;}
  .switch .seg{flex:1;border-radius:16px;padding:10px 12px;display:flex;align-items:center;
    justify-content:center;gap:8px;font-weight:600;font-size:14px;transition:all .3s;opacity:.5;}
  .switch .seg.on{opacity:1;background:linear-gradient(90deg,rgba(255,94,138,.9),rgba(192,38,211,.8));
    box-shadow:0 8px 20px rgba(255,94,138,.2);}
  .switch .cap{position:absolute;left:50%;transform:translateX(-50%);top:-8px;font-size:9px;
    text-transform:uppercase;letter-spacing:.2em;color:var(--muted2);}

  /* wheel */
  .wheel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .wheel button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;
    border-radius:16px;background:rgba(255,255,255,.04);transition:transform .1s,background .2s;}
  .wheel button:active{transform:scale(.95);background:rgba(255,255,255,.1);}
  .wheel .ic{font-size:20px;} .wheel .lb{font-size:10px;color:rgba(255,255,255,.7);text-align:center;line-height:1;}

  /* checkbox */
  .chk{width:24px;height:24px;border-radius:999px;border:2px solid rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
  .chk.on{background:var(--rose);border-color:var(--rose);}
  .strike{text-decoration:line-through;color:var(--muted);}

  /* toast */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;
    background:rgba(0,0,0,.82);backdrop-filter:blur(8px);border:1px solid var(--line);
    border-radius:16px;padding:12px 16px;font-size:14px;display:flex;align-items:center;gap:8px;
    animation:pop .2s ease;}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}

  /* bottom nav */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid var(--line);
    background:rgba(23,18,27,.92);backdrop-filter:blur(20px);padding-bottom:env(safe-area-inset-bottom);}
  .nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;
    color:var(--muted);transition:color .2s;}
  .nav button.on{color:var(--rose);}
  .nav .ic{font-size:18px;line-height:1;} .nav .lb{font-size:10px;font-weight:500;}

  /* splash */
  .splash{max-width:480px;margin:0 auto;min-height:100vh;padding:0 24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  .logo{width:80px;height:80px;margin:0 auto;border-radius:24px;display:flex;align-items:center;
    justify-content:center;font-size:40px;background:var(--grad);}
  .code-big{font-size:34px;font-weight:700;letter-spacing:.3em;color:#ffa7c0;}
  .fullw{width:100%;}
  /* баннер приглашения партнёра */
  .inv-banner{border-radius:22px;padding:18px;margin-bottom:16px;
    background:linear-gradient(135deg,rgba(255,94,138,.16),rgba(192,38,211,.10));
    border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 30px rgba(192,38,211,.20);}
  .inv-row{display:flex;align-items:center;gap:12px;}
  .inv-emo{width:44px;height:44px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:rgba(255,255,255,.07);}
  .inv-code{margin-top:12px;text-align:center;font-size:22px;font-weight:800;letter-spacing:.28em;color:#ff9ec0;}
  .avatar{width:24px;height:24px;border-radius:999px;object-fit:cover;}

  /* ===== Желания (redesign) ===== */
  .add-wish{width:100%;border-radius:20px;padding:16px;font-weight:700;font-size:15px;color:#fff;
    background:var(--grad);box-shadow:0 10px 26px rgba(192,38,211,.30);display:flex;align-items:center;
    justify-content:center;gap:8px;transition:transform .12s;}
  .add-wish:active{transform:scale(.98);}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0;margin:14px 0 4px;}
  .filters .f{flex:0 0 auto;border:1px solid var(--line);background:var(--card2);color:var(--muted);
    border-radius:999px;padding:10px 17px;font-size:13.5px;font-weight:600;transition:all .22s cubic-bezier(.2,.8,.2,1);white-space:nowrap;}
  .filters .f.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:700;
    box-shadow:0 8px 22px rgba(255,94,138,.4),0 0 0 1px rgba(255,255,255,.12) inset;transform:translateY(-1px);}
  .wcard{position:relative;display:flex;align-items:center;gap:13px;border-radius:22px;padding:14px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.28);margin-bottom:12px;
    overflow:hidden;animation:win .32s ease both;}
  .wcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--wc,#ff5e8a);opacity:.9;}
  .wcard.done{opacity:.62;}
  @keyframes win{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .wcat{width:52px;height:52px;flex:0 0 auto;border-radius:16px;display:flex;align-items:center;
    justify-content:center;font-size:26px;background:var(--wcb,rgba(255,94,138,.16));}
  .wbody{flex:1;min-width:0;}
  .wttl{font-size:15px;font-weight:600;line-height:1.25;}
  .wttl.done{text-decoration:line-through;color:var(--muted);}
  .wmeta{display:flex;align-items:center;gap:7px;margin-top:6px;flex-wrap:wrap;}
  .chipx{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
    padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);}
  .chipx.gold{background:rgba(251,191,36,.13);color:#fcd34d;}
  .chipx.new{background:rgba(96,165,250,.14);color:#93c5fd;}
  .chipx.taken{background:rgba(251,191,36,.14);color:#fcd34d;}
  .chipx.doneb{background:rgba(52,211,153,.14);color:#6ee7b7;}
  .wact{flex:0 0 auto;border-radius:14px;padding:10px 13px;font-size:13px;font-weight:700;
    display:flex;align-items:center;gap:5px;transition:transform .12s;}
  .wact:active{transform:scale(.94);}
  .wact.take{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(255,94,138,.28);}
  .wact.fin{background:rgba(52,211,153,.16);color:#6ee7b7;border:1px solid rgba(52,211,153,.3);}
  .wact.del{width:40px;height:40px;justify-content:center;padding:0;font-size:17px;border-radius:999px;
    background:rgba(248,113,113,.12);color:#fca5a5;border:1px solid rgba(248,113,113,.25);}
  /* настроение дня */
  .mood-row{display:flex;gap:6px;flex-wrap:wrap;}
  .mood-pick{font-size:23px;width:42px;height:42px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);cursor:pointer;transition:transform .1s;line-height:1;}
  .mood-pick:active{transform:scale(.9);}
  .mood-pick.on{background:var(--grad);border-color:transparent;transform:scale(1.06);box-shadow:0 4px 14px rgba(255,94,138,.3);}
  .mood-me{display:flex;align-items:center;gap:12px;padding:2px 0;}
  .mood-emo{font-size:30px;flex:0 0 auto;line-height:1;}
  .mood-change{margin-left:auto;font-size:12px;color:var(--rose);background:none;border:none;font-weight:700;cursor:pointer;}
  .mood-note-row{display:flex;gap:8px;margin-top:10px;}
  .mood-note{flex:1;}
  .mood-note-save{flex:0 0 auto;width:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:17px;cursor:pointer;}
  .mood-div{height:1px;background:var(--line);margin:12px 0;}
  /* «думаю о тебе» */
  .think-btn{width:100%;border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:800;color:#fff;cursor:pointer;
    background:var(--grad);box-shadow:0 8px 22px rgba(255,94,138,.32);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s;}
  .think-btn:active{transform:scale(.97);}
  .think-btn.cd{background:rgba(255,255,255,.06);color:var(--muted);box-shadow:none;cursor:default;}
  .think-ic{font-size:20px;}
  /* серия дней */
  .streak-strip{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;margin-bottom:12px;
    background:linear-gradient(180deg,rgba(251,146,60,.10),rgba(255,94,138,.06));border:1px solid rgba(251,146,60,.22);}
  .streak-strip.s0{background:rgba(255,255,255,.03);border-color:var(--line);}
  .streak-fire{font-size:26px;flex:0 0 auto;filter:grayscale(.6);opacity:.7;}
  .streak-fire.on{filter:none;opacity:1;animation:flamePulse 1.8s ease-in-out infinite;}
  @keyframes flamePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
  .streak-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px;}
  .streak-bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,#fb923c,#ff5e8a);transition:width .6s cubic-bezier(.2,.8,.2,1);}
  /* наша статистика */
  .ustat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .ustat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;}
  .ustat-ic{font-size:19px;line-height:1;}
  .ustat-v{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.02em;}
  .ustat-l{font-size:10.5px;color:var(--muted);margin-top:2px;}
  /* архив вопросов */
  .arch-answers{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .arch-ans{display:flex;gap:8px;font-size:13.5px;line-height:1.45;align-items:flex-start;}
  .arch-who{flex:0 0 auto;font-weight:700;color:var(--rose);font-size:11px;background:rgba(255,94,138,.12);border-radius:8px;padding:3px 9px;}
  .wcheck{width:40px;height:40px;flex:0 0 auto;border-radius:999px;display:flex;align-items:center;
    justify-content:center;font-size:18px;background:rgba(52,211,153,.16);color:#6ee7b7;}
  .wcard.pop{animation:wpop .55s ease;}
  @keyframes wpop{0%{transform:scale(1);}30%{transform:scale(1.035);}60%{transform:scale(.99);}100%{transform:scale(1);}}
  .burst{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;
    font-size:34px;animation:bst .7s ease forwards;}
  @keyframes bst{0%{opacity:0;transform:scale(.4);}35%{opacity:1;transform:scale(1.1);}100%{opacity:0;transform:scale(1.4);}}
  /* пустое состояние */
  .wempty{text-align:center;padding:36px 20px;}
  .wempty .ill{width:96px;height:96px;margin:0 auto 16px;border-radius:30px;display:flex;align-items:center;
    justify-content:center;font-size:46px;background:radial-gradient(circle at 50% 35%,rgba(255,94,138,.28),rgba(192,38,211,.10));
    box-shadow:inset 0 0 40px rgba(255,94,138,.15);}
  /* премиальный пустой экран «Желаний» */
  .wempty2{margin:10px 0 4px;padding:32px 22px 26px;border-radius:28px;text-align:center;
    background:linear-gradient(160deg,rgba(255,94,138,.12),rgba(192,38,211,.05) 60%,rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 22px 54px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.06);}
  .wempty2 .ill2{width:124px;height:124px;margin:0 auto 18px;border-radius:38px;display:flex;
    align-items:center;justify-content:center;font-size:58px;
    background:radial-gradient(circle at 50% 32%,rgba(255,94,138,.34),rgba(192,38,211,.08));
    box-shadow:inset 0 0 48px rgba(255,94,138,.20),0 14px 36px rgba(192,38,211,.24);
    animation:eIll .55s cubic-bezier(.2,.8,.2,1) both;}
  .wempty2 .et{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.25;animation:eUp .5s .12s ease both;}
  .wempty2 .es{font-size:14px;color:var(--muted);max-width:272px;margin:9px auto 0;line-height:1.5;animation:eUp .5s .22s ease both;}
  .wempty2 .eb{animation:eUp .5s .32s ease both;}
  .ebtn{width:100%;height:56px;border-radius:18px;margin-top:22px;font-weight:800;font-size:15.5px;color:#fff;
    background:var(--grad);display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 14px 32px rgba(192,38,211,.42),inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .14s,box-shadow .14s;}
  .ebtn:active{transform:scale(.97);box-shadow:0 7px 18px rgba(192,38,211,.34);}
  @keyframes eIll{from{opacity:0;transform:scale(.72) translateY(6px);}to{opacity:1;transform:none;}}
  @keyframes eUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.wempty2 .ill2,.wempty2 .et,.wempty2 .es,.wempty2 .eb{animation:none;}}
  /* модалка добавления */
  .ovl{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .sheet{width:100%;max-width:480px;background:#1c1622;border:1px solid var(--line);
    border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    animation:up .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .grabber{width:38px;height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin:0 auto 14px;}
  .catgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px;}
  .catopt{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:rgba(255,255,255,.05);border:2px solid transparent;transition:all .15s;}
  .catopt.on{border-color:var(--rose);background:rgba(255,94,138,.14);transform:scale(1.04);}
  .ptrow{display:flex;gap:8px;margin-top:6px;}
  .ptchip{flex:1;text-align:center;border-radius:12px;padding:10px 0;font-weight:700;font-size:14px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);}
  .ptchip.on{background:rgba(251,191,36,.15);color:#fcd34d;border-color:rgba(251,191,36,.4);}
  @media (prefers-reduced-motion:reduce){.wcard,.sheet,.ovl,.burst,.wcard.pop{animation:none;}}

  /* ===== Уровни / достижения / повышение ===== */
  .lvl-road{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:2px;}
  .lvl-node{flex:0 0 auto;width:66px;text-align:center;opacity:.9;}
  .lvl-node .lvl-emo{width:46px;height:46px;margin:0 auto;border-radius:14px;display:flex;align-items:center;
    justify-content:center;font-size:22px;background:rgba(255,255,255,.05);border:1px solid var(--line);}
  .lvl-node.cur .lvl-emo{background:var(--grad);border-color:transparent;box-shadow:0 6px 16px rgba(255,94,138,.35);}
  .lvl-node.lk{opacity:.42;}
  .lvl-node .lvl-nm{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.1;}
  .lvl-node.cur .lvl-nm{color:#fff;font-weight:600;}
  .achv-earned{color:#6ee7b7;}
  /* повышение уровня */
  .lvup{width:100%;max-width:420px;margin:0 16px;background:#1c1622;border:1px solid var(--line);
    border-radius:28px;padding:28px 22px calc(24px + env(safe-area-inset-bottom));text-align:center;
    position:relative;overflow:hidden;animation:up .35s cubic-bezier(.2,.8,.2,1);}
  .conf-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .conf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:.9;

  @keyframes conffall{0%{transform:translateY(-10px) rotate(0);opacity:1;}
    100%{transform:translateY(460px) rotate(540deg);opacity:0;}}
  @media (prefers-reduced-motion:reduce){.conf{display:none;}.lvup{animation:none;}}

  /* ===== Кастомизация ===== */
  .thm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .thm{position:relative;height:74px;border-radius:18px;border:2px solid transparent;overflow:hidden;
    display:flex;align-items:flex-end;padding:9px;transition:transform .12s;}
  .thm:active{transform:scale(.97);}
  .thm.sel{border-color:#fff;}
  .thm.lk{filter:grayscale(.7) brightness(.6);}
  .thm-nm{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .thm-check{position:absolute;top:8px;right:9px;font-size:14px;color:#fff;}
  .thm-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .frm{width:100%;display:flex;align-items:center;justify-content:space-between;border-radius:16px;

  .frm.sel{border-color:var(--rose);background:rgba(255,94,138,.08);}
  .frm.lk{opacity:.5;}

  /* ===== Квесты (redesign) ===== */
  .q-head{padding:16px;margin-bottom:12px;}
  .q-lvl-emo{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--grad);box-shadow:0 6px 18px rgba(255,94,138,.3);}
  .qbar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;}
  .qbar>div{height:100%;background:var(--grad);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .q-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .q-stat{padding:14px;}
  .qod{position:relative;overflow:hidden;border-radius:26px;padding:20px;margin-bottom:18px;
    background:linear-gradient(135deg,var(--qc,#ff5e8a),#7a1fa2);box-shadow:0 16px 40px rgba(122,31,162,.35);
    animation:win .4s ease both;}
  .qod-illu{position:absolute;right:-4px;top:14px;font-size:110px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));opacity:.96;}
  .qod-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.28);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;position:relative;}
  .qod-title{font-size:23px;font-weight:800;line-height:1.15;margin-top:12px;max-width:64%;text-shadow:0 2px 8px rgba(0,0,0,.3);position:relative;}
  .qod-desc{font-size:13px;color:rgba(255,255,255,.85);margin-top:8px;max-width:62%;line-height:1.4;position:relative;}

function qcatsList(){ return (S.config&&S.config.categories)||BUILT_IN_QCATS; }
function qcatOf(key){ var l=qcatsList(); for(var i=0;i<l.length;i++) if(l[i].key===key) return l[i]; return {key:key,name:'',emoji:'✨',color:'#ff5e8a'}; }
function levelsList(){ return (S.config&&S.config.levels)||BUILT_IN_LEVELS; }
// прогресс для UI: серверный если есть, иначе локальный из S.points
function effProgress(){
  if(S.progress&&S.progress.level) return S.progress;
  var lv=levelsList(), pts=S.points||0, idx=0;
  for(var i=0;i<lv.length;i++) if(pts>=lv[i].min) idx=i;
  return { points:pts, streak:0, levelIndex:idx,
    level:{index:idx,name:lv[idx].name,emoji:lv[idx].emoji,min:lv[idx].min},
    next: idx<lv.length-1?{name:lv[idx+1].name,emoji:lv[idx+1].emoji,min:lv[idx+1].min}:null };
}

function yearsWord(n){ return plural(n,['год','года','лет']); }
// стиль карточки по числу оставшихся дней (день рождения → 3 → 7 → 14 → 30 → 50)
function evGrad(days){
  if(days===0) return 'linear-gradient(135deg,#f43f8e,#c026d3 55%,#7c3aed)';
  if(days<=3)  return 'linear-gradient(135deg,#fb2e63,#c026d3)';
  if(days<=7)  return 'linear-gradient(135deg,#d8447e,#a02fbf)';
  if(days<=14) return 'linear-gradient(135deg,#8a2a6a,#5b2a8a)';
  if(days<=30) return 'linear-gradient(135deg,#5a2350,#3a2a6a)';
  return 'linear-gradient(135deg,#3a1c3f 0%,#57223f 55%,#7a2a3a 100%)';
}
// подсказка для дня рождения партнёра по «горизонту»
function giftTip(days){
  if(days===0) return '🎉 Сегодня! Подари внимание и заботу';
  if(days<=3)  return '🎁 Подарок уже готов? Осталось совсем чуть-чуть';
  if(days<=7)  return '🎁 Пора покупать подарок';
  if(days<=14) return '💡 Самое время выбрать подарок';
  if(days<=30) return '💡 Начни присматривать подарок';
  return '💡 Ещё есть время подумать о подарке';
}
// собрать ближайшее актуальное событие (или полезный запасной вариант)
function pickEvent(c){
  var cands=[];
  function pushBday(person, mine){
    if(!person||!person.birthday) return;
    var d=daysAnnual(person.birthday.month, person.birthday.day);
    if(d>50) return;                          // показываем ДР только за ≤50 дней; после — исчезает
    cands.push({
      kind:'bday', days:d, emoji:'🎂', glow:(d<=3),
      badge:(d===0?'🎉 СЕГОДНЯ':'🎂 ДЕНЬ РОЖДЕНИЯ'),
      title:(mine?'Твой день рождения':'День рождения '+esc(person.name)),
      when:(d===0?'Сегодня! 🥳':('Через <b>'+d+'</b> '+daysWord(d))),
      tip:(mine?'💌 Добавь желание — партнёр узнает, что подарить':giftTip(d)),
      cta:(mine?{label:'⭐ Мои желания',act:'ev-mywishes'}:{label:'🎁 Идеи подарков',act:'ev-gifts'})
    });
  }
  pushBday(c.partner,false); pushBday(c.me,true);
  // годовщина (по дате начала; не показываем для только что созданной пары)
  if(c.since){
    var sd=sod(new Date(c.since));
    var together=Math.floor((sod(new Date())-sd)/DAY);
    if(together>=60){
      var d=daysAnnual(sd.getMonth()+1, sd.getDate());
      var y=new Date().getFullYear(), nx=sod(new Date(y,sd.getMonth(),sd.getDate()));
      if(nx<sod(new Date())) nx=sod(new Date(y+1,sd.getMonth(),sd.getDate()));
      var yrs=nx.getFullYear()-sd.getFullYear();
      if(d<=50 && yrs>=1){
        cands.push({ kind:'anniv', days:d, emoji:'💞', glow:(d<=3),
          badge:(d===0?'💞 СЕГОДНЯ':'💞 ГОДОВЩИНА'),
          title:yrs+' '+yearsWord(yrs)+' вместе',
          when:(d===0?'Сегодня ваш день! 💕':('Через <b>'+d+'</b> '+daysWord(d))),
          tip:(d<=7?'✨ Спланируйте что-то особенное':'💫 Придумайте, как отметить'),
          cta:{label:'📅 Наши даты',act:'ev-dates'} });
      }
    }
  }
  if(cands.length){ cands.sort(function(a,b){return a.days-b.days;}); return cands[0]; }
  return fallbackEvent(c);
}
// когда нет ближайших дат — всегда показываем что-то полезное
function fallbackEvent(c){
  var together=c.since?Math.floor((sod(new Date())-sod(new Date(c.since)))/DAY):0;
  // 1) приближается круглое число дней вместе
  var MILE=[100,200,300,365,500,730,1000,1500,2000,3000,3650];
  for(var i=0;i<MILE.length;i++){ var left=MILE[i]-together;
    if(left>0 && left<=14){ return { kind:'milestone', days:left, emoji:'💞', glow:false,
      badge:'💞 ВМЕСТЕ', title:'Скоро '+MILE[i]+' '+daysWord(MILE[i])+' вместе',
      when:'Через <b>'+left+'</b> '+daysWord(left), tip:'✨ Отметьте этот день чем-то особенным',
      cta:{label:'📅 Наши даты',act:'ev-dates'} }; } }
  // 2) вопрос дня ещё не отвечен
  var td=todayData();
  if(td.linked && !td.mine){ return { kind:'q', days:0, emoji:'💬', glow:false,
    badge:'💬 ВОПРОС ДНЯ', title:'Ответьте на вопрос дня', when:'',
    tip:'👇 Ваш ответ ждёт партнёра — прямо ниже' }; }
  // 3) незавершённый «квест дня»
  var lvl=(effProgress().levelIndex)||0, qd=qToday(questDefs(),lvl);
  if(qd && !S.qdone[qd.id]){ return { kind:'quest', days:0, emoji:qd.emoji, glow:false,
    badge:'🗺️ КВЕСТ ДНЯ', title:esc(qd.title), when:'',
    tip:'⭐ Выполните вместе и получите +'+qd.pts, cta:{label:'Открыть квесты',act:'ev-quests'} }; }
  // 4) сколько вы уже вместе
  return { kind:'together', days:0, emoji:'💞', glow:false, badge:'💞 МЫ ВМЕСТЕ',
    title:'Вы вместе '+together+' '+daysWord(together), when:'',
    tip:'❤️ Каждый день делает вас ближе' };
}

// серия дней подряд (отвечали на вопрос дня) — мотивирует заходить каждый день
function streakStrip(){
  var s=(effProgress().streak)||0;
  var MS=[3,7,14,30,60,100,180,365], next=null;
  for(var i=0;i<MS.length;i++){ if(MS[i]>s){ next=MS[i]; break; } }
  if(s<=0){
    return '<div class="streak-strip s0"><span class="streak-fire">🔥</span>'+
      '<div class="flex1"><div class="small sb">Начните серию дней</div>'+
      '<div class="xs muted">Ответьте на вопрос дня вдвоём — и серия пойдёт</div></div></div>';
  }
  var pct=next?Math.max(6,Math.min(100,Math.round(s/next*100))):100;
  var sub=next?('до '+next+' — ещё '+(next-s)+' '+daysWord(next-s)):'легендарная серия 👑';
  return '<div class="streak-strip"><span class="streak-fire on">🔥</span>'+
    '<div class="flex1"><div class="row between" style="align-items:baseline"><div class="small sb">'+s+' '+daysWord(s)+' подряд</div>'+
    '<div class="xs muted">'+sub+'</div></div>'+
    '<div class="streak-bar"><div style="width:'+pct+'%"></div></div></div></div>';
}

function hex2rgba(h,a){ h=h.replace('#',''); var n=parseInt(h,16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

function wishesScreen(){
  var c=S.couple, filter=S.wfilter||'all', donef=S.wdonefilter||'all';
  var meName=function(by){ return by==='me' ? ((c.me.emoji||'👨')+' Я') : ((c.partner.emoji||'👩')+' '+esc(c.partner.name||'Партнёр')); };

  var isActive=function(w){ return w.status!=='done'; };
  // фильтрация по СТАТУСУ (не только по автору): активные — в Все/Мои/Партнёра, выполненные — отдельно
  var list=all.filter(function(w){
    if(filter==='done'){
      if(w.status!=='done') return false;
      if(donef==='mine') return w.by==='me';
      if(donef==='partner') return w.by==='partner';
      return true;
    }

    if(filter==='partner') return w.by==='partner';
    return true;                                // 'all' — только активные обоих
  });

  // счётчики для вкладок (обновляются мгновенно после выполнения — это просто пересчёт при render)
  var act=all.filter(isActive);

    }).join('')+'</div>';

  var body;

    var eSub = filter==='done' ? 'Выполните желание — и оно появится здесь.'

    body='<div class="wempty2"><div class="ill2">'+eIll+'</div>'+

      '<div class="es">'+eSub+'</div>'+

      var ct=wcat(w.category), pop=(S.justDone===w.id?' pop':'');
      var badge = w.status==='new' ? '<span class="chipx new">🆕 Новое</span>'
        : w.status==='taken' ? '<span class="chipx taken">🤝 Взято</span>'

function qUnlocked(q,lvl){ return (q.level||0)<=lvl; }
function socialAvas(){ return '<span class="qod-ava">🧑</span><span class="qod-ava">👩</span><span class="qod-ava">🧔</span>'; }
// «Квест дня» — детерминированный выбор из featured/разблокированных, ротация по дню
function qToday(defs,lvl){
  var pool=defs.filter(function(q){ return q.featured&&qUnlocked(q,lvl); });
  if(!pool.length) pool=defs.filter(function(q){ return qUnlocked(q,lvl); });
  if(!pool.length) pool=defs;
  if(!pool.length) return null;
  var day=Math.floor(sod(new Date()).getTime()/DAY);
  return pool[day%pool.length];
}
function questsScreen(){

    ntxt='до «'+esc(prog.next.name)+'» ещё '+Math.max(0,prog.next.min-pts)+' ⭐'; }

    '</div><div class="qbar mt3"><div style="width:'+pct+'%"></div></div></div>';

      '<div class="qod-title">'+esc(qd.title)+'</div>'+
      '<div class="qod-desc">'+esc(qd.desc)+'</div>'+
      '<div class="qod-chips">'+
        '<span class="chipx">⭐ +'+qd.pts+'</span>'+
        '<span class="chipx">⏱ '+esc(qd.time)+'</span>'+
        '<span class="chipx" style="color:'+dd.c+'">'+dd.l+'</span>'+
        '<span class="chipx">'+c.emoji+' '+esc(c.name)+'</span>'+
      '</div>'+
      '<div class="qod-social">'+socialAvas()+' &nbsp;'+qd.pairs+' пар уже выполнили</div>'+
      (done
        ? '<button class="btn qod-btn" disabled style="opacity:.75">Выполнено ✓</button>'
        : '<button class="btn qod-btn" data-act="quest-done" data-id="'+qd.id+'">Выполнить квест →</button>')+
      '</div>';
  }

  // ---- категории ----
  var cats=[{key:'all',name:'Все',emoji:'✨',color:'#ff5e8a'}].concat(qcatsList());
  var catHtml=cats.map(function(cat){
    var on=S.qcat===cat.key;
    var icStyle=on?('background:'+hex2rgba(cat.color,.92)+';border-color:transparent;box-shadow:0 8px 20px '+hex2rgba(cat.color,.4)):'';

  var rec=defs.filter(function(q){ return (S.qcat==='all'||q.cat===S.qcat); });

// цветовой приоритет: <30 дней — розовый, 30–90 — золотой, дальше — обычный
function dateAccent(days){ if(days<30) return '#ff5e8a'; if(days<=90) return '#fbbf24'; return ''; }
function dateHero(x){
  var d=x.t, days=x.days, isB=(d.icon==='🎂'), emo=isB?'🎂':(d.icon==='💍'?'💞':(d.icon||'📅'));
  var ac=dateAccent(days)||'#ff5e8a';
  var tag=days===0?'Сегодня':(days<7?'Совсем скоро':'Скоро');
  var when=days===0?'сегодня 🥳':('через <b style="color:'+ac+'">'+days+'</b> '+daysWord(days));
  var body;
  if(days>0 && days<7){
    body='<div class="dt-recs">'+
      '<div class="dt-rec">🎁 Купить подарок</div>'+
      '<div class="dt-rec">💐 Заказать цветы</div>'+
      '<div class="dt-rec">✍️ Написать поздравление</div></div>';
  } else {
    var tip=isB?giftTip(days):'✨ Придумайте, как отметить';
    body='<div class="dt-hero-tip">'+tip+'</div>';
  }
  var cta=isB?'<button class="dt-hero-btn" data-act="ev-gifts">🎁 Идеи подарков <span style="opacity:.65">›</span></button>'
             :'<button class="dt-hero-btn" data-act="ev-quests">💡 Идея свидания <span style="opacity:.65">›</span></button>';
  return '<div class="dt-hero">'+
    '<div class="dt-hero-emoji">'+emo+'</div>'+
    '<div class="dt-hero-tag" style="color:'+ac+'">'+tag+'</div>'+
    '<div class="dt-hero-title">'+esc(d.title)+'</div>'+
    '<div class="dt-hero-days">'+when+'</div>'+
    body+
    '<div>'+cta+'</div></div>';
}
function dateRow(x){
  var d=x.t, days=x.days, ac=dateAccent(days), num=ac||'#fff';
  var when=days===0?'сегодня 🎉':('через <b style="color:'+num+'">'+days+'</b> '+daysWord(days));
  return '<div class="dt-row" data-act="profile-open" role="button">'+(ac?'<div class="acc" style="background:'+ac+'"></div>':'')+
    '<div class="dt-ic">'+(d.icon||'📅')+'</div>'+
    '<div class="info"><div class="nm">'+esc(d.title)+'</div><div class="wh">'+when+'</div></div>'+
    '<div class="dt-chev">›</div></div>';
}
// ---------- Профиль и даты: правки поверх данных пары ----------
function pad2(n){ n=+n||0; return (n<10?'0':'')+n; }
function dateMD(v){ if(!v) return null; var a=String(v).split('-'); return {month:+a[1], day:+a[2]}; }
function md2date(md){ return md&&md.month?('2000-'+pad2(md.month)+'-'+pad2(md.day)):''; }
// применить правки профиля к объекту пары (в памяти) — чтобы верхняя карточка и даты были едины
function applyProfile(){
  var c=S.couple, p=S.profile; if(!c||!p) return;
  if(p.meEmoji) c.me.emoji=p.meEmoji;
  if(p.partnerEmoji) c.partner.emoji=p.partnerEmoji;
  if(p.meName) c.me.name=p.meName;
  if(p.partnerName && !c.linked) c.partner.name=p.partnerName; // у связанной пары имя берём с сервера
  if(p.meBd) c.me.birthday=p.meBd;
  if(p.partnerBd) c.partner.birthday=p.partnerBd;
  if(p.since) c.since=p.since;
}
// собрать список дат из (уже обновлённой) пары и своих событий
function buildDates(){
  var c=S.couple; if(!c){ S.dates=[]; return; }
  var p=S.profile||{}, list=[];
  var since=c.since;
  if(since){ var sd=new Date(since); if(!isNaN(sd)) list.push({id:'anniv',title:'Годовщина',icon:'💍',annual:{month:sd.getMonth()+1,day:sd.getDate()}}); }
  if(c.partner&&c.partner.birthday) list.push({id:'bd-partner',title:'День рождения '+(c.partner.name||'партнёра'),icon:'🎂',annual:c.partner.birthday});
  if(c.me&&c.me.birthday) list.push({id:'bd-me',title:'День рождения '+(c.me.name||'вас'),icon:'🎂',annual:c.me.birthday});
  (p.extra||[]).forEach(function(e){ if(e&&e.month) list.push({id:e.id,title:e.title||'Событие',icon:e.icon||'📅',annual:{month:e.month,day:e.day}}); });
  S.dates=list; save('dates');
}
function refreshDates(){ if(S.profile) applyProfile(); buildDates(); }

function datesScreen(){

    var days=d.annual?daysAnnual(d.annual.month,d.annual.day):Math.round((sod(new Date(d.iso))-sod(new Date()))/DAY);
    return {t:d, days:days};
  }).filter(function(x){return x.days>=0;}).sort(function(a,b){return a.days-b.days;});
  var head=screenTitle('📅','Даты','важные дни, чтобы не забыть');

// полноэкранный редактор профиля и дат
function initProfileDraft(){

function pfCollect(){
  var d=S.profileDraft||initProfileDraft();
  d.meName=(val('#pf-me-name')||'').trim(); d.meEmoji=(val('#pf-me-emoji')||'').trim()||'🧔';
  d.meBd=dateMD(val('#pf-me-bd'));

// ---------- Полная админка (overlay внутри приложения) ----------
function admCumulative(series){ var t=0; return (series||[]).map(function(p){ t+=p.v; return {date:p.date,v:t}; }); }
// дельты из дневных серий (честно, из реальных данных)
function admPct(a,b){ if(b<=0) return a>0?{v:100,up:true}:null; var p=Math.round((a-b)/b*100); if(p===0) return null; return {v:p,up:p>0}; }
function admSum(s,from,to){ var x=0; for(var i=from;i<to&&i>=0&&i<s.length;i++){ if(s[i]) x+=s[i].v; } return x; }
function admDeltaDay(s){ if(!s||s.length<2) return null; return admPct(s[s.length-1].v, s[s.length-2].v); } // сегодня vs вчера
function admDelta7Total(s){ if(!s||s.length<8) return null; return admPct(admSum(s,0,s.length), admSum(s,0,s.length-7)); } // накопленный рост за 7д
function admDelta7v7(s){ if(!s||s.length<14) return null; var n=s.length; return admPct(admSum(s,n-7,n), admSum(s,n-14,n-7)); } // последние 7д vs предыдущие 7д
function admChip(d){ if(!d) return ''; var up=d.up, c=up?'#34d399':'#f87171'; return '<span class="adm-delta" style="color:'+c+'">'+(up?'+':'−')+Math.abs(d.v)+'% '+(up?'↑':'↓')+'</span>'; }
function admDayLabel(iso){ if(!iso) return ''; var p=String(iso).split('-'); var mm=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][(+p[1]-1)||0]; return (+p[2])+' '+mm; }
// премиальный график: накопительная кривая с заливкой-градиентом
function admChart(cum, range){
  var pts=(cum||[]).slice(-range); var n=pts.length;
  if(n<2) return '<div class="muted small center-t" style="padding:34px">Пока мало данных для графика</div>';
  var W=680,H=150,pad=10, vals=pts.map(function(p){return p.v;});
  var max=Math.max.apply(null,vals), min=Math.min.apply(null,vals), rng=Math.max(1,max-min);
  var X=function(i){ return pad+(W-2*pad)*(i/(n-1)); };
  var Y=function(v){ return pad+(H-2*pad)-(H-2*pad)*((v-min)/rng); };
  var line=pts.map(function(p,i){ return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1); }).join(' ');
  var area=line+' L'+X(n-1).toFixed(1)+' '+(H-pad)+' L'+X(0).toFixed(1)+' '+(H-pad)+' Z';
  var last=pts[n-1];
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:150px">'+
    '<defs><linearGradient id="agrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5e8a" stop-opacity="0.30"/><stop offset="1" stop-color="#ff5e8a" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#agrad)"/>'+
    '<path d="'+line+'" fill="none" stroke="#ff5e8a" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  var badge='<div class="adm-badge">'+last.v+' · '+admDayLabel(last.date)+'</div>';
  var xax='<div class="adm-x"><span>'+admDayLabel(pts[0].date)+'</span><span>'+admDayLabel(pts[Math.floor(n/2)].date)+'</span><span>'+admDayLabel(last.date)+'</span></div>';
  return '<div class="adm-chart-wrap">'+badge+svg+'</div>'+xax;
}
// ----- аналитика по периоду: календарь, показатели за период, клик по точке -----
function admFullDate(iso){ if(!iso) return ''; var p=String(iso).split('-'); var mm=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'][(+p[1]-1)||0]; return (+p[2])+' '+mm; }
function admDates(){ var s=(S.adminData&&S.adminData.series&&S.adminData.series.users)||[]; return s.map(function(p){return p.date;}); }
function admWindow(){
  var dates=admDates(); if(!dates.length) return null;

  if(S.admFrom&&S.admTo) return {from:S.admFrom,to:S.admTo,custom:true,min:minD,max:maxD};
  var r=S.admRange||30, from=dates[Math.max(0,dates.length-r)];
  return {from:from,to:maxD,custom:false,min:minD,max:maxD};
}
function admPeriod(w){
  var S0=(S.adminData&&S.adminData.series)||{};
  function inw(p){ return p.date>=w.from&&p.date<=w.to; }
  function sum(name){ var x=0; (S0[name]||[]).forEach(function(p){ if(inw(p)) x+=p.v; }); return x; }
  function peak(name){ var x=0; (S0[name]||[]).forEach(function(p){ if(inw(p)&&p.v>x) x=p.v; }); return x; }
  var dc=0; (S0.users||[]).forEach(function(p){ if(inw(p)) dc++; }); dc=dc||1;
  return { newUsers:sum('users'), newCouples:sum('couples'), newCouplesLinked:sum('couplesLinked'),
    quests:sum('quests'), points:sum('points'),

}

// накопительная кривая, обрезанная под окно, с кликабельными точками
function admGrowthChart(w){
  var d=S.adminData||{}, t=d.totals||{}, s=d.series||{};
  var cum=admCumulative(s.users);
  var baseline=Math.max(0,(t.users||0)-(cum.length?cum[cum.length-1].v:0));
  if(baseline>0) cum=cum.map(function(p){return {date:p.date,v:p.v+baseline};});
  var pts=cum.filter(function(p){ return p.date>=w.from&&p.date<=w.to; }); var n=pts.length;
  if(n<2) return '<div class="muted small center-t" style="padding:30px 20px">Выбран один день — подробности в «Показателях за период» ниже</div>';
  var W=680,H=150,pad=10, vals=pts.map(function(p){return p.v;});
  var max=Math.max.apply(null,vals), min=Math.min.apply(null,vals), rng=Math.max(1,max-min);
  var X=function(i){ return pad+(W-2*pad)*(i/(n-1)); };
  var Y=function(v){ return pad+(H-2*pad)-(H-2*pad)*((v-min)/rng); };
  var line=pts.map(function(p,i){ return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1); }).join(' ');
  var area=line+' L'+X(n-1).toFixed(1)+' '+(H-pad)+' L'+X(0).toFixed(1)+' '+(H-pad)+' Z';
  var last=pts[n-1], bpt=last;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:150px">'+
    '<defs><linearGradient id="agrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5e8a" stop-opacity="0.30"/><stop offset="1" stop-color="#ff5e8a" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#agrad)"/>'+
    '<path d="'+line+'" fill="none" stroke="#ff5e8a" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  var xp=[]; for(var k=0;k<n;k++) xp.push(X(k)/W*100);
  var dots='', hits='', guide='';
  for(var i=0;i<n;i++){
    var lp=xp[i], tp=Y(pts[i].v), sel=(S.admDay===pts[i].date);
    var le=(i===0)?0:(xp[i-1]+xp[i])/2, re=(i===n-1)?100:(xp[i]+xp[i+1])/2; // сегмент «ближайшей точки»
    if(sel){ bpt=pts[i]; guide='<div class="adm-guide" style="left:'+lp.toFixed(2)+'%"></div>'; }
    dots+='<span class="adm-dot'+(sel?' on':'')+'" style="left:'+lp.toFixed(2)+'%;top:'+tp.toFixed(1)+'px"></span>';
    hits+='<button class="adm-hit" data-act="adm-day" data-d="'+pts[i].date+'" style="left:'+le.toFixed(2)+'%;width:'+(re-le).toFixed(2)+'%" aria-label="'+admDayLabel(pts[i].date)+'"></button>';
  }
  dots=hits+dots;
  var badge='<div class="adm-badge">'+bpt.v+' · '+admDayLabel(bpt.date)+'</div>';
  var xax='<div class="adm-x"><span>'+admDayLabel(pts[0].date)+'</span><span>'+admDayLabel(pts[Math.floor(n/2)].date)+'</span><span>'+admDayLabel(last.date)+'</span></div>';
  return '<div class="adm-chart-wrap">'+badge+guide+svg+dots+'</div>'+
    '<div class="xs muted2 center-t mt1">Нажмите на точку графика — покажем показатели за день</div>'+xax;

// календарь выбора периода
function calShift(ym,delta){ var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+delta; return new Date(Date.UTC(y,m,1)).toISOString().slice(0,7); }
function calOverlay(){
  if(!S.calOpen) return '';
  var w=admWindow(); if(!w) return '';
  var minD=w.min,maxD=w.max, ym=S.calMonth||maxD.slice(0,7);
  var y=+ym.slice(0,4),mo=+ym.slice(5,7)-1;

// собрать значения полей редактора из DOM (переживают ре-рендер)
function cfgCollect(){
  if(!S.adminConfig) return;
  cfgSections().forEach(function(sec){
    var cards=document.querySelectorAll('.cfgcard[data-sec="'+sec.key+'"]'), arr=[];
    Array.prototype.forEach.call(cards,function(card){
      var idx=+card.getAttribute('data-idx'), orig=(S.adminConfig[sec.key]||[])[idx]||{}, obj={};
      for(var kk in orig){ if(Object.prototype.hasOwnProperty.call(orig,kk)) obj[kk]=orig[kk]; }
      Array.prototype.forEach.call(card.querySelectorAll('[data-k]'),function(inp){
        var k=inp.getAttribute('data-k'), t=inp.getAttribute('data-t'), val;
        if(t==='bool') val=inp.checked;
        else if(t==='num') val=inp.value===''?0:Number(inp.value);
        else if(t==='lines') val=inp.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
        else val=inp.value;
        obj[k]=val;
      });
      arr.push(obj);
    });
    S.adminConfig[sec.key]=arr;
  });
}

  var hm=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

  if(new Date(now.getTime()-86400000).toDateString()===d.toDateString()) return 'вчера, '+hm;
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+hm;
}

function render(){
  var root=document.getElementById('root'), html;
  // сохранить набранный текст ДО построения разметки (чтобы не потерять при ре-рендере)
  if(S.wmodal){ var _wt0=document.getElementById('wtitle'); if(_wt0) S.wmodal.text=_wt0.value; }
  var _mn0=document.getElementById('mood-note'); if(_mn0 && S.moods && S.moods.me) S.moods.me.note=_mn0.value;
  // ответ на вопрос дня (#qa) не привязан к состоянию — запомним значение и фокус, восстановим после
  var _qa0=document.getElementById('qa'), _qaVal=_qa0?_qa0.value:null, _qaFoc=_qa0&&document.activeElement===_qa0, _qaSel=_qa0?_qa0.selectionStart:null;
  if(!S.couple){
    html=(S.ob.step==='welcome')?welcomeView():pairView();
  } else {
    if(S.profile) applyProfile();
    if(!S.dates) buildDates();
    if(S.showInvite && !S.couple.linked){
      html=inviteView();
    } else if(S.showAdmin && S.adminData){
      html=adminView();
    } else if(S.showAchv){
      html=achvView();
    } else if(S.showCust){
      html=custView();
    } else if(S.recOpen){
      html=recView();
    } else if(S.archiveOpen){
      html=archiveView();
    } else if(S.profileOpen){
      html=profileView();
    } else {
      var screen={today:todayScreen,wishes:wishesScreen,quests:questsScreen,dates:datesScreen,us:usScreen}[S.tab]();
      html='<div class="app">'+screen+bottomNav()+'</div>';
    }
  }
  if(S.toast){
    html+='<div class="toast"><span style="font-size:18px">'+S.toast.icon+'</span>'+
      '<span><b>'+esc(S.toast.label)+'</b> — '+esc(S.toast.hint)+'</span></div>';
  }
  if(S.wmodal){ html+=wishModal(); }
  if(S.qburst){ html+=questBurst(); }
  if(S.levelup){ html+=levelupOverlay(); }
  if(S.calOpen){ html+=calOverlay(); }
  // если разметка не изменилась — НЕ трогаем DOM (иначе фоновые опросы «дёргают» экран,
  // сбрасывают фокус, скролл и анимации). Заодно сохраняются ввод и позиция страницы.
  if(html===S._lastHtml) return;
  S._lastHtml=html;
  root.innerHTML=html;
  var wt=document.getElementById('wtitle'); if(wt && S.wmodal && !S.wmodal._f){ wt.focus(); try{ var _p=wt.value.length; wt.setSelectionRange(_p,_p); }catch(e){} S.wmodal._f=true; }
  // вернуть недописанный ответ на вопрос дня и фокус
  if(_qaVal){ var _qa1=document.getElementById('qa'); if(_qa1){ _qa1.value=_qaVal; if(_qaFoc){ _qa1.focus(); try{ _qa1.setSelectionRange(_qaSel,_qaSel); }catch(e){} } } }
}

// ============================================================
//  ОНЛАЙН (бэкенд): настоящая пара внутри Telegram
// ============================================================
function enterOnline(couple){
  ONLINE=true; S.couple=coupleFromServer(couple); save('couple');
  S.ob.waiting=false; S.ob.err='';
  if(S.couple.linked){ prevLinked=true; celebrateLink(); }      // присоединился к паре — сразу связаны
  else { prevLinked=false; S.showInvite=true; startLinkPoll(); } // создатель — ждём партнёра
  haptic('success'); render();
  refreshState(); // подтянуть вопрос дня и ответы
}
async function refreshState(){
  try{
    var r=await api('state');
    if(r&&r.ok&&r.couple){
      var nowLinked=!!r.couple.linked;
      ONLINE=true; S.couple=coupleFromServer(r.couple); if(r.today)S.srvToday=r.today;
      if(r.progress)S.progress=r.progress; if(r.config)S.config=r.config;
      if(r.wishes) applyServerWishes(r.wishes);                 // общий список желаний пары
      if(r.moods) applyMoods(r.moods);                          // настроение дня обоих
      if(nowLinked && prevLinked===false){ celebrateLink(); }   // партнёр только что присоединился!
      prevLinked=nowLinked;
      render(); checkLevelUp();
    }
  }catch(e){}
}
// пара стала связанной — празднуем, останавливаем опрос
function celebrateLink(){
  S.showInvite=false; stopLinkPoll();
  var nm=(S.couple&&S.couple.partner&&S.couple.partner.name)||'Партнёр';
  S.qburst={label:'💞 '+nm+' в паре!', pts:100};
  try{ if(navigator.vibrate) navigator.vibrate([40,60,40,60,140]); }catch(e){}
  haptic('success'); render();
  setTimeout(function(){ S.qburst=null; render(); }, 2600);
}
// опрос сервера, пока ждём присоединения партнёра
function startLinkPoll(){
  stopLinkPoll(); if(!ONLINE) return;
  LINK_POLL=setInterval(function(){
    if(S.couple && !S.couple.linked) refreshState(); else stopLinkPoll();
  }, 6000);
}
function stopLinkPoll(){ if(LINK_POLL){ clearInterval(LINK_POLL); LINK_POLL=null; } }
// синхронизация общего списка желаний пары
async function refreshWishes(){ if(!ONLINE||!S.couple||S.wmodal) return; /* не дёргаем ре-рендер, пока открыто окно ввода */
  try{ var r=await api('wishes'); if(r&&r.ok&&r.wishes){ if(S.wmodal) return;
    var mapped=mapServerWishes(r.wishes), sig=JSON.stringify(mapped);
    if(sig===S._wishSig) return;                 // ничего не изменилось — не перерисовываем (иначе экран «дёргается»)
    S.wishes=mapped; S._wishSig=sig; render();
  } }catch(e){} }
function startWishPoll(){ stopWishPoll(); if(!ONLINE||!S.couple) return; WISH_POLL=setInterval(function(){ if(S.tab==='wishes') refreshWishes(); else stopWishPoll(); }, 12000); }
function stopWishPoll(){ if(WISH_POLL){ clearInterval(WISH_POLL); WISH_POLL=null; } }
function showToast(icon,label,hint){ S.toast={icon:icon,label:label,hint:hint}; render(); setTimeout(function(){ S.toast=null; render(); },3000); }
// после начисления очков — подтянуть прогресс с сервера (немного погодя, чтобы событие успело записаться)
function afterEarn(){ if(!ONLINE) return; setTimeout(refreshState, 700); }
// показать экран повышения уровня, если пара поднялась выше запомненного
function checkLevelUp(){
  if(!S.progress||!S.progress.level) return;
  var seen=lsGet('seenLevel',0), idx=S.progress.level.index;
  if(idx>seen){
    S.levelup=S.progress.level; lsSet('seenLevel',idx);
    try{ if(navigator.vibrate) navigator.vibrate([40,60,40,60,140]); }catch(e){}
    haptic('success'); render();
  } else if(seen>idx){ lsSet('seenLevel',idx); } // сброс (например «сменить пару»)
}
async function onlineCreate(){
  S.ob.waiting=true; render();
  try{
    var r=await api('pair_create');
    if(r&&r.ok&&r.couple){ enterOnline(r.couple); return; }
    if(r&&r.reason==='not_configured'){ finishPairing('Татьяна'); return; } // бэкенд не настроен → демо
    S.ob.waiting=false; S.ob.mode='create'; S.ob.err='Не удалось создать пару'; render();
  }catch(e){ S.ob.waiting=false; S.ob.mode='create'; S.ob.err='Сеть недоступна'; render(); }
}
async function onlineJoin(code){
  S.ob.waiting=true; S.ob.err=''; render();
  try{
    var r=await api('pair_join',{code:code});
    if(r&&r.ok&&r.couple){ enterOnline(r.couple); return; }
    if(r&&r.reason==='not_configured'){ finishPairing('Татьяна'); return; }
    var m={not_found:'Код не найден',couple_full:'В этой паре уже двое',already_paired:'Ты уже в паре',bad_code:'Неверный код'};
    S.ob.waiting=false; S.ob.err=(r&&m[r.reason])||'Не удалось присоединиться'; render();
  }catch(e){ S.ob.waiting=false; S.ob.err='Сеть недоступна'; render(); }
}
async function onlineAnswer(text){
  try{
    var r=await api('answer',{text:text});
    if(r&&r.ok&&r.today){ S.srvToday=r.today; S.points+=10; save('points'); track('points',10); haptic('success'); afterEarn(); }
    render();
  }catch(e){ render(); }
}
async function loadStats(){
  if(!ONLINE) return;
  try{ var r=await api('stats'); if(r&&r.ok){ S.stats=r.stats; render(); } }catch(e){}
}
async function boot(){
  render(); // мгновенно показываем интерфейс (демо/онбординг)
  if(!CAN_ONLINE) return; // вне Telegram — локальный демо-режим
  try{
    var r=await api('state');
    if(r&&r.ok){
      ONLINE=true;
      if(r.couple){ S.couple=coupleFromServer(r.couple); if(r.today)S.srvToday=r.today;
        if(r.progress)S.progress=r.progress; if(r.config)S.config=r.config;
        if(r.wishes) applyServerWishes(r.wishes);
        if(r.moods) applyMoods(r.moods);
        prevLinked=!!r.couple.linked;
        if(!S.couple.linked) startLinkPoll(); } // вернувшийся создатель всё ещё ждёт партнёра
      else { S.couple=null; } // сервер — источник правды: онбординг с настоящим бэкендом
      render();
      checkLevelUp();
      if(S.couple && S.tab==='wishes') startWishPoll(); // держим общий список желаний свежим
      loadStats(); // если ты админ (ADMIN_TG_IDS) — подтянется статистика
    } // not_configured / ошибка → тихо остаёмся в демо
  }catch(e){}
}

window.__admPairSearch=function(q){ q=(q||'').trim().toLowerCase(); var list=document.getElementById('adm-pair-list'); if(!list)return;
  var rows=list.querySelectorAll('.urow'); for(var i=0;i<rows.length;i++){ var nm=rows[i].getAttribute('data-name')||''; rows[i].style.display=(!q||nm.indexOf(q)>=0)?'':'none'; } };
window.__admWishSearch=function(q){ q=(q||'').trim().toLowerCase(); var list=document.getElementById('adm-wish-list'); if(!list)return;
  var rows=list.querySelectorAll('.urow'); for(var i=0;i<rows.length;i++){ var nm=rows[i].getAttribute('data-name')||''; rows[i].style.display=(!q||nm.indexOf(q)>=0)?'':'none'; } };
try{ applyTheme(S.theme); }catch(e){} // применить выбранную тему при запуске

document.getElementById('root').addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el)return;
  var fn=ACTS[el.dataset.act]; if(fn){ e.preventDefault(); fn(el); }
});

// пришли по ссылке-приглашению → сразу к присоединению
if(START_PARAM && !S.couple){
  S.ob.step='pair'; S.ob.mode='join'; S.ob.invited=true; S.ob.code=START_PARAM.toUpperCase().slice(0,6);
}

boot();
})();
