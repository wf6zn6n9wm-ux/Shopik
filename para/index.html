<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PARA — для двоих</title>

<!-- PWA / iOS home-screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- Telegram SDK (необязателен; если не загрузится — приложение всё равно работает) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root{
    --bg:#17121b; --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.03);
    --line:rgba(255,255,255,.10); --muted:rgba(255,255,255,.45); --muted2:rgba(255,255,255,.30);
    --rose:#ff5e8a; --fuchsia:#c026d3; --amber:#fbbf24;
    --grad:linear-gradient(135deg,#ff5e8a,#c026d3);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  html,body{background:var(--bg);color:#fff;min-height:100%;}
  body{overscroll-behavior-y:none;}
  ::-webkit-scrollbar{display:none;}
  button{cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
  input,textarea{font-size:16px;color:#fff;outline:none;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top);}

  /* utils */
  .wrap{padding:12px 16px 110px;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .center{justify-content:center;}
  .gap2{gap:8px;} .gap3{gap:12px;} .gap4{gap:16px;}
  .col{display:flex;flex-direction:column;}
  .flex1{flex:1;}
  .mt2{margin-top:8px;} .mt3{margin-top:12px;} .mt4{margin-top:16px;} .mt6{margin-top:24px;}
  .mb2{margin-top:0;margin-bottom:8px;} .mb3{margin-bottom:12px;} .mb4{margin-bottom:16px;}
  .muted{color:var(--muted);} .muted2{color:var(--muted2);}
  .small{font-size:12px;} .xs{font-size:11px;} .tiny{font-size:10px;}
  .b{font-weight:700;} .sb{font-weight:600;}
  .center-t{text-align:center;}
  .amber{color:var(--amber);} .rose{color:var(--rose);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:24px;
    backdrop-filter:blur(8px);}
  .p4{padding:16px;} .p5{padding:20px;} .p6{padding:24px;}

  .btn{border-radius:18px;padding:14px;font-weight:600;width:100%;transition:transform .1s,opacity .2s;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{transform:scale(.99);}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(192,38,211,.25);}
  .btn-ghost{background:var(--card2);border:1px solid var(--line);}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .btn-sm{width:auto;padding:8px 16px;font-size:13px;border-radius:14px;}

  .input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:18px;
    padding:14px 16px;transition:border-color .2s;}
  .input:focus{border-color:rgba(255,94,138,.6);}
  .input::placeholder{color:var(--muted2);}
  textarea.input{resize:none;}

  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.08em;padding:5px 10px;border-radius:999px;}

  /* countdown */
  .count{position:relative;overflow:hidden;border-radius:24px;padding:20px;
    background:linear-gradient(135deg,#3a1c3f 0%,#57223f 55%,#7a2a3a 100%);}
  .count .cake{position:absolute;right:-16px;top:-24px;font-size:120px;opacity:.15;}

  /* partner switch */
  .switch{display:flex;gap:4px;padding:6px;position:relative;}
  .switch .seg{flex:1;border-radius:16px;padding:10px 12px;display:flex;align-items:center;
    justify-content:center;gap:8px;font-weight:600;font-size:14px;transition:all .3s;opacity:.5;}
  .switch .seg.on{opacity:1;background:linear-gradient(90deg,rgba(255,94,138,.9),rgba(192,38,211,.8));
    box-shadow:0 8px 20px rgba(255,94,138,.2);}
  .switch .cap{position:absolute;left:50%;transform:translateX(-50%);top:-8px;font-size:9px;
    text-transform:uppercase;letter-spacing:.2em;color:var(--muted2);}

  /* wheel */
  .wheel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .wheel button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;
    border-radius:16px;background:rgba(255,255,255,.04);transition:transform .1s,background .2s;}
  .wheel button:active{transform:scale(.95);background:rgba(255,255,255,.1);}
  .wheel .ic{font-size:20px;} .wheel .lb{font-size:10px;color:rgba(255,255,255,.7);text-align:center;line-height:1;}

  /* checkbox */
  .chk{width:24px;height:24px;border-radius:999px;border:2px solid rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
  .chk.on{background:var(--rose);border-color:var(--rose);}
  .strike{text-decoration:line-through;color:var(--muted);}

  /* toast */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;
    background:rgba(0,0,0,.82);backdrop-filter:blur(8px);border:1px solid var(--line);
    border-radius:16px;padding:12px 16px;font-size:14px;display:flex;align-items:center;gap:8px;
    animation:pop .2s ease;}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}

  /* bottom nav */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid var(--line);
    background:rgba(23,18,27,.92);backdrop-filter:blur(20px);padding-bottom:env(safe-area-inset-bottom);}
  .nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;
    color:var(--muted);transition:color .2s;}
  .nav button.on{color:var(--rose);}
  .nav .ic{font-size:18px;line-height:1;} .nav .lb{font-size:10px;font-weight:500;}

  /* splash */
  .splash{max-width:480px;margin:0 auto;min-height:100vh;padding:0 24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  .logo{width:80px;height:80px;margin:0 auto;border-radius:24px;display:flex;align-items:center;
    justify-content:center;font-size:40px;background:var(--grad);}
  .code-big{font-size:34px;font-weight:700;letter-spacing:.3em;color:#ffa7c0;}
  .fullw{width:100%;}
  .avatar{width:24px;height:24px;border-radius:999px;object-fit:cover;}

  /* ===== Желания (redesign) ===== */
  .add-wish{width:100%;border-radius:20px;padding:16px;font-weight:700;font-size:15px;color:#fff;
    background:var(--grad);box-shadow:0 10px 26px rgba(192,38,211,.30);display:flex;align-items:center;
    justify-content:center;gap:8px;transition:transform .12s;}
  .add-wish:active{transform:scale(.98);}
  .filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0;margin:14px 0 4px;}
  .filters .f{flex:0 0 auto;border:1px solid var(--line);background:var(--card2);color:var(--muted);
    border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;transition:all .2s;white-space:nowrap;}
  .filters .f.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(255,94,138,.25);}
  .wcard{position:relative;display:flex;align-items:center;gap:13px;border-radius:22px;padding:14px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.28);margin-bottom:12px;
    overflow:hidden;animation:win .32s ease both;}
  .wcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--wc,#ff5e8a);opacity:.9;}
  .wcard.done{opacity:.62;}
  @keyframes win{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .wcat{width:52px;height:52px;flex:0 0 auto;border-radius:16px;display:flex;align-items:center;
    justify-content:center;font-size:26px;background:var(--wcb,rgba(255,94,138,.16));}
  .wbody{flex:1;min-width:0;}
  .wttl{font-size:15px;font-weight:600;line-height:1.25;}
  .wttl.done{text-decoration:line-through;color:var(--muted);}
  .wmeta{display:flex;align-items:center;gap:7px;margin-top:6px;flex-wrap:wrap;}
  .chipx{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
    padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);}
  .chipx.gold{background:rgba(251,191,36,.13);color:#fcd34d;}
  .chipx.new{background:rgba(96,165,250,.14);color:#93c5fd;}
  .chipx.taken{background:rgba(251,191,36,.14);color:#fcd34d;}
  .chipx.doneb{background:rgba(52,211,153,.14);color:#6ee7b7;}
  .wact{flex:0 0 auto;border-radius:14px;padding:10px 13px;font-size:13px;font-weight:700;
    display:flex;align-items:center;gap:5px;transition:transform .12s;}
  .wact:active{transform:scale(.94);}
  .wact.take{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(255,94,138,.28);}
  .wact.fin{background:rgba(52,211,153,.16);color:#6ee7b7;border:1px solid rgba(52,211,153,.3);}
  .wcheck{width:40px;height:40px;flex:0 0 auto;border-radius:999px;display:flex;align-items:center;
    justify-content:center;font-size:18px;background:rgba(52,211,153,.16);color:#6ee7b7;}
  .wcard.pop{animation:wpop .55s ease;}
  @keyframes wpop{0%{transform:scale(1);}30%{transform:scale(1.035);}60%{transform:scale(.99);}100%{transform:scale(1);}}
  .burst{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;
    font-size:34px;animation:bst .7s ease forwards;}
  @keyframes bst{0%{opacity:0;transform:scale(.4);}35%{opacity:1;transform:scale(1.1);}100%{opacity:0;transform:scale(1.4);}}
  /* пустое состояние */
  .wempty{text-align:center;padding:36px 20px;}
  .wempty .ill{width:96px;height:96px;margin:0 auto 16px;border-radius:30px;display:flex;align-items:center;
    justify-content:center;font-size:46px;background:radial-gradient(circle at 50% 35%,rgba(255,94,138,.28),rgba(192,38,211,.10));
    box-shadow:inset 0 0 40px rgba(255,94,138,.15);}
  /* модалка добавления */
  .ovl{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .sheet{width:100%;max-width:480px;background:#1c1622;border:1px solid var(--line);
    border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    animation:up .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .grabber{width:38px;height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin:0 auto 14px;}
  .catgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px;}
  .catopt{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:rgba(255,255,255,.05);border:2px solid transparent;transition:all .15s;}
  .catopt.on{border-color:var(--rose);background:rgba(255,94,138,.14);transform:scale(1.04);}
  .ptrow{display:flex;gap:8px;margin-top:6px;}
  .ptchip{flex:1;text-align:center;border-radius:12px;padding:10px 0;font-weight:700;font-size:14px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);}
  .ptchip.on{background:rgba(251,191,36,.15);color:#fcd34d;border-color:rgba(251,191,36,.4);}
  @media (prefers-reduced-motion:reduce){.wcard,.sheet,.ovl,.burst,.wcard.pop{animation:none;}}

  /* ===== Уровни / достижения / повышение ===== */
  .lvl-road{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:2px;}
  .lvl-node{flex:0 0 auto;width:66px;text-align:center;opacity:.9;}
  .lvl-node .lvl-emo{width:46px;height:46px;margin:0 auto;border-radius:14px;display:flex;align-items:center;
    justify-content:center;font-size:22px;background:rgba(255,255,255,.05);border:1px solid var(--line);}
  .lvl-node.cur .lvl-emo{background:var(--grad);border-color:transparent;box-shadow:0 6px 16px rgba(255,94,138,.35);}
  .lvl-node.lk{opacity:.42;}
  .lvl-node .lvl-nm{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.1;}
  .lvl-node.cur .lvl-nm{color:#fff;font-weight:600;}
  .achv-earned{color:#6ee7b7;}
  /* повышение уровня */
  .lvup{width:100%;max-width:420px;margin:0 16px;background:#1c1622;border:1px solid var(--line);
    border-radius:28px;padding:28px 22px calc(24px + env(safe-area-inset-bottom));text-align:center;
    position:relative;overflow:hidden;animation:up .35s cubic-bezier(.2,.8,.2,1);}
  .conf-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .conf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:.9;
    animation:conffall 1.4s linear forwards;}
  @keyframes conffall{0%{transform:translateY(-10px) rotate(0);opacity:1;}
    100%{transform:translateY(460px) rotate(540deg);opacity:0;}}
  @media (prefers-reduced-motion:reduce){.conf{display:none;}.lvup{animation:none;}}

  /* ===== Кастомизация ===== */
  .thm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .thm{position:relative;height:74px;border-radius:18px;border:2px solid transparent;overflow:hidden;
    display:flex;align-items:flex-end;padding:9px;transition:transform .12s;}
  .thm:active{transform:scale(.97);}
  .thm.sel{border-color:#fff;}
  .thm.lk{filter:grayscale(.7) brightness(.6);}
  .thm-nm{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .thm-check{position:absolute;top:8px;right:9px;font-size:14px;color:#fff;}
  .thm-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .frm{width:100%;display:flex;align-items:center;justify-content:space-between;border-radius:16px;
    padding:14px 16px;margin-top:8px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600;}
  .frm.sel{border-color:var(--rose);background:rgba(255,94,138,.08);}
  .frm.lk{opacity:.5;}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   PARA — приложение для пары. Чистый JS + CSS, без внешних
   зависимостей (открывается где угодно, даже офлайн).
   • Внутри Telegram — работает как Mini App (авторизация по
     TG-аккаунту, кнопка «на экран Домой» через addToHomeScreen).
   • В браузере — как PWA (Safari → «На экран Домой»).
   Внутри Telegram (при настроенном api/para.js + Supabase + бот)
   пара связывается по-настоящему: код-приглашение соединяет два
   аккаунта, вопрос дня с async-разблокировкой, пуши партнёру.
   Вне Telegram или без ключей — локальный демо-режим (localStorage).
   ============================================================ */
(function(){
'use strict';

// ---------- Telegram ----------
var TG = (window.Telegram && window.Telegram.WebApp) || null;
if (TG) { try { TG.ready(); TG.expand(); TG.setHeaderColor && TG.setHeaderColor('#17121b'); } catch(e){} }
var TG_BOT = 'para_couple_bot';
var TG_USER = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user) || null;
var START_PARAM = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param)
  || new URLSearchParams(location.search).get('startapp')
  || new URLSearchParams(location.search).get('code') || '';

function haptic(type){
  type = type || 'light';
  try{
    if (TG && TG.HapticFeedback){
      if (type==='success'||type==='error'||type==='warning') TG.HapticFeedback.notificationOccurred(type);
      else TG.HapticFeedback.impactOccurred(type);
    } else if (navigator.vibrate) navigator.vibrate(10);
  }catch(e){}
}

// ---------- backend (Supabase через serverless /api/para) ----------
// Настоящая связь пары работает только внутри Telegram: подпись initData
// подтверждает личность на сервере. Вне Telegram (браузер/Artifact) — ONLINE=false,
// приложение работает локально в демо-режиме.
var INIT_DATA = (TG && TG.initData) || '';
var CAN_ONLINE = !!INIT_DATA;           // есть подписанные данные Telegram
var ONLINE = false;                     // подтверждено, что бэкенд отвечает
var NET_NOTE = '';                      // мягкая подсказка, если бэкенд не настроен
async function api(action, payload){
  var body = Object.assign({ action: action, initData: INIT_DATA }, payload || {});
  var r = await fetch('/api/para', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  var j = await r.json().catch(function(){ return { ok:false, reason:'parse' }; });
  return j;
}
// событие для аналитики (квесты, очки) — только онлайн, «выстрелил и забыл»
function track(type, amount){ if(!ONLINE) return; try{ api('track',{type:type,amount:amount||0}); }catch(e){} }

// ---------- storage ----------
function lsGet(k,d){ try{var v=localStorage.getItem('para_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;} }
function lsSet(k,v){ try{localStorage.setItem('para_'+k,JSON.stringify(v));}catch(e){} }

// ---------- dates ----------
var DAY=86400000;
function sod(d){var x=new Date(d);x.setHours(0,0,0,0);return x;}
function daysAnnual(m,day){
  var now=sod(new Date()),y=now.getFullYear();
  var next=sod(new Date(y,m-1,day));
  if(next<now) next=sod(new Date(y+1,m-1,day));
  return Math.round((next-now)/DAY);
}
function plural(n,f){var a=Math.abs(n)%100,b=a%10;
  if(a>10&&a<20)return f[2]; if(b>1&&b<5)return f[1]; if(b===1)return f[0]; return f[2];}
function daysWord(n){return plural(n,['день','дня','дней']);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// ---------- questions / wheel ----------
var QUESTIONS=[
  'Какой момент этой недели вдвоём был лучшим?',
  'За что ты благодарен/благодарна мне сегодня?',
  'О чём ты мечтаешь, но ещё не сказал(а) вслух?',
  'Что бы ты хотел(а) сделать вместе в эти выходные?',
  'Какая мелочь во мне тебя радует?'
];
function questionOfDay(){
  var idx=Math.floor(sod(new Date()).getTime()/DAY)%QUESTIONS.length;
  return {idx:idx,text:QUESTIONS[idx]};
}
var WHEEL=[
  {icon:'⚡',label:'Быстро',hint:'мини-свидание на 15 минут'},
  {icon:'💬',label:'Твой ответ',hint:'предложи своё'},
  {icon:'⭐',label:'Желание',hint:'из списка желаний'},
  {icon:'🗺️',label:'Квест',hint:'задание для двоих'},
  {icon:'🎟️',label:'Купон',hint:'обменять очки'}
];

function makeCode(){
  var abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';
  for(var i=0;i<6;i++) s+=abc[Math.floor(Math.random()*abc.length)];
  return s;
}

// ---------- Кастомизация (fallback, если конфиг с сервера не пришёл) ----------
var BUILT_IN_THEMES=[
  {key:'rose',name:'Розовый рассвет',level:0,grad:'linear-gradient(135deg,#ff5e8a,#c026d3)',rose:'#ff5e8a',fuchsia:'#c026d3'},
  {key:'sunset',name:'Закат',level:1,grad:'linear-gradient(135deg,#fb7185,#f59e0b)',rose:'#fb7185',fuchsia:'#f59e0b'},
  {key:'ocean',name:'Океан',level:1,grad:'linear-gradient(135deg,#22d3ee,#3b82f6)',rose:'#38bdf8',fuchsia:'#3b82f6'},

  var lvlName=function(i){ var L=(S.config&&S.config.levels)||[]; return (L[i]&&L[i].name)||('уровня '+(i+1)); };
  var sorted=S.quests.slice().sort(function(a,b){ return (a.level||0)-(b.level||0); });
  var items=sorted.map(function(q){
    var need=q.level||0, locked=need>lvl;
    if(locked){
      return '<div class="card p4 row gap3 mb3" style="opacity:.55">'+
        '<div class="flex1"><div class="small">'+esc(q.text)+'</div>'+
        '<div class="xs muted2 mt2">🔒 Доступно на уровне «'+esc(lvlName(need))+'»</div></div>'+
        '<div class="wcheck" style="background:rgba(255,255,255,.05);color:var(--muted)">🔒</div></div>';
    }
    return '<div class="card p4 row gap3 mb3"'+(q.done?' style="opacity:.5"':'')+'>'+
      '<div class="flex1"><div class="small">'+esc(q.text)+'</div>'+

// ---------- Полная админка (overlay внутри приложения) ----------
function admCumulative(series){ var t=0; return (series||[]).map(function(p){ t+=p.v; return {date:p.date,v:t}; }); }
function admLine(series, color){
  series=series||[]; var W=680,H=120,pad=8,n=series.length;
  if(!n) return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:96px"></svg>';
  var max=Math.max(1,series.reduce(function(m,p){return Math.max(m,p.v);},0));
  var pts=series.map(function(p,i){ var x=pad+(W-2*pad)*(i/((n-1)||1)); var y=H-pad-(H-2*pad)*(p.v/max); return [x,y]; });
  var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var area=line+' L'+pts[n-1][0].toFixed(1)+' '+(H-pad)+' L'+pts[0][0].toFixed(1)+' '+(H-pad)+' Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:96px">'+
    '<path d="'+area+'" fill="'+color+'" opacity="0.12"/>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
}
function admBars(series, color){
  series=series||[]; var W=680,H=120,pad=8,n=series.length||1;
  var max=Math.max(1,series.reduce(function(m,p){return Math.max(m,p.v);},0));
  var bw=(W-2*pad)/n, bars='';
  series.forEach(function(p,i){ var h=(H-2*pad)*(p.v/max); bars+='<rect x="'+(pad+i*bw+bw*0.15).toFixed(1)+'" y="'+(H-pad-h).toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.5" fill="'+color+'"/>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:96px">'+bars+'</svg>';
}

  'set-theme':function(el){ var lv=+el.dataset.lv||0; if(lv>curLevelIdx()){ alert('🔒 Тема откроется на уровне ниже. Доступно после '+lv+'-го уровня пары.'); return; } S.theme=el.dataset.k; lsSet('theme',S.theme); applyTheme(S.theme); haptic('success'); render(); },
  'set-frame':function(el){ var lv=+el.dataset.lv||0; if(lv>curLevelIdx()){ alert('🔒 Рамка откроется на уровне выше. Доступно после '+lv+'-го уровня пары.'); return; } S.frame=el.dataset.k; lsSet('frame',S.frame); haptic('success'); render(); },
  'lvl-info':function(el){ var i=+el.dataset.i, lv=S.config&&S.config.levels[i], cur=S.progress&&S.progress.level.index; if(!lv)return; if(i>cur){ var perks=(lv.perks||[]).join(', '); alert('🔒 «'+lv.name+'» '+lv.emoji+'\nДоступно после '+lv.min+' очков.'+(perks?'\n\nОткроется: '+perks:'')); } haptic('light'); },
  'level-continue':function(){ S.levelup=null; haptic('light'); render(); },
  'ob-share':shareInvite,
  'ob-create-confirm':function(){ if(CAN_ONLINE) onlineCreate(); else { S.ob.waiting=true; render(); setTimeout(function(){finishPairing('Татьяна');},700); } },
  'ob-join-confirm':function(){ var c=(val('#ob-code')||'').toUpperCase().trim(); if(c.length<4)return; if(CAN_ONLINE) onlineJoin(c); else { S.ob.waiting=true; render(); setTimeout(function(){finishPairing('Татьяна');},700); } },
  'tab':function(el){ S.tab=el.dataset.tab; save('tab'); haptic('light'); render(); if(S.tab==='us') loadStats(); },
  'who':function(el){ S.who=el.dataset.who; save('who'); haptic('light'); render(); },
  'answer':function(){ var t=(val('#qa')||'').trim(); if(!t)return; if(ONLINE) onlineAnswer(t); else { var k=todayKey(); if(!S.answers[k])S.answers[k]={}; S.answers[k][S.who]=t; save('answers'); S.points+=10; save('points'); haptic('success'); render(); } },
  'wfilter':function(el){ S.wfilter=el.dataset.f; haptic('light'); render(); },
  'wish-open-add':function(){ S.wmodal={cat:'❤️',points:20}; haptic('light'); render(); },
  'wish-cancel':function(){ S.wmodal=null; render(); },
  'wish-cat':function(el){ if(S.wmodal){ S.wmodal.text=val('#wtitle')||S.wmodal.text||''; S.wmodal.cat=el.dataset.e; haptic('light'); render(); } },
  'wish-pts':function(el){ if(S.wmodal){ S.wmodal.text=val('#wtitle')||S.wmodal.text||''; S.wmodal.points=+el.dataset.p; haptic('light'); render(); } },
  'wish-save':function(){ var t=(val('#wtitle')||'').trim(); if(!t){ var el=document.getElementById('wtitle'); if(el)el.focus(); return; } var m=S.wmodal||{}; S.wishes.unshift({id:Date.now(),by:(ONLINE?'me':S.who),text:t,category:m.cat||'❤️',points:m.points||20,status:'new'}); save('wishes'); S.wmodal=null; haptic('success'); render(); },
  'wish-take':function(el){ var id=+el.dataset.id; S.wishes=S.wishes.map(function(w){return w.id===id?Object.assign({},normWish(w),{status:'taken'}):w;}); save('wishes'); haptic('light'); render(); },
  'wish-done':function(el){ var id=+el.dataset.id; var pts=0; S.wishes=S.wishes.map(function(w){ if(w.id===id){ var n=normWish(w); pts=n.points; return Object.assign({},n,{status:'done'}); } return w; }); S.points+=pts; save('wishes'); save('points'); track('wish'); track('points',pts); S.justDone=id; haptic('success'); render(); afterEarn(); setTimeout(function(){ S.justDone=null; render(); },900); },
  'quest-done':function(el){ var id=+el.dataset.id; var changed=false; S.quests=S.quests.map(function(q){ if(q.id===id&&!q.done){changed=true;S.points+=q.pts; track('quest'); track('points',q.pts); return Object.assign({},q,{done:true});} return q;}); if(changed){save('quests');save('points');haptic('success');afterEarn();} render(); },
  'wheel':function(el){ var w=WHEEL[+el.dataset.i]; S.toast=w; haptic('light'); render(); setTimeout(function(){S.toast=null;render();},2200); },
  'home-add':function(){ try{TG.addToHomeScreen();haptic('light');}catch(e){} },
  'reset':function(){ S.couple=null; S.tab='today'; S.who='me'; S.ob={step:'welcome',mode:null,name:(TG_USER?(TG_USER.first_name||'Ты'):''),myCode:makeCode(),code:'',waiting:false}; save('couple'); save('tab'); save('who'); haptic('warning'); render(); }
};

// ============================================================
//  ОНЛАЙН (бэкенд): настоящая пара внутри Telegram
// ============================================================
function enterOnline(couple){
  ONLINE=true; S.couple=coupleFromServer(couple); save('couple');
  S.ob.waiting=false; S.ob.err=''; haptic('success'); render();
  refreshState(); // подтянуть вопрос дня и ответы
}
async function refreshState(){
  try{
    var r=await api('state');
    if(r&&r.ok&&r.couple){ ONLINE=true; S.couple=coupleFromServer(r.couple); if(r.today)S.srvToday=r.today;
      if(r.progress)S.progress=r.progress; if(r.config)S.config=r.config; render(); checkLevelUp(); }
  }catch(e){}
}
// после начисления очков — подтянуть прогресс с сервера (немного погодя, чтобы событие успело записаться)
function afterEarn(){ if(!ONLINE) return; setTimeout(refreshState, 700); }
// показать экран повышения уровня, если пара поднялась выше запомненного
function checkLevelUp(){
  if(!S.progress||!S.progress.level) return;
  var seen=lsGet('seenLevel',0), idx=S.progress.level.index;
  if(idx>seen){
    S.levelup=S.progress.level; lsSet('seenLevel',idx);
    try{ if(navigator.vibrate) navigator.vibrate([40,60,40,60,140]); }catch(e){}
    haptic('success'); render();
  } else if(seen>idx){ lsSet('seenLevel',idx); } // сброс (например «сменить пару»)
}
async function onlineCreate(){
  S.ob.waiting=true; render();
  try{
    var r=await api('pair_create');
    if(r&&r.ok&&r.couple){ enterOnline(r.couple); return; }
    if(r&&r.reason==='not_configured'){ finishPairing('Татьяна'); return; } // бэкенд не настроен → демо
    S.ob.waiting=false; S.ob.mode='create'; S.ob.err='Не удалось создать пару'; render();
  }catch(e){ S.ob.waiting=false; S.ob.mode='create'; S.ob.err='Сеть недоступна'; render(); }
}
async function onlineJoin(code){
  S.ob.waiting=true; S.ob.err=''; render();
  try{
    var r=await api('pair_join',{code:code});
    if(r&&r.ok&&r.couple){ enterOnline(r.couple); return; }
    if(r&&r.reason==='not_configured'){ finishPairing('Татьяна'); return; }
    var m={not_found:'Код не найден',couple_full:'В этой паре уже двое',already_paired:'Ты уже в паре',bad_code:'Неверный код'};
    S.ob.waiting=false; S.ob.err=(r&&m[r.reason])||'Не удалось присоединиться'; render();
  }catch(e){ S.ob.waiting=false; S.ob.err='Сеть недоступна'; render(); }
}
async function onlineAnswer(text){
  try{
    var r=await api('answer',{text:text});
    if(r&&r.ok&&r.today){ S.srvToday=r.today; S.points+=10; save('points'); track('points',10); haptic('success'); afterEarn(); }
    render();
  }catch(e){ render(); }
}
async function loadStats(){
  if(!ONLINE) return;
  try{ var r=await api('stats'); if(r&&r.ok){ S.stats=r.stats; render(); } }catch(e){}
}
async function boot(){
  render(); // мгновенно показываем интерфейс (демо/онбординг)
  if(!CAN_ONLINE) return; // вне Telegram — локальный демо-режим
  try{
    var r=await api('state');
    if(r&&r.ok){
      ONLINE=true;
      if(r.couple){ S.couple=coupleFromServer(r.couple); if(r.today)S.srvToday=r.today;
        if(r.progress)S.progress=r.progress; if(r.config)S.config=r.config; }
      else { S.couple=null; } // сервер — источник правды: онбординг с настоящим бэкендом
      render();
      checkLevelUp();
      loadStats(); // если ты админ (ADMIN_TG_IDS) — подтянется статистика
    } // not_configured / ошибка → тихо остаёмся в демо
  }catch(e){}
}

// закрытие модалки по тапу на фон (вызывается из inline onclick оверлея)
window.__paraModalClose=function(){ S.wmodal=null; render(); };
try{ applyTheme(S.theme); }catch(e){} // применить выбранную тему при запуске

document.getElementById('root').addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el)return;
  var fn=ACTS[el.dataset.act]; if(fn){ e.preventDefault(); fn(el); }
});

// пришли по ссылке-приглашению → сразу к вводу кода
if(START_PARAM && !S.couple){
  S.ob.step='pair'; S.ob.mode='join'; S.ob.code=START_PARAM.toUpperCase().slice(0,6);
}

boot();
})();
</script>
