<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#080A0C" id="metaTheme" />
<meta name="description" content="Про Барбер — CRM и рабочий кабинет барбера: клиенты, записи, услуги, расписание и деньги в одном месте." />
<title>Про Барбер — кабинет барбера</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- версию фиксируем: без неё CDN однажды отдаст следующий мажор,
     и приложение перестанет компилироваться без единой нашей правки -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ==================================================================
     ПРО БАРБЕР · DESIGN SYSTEM (v1)
     ------------------------------------------------------------------
     Рабочий кабинет барбера. Не витрина и не лендинг: клиенты, записи,
     услуги, расписание и деньги — в одном месте. Ощущение инструмента,
     за который платят каждый месяц.

     ТЕМЫ     Dark (почти чёрный графит) — основная, Light (белый и
              молочные поверхности). Одни и те же токены, разные
              значения: интерфейс один, меняется только тема.
     АКЦЕНТ   Золото / янтарь. Цвет только там, где помогает читать:
              деньги, статус, действие.
     ТИПО     Inter, tabular-nums для чисел.
     РАДИУСЫ  10 / 12 / 14 / 18 / 999
     СЕТКА    4pt, отступы 16–24, сайдбар 244px
     ДВИЖЕНИЕ только transform/opacity, ease-out, 120–280ms
     ================================================================== -->
<style>
  :root{
    /* ── акцент: общий для обеих тем ── */
    --gold:#F5A623; --gold-2:#FFAA1A; --gold-3:#D98B12; --gold-ink:#150F04;
    --pos:#35C07A; --warn:#F5A623; --neg:#EF5B52; --info:#4A9BE8;

    /* ── геометрия ── */
    --r-xs:8px; --r-sm:10px; --r-md:12px; --r-lg:14px; --r-xl:18px; --r-pill:999px;
    --side:250px; --nav-h:62px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --ease:cubic-bezier(.16,1,.3,1);
    --fast:.16s var(--ease); --slow:.28s var(--ease);
  }

  /* ── DARK (основная) ── */
  :root, html[data-theme="dark"]{
    --bg:#080A0C; --bg-2:#0C0E10;
    --surface:#111416; --surface-2:#171A1D; --surface-3:#1E2225;
    --ink:#F4F6F7; --ink-2:#9AA3AA; --ink-3:#6E7880; --ink-4:#495158;
    --line:#1C2024; --line-2:#272C31;
    --gold-soft:rgba(245,166,35,.12); --gold-soft-2:rgba(245,166,35,.22);
    --pos-soft:rgba(53,192,122,.14); --neg-soft:rgba(239,91,82,.14); --info-soft:rgba(74,155,232,.14);
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.3);
    --shadow-lg:0 24px 64px rgba(0,0,0,.6);
    --scrim:rgba(3,5,6,.74);
    --track:#22272B;
  }

  /* ── LIGHT ── */
  /* Светлая — не инверсия тёмной, а свой набор: белый лист, светло-серые
     карточки и тонкие границы. Серый тёплый, без синевы: холодный серый
     на белом читается как «грязный». */
  html[data-theme="light"]{
    --bg:#FFFFFF; --bg-2:#FFFFFF;
    --surface:#F7F7F5; --surface-2:#F1F2F3; --surface-3:#E8E9EA;
    --ink:#0E1113; --ink-2:#5A6167; --ink-3:#878E94; --ink-4:#B0B5B9;
    --line:#ECEDEB; --line-2:#DEDFDD;
    --gold-soft:rgba(245,166,35,.14); --gold-soft-2:rgba(245,166,35,.26);
    --pos-soft:rgba(30,140,84,.12); --neg-soft:rgba(206,60,50,.10); --info-soft:rgba(38,112,190,.12);
    --pos:#1E8C54; --neg:#CE3C32; --info:#2670BE;
    --shadow:0 1px 2px rgba(14,17,19,.04), 0 4px 14px rgba(14,17,19,.05);
    --shadow-lg:0 20px 50px rgba(14,17,19,.14);
    --scrim:rgba(14,17,19,.36);
    --track:#E4E5E6;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum" 0;
    transition:background var(--fast), color var(--fast);
  }
  h1,h2,h3,h4,p{margin:0}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer; background:none; border:0; padding:0}
  a{color:inherit; text-decoration:none}
  ::selection{background:var(--gold-soft-2)}
  .num{font-variant-numeric:tabular-nums}
  .cut{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* скроллбары — тонкие, в цвет темы */
  *{scrollbar-width:thin; scrollbar-color:var(--line-2) transparent}
  *::-webkit-scrollbar{width:8px; height:8px}
  *::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:999px}
  *::-webkit-scrollbar-track{background:transparent}

  /* ══ ОБОЛОЧКА ══ */
  .app{display:flex; min-height:100vh}
  .side{
    width:var(--side); flex:0 0 var(--side); position:sticky; top:0; height:100vh;
    background:var(--bg-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:24px 16px 16px; z-index:40;
  }
  .brand{display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 8px 22px}
  .brand-mark{width:52px; height:52px; color:var(--gold)}
  .brand-name{font-size:19px; font-weight:800; letter-spacing:-.01em}
  .brand-sub{font-size:11px; color:var(--ink-3); text-align:center; line-height:1.35; max-width:180px}
  .nav{display:flex; flex-direction:column; gap:2px; flex:1; overflow:auto; margin:0 -4px; padding:0 4px}
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:var(--r-md);
    color:var(--ink-2); font-weight:500; width:100%; text-align:left;
    transition:background var(--fast), color var(--fast);
  }
  .nav-item svg{width:19px; height:19px; flex:0 0 19px}
  .nav-item:hover{background:var(--surface-2); color:var(--ink)}
  .nav-item.on{background:var(--gold-soft); color:var(--gold); font-weight:600}
  .nav-item.on svg{color:var(--gold)}
  .nav-badge{
    margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:999px;
    background:var(--gold); color:var(--gold-ink); font-size:11px; font-weight:700;
    display:grid; place-items:center;
  }
  .side-user{
    display:flex; align-items:center; gap:10px; padding:11px 12px; margin-top:12px; width:100%;
    border:1px solid var(--line); border-radius:var(--r-lg); background:var(--surface);
    transition:border-color var(--fast), background var(--fast);
  }
  .side-user:hover{border-color:var(--line-2); background:var(--surface-2)}
  .side-user .nm{font-weight:600; font-size:12.5px; letter-spacing:-.01em}
  .side-user .rl{font-size:11px; color:var(--ink-3)}
  .side-user svg.chev{width:16px; height:16px; color:var(--ink-3); margin-left:auto}

  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .page{padding:26px 30px 40px; max-width:1320px; width:100%; margin:0 auto; flex:1}
  .page-head{display:flex; align-items:center; gap:14px; margin-bottom:22px; min-height:40px}
  .page-title{font-size:23px; font-weight:700; letter-spacing:-.02em}
  .page-sub{font-size:13px; color:var(--ink-3); margin-top:2px}
  .spacer{flex:1}

  /* ══ КАРТОЧКИ ══ */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-xl);
    box-shadow:var(--shadow);
  }
  html[data-theme="light"] .card{box-shadow:none}
  html[data-theme="light"] .kpi{background:var(--surface)}
  html[data-theme="light"] .input,
  html[data-theme="light"] .select,
  html[data-theme="light"] .area{background:#FFFFFF}
  html[data-theme="light"] .segm{background:var(--surface-2)}
  html[data-theme="light"] .segm button.on{background:#FFFFFF}
  html[data-theme="light"] .btn-ghost{background:#FFFFFF}
  html[data-theme="light"] .modal{box-shadow:var(--shadow-lg)}
  .card-pad{padding:18px 20px}
  .card-head{display:flex; align-items:center; gap:10px; padding:16px 20px 0}
  .card-title{font-size:15px; font-weight:650; letter-spacing:-.01em}
  .card-note{font-size:12px; color:var(--ink-3)}
  .sep{height:1px; background:var(--line); border:0; margin:0}

  .grid{display:grid; gap:16px}
  .g-kpi{grid-template-columns:repeat(4,1fr)}
  .g-2{grid-template-columns:repeat(2,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-main{grid-template-columns:minmax(0,1.32fr) minmax(0,1fr)}

  /* KPI */
  .kpi{padding:16px 18px 15px; display:flex; flex-direction:column; gap:2px}
  .kpi-ico{
    width:34px; height:34px; border-radius:var(--r-sm); display:grid; place-items:center;
    background:var(--gold-soft); color:var(--gold); margin-bottom:10px;
  }
  .kpi-ico svg{width:18px; height:18px}
  .kpi-label{font-size:12px; color:var(--ink-2)}
  .kpi-value{font-size:26px; font-weight:750; letter-spacing:-.03em; line-height:1.15}
  .kpi-note{font-size:11px; color:var(--ink-3)}

  /* ══ КНОПКИ ══ */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:40px; padding:0 16px; border-radius:var(--r-md); font-weight:600; font-size:13.5px;
    border:1px solid transparent; white-space:nowrap;
    transition:background var(--fast), border-color var(--fast), color var(--fast), transform .1s var(--ease), opacity var(--fast);
  }
  .btn svg{width:17px; height:17px; flex:0 0 17px}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45; pointer-events:none}
  .btn-gold{background:var(--gold); color:var(--gold-ink)}
  .btn-gold:hover{background:var(--gold-2)}
  .btn-ghost{border-color:var(--line-2); color:var(--ink); background:var(--surface)}
  .btn-ghost:hover{background:var(--surface-2); border-color:var(--ink-4)}
  .btn-soft{background:var(--surface-2); color:var(--ink)}
  .btn-soft:hover{background:var(--surface-3)}
  .btn-line{border:1px dashed var(--line-2); color:var(--gold); background:transparent}
  .btn-line:hover{background:var(--gold-soft); border-color:var(--gold)}
  .btn-danger{background:var(--neg-soft); color:var(--neg)}
  .btn-danger:hover{background:var(--neg); color:#fff}
  .btn-sm{height:32px; padding:0 12px; font-size:12.5px; border-radius:var(--r-sm)}
  .btn-sm svg{width:15px; height:15px; flex:0 0 15px}
  .btn-lg{height:46px; padding:0 22px; font-size:14.5px}
  .btn-block{width:100%}
  .icon-btn{
    width:38px; height:38px; border-radius:var(--r-md); display:grid; place-items:center;
    color:var(--ink-2); border:1px solid transparent; transition:background var(--fast), color var(--fast);
  }
  .icon-btn svg{width:18px; height:18px}
  .icon-btn:hover{background:var(--surface-2); color:var(--ink)}
  .icon-btn.bord{border-color:var(--line); background:var(--surface)}

  /* ══ ЗНАЧКИ ══ */
  .badge{
    display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px;
    border-radius:var(--r-pill); font-size:11.5px; font-weight:600; white-space:nowrap;
  }
  .badge.pos{background:var(--pos-soft); color:var(--pos)}
  .badge.gold{background:var(--gold-soft); color:var(--gold)}
  .badge.neg{background:var(--neg-soft); color:var(--neg)}
  .badge.info{background:var(--info-soft); color:var(--info)}
  .badge.mute{background:var(--surface-3); color:var(--ink-3)}
  .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 6px}
  .tag-status{font-size:12px; font-weight:600}
  .tag-status.done{color:var(--pos)} .tag-status.next{color:var(--gold)}
  .tag-status.plan{color:var(--gold)} .tag-status.cancel{color:var(--ink-3); text-decoration:line-through}
  .tag-status.pend{color:var(--info)}

  /* ══ АВАТАР ══ */
  .ava{
    border-radius:50%; background:var(--surface-3); color:var(--ink-2); display:grid; place-items:center;
    font-weight:650; overflow:hidden; flex:none; user-select:none; letter-spacing:.01em;
  }
  .ava img{width:100%; height:100%; object-fit:cover; display:block}
  .ava-ring{padding:3px; border-radius:50%; background:conic-gradient(var(--gold) 0 72%, var(--line) 72% 100%); display:inline-block}
  .ava-ring .ava{border:2px solid var(--surface)}

  /* ══ ПОЛЯ ══ */
  .field{display:flex; flex-direction:column; gap:6px}
  .label{font-size:12px; color:var(--ink-2); font-weight:500}
  .input,.select,.area{
    width:100%; height:42px; padding:0 13px; border-radius:var(--r-md);
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink); outline:none;
    transition:border-color var(--fast), background var(--fast);
  }
  .area{height:auto; padding:11px 13px; min-height:84px; resize:vertical; line-height:1.5}
  .input::placeholder,.area::placeholder{color:var(--ink-4)}
  .input:focus,.select:focus,.area:focus{border-color:var(--gold); background:var(--surface)}
  .select{appearance:none; cursor:pointer; padding-right:34px;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 17px) 19px, calc(100% - 12px) 19px;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  html[data-theme="light"] .select option{background:#fff}
  .select option{background:var(--surface-2); color:var(--ink)}
  .hint{font-size:11.5px; color:var(--ink-3)}
  .err{font-size:11.5px; color:var(--neg)}
  .input.bad,.select.bad{border-color:var(--neg)}
  .search{position:relative; flex:1; min-width:180px; max-width:340px}
  .search .input{padding-left:38px}
  .search svg{position:absolute; left:12px; top:12px; width:17px; height:17px; color:var(--ink-3)}

  /* ── строки настроек ──────────────────────────────────────────
     На телефоне жёсткие ширины не помещаются, поэтому ряд переносится
     на вторую строку, а поля времени тянутся по месту. */
  .set-row{display:flex; align-items:center; gap:14px; padding:12px 0}
  .set-row-main{flex:1; min-width:0}
  .set-row-title{font-size:13.5px; font-weight:550}
  .hours-row{display:flex; align-items:center; gap:10px; padding:9px 0; flex-wrap:wrap}
  .hours-day{width:108px; font-size:13.5px; font-weight:550}
  .hours-times{display:flex; align-items:center; gap:10px}
  .hours-time{width:124px; flex:none}
  .hours-dash{color:var(--ink-3)}
  .photo-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .photo-row .input{flex:1 1 140px; min-width:0}

  .switch{
    width:42px; height:24px; border-radius:999px; background:var(--track); position:relative; flex:none;
    transition:background var(--fast);
  }
  .switch::after{
    content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
    background:#fff; transition:transform var(--fast); box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .switch.on{background:var(--gold)}
  .switch.on::after{transform:translateX(18px)}

  .segm{display:inline-flex; gap:2px; padding:3px; background:var(--surface-2); border-radius:var(--r-md); border:1px solid var(--line)}
  .segm button{
    height:30px; padding:0 13px; border-radius:var(--r-sm); font-size:12.5px; font-weight:600; color:var(--ink-2);
    transition:background var(--fast), color var(--fast);
  }
  .segm button:hover{color:var(--ink)}
  .segm button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
  html[data-theme="dark"] .segm button.on{background:var(--surface-3)}

  .chip{
    height:32px; padding:0 13px; border-radius:var(--r-pill); border:1px solid var(--line);
    background:var(--surface); color:var(--ink-2); font-size:12.5px; font-weight:550;
    display:inline-flex; align-items:center; gap:7px; transition:all var(--fast);
  }
  .chip:hover{border-color:var(--ink-4); color:var(--ink)}
  .chip.on{background:var(--gold-soft); border-color:var(--gold-soft-2); color:var(--gold)}

  /* ══ СПИСКИ / ТАБЛИЦЫ ══ */
  .rows{display:flex; flex-direction:column}
  .row{
    display:flex; align-items:center; gap:12px; padding:12px 20px; width:100%; text-align:left;
    border-left:2px solid transparent; transition:background var(--fast);
  }
  .row + .row{border-top:1px solid var(--line)}
  .row:hover{background:var(--surface-2)}
  .row.hi{background:var(--gold-soft); border-left-color:var(--gold)}
  .row.hi:hover{background:var(--gold-soft-2)}
  .row-time{font-size:13px; font-weight:650; color:var(--ink-2); width:46px; flex:none}
  .row.hi .row-time{color:var(--gold)}
  .row-main{flex:1; min-width:0}
  .row-name{font-size:13.5px; font-weight:600; display:block}
  .row-sub{font-size:12px; color:var(--ink-3); display:block}

  .table{width:100%; border-collapse:collapse}
  .table th{
    text-align:left; font-size:11.5px; font-weight:600; color:var(--ink-3); text-transform:uppercase;
    letter-spacing:.04em; padding:0 14px 10px; white-space:nowrap;
  }
  .table td{padding:12px 14px; border-top:1px solid var(--line); font-size:13.5px; vertical-align:middle}
  .table tbody tr{transition:background var(--fast); cursor:pointer}
  .table tbody tr:hover{background:var(--surface-2)}
  .t-wrap{overflow-x:auto; margin:0 -20px; padding:0 20px}

  /* ══ ПРОГРЕСС ══ */
  .bar{height:6px; border-radius:999px; background:var(--track); overflow:hidden}
  .bar > i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--gold-3),var(--gold-2)); transition:width var(--slow)}

  /* ══ МОДАЛКИ ══ */
  .scrim{
    position:fixed; inset:0; background:var(--scrim); backdrop-filter:blur(3px); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
    animation:fade .16s var(--ease);
  }
  @keyframes fade{from{opacity:0}}
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.985)}}
  @keyframes slide{from{transform:translateX(24px); opacity:0}}
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-xl);
    box-shadow:var(--shadow-lg); width:100%; max-width:520px; max-height:calc(100vh - 48px);
    display:flex; flex-direction:column; animation:pop .2s var(--ease);
  }
  .modal.wide{max-width:720px}
  .modal-head{display:flex; align-items:center; gap:12px; padding:18px 20px 14px; border-bottom:1px solid var(--line)}
  .modal-title{font-size:16px; font-weight:700; letter-spacing:-.01em}
  .modal-body{padding:20px; overflow:auto; display:flex; flex-direction:column; gap:14px}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:10px}
  .f2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .f3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}

  /* ══ ТОСТЫ ══ */
  .toasts{position:fixed; right:20px; bottom:20px; z-index:200; display:flex; flex-direction:column; gap:8px; pointer-events:none}
  .toast{
    display:flex; align-items:center; gap:10px; padding:12px 15px; border-radius:var(--r-md);
    background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-lg);
    font-size:13px; font-weight:500; animation:slide .2s var(--ease); max-width:340px;
  }
  .toast svg{width:17px; height:17px; flex:none; color:var(--gold)}
  .toast.ok svg{color:var(--pos)} .toast.bad svg{color:var(--neg)}

  /* ══ КАЛЕНДАРЬ (мини) ══ */

<script type="text/babel" data-presets="react">
/* ══════════════════════════════════════════════════════════════════
   ПРО БАРБЕР · кабинет барбера
   Один файл, без сборки: React UMD + Babel standalone, как и остальные
   приложения репозитория. Данные живут в localStorage — приложение
   полностью рабочее без сервера.
   ══════════════════════════════════════════════════════════════════ */
const {useState, useEffect, useMemo, useRef, useCallback} = React;

/* ── 1. МЕЛОЧИ ────────────────────────────────────────────────────── */

const DAY = 86400000;
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const cx = (...a) => a.filter(Boolean).join(' ');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (arr, f) => arr.reduce((n, x) => n + (f ? f(x) : x), 0);
const uniq = arr => Array.from(new Set(arr));
const by = (arr, key) => {
  const m = {};
  arr.forEach(x => { (m[typeof key === 'function' ? key(x) : x[key]] ||= []).push(x); });
  return m;
};

/* даты хранятся строкой YYYY-MM-DD: сравниваются как текст и не зависят
   от часового пояса, в отличие от ISO-меток времени */
const pad = n => (n < 10 ? '0' : '') + n;
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromIso = s => {
  const [y, m, d] = String(s || '').split('-').map(Number);
  return new Date(y || 1970, (m || 1) - 1, d || 1);
};
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth() + n, 1); return x; };
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7));
const sameDay = (a, b) => iso(a) === iso(b);
const dowIdx = d => (d.getDay() + 6) % 7;           /* 0 = понедельник */
const DOW_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

/* время внутри дня — минуты от полуночи */
const mins = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const hhmm = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(Math.round(m) % 60);
const durLabel = (m, lang) => {
  const h = Math.floor(m / 60), r = m % 60;
  const H = {ru: 'ч', uk: 'год', en: 'h'}[lang] || 'ч';
  const M = {ru: 'мин', uk: 'хв', en: 'min'}[lang] || 'мин';
  return (h ? h + ' ' + H + (r ? ' ' : '') : '') + (r ? r + ' ' + M : '');
};

const CURRENCIES = {
  USD: {sign: '$', before: true}, EUR: {sign: '€', before: true}, UAH: {sign: '₴', before: false},
};
const groupNum = n => String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const money = (v, cur) => {
  const c = CURRENCIES[cur] || CURRENCIES.USD;
  const s = (v < 0 ? '−' : '') + groupNum(v);
  return c.before ? s.replace(/^−?/, m => m + c.sign) : s + ' ' + c.sign;
};

/* телефон: свободный ввод, но с аккуратной подстановкой кода страны */
const phoneMask = raw => {
  let d = String(raw || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.length > 15) d = d.slice(0, 15);
  return '+' + d.replace(/^(\d{1,3})(\d{0,2})(\d{0,3})(\d{0,2})(\d{0,2}).*/, (m, a, b, c, e, f) =>
    [a, b, c, e, f].filter(Boolean).join(' '));
};
const initials = name => String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();

/* Имя под ширину плашки, ступенями: полное → «Григорий Ш.» → «Григорий»
   → «Г.Ш.». Обрывков слова и многоточий не бывает ни на одной ступени:
   «Григорий Ш.» читается, «Григорий Шевч…» — нет. Полное имя всегда есть
   в подсказке и в карточке записи. */
function fitName(name, chars){
  const full = String(name || '').trim().replace(/\s+/g, ' ');
  if (!full || full.length <= chars) return full;
  const parts = full.split(' ');
  if (parts.length > 1){
    const short = parts[0] + ' ' + parts[1][0] + '.';
    if (short.length <= chars) return short;
  }
  if (parts[0].length <= chars) return parts[0];
  if (parts.length > 1){
    const short = parts[0][0] + '.' + parts[1][0] + '.';
    if (short.length <= chars) return short;
  }
  return parts[0];
}

/* ── 2. ЯЗЫК ──────────────────────────────────────────────────────── */

const LANGS = [
  {id: 'uk', title: 'Українська'},
  {id: 'ru', title: 'Русский'},
  {id: 'en', title: 'English'},
];

const MONTH_GEN = {
  ru: ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'],
  uk: ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'],
  en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
};

  uk: ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'],
  en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
};
const MONTH_SHORT = {
  ru: ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'],
  uk: ['січ', 'лют', 'бер', 'кві', 'тра', 'чер', 'лип', 'сер', 'вер', 'жов', 'лис', 'гру'],
  en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
};
const WD_SHORT = {
  ru: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
  uk: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'],
  en: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
};
const WD_FULL = {
  ru: ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'],
  uk: ['Понеділок', 'Вівторок', 'Середа', 'Четвер', 'П’ятниця', 'Субота', 'Неділя'],
  en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'],
};

/* «14 мая» / «14 травня» / «May 14» */
const fmtDay = (d, lang) => lang === 'en'
  ? MONTH_GEN.en[d.getMonth()] + ' ' + d.getDate()
  : d.getDate() + ' ' + (MONTH_GEN[lang] || MONTH_GEN.ru)[d.getMonth()];
const fmtDayShort = (d, lang) => lang === 'en'
  ? MONTH_SHORT.en[d.getMonth()] + ' ' + d.getDate()
  : d.getDate() + ' ' + (MONTH_SHORT[lang] || MONTH_SHORT.ru)[d.getMonth()];
const fmtFull = (d, lang) => fmtDay(d, lang) + ' ' + d.getFullYear();
const monthTitle = (d, lang) => (MONTH_NOM[lang] || MONTH_NOM.ru)[d.getMonth()] + ' ' + d.getFullYear();

/* Словарь. Ключ — латиницей, значения — три языка рядом, чтобы забытый

/* Демо-база: клиенты, полгода истории, сегодняшний день и ближайшие
   недели. Всё считается от текущей даты, чтобы кабинет всегда выглядел
   живым, а не «14 мая 2024». */
function seedDB(over){
  const db = emptyDB();
  Object.assign(db.profile, over || {});
  const R = rnd(20240514);
  const pick = arr => arr[Math.floor(R() * arr.length)];
  const int = (a, b) => a + Math.floor(R() * (b - a + 1));

  db.services = SERVICE_SEED.map((s, i) => ({
    id: 'sv_' + i, name: s.name, price: s.price, dur: s.dur, active: true,
  }));
  db.clients = CLIENT_SEED.concat(EXTRA_SEED).map((c, i) => ({
    id: 'cl_' + i, name: c[0], phone: phoneMask(c[1]), birthday: c[2],
    photo: '', note: i < 6 ? NOTE_SEED[i] : (R() > .6 ? pick(NOTE_SEED) : ''),
    createdAt: iso(addDays(new Date(), -(i < CLIENT_SEED.length ? int(120, 400) : int(3, 180)))),
  }));
  /* последние шестеро — совсем свежие: истории у них нет, зато на них
     работают фильтры «новые» и «с записью» */
  const CORE = CLIENT_SEED.length;
  const FRESH = db.clients.slice(-6).map(c => c.id);
  /* пул для истории: постоянные встречаются втрое чаще заходящих */
  const pool = [];
  db.clients.forEach((c, i) => {
    if (FRESH.includes(c.id)) return;
    const times = i < CORE ? 3 : 1;
    for (let k = 0; k < times; k++) pool.push(c.id);
  });

  const svc = id => db.services.find(s => s.id === id);
  const mk = (clientId, serviceId, date, time, status, extra) => {
    const s = svc(serviceId);
    db.appts.push(Object.assign({
      id: uid('ap'), clientId, serviceId, date, time,
      dur: s.dur, price: s.price, status, note: '', source: 'manual',
      createdAt: date,
    }, extra || {}));
  };

  const now = new Date();
  const hoursOf = d => db.profile.hours[DOW_KEYS[dowIdx(d)]];

  /* ── история: 180 дней назад ── */
  for (let back = 180; back >= 1; back--){
    const d = addDays(now, -back);
    const h = hoursOf(d);
    if (!h.on) continue;
    const n = int(5, 8);
    let cursor = mins(h.from) + int(0, 2) * 30;
    for (let i = 0; i < n; i++){
      const sv = db.services[R() < .34 ? 0 : R() < .6 ? 1 : int(2, 7)];
      if (cursor + sv.dur > mins(h.to)) break;
      const clId = pool[int(0, pool.length - 1)];
      const bad = R() < .05;
      mk(clId, sv.id, iso(d), hhmm(cursor), bad ? 'canceled' : 'done');
      cursor += sv.dur + (R() < .5 ? 15 : 30);
    }
  }

  /* ── сегодня: расписание из референса ── */
  const today = iso(now);
  const nowM = now.getHours() * 60 + now.getMinutes();
  const plan = [
    ['09:00', 'cl_1', 'sv_0'], ['10:00', 'cl_2', 'sv_1'], ['11:30', 'cl_0', 'sv_1'],
    ['13:00', 'cl_3', 'sv_2'], ['14:30', 'cl_4', 'sv_0'], ['16:00', 'cl_5', 'sv_1'],
  ];
  plan.forEach(([time, cl, sv]) => {
    const done = mins(time) + svc(sv).dur <= nowM;
    mk(cl, sv, today, time, done ? 'done' : 'planned');
  });

  /* ── ближайшие три недели ── */
  for (let fwd = 1; fwd <= 21; fwd++){
    const d = addDays(now, fwd);
    const h = hoursOf(d);
    if (!h.on) continue;
    const n = fwd <= 7 ? int(3, 6) : int(1, 4);
    let cursor = mins(h.from) + int(0, 3) * 30;
    for (let i = 0; i < n; i++){
      const sv = db.services[R() < .4 ? 0 : R() < .7 ? 1 : int(2, 7)];
      if (cursor + sv.dur > mins(h.to)) break;
      mk(pool[int(0, pool.length - 1)], sv.id, iso(d), hhmm(cursor), 'planned');
      cursor += sv.dur + int(1, 3) * 15;
    }
  }

  /* свежие клиенты: у троих один визит, у троих — только запись впереди */
  FRESH.forEach((id, i) => {
    const sv = db.services[i % 4];
    if (i < 3) mk(id, sv.id, iso(addDays(now, -int(4, 20))), '18:30', 'done');
    else mk(id, sv.id, iso(addDays(now, 4 + i)), '17:00', 'planned');
  });

  /* ── заявки с сайта: их барбер подтверждает руками ── */
  const workday = start => { let d = addDays(now, start); while (!hoursOf(d).on) d = addDays(d, 1); return d; };
  mk('cl_9', 'sv_1', iso(workday(2)), '12:00', 'pending', {source: 'online'});
  mk('cl_14', 'sv_5', iso(workday(4)), '15:30', 'pending', {source: 'online'});

  /* ── расходы: аренда кресла помесячно и материалы ── */
  for (let back = 6; back >= 0; back--){
    const d = new Date(now.getFullYear(), now.getMonth() - back, 5);
    if (d > now) continue;
    db.expenses.push({id: uid('ex'), date: iso(d), kind: 'rent', title: 'Аренда кресла', amount: 300});
  }
  for (let back = 180; back >= 0; back -= 14){
    const d = addDays(now, -back);
    if (d > now) continue;
    db.expenses.push({id: uid('ex'), date: iso(d), kind: 'goods', title: 'Материалы', amount: int(40, 90)});
  }

  /* ── переписка ── */
  const H = 3600000;
  const at = h => new Date(Date.now() - h * H).toISOString();
  db.threads = [
    {id: 'th_0', clientId: 'cl_0', unread: 1, msgs: [
      {from: 'me', text: 'Иван, привет! Записал вас на сегодня на 11:30.', at: at(26)},
      {from: 'me', text: 'Стрижка + борода, как обычно.', at: at(26)},
      {from: 'client', text: 'Отлично, буду. Спасибо!', at: at(2)},
    ]},
    {id: 'th_1', clientId: 'cl_9', unread: 1, msgs: [
      {from: 'client', text: 'Добрый день! Можно записаться на четверг ближе к обеду?', at: at(5)},
    ]},
    {id: 'th_2', clientId: 'cl_3', unread: 1, msgs: [
      {from: 'me', text: 'Артём, напоминаю про запись завтра.', at: at(30)},
      {from: 'client', text: 'Приду. Можно на полчаса позже?', at: at(4)},
    ]},
    {id: 'th_3', clientId: 'cl_2', unread: 0, msgs: [
      {from: 'client', text: 'Спасибо, отличная стрижка 👌', at: at(50)},
      {from: 'me', text: 'Рад слышать! Через месяц жду.', at: at(49)},
    ]},
    {id: 'th_4', clientId: 'cl_5', unread: 0, msgs: [
      {from: 'me', text: 'Павел, свободно завтра в 16:00, если удобно.', at: at(72)},
      {from: 'client', text: 'Давайте', at: at(71)},
    ]},
    {id: 'th_5', clientId: 'cl_11', unread: 0, msgs: [
      {from: 'client', text: 'А детская стрижка сколько стоит?', at: at(96)},
      {from: 'me', text: '15$, 40 минут. Записать?', at: at(95)},
    ]},
  ];
  return db;
}

/* ── 4. ХРАНИЛИЩЕ ─────────────────────────────────────────────────── */

const Disk = {
  read(){
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const db = JSON.parse(raw);
      if (!db || !db.clients) return null;
      /* база могла прийти из прошлой версии — добираем недостающее */
      const base = emptyDB();
      db.settings = Object.assign({}, base.settings, db.settings);
      db.settings.notif = Object.assign({}, base.settings.notif, db.settings.notif);
      db.profile = Object.assign({}, base.profile, db.profile);
      db.profile.hours = Object.assign({}, base.profile.hours, db.profile.hours);
      db.threads ||= []; db.seen ||= {}; db.expenses ||= [];
      return db;
    } catch (e){ return null; }
  },
  write(db){
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e){}
  },
};

const Store = {
  state: null,
  subs: new Set(),
  init(db){ this.state = db; LANG = db.settings.lang || 'ru'; return db; },
  sub(fn){ this.subs.add(fn); return () => this.subs.delete(fn); },
  emit(){ this.subs.forEach(fn => fn(this.state)); },
  /* единственная точка записи: пишем на диск и будим подписчиков.
     Здесь же держим язык — иначе он разъезжается с настройками */
  set(patch){
    this.state = typeof patch === 'function' ? patch(this.state) : Object.assign({}, this.state, patch);
    LANG = this.state.settings.lang || 'ru';
    Disk.write(this.state);
    this.emit();
    return this.state;
  },
  edit(list, id, patch){
    return this.set(s => ({...s, [list]: s[list].map(x => x.id === id ? Object.assign({}, x, typeof patch === 'function' ? patch(x) : patch) : x)}));
  },
};

/* хук: любой экран перерисовывается на любое изменение базы */
function useDB(){
  const [, force] = useState(0);
  useEffect(() => Store.sub(() => force(n => n + 1)), []);
  return Store.state;
}

/* ── 5. ДЕЙСТВИЯ ──────────────────────────────────────────────────── */

const Act = {
  addClient(data){
    const c = Object.assign({
      id: uid('cl'), name: '', phone: '', birthday: '', photo: '', note: '',
      createdAt: iso(new Date()),
    }, data);
    Store.set(s => ({...s, clients: [c, ...s.clients]}));
    return c;
  },
  updClient(id, patch){ Store.edit('clients', id, patch); return Store.state.clients.find(c => c.id === id); },
  delClient(id){
    Store.set(s => ({
      ...s,
      clients: s.clients.filter(c => c.id !== id),
      appts: s.appts.filter(a => a.clientId !== id),
      threads: s.threads.filter(th => th.clientId !== id),
    }));
  },

  addService(data){
    const sv = Object.assign({id: uid('sv'), name: '', price: 0, dur: 30, active: true}, data);
    Store.set(s => ({...s, services: [...s.services, sv]}));
    return sv;
  },
  updService(id, patch){ Store.edit('services', id, patch); return Store.state.services.find(s => s.id === id); },
  /* услугу не стираем из истории: прошлые записи хранят свою цену и
     длительность, поэтому удаление трогает только список услуг */
  delService(id){ Store.set(s => ({...s, services: s.services.filter(x => x.id !== id)})); },

  addAppt(data){
    const sv = Store.state.services.find(s => s.id === data.serviceId);
    const a = Object.assign({
      id: uid('ap'), clientId: '', serviceId: '', date: iso(new Date()), time: '10:00',
      dur: sv ? sv.dur : 30, price: sv ? sv.price : 0, status: 'planned', note: '',
      source: 'manual', createdAt: iso(new Date()),
    }, data);
    Store.set(s => ({...s, appts: [...s.appts, a]}));
    return a;
  },
  updAppt(id, patch){ Store.edit('appts', id, patch); return Store.state.appts.find(a => a.id === id); },
  delAppt(id){ Store.set(s => ({...s, appts: s.appts.filter(a => a.id !== id)})); },
  move(id, date, time){ return Act.updAppt(id, {date, time}); },
  start(id){ return Act.updAppt(id, {status: 'active', startedAt: Date.now()}); },
  complete(id, price){
    const patch = {status: 'done'};
    if (price != null && price !== '') patch.price = Number(price) || 0;
    return Act.updAppt(id, patch);
  },
  cancel(id){
    const a = Store.state.appts.find(x => x.id === id);
    if (a && a.status === 'pending') Sync.resolve(a, 'declined');
    return Act.updAppt(id, {status: 'canceled'});
  },
  restore(id){ return Act.updAppt(id, {status: 'planned'}); },
  accept(id){
    const a = Store.state.appts.find(x => x.id === id);
    if (a) Sync.resolve(a, 'accepted');
    return Act.updAppt(id, {status: 'planned'});
  },

  send(clientId, text, from){
    const at = new Date().toISOString();
    Store.set(s => {
      const has = s.threads.find(th => th.clientId === clientId);
      const msg = {from: from || 'me', text, at};
      if (has) return {...s, threads: s.threads.map(th => th.clientId === clientId
        ? {...th, msgs: [...th.msgs, msg], unread: from === 'client' ? th.unread + 1 : th.unread} : th)};
      return {...s, threads: [...s.threads, {id: uid('th'), clientId, unread: from === 'client' ? 1 : 0, msgs: [msg]}]};
    });
  },
  readThread(clientId){
    Store.set(s => ({...s, threads: s.threads.map(th => th.clientId === clientId ? {...th, unread: 0} : th)}));
  },

  addExpense(data){
    const e = Object.assign({id: uid('ex'), date: iso(new Date()), kind: 'other', title: '', amount: 0}, data);
    Store.set(s => ({...s, expenses: [e, ...s.expenses]}));
    return e;
  },
  updExpense(id, patch){ Store.edit('expenses', id, patch); },
  delExpense(id){ Store.set(s => ({...s, expenses: s.expenses.filter(x => x.id !== id)})); },

  /* Серия: постоянный клиент ходит «каждые две недели в 11:00». Занятые
     даты пропускаем — молча двигать чужую запись нельзя. */
  addSeries(data, every, times){
    const step = {week: 7, two: 14, month: 30}[every] || 7;
    const repeatId = uid('rp');
    const made = [];
    let skipped = 0;
    for (let i = 0; i < Math.max(1, times); i++){
      const date = iso(addDays(fromIso(data.date), i * step));
      if (i && overlaps(Store.state, date, data.time, data.dur)){ skipped++; continue; }
      made.push(Act.addAppt(Object.assign({}, data, {date, repeatId})));
    }
    return {made, skipped, repeatId};
  },
  cancelSeries(repeatId, fromDate){
    Store.set(s => ({...s, appts: s.appts.map(a =>
      a.repeatId === repeatId && a.date >= fromDate && a.status === 'planned'
        ? Object.assign({}, a, {status: 'canceled'}) : a)}));
  },

  settings(patch){ Store.set(s => ({...s, settings: Object.assign({}, s.settings, patch)})); },
  notif(patch){ Store.set(s => ({...s, settings: {...s.settings, notif: Object.assign({}, s.settings.notif, patch)}})); },
  profile(patch){ Store.set(s => ({...s, profile: Object.assign({}, s.profile, patch)})); },
  hours(dayKey, patch){
    Store.set(s => ({...s, profile: {...s.profile, hours: {...s.profile.hours,
      [dayKey]: Object.assign({}, s.profile.hours[dayKey], patch)}}}));
  },
  dismiss(nid){ Store.set(s => ({...s, seen: Object.assign({}, s.seen, {[nid]: Date.now()})})); },
  reset(){ Store.set(() => seedDB()); },
};

/* ── 5b. СЕРВЕР ───────────────────────────────────────────────────
   Сервер нужен ровно для онлайн-записи: кабинет публикует витрину и
   занятое время, забирает заявки и сообщает решение по ним. Клиентская
   база, история и деньги никуда не уезжают.

   Сервера может не быть вовсе — тогда каждый вызов тихо возвращает
   {ok:false}, и кабинет работает как работал. */

const API = '/api/barber';
const HORIZON = 60;                     /* насколько вперёд публикуем занятость */

const Net = {
  async call(action, data){
    const db = Store.state;
    if (!db.settings.sync || !db.settings.slug) return {ok: false, reason: 'off'};
    try {
      const r = await fetch(API, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(Object.assign({action, slug: db.settings.slug, token: db.settings.token}, data || {})),
      });
      if (!r.ok) return {ok: false, reason: 'http_' + r.status};
      return await r.json();
    } catch (e){ return {ok: false, reason: 'offline'}; }
  },
};

const Sync = {
  /* токен — секрет кабинета: он доказывает серверу, что адрес наш */
  ensureToken(){
    if (!Store.state.settings.token) Act.settings({token: uid('tk') + uid('n')});
    return Store.state.settings.token;
  },

  /* что видно клиенту: услуги, график и занятые интервалы без имён */
  payload(db){
    const today = iso(new Date()), last = iso(addDays(new Date(), HORIZON));
    return {
      shop: {
        shop: db.profile.shop, name: db.profile.name, role: db.profile.role,
        about: db.profile.about, address: db.profile.address, phone: db.profile.phone,
        photo: db.profile.photo, currency: db.settings.currency, lang: db.settings.lang,
        step: db.settings.step, hours: db.profile.hours,
        services: db.services.filter(x => x.active !== false)
          .map(x => ({id: x.id, name: x.name, price: x.price, dur: x.dur})),
      },
      busy: db.appts.filter(a => a.status !== 'canceled' && a.date >= today && a.date <= last)
        .map(a => ({date: a.date, time: a.time, dur: a.dur})),
    };
  },

  async publish(){
    Sync.ensureToken();
    const r = await Net.call('publish', Sync.payload(Store.state));
    return r;
  },

  /* заявка превращается в запись со статусом «заявка»: барбер решает */
  async pull(){
    const r = await Net.call('pull', {});
    if (!r.ok) return r;
    const db = Store.state;
    let added = 0;
    (r.requests || []).forEach(q => {
      if (db.appts.some(a => a.reqId === q.id)) return;
      const key = String(q.phone || '').replace(/\D/g, '');
      let client = db.clients.find(c => c.phone.replace(/\D/g, '') === key && key.length > 8);
      if (!client) client = Act.addClient({name: q.name, phone: phoneMask(q.phone)});
      const svc = serviceById(Store.state, q.service_id) ||
                  Store.state.services.find(x => x.name === q.service) || null;
      Act.addAppt({
        clientId: client.id, serviceId: svc ? svc.id : (Store.state.services[0] || {}).id,
        date: q.date, time: q.time, dur: Number(q.dur) || 30, price: Number(q.price) || 0,
        status: 'pending', source: 'online', note: q.note || '', reqId: q.id,
      });
      added++;
    });
    Act.settings({pulledAt: new Date().toISOString()});
    return {ok: true, added};
  },

  /* решение барбера возвращаем серверу, чтобы заявка не пришла снова */
  resolve(appt, status){
    if (!appt || !appt.reqId) return;
    Net.call('resolve', {id: appt.reqId, status});
  },

  async link(){ return Net.call('link', {}); },
};

/* ── 6. ВЫБОРКИ И РАСЧЁТЫ ─────────────────────────────────────────── */

const COUNTED = a => a.status === 'done';                    /* в деньги идёт только проведённое */
const LIVE = a => a.status !== 'canceled';                   /* занимает время в календаре */

const clientById = (db, id) => db.clients.find(c => c.id === id) || null;
const serviceById = (db, id) => db.services.find(s => s.id === id) || null;
const serviceName = (db, id) => (serviceById(db, id) || {}).name || '—';
const clientName = (db, id) => (clientById(db, id) || {}).name || '—';

const dayAppts = (db, dateIso) => db.appts
  .filter(a => a.date === dateIso)
  .sort((x, y) => mins(x.time) - mins(y.time));

const inRange = (db, from, to) => db.appts.filter(a => a.date >= from && a.date <= to);

/* сводка за период: всё, что показывают карточки и «Финансы» */
function stats(db, from, to){
  const rows = inRange(db, from, to);
  const done = rows.filter(COUNTED);
  const revenue = sum(done, a => a.price);
  return {
    revenue,
    count: rows.filter(LIVE).length,
    done: done.length,
    canceled: rows.filter(a => a.status === 'canceled').length,
    clients: uniq(rows.filter(LIVE).map(a => a.clientId)).length,
    avg: done.length ? Math.round(revenue / done.length) : 0,
    rows: done,
  };
}

const periodRange = (period, at) => {
  const d = at || new Date();
  if (period === 'day') return [iso(d), iso(d)];
  if (period === 'week'){ const s = startOfWeek(d); return [iso(s), iso(addDays(s, 6))]; }
  if (period === 'year') return [iso(new Date(d.getFullYear(), 0, 1)), iso(new Date(d.getFullYear(), 11, 31))];
  return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), iso(new Date(d.getFullYear(), d.getMonth() + 1, 0))];
};
/* Прошлый период для сравнения — обрезанный по тот же день, иначе
   половина августа всегда «проигрывает» полному июлю. */
const prevRange = (period, at) => {
  const d = at || new Date();
  if (period === 'day') return periodRange('day', addDays(d, -1));
  if (period === 'week'){
    const s = addDays(startOfWeek(d), -7);
    return [iso(s), iso(addDays(s, dowIdx(d)))];
  }
  if (period === 'year')
    return [iso(new Date(d.getFullYear() - 1, 0, 1)), iso(new Date(d.getFullYear() - 1, d.getMonth(), d.getDate()))];
  const lastDay = new Date(d.getFullYear(), d.getMonth(), 0).getDate();
  return [iso(new Date(d.getFullYear(), d.getMonth() - 1, 1)),
          iso(new Date(d.getFullYear(), d.getMonth() - 1, Math.min(d.getDate(), lastDay)))];
};
const growth = (now, was) => was > 0 ? Math.round((now - was) / was * 100) : (now > 0 ? 100 : 0);

/* рабочие интервалы дня минус занятое время = свободные окна */
function freeSlots(db, dateIso, minLen){
  const d = fromIso(dateIso);
  const h = db.profile.hours[DOW_KEYS[dowIdx(d)]];
  if (!h || !h.on) return [];
  const busy = dayAppts(db, dateIso).filter(LIVE)
    .map(a => [mins(a.time), mins(a.time) + a.dur])
    .sort((x, y) => x[0] - y[0]);
  const out = [];
  let cur = mins(h.from);
  const end = mins(h.to);
  const need = minLen || 30;
  busy.forEach(([s, e]) => {
    if (s - cur >= need) out.push([cur, s]);
    cur = Math.max(cur, e);
  });
  if (end - cur >= need) out.push([cur, end]);
  return out;
}
const freeCount = (db, dateIso, step) => sum(freeSlots(db, dateIso, step || 30), ([a, b]) => Math.floor((b - a) / (step || 30)));

/* свободные точки старта: для формы записи и публичной страницы */
function freeStarts(db, dateIso, dur, step, ignoreId){
  const d = fromIso(dateIso);
  const h = db.profile.hours[DOW_KEYS[dowIdx(d)]];
  if (!h || !h.on) return [];
  const busy = dayAppts(db, dateIso).filter(a => LIVE(a) && a.id !== ignoreId)
    .map(a => [mins(a.time), mins(a.time) + a.dur]);
  const out = [];
  const st = step || 30;
  for (let m = mins(h.from); m + dur <= mins(h.to); m += st){
    if (!busy.some(([s, e]) => m < e && m + dur > s)) out.push(hhmm(m));
  }
  return out;
}
const overlaps = (db, dateIso, time, dur, ignoreId) => dayAppts(db, dateIso)
  .filter(a => LIVE(a) && a.id !== ignoreId)
  .some(a => mins(time) < mins(a.time) + a.dur && mins(time) + dur > mins(a.time));

const withinHours = (db, dateIso, time, dur) => {
  const h = db.profile.hours[DOW_KEYS[dowIdx(fromIso(dateIso))]];
  return !!h && h.on && mins(time) >= mins(h.from) && mins(time) + dur <= mins(h.to);
};

/* «сейчас» в минутах от полуночи — вынесено, чтобы тесты могли задать своё */
const nowMin = at => { const d = at || new Date(); return d.getHours() * 60 + d.getMinutes(); };

/* следующая запись: сегодня после текущего времени, иначе ближайший день */
function nextAppt(db, at){
  const d = at || new Date();
  const today = iso(d), m = nowMin(d);
  const future = db.appts
    .filter(a => (a.status === 'planned' || a.status === 'active') &&
      (a.date > today || (a.date === today && mins(a.time) + a.dur > m)))
    .sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
  return future[0] || null;
}
const minutesUntil = (a, at) => {
  const d = at || new Date();
  return Math.round((fromIso(a.date).getTime() + mins(a.time) * 60000 - d.getTime()) / 60000);
};

/* «Сегодня» / «Завтра» / «пн, 18 авг» — барберу важно понять день с
   одного взгляда, а не вычитать дату из календаря */
function dayWord(dateIso, at){
  const now = at || new Date();
  const today = iso(now);
  if (dateIso === today) return t('today');
  if (dateIso === iso(addDays(now, 1))) return t('tomorrow');
  if (dateIso === iso(addDays(now, -1))) return t('yesterday');
  const d = fromIso(dateIso);
  return WD_SHORT[LANG][dowIdx(d)] + ', ' + fmtDayShort(d, LANG);
}

/* статус строки расписания: «завершено / следующая / записан» */
function rowStatus(db, a, at){
  if (a.status === 'done') return 'done';
  if (a.status === 'canceled') return 'cancel';
  if (a.status === 'pending') return 'pend';
  if (a.status === 'active') return 'active';
  const nx = nextAppt(db, at);
  return nx && nx.id === a.id ? 'next' : 'plan';
}
const STATUS_KEY = {done: 'stDone', next: 'stNext', plan: 'stPlanned', cancel: 'stCanceled', pend: 'stPending', active: 'stActive'};

function clientStats(db, id){
  const rows = db.appts.filter(a => a.clientId === id);
  const done = rows.filter(COUNTED).sort((x, y) => (y.date + y.time).localeCompare(x.date + x.time));
  const spent = sum(done, a => a.price);
  const today = iso(new Date());
  const next = rows.filter(a => (a.status === 'planned' || a.status === 'active' || a.status === 'pending') && a.date >= today)
    .sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time))[0] || null;
  const fav = Object.entries(by(done, 'serviceId')).sort((a, b) => b[1].length - a[1].length)[0];
  return {
    visits: done.length, spent, avg: done.length ? Math.round(spent / done.length) : 0,
    last: done[0] || null, next, history: done,
    favService: fav ? fav[0] : null,
    canceled: rows.filter(a => a.status === 'canceled').length,
  };
}
const daysSince = dateIso => Math.floor((fromIso(iso(new Date())).getTime() - fromIso(dateIso).getTime()) / DAY);

/* топ услуг за период — с долями для полосок */
function topServices(db, from, to, limit){
  const done = inRange(db, from, to).filter(COUNTED);
  const groups = by(done, 'serviceId');
  const rows = Object.keys(groups).map(id => ({
    id, name: serviceName(db, id), count: groups[id].length, revenue: sum(groups[id], a => a.price),
  })).sort((a, b) => b.count - a.count);
  const max = rows.length ? rows[0].count : 1;
  return rows.slice(0, limit || 4).map(r => ({...r, share: r.count / max}));
}

/* Ряд для графика. Будущие дни не рисуем: пустой хвост читался бы как
   провал выручки, хотя эти дни просто ещё не наступили. */
function series(db, period, at){
  const d = at || new Date();
  const today = iso(new Date());
  const upTo = rows => rows.filter(r => r.from <= today);
  if (period === 'year'){
    return upTo(Array.from({length: 12}, (_, m) => {
      const from = iso(new Date(d.getFullYear(), m, 1)), to = iso(new Date(d.getFullYear(), m + 1, 0));
      return {label: MONTH_SHORT[LANG][m], value: stats(db, from, to).revenue, from};
    }));
  }
  if (period === 'week'){
    const s = startOfWeek(d);
    return upTo(Array.from({length: 7}, (_, i) => {
      const day = addDays(s, i);
      return {label: WD_SHORT[LANG][i], value: stats(db, iso(day), iso(day)).revenue, from: iso(day)};
    }));
  }
  if (period === 'day'){
    const rows = dayAppts(db, iso(d)).filter(COUNTED);
    let acc = 0;
    return rows.map(a => { acc += a.price; return {label: a.time, value: acc, from: iso(d)}; });
  }
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return upTo(Array.from({length: last}, (_, i) => {
    const day = new Date(d.getFullYear(), d.getMonth(), i + 1);
    return {label: String(i + 1), value: stats(db, iso(day), iso(day)).revenue, from: iso(day)};
  }));
}

/* дни рождения: сколько осталось, с переходом через новый год */
function bdIn(birthday, at){
  if (!birthday) return null;
  const [, m, d] = String(birthday).split('-').map(Number);
  if (!m || !d) return null;
  const now = at || new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let next = new Date(now.getFullYear(), m - 1, d);
  if (next < base) next = new Date(now.getFullYear() + 1, m - 1, d);
  return Math.round((next - base) / DAY);
}

/* уведомления — не список в базе, а вывод из данных */
function notifications(db, at){
  const now = at || new Date();
  const today = iso(now), m = nowMin(now);
  const out = [];
  db.appts.filter(a => a.status === 'pending').forEach(a => out.push({
    id: 'pend_' + a.id, kind: 'online', apptId: a.id, clientId: a.clientId,
    title: t('ntOnline'), text: clientName(db, a.clientId) + ' · ' + serviceName(db, a.serviceId),
    when: fmtDayShort(fromIso(a.date), LANG) + ', ' + a.time,
  }));
  db.appts.filter(a => a.status === 'planned' &&
    (a.date < today || (a.date === today && mins(a.time) + a.dur < m - 30)))
    .slice(0, 5).forEach(a => out.push({
      id: 'open_' + a.id, kind: 'unclosed', apptId: a.id, clientId: a.clientId,
      title: t('ntUnclosed'), text: clientName(db, a.clientId) + ' · ' + serviceName(db, a.serviceId),
      when: fmtDayShort(fromIso(a.date), LANG) + ', ' + a.time,
    }));
  if (db.settings.notif.birthday){
    db.clients.forEach(c => {
      const n = bdIn(c.birthday, now);
      if (n !== null && n <= 3) out.push({
        id: 'bd_' + c.id + '_' + now.getFullYear(), kind: 'birthday', clientId: c.id,
        title: t('ntBirthday'), text: c.name,
        when: n === 0 ? t('today') : t('inDays') + ' ' + n + ' ' + t('dShort'),
      });
    });
  }
  db.threads.filter(th => th.unread > 0).forEach(th => out.push({
    id: 'msg_' + th.id + '_' + th.msgs.length, kind: 'unread', clientId: th.clientId,
    title: t('ntUnread'), text: clientName(db, th.clientId),
    when: (th.msgs[th.msgs.length - 1].text || '').slice(0, 42),
  }));
  return out.filter(n => !db.seen[n.id]);
}

const unreadCount = db => sum(db.threads, th => th.unread);

/* Расходы за период и чистая прибыль. Барберу важнее «сколько осталось»,
   чем «сколько прошло через кассу». */
const expensesIn = (db, from, to) => (db.expenses || []).filter(e => e.date >= from && e.date <= to);
const spent = (db, from, to) => sum(expensesIn(db, from, to), e => e.amount);
const profit = (db, from, to) => stats(db, from, to).revenue - spent(db, from, to);

const EXPENSE_KINDS = [
  {id: 'rent', key: 'expRent'}, {id: 'goods', key: 'expGoods'}, {id: 'tools', key: 'expTools'},
  {id: 'ads', key: 'expAds'}, {id: 'other', key: 'expOther'},
];

/* CSV для бухгалтерии: дата, клиент, услуга, цена */
function financeCsv(db, from, to){
  const rows = inRange(db, from, to).filter(COUNTED)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const head = ['date', 'time', 'client', 'service', 'price'];
  const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
  return [head.join(',')].concat(rows.map(a => [
    a.date, a.time, clientName(db, a.clientId), serviceName(db, a.serviceId), a.price,
  ].map(esc).join(','))).join('\n');
}

/* ── 6b. ФАЙЛЫ ───────────────────────────────────────────────────
   Фото ужимаем прямо в браузере: в localStorage нельзя класть
   пятимегабайтные снимки с телефона. */
function pickFile(accept, onLoad, asText){
  try {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => onLoad(reader.result, file);
      if (asText) reader.readAsText(file); else reader.readAsDataURL(file);
    };
    input.click();
  } catch (e){ toast(t('importBad'), 'bad'); }
}

function pickPhoto(onReady){
  pickFile('image/*', dataUrl => {
    try {
      const img = new Image();
      img.onload = () => {
        const side = 320;
        const canvas = document.createElement('canvas');
        canvas.width = side; canvas.height = side;
        const ctx = canvas.getContext('2d');
        const k = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, side, side);
        onReady(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => onReady(dataUrl);
      img.src = dataUrl;
    } catch (e){ onReady(dataUrl); }
  });
}

const Toaster = {
  list: [], subs: new Set(),
  push(text, tone){
    const item = {id: uid('ts'), text, tone};
    this.list = this.list.concat(item);
    this.subs.forEach(f => f());
    setTimeout(() => {
      this.list = this.list.filter(x => x.id !== item.id);
      this.subs.forEach(f => f());
    }, 2600);
  },
};
const toast = (text, tone) => Toaster.push(text, tone);

function Toasts(){
  const [, force] = useState(0);
  useEffect(() => {
    const fn = () => force(n => n + 1);
    Toaster.subs.add(fn);
    return () => Toaster.subs.delete(fn);
  }, []);
  return (
    <div className="toasts">
      {Toaster.list.map(x => (
        <div key={x.id} className={cx('toast', x.tone)}>
          <Icon n={x.tone === 'bad' ? 'ban' : 'check'} /><span>{x.text}</span>

  );
}

    window.addEventListener('mousedown', away);
    return () => window.removeEventListener('mousedown', away);
  }, [open]);
  return (
    <div className="rel" ref={box}>
      {trigger(() => setOpen(o => !o), open)}

        <div className="pop" style={align === 'left' ? {right: 'auto', left: 0} : null} onClick={() => setOpen(false)}>

/* Линейный график на голом SVG: сглаженная кривая, заливка, точки и
   подсказка при наведении. Пересчитывается из данных, картинок нет. */
function LineChart({data, height, currency, showDots}){
  const [hover, setHover] = useState(null);
  const H = height || 150, W = 600, padY = 14;
  const pts = data && data.length ? data : [{label: '', value: 0}];
  const max = Math.max.apply(null, pts.map(p => p.value).concat([1]));
  const stepX = pts.length > 1 ? W / (pts.length - 1) : W;
  const xy = i => [i * stepX, H - padY - (pts[i].value / max) * (H - padY * 2)];
  const coords = pts.map((_, i) => xy(i));

  /* мягкая кривая Catmull-Rom → кубические Безье */
  const path = coords.reduce((d, [x, y], i) => {
    if (!i) return 'M' + x + ' ' + y;
    const [px, py] = coords[i - 1];
    const cx1 = px + stepX / 2, cx2 = x - stepX / 2;
    return d + ' C' + cx1 + ' ' + py + ' ' + cx2 + ' ' + y + ' ' + x + ' ' + y;
  }, '');
  const area = coords.length > 1 ? path + ' L' + W + ' ' + H + ' L0 ' + H + ' Z' : '';
  const gid = 'g' + pts.length + Math.round(max);

  return (
    <div className="chart" onMouseLeave={() => setHover(null)}>
      <svg viewBox={'0 0 ' + W + ' ' + H} preserveAspectRatio="none" style={{height: H}}>
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="var(--gold)" stopOpacity=".26" />
            <stop offset="100%" stopColor="var(--gold)" stopOpacity="0" />
          </linearGradient>
        </defs>
        {[0, .5, 1].map(k => (
          <line key={k} className="gl" x1="0" x2={W} y1={padY + k * (H - padY * 2)} y2={padY + k * (H - padY * 2)} />
        ))}
        {area && <path d={area} fill={'url(#' + gid + ')'} />}
        <path className="ln" d={path} vectorEffect="non-scaling-stroke" />
        {coords.map(([x, y], i) => (
          <g key={i}>
            {(showDots !== false || hover === i) &&
              <circle className="pt" cx={x} cy={y} r={hover === i ? 5 : 3.4} vectorEffect="non-scaling-stroke" />}
            <rect x={x - stepX / 2} y="0" width={stepX} height={H} fill="transparent"
                  onMouseEnter={() => setHover(i)} />
          </g>
        ))}
      </svg>
      {hover != null && (
        <div className="chart-tip" style={{left: (coords[hover][0] / W * 100) + '%', top: (coords[hover][1] / H * 100) + '%'}}>
          {money(pts[hover].value, currency)}
          <small>{pts[hover].label}</small>
        </div>
      )}
      {pts.length > 1 && (
        <div className="chart-x">
          <span>{pts[0].label}</span>
          {pts.length > 2 && <span>{pts[Math.floor(pts.length / 2)].label}</span>}
          <span>{pts[pts.length - 1].label}</span>
        </div>
      )}
    </div>
  );
}

/* Столбики — для «Финансов», где важно сравнивать дни между собой */
function BarChart({data, height, currency}){
  const [hover, setHover] = useState(null);
  const H = height || 170, W = 600, gap = 2;
  const pts = data && data.length ? data : [{label: '', value: 0}];
  const max = Math.max.apply(null, pts.map(p => p.value).concat([1]));
  const bw = W / pts.length;
  return (
    <div className="chart" onMouseLeave={() => setHover(null)}>
      <svg viewBox={'0 0 ' + W + ' ' + H} preserveAspectRatio="none" style={{height: H}}>
        {pts.map((p, i) => {
          const h = Math.max(2, (p.value / max) * (H - 16));
          return (
            <rect key={i} className={cx('cbar', hover === i && 'on')} x={i * bw + gap} y={H - h}
                  width={Math.max(1, bw - gap * 2)} height={h} rx="3"
                  onMouseEnter={() => setHover(i)} />
          );
        })}
      </svg>
      {hover != null && (
        <div className="chart-tip" style={{left: ((hover + .5) * bw / W * 100) + '%', top: 0}}>
          {money(pts[hover].value, currency)}
          <small>{pts[hover].label}</small>
        </div>
      )}
      <div className="chart-x">
        <span>{pts[0].label}</span>
        {pts.length > 2 && <span>{pts[Math.floor(pts.length / 2)].label}</span>}
        <span>{pts[pts.length - 1].label}</span>
      </div>
    </div>
  );
}

function MiniCalendar({value, onPick, marks}){
  const sel = fromIso(value);
  const [view, setView] = useState(new Date(sel.getFullYear(), sel.getMonth(), 1));
  useEffect(() => { setView(new Date(sel.getFullYear(), sel.getMonth(), 1)); }, [value]);

  const first = new Date(view.getFullYear(), view.getMonth(), 1);

  const today = iso(new Date());

  return (

        <IconButton icon="chevL" onClick={() => setView(addMonths(view, -1))} aria-label="prev" />
        <div className="mc-title">{monthTitle(view, LANG)}</div>

      </div>
      <div className="mc-grid">

        {days.map(d => {
          const id = iso(d);
          return (
            <button key={id}
                    className={cx('mc-day', d.getMonth() !== view.getMonth() && 'out',
                                  id === value && 'sel', id === today && 'today')}
                    onClick={() => onPick(id)}>
              {d.getDate()}
              {marks && marks[id] ? <i /> : null}
            </button>
          );
        })}

}

/* Запись: создание и правка одной формой — поля совпадают, различается
   только заголовок и кнопка. */
function ApptForm({id, preset, onDone}){
  const db = useDB();
  const nav = useNav();
  const editing = id ? db.appts.find(a => a.id === id) : null;
  const base = editing || preset || {};
  const firstSvc = db.services[0] || {id: '', dur: 30, price: 0};

  const [clientId, setClientId] = useState(base.clientId || '');
  const [serviceId, setServiceId] = useState(base.serviceId || firstSvc.id);
  const [date, setDate] = useState(base.date || iso(new Date()));
  /* новую запись открываем на первом свободном окне дня, а не на 10:00,
     которое почти всегда уже занято */
  const [time, setTime] = useState(() => base.time ||
    freeStarts(db, base.date || iso(new Date()), base.dur || firstSvc.dur, db.settings.step)[0] || '10:00');
  const [dur, setDur] = useState(base.dur || firstSvc.dur);
  const [price, setPrice] = useState(base.price != null ? base.price : firstSvc.price);
  const [note, setNote] = useState(base.note || '');
  const [phone, setPhone] = useState('');
  const [every, setEvery] = useState('no');
  const [howMany, setHowMany] = useState(4);
  const [err, setErr] = useState({});

  const client = clientById(db, clientId);
  useEffect(() => { setPhone(client ? client.phone : ''); }, [clientId]);

  const pickService = sid => {
    setServiceId(sid);
    const sv = serviceById(db, sid);
    if (sv){ setDur(sv.dur); setPrice(sv.price); }
  };

  /* свободные старты дня + уже выбранное время, чтобы оно не пропало */
  const times = useMemo(() => {
    const free = freeStarts(db, date, Number(dur) || 30, db.settings.step, id);
    const all = uniq(free.concat(time ? [time] : [])).sort((a, b) => mins(a) - mins(b));
    if (all.length) return all;
    return Array.from({length: 56}, (_, i) => hhmm(7 * 60 + i * 15));
  }, [db.appts, date, dur, id, time]);

  /* сменили день или услугу — молча переносим на ближайшее свободное */
  useEffect(() => {
    if (!overlaps(db, date, time, Number(dur) || 30, id)) return;
    const free = freeStarts(db, date, Number(dur) || 30, db.settings.step, id);
    if (free.length) setTime(free[0]);
  }, [date, dur, serviceId]);

  const busy = overlaps(db, date, time, Number(dur) || 30, id);
  const outside = !withinHours(db, date, time, Number(dur) || 30);

  const submit = () => {
    const e = {};
    if (!clientId) e.clientId = t('required');
    if (!serviceId) e.serviceId = t('required');
    if (busy) e.time = t('busy');
    setErr(e);
    if (Object.keys(e).length) return;
    if (client && phone && phone !== client.phone) Act.updClient(client.id, {phone});
    const data = {clientId, serviceId, date, time, dur: Number(dur) || 30, price: Number(price) || 0, note};
    if (editing){
      Act.updAppt(id, data);
      toast(t('tSaved'), 'ok');
    } else if (every !== 'no'){
      const r = Act.addSeries(Object.assign({status: 'planned'}, data), every, Number(howMany) || 2);
      toast(t('seriesMade') + ': ' + r.made.length + (r.skipped ? ' · ' + r.skipped + ' ' + t('seriesSkip') : ''), 'ok');
    } else {
      Act.addAppt(Object.assign({status: 'planned'}, data));
      toast(t('tBooked'), 'ok');
    }
    (onDone || nav.close)();
  };

  return (
    <Modal title={editing ? t('apptCard') : t('newAppt')} onClose={nav.close} footer={
      <>
        <Button kind="soft" onClick={nav.close}>{t('cancel')}</Button>
        <div className="spacer" />
        <Button kind="gold" icon={editing ? 'check' : 'plus'} onClick={submit}>
          {editing ? t('save') : t('create')}
        </Button>
      </>
    }>
      <div className="f2">
        <Field label={t('client')} error={err.clientId}>
          <Select value={clientId} bad={!!err.clientId} placeholder={t('pickClient')}
                  onChange={e => setClientId(e.target.value)}
                  options={db.clients.slice().sort((a, b) => a.name.localeCompare(b.name))
                    .map(c => ({value: c.id, label: c.name}))} />
        </Field>
        <Field label={t('cPhone')}>
          <Input value={phone} placeholder="+380 00 000 00 00"
                 onChange={e => setPhone(phoneMask(e.target.value))} />
        </Field>
      </div>
      <Button kind="line" size="sm" icon="plus" style={{alignSelf: 'flex-start'}}
              onClick={() => nav.modal('client', {onCreated: c => setClientId(c.id)})}>
        {t('newClient')}
      </Button>

      <Field label={t('service')} error={err.serviceId}>
        <Select value={serviceId} bad={!!err.serviceId} placeholder={t('pickService')}
                onChange={e => pickService(e.target.value)}
                options={db.services.map(s => ({
                  value: s.id, label: s.name + ' · ' + money(s.price, db.settings.currency) + ' · ' + s.dur + ' ' + t('minShort'),
                }))} />
      </Field>

      <div className="f2">
        <Field label={t('date')}>
          <Input type="date" value={date} onChange={e => setDate(e.target.value || iso(new Date()))} />
        </Field>
        <Field label={t('time')} error={err.time || (busy ? t('busy') : null)}
               hint={outside && !busy ? t('offHours') : null}>
          <Select value={time} bad={busy} onChange={e => setTime(e.target.value)}
                  options={times.map(x => ({value: x, label: x}))} />
        </Field>
      </div>

      <div className="f2">
        <Field label={t('duration') + ', ' + t('minShort')}>
          <Input type="number" min="5" step="5" value={dur} onChange={e => setDur(e.target.value)} />
        </Field>
        <Field label={t('price')}>
          <Input type="number" min="0" step="1" value={price} onChange={e => setPrice(e.target.value)} />
        </Field>
      </div>

      <Field label={t('comment')}>
        <Area value={note} placeholder={t('commentPh')} onChange={e => setNote(e.target.value)} />
      </Field>

      {!editing && (
        <div className="f2">
          <Field label={t('repeat')}>
            <Select value={every} onChange={e => setEvery(e.target.value)} options={[
              {value: 'no', label: t('repeatNo')}, {value: 'week', label: t('repeatWeek')},
              {value: 'two', label: t('repeat2')}, {value: 'month', label: t('repeatMonth')},
            ]} />
          </Field>
          {every !== 'no' && (
            <Field label={t('repeatTimes')}>
              <Select value={String(howMany)} onChange={e => setHowMany(Number(e.target.value))}
                      options={[2, 3, 4, 6, 8, 10, 12].map(n => ({value: String(n), label: String(n)}))} />
            </Field>
          )}
        </div>
      )}
    </Modal>
  );
}

function ServiceForm({id}){
  const db = useDB();
  const nav = useNav();
  const editing = id ? serviceById(db, id) : null;
  const [name, setName] = useState(editing ? editing.name : '');
  const [price, setPrice] = useState(editing ? editing.price : 20);
  const [dur, setDur] = useState(editing ? editing.dur : 45);
  const [active, setActive] = useState(editing ? editing.active !== false : true);
  const [err, setErr] = useState({});

  const submit = () => {
    if (!name.trim()){ setErr({name: t('required')}); return; }
    const data = {name: name.trim(), price: Number(price) || 0, dur: Math.max(5, Number(dur) || 30), active};
    if (editing) Act.updService(id, data); else Act.addService(data);
    toast(t('tSaved'), 'ok');
    nav.close();
  };

  return (
    <Modal title={editing ? t('editService') : t('newService')} onClose={nav.close} footer={
      <>
        <Button kind="soft" onClick={nav.close}>{t('cancel')}</Button>
        <div className="spacer" />
        <Button kind="gold" icon="check" onClick={submit}>{t('save')}</Button>
      </>
    }>
      <Field label={t('svcName')} error={err.name}>
        <Input value={name} bad={!!err.name} autoFocus placeholder="Стрижка" onChange={e => setName(e.target.value)} />
      </Field>
      <div className="f2">
        <Field label={t('price')}>
          <Input type="number" min="0" value={price} onChange={e => setPrice(e.target.value)} />
        </Field>
        <Field label={t('duration') + ', ' + t('minShort')}>
          <Input type="number" min="5" step="5" value={dur} onChange={e => setDur(e.target.value)} />
        </Field>
      </div>
      <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
        <Switch on={active} onChange={setActive} />
        <span style={{fontSize: 13}}>{t('svcOnline')}</span>
      </div>
    </Modal>
  );
}

/* Напоминание клиенту. SMS-шлюза у нас нет, поэтому открываем диалог
   в мессенджере с уже готовым текстом — барберу остаётся нажать
   «отправить». */
function RemindLinks({client, appt, db}){
  const phone = String(client.phone || '').replace(/\D/g, '');
  if (!phone) return null;
  const when = fmtDay(fromIso(appt.date), LANG) + ' ' + appt.time;
  const text = client.name.split(' ')[0] + ', напоминаю: ' + when + ' — ' +
    serviceName(db, appt.serviceId) + '. ' + (db.profile.shop || '') +
    (db.profile.address ? ', ' + db.profile.address : '') + '.';
  const open = url => { try { window.open(url, '_blank'); } catch (e){} };
  return (
    <>
      <Button kind="soft" size="sm" title={t('remindText')}
              onClick={() => open('https://wa.me/' + phone + '?text=' + encodeURIComponent(text))}>
        {t('remindWA')}
      </Button>
      <Button kind="soft" size="sm" title={t('remindText')}
              onClick={() => open('https://t.me/+' + phone)}>
        {t('remindTG')}
      </Button>
      <Button kind="soft" size="sm" title={t('remindText')}
              onClick={() => open('sms:+' + phone + '?body=' + encodeURIComponent(text))}>
        {t('remindSMS')}
      </Button>
    </>
  );
}

/* Активная запись: таймер и закрытие в деньги */
function ActiveSession({id}){
  const db = useDB();
  const nav = useNav();
  const a = db.appts.find(x => x.id === id);
  const [price, setPrice] = useState(a ? a.price : 0);
  const [, tick] = useState(0);
  useEffect(() => {
    const h = setInterval(() => tick(n => n + 1), 30000);
    return () => clearInterval(h);
  }, []);
  if (!a) return null;
  const c = clientById(db, a.clientId);
  const started = a.startedAt || Date.now();
  const gone = Math.max(0, Math.round((Date.now() - started) / 60000));

  return (
    <Modal title={t('inProgress')} onClose={nav.close} footer={
      <>
        <Button kind="soft" onClick={nav.close}>{t('cancel')}</Button>
        <div className="spacer" />
        <Button kind="gold" icon="check" onClick={() => {
          Act.complete(a.id, price);
          toast(t('tDone'), 'ok');
          nav.close();
        }}>{t('finishFor')}</Button>
      </>
    }>
      <div style={{display: 'flex', alignItems: 'center', gap: 14}}>
        <Avatar name={c && c.name} src={c && c.photo} size={56} ring />
        <div>
          <div style={{fontSize: 17, fontWeight: 700}}>{c ? c.name : '—'}</div>
          <div style={{color: 'var(--ink-3)', fontSize: 13}}>{serviceName(db, a.serviceId)}</div>
        </div>
        <div className="spacer" />
        <div style={{textAlign: 'right'}}>
          <div className="num" style={{fontSize: 26, fontWeight: 750, color: 'var(--gold)'}}>{gone}</div>
          <div style={{fontSize: 11, color: 'var(--ink-3)'}}>{t('minShort')} · {t('elapsed')}</div>
        </div>
      </div>
      <Progress value={clamp(gone / Math.max(1, a.dur), 0, 1)} />
      <Field label={t('price')} hint={t('finishFor')}>
        <Input type="number" min="0" value={price} onChange={e => setPrice(e.target.value)} />

  );
}
