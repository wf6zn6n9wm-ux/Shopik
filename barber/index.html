/* Сколько символов имени влезает в плашку шириной colW: 26px съедают
   поля и полоска статуса, в тесной верстке ещё 40px занимает время.
   Ширина символа взята с запасом (в фамилиях попадаются широкие Ш, Щ, М),
   и на всю ширину плашки запас больше — там имя длиннее и промах виднее. */
const nameRoom = (colW, tight) =>
  Math.max(4, Math.floor(((colW || 104) - 26 - (tight ? 40 : 0)) / (tight ? 7 : 7.4)));

function EventBox({a, db, top, height, colW, onOpen}){
  const st = rowStatus(db, a);
  const cls = st === 'done' ? 'done' : st === 'cancel' ? 'cancel' : st === 'pend' ? 'pend' : '';
  /* короткие записи не помещают время и имя в два ряда — сжимаем в одну
     строку, иначе имя обрезается и в календаре пустые плашки */
  const tight = height < 42;
  const full = clientName(db, a.clientId);
  const short = fitName(full, nameRoom(colW, tight));
  return (
    <button className={cx('cal-ev', cls)} style={{top, height: Math.max(22, height)}}
            draggable onDragStart={() => { DRAG = a.id; }} onDragEnd={() => { DRAG = null; }}
            onClick={onOpen} title={a.time + ' · ' + full + ' · ' + serviceName(db, a.serviceId)}>
      {tight ? (
        <span className="n" style={{display: 'block'}}>
          <span className="t num">{a.time}</span> {short}
        </span>
      ) : (
        <>
          <span className="t num">{a.time}</span>
          <span className="n" style={{display: 'block'}}>{short}</span>
          {height > 62 && <span className="t cut" style={{display: 'block'}}>{serviceName(db, a.serviceId)}</span>}
        </>
      )}
    </button>
  );
}

/* Колонка дня в режимах «День» и «Неделя»: сетка часов, записи, приём
   перетаскивания. Время при сбросе округляется до шага записи. */
function DayColumn({db, dateIso, from, to, step, onOpen, onSlot}){
  const rows = dayAppts(db, dateIso);
  const hours = Math.ceil((to - from) / 60);
  /* колонки тянутся под ширину экрана, поэтому длину имени считаем от
     реальной ширины, а не от догадки */
  const box = useRef(null);
  const [colW, setColW] = useState(0);
  useEffect(() => {
    const measure = () => { if (box.current) setColW(box.current.offsetWidth); };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, []);
  const drop = e => {
    e.preventDefault();
    if (!DRAG) return;
    const box = e.currentTarget.getBoundingClientRect();
    const raw = from + (e.clientY - box.top) / HOUR_H * 60;
    const snapped = Math.round(raw / step) * step;
    const a = db.appts.find(x => x.id === DRAG);
    if (a && (a.date !== dateIso || mins(a.time) !== snapped)){
      Act.move(DRAG, dateIso, hhmm(clamp(snapped, 0, 1439)));
      toast(t('tMoved'), 'ok');
    }
    DRAG = null;
  };
  const off = !(db.profile.hours[DOW_KEYS[dowIdx(fromIso(dateIso))]] || {}).on;
  return (
    <div className={cx('cal-col', off && 'off')} ref={box} onDragOver={e => e.preventDefault()} onDrop={drop}>
      {Array.from({length: hours}, (_, i) => (
        <div key={i} className="cal-slot" onClick={() => onSlot(dateIso, hhmm(from + i * 60))} />
      ))}
      {rows.map(a => (
        <EventBox key={a.id} a={a} db={db} colW={colW}
                  top={(mins(a.time) - from) / 60 * HOUR_H}
                  height={a.dur / 60 * HOUR_H - 2}
                  onOpen={() => onOpen(a.id)} />
      ))}
      {dateIso === iso(new Date()) && nowMin() >= from && nowMin() <= to &&
        <div className="cal-now" style={{top: (nowMin() - from) / 60 * HOUR_H}} />}
    </div>
  );
}

function CalendarPage(){
  const db = useDB();
  const nav = useNav();
  const narrow = useNarrow();
  /* на телефоне неделя из семи колонок читается только боком, поэтому
     открываем день — неделя остаётся на расстоянии одного нажатия */
  const [mode, setMode] = useState(() => narrow ? 'day' : 'week');
  const [anchor, setAnchor] = useState(iso(new Date()));
  const d = fromIso(anchor);
  const step = db.settings.step || 30;

  const days = mode === 'day' ? [d] : mode === 'week'
    ? Array.from({length: 7}, (_, i) => addDays(startOfWeek(d), i))
    : [];

  /* границы сетки: рабочий день плюс всё, что вышло за него */
  const bounds = useMemo(() => {
    let from = 24 * 60, to = 0;
    const list = days.length ? days : [d];
    list.forEach(day => {
      const h = db.profile.hours[DOW_KEYS[dowIdx(day)]];
      if (h && h.on){ from = Math.min(from, mins(h.from)); to = Math.max(to, mins(h.to)); }
      dayAppts(db, iso(day)).forEach(a => {
        from = Math.min(from, mins(a.time));
        to = Math.max(to, mins(a.time) + a.dur);
      });
    });
    if (from >= to){ from = 9 * 60; to = 20 * 60; }
    return [Math.floor(from / 60) * 60, Math.ceil(to / 60) * 60];
  }, [db.appts, db.profile.hours, anchor, mode]);

  const shift = dir => {
    if (mode === 'day') setAnchor(iso(addDays(d, dir)));
    else if (mode === 'week') setAnchor(iso(addDays(d, dir * 7)));
    else setAnchor(iso(addMonths(d, dir)));
  };
  const title = mode === 'month' ? monthTitle(d, LANG)
    : mode === 'week'
      ? fmtDayShort(startOfWeek(d), LANG) + ' — ' + fmtDayShort(addDays(startOfWeek(d), 6), LANG)
      : fmtFull(d, LANG) + ', ' + WD_FULL[LANG][dowIdx(d)].toLowerCase();

  const openAppt = id => nav.modal('apptCard', {id});
  const onSlot = (dateIso, time) => nav.modal('appt', {date: dateIso, time});
  const hours = Array.from({length: Math.ceil((bounds[1] - bounds[0]) / 60)}, (_, i) => bounds[0] + i * 60);

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1 className="page-title">{t('navCal')}</h1>
          <div className="page-sub">{title}</div>
        </div>
        <div className="spacer" />
        <Segmented value={mode} onChange={setMode} options={[
          {value: 'day', label: t('day')}, {value: 'week', label: t('week')}, {value: 'month', label: t('month')},
        ]} />
        <IconButton icon="chevL" bord onClick={() => shift(-1)} aria-label="prev" />
        <Button kind="ghost" size="sm" onClick={() => setAnchor(iso(new Date()))}>{t('today')}</Button>
        <IconButton icon="chevR" bord onClick={() => shift(1)} aria-label="next" />
        <Button kind="gold" icon="plus" onClick={() => nav.modal('appt', {date: anchor})}>{t('newAppt')}</Button>
      </div>

      <Card style={{overflow: 'hidden'}}>
        {mode === 'month' ? (
          <MonthGrid db={db} anchor={d} onOpen={openAppt} onDay={id => { setAnchor(id); setMode('day'); }} />
        ) : (
          <div className="cal-scroll">
            <div className={mode === 'day' ? 'cal-day1' : 'cal-week'}>
              <div className="cal-gut" />
              {days.map(day => (
                <div key={iso(day)} className={cx('cal-hcell', iso(day) === iso(new Date()) && 'today')}
                     onClick={() => { setAnchor(iso(day)); setMode('day'); }} style={{cursor: 'pointer'}}>
                  <div className="wd">{WD_SHORT[LANG][dowIdx(day)]}</div>
                  <div className="dd num">{day.getDate()}</div>
                </div>
              ))}
              <div>
                {hours.map(h => <div key={h} className="cal-hour num">{hhmm(h)}</div>)}
              </div>
              {days.map(day => (
                <DayColumn key={iso(day)} db={db} dateIso={iso(day)} from={bounds[0]} to={bounds[1]}
                           step={step} onOpen={openAppt} onSlot={onSlot} />
              ))}
            </div>
          </div>
        )}
      </Card>
      <div className="hint" style={{marginTop: 10}}>{t('hint7')}</div>
    </div>
  );
}

function MonthGrid({db, anchor, onOpen, onDay}){
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const start = startOfWeek(first);
  const cells = Array.from({length: 42}, (_, i) => addDays(start, i));
  const today = iso(new Date());
  return (
    <div>
      <div className="cal-month">
        {WD_SHORT[LANG].map(w => (
          <div key={w} className="cal-hcell" style={{borderTop: 0}}><div className="wd">{w}</div></div>
        ))}
      </div>
      <div className="cal-month">
        {cells.map(day => {
          const id = iso(day);
          const rows = dayAppts(db, id);
          return (
            <div key={id} className={cx('cal-mcell', day.getMonth() !== anchor.getMonth() && 'out', id === today && 'today')}
                 onDragOver={e => e.preventDefault()}
                 onDrop={e => {
                   e.preventDefault();
                   if (!DRAG) return;
                   const a = db.appts.find(x => x.id === DRAG);
                   if (a && a.date !== id){ Act.move(DRAG, id, a.time); toast(t('tMoved'), 'ok'); }
                   DRAG = null;
                 }}>
              <button className="d num" onClick={() => onDay(id)}>{day.getDate()}</button>
              {rows.slice(0, 3).map(a => {
                const st = rowStatus(db, a);
                return (
                  <button key={a.id} className={cx('cal-mev', st === 'done' && 'done', st === 'cancel' && 'cancel', st === 'pend' && 'pend')}
                          draggable onDragStart={() => { DRAG = a.id; }} onDragEnd={() => { DRAG = null; }}
                          onClick={() => onOpen(a.id)}>
                    <span className="num">{a.time}</span> {clientName(db, a.clientId)}
                  </button>
                );
              })}
              {rows.length > 3 && (
                <button className="hint" style={{textAlign: 'left'}} onClick={() => onDay(id)}>
                  +{rows.length - 3}
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* узкий экран — вместо таблицы список карточек */
function useNarrow(){
  const [narrow, setNarrow] = useState(() => {
    try { return window.matchMedia('(max-width: 920px)').matches; } catch (e){ return false; }
  });
  useEffect(() => {
    let mq;
    try { mq = window.matchMedia('(max-width: 920px)'); } catch (e){ return; }
    const fn = () => setNarrow(mq.matches);
    if (mq.addEventListener) mq.addEventListener('change', fn);
    return () => { if (mq.removeEventListener) mq.removeEventListener('change', fn); };
  }, []);
  return narrow;
}

const FILTERS = [
  {id: 'all', key: 'all'}, {id: 'regular', key: 'regulars'}, {id: 'new', key: 'newOnes'},
  {id: 'lapsed', key: 'lapsed'}, {id: 'next', key: 'withNext'},
];

function clientRows(db, query, filter){
  const q = String(query || '').trim().toLowerCase();
  const digits = q.replace(/\D/g, '');
  return db.clients
    .map(c => ({c, s: clientStats(db, c.id)}))
    .filter(({c}) => {
      if (!q) return true;
      if (c.name.toLowerCase().includes(q)) return true;
      return !!digits && c.phone.replace(/\D/g, '').includes(digits);
    })
    .filter(({c, s}) => {
      if (filter === 'regular') return s.visits >= 5;
      if (filter === 'new') return s.visits <= 1;
      if (filter === 'lapsed') return !!s.last && daysSince(s.last.date) > 45;
      if (filter === 'next') return !!s.next;
      return true;
    })
    .sort((a, b) => {
      const la = a.s.last ? a.s.last.date : '';
      const lb = b.s.last ? b.s.last.date : '';
      return lb.localeCompare(la) || a.c.name.localeCompare(b.c.name);
    });
}

const lastLabel = (s, cur) => s.last
  ? (daysSince(s.last.date) === 0 ? t('today') : daysSince(s.last.date) === 1 ? t('yesterday')
    : fmtDayShort(fromIso(s.last.date), LANG))
  : t('never');

function nextLabel(s){
  if (!s.next) return '—';
  const d = s.next.date, today = iso(new Date());
  const pre = d === today ? t('today') : d === iso(addDays(new Date(), 1)) ? t('tomorrow') : fmtDayShort(fromIso(d), LANG);
  return pre + ' ' + s.next.time;
}

  const [title, setTitle] = useState(editing ? editing.title : '');

  const [date, setDate] = useState(editing ? editing.date : iso(new Date()));

/* Приём заявок с сайта. Выключено — кабинет работает на своём
   хранилище и в сеть не ходит вовсе. */
function SyncBlock({db}){
  const s = db.settings;
  const [busy, setBusy] = useState('');
  const [link, setLink] = useState(null);

  const run = async (kind, fn) => {
    setBusy(kind);
    const r = await fn();
    setBusy('');
    return r;
  };
  const publish = () => run('pub', async () => {
    const r = await Sync.publish();
    toast(r.ok ? t('syncOk') : r.reason === 'forbidden' ? t('syncBusy') : t('syncOff'), r.ok ? 'ok' : 'bad');
    return r;
  });
  const pull = () => run('pull', async () => {
    const r = await Sync.pull();
    toast(!r.ok ? t('syncOff') : r.added ? t('syncNew') + ': ' + r.added : t('syncNone'), r.ok ? 'ok' : 'bad');
    return r;
  });

  return (
    <div>
      <Row title={t('syncOn')} note={t('syncNote')}>
        <Switch on={!!s.sync} onChange={v => {
          Act.settings({sync: v});
          if (v){ Sync.ensureToken(); setTimeout(publish, 0); }
        }} />
      </Row>
      {s.sync && (
        <>
          <div style={{display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 6}}>
            <Button kind="ghost" size="sm" icon="link" disabled={busy === 'pub'} onClick={publish}>{t('syncNow')}</Button>
            <Button kind="ghost" size="sm" icon="bell" disabled={busy === 'pull'} onClick={pull}>{t('syncPull')}</Button>
          </div>
          <hr className="sep" style={{margin: '14px 0'}} />
          <Row title="Telegram" note={t('tgNote')}>
            <Button kind="soft" size="sm" onClick={async () => {
              const r = await Sync.link();
              if (!r.ok){ toast(t('syncOff'), 'bad'); return; }
              Act.settings({tgLinked: !!r.linked});
              setLink(r);
              if (r.url){ try { window.open(r.url, '_blank'); } catch (e){} }
            }}>{t('tgConnect')}</Button>
          </Row>
          {link && (
            <div className="hint" style={{wordBreak: 'break-all'}}>
              {link.url ? <a href={link.url} target="_blank" rel="noreferrer" style={{color: 'var(--gold)'}}>{t('tgOpen')}</a> : null}
              {' '}/start {link.code}
            </div>
          )}
        </>
      )}
      {!s.sync && <div className="hint">{t('syncOff')}</div>}
    </div>
  );
}

function Settings(){
  const db = useDB();
  const nav = useNav();
  const p = db.profile, s = db.settings;
  const bookUrl = (() => {
    try {
      const base = location.href.replace(/[^/]*$/, '');
      return base + 'book.html?b=' + encodeURIComponent(s.slug || 'barber');
    } catch (e){ return 'book.html'; }
  })();

  const save = patch => { Act.profile(patch); };
  const exportJson = () => {
    try {
      const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'probarber-backup.json';
      a.click();
      toast(t('tSaved'), 'ok');
    } catch (e){ toast(t('tSaved'), 'bad'); }
  };
  /* импорт — это замена всей базы, поэтому сначала проверяем файл, а
     потом спрашиваем подтверждение */
  const importJson = () => pickFile('application/json,.json', text => {
    let next = null;
    try { next = JSON.parse(text); } catch (e){ next = null; }
    if (!next || !Array.isArray(next.clients) || !Array.isArray(next.appts)){
      toast(t('importBad'), 'bad');
      return;
    }
    nav.modal('confirm', {
      title: t('importJson'), text: t('importAsk'), danger: true,
      onYes: () => {
        const base = emptyDB();
        Store.set(() => Object.assign(base, next, {
          settings: Object.assign({}, base.settings, next.settings),
          profile: Object.assign({}, base.profile, next.profile),
        }));
        toast(t('tSaved'), 'ok');
      },
    });
  }, true);

  const copy = () => {
    try {
      if (navigator.clipboard) navigator.clipboard.writeText(bookUrl);
      toast(t('copied'), 'ok');
    } catch (e){ toast(t('copied'), 'bad'); }
  };

  return (
    <div className="page">
      <div className="page-head">
        <h1 className="page-title">{t('navSettings')}</h1>
        <div className="spacer" />
        <BellButton db={db} desk />
      </div>

      <div className="grid g-2">
        <div className="grid" style={{alignContent: 'start'}}>
          <Card className="card-pad">
            <div className="card-title" style={{marginBottom: 14}}>{t('setProfile')}</div>
            <div className="photo-row" style={{gap: 14, marginBottom: 14}}>
              <Avatar name={p.name} src={p.photo} size={64} ring />
              <div style={{flex: 1}}>
                <Field label={t('photoUrl')}>
                  <div className="photo-row">
                    <Input value={p.photo && p.photo.startsWith('data:') ? '' : (p.photo || '')} placeholder="https://"
                           onChange={e => save({photo: e.target.value})} />
                    <Button kind="soft" size="sm" onClick={() => pickPhoto(v => save({photo: v}))}>{t('photoPick')}</Button>
                    {p.photo && <IconButton icon="close" onClick={() => save({photo: ''})} aria-label={t('photoClear')} />}
                  </div>
                </Field>
              </div>
            </div>
            <div className="f2">
              <Field label={t('cName')}><Input value={p.name} onChange={e => save({name: e.target.value})} /></Field>
              <Field label={t('barber')}><Input value={p.role} onChange={e => save({role: e.target.value})} /></Field>
              <Field label={t('cPhone')}><Input value={p.phone} onChange={e => save({phone: phoneMask(e.target.value)})} /></Field>
              <Field label="Барбершоп"><Input value={p.shop} onChange={e => save({shop: e.target.value})} /></Field>
            </div>
            <div style={{height: 12}} />
            <Field label="Адрес"><Input value={p.address} onChange={e => save({address: e.target.value})} /></Field>
            <div style={{height: 12}} />
            <Field label={t('about')}><Area value={p.about} onChange={e => save({about: e.target.value})} /></Field>
          </Card>

          <Card className="card-pad">
            <div className="card-title" style={{marginBottom: 6}}>{t('setHours')}</div>
            {DOW_KEYS.map((k, i) => {
              const h = p.hours[k];
              return (
                <div key={k} className="hours-row" style={{borderTop: i ? '1px solid var(--line)' : 0}}>
                  <span className="hours-day">{WD_FULL[LANG][i]}</span>
                  <Switch on={h.on} onChange={v => Act.hours(k, {on: v})} />
                  {h.on ? (
                    <span className="hours-times">
                      <input className="input hours-time" type="time" value={h.from}
                             onChange={e => Act.hours(k, {from: e.target.value || '09:00'})} />
                      <span className="hours-dash">—</span>
                      <input className="input hours-time" type="time" value={h.to}
                             onChange={e => Act.hours(k, {to: e.target.value || '20:00'})} />
                    </span>
                  ) : <span className="hint">{t('dayOff')}</span>}
                </div>
              );
            })}
          </Card>
        </div>

        <div className="grid" style={{alignContent: 'start'}}>
          <Card className="card-pad">
            <div className="card-title" style={{marginBottom: 6}}>{t('setTheme')}</div>
            <Row title={t('setTheme')}>
              <Segmented value={s.theme} onChange={v => Act.settings({theme: v})} options={[
                {value: 'dark', label: t('thDark')}, {value: 'light', label: t('thLight')}, {value: 'system', label: t('thSystem')},
              ]} />
            </Row>
            <hr className="sep" />
            <Row title={t('setCurrency')}>
              <Segmented value={s.currency} onChange={v => Act.settings({currency: v})}
                         options={Object.keys(CURRENCIES).map(c => ({value: c, label: c}))} />
            </Row>
            <hr className="sep" />
            <Row title={t('setLang')}>
              <Segmented value={s.lang} onChange={v => Act.settings({lang: v})}
                         options={LANGS.map(l => ({value: l.id, label: l.title}))} />
            </Row>
            <hr className="sep" />
            <Row title={t('slotStep')} note={t('stepNote')}>
              <Segmented value={String(s.step)} onChange={v => Act.settings({step: Number(v)})}
                         options={[{value: '15', label: '15'}, {value: '30', label: '30'}, {value: '60', label: '60'}]} />
            </Row>
          </Card>

          <Card className="card-pad">
            <div className="card-title" style={{marginBottom: 6}}>{t('setNotif')}</div>
            {[['booked', 'nBooked'], ['reminder', 'nReminder'], ['birthday', 'nBirthday'], ['lapsed', 'nLapsed']].map(([k, key], i) => (
              <div key={k} style={{borderTop: i ? '1px solid var(--line)' : 0}}>
                <Row title={t(key)}>
                  <Switch on={!!s.notif[k]} onChange={v => Act.notif({[k]: v})} />
                </Row>
              </div>
            ))}
          </Card>

          <Card className="card-pad">
            <div className="card-title" style={{marginBottom: 12}}>{t('setOnline')}</div>
            <Field label="URL" hint={t('setOnline')}>
              <Input value={s.slug} onChange={e => Act.settings({slug: e.target.value.replace(/[^a-z0-9_-]/gi, '').toLowerCase()})} />
            </Field>
            <div style={{fontSize: 12, color: 'var(--ink-3)', wordBreak: 'break-all', margin: '10px 0'}}>{bookUrl}</div>
            <div style={{display: 'flex', gap: 8, flexWrap: 'wrap'}}>
              <Button kind="gold" icon="link" onClick={() => { try { window.open(bookUrl, '_blank'); } catch (e){} }}>
                {t('openPublic')}
              </Button>
              <Button kind="ghost" icon="copy" onClick={copy}>{t('copyLink')}</Button>
            </div>
            <hr className="sep" style={{margin: '16px 0'}} />
            <SyncBlock db={db} />
          </Card>

          <Card className="card-pad">
            <div className="card-title" style={{marginBottom: 12}}>{t('setData')}</div>
            <div style={{display: 'flex', gap: 8, flexWrap: 'wrap'}}>
              <Button kind="ghost" icon="download" onClick={exportJson}>{t('exportJson')}</Button>
              <Button kind="ghost" icon="edit" onClick={importJson}>{t('importJson')}</Button>
              <Button kind="danger" icon="trash" onClick={() => nav.modal('confirm', {
                title: t('resetDemo'), text: t('resetAsk'), danger: true,
                onYes: () => { Act.reset(); toast(t('tSaved'), 'ok'); },
              })}>{t('resetDemo')}</Button>
            </div>
            <div className="hint" style={{marginTop: 12}}>
              {db.clients.length} {t('navClients').toLowerCase()} · {db.appts.length} {t('kpiAppts').toLowerCase()} · {db.services.length} {t('navServices').toLowerCase()}
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}

/* ── 23. ОБОЛОЧКА ─────────────────────────────────────────────────── */

const PAGES = [
  {id: 'home', key: 'navHome', icon: 'home'},
  {id: 'calendar', key: 'navCal', icon: 'calendar'},
  {id: 'clients', key: 'navClients', icon: 'users'},
  {id: 'services', key: 'navServices', icon: 'scissors'},
  {id: 'finance', key: 'navFinance', icon: 'dollar'},
  {id: 'chat', key: 'navChat', icon: 'chat'},
  {id: 'settings', key: 'navSettings', icon: 'settings'},
];
const MOB_PAGES = ['home', 'calendar', 'clients', 'chat'];

/* На узком экране колокольчик живёт в верхней панели, поэтому на самих
   страницах его прячем — иначе он дублируется. */
function BellButton({db, desk}){
  const nav = useNav();
  const n = notifications(db).length;
  return (
    <div className={cx('rel', desk && 'desk-only')}>
      <IconButton icon="bell" bord onClick={() => nav.modal('notif', {})} aria-label={t('ntTitle')} />
      {n > 0 && <span className="bell-dot num">{n}</span>}
    </div>
  );
}

function Sidebar({page, go, db}){
  const unread = unreadCount(db);
  return (
    <aside className="side">
      <div className="brand">
        <Logo className="brand-mark" />
        <div className="brand-name">{db.profile.shop || 'Про Барбер'}</div>
        <div className="brand-sub">{t('brandSub')}</div>
      </div>
      <nav className="nav">
        {PAGES.map(p => (
          <button key={p.id} className={cx('nav-item', page === p.id && 'on')} onClick={() => go(p.id)}>
            <Icon n={p.icon} />
            <span>{t(p.key)}</span>
            {p.id === 'chat' && unread > 0 && <span className="nav-badge num">{unread}</span>}
          </button>
        ))}
      </nav>
      <button className="side-user" onClick={() => go('settings')}>
        <Avatar name={db.profile.name} src={db.profile.photo} size={36} />
        <span style={{minWidth: 0}}>
          <span className="nm cut" style={{display: 'block'}}>{db.profile.name}</span>
          <span className="rl" style={{display: 'block'}}>{db.profile.role}</span>
        </span>
        <Icon n="chevR" className="chev" />
      </button>
    </aside>
  );
}

function MobileBar({db, go}){
  return (
    <div className="mob-top mob-only">
      <Logo style={{width: 26, height: 26, color: 'var(--gold)'}} />
      <div style={{fontWeight: 750, fontSize: 15}}>{db.profile.shop || 'Про Барбер'}</div>
      <div className="spacer" />
      <BellButton db={db} />
      <IconButton icon="user" bord onClick={() => go('settings')} />
    </div>
  );
}

function MobileNav({page, go, db, onMore}){
  const unread = unreadCount(db);
  return (
    <nav className="mob-nav">
      {MOB_PAGES.map(id => {
        const p = PAGES.find(x => x.id === id);
        return (
          <button key={id} className={cx(page === id && 'on')} onClick={() => go(id)}>
            <Icon n={p.icon} />
            <span>{t(p.key)}</span>
            {id === 'chat' && unread > 0 && <span className="nav-badge num" style={{position: 'absolute', top: 2, right: '22%'}}>{unread}</span>}
          </button>
        );
      })}
      <button onClick={onMore} className={cx(['services', 'finance', 'settings'].includes(page) && 'on')}>
        <Icon n="grid" />
        <span>{t('menuMore')}</span>
      </button>
    </nav>
  );
}

function MoreSheet({go}){
  const nav = useNav();
  return (
    <Modal title={t('menuMore')} onClose={nav.close}>
      <div className="rows" style={{margin: '-8px -20px'}}>
        {PAGES.map(p => (
          <button key={p.id} className="row" onClick={() => { nav.close(); go(p.id); }}>
            <div className="kpi-ico" style={{marginBottom: 0, width: 32, height: 32}}><Icon n={p.icon} /></div>
            <span className="row-main"><span className="row-name">{t(p.key)}</span></span>
            <Icon n="chevR" style={{width: 16, height: 16, color: 'var(--ink-3)'}} />
          </button>
        ))}
      </div>
    </Modal>
  );
}

/* ── 24. ТЕМА ─────────────────────────────────────────────────────── */

const prefersDark = () => {
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e){ return true; }
};
function applyTheme(theme){
  const dark = theme === 'dark' || (theme !== 'light' && prefersDark());
  try {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const meta = document.getElementById('metaTheme');
    if (meta) meta.setAttribute('content', dark ? '#080A0C' : '#FFFFFF');
  } catch (e){}
}

/* ── 25. ПРИЛОЖЕНИЕ ───────────────────────────────────────────────── */

const SCREENS = {
  home: () => <Home />,
  calendar: () => <CalendarPage />,
  clients: () => <Clients />,
  client: p => <ClientPage id={p.id} />,
  services: () => <Services />,
  finance: () => <Finance />,
  chat: p => <Messages clientId={p.clientId} />,
  settings: () => <Settings />,
};

function App(){
  const db = useDB();
  const [route, setRoute] = useState({page: 'home', params: {}});
  const [stack, setStack] = useState([]);

  LANG = db.settings.lang || 'ru';
  useEffect(() => { applyTheme(db.settings.theme); }, [db.settings.theme]);
  useEffect(() => {
    try { document.documentElement.lang = db.settings.lang; } catch (e){}
  }, [db.settings.lang]);
  /* системная тема может поменяться на ходу — следим, если выбрана «Системная» */
  useEffect(() => {
    let mq;
    try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e){ return; }
    const fn = () => { if (Store.state.settings.theme === 'system') applyTheme('system'); };
    if (mq.addEventListener) mq.addEventListener('change', fn);
    return () => { if (mq.removeEventListener) mq.removeEventListener('change', fn); };
  }, []);

  /* заявки забираем при открытии и раз в пару минут, витрину
     перепубликовываем после изменений — но не чаще раза в пять секунд,
     иначе каждое нажатие уходило бы в сеть */
  useEffect(() => {
    if (!db.settings.sync) return;
    let alive = true;
    const tick = () => { if (alive) Sync.pull(); };
    tick();
    const h = setInterval(tick, 120000);
    return () => { alive = false; clearInterval(h); };
  }, [db.settings.sync, db.settings.slug]);

  useEffect(() => {
    if (!db.settings.sync) return;
    let timer = null;
    const off = Store.sub(() => {
      if (!Store.state.settings.sync) return;
      clearTimeout(timer);
      timer = setTimeout(() => Sync.publish(), 5000);
    });
    return () => { clearTimeout(timer); off(); };
  }, [db.settings.sync]);

  const go = useCallback((page, params) => {
    setRoute({page, params: params || {}});
    setStack([]);
    try { window.scrollTo(0, 0); } catch (e){}
  }, []);
  const modal = useCallback((type, props) => setStack(s => s.concat([{type, props: props || {}, key: uid('md')}])), []);
  const close = useCallback(() => setStack(s => s.slice(0, -1)), []);
  const ctx = useMemo(() => ({page: route.page, params: route.params, go, modal, close, cur: db.settings.currency}),
    [route, go, modal, close, db.settings.currency]);

  const screen = SCREENS[route.page] || SCREENS.home;

  return (
    <Nav.Provider value={ctx}>
      <div className="app">
        <Sidebar page={route.page} go={go} db={db} />
        <div className="main">
          <MobileBar db={db} go={go} />
          {screen(route.params)}
        </div>
        <MobileNav page={route.page} go={go} db={db} onMore={() => modal('more', {})} />
      </div>
      {stack.map(m => <ModalHost key={m.key} type={m.type} props={m.props} go={go} />)}
      <Toasts />
    </Nav.Provider>
  );
}

function ModalHost({type, props, go}){
  const nav = useNav();
  if (type === 'appt') return <ApptForm id={props.id} preset={props} />;
  if (type === 'client') return <ClientForm id={props.id} onCreated={props.onCreated} />;
  if (type === 'service') return <ServiceForm id={props.id} />;
  if (type === 'apptCard') return <ApptCard id={props.id} />;
  if (type === 'active') return <ActiveSession id={props.id} />;
  if (type === 'expense') return <ExpenseForm id={props.id} />;
  if (type === 'notif') return <NotifPanel />;
  if (type === 'more') return <MoreSheet go={go} />;
  if (type === 'confirm') return <Confirm {...props} onClose={nav.close} />;
  return null;
}

/* ── 26. СТАРТ ────────────────────────────────────────────────────── */

function boot(){
  const db = Disk.read() || seedDB();
  Store.init(db);
  Disk.write(db);
  LANG = db.settings.lang || 'ru';
  applyTheme(db.settings.theme);
  try {
    const root = document.getElementById('root');
    if (root && ReactDOM.createRoot) ReactDOM.createRoot(root).render(<App />);
  } catch (e){ console.error(e); }
}
boot();

</script>
</body>
</html>
