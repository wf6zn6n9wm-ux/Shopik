<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Про Барбер</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="pay.css" />
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M6.5 9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5M6.5 20a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5M8.6 8.1 20 19.5M20 4.5 8.6 15.9"/></svg></div>
    <b>Про Барбер</b>
  </div>
  <h1 id="h1">Оплата прошла</h1>
  <p class="sub" id="sub">Вернитесь в кабинет — доступ уже активен. Если кабинет ещё не заметил оплату, нажмите там «Я уже оплатил».</p>
  <a class="go" id="go" href="index.html">Открыть кабинет</a>
  <p class="note" id="note"></p>
</div>
<script>
var Q = new URLSearchParams(location.search);
var LANG = ['uk','ru','en'].indexOf(Q.get('lang')) >= 0 ? Q.get('lang') : 'uk';
document.documentElement.lang = LANG;
var T = {
  ru:{h:'Оплата прошла', s:'Вернитесь в кабинет — доступ уже активен. Если кабинет ещё не заметил оплату, нажмите там «Я уже оплатил».', g:'Открыть кабинет', n:'Квитанция придёт на почту от банка. Автосписаний нет: следующий платёж вы сделаете сами, когда захотите продлить.'},
  uk:{h:'Оплата пройшла', s:'Поверніться в кабінет — доступ уже активний. Якщо кабінет ще не помітив оплату, натисніть там «Я вже сплатив».', g:'Відкрити кабінет', n:'Квитанція прийде на пошту від банку. Автосписань немає: наступний платіж ви зробите самі, коли захочете продовжити.'},
  en:{h:'Payment received', s:'Go back to the app — your access is already active. If the app has not noticed yet, tap “I have already paid”.', g:'Open the app', n:'The bank will email you a receipt. There are no recurring charges: the next payment is yours to make whenever you want to renew.'},
}[LANG];
document.getElementById('h1').textContent = T.h;
document.getElementById('sub').textContent = T.s;
document.getElementById('go').textContent = T.g;
document.getElementById('note').textContent = T.n;
</script>
</body>
</html>
