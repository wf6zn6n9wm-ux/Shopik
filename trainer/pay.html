<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PRO Trainer — оформлення підписки</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/pay.css" />
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M4 9v6M8 6.5v11M16 6.5v11M20 9v6M8 12h8"/></svg></div>
    <b>PRO Trainer</b>
  </div>
  <h1 id="h1">Оформлення підписки</h1>
  <p class="sub" id="sub">Оплата на сайті дешевша: у ній немає комісії магазину застосунків.</p>
  <div class="who" id="who" hidden></div>
  <div class="plans" id="plans"></div>
  <button class="go" id="go">Перейти до оплати</button>
  <p class="note" id="note"></p>
  <div class="err" id="err" hidden></div>
</div>

<script>
/* Сторінка навмисне автономна: ніяких бібліотек, лише вибір плану
   і перехід на /api/checkout, який уже підписує запит для LiqPay. */
var Q = new URLSearchParams(location.search);
var LANG = ['uk','ru','en','pl'].indexOf(Q.get('lang')) >= 0 ? Q.get('lang') : 'uk';
document.documentElement.lang = LANG;

var T = {
  uk:{title:'Оформлення підписки', sub:'Оплата на сайті дешевша: у ній немає комісії магазину застосунків.',
      go:'Перейти до оплати', month:'щомісяця', once:'разова оплата, без автопродовження',
      year:'раз на рік', per:'на місяць', save:'Економія', store:'у магазині',
      who:'Підписка прив’яжеться до логіна <b>{login}</b> — тим самим, яким ви входите в застосунку.',
      note:'Оплата проходить через LiqPay, сума списується в доларах — банк перерахує її у вашу валюту за своїм курсом, тому у виписці цифра буде іншою. Підписка з періодом 1 місяць і 1 рік продовжується автоматично — вимкнути можна на сторінці підписки або в застосунку. Доступ діє на 3 пристроях.',
      nologin:'Не бачимо, для якого логіна оформляти підписку. Відкрийте цю сторінку кнопкою «Активувати у WEB» у застосунку.'},
  ru:{title:'Оформление подписки', sub:'Оплата на сайте дешевле: в ней нет комиссии магазина приложений.',
      go:'Перейти к оплате', month:'ежемесячно', once:'разовая оплата, без автопродления',
      year:'раз в год', per:'в месяц', save:'Экономия', store:'в магазине',
      who:'Подписка привяжется к логину <b>{login}</b> — тому же, которым вы входите в приложении.',
      note:'Оплата проходит через LiqPay, сумма списывается в долларах — банк пересчитает её в вашу валюту по своему курсу, поэтому в выписке цифра будет другой. Подписка на 1 месяц и 1 год продлевается автоматически — отключить можно на странице подписки или в приложении. Доступ действует на 3 устройствах.',
      nologin:'Не видим, для какого логина оформлять подписку. Откройте эту страницу кнопкой «Активировать в WEB» в приложении.'},
  en:{title:'Subscribe', sub:'Paying here is cheaper: there is no app store commission.',
      go:'Go to payment', month:'monthly', once:'one-off payment, no auto-renewal',
      year:'once a year', per:'per month', save:'You save', store:'in the store',
      who:'The subscription will be tied to <b>{login}</b> — the same login you use in the app.',
      note:'Payment is handled by LiqPay and charged in US dollars — your bank converts it at its own rate, so your statement will show a different figure. The 1-month and 1-year plans renew automatically — you can turn that off on the subscription page or in the app. Access works on 3 devices.',
      nologin:'We can’t tell which login to subscribe. Open this page with “Activate on the web” in the app.'},
  pl:{title:'Wykup subskrypcję', sub:'Płatność tutaj jest tańsza: nie zawiera prowizji sklepu z aplikacjami.',
      go:'Przejdź do płatności', month:'co miesiąc', once:'płatność jednorazowa, bez odnawiania',
      year:'raz w roku', per:'miesięcznie', save:'Oszczędzasz', store:'w sklepie',
      who:'Subskrypcja zostanie przypisana do loginu <b>{login}</b> — tego samego, którym logujesz się w aplikacji.',
      note:'Płatność obsługuje LiqPay i jest pobierana w dolarach — bank przeliczy ją po swoim kursie, więc na wyciągu zobaczysz inną kwotę. Plany 1-miesięczny i roczny odnawiają się automatycznie — możesz to wyłączyć na stronie subskrypcji lub w aplikacji. Dostęp działa na 3 urządzeniach.',
      nologin:'Nie wiemy, dla jakiego loginu wykupić subskrypcję. Otwórz tę stronę przyciskiem „Aktywuj w WEB” w aplikacji.'},
};
var t = T[LANG];

/* ціни мають збігатися з PLANS у index.html */
/* web — ціна тут, у гривнях: платить український ФОП і рахунок банк
   виставляє в гривні. store — ціна в магазині застосунків, у доларах.
   Валюти різні навмисно, тож поруч вони не показуються: закреслений
   долар біля гривні читався б як знижка, якої немає. */
var PLANS = [
  {id:'monthly',   months:1,  web:299,  store:4.99},
  {id:'quarterly', months:3,  web:749,  store:12.99},
  {id:'yearly',    months:12, web:1990, store:49.99},
];
var TITLE = {
  uk:{monthly:'1 місяць', quarterly:'3 місяці', yearly:'1 рік'},
  ru:{monthly:'1 месяц',  quarterly:'3 месяца', yearly:'1 год'},
  en:{monthly:'1 month',  quarterly:'3 months', yearly:'1 year'},
  pl:{monthly:'1 miesiąc',quarterly:'3 miesiące',yearly:'1 rok'},
};
var usd = function(v){ return '$' + v.toFixed(2); };
var uah = function(v){ return Math.round(v) + ' \u20b4'; };
var login = (Q.get('login') || '').trim();
var device = (Q.get('device') || '').trim();
var picked = 'yearly';

document.getElementById('h1').textContent = t.title;
document.getElementById('sub').textContent = t.sub;
document.getElementById('go').textContent = t.go;
document.getElementById('note').textContent = t.note;
if (login){
  var who = document.getElementById('who');
  who.innerHTML = t.who.replace('{login}', login.replace(/[<>&]/g, ''));
  who.hidden = false;
}

function draw(){
  var box = document.getElementById('plans');
  box.innerHTML = '';
  PLANS.forEach(function(p){
    var b = document.createElement('button');
    b.className = 'plan' + (p.id === picked ? ' on' : '');
    b.onclick = function(){ picked = p.id; draw(); };
    var period = p.months === 1 ? t.month : p.months === 12 ? t.year : t.once;
    /* Раніше поруч стояла закреслена ціна магазину. Відколи тут гривня, а
       там долар, це вводило б в оману: закреслені $4.99 біля 299 ₴
       виглядають знижкою вдесятеро, якої немає. Різницю пояснюємо
       словами під списком, а не фальшивим закресленням. */
    b.innerHTML =
      '<span class="radio">' + (p.id === picked ? '<i></i>' : '') + '</span>' +
      '<span class="t"><b>' + TITLE[LANG][p.id] + '</b><span>' + period +
        (p.months > 1 ? ' · ' + uah(p.web / p.months) + ' ' + t.per : '') + '</span></span>' +
      '<span class="p"><b>' + uah(p.web) + '</b></span>';
    box.appendChild(b);
  });
}
draw();

document.getElementById('go').onclick = function(){
  if (!login){
    var e = document.getElementById('err');
    e.textContent = t.nologin;
    e.hidden = false;
    return;
  }
  var q = new URLSearchParams({plan: picked, login: login, device: device, lang: LANG});
  location.href = '/api/checkout?' + q;
};
</script>
</body>
</html>
