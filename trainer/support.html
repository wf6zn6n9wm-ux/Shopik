<script>

   звернення», а відповіді на те, що справді питають. */
var Q = new URLSearchParams(location.search);
var LANG = ['uk','ru','en','pl'].indexOf(Q.get('lang')) >= 0 ? Q.get('lang')
  : (['uk','ru','en','pl'].indexOf((navigator.language || 'uk').slice(0,2)) >= 0
      ? (navigator.language || 'uk').slice(0,2) : 'uk');
document.documentElement.lang = LANG;

var MAIL = 'andreymenedger01@gmail.com';
/* має збігатися з LEGAL.telegram в index.html; порожньо — кнопки просто не буде */
var TG = 'suport_uk';

var T = {

   ['Скільки коштує', 'На сайті: 1 місяць — 299 ₴, 3 місяці — 749 ₴, 1 рік — 1990 ₴. Це остаточна ціна, ПДВ не додається. Інших способів оплати немає: у застосунку з App Store і Google Play вбудованих покупок немає, гроші приймає лише сайт. Кнопка «Активувати у WEB» — на екрані тарифів, усі тарифи й реквізити — на pro-trainer.pro/about.'],

   ['Як скасувати підписку', 'Якщо платили в магазині — у налаштуваннях підписок App Store або Google Play. Якщо на сайті — у застосунку, Профіль → Підписка → «Керувати підпискою на сайті». Доступ працює до кінця вже оплаченого періоду.'],

   ['Як перенести дані на інший телефон', 'Просто увійдіть на новому телефоні тією самою поштою і паролем — клієнти, тренування й фінанси повернуться з копії. Копія зашифрована: відкриває її ваш пароль. Є й ручний спосіб: Профіль → Резервна копія → «Створити копію зараз» збереже файл, який можна перенести самому.'],
   ['Не приходять нагадування', 'Перевірте дозвіл: Налаштування → «Дозволити сповіщення на цьому пристрої». Далі — інтервали (за годину, 30, 15 або 5 хвилин). Розклад складається наперед, і в налаштуваннях написано, до якої дати він дотягується; якщо не відкривати застосунок дуже довго, нагадування закінчаться — застосунок попередить про це окремо.'],
   ['Як віддати звіт бухгалтеру', 'Екран «Фінанси» → «Вивантажити в CSV». Файл за той період, який зараз обрано на екрані: тренування, товари й абонементи окремими рядками.'],
   ['Як видалити дані', 'Клієнта з усією історією — кнопка в його картці. Усе одразу — Налаштування → «Видалити всі дані». Записи про підписку з нашого сервера видаляємо на запит: напишіть на пошту вище.'],

ru: {

   ['Не приходят напоминания', 'Проверьте разрешение: Настройки → «Разрешить уведомления на этом устройстве». Дальше — интервалы (за час, 30, 15 или 5 минут). Расписание составляется заранее, и в настройках написано, до какой даты оно дотягивается; если очень долго не открывать приложение, напоминания закончатся — приложение предупредит об этом отдельно.'],

  chat: 'Message us on Telegram',
  contact: 'Questions, problems, refunds — write to <a href="mailto:' + MAIL + '">' + MAIL + '</a>. We reply within 5 business days, usually sooner. Tell us what happened and on which device — that makes it faster.',
  note: 'Terms of use · Privacy policy · Data deletion',
  faq: [
   ['Getting started', 'Open the app, create an account, and you get 14 days of full access. No card required, nothing is charged. You choose a plan yourself when the trial ends.'],
   ['What it costs', 'On the website: 1 month — 299 ₴, 3 months — 749 ₴, 1 year — 1990 ₴. That is the final price, no VAT added. There is no other way to pay: the App Store and Google Play builds have no in-app purchases, so only the website takes payment. The “Activate on the web” button is on the plans screen; full pricing and company details are at pro-trainer.pro/about.'],
   ['I bought a subscription but my new phone does not see it', 'Tap “Restore purchase” on the plans screen. A store subscription comes back from your store account; a website subscription is found by the login you use in the app. A website subscription works on three devices at once — if the slots are full, free one up on the subscription page.'],
   ['How to cancel', 'If you paid in a store — in the App Store or Google Play subscription settings. If you paid on the website — in the app: Profile → Subscription → “Manage subscription on the website”. Access lasts until the end of the paid period.'],
   ['Will my data disappear if I stop paying?', 'No. Clients, sessions and finances stay on the device. Only access to the app pauses — everything is there the moment the subscription resumes.'],
   ['Moving to another phone', 'Just sign in on the new phone with the same email and password — clients, sessions and finances come back from the backup. The backup is encrypted: your password is what opens it. There is a manual way too: Profile → Backup → “Create backup now” saves a file you can carry over yourself.'],
   ['Reminders do not arrive', 'Check the permission: Settings → “Allow notifications on this device”, then the intervals (an hour, 30, 15 or 5 minutes before). The schedule is built ahead, and the settings show the date it reaches; if you do not open the app for a very long time, reminders run out — the app warns you about that separately.'],
   ['Giving a report to an accountant', 'Finances screen → “Export to CSV”. The file covers the period currently selected on screen: sessions, products and packages as separate rows.'],
   ['Deleting data', 'A client with their whole history — the button in their card. Everything at once — Settings → “Delete all data”. Subscription records on our server are deleted on request: write to the address above.'],

   ['Usuwanie danych', 'Klienta wraz z historią — przycisk w jego karcie. Wszystko naraz — Ustawienia → „Usuń wszystkie dane”. Zapisy o subskrypcji na naszym serwerze usuwamy na żądanie: napisz na adres powyżej.'],

var t = T[LANG];
var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); };
document.getElementById('h1').textContent = t.title;
document.getElementById('sub').textContent = t.sub;
if (TG){
  var chat = document.getElementById('chat');
  chat.href = 'https://t.me/' + TG.replace(/^@/, '');
  chat.target = '_blank'; chat.rel = 'noopener';
  chat.textContent = t.chat;
  chat.hidden = false;
}
document.getElementById('contact').innerHTML = t.contact;
document.getElementById('faq').innerHTML = t.faq
  .map(function(qa){ return '<h2>' + esc(qa[0]) + '</h2><p>' + esc(qa[1]) + '</p>'; }).join('');
var links = t.note.split(' · ');
document.getElementById('note').innerHTML =
  '<a href="/terms">' + esc(links[0]) + '</a> · <a href="/privacy">' + esc(links[1]) + '</a> · ' +
  '<a href="/delete">' + esc(links[2]) + '</a><br><a href="/">' + esc(t.title === 'Support' ? 'Open the app' :
    t.title === 'Pomoc' ? 'Otwórz aplikację' : t.title === 'Поддержка' ? 'Открыть приложение' : 'Відкрити застосунок') + '</a>';
</script>
