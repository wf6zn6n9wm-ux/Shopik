        ) : (
          <div className="rows" style={{marginTop:12}}>
            {sorted.map(({c, st}) => (
              <button key={c.id} className="row" onClick={() => nav.go('client', {id: c.id})}>
                <Avatar name={c.name} photo={c.photo} size={46} ring={!!st.sub}/>
                <div style={{flex:1, minWidth:0}}>
                  <div className="nm" style={{display:'flex', alignItems:'center', gap:6}}>
                    <span style={{whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{c.name}</span>
                    {st.debt > 0 && <span className="badge neg">{money(st.debt)}</span>}
                  </div>
                  <div className="ds">
                    {nSessions(st.done)}
                    {st.next ? ' · ' + t('client.next','далі') + ' ' + relDay(st.next.start).toLowerCase() + ', ' + fmtTime(st.next.start)
                             : st.lapsedDays !== null ? ' · ' + nDays(st.lapsedDays) + ' ' + t('lapse.without','без тренувань') : ''}
                  </div>
                </div>
                {st.sub && <span className="badge acc">{st.sub.total - st.sub.used}</span>}
                <Ic.right size={17} className="chev"/>
              </button>
            ))}
          </div>
          )
        )}
      </div>

      <button className="fab" onClick={() => nav.go('client.new')} aria-label={t('client.new')}><Ic.plus size={26}/></button>
    </Fragment>
  );
};

/* ─────────── 7. КАРТКА КЛІЄНТА ─────────── */
/* Заміри. Не обов'язкові: тренер або веде їх, або ні — тому це окрема
   вкладка, а не поле в картці. Сенс у різниці: сам по собі обхват талії
   нічого не каже, каже «−4 см за два місяці». */
const FIELDS = [
  {k: 'weight', title: 'Вага',   unit: 'кг'},
  {k: 'chest',  title: 'Груди',  unit: 'см'},
  {k: 'waist',  title: 'Талія',  unit: 'см'},
  {k: 'hip',    title: 'Стегна', unit: 'см'},
];
const num1 = v => {
  const x = String(v).replace(',', '.').replace(/[^\d.]/g, '');
  return Math.round((parseFloat(x) || 0) * 10) / 10;
};
const MeasureTab = ({client}) => {
  const db = useDB();
  const list = (db.measures || []).filter(m => m.clientId === client.id).sort((a, b) => b.ts - a.ts);
  const [open, setOpen] = useState(false);
  const [f, setF] = useState({});
  const last = list[0], prev = list[1];

  const add = () => {
    const vals = {};
    FIELDS.forEach(x => { vals[x.k] = num1(f[x.k] || 0); });
    if (!FIELDS.some(x => vals[x.k] > 0)){ Toaster.bad(t('ms.err','Заповніть хоча б одне поле')); return; }
    Act.addMeasure({clientId: client.id, ...vals, note: (f.note || '').trim()});
    setF({}); setOpen(false);
    Toaster.ok(t('ms.added','Замір збережено'));
  };
  /* −4 см це добре, а −4 кг може бути й погано: оцінку лишаємо тренеру,
     тому показуємо саму зміну без кольору «добре / погано» */
  const diff = k => (last && prev && last[k] > 0 && prev[k] > 0)
    ? Math.round((last[k] - prev[k]) * 10) / 10 : null;

  return (
    <div style={{marginTop:12}}>
      {list.length === 0 ? (
        <Empty icon={<Ic.chart size={28}/>} title={t('ms.empty','Замірів ще немає')}
               text={t('ms.empty.t','Необов’язково. Але якщо записувати вагу й обхвати раз на місяць, клієнт побачить, що змінилось — і це найкращий привід продовжити.')}
               action={<Btn kind="pri" size="sm" onClick={() => setOpen(true)}>
                         <Ic.plus size={17}/>{t('ms.add','Додати замір')}</Btn>}/>
      ) : (
        <Fragment>
          <div className="card pad">
            <div className="between">
              <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('ms.last','Останній замір')}</div>
              <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{fmtDM(last.ts)}</div>
            </div>
            <div className="kpis" style={{marginTop:10}}>
              {FIELDS.filter(x => last[x.k] > 0).map(x => {
                const d = diff(x.k);
                return (
                  <div key={x.k} className="kpi">
                    <div className="k">{t('ms.' + x.k, x.title)}</div>
                    <div className="v num">{last[x.k]}<span style={{fontSize:12, fontWeight:700}}> {t('ms.u.' + x.unit, x.unit)}</span></div>
                    {d !== null && d !== 0 && (
                      <div style={{fontSize:11.5, fontWeight:800, color:'var(--ink-2)'}}>
                        {d > 0 ? '+' : '−'}{Math.abs(d)}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            {last.note && <div className="muted" style={{fontSize:13, marginTop:10}}>{last.note}</div>}
          </div>
          <Btn kind="soft" wide style={{marginTop:10}} onClick={() => setOpen(true)}>
            <Ic.plus size={17}/>{t('ms.add','Додати замір')}
          </Btn>
          {list.length > 1 && (
            <div className="rows" style={{marginTop:12}}>
              {list.map(m => (
                <div key={m.id} className="row">
                  <div style={{flex:1, minWidth:0}}>
                    <div className="nm">{fmtDM(m.ts)}</div>
                    <div className="ds">
                      {FIELDS.filter(x => m[x.k] > 0)
                             .map(x => t('ms.' + x.k, x.title) + ' ' + m[x.k]).join(' · ')}
                    </div>
                  </div>
                  <button className="iconbtn" aria-label={t('common.delete','Видалити')}
                          onClick={() => { Act.delMeasure(m.id); Toaster.show(t('ms.gone','Замір видалено')); }}>
                    <Ic.trash size={17}/>
                  </button>
                </div>
              ))}
            </div>
          )}
        </Fragment>
      )}

      <Sheet open={open} onClose={() => setOpen(false)} title={t('ms.add','Додати замір')}
             sub={t('ms.sub','Заповніть те, що знімаєте — решту можна лишити порожнім')}>
        <div className="grid2">
          {FIELDS.map(x => (
            <Field key={x.k} label={t('ms.' + x.k, x.title)}>
              <Input value={f[x.k] || ''} inputMode="decimal" suffix={t('ms.u.' + x.unit, x.unit)}
                     onChange={e => setF({...f, [x.k]: e.target.value})}
                     placeholder={last && last[x.k] > 0 ? String(last[x.k]) : ''}/>
            </Field>
          ))}
        </div>
        <Field label={t('ms.note','Нотатка')}>
          <Input value={f.note || ''} onChange={e => setF({...f, note: e.target.value})}
                 placeholder={t('ms.note.ph','Напр.: зранку, натще')}/>
        </Field>
        <Btn kind="pri" size="lg" wide style={{marginTop:8}} onClick={add}>{t('common.save','Зберегти')}</Btn>
      </Sheet>
    </div>
  );
};

        </Btn>
        {!del ? (
          <button className="btn ghost wide" style={{color:'var(--neg)'}} onClick={() => setDel(true)}>{t('client.del','Видалити клієнта')}</button>

          <div className="card pad" style={{borderColor:'var(--neg)'}}>
            <b style={{fontSize:14.5}}>{t('client.del.q','Видалити клієнта?')}</b>
            <p className="muted" style={{fontSize:13, margin:'6px 0 12px'}}>
              {t('client.del.t2','Разом із ним зникнуть його тренування, продажі та нотатки — а з ними зміняться й гроші за минулі місяці. Якщо клієнт просто перестав ходити, краще відправити його в архів. Дію не можна скасувати.')}
            </p>

              <Btn kind="sec" onClick={() => setDel(false)}>{t('common.cancel','Скасувати')}</Btn>

                {t('common.delete','Видалити')}
              </Btn>
            </div>
          </div>
        )}
      </div>

      {open && <SessionSheet id={open.id} onClose={() => setOpen(null)}/>}
    </Page>
  );
};

    name: edit ? edit.name : (params.name || ''),
    phone: edit ? edit.phone : '+380 ',
    goal: edit ? edit.goal : '',
    photo: edit ? edit.photo : '',
    note: edit ? edit.note : '',
    price: edit && edit.price ? String(edit.price) : '',
    birthday: edit ? (edit.birthday || '') : '',
  });
  const [err, setErr] = useState({});
  const set = (k, v) => { setF(x => ({...x, [k]: v})); setErr(x => ({...x, [k]: null})); };

  function photo(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';                     /* інакше той самий файл вдруге не вибереться */
    if (!file) return;
    Photo.fromFile(file).then(url => set('photo', url)).catch(photoErr);
  }

  function save(){
    const e = {};
    if (f.name.trim().length < 2) e.name = t('client.err.name','Вкажіть ім’я');
    setErr(e);
    if (Object.keys(e).length) return;
    const data = {...f, name: f.name.trim(), price: f.price ? +f.price : null};
    if (edit){
      Act.updClient(edit.id, data);
      Toaster.ok(t('client.saved','Зміни збережено'));
      onClose();
    } else {
      const c = Act.addClient(data);
      Toaster.ok(t('client.added','Клієнта додано'));
      onClose();
      if (params.then === 'session') setTimeout(() => nav.go('session.new', {clientId: c.id}), 80);
    }
  }

  return (
    <Page title={edit ? t('client.edit','Редагувати') : t('client.new','Новий клієнт')} onClose={onClose}
          footer={<Btn kind="pri" size="lg" wide onClick={save}>{t('common.save','Зберегти')}</Btn>}>
      <div style={{display:'grid', placeItems:'center', marginTop:6}}>
        <label style={{position:'relative', cursor:'pointer'}}>
          <Avatar name={f.name || '?'} photo={f.photo} size={92}/>
          <div style={{position:'absolute', right:-2, bottom:-2, width:30, height:30, borderRadius:'50%',
                       background:'var(--accent)', color:'#fff', display:'grid', placeItems:'center',
                       border:'3px solid var(--bg)'}}><Ic.plus size={16}/></div>
          <input type="file" accept="image/*" onChange={photo} style={{display:'none'}}/>
        </label>
        {f.photo && <button className="btn ghost sm" style={{color:'var(--ink-3)'}} onClick={() => set('photo','')}>{t('photo.del','Прибрати фото')}</button>}
      </div>

      <Field label={t('client.name','Ім’я')} hint={err.name} bad>
        <Input value={f.name} onChange={e => set('name', e.target.value)} placeholder="Іван Петров" bad={!!err.name} autoFocus={!edit}/>
      </Field>
      <Field label={t('client.phone','Телефон')}>
        <Input value={f.phone} onChange={e => set('phone', phoneMask(e.target.value))} inputMode="tel"/>
      </Field>
      <Field label={t('client.price','Вартість тренування')}
             hint={f.price
               ? t('client.price.fix','Ця сума підставлятиметься в кожне тренування з цим клієнтом')
               : t('client.price.def','Порожньо — береться ціна за замовчуванням, ') + money(db.settings.price)}>
        <Input value={f.price} onChange={e => set('price', e.target.value.replace(/\D/g,''))}
               inputMode="numeric" placeholder={String(db.settings.price)} suffix={db.settings.currency}/>
      </Field>
      <Field label={t('client.bd.full','Дата народження')} hint={t('client.bd.hint','Необов’язково — нагадає привітати')}>
        <Input type="date" value={f.birthday} onChange={e => set('birthday', e.target.value)}/>
      </Field>
      <Field label={t('client.goal','Мета')}>
        <div className="chips">
          {GOALS.map((g, i) => (
            <button key={g} className={cx('chip', f.goal === g && 'on')} onClick={() => set('goal', f.goal === g ? '' : g)}>{goals()[i]}</button>
          ))}
        </div>
      </Field>
      <Field label={t('client.note','Коротка нотатка')}>
        <textarea className="inp" style={{minHeight:80}} value={f.note} onChange={e => set('note', e.target.value)}
                  placeholder={t('client.note.ph','Напр.: травма коліна, працює до 19:00')}/>
      </Field>
    </Page>
  );
};

/* ─────────── повідомлення клієнту (борг / повернення) ─────────── */
const Remind = ({params, onClose}) => {
  const db = useDB();
  const c = byId(db.clients, params.clientId);
  const st = c ? clientStats(db, c.id) : null;
  const name = c ? c.name.split(' ')[0] : '';
  const next = st && st.next ? st.next : null;
  /* тексти лежать у словнику з підстановками — інакше вони б не перекладались */
  const tpl = (params.kind === 'tomorrow' && next
    ? [
        t('msg.next.1', '{name}, привіт! Нагадую про тренування {when} о {time}. Буду чекати!'),
        t('msg.next.2', '{name}, доброго дня! Підтвердіть, будь ласка, тренування {when} о {time}.'),
      ]
    : params.kind === 'birthday'
    ? [
        t('msg.bd.1', '{name}, з днем народження! Бажаю сил, здоров’я і легких тренувань. Чекаю в залі!'),
        t('msg.bd.2', '{name}, вітаю з днем народження! Нехай форма тішить, а результати приходять швидше за плани.'),
      ]
    : params.kind === 'moved'
    ? [
        t('msg.moved.1', '{name}, привіт! Переніс наше тренування на {when}, {time}. Підтвердіть, будь ласка.'),
        t('msg.moved.2', '{name}, доброго дня! Тренування тепер {when} о {time}. Якщо незручно — підберемо інший час.'),
      ]
    : params.kind === 'lapsed'
    ? [
        t('msg.lapsed.1', '{name}, привіт! Давно вас не було в залі — усе гаразд? Є вільні місця на цьому тижні, можу поставити ваш звичний час.'),
        t('msg.lapsed.2', '{name}, доброго дня! Пропоную повернутись до тренувань — почнемо з легкого відновлювального. Коли зручно?'),
      ]
    : [
        t('msg.debt.1', '{name}, доброго дня! Нагадую про оплату за тренування — {sum}. Дякую!'),
        t('msg.debt.2', '{name}, привіт! Підкажіть, коли зручно закрити оплату за минулі тренування ({sum})?'),
      ]
  ).map(x => fill(x, {name,
    when: next ? relDay(next.start).toLowerCase() : '',
    time: next ? fmtTime(next.start) : '',
    sum: money(params.sum || (st ? st.debt : 0))}));
  const [text, setText] = useState(tpl[0]);
  if (!c) return <Page title="—" onClose={onClose}><ErrorBox title={t('client.gone','Клієнта не знайдено')}/></Page>;

  return (
    <Page title={t('remind.title','Повідомлення')} sub={c.name} onClose={onClose}
          footer={
            <div className="stack">
              <a className="btn pri wide" href={smsHref(c.phone, text)}><Ic.msg size={18}/>{t('remind.sms','Надіслати SMS')}</a>
              <div className="grid2">
                <a className="btn sec" href={telHref(c.phone)}><Ic.phone size={18}/>{t('remind.call','Подзвонити')}</a>
                <Btn kind="sec" onClick={() => {
                  navigator.clipboard && navigator.clipboard.writeText(text);
                  Toaster.ok(t('remind.copied','Текст скопійовано'));
                }}><Ic.copy size={18}/>{t('remind.copy','Копіювати')}</Btn>
              </div>
            </div>}>
      <div className="card pad" style={{marginTop:4, display:'flex', gap:12, alignItems:'center'}}>
        <Avatar name={c.name} photo={c.photo} size={46}/>
        <div style={{flex:1, minWidth:0}}>
          <b style={{fontSize:15}}>{c.name}</b>
          <div className="muted num" style={{fontSize:13}}>{c.phone || t('remind.nophone','Номер не вказано')}</div>
        </div>
        {st && st.debt > 0 && <span className="badge neg">{money(st.debt)}</span>}
      </div>

      <Field label={t('remind.tpl','Шаблон')}>
        <div className="stack">
          {tpl.map((x, i) => (
            <button key={i} className={cx('card pad press')} style={{textAlign:'left', fontSize:13.5, lineHeight:1.5,
                    borderColor: text === x ? 'var(--accent)' : 'var(--line)'}} onClick={() => setText(x)}>{x}</button>
          ))}
        </div>
      </Field>
      <Field label={t('remind.text','Текст повідомлення')}>
        <textarea className="inp" value={text} onChange={e => setText(e.target.value)}/>
      </Field>
    </Page>
  );
};

/* ─────────── борги (повний список) ─────────── */
const Debts = ({onClose}) => {
  const db = useDB();
  const nav = useNav();
  const items = useMemo(() => {
    const m = new Map();
    db.sessions.filter(isDebt).forEach(s => {
      const cur = m.get(s.clientId) || {clientId: s.clientId, sum:0, n:0, oldest: s.start, list:[]};
      cur.sum += owed(s); cur.n++; cur.list.push(s);
      if (+new Date(s.start) < +new Date(cur.oldest)) cur.oldest = s.start;
      m.set(s.clientId, cur);
    });
    return [...m.values()].sort((a, b) => b.sum - a.sum);
  }, [db.sessions]);
  const total = sum(items, x => x.sum);

  return (
    <Page title={t('menu.debts','Борги')} onClose={onClose}>
      {items.length === 0 ? (
        <Empty icon={<Ic.check size={30}/>} title={t('debts.none','Боргів немає')}
               text={t('debts.none.t','Усі проведені тренування оплачені. Так тримати.')}/>
      ) : (
        <Fragment>
          <div className="card pad" style={{marginTop:4}}>
            <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('debts.total','Загалом винні')}</div>
            <div className="dsp num" style={{fontSize:28, fontWeight:800, color:'var(--neg)'}}>{money(total)}</div>
            <div className="muted" style={{fontSize:12.5}}>{nClients(items.length)} · {nSessions(sum(items, x => x.n))}</div>
          </div>
          <div className="stack" style={{marginTop:12}}>
            {/* та сама картка, що й на головній: інакше на одному екрані
                борг закривався б частинами, а на другому — лише цілком */}
            {items.map(d => <DebtCard key={d.clientId} d={d}/>)}
          </div>
        </Fragment>
      )}
    </Page>
  );
};

/* ─────────── кому час написати (повний список) ─────────── */
const Lapsed = ({onClose}) => {
  const db = useDB();
  const nav = useNav();
  const S = db.settings;
  const items = useMemo(() => db.clients.filter(c => !c.archived).map(c => ({c, st: clientStats(db, c.id)}))

  return (
    <Page title={t('home.lapsed','Кому час написати')} sub={t('lapse.sub','Не тренувались понад') + ' ' + nDays(S.lapseDays)} onClose={onClose}>

        <div className="stack" style={{marginTop:4}}>
          {items.map(({c, st}) => <LapsedCard key={c.id} c={c} days={st.lapsedDays} last={st.last}/>)}

};

const PRODUCT_ICONS = ['🥤','💊','🍶','🧤','🟠','🎯','🧴','🍫','👕','🧦','⌚','🎽'];
const ProductForm = ({params, onClose}) => {
  const db = useDB();
  const nav = useNav();
  const edit = params.id ? byId(db.products, params.id) : null;
  const [f, setF] = useState({
    name: edit ? edit.name : '', price: edit ? edit.price : 0, cost: edit ? edit.cost : 0,
    stock: edit ? edit.stock : 0, icon: edit ? edit.icon : '💊',
  });
  const [err, setErr] = useState({});
  const [del, setDel] = useState(false);
  const set = (k, v) => { setF(x => ({...x, [k]: v})); setErr(x => ({...x, [k]: null})); };
  const profit = f.price - f.cost;
  const sold = edit ? (edit.sold || 0) : 0;
  const history = edit ? db.sales.filter(x => x.productId === edit.id).sort((a, b) => b.ts - a.ts).slice(0, 30) : [];

  function save(){
    const e = {};
    if (!f.name.trim()) e.name = t('goods.err.name','Вкажіть назву');
    if (!f.price) e.price = t('goods.err.price','Вкажіть ціну');
    setErr(e);
    if (Object.keys(e).length) return;

const SellForm = ({params, onClose}) => {
  const db = useDB();
  const nav = useNav();
  const [f, setF] = useState({clientId: params.clientId || '', productId: params.productId || '', qty:1, price:0});
  const [err, setErr] = useState({});
  const p = f.productId ? byId(db.products, f.productId) : null;

  useEffect(() => { if (p) setF(x => ({...x, price: p.price})); }, [f.productId]);

  const total = f.price * f.qty;
  const profit = p ? (f.price - p.cost) * f.qty : 0;
  const maxQty = p ? Math.max(1, p.stock) : 1;

  function save(){
    const e = {};
    if (!f.productId) e.product = t('sell.err.product','Оберіть товар');
    if (!f.clientId) e.client = t('sell.err.client','Оберіть клієнта');
    if (p && p.stock < f.qty) e.qty = t('sell.err.stock','Не вистачає залишку');
    setErr(e);
    if (Object.keys(e).length) return;
    Act.sell({clientId: f.clientId, productId: f.productId, qty: f.qty, price: f.price});
    Toaster.ok(t('sell.done','Продаж записано') + ' · ' + money(total));
    onClose();
  }

  return (
    <Page title={t('sell.title','Продаж товару')} onClose={onClose}
          footer={<Btn kind="pri" size="lg" wide onClick={save} disabled={!db.products.length}>
                    {t('sell.save','Записати продаж')}{total ? ' · ' + money(total) : ''}</Btn>}>
      {db.products.length === 0 ? (
        <Empty icon={<Ic.box size={30}/>} title={t('goods.empty','Товарів ще немає')}
               text={t('sell.empty.t','Спочатку додайте товар — потім його можна буде продавати клієнтам.')}
               action={<Btn kind="pri" onClick={() => { onClose(); setTimeout(() => nav.go('product.new'), 60); }}>
                         <Ic.plus size={18}/>{t('goods.new','Новий товар')}</Btn>}/>
      ) : (
        <Fragment>
          <Field label={t('session.client','Клієнт')} hint={err.client} bad>
            <ClientPick value={f.clientId} onPick={id => setF(x => ({...x, clientId: id}))}/>
          </Field>

          <Field label={t('sell.product','Товар')} hint={err.product} bad>
            <div className="stack">
              {db.products.map(x => (
                <button key={x.id} className="card pad press" style={{textAlign:'left', display:'flex', gap:12, alignItems:'center',
                        borderColor: f.productId === x.id ? 'var(--accent)' : 'var(--line)', opacity: x.stock === 0 ? .5 : 1}}
                        onClick={() => setF(v => ({...v, productId: x.id, qty:1}))}>
                  <div style={{width:40, height:40, borderRadius:12, background:'var(--surface-2)', display:'grid',
                               placeItems:'center', fontSize:20, flex:'none'}}>{x.icon}</div>
                  <div style={{flex:1, minWidth:0}}>
                    <b style={{fontSize:14.5}}>{x.name}</b>
                    <div className="muted" style={{fontSize:12.5}}>
                      {t('goods.left','Залишок')}: {x.stock} · {money(x.price)}
                    </div>
                  </div>
                  {f.productId === x.id && <Ic.check size={19} style={{color:'var(--accent)'}}/>}
                </button>
              ))}
            </div>
          </Field>

          <Field label={t('sell.qty','Кількість')} hint={err.qty} bad>
            <div style={{display:'flex', gap:9, alignItems:'center'}}>
              <button className="btn sec" style={{width:52, flex:'none'}} onClick={() => setF(x => ({...x, qty: Math.max(1, x.qty - 1)}))}>−</button>
              <Input value={f.qty} onChange={e => setF(x => ({...x, qty: clamp(+e.target.value.replace(/\D/g,'') || 1, 1, 99)}))}
                     inputMode="numeric" style={{textAlign:'center'}}/>
              <button className="btn sec" style={{width:52, flex:'none'}} onClick={() => setF(x => ({...x, qty: Math.min(maxQty, x.qty + 1)}))}>+</button>
            </div>
          </Field>

          <Field label={t('sell.price','Ціна за одиницю')}>
            <Input value={f.price} onChange={e => setF(x => ({...x, price: +e.target.value.replace(/\D/g,'') || 0}))}
                   inputMode="numeric" suffix="₴"/>
          </Field>

          <div className="card pad" style={{marginTop:16, background:'var(--accent-soft)', borderColor:'transparent'}}>
            <Rowline k={t('sell.total','До сплати')} v={money(total)} tone="var(--accent)" strong/>
            <Rowline k={t('sell.profit','Ваш прибуток')} v={money(profit)} tone="var(--pos)"/>
            {p && <Rowline k={t('sell.after','Залишок після продажу')} v={Math.max(0, p.stock - f.qty)}/>}
          </div>
        </Fragment>
      )}

  );

/* ─────────── вибір періоду: пресети + діапазон у календарі ─────────── */
const RangeSheet = ({open, onClose, value, onPick}) => {
  const start = value && value.kind === 'custom' && value.from ? d0(new Date(value.from + 'T00:00:00')) : null;
  const [cur, setCur] = useState(() => d0(start || new Date()));
  const [a, setA] = useState(start);
  const [b, setB] = useState(value && value.kind === 'custom' && value.to ? d0(new Date(value.to + 'T00:00:00')) : null);

  const cells = useMemo(() => {
    const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const s0 = addDays(first, -((first.getDay() + 6) % 7));
    return Array.from({length: 42}, (_, i) => addDays(s0, i));
  }, [cur]);

  const take = d => {
    if (!a || (a && b)){ setA(d0(d)); setB(null); return; }
    if (+d0(d) < +a){ setB(a); setA(d0(d)); return; }
    setB(d0(d));
  };
  const pick = (from, to) => { onPick({kind:'custom', from: iso(from), to: iso(to)}); onClose(); };
  const inRng = d => a && b && +d0(d) > +a && +d0(d) < +b;
  const isEdge = d => (a && sameDay(d, a)) || (b && sameDay(d, b));

  const presets = [
    [t('rng.today','Сьогодні'), () => pick(new Date(), new Date())],
    [t('rng.yest','Учора'), () => pick(addDays(new Date(), -1), addDays(new Date(), -1))],
    [t('rng.7','Останні 7 днів'), () => pick(addDays(new Date(), -6), new Date())],
    [t('rng.30','Останні 30 днів'), () => pick(addDays(new Date(), -29), new Date())],
    [t('rng.mon','Цей місяць'), () => { const [f, tt] = periodRange('month', new Date()); pick(f, addDays(tt, -1)); }],
    [t('rng.prev','Минулий місяць'), () => { const [f] = periodRange('month', addMonths(new Date(), -1)); pick(f, addDays(addMonths(f, 1), -1)); }],
  ];

  return (
    <Sheet open={open} onClose={onClose} title={t('rng.title','Свій період')}
           sub={a ? (b ? fmtDM(a) + ' — ' + fmtDM(b) : fmtDM(a) + ' — ' + t('rng.pick2','оберіть другу дату'))
                  : t('rng.pick1','Оберіть початок і кінець періоду')} tall>
      <div className="chips" style={{flexWrap:'wrap', gap:8, marginBottom:14}}>
        {presets.map(([tx, fn]) => (
          <button key={tx} className="chip" onClick={fn}>{tx}</button>
        ))}
      </div>

      <div className="between" style={{marginBottom:6}}>
        <button className="iconbtn" onClick={() => setCur(addMonths(cur, -1))} aria-label="−"><Ic.left size={20}/></button>
        <b style={{fontSize:15}}>{fmtMon(cur)}</b>
        <button className="iconbtn" onClick={() => setCur(addMonths(cur, 1))} aria-label="+"><Ic.right size={20}/></button>
      </div>
      <div className="cal-grid">
        {DOW_SHORT().map(d => <div key={d} className="cal-dow">{d}</div>)}
      </div>
      <div className="cal-grid">
        {cells.map((d, i) => (
          <button key={i} onClick={() => take(d)}
                  className={cx('cal-day',
                    d.getMonth() !== cur.getMonth() && 'out',
                    sameDay(d, new Date()) && 'today',
                    inRng(d) && 'rng',
                    isEdge(d) && 'edge')}>
            <span className="num">{d.getDate()}</span>
          </button>
        ))}
      </div>

      <div className="grid2" style={{marginTop:16}}>
        <Btn kind="sec" onClick={() => { setA(null); setB(null); onPick({kind:'month'}); onClose(); }}>
          {t('rng.reset','Скинути')}
        </Btn>

  const db = useDB();
  const nav = useNav();
  const [p, setP] = useState({kind:'month'});
  const [from, to] = useMemo(() => periodOf(p), [p]);
  const st = stats(db, from, to);
  const delta = useMemo(() => deltaRange(db, from, to), [db, p]);
  const days = Math.max(1, Math.round((+to - +from) / DAY));
  const byMonth = p.kind === 'year' || days > 62;

  /* серія: по днях, а для довгих періодів — по місяцях */
  const series = useMemo(() => {
    if (byMonth){
      const box = netByBucket(db, from, to, true);
      const out = [];
      let m = new Date(from.getFullYear(), from.getMonth(), 1);
      while (+m < +to){
        out.push({label: fmtMonS(m), v: box.get(mKey(m)) || 0});
        m = addMonths(m, 1);
      }
      return out;
    }
    const count = p.kind === 'day' ? 7 : days;
    /* для «дня» графік показує тиждень назад — кошики беремо на цей же відрізок */
    const start = p.kind === 'day' ? addDays(from, -6) : from;
    const box = netByBucket(db, start, addDays(start, count), false);
    return Array.from({length: count}, (_, i) => {
      const d = addDays(start, i);
      return {label: count > 10 ? String(d.getDate()) : fmtDow(d),
              v: box.get(iso(d)) || 0, on: sameDay(d, new Date())};
    });

  const parts = [
    {t: t('fin.sessions','Тренування'), v: st.net, c:'var(--accent)'},

      <div className="hero" style={{marginTop:14}}>
        <div className="between">
          <span className="lbl">
            {t('fin.total','Загальний дохід')}
            {p.kind === 'custom' ? ' · ' + periodLabel(p, from, to) : ''}
          </span>
          <span className={cx('delta', delta >= 0 ? 'pos' : 'neg')}>{pct(delta)}</span>
        </div>
        <div className="val num">{money(st.total)}</div>
        <div className="sub">{nSessions(st.count)} · {t('fin.goods','товари')} {money(st.salesProfit)}</div>
      </div>

      <div className="card pad" style={{marginTop:12}}>
        <Rowline k={t('home.turnover','Оборот')} v={money(st.gross)} strong/>
        <Rowline k={t('fin.fee','Комісія залу')} v={'−' + money(st.gym)} tone="var(--ink-2)"/>

      <div className="card pad">
        <Rowline k={t('fin.fromses','Тренування')} v={money(st.net)} strong/>
        <Rowline k={t('fin.fromgoods','Продажі товарів')} v={money(st.salesProfit)} tone={st.salesProfit ? 'var(--pos)' : null}/>
        <Rowline k={t('fin.fromsubs','Абонементи (передоплата)')} v={money(st.subsSold)}/>
        <div className="muted" style={{fontSize:12, marginTop:8, lineHeight:1.45}}>
          {t('fin.subs.note','Абонемент — це передоплата: гроші зараховуються в дохід у міру проведення тренувань, тому сума покупок показана окремо.')}
        </div>

      <button className="card pad press" style={{marginTop:9, width:'100%', display:'flex', alignItems:'center', gap:12, textAlign:'left'}}

            <div className="dsp num" style={{fontSize:15, fontWeight:800}}>{moneyShort(st.total)}</div>
          </div>}/>
        <div style={{flex:1}}>
          {parts.map((x, i) => (

              <span style={{fontSize:13.5, fontWeight:600, color:'var(--ink-2)'}}>
                <i style={{width:10, height:10, borderRadius:3, background:x.c, display:'inline-block', marginRight:8}}/>{x.t}
              </span>

/* ─────────── 14. СТАТИСТИКА / DASHBOARD ─────────── */
const Stats = ({onClose}) => {
  const db = useDB();
  const nav = useNav();
  const [p, setP] = useState({kind:'month'});
  const [from, to] = useMemo(() => periodOf(p), [p]);
  const st = stats(db, from, to);

  /* раніше на кожного клієнта перебиралась уся історія: 40 клієнтів ×
     5 000 тренувань. Тепер два проходи на всіх разом. */
  const top = useMemo(() => {
    const n = new Map(), v = new Map();
    const add = (m, k, x) => m.set(k, (m.get(k) || 0) + x);
    db.sessions.forEach(x => {
      if (!isBillable(x) || !inRange(+new Date(x.start), from, to)) return;
      add(n, x.clientId, 1); add(v, x.clientId, x.price);
    });
    db.sales.forEach(x => { if (inRange(x.ts, from, to)) add(v, x.clientId, x.price * x.qty); });
    return db.clients.map(c => ({c, n: n.get(c.id) || 0, v: v.get(c.id) || 0}))
      .filter(x => x.n > 0).sort((a, b) => b.n - a.n || b.v - a.v).slice(0, 5);
  }, [db, p]);

  const byType = useMemo(() => {
    const m = {};
    db.sessions.filter(s => isBillable(s) && inRange(+new Date(s.start), from, to))
      .forEach(s => { m[s.type] = (m[s.type] || 0) + 1; });
    return Object.entries(m).map(([k, v]) => ({t: typeTitle(k), v}));
  }, [db, p]);

  /* у статистиці рахуємо навантаження — кількість тренувань, а не гроші */
  const dow = useMemo(() => {
    const names = DOW_SHORT();
    const m = new Array(7).fill(0);
    db.sessions.filter(s => isBillable(s) && inRange(+new Date(s.start), from, to))
      .forEach(s => { const d = (new Date(s.start).getDay() + 6) % 7; m[d] += 1; });
    return m.map((v, i) => ({label: names[i], v, on: i === (new Date().getDay() + 6) % 7}));
  }, [db, p]);

  const cards = [
    {k: t('st.count','Тренувань'), v: st.count, ic:<Ic.dumb size={18}/>},
    {k: t('st.clients2','Клієнтів усього'), v: db.clients.filter(c => !c.archived).length, ic:<Ic.users size={18}/>},
    {k: t('st.active','Активних клієнтів'), v: st.clients, ic:<Ic.fire size={18}/>, tone:'var(--accent)'},
    {k: t('st.new','Нових клієнтів'), v: st.newClients, ic:<Ic.star size={18}/>, tone:'var(--pos)'},
    {k: t('st.avg','Середній чек'), v: money(st.avg), ic:<Ic.card size={18}/>},
    {k: t('st.per','Тренувань на клієнта'), v: st.sesPerClient, ic:<Ic.target size={18}/>},
    {k: t('st.sales','Продажів'), v: st.salesCount, ic:<Ic.bag size={18}/>},
    {k: t('st.done','Проведено'), v: st.done, ic:<Ic.check size={18}/>},
  ];

  return (
    <Page title={t('menu.stats','Статистика')} onClose={onClose}
          right={<button className="iconbtn" onClick={() => nav.go('finance')} aria-label={t('menu.fin')}><Ic.wallet size={20}/></button>}>
      <PeriodBar value={p} onChange={setP}/>
      {p.kind === 'custom' && (
        <div className="muted" style={{fontSize:12.5, fontWeight:700, marginTop:10, marginLeft:2}}>
          {periodLabel(p, from, to)} · {nDays(Math.max(1, Math.round((+to - +from) / DAY)))}
        </div>
      )}

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:9, marginTop:14}}>
        {cards.map((c, i) => (
          <div key={i} className="card pad">
            <div style={{color:'var(--accent)', opacity:.9}}>{c.ic}</div>
            <div className="dsp num" style={{fontSize:19, fontWeight:800, marginTop:8, color: c.tone}}>{c.v}</div>
            <div className="muted" style={{fontSize:12, fontWeight:600, marginTop:2}}>{c.k}</div>
          </div>
        ))}
      </div>

      <div className="sechead"><div className="h2">{t('st.dow2','Тренування по днях тижня')}</div></div>
      <div className="card pad">
        {dow.every(d => !d.v)
          ? <Empty icon={<Ic.chart size={28}/>} title={t('fin.nodata','Даних поки немає')}/>
          : <Bars data={dow} fmtV={v => nSessions(v)}/>}
      </div>

      <div className="sechead"><div className="h2">{t('st.top2','Найактивніші клієнти')}</div></div>
      {top.length === 0 ? (
        <div className="card"><Empty icon={<Ic.users size={28}/>} title={t('st.top.none','Поки порожньо')}
             text={t('st.top.none.t','За цей період ще не було оплачених тренувань.')}/></div>
      ) : (
        <div className="rows">
          {top.map(({c, n, v}, i) => (
            <button key={c.id} className="row" onClick={() => nav.go('client', {id: c.id})}>
              <div className="dsp num" style={{width:20, fontSize:15, fontWeight:800, color:'var(--ink-3)'}}>{i + 1}</div>
              <Avatar name={c.name} photo={c.photo} size={38}/>
              <div style={{flex:1, minWidth:0}}>
                <div className="nm">{c.name}</div>
                <div className="ds">{nSessions(n)}</div>
              </div>
              <span className="num" style={{fontSize:15, fontWeight:800}}>{n}</span>
            </button>
          ))}
        </div>
      )}

      {byType.length > 0 && (
        <Fragment>
          <div className="sechead"><div className="h2">{t('st.types','Типи тренувань')}</div></div>
          <div className="card pad">
            {byType.map((x, i) => (
              <div key={i} style={{marginTop: i ? 10 : 0}}>
                <div className="between" style={{marginBottom:5}}>
                  <span style={{fontSize:13.5, fontWeight:600, color:'var(--ink-2)'}}>{x.t}</span>
                  <span className="num" style={{fontSize:13.5, fontWeight:800}}>{x.v}</span>
                </div>
                <div style={{height:8, borderRadius:6, background:'var(--surface-2)', overflow:'hidden'}}>
                  <div style={{height:'100%', borderRadius:6, background:'var(--accent)',
                               width: Math.round(x.v / Math.max(...byType.map(y => y.v)) * 100) + '%'}}/>
                </div>
              </div>
            ))}
          </div>
        </Fragment>
      )}
    </Page>
  );
};

const Settings = ({params, onClose}) => {
  const db = useDB();
  const nav = useNav();
  const S = db.settings;
  const [wipe, setWipe] = useState(false);
  const [bye, setBye] = useState(false);
  const [pinMode, setPinMode] = useState(null);       // set | confirm
  const [pin1, setPin1] = useState('');
  const [perm, setPerm] = useState(Notifier.permission());
  /* копія робиться тільки коли на пристрої є ключ до неї */
  const [armed, setArmed] = useState(Cloud.armed());
  const cloud = useCloud();
  const [arm, setArm] = useState(false);
  const [armPass, setArmPass] = useState('');
  const [armErr, setArmErr] = useState('');
  const [armBusy, setArmBusy] = useState(false);
  const account = (Disk.readMeta() || {}).account;

  /* Прийшли сюди з головної, по рядку «копії немає». Вести людину на
     екран і лишати шукати потрібний перемикач серед двох десятків інших
     означало б обірвати її на півдорозі. */
  useEffect(() => {
    if (params && params.focus === 'cloud' && !Cloud.armed()){
      setArm(true); setArmPass(''); setArmErr('');
    }
  }, []);

  /* Пароль перевіряємо тим самим хешем, що й на вході. Кабінети, заведені
     до того, як пароль став обов'язковим, хеша не мають — тоді пароль
     тут-таки й задаємо, інакше копію нічим замикати. */
  async function armCloud(){
    if (armPass.length < 4) return setArmErr(t('auth.err.pass','Пароль — від 4 символів'));
    setArmBusy(true);
    try {
      const meta = Disk.readMeta() || {};
      const salt = meta.salt || b64(crypto.getRandomValues(new Uint8Array(16)));
      const hash = await Vault.hash(armPass, salt);
      if (meta.account.hash && meta.account.hash !== hash){
        setArmErr(t('auth.err.bad','Пароль не підходить')); setArmBusy(false); return;
      }
      Disk.writeMeta({...meta, salt, account: {...meta.account, hash}});
      Cloud.remember(await Vault.cloud(armPass, salt));
      const r = await Cloud.push();
      setArmBusy(false);
      if (!r.ok){ setArmErr(t('set.cloud.fail','Не вдалося покласти копію. Перевірте зв’язок і спробуйте ще раз')); return; }
      setArmed(true); setArm(false);
      Toaster.ok(t('set.cloud.done','Копія створена'));
    } catch (e){ setArmBusy(false); setArmErr(t('auth.err.crypto','Не вдалося перевірити пароль на цьому пристрої')); }
  }
  const cover = useMemo(() => Notifier.coverage(db), [db.sessions, db.settings.notif]);

  async function askPerm(){
    if (Notifier.permission() === 'unsupported'){ Toaster.bad(t('set.notif.no','Цей пристрій не вміє показувати сповіщення')); return; }
    const ok = await Notifier.ensure();
    setPerm(Notifier.permission());
    if (ok){
      Toaster.ok(t('set.notif.ok','Сповіщення увімкнено'));
      Notifier.sync(Store.state).catch(() => {});
    }
  }

  async function exportJson(){
    const ok = await Backup.file();
    Toaster[ok ? 'ok' : 'bad'](ok ? t('set.backup.ok','Копію збережено') : t('set.backup.err','Не вдалося зберегти копію'));
  }
  function importJson(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || !Array.isArray(data.clients)) throw new Error('bad');
        Store.patch(() => ({...emptyDB(), ...data}));
        Toaster.ok(t('set.restore.ok','Дані відновлено'));
      } catch { Toaster.bad(t('set.restore.err','Файл не схожий на копію PRO Trainer')); }
    };
    r.readAsText(file);
  }

  async function onPin(pin){
    if (pinMode === 'set'){ setPin1(pin); setPinMode('confirm'); return; }
    if (pin !== pin1){ Toaster.bad(t('pin.mismatch','PIN не збігся, спробуйте ще')); setPinMode('set'); setPin1(''); return; }
    const meta = Disk.readMeta() || {};
    const {key, salt} = await Vault.derive(pin, meta.pinSalt);
    Vault.key = key;
    Disk.writeMeta({...meta, pinSalt: salt, enc: true});
    Act.settings({secure: true});
    setPinMode(null);
    Toaster.ok(t('pin.on','Базу зашифровано'));
  }

  return (
    <Fragment>
      <Page title={t('menu.set','Налаштування')} onClose={onClose}>
        <div className="sechead tight"><div className="h2">{t('set.money','Гроші')}</div></div>
        <div className="card pad">
          <Field label={t('setup.price','Вартість тренування за замовчуванням')}
                 hint={t('setup.price.hint','Сума підставляється в нове тренування — її можна змінити в будь-якому тренуванні або закріпити окрему ціну за клієнтом.')}>
            <Input value={S.price} onChange={e => Act.settings({price: +e.target.value.replace(/\D/g,'') || 0})}
                   inputMode="numeric" suffix={S.currency} autoFocus={false}/>
          </Field>
          <Field label={t('setup.gym','Що ви віддаєте залу')}>
            <div className="segm">
              {[['percent', t('gym.pct','Відсоток')], ['fixed', t('gym.fix','Фікс. сума')], ['none', t('gym.none','Без комісії')]].map(([v, tx]) => (
                <button key={v} className={cx(S.gymMode === v && 'on')} onClick={() => Act.settings({gymMode: v})}>{tx}</button>
              ))}
            </div>
          </Field>
          {S.gymMode === 'percent' && (
            <Field>
              <Input value={S.gymPercent} onChange={e => Act.settings({gymPercent: clamp(+e.target.value.replace(/\D/g,'') || 0, 0, 90)})}
                     inputMode="numeric" suffix="%"/>
            </Field>
          )}
          {S.gymMode === 'fixed' && (
            <Field>
              <Input value={S.gymFixed} onChange={e => Act.settings({gymFixed: +e.target.value.replace(/\D/g,'') || 0})}
                     inputMode="numeric" suffix={S.currency}/>
            </Field>
          )}
          <div className="card pad" style={{marginTop:14, background:'var(--accent-soft)', borderColor:'transparent'}}>
            <Rowline k={t('home.turnover','Оборот')} v={money(split(S.price, S).gross)}/>
            <Rowline k={t('home.gym','Залу')} v={'−' + money(split(S.price, S).gym)} tone="var(--ink-2)"/>
            <Rowline k={t('home.net','Чистими')} v={money(split(S.price, S).net)} tone="var(--accent)" strong/>
          </div>
          <Field label={t('set.currency','Валюта')}>
            <div className="chips">
              {['₴','$','€','zł'].map(c => (
                <button key={c} className={cx('chip', S.currency === c && 'on')} onClick={() => Act.settings({currency: c})}>{c}</button>
              ))}
            </div>
          </Field>
        </div>

        <div className="sechead"><div className="h2">{t('set.day','Робочий день')}</div></div>
        <div className="card pad">
          <div className="grid2">
            <Field label={t('set.from','Початок')}>
              <Input value={S.dayStart} onChange={e => Act.settings({dayStart: clamp(+e.target.value.replace(/\D/g,'') || 0, 0, 22)})} inputMode="numeric"/>
            </Field>
            <Field label={t('set.to','Кінець')}>
              <Input value={S.dayEnd} onChange={e => Act.settings({dayEnd: clamp(+e.target.value.replace(/\D/g,'') || 0, 1, 23)})} inputMode="numeric"/>
            </Field>
          </div>
          <Field label={t('set.goal','План на день')}
                 hint={t('set.goal.h','Від цього числа рахується завантаження дня на головній')}>
            <Input value={S.dayGoal} onChange={e => Act.settings({dayGoal: clamp(+e.target.value.replace(/\D/g,'') || 0, 1, 24)})}
                   inputMode="numeric" suffix={t('set.goal.u','тренувань')}/>
          </Field>
          <Field label={t('set.lapse','Нагадати про клієнта, якщо не був')} hint={t('set.lapse.h','Такі клієнти з’являться на головній у блоці «Кому час написати»')}>
            <Input value={S.lapseDays} onChange={e => Act.settings({lapseDays: clamp(+e.target.value.replace(/\D/g,'') || 0, 3, 90)})}

        </div>

        <div className="sechead"><div className="h2">{t('menu.notif','Сповіщення')}</div></div>
        {perm !== 'granted' && (

        <div className="card pad" style={{marginTop:9}}>

          <div className="chips" style={{marginTop:10}}>

                /* Зірвану копію показуємо прямо тут: доти вона мовчала, і

/* ─────────── 17. РЕЗЕРВНА КОПІЯ ─────────── */
const Backup = ({onClose}) => {
  const db = useDB();
  const B = db.settings.backup || {auto: true, lastAt: 0};
  const local = Backups.read();
  const [syncSt, setSyncSt] = useState(Sync.status);
  const [restore, setRestore] = useState(false);
  useEffect(() => { const fn = st => setSyncSt(st); Sync.listeners.add(fn); return () => Sync.listeners.delete(fn); }, []);

  const when = ts => ts ? cap(relDay(ts)) + ', ' + fmtTime(ts) : t('bk.never','ще не робили');

  function importFile(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || !Array.isArray(data.clients)) throw new Error('bad');
        Store.patch(() => ({...emptyDB(), ...data}));
        Toaster.ok(t('bk.restored','Дані відновлено'));
        onClose();
      } catch { Toaster.bad(t('bk.badfile','Файл не схожий на копію PRO Trainer')); }
    };
    r.readAsText(file);
  }

  return (
    <Page title={t('bk.title','Резервна копія')} onClose={onClose}>
      <div className="card pad" style={{marginTop:4}}>
        <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('bk.last','Остання копія')}</div>
        <div className="dsp" style={{fontSize:20, fontWeight:800, marginTop:2}}>{when(B.lastAt)}</div>
        <div className="muted" style={{fontSize:12.5, marginTop:6, lineHeight:1.45}}>
          {t('bk.what','Копія містить клієнтів, тренування, продажі, абонементи й налаштування.')}
        </div>
        <Btn kind="pri" size="lg" wide style={{marginTop:14}}
             onClick={() => { const ok = Backups.make(); Backups.file(); Toaster[ok ? 'ok' : 'bad'](ok ? t('bk.done','Копію створено') : t('bk.fail','Не вдалося створити копію')); }}>
          <Ic.dl size={18}/>{t('bk.now','Створити копію зараз')}
        </Btn>
      </div>

      <div className="rows" style={{marginTop:12}}>
        <div className="setrow">
          <div className="ic"><Ic.refresh size={19}/></div>
          <div className="tx"><b>{t('bk.auto','Автоматична копія')}</b>
            <span>{t('bk.auto.s','Раз на добу, коли застосунок відкритий')}</span></div>
          <Switch on={B.auto !== false} onChange={v => Act.settings({backup: {...B, auto: v}})}/>
        </div>
        <label className="setrow" style={{cursor:'pointer'}}>
          <div className="ic"><Ic.ul size={19}/></div>
          <div className="tx"><b>{t('bk.fromfile','Відновити з файлу')}</b>
            <span>{t('bk.fromfile.s','Поточні дані буде замінено')}</span></div>
          <input type="file" accept="application/json" onChange={importFile} style={{display:'none'}}/>
        </label>
        {local && (
          <button className="setrow" onClick={() => setRestore(true)}>
            <div className="ic"><Ic.clock size={19}/></div>
            <div className="tx"><b>{t('bk.fromlocal','Відновити останню копію')}</b>
              <span>{when(local.ts)}</span></div>
            <Ic.right size={17} className="chev"/>
          </button>
        )}
        <div className="setrow">
          <div className="ic"><Ic.globe size={19}/></div>
          <div className="tx"><b>{t('bk.sync','Синхронізація')}</b>
            <span>{db.settings.syncUrl
              ? (syncSt === 'ok' ? t('sync.ok','Все синхронізовано')
                 : syncSt === 'error' ? t('sync.err','Немає зв’язку — спробуємо пізніше')
                 : t('sync.queue','У черзі') + ': ' + Sync.outbox.length)
              : t('bk.sync.off','Вимкнена — копія зберігається на пристрої')}</span></div>
        </div>
      </div>

      <Sheet open={restore} onClose={() => setRestore(false)} title={t('bk.restore.q','Відновити останню копію?')}
             sub={local ? when(local.ts) : ''}>
        <p className="muted" style={{fontSize:13.5, lineHeight:1.5}}>
          {t('bk.restore.t','Поточні дані буде замінено даними з копії. Якщо після копії щось змінювалось — ці зміни зникнуть.')}
        </p>
        <div className="grid2" style={{marginTop:12}}>
          <Btn kind="sec" onClick={() => setRestore(false)}>{t('common.cancel','Скасувати')}</Btn>
          <Btn kind="pri" onClick={() => {
            if (local && local.db){ Store.patch(() => ({...emptyDB(), ...local.db})); Toaster.ok(t('bk.restored','Дані відновлено')); onClose(); }
          }}>{t('bk.restore.go','Відновити')}</Btn>
        </div>
      </Sheet>
    </Page>
  );
};

/* ─── підтримка ───
   Один екран, одна нитка. Без тем, без номерів звернень і без «оцініть
   якість обслуговування»: питання ставить одна людина, відповідає теж
   одна, і обидві бачать усе, що було сказано раніше.

   Порожній екран не мовчить: він одразу каже, куди це піде і як швидко
   відповідають, — інакше перше повідомлення пишеться навмання.        */
const SupportChat = ({onClose}) => {
  const {msgs, loaded} = useHelp();
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const tail = useRef(null);

  /* Поки екран відкритий — перепитуємо сервер. Закрили — перестали:
     фонове опитування з'їдало б трафік заради екрана, якого не видно. */
  useEffect(() => {
    let alive = true;
    const tick = () => { if (alive) Help.load(); };
    tick();
    Help.seen();
    const id = setInterval(tick, HELP_POLL);
    return () => { alive = false; clearInterval(id); Help.seen(); };
  }, []);

  useEffect(() => { if (tail.current) tail.current.scrollIntoView({block:'end'}); }, [msgs.length]);

  async function send(){
    const body = text.trim();
    if (!body || busy) return;
    setBusy(true); setErr('');
    const r = await Help.send(body);
    setBusy(false);
    if (r && r.ok) { setText(''); Help.seen(); }
    else setErr(r && r.error === 'too_fast'
      ? t('help.slow','Забагато повідомлень поспіль. Спробуйте за годину.')
      : t('help.nonet','Не відправилось — немає зв’язку. Спробуйте ще раз.'));
  }

  if (!Help.can()) return (
    <Page title={t('help.title','Підтримка')} onClose={onClose}>
      {/* Запасний вихід. Якщо до нашого сервера не достукатись, порада
          «спробуйте пізніше» нічого не варта — потрібен інший шлях. */}
      <Empty icon={<Ic.msg size={30}/>} title={t('help.off','Потрібен інтернет')}
             text={t('help.off.t','Переписка з підтримкою працює лише зі зв’язком. Решта застосунку зв’язку не потребує й працює далі.')}
             action={<Btn kind="soft" size="sm" onClick={() => Web.open(Support.url())}>
                       <Ic.msg size={17}/>{t('help.other','Написати іншим способом')}</Btn>}/>
    </Page>
  );

  return (
    <Page title={t('help.title','Підтримка')} onClose={onClose}>
      {!msgs.length && (
        <div className="card pad" style={{marginTop:4}}>
          <b style={{fontSize:15}}>{t('help.hi','Напишіть, що не так')}</b>
          <p className="muted" style={{fontSize:13.5, lineHeight:1.55, margin:'7px 0 0'}}>
            {t('help.hi.t','Питання читає жива людина, а не робот. Відповідаємо зазвичай протягом дня. Якщо щось працює не так, опишіть, що ви натиснули й що сталося замість очікуваного.')}
          </p>
          <p className="muted" style={{fontSize:12.5, lineHeight:1.5, margin:'9px 0 0'}}>
            {t('help.hi.p','Ми бачимо тільки те, що ви тут напишете. Ваші клієнти, тренування й гроші лишаються на пристрої — ми в них не заходимо.')}
          </p>
        </div>
      )}

      {msgs.length > 0 && (
        <div className="talk">
          {msgs.map(m => (
            <div key={m.id} className={cx('bub', m.who === 's' ? 'them' : 'me')}>
              {m.text}
              <span className="at">{fmtTime(m.at)}</span>
            </div>
          ))}
          <div ref={tail}/>
        </div>
      )}
      {!msgs.length && !loaded && <div className="muted" style={{fontSize:12.5, marginTop:10}}>…</div>}

      <div style={{marginTop:12}}>
        <textarea className="inp" style={{minHeight:96}} value={text} maxLength={2000}
                  placeholder={t('help.ph','Опишіть питання')}
                  onChange={e => setText(e.target.value)}/>
        {err && <div className="muted" style={{fontSize:12.5, color:'var(--neg)', marginTop:6}}>{err}</div>}
        <Btn kind="pri" size="lg" wide style={{marginTop:10}} disabled={busy || !text.trim()} onClick={send}>
          <Ic.msg size={18}/>{busy ? t('help.sending','Відправляю…') : t('help.send','Відправити')}
        </Btn>
      </div>
    </Page>
  );
};

/* Вибір плану. mode: gate — після завершення пробного, choose — з профілю */
const Paywall = ({mode, onClose}) => {
  const acc = useAccess();
  const nav = useNav();
  const [legal, setLegal] = useState(null);          /* у шлюзі навігації ще немає */
  const go = doc => { if (mode === 'gate') setLegal(doc); else nav.go('legal', {doc}); };
  const [plan, setPlan] = useState('quarterly');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(acc.kind === 'PAYMENT_FAILED' ? t('pay.err','Не вдалося завершити оплату') : '');
  const [okMsg, setOkMsg] = useState('');
  const [webWait, setWebWait] = useState(false);
  const alive = useRef(true);
  useEffect(() => () => { alive.current = false; }, []);

  /* оплата на сайті: відкриваємо сторінку і чекаємо, поки сервер
     підтвердить ліцензію. Повернення у застосунок теж перевіряємо. */
  async function payWeb(){
    setErr(''); setOkMsg('');
    Web.open(Web.payUrl(plan));
    setWebWait(true);
    const r = await Access.awaitWeb(() => alive.current);
    if (!alive.current) return;
    setWebWait(false);
    if (r.ok){ Toaster.ok(t('pay.ok','Підписка активна')); if (onClose) onClose(); }
    else if (r.error === 'timeout') setErr(t('pay.web.wait','Оплату ще не бачимо. Якщо ви платили — натисніть «Я вже оплатив»'));
  }
  async function checkWeb(){
    setErr(''); setBusy(true);
    let lic = await Web.licence();
    /* Підписка є, але цей пристрій до неї ще не прив'язаний — прив'язуємо
       тут же. Раніше це робила кнопка «Відновити покупку», але в збірці
       для магазину її немає: без цього оплачений на сайті доступ не
       відкрився б зовсім, скільки не натискай «Я вже оплатив». */
    if (lic && !lic.active && lic.needsClaim) lic = await Web.claim();
    setBusy(false);
    if (lic && lic.active){ Access.fromWeb(lic); Toaster.ok(t('pay.ok','Підписка активна')); if (onClose) onClose(); }
    else setErr(lic && lic.error === 'device_limit'
      ? t('pay.web.limit','Підписка вже працює на іншому пристрої — звільніть місце на сайті')
      : lic && lic.error === 'network'
      ? t('pay.web.net','Немає зв’язку із сервером — спробуйте ще раз')
      : t('pay.web.none','Оплати за цим логіном поки не видно'));
  }

  async function buy(){
    setErr(''); setBusy(true);
    const r = await Access.purchase(plan);
    setBusy(false);
    if (r.ok){ Toaster.ok(t('pay.ok','Підписка активна')); if (onClose) onClose(); }
    else setErr(t('pay.err','Не вдалося завершити оплату'));
  }
  async function restore(){
    setErr(''); setBusy(true);
    const r = await Access.restore();
    setBusy(false);
    if (r.ok){ Toaster.ok(t('pay.restored','Покупку відновлено')); if (onClose) onClose(); }
    else setErr(r.error === 'nothing_to_restore'
      ? t('pay.norestore','Активних покупок не знайшли')
      : r.error === 'device_limit'
      ? t('pay.web.limit','Підписка вже працює на іншому пристрої — звільніть місце на сайті')
      : t('pay.err','Не вдалося завершити оплату'));
  }

  const expired = acc.kind === 'TRIAL_EXPIRED';

  /* Збірка для магазину нічого не продає: показуємо, де оформити
     підписку, і даємо перевірити оплату. Адреса тут — звичайний текст,
     а не посилання: за правилами Apple вести звідси на оплату не можна. */
  /* адресу беремо з налаштування, а без нього — ту, з якої відкрито

          {expired ? t('pay.gate.title','Пробний період завершено')

                   : t('pay.free.title','Підписка неактивна')}

        <p className="muted" style={{fontSize:14, marginTop:8, lineHeight:1.5}}>

        </p>

        <div className="card pad" style={{marginTop:16}}>

          </div>
          <div style={{fontSize:17, fontWeight:800, letterSpacing:'-.02em', color:'var(--accent)', marginTop:6}}>
            {site}

        {err && (

            <b style={{fontSize:14.5, color:'var(--neg)'}}>{err}</b>
          </div>
        )}

        <Btn kind="pri" size="lg" wide style={{marginTop:14}} onClick={checkWeb} disabled={busy}>
          {busy ? t('pay.web.checking','Перевіряємо оплату…') : t('pay.web.done','Я вже оплатив')}

        <div className="muted" style={{fontSize:11.5, textAlign:'center', marginTop:10, lineHeight:1.5}}>
          {t('pay.free.note','Після оплати увійдіть тим самим логіном — доступ відкриється сам.')}

  const body = STORE.free() ? gate : (

          : t('pay.demo','Демо-режим: магазин ще не підключено, покупка імітується для перевірки сценарію.')}

/* ─────────── нагадування ───────────
   Поки застосунок відкритий — планувальник щохвилини перевіряє розклад
   і показує системне сповіщення (Notification API) та запис у стрічці.  */
function useReminders(db){
  useEffect(() => {
    if (!db) return;
    let alive = true;
    const fire = (key, {title, body, type, tone, clientId, to}) => {
      if (Store.state.fired[key]) return;
      Act.markFired(key);
      Act.notify({title, body, type, tone, clientId, to});
      Notifier.show(title, body, key);
    };
    const tick = () => {
      if (!alive || !Store.state) return;
      if (!Access.allowed()) Access.emit();      /* строк вийшов, поки застосунок відкритий */
      const s = Store.state, N = s.settings.notif, now = Date.now();

      /* нативні нагадування вже заплановані наперед — не дублюємо */
      if (!Notifier.native()) s.sessions.filter(x => x.status === 'planned').forEach(x => {
        const dt = +new Date(x.start) - now;
        const c = byId(s.clients, x.clientId);
        const nm = c ? c.name : t('session.one','Тренування');
        (N.before || []).forEach(m => {
          const at = m * 60000;
          if (dt <= at && dt > at - 90000)              /* вікно = крок планувальника */
            fire('b' + m + '_' + x.id, {title:'🏋️ ' + t('n.before','Тренування за') + ' ' + minsLabel(m),
              body: nm + ' · ' + fmtTime(x.start), type:'session', clientId: x.clientId});
        });
      });

      /* увечері підказуємо нагадати завтрашнім клієнтам */
      if (N.client && new Date().getHours() >= 18){
        const tomorrow = addDays(new Date(), 1);
        s.sessions.filter(x => x.status === 'planned' && sameDay(x.start, tomorrow)).forEach(x => {
          const c = byId(s.clients, x.clientId);
          if (!c) return;
          fire('tmr_' + x.id, {title: t('n.tomorrow','Нагадайте про завтра'),
            body: c.name + ' · ' + fmtTime(x.start), type:'booked', clientId: c.id});
        });
      }

      /* щоденні перевірки — раз на добу */
      const dayKey = iso(new Date());
      if (!s.fired['day_' + dayKey]){
        Act.markFired('day_' + dayKey);
        Act.sweepFired();
        const B = s.settings.backup || {};
        if (B.auto !== false && Date.now() - (B.lastAt || 0) > 20 * 3600 * 1000) Backups.make();
        const acc = Access.state();
        if (acc.kind === 'TRIAL_ACTIVE' && [7, 3, 1].indexOf(acc.left) >= 0)
          fire('trial_' + acc.left, {
            title: acc.left === 1 ? t('n.trial1','Завтра завершується пробний період')
                 : t('n.trial','Пробний період завершується'),
            /* у безкоштовній збірці плану в застосунку не обрати —
               нагадуємо, де підписка живе, а не кличемо туди */
            body: acc.left !== 1 ? t('n.trial.b','Залишилось') + ' ' + nDays(acc.left) + ' ' + t('n.trial.b2','безкоштовного доступу')
                 : STORE.free() ? t('pay.free.where','Підписка оформлюється в особистому кабінеті')
                 : t('n.trial1.b','Оберіть план, щоб продовжити роботу без перерви'),
            type:'info', tone: acc.left === 1 ? 'warn' : null, to:'plans'});
        if (N.debt){
          const debts = s.sessions.filter(isDebt);
          const total = sum(debts, owed);
          if (total > 0) fire('debt_' + dayKey, {title: t('n.debt.t','Є неоплачені тренування'),
            body: money(total) + ' · ' + nClients(new Set(debts.map(x => x.clientId)).size), type:'debt', tone:'bad', to:'debts'});
        }
        if (N.lapsed){
          s.clients.filter(c => !c.archived).forEach(c => {
            const cs = clientStats(s, c.id);
            if (cs.lapsedDays !== null && cs.lapsedDays >= s.settings.lapseDays && !cs.next)
              fire('lap_' + c.id + '_' + Math.floor(cs.lapsedDays / 7), {
                title: c.name.split(' ')[0] + ' ' + t('n.lapsed.t','давно не тренувався'),
                body: t('lapse.last','Востаннє') + ': ' + (cs.last ? fmtDM(cs.last.start) : '—'),
                type:'lapsed', clientId: c.id});
          });
        }
        /* обіцянку «нагадає привітати» тримає саме це: побачити блок на
           головній тренер може й не встигнути, а день народження буває
           раз на рік і другого шансу не дає */
        if (N.birthday){
          s.clients.filter(c => !c.archived && c.birthday).forEach(c => {
            const days = bdIn(c.birthday);
            if (days === 0 || days === 1)
              fire('bd_' + c.id + '_' + new Date().getFullYear(), {
                title: t('n.bd.t','День народження'),
                body: c.name + ' · ' + (days === 0 ? t('home.bd.today','сьогодні') : t('n.bd.tmr','завтра')),
                type:'info', clientId: c.id});
          });
        }
        if (N.packageEnd){
          s.subs.filter(x => x.total - x.used <= 1 && x.used < x.total).forEach(x => {
            const c = byId(s.clients, x.clientId);
            if (c) fire('sub_' + x.id, {title: t('n.pack.t','Абонемент закінчується'),
              body: c.name + ' · ' + t('subs.left','залишилось') + ' ' + nSessions(x.total - x.used),
              type:'pack', tone:'warn', clientId: c.id});
          });
        }
        if (N.stock){
          s.products.filter(p => p.stock <= 1).forEach(p => {
            fire('stock_' + p.id + '_' + p.stock, {title: p.stock === 0 ? t('n.stock.out','Товар закінчився') : t('n.stock.low','Товар закінчується'),
              body: p.name + ' · ' + t('goods.left','залишок') + ' ' + p.stock, type:'stock', tone:'warn', to:'sales'});
          });
        }
      }
    };
    const id = setInterval(tick, 60000);
    const x = setTimeout(tick, 2500);
    return () => { alive = false; clearInterval(id); clearTimeout(x); };
  }, [!!db]);

  /* нативний розклад перескладається, коли змінились тренування або інтервали */
  useEffect(() => {
    if (!db || !Notifier.native()) return;
    const x = setTimeout(() => Notifier.sync(Store.state).catch(() => {}), 800);
    return () => clearTimeout(x);
  }, [db && db.sessions, db && db.settings.notif]);
}

/* ─────────── тема ─────────── */
function useTheme(mode){
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const dark = mode === 'dark' || (mode === 'system' && mq.matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      const m = document.getElementById('metaTheme');
      if (m) m.setAttribute('content', dark ? '#08080B' : '#F5F5F9');
    };
    apply();
    mq.addEventListener('change', apply);
    return () => mq.removeEventListener('change', apply);
  }, [mode]);
}

/* ─────────── маршрути ─────────── */
const ROUTES = {
  'notifs':      p => <Notifs {...p}/>,
  'client':      p => <ClientPage {...p}/>,
  'client.new':  p => <ClientForm {...p}/>,
  'session.new': p => <SessionForm {...p}/>,
  'finance':     p => <Finance {...p}/>,
  'stats':       p => <Stats {...p}/>,
  'settings':    p => <Settings {...p}/>,
  'debts':       p => <Debts {...p}/>,
  'lapsed':      p => <Lapsed {...p}/>,
  'sell':        p => <SellForm {...p}/>,
  'product.new': p => <ProductForm {...p}/>,
  'package.new': p => <PackageForm {...p}/>,
  'packages':    p => <PackagesPage {...p}/>,
  'remind':      p => <Remind {...p}/>,
  'backup':      p => <Backup {...p}/>,
  'plans':       p => <Paywall {...p} mode="page"/>,
  'subscription':p => <Subscription {...p}/>,
  'support':     p => <SupportChat {...p}/>,
  'legal':       p => <Legal {...p}/>,
  'register':    p => <Register {...p}/>,
};

const TABS = [
  {k:'home',    ic: Ic.home,   t:() => t('nav.home','Головна')},
  {k:'cal',     ic: Ic.cal,    t:() => t('nav.cal','Календар')},
  {k:'clients', ic: Ic.users,  t:() => t('nav.clients','Клієнти')},
  {k:'sales',   ic: Ic.bag,    t:() => t('nav.sales','Продажі')},
  {k:'profile', ic: Ic.user,   t:() => t('nav.profile','Профіль')},
];

/* ─────────── оболонка ─────────── */
const Shell = () => {
  const db = useDB();
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]);
  const [quick, setQuick] = useState(false);
  const [loading, setLoading] = useState(true);

  useTheme(db.settings.theme);
  useReminders(db);
  useEffect(() => { const x = setTimeout(() => setLoading(false), 420); return () => clearTimeout(x); }, []);

  /* апаратна кнопка «назад» закриває верхній екран, а не застосунок:
     кожен відкритий екран — один запис в історії, знімається лише через popstate */
  const pushed = useRef(0);
  const go = useCallback((name, params) => {
    if (!ROUTES[name]){ setTab(name); return; }
    setStack(s => [...s, {name, params: params || {}, key: uid('rt')}]);
    try { history.pushState({pt: ++pushed.current}, ''); } catch { pushed.current++; }
  }, []);
  useEffect(() => {
    const onPop = () => {
      pushed.current = Math.max(0, pushed.current - 1);
      setStack(s => (s.length ? s.slice(0, -1) : s));
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  const closeTop = useCallback(() => {
    if (pushed.current > 0){ try { history.back(); return; } catch {} }
    setStack(s => s.slice(0, -1));
  }, []);
  const toTab = useCallback(k => {
    if (pushed.current > 0){ const n = pushed.current; pushed.current = 0; try { history.go(-n); } catch {} }
    setStack([]);
    setTab(k);
  }, []);

  const nav = useMemo(() => ({go, back: closeTop, tab: toTab}), [go, closeTop, toTab]);

  const Screen = {home: Home, cal: Calendar, clients: Clients, sales: Sales, profile: Profile}[tab] || Home;

  return (
    <NavCtx.Provider value={nav}>
      <div className="app">
        <Boundary key={tab}><Screen loading={loading}/></Boundary>

        {tab === 'home' && (
          <button className="fab" onClick={() => setQuick(true)} aria-label={t('common.add','Додати')}><Ic.plus size={26}/></button>
        )}

        <nav className="nav">
          {TABS.map(x => (
            <button key={x.k} className={cx(tab === x.k && 'on')} onClick={() => toTab(x.k)}
                    aria-current={tab === x.k ? 'page' : undefined}>
              <x.ic size={23}/><span>{x.t()}</span>
            </button>
          ))}
        </nav>

        {stack.map((r, i) => (
          <Boundary key={r.key}>
            <div style={{zIndex: 50 + i, position:'relative'}}>
              {ROUTES[r.name]({params: r.params, onClose: closeTop})}
            </div>
          </Boundary>
        ))}

        <QuickAdd open={quick} onClose={() => setQuick(false)}/>
        <ToastHost/>
      </div>
    </NavCtx.Provider>
  );
};

/* Доступ вирішується в одному місці: показуємо застосунок, вступ до
   пробного періоду або вибір плану. Дані при цьому не чіпаються. */
const AppGate = () => {
  const acc = useAccess();
  const [intro, setIntro] = useState(() => !Access.read().trialStartedAt);
  useEffect(() => {
    Access.verify().catch(() => {});
    /* строк може вийти, поки застосунок згорнутий — перевіряємо на поверненні */
    const recheck = () => { Access.emit(); Access.verify().catch(() => {}); };
    const onVis = () => { if (!document.hidden) recheck(); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', recheck);
    const id = setInterval(recheck, 30000);
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('focus', recheck);
      clearInterval(id);
    };
  }, []);
  /* Дивимось на живий запис, а не на початковий стан: після
     перевстановлення локальної дати немає, і вступ показався б навіть
     тоді, коли сервер уже сказав, що пробний період давно почався. */
  if (intro && !Access.read().trialStartedAt)
    return <TrialIntro onStart={() => { Access.startTrial(); setIntro(false); }}/>;
  if (!acc.allowed) return <Paywall mode="gate"/>;
  return <Shell/>;
};

/* ─────────── запуск ─────────── */
const Boot = () => {
  const [phase, setPhase] = useState('load');       // load | onboard | auth | setup | pin | app | error
  const [account, setAccount] = useState(null);
  const [pinErr, setPinErr] = useState('');
  const [, force] = useState(0);

  /* застосунок на екрані — прибираємо заставку завантаження */
  useEffect(() => { const b = document.getElementById('boot'); if (b) b.remove(); }, []);

  useEffect(() => {
    (async () => {
      try {
        await Disk.hydrate();          /* нативне сховище переживає очищення WebView */
        const raw = Disk.readRaw();
        if (!raw){ setPhase('onboard'); return; }
        const parsed = JSON.parse(raw);
        if (parsed && parsed.enc){ setPhase('pin'); return; }
        boot(parsed);
      } catch (e){
        console.error(e);
        setPhase('error');
      }
    })();
  }, []);

  function boot(data){
    const base = emptyDB();
    const db = {...base, ...data, settings: {...base.settings, ...(data.settings || {})}};
    /* кабінети попередніх версій: прапорці нагадувань → список інтервалів */
    const n = db.settings.notif || {};
    if (!Array.isArray(n.before)){
      const before = [];
      if (n.before20 !== false) before.push(60);
      if (n.before5 !== false) before.push(15);
      db.settings.notif = {...base.settings.notif, ...n, before: before.length ? before : [60, 15]};
      delete db.settings.notif.before20;
      delete db.settings.notif.before5;
    }
    if (!db.settings.backup) db.settings.backup = base.settings.backup;
    db.clients = db.clients.map(c => ({birthday:'', price:null, ...c}));
    I18n.set(db.settings.lang);
    Store.init(db);
    /* після виходу з акаунта — знову екран входу, дані при цьому цілі */
    setPhase(!db.onboarded ? 'onboard' : Disk.signedOut() ? 'auth' : 'app');
    /* фото з попередніх версій лежать нестиснутими — ужимаємо після того,
       як екран уже показався, щоб старт не чекав на canvas */
    setTimeout(() => { Photo.shrinkStored().catch(() => {}); }, 1200);
  }

  async function unlock(pin){
    try {
      const meta = Disk.readMeta() || {};
      const {key} = await Vault.derive(pin, meta.pinSalt);
      Vault.key = key;
      const raw = JSON.parse(Disk.readRaw());
      const json = await Vault.decrypt(raw.iv, raw.ct);
      boot(JSON.parse(json));
    } catch (e){
      Vault.key = null;
      setPinErr(t('pin.wrong','Невірний PIN'));
      force(x => x + 1);
    }
  }

  if (phase === 'load') return <SkScreen/>;
  if (phase === 'error') return (
    <div className="screen" style={{paddingTop:60}}>
      <ErrorBox title={t('boot.err','Не вдалося прочитати дані')}
                text={t('boot.err.t','Схоже, збережена база пошкоджена. Можна почати з чистого аркуша — або відновити з резервної копії пізніше.')}
                onRetry={() => location.reload()}/>
      <Btn kind="danger" wide style={{marginTop:12}} onClick={() => { Disk.clear(); location.reload(); }}>
        {t('boot.reset','Почати з чистого аркуша')}
      </Btn>
    </div>
  );
  if (phase === 'pin') return <PinLock mode="enter" onPin={unlock} error={pinErr}/>;
  if (phase === 'onboard') return <Onboarding onDone={() => setPhase('auth')}/>;
  {/* новий кабінет веде до майстра налаштувань, а той, хто просто
      повернувся після виходу, — одразу до роботи */}
  if (phase === 'auth') return <Auth onReady={r => {
    setAccount(r.account);
    /* копія з сервера відкрилась — це той самий кабінет на новому
       пристрої, майстер налаштувань йому ні до чого */
    if (r.restored){
      Disk.signIn();
      try {
        const db = JSON.parse(r.restored);
        Disk.writeRaw(r.restored);
        boot(db);
        Toaster.ok(t('cloud.back','Дані відновлено з копії'));
        return;
      } catch (e){ /* зіпсована копія — далі як звичайний новий кабінет */ }
    }
    if (r.fresh) return setPhase('setup');
    Disk.signIn();
    setPhase('app');
  }}/>;
  if (phase === 'setup') return (
    <Setup account={account} onDone={(settings, demo, acc, name) => {
      const phone = acc && acc.kind === 'phone' ? phoneMask(acc.login) : '';
      const email = acc && acc.kind === 'email' ? acc.login : '';
      const base = demo ? markDemo(seedDB({name, phone, email})) : emptyDB();
      const db = {...base, onboarded: true,
        profile: {...base.profile, name: name || base.profile.name, phone, email},
        /* мова, обрана на першому екрані, а не та, що лежала в шаблоні */
        settings: {...base.settings, ...settings, lang: I18n.get()}};
      I18n.set(db.settings.lang);
      Store.init(db);
      Store.persist();
      setPhase('app');
    }}/>
  );
  return <AppGate/>;
};

/* сервіс-воркер: офлайн-режим і швидкий старт */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Boundary><Boot/></Boundary>
);
</script>
