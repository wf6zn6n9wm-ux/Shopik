<!doctype html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" id="metaTheme" />
<meta name="description" content="PRO Trainer — робочий кабінет персонального тренера: клієнти, розклад, гроші, продажі." />
<title>PRO Trainer — кабінет персонального тренера</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- версію фіксуємо: без неї CDN одного дня віддасть наступний мажор,
     і застосунок перестане компілюватись без жодної нашої зміни -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Onest:wght@500;600;700;800&display=swap" rel="stylesheet">

<!-- ==================================================================
     PRO TRAINER · DESIGN SYSTEM (v1)
     ------------------------------------------------------------------
     Робочий кабінет персонального тренера. Не фітнес-трекер: клієнти,
     розклад, гроші, продажі — в одному місці. Відчуття продукту рівня
     хорошого банківського застосунку.

     ТЕМИ     Light (білий фон, світло-сірі картки) і Dark (майже чорний
              графіт, темно-сірі картки). Єдина система токенів: різні
              лише значення, назви й ролі однакові.
     АКЦЕНТ   Iris / Purple. Колір лише там, де він допомагає читати
              інформацію: гроші, статус, дія.
     ТИПО     Onest (дисплей, великі числа) + Manrope (UI), tabular-nums.
     РАДІУСИ  12 / 16 / 20 / 26 / 999
     СІТКА    4pt, великі відступи 18–22px, оболонка 480px
     РУХ      тільки transform/opacity, ease-out, 160–420ms
     ================================================================== -->
<style>
  :root{
    /* ── акцент: спільний для обох тем ── */
    --accent:#6B4DFF; --accent-2:#8B6BFF; --accent-3:#5636E8;
    --accent-ink:#ffffff;
    --pos:#12B76A; --warn:#F79009; --neg:#F04438; --info:#3B9DF8;

    /* ── геометрія ── */
    --r-xs:10px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
    --shell:480px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --nav-h:64px;
    --ease:cubic-bezier(.16,1,.3,1);
  }

  /* ── LIGHT ── */
  :root, html[data-theme="light"]{
    --bg:#F5F5F9; --bg-2:#FFFFFF;
    --surface:#FFFFFF; --surface-2:#F1F1F6; --surface-3:#E9E9F1;
    --ink:#12121A; --ink-2:#5A5A6B; --ink-3:#8C8C9C; --ink-4:#B4B4C2;
    --line:#EAEAF1; --line-2:#DEDEE8;
    --accent-soft:rgba(107,77,255,.09); --accent-soft-2:rgba(107,77,255,.16);
    --pos-soft:rgba(18,183,106,.12); --warn-soft:rgba(247,144,9,.12); --neg-soft:rgba(240,68,56,.10);
    --hero-1:#7A5BFF; --hero-2:#5B37F0; --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.78);
    --shadow-1:0 2px 8px -4px rgba(20,20,45,.10);
    --shadow-2:0 12px 30px -18px rgba(20,20,45,.28);
    --shadow-3:0 22px 50px -28px rgba(56,32,160,.45);
    --skeleton:linear-gradient(90deg,#EDEDF4 25%,#F6F6FA 50%,#EDEDF4 75%);
    --scrim:rgba(18,18,30,.34);
  }
  /* ── DARK ── */
  html[data-theme="dark"]{
    --bg:#08080B; --bg-2:#0E0E13;
    --surface:#15151C; --surface-2:#1C1C25; --surface-3:#24242F;
    --ink:#F5F5F8; --ink-2:#9E9EAF; --ink-3:#71717F; --ink-4:#4C4C58;
    --line:#23232C; --line-2:#2E2E39;
    --accent-soft:rgba(123,92,255,.16); --accent-soft-2:rgba(123,92,255,.26);
    --pos-soft:rgba(18,183,106,.16); --warn-soft:rgba(247,144,9,.16); --neg-soft:rgba(240,68,56,.16);
    --hero-1:#3B2B8F; --hero-2:#241A63; --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.72);
    --shadow-1:0 2px 8px -4px rgba(0,0,0,.6);
    --shadow-2:0 14px 34px -20px rgba(0,0,0,.85);
    --shadow-3:0 22px 50px -28px rgba(0,0,0,.9);
    --skeleton:linear-gradient(90deg,#1B1B23 25%,#23232D 50%,#1B1B23 75%);
    --scrim:rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    color:var(--ink);
    font-family:'Manrope',ui-sans-serif,-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    font-size:15px; line-height:1.42;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow-x:hidden;
    transition:background-color .28s var(--ease), color .28s var(--ease);
  }
  #root{max-width:var(--shell);margin-inline:auto;min-height:100vh;position:relative;isolation:isolate;
    background:var(--bg);overflow-x:hidden;}
  .sechead > .h2{min-width:0;}
  .sechead .link{flex:none;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  button{border:0;background:none;cursor:pointer;padding:0;}
  a{color:var(--accent);text-decoration:none;}
  ::-webkit-scrollbar{width:0;height:0;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.02em;}
  .dsp{font-family:'Onest',ui-sans-serif,sans-serif;letter-spacing:-.03em;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ══════════ оболонка ══════════ */
  .app{min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 80px);}
  .screen{padding:0 18px 18px;animation:screenIn .34s var(--ease);}
  @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .appbar{position:sticky;top:0;z-index:30;padding:calc(var(--safe-top) + 12px) 18px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(180deg,var(--bg) 72%,transparent);backdrop-filter:blur(10px);}
  .appbar .title{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .iconbtn{width:42px;height:42px;border-radius:var(--r-sm);display:grid;place-items:center;
    color:var(--ink);position:relative;transition:transform .16s var(--ease),background .16s;}
  .iconbtn:active{transform:scale(.92);}
  .iconbtn.boxed{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);}
  .iconbtn .bell-dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);border:2px solid var(--bg);}

  .h1{font-family:'Onest',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.035em;margin:2px 0 2px;}
  .h1-sub{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:-.01em;}
  .h2{font-size:17px;font-weight:800;letter-spacing:-.025em;}
  .muted{color:var(--ink-2);}
  .mute3{color:var(--ink-3);}
  .sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 2px 12px;}
  .sechead .link{color:var(--accent);font-weight:700;font-size:13.5px;}
  .sechead.tight{margin-top:18px;}

  /* ══════════ картки ══════════ */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow-1);position:relative;}
  .card.flat{box-shadow:none;}
  .card.pad{padding:16px;}
  .press{transition:transform .16s var(--ease);}
  .press:active{transform:scale(.985);}

  /* hero — дохід */
  .hero{border-radius:var(--r-xl);padding:18px 18px 16px;color:var(--hero-ink);position:relative;overflow:hidden;
    background:linear-gradient(140deg,var(--hero-1),var(--hero-2));box-shadow:var(--shadow-3);
    border:1px solid rgba(255,255,255,.08);}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.16),transparent 55%);}
  .hero .lbl{font-size:13.5px;font-weight:600;color:var(--hero-sub);}
  .hero .val{font-family:'Onest',sans-serif;font-size:38px;font-weight:800;letter-spacing:-.04em;margin:6px 0 2px;line-height:1.05;}
  .hero .sub{font-size:13px;color:var(--hero-sub);font-weight:600;}
  .hero .delta{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.16);font-size:12.5px;font-weight:800;}
  .hero .delta.pos{color:#8AF0BE;} .hero .delta.neg{color:#FFB4AE;}
  .hero .spark{position:absolute;right:16px;bottom:14px;display:flex;align-items:flex-end;gap:5px;height:56px;}
  .hero .spark i{width:8px;border-radius:4px;background:rgba(255,255,255,.34);display:block;
    animation:sparkIn .5s var(--ease) both;}
  .hero .spark i.on{background:rgba(255,255,255,.92);}
  @keyframes sparkIn{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}

  /* три метрики */
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 11px 11px;
    box-shadow:var(--shadow-1);min-width:0;overflow:hidden;}
  .kpi .k{font-size:12px;color:var(--ink-2);font-weight:600;}
  .kpi .v{font-family:'Onest',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.04em;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .ic{margin-top:9px;color:var(--accent);opacity:.9;}

  /* ══════════ рядки списку ══════════ */
  .rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-1);}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;
    border-top:1px solid var(--line);transition:background .16s;}
  .rows .row:first-child{border-top:0;}
  .row:active{background:var(--surface-2);}
  .row .nm{font-weight:700;font-size:14.5px;letter-spacing:-.01em;}
  .row .ds{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .tm{font-family:'Onest',sans-serif;font-weight:700;font-size:15px;color:var(--accent);letter-spacing:-.03em;min-width:48px;}
  .chev{color:var(--ink-4);flex:none;}
  .dot-st{width:9px;height:9px;border-radius:50%;flex:none;}

  /* аватар */
  .av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;
    font-family:'Onest',sans-serif;letter-spacing:-.02em;overflow:hidden;background-size:cover;background-position:center;}
  .av.ring{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent-soft-2);}

  /* ══════════ кнопки ══════════ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;
    border-radius:var(--r-md);font-weight:800;font-size:15px;letter-spacing:-.01em;
    transition:transform .16s var(--ease),opacity .16s,background .16s;}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -14px var(--accent);}
  .btn.sec{background:var(--surface-2);color:var(--ink);}
  .btn.ghost{background:transparent;color:var(--accent);}
  .btn.soft{background:var(--accent-soft);color:var(--accent);}
  .btn.danger{background:var(--neg-soft);color:var(--neg);}
  .btn.wide{width:100%;}
  .btn.sm{height:40px;font-size:13.5px;padding:0 14px;border-radius:var(--r-sm);}
  .btn.lg{height:56px;font-size:16px;border-radius:var(--r-lg);}
  /* оплата на сайті: назва і причина, чому дешевше — у два рядки */
  .btn.webpay{height:auto;padding:12px 16px;gap:10px;}
  .btn.webpay span{display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.25;}
  .btn.webpay i{font-style:normal;font-weight:600;font-size:12px;color:var(--ink-3);}

  .fab{position:fixed;right:calc(50% - min(50vw,var(--shell)/2) + 18px);
    bottom:calc(var(--nav-h) + var(--safe-bottom) + 18px);z-index:35;
    width:56px;height:56px;border-radius:20px;display:grid;place-items:center;
    background:var(--accent);color:#fff;box-shadow:0 16px 32px -14px var(--accent);
    transition:transform .18s var(--ease);}
  .fab:active{transform:scale(.9) rotate(45deg);}

  /* чіпи / таби */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;}
  .chip{flex:none;height:36px;padding:0 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;
    background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:13px;transition:.16s;}
  .chip.on{background:var(--accent);color:#fff;}
  .chip.soft.on{background:var(--accent-soft);color:var(--accent);}

  .segm{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:4px;gap:4px;}
  .segm button{flex:1;height:36px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink-2);transition:.18s var(--ease);}
  .segm button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);}
  html[data-theme="dark"] .segm button.on{background:var(--surface-3);}

  .tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:6px;}
  .tabs button{padding:12px 0 11px;font-weight:700;font-size:14.5px;color:var(--ink-3);position:relative;}
  .tabs button.on{color:var(--ink);}
  .tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:var(--accent);}

  .badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;
    font-size:11.5px;font-weight:800;letter-spacing:.01em;}
  .badge.pos{background:var(--pos-soft);color:var(--pos);}
  .badge.warn{background:var(--warn-soft);color:var(--warn);}
  .badge.neg{background:var(--neg-soft);color:var(--neg);}
  .badge.acc{background:var(--accent-soft);color:var(--accent);}
  .badge.mut{background:var(--surface-2);color:var(--ink-2);}

  /* ══════════ поля ══════════ */
  .field{margin-top:14px;}
  .field > label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 2px 7px;}
  .inp{width:100%;height:52px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);
    padding:0 14px;font-weight:600;font-size:15.5px;color:var(--ink);outline:none;transition:.16s;}
  .inp::placeholder{color:var(--ink-4);font-weight:500;}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft);}
  textarea.inp{height:auto;min-height:104px;padding:13px 14px;line-height:1.45;resize:vertical;}
  .inp.err{border-color:var(--neg);box-shadow:0 0 0 3.5px var(--neg-soft);}
  /* Переписка з підтримкою. Вигляд узятий у месенджерів навмисно: це
     єдина форма, яку не треба пояснювати — своє праворуч, чуже ліворуч. */
  .talk{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .bub{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;
    white-space:pre-wrap;word-break:break-word;}
  .bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px;}
  .bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);
    border-bottom-left-radius:5px;}
  .bub .at{display:block;font-size:10.5px;opacity:.62;margin-top:5px;}
  .field .hint{font-size:12px;color:var(--ink-3);margin:6px 2px 0;}
  .field .hint.bad{color:var(--neg);}
  .inp-wrap{position:relative;}
  .inp-wrap .suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:700;}
  .inp-wrap .lead{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);}
  .inp-wrap.lead-pad .inp{padding-left:42px;}

  .search{position:relative;}
  .search .inp{padding-left:42px;height:48px;background:var(--surface-2);border-color:transparent;}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);}

  .switch{width:50px;height:30px;border-radius:999px;background:var(--surface-3);position:relative;transition:.2s var(--ease);flex:none;}
  .switch.on{background:var(--accent);}
  .switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
    transition:.2s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .switch.on i{left:23px;}

  .setrow{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;border-top:1px solid var(--line);}
  .rows .setrow:first-child{border-top:0;}
  .setrow .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none;}
  .setrow .tx{flex:1;min-width:0;}
  .setrow .tx b{font-weight:700;font-size:14.5px;display:block;}
  .setrow .tx span{font-size:12.5px;color:var(--ink-2);}
  .setrow .rt{color:var(--ink-3);font-weight:700;font-size:13.5px;}

  /* ══════════ шторки / модалки ══════════ */
  .scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);backdrop-filter:blur(2px);
    animation:fade .22s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--shell));z-index:61;
    background:var(--bg-2);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--safe-bottom));
    box-shadow:0 -20px 50px -30px rgba(0,0,0,.5);animation:sheetIn .34s var(--ease) both;
    max-height:92vh;overflow-y:auto;border-top:1px solid var(--line);}
  @keyframes sheetIn{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
  .grip{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:2px auto 12px;}
  .sheet h3{font-family:'Onest',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px;}

  .page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
    max-width:var(--shell);margin-inline:auto;animation:pageIn .3s var(--ease) both;
    padding-bottom:calc(24px + var(--safe-bottom));}
  @keyframes pageIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
  .page .appbar{background:linear-gradient(180deg,var(--bg) 74%,transparent);}

  /* ══════════ нижня навігація ══════════ */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--shell));z-index:40;
    height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);
    display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
    background:color-mix(in srgb,var(--bg-2) 88%,transparent);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);}
  .nav button{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    color:var(--ink-3);font-size:10.5px;font-weight:700;transition:color .18s;}
  .nav button.on{color:var(--accent);}
  .nav button svg{transition:transform .22s var(--ease);}
  .nav button.on svg{transform:translateY(-1px) scale(1.06);}

  /* ══════════ календар ══════════ */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}

  .cal-day .pips{display:flex;gap:2px;height:4px;}
  .cal-day .pips i{width:4px;height:4px;border-radius:50%;background:var(--accent);}

  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}

  .ev{border-radius:14px;padding:9px 12px;margin:4px 0;border-left:3px solid var(--accent);
    background:var(--accent-soft);color:var(--ink);}
  .ev b{font-size:13.5px;font-weight:800;display:block;}

  .ev .go{flex:none;height:30px;padding:0 10px;border-radius:9px;background:var(--accent);color:#fff;
    font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:5px;}

  /* ══════════ графіки ══════════ */
  .chart{width:100%;display:block;overflow:visible;}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;}

  .empty{text-align:center;padding:34px 20px;}

  /* ─── онбординг вміщається в екран цілком ───

     вбік, збиває з пантелику. Тому висота дорівнює екрану, а зайве
     віддає картинка — вона єдина тут тягнеться.

     Клас окремий навмисно: ту саму розмітку .ob використовує екран

  .dayload{display:flex;gap:14px;align-items:stretch;padding:16px 14px;}
  .dl-left{width:118px;flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;

  .dl-ring{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center;}
  /* кільце лежить під іконкою, тому адресуємо саме його, а не будь-який svg */
  .dl-ring .dl-track{position:absolute;inset:0;width:80px;height:80px;}
  .dl-ring .dl-track circle{fill:none;stroke-width:7;stroke-linecap:round;}
  .dl-ring .dl-track circle.bg{stroke:var(--accent-soft);}

  .dl-num{font-family:'Onest',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:8px;}
  .dl-cap{font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1.35;}
  .dl-bar{width:100%;height:6px;border-radius:6px;background:var(--surface-2);margin:10px 0 5px;overflow:hidden;}
  .dl-bar i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .5s var(--ease);}
  .dl-legend{margin-top:9px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;width:100%;}
  .dl-legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);font-weight:600;}
  .dl-legend i{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none;}
  .dl-legend i.on{background:var(--accent);}

  .dl-line{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
  /* minmax(0,1fr), а не 1fr: інакше колонка не стискається під довгим
     іменем і картка вилазить за екран */
  .dl-item{display:grid;grid-template-columns:44px minmax(0,1fr) 15px;grid-template-rows:auto auto;gap:0 9px;

</style>
</head>

      </svg>

<script>
/* Якщо застосунок не запустився, білий екран нічого не пояснює — ані
   тренеру, ані нам. Пишемо причину просто на екран: не завантажилась
   бібліотека, впав скрипт чи просто немає мережі. Коли React вималює
   застосунок, він замінить вміст #root — і цей блок зникне сам. */
(function(){
  var alive = function(){ return !!document.getElementById('boot'); };
  var shown = false;
  function fail(text){
    if (shown || !alive()) return;
    shown = true;
    document.getElementById('boot').className = 'boot boot-err';
    document.getElementById('bootNote').textContent = text;
  }
  window.addEventListener('error', function(e){
    var el = e.target;
    if (el && el !== window && el.tagName){
      /* шрифт чи картинка не доїхали — застосунок від цього працює */
      if (el.tagName !== 'SCRIPT') return;
      return fail('Не вдалося завантажити ' + (String(el.src || '').split('/')[2] || 'бібліотеку') +
                  '. Перевірте зв\'язок і оновіть сторінку.');
    }
    fail(String(e.message || 'Помилка') + ' · ' +
         String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0));
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    fail('Помилка: ' + String((r && r.message) || r));
  });
  setTimeout(function(){
    if (!alive()) return;
    if (!window.React) return fail('Бібліотека React не завантажилась. Перевірте зв\'язок і оновіть сторінку.');
    /* у зібраній версії Babel не завантажується взагалі — питаємо про
       нього лише тоді, коли сторінка справді його підключає */
    if (document.querySelector('script[src*="babel"]') && !window.Babel)
      return fail('Бібліотека Babel не завантажилась. Перевірте зв\'язок і оновіть сторінку.');
    document.getElementById('bootNote').textContent = 'Готуємо застосунок…';
  }, 8000);
})();
</script>

  ['Необов’язково. Поки порожньо — застосунок працює автономно', 'Необязательно. Пока пусто — приложение работает автономно', 'Optional. While empty, the app works offline', 'Opcjonalnie. Dopóki puste — aplikacja działa offline'],
  ['Проведіть перше тренування — і графік почне заповнюватись.', 'Проведите первую тренировку — и график начнёт заполняться.', 'Complete your first session and the chart will fill up.', 'Przeprowadź pierwszy trening — wykres zacznie się wypełniać.'],

  ['Ця сума підставлятиметься в кожне тренування з цим клієнтом', 'Эта сумма будет подставляться в каждую тренировку с этим клиентом', 'This amount will be prefilled for every session with this client', 'Ta kwota będzie wstawiana do każdego treningu z tym klientem'],
  ['Воно лишиться в історії як скасоване і не потрапить у дохід.', 'Она останется в истории как отменённая и не попадёт в доход.', 'It stays in history as cancelled and won’t count as income.', 'Zostanie w historii jako odwołany i nie wliczy się do dochodu.'],
  ['Відкрийте застосунок, щоб оновити нагадування на наступні дні', 'Откройте приложение, чтобы обновить напоминания на следующие дни', 'Open the app to refresh reminders for the coming days', 'Otwórz aplikację, aby odświeżyć przypomnienia na kolejne dni'],
  ['Оформіть абонемент клієнту з його картки або зі списку пакетів.', 'Оформите абонемент клиенту из его карточки или из списка пакетов.', 'Issue a package from a client’s card or from the packages list.', 'Wystaw karnet z karty klienta lub z listy pakietów.'],
  ['Такі клієнти з’являться на головній у блоці «Кому час написати»', 'Такие клиенты появятся на главной в блоке «Кому пора написать»', 'Such clients appear on the home screen under “Time to text”', 'Tacy klienci pojawią się na ekranie głównym w bloku „Czas napisać”'],
  ['Тренувань не заплановано. Гарний момент, щоб запросити клієнта.', 'Тренировок не запланировано. Хороший момент, чтобы пригласить клиента.', 'No sessions planned. A good moment to invite a client.', 'Brak zaplanowanych treningów. Dobry moment, żeby zaprosić klienta.'],
  ['Оплату ще не бачимо. Якщо ви платили — натисніть «Я вже оплатив»', 'Оплату пока не видим. Если вы платили — нажмите «Я уже оплатил»', 'We don’t see the payment yet. If you have paid, tap “I have already paid”', 'Nie widzimy jeszcze płatności. Jeśli zapłaciłeś — naciśnij „Już zapłaciłem”'],
  ['Підписка вже працює на іншому пристрої — звільніть місце на сайті', 'Подписка уже работает на другом устройстве — освободите место на сайте', 'The subscription is already in use on another device — free up a slot on the website', 'Subskrypcja działa już na innym urządzeniu — zwolnij miejsce na stronie'],
  ['Закріплена ціна цього клієнта — можна змінити для цього тренування', 'Закреплённая цена этого клиента — можно изменить для этой тренировки', 'This client’s pinned price — you can change it for this session', 'Przypisana cena tego klienta — można zmienić dla tego treningu'],
  ['Спочатку додайте товар — потім його можна буде продавати клієнтам.', 'Сначала добавьте товар — потом его можно будет продавать клиентам.', 'Add a product first — then you can sell it to clients.', 'Najpierw dodaj towar — potem będzie można go sprzedawać klientom.'],
  ['{name}, привіт! Нагадую про тренування {when} о {time}. Буду чекати!', '{name}, привет! Напоминаю о тренировке {when} в {time}. Буду ждать!', 'Hi {name}! A reminder about your session {when} at {time}. See you!', 'Cześć {name}! Przypominam o treningu {when} o {time}. Czekam!'],
  ['Нічого не надсилається на сервер, поки ви не увімкнете синхронізацію', 'Ничего не отправляется на сервер, пока вы не включите синхронизацию', 'Nothing is sent to a server until you turn on sync', 'Nic nie jest wysyłane na serwer, dopóki nie włączysz synchronizacji'],
  ['Підставлено ціну за замовчуванням — змініть, якщо сьогодні інша сума', 'Подставлена цена по умолчанию — измените, если сегодня другая сумма', 'Default price prefilled — change it if today’s amount differs', 'Wstawiono cenę domyślną — zmień, jeśli dziś inna kwota'],
  ['Тут з’являться нагадування про тренування, борги та залишки товарів.', 'Здесь появятся напоминания о тренировках, долгах и остатках товаров.', 'Reminders about sessions, debts and stock will appear here.', 'Tu pojawią się przypomnienia o treningach, długach i stanach towarów.'],
  ['{name}, доброго дня! Нагадую про оплату за тренування — {sum}. Дякую!', '{name}, добрый день! Напоминаю об оплате за тренировки — {sum}. Спасибо!', 'Hello {name}! A reminder about payment for your sessions — {sum}. Thank you!', 'Dzień dobry {name}! Przypominam o płatności za treningi — {sum}. Dziękuję!'],
  ['Копія містить клієнтів, тренування, продажі, абонементи й налаштування.', 'Копия содержит клиентов, тренировки, продажи, абонементы и настройки.', 'The backup contains clients, sessions, sales, packages and settings.', 'Kopia zawiera klientów, treningi, sprzedaż, karnety i ustawienia.'],
  ['{name}, доброго дня! Підтвердіть, будь ласка, тренування {when} о {time}.', '{name}, добрый день! Подтвердите, пожалуйста, тренировку {when} в {time}.', 'Hello {name}, could you confirm your session {when} at {time}?', 'Dzień dobry {name}! Proszę o potwierdzenie treningu {when} o {time}.'],
  ['Додайте першого клієнта — і зможете планувати тренування та рахувати дохід.', 'Добавьте первого клиента — и сможете планировать тренировки и считать доход.', 'Add your first client to plan sessions and count income.', 'Dodaj pierwszego klienta — będziesz planować treningi i liczyć dochód.'],
  ['Мінімум 4 символи. Знадобиться лише щоб відкрити кабінет на цьому пристрої.', 'Минимум 4 символа. Понадобится только чтобы открыть кабинет на этом устройстве.', 'At least 4 characters. Only needed to open the account on this device.', 'Minimum 4 znaki. Potrzebne tylko do otwarcia konta na tym urządzeniu.'],
  ['Дані на місці — нічого не втрачено. Спробуйте ще раз або оберіть інший план.', 'Данные на месте — ничего не потеряно. Попробуйте ещё раз или выберите другой план.', 'Your data is safe — nothing is lost. Try again or pick another plan.', 'Dane są bezpieczne — nic nie zginęło. Spróbuj ponownie lub wybierz inny plan.'],
  ['Додайте протеїн, шейкер чи резинки — застосунок рахуватиме залишок і прибуток.', 'Добавьте протеин, шейкер или резинки — приложение посчитает остаток и прибыль.', 'Add protein, a shaker or bands — the app will track stock and profit.', 'Dodaj odżywkę, shaker czy gumy — aplikacja policzy stan i zysk.'],
  ['Створіть перший пакет — далі його можна буде оформлювати клієнтам у два дотики.', 'Создайте первый пакет — дальше его можно будет оформлять клиентам в два касания.', 'Create your first package — then you can issue it to clients in two taps.', 'Utwórz pierwszy pakiet — potem wystawisz go klientom w dwa dotknięcia.'],
  ['Демо-режим: магазин ще не підключено, покупка імітується для перевірки сценарію.', 'Демо-режим: магазин ещё не подключён, покупка имитируется для проверки сценария.', 'Demo mode: the store isn’t connected yet, the purchase is simulated.', 'Tryb demo: sklep nie jest jeszcze podłączony, zakup jest symulowany.'],
  ['Кабінет прив’яжеться до вашої пошти — дані з демо залишаться на місці.', 'Кабинет привяжется к вашей почте — данные из демо останутся на месте.', 'The account is linked to your email — demo data stays put.', 'Konto zostanie powiązane z e-mailem — dane demo pozostaną.'],
  ['Повний доступ до всіх функцій. Оплата — тільки після завершення пробного періоду.', 'Полный доступ ко всем функциям. Оплата — только после окончания пробного периода.', 'Full access to everything. You pay only after the trial ends.', 'Pełny dostęp do wszystkich funkcji. Płatność dopiero po okresie próbnym.'],
  ['Ці числа підставлятимуться в кожне тренування. Змінити можна будь-коли в профілі.', 'Эти числа будут подставляться в каждую тренировку. Изменить можно когда угодно в профиле.', 'These numbers prefill every session. You can change them anytime in the profile.', 'Te liczby będą wstawiane do każdego treningu. Zmienisz je kiedykolwiek w profilu.'],
  ['Разом із ним зникнуть його тренування, продажі та нотатки. Дію не можна скасувати.', 'Вместе с ним исчезнут его тренировки, продажи и заметки. Действие нельзя отменить.', 'Their sessions, sales and notes will be deleted too. This can’t be undone.', 'Razem z nim znikną jego treningi, sprzedaż i notatki. Tej akcji nie można cofnąć.'],
  ['{name}, привіт! Підкажіть, коли зручно закрити оплату за минулі тренування ({sum})?', '{name}, привет! Подскажите, когда удобно закрыть оплату за прошлые тренировки ({sum})?', 'Hi {name}! When would it be convenient to settle payment for your past sessions ({sum})?', 'Cześć {name}! Kiedy będzie Ci wygodnie uregulować płatność za poprzednie treningi ({sum})?'],
  ['Пошта й пароль. На пошту прийде код, якщо пароль колись забудеться, — тому кабінет заводиться саме на неї.', 'Почта и пароль. На почту придёт код, если пароль когда-нибудь забудется, — поэтому кабинет заводится именно на неё.', 'Email and password. A code goes to that email if the password is ever forgotten — that is why the account is created with it.', 'E-mail i hasło. Na ten e-mail przyjdzie kod, jeśli hasło kiedyś się zapomni — dlatego konto zakłada się właśnie na niego.'],
  ['Записуйте ваги, самопочуття, побажання — усе, що знадобиться на наступному тренуванні.', 'Записывайте веса, самочувствие, пожелания — всё, что понадобится на следующей тренировке.', 'Note weights, how they felt, requests — anything useful for the next session.', 'Zapisuj ciężary, samopoczucie, życzenia — wszystko, co przyda się na kolejnym treningu.'],
  ['8 клієнтів, історія за 2 місяці, товари й абонементи. Все можна видалити одним дотиком.', '8 клиентов, история за 2 месяца, товары и абонементы. Всё можно удалить одним касанием.', '8 clients, 2 months of history, products and packages. All removable in one tap.', '8 klientów, historia z 2 miesięcy, towary i karnety. Wszystko usuniesz jednym dotknięciem.'],
  ['Нічого не спишеться автоматично: план ви оберете самі, коли пробний період завершиться.', 'Ничего не спишется автоматически: план вы выберете сами, когда пробный период закончится.', 'Nothing is charged automatically: you pick a plan yourself when the trial ends.', 'Nic nie zostanie pobrane automatycznie: plan wybierzesz sam, gdy okres próbny się skończy.'],
  ['Ніхто не зник з поля зору — у всіх активних клієнтів є свіжі тренування або запис наперед.', 'Никто не пропал из виду — у всех активных клиентов есть свежие тренировки или запись наперёд.', 'Nobody slipped away — every active client has a recent session or an upcoming booking.', 'Nikt nie zniknął z pola widzenia — wszyscy aktywni klienci mają świeże treningi lub zapis na przyszłość.'],
  ['Відкрив застосунок і за три секунди бачиш: скільки тренувань сьогодні і скільки ви заробили.', 'Открыл приложение и за три секунды видишь: сколько тренировок сегодня и сколько вы заработали.', 'Open the app and in three seconds you see how many sessions you have today and how much you earned.', 'Otwierasz aplikację i w trzy sekundy widzisz: ile masz dziś treningów i ile zarobiłeś.'],
  ['Оборот, відсоток залу і чисті — рахуються автоматично. Продажі товарів і абонементи теж тут.', 'Оборот, процент зала и чистыми — считаются автоматически. Продажи товаров и абонементы тоже здесь.', 'Turnover, the gym’s cut and your net — calculated automatically. Product sales and packages are here too.', 'Obrót, prowizja klubu i kwota netto — liczone automatycznie. Sprzedaż towarów i karnety też tutaj.'],
  ['Картка клієнта, історія, борги, абонементи й нагадування. Нове тренування — за кілька дотиків.', 'Карточка клиента, история, долги, абонементы и напоминания. Новая тренировка — за пару касаний.', 'A client card, history, debts, packages and reminders. A new session takes a few taps.', 'Karta klienta, historia, długi, karnety i przypomnienia. Nowy trening w kilka dotknięć.'],
  ['Усі ваші клієнти, тренування та фінансові дані збережені. Оберіть план, щоб продовжити роботу.', 'Все ваши клиенты, тренировки и финансовые данные сохранены. Выберите план, чтобы продолжить работу.', 'All your clients, sessions and financial data are saved. Choose a plan to keep working.', 'Wszyscy Twoi klienci, treningi i dane finansowe są zapisane. Wybierz plan, aby kontynuować pracę.'],
  ['Поточні дані буде замінено даними з копії. Якщо після копії щось змінювалось — ці зміни зникнуть.', 'Текущие данные будут заменены данными из копии. Если после копии что-то менялось — эти изменения исчезнут.', 'Current data will be replaced by the backup. Anything changed after the backup will be lost.', 'Bieżące dane zostaną zastąpione danymi z kopii. Zmiany po wykonaniu kopii przepadną.'],
  ['Створіть пакет — напр. 8 тренувань за 5 600 ₴. Кожне проведене тренування списується автоматично.', 'Создайте пакет — напр. 8 тренировок за 5 600 ₴. Каждая проведённая тренировка списывается автоматически.', 'Create a package — e.g. 8 sessions for 5,600 ₴. Each completed session is deducted automatically.', 'Utwórz pakiet — np. 8 treningów za 5 600 ₴. Każdy odbyty trening odlicza się automatycznie.'],
  ['Дані клієнтів, тренування та фінанси зберігаються незалежно від підписки — вони нікуди не зникають.', 'Данные клиентов, тренировки и финансы хранятся независимо от подписки — они никуда не исчезают.', 'Client data, sessions and finances are stored regardless of the subscription — nothing disappears.', 'Dane klientów, treningi i finanse są przechowywane niezależnie od subskrypcji — nic nie znika.'],
  ['{name}, доброго дня! Пропоную повернутись до тренувань — почнемо з легкого відновлювального. Коли зручно?', '{name}, добрый день! Предлагаю вернуться к тренировкам — начнём с лёгкой восстановительной. Когда удобно?', 'Hello {name}! How about getting back to training — we can start with an easy recovery session. When suits you?', 'Dzień dobry {name}! Proponuję wrócić do treningów — zaczniemy od lekkiego, regeneracyjnego. Kiedy Ci pasuje?'],
  ['Схоже, збережена база пошкоджена. Можна почати з чистого аркуша — або відновити з резервної копії пізніше.', 'Похоже, сохранённая база повреждена. Можно начать с чистого листа — или восстановить из резервной копии позже.', 'The saved database looks damaged. You can start fresh — or restore from a backup later.', 'Wygląda na to, że zapisana baza jest uszkodzona. Można zacząć od zera — albo później odtworzyć z kopii.'],
  ['Підписку оформлено на сайті: скасувати автопродовження можна там само, доступ діє до кінця оплаченого періоду.', 'Подписка оформлена на сайте: отменить автопродление можно там же, доступ действует до конца оплаченного периода.', 'The subscription was purchased on the website: turn off auto-renewal there; access lasts until the end of the paid period.', 'Subskrypcja została wykupiona na stronie: tam też wyłączysz automatyczne odnawianie, dostęp działa do końca opłaconego okresu.'],
  ['Клієнти, тренування, продажі та налаштування зникнуть із цього пристрою. Радимо спершу зберегти резервну копію.', 'Клиенты, тренировки, продажи и настройки исчезнут с этого устройства. Советуем сначала сохранить резервную копию.', 'Clients, sessions, sales and settings will be erased from this device. Save a backup first.', 'Klienci, treningi, sprzedaż i ustawienia znikną z tego urządzenia. Radzimy najpierw zapisać kopię.'],
  ['{name}, привіт! Давно вас не було в залі — усе гаразд? Є вільні місця на цьому тижні, можу поставити ваш звичний час.', '{name}, привет! Давно вас не было в зале — всё в порядке? На этой неделе есть свободные места, могу поставить ваше привычное время.', 'Hi {name}! Haven’t seen you at the gym for a while — all good? I have slots free this week and can keep your usual time.', 'Cześć {name}! Dawno Cię nie było na siłowni — wszystko w porządku? W tym tygodniu mam wolne terminy, mogę zarezerwować Twoją zwykłą godzinę.'],

const I18N = {uk:{}, ru:{}, en:{}, pl:{}};
PHRASES.forEach(([uk, ru, en, pl]) => {

let LANG = 'uk';
const _seen = new Map();               // ключ → український текст із місця виклику
function t(key, fallback){
  if (fallback !== undefined) _seen.set(key, fallback);
  const d = I18N[LANG] || {}, o = OVERRIDE[LANG] || {};
  const uk = fallback !== undefined ? fallback : OVERRIDE.uk[key];
  /* спершу точковий виняток за ключем, далі — переклад самого тексту:
     один ключ інколи стоїть у двох місцях з різними написами */
  return o[key] || (uk && d[uk]) || uk || key;
}
const I18n = {
  set(code){
    LANG = I18N[code] ? code : 'uk';
    if (typeof document !== 'undefined' && document.documentElement) document.documentElement.lang = LANG;
  },
  get(){ return LANG; },
  intl(){ return (LANGS.find(l => l.code === LANG) || LANGS[0]).intl; },
  /* рядки, яких бракує в мові — готовий скелет для перекладача */
  missing(code = LANG){
    const d = I18N[code] || {}, out = {};
    const o = OVERRIDE[code] || {};
    const put = (k, uk) => { if (uk && !d[uk] && !o[k]) out[uk] = ''; };
    Object.keys(OVERRIDE.uk).forEach(k => put(k, OVERRIDE.uk[k]));
    _seen.forEach((uk, k) => put(k, uk));
    return out;
  },
  gaps(code){ return Object.keys(I18n.missing(code)).length; },
};
window.__i18n = I18n;
/* Застосунок український: так він і відкривається вперше, незалежно від
   мови телефона. Інакше тренер із російськомовним телефоном бачить

I18n.set('uk');

/* ─────────────────── формати ─────────────────── */
const NBSP = ' ';
const CUR  = () => (Store.state && Store.state.settings.currency) || '₴';
const num = n => {
  const v = Math.round(Number(n) || 0);
  return String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
};
const money = (n, cur) => (Number(n) < 0 ? '−' : '') + num(n) + NBSP + (cur === false ? '' : CUR());
/* скорочуємо лише справді довгі суми, щоб в одному рядку не стояли
   «49k ₴» і «7 332 ₴» — це читається як помилка */
const moneyShort = n => {
  const v = Math.abs(Math.round(Number(n) || 0));
  if (v >= 1000000) return (v / 1000000).toFixed(1).replace('.0','') + 'M' + NBSP + CUR();
  if (v >= 100000)  return Math.round(v / 1000) + 'k' + NBSP + CUR();
  return money(n);
};
const pct = n => (n > 0 ? '+' : '') + (Math.abs(n) >= 10 ? Math.round(n) : Math.round(n * 10) / 10) + '%';

const DAY = 86400000;
const d0  = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
/* для сітки календаря: перше число потрібного місяця */
const addMonths = (d, n) => { const x = new Date(d); x.setDate(1); x.setMonth(x.getMonth() + n); return x; };
/* для строків підписки: те саме число наступного місяця (31-е → останнє) */
const addMonthsKeep = (d, n) => {
  const x = new Date(d), day = x.getDate();
  x.setDate(1); x.setMonth(x.getMonth() + n);
  x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate()));
  return x;
};
const sameDay = (a, b) => d0(a).getTime() === d0(b).getTime();
const iso = d => { const x = valid(d) || new Date(); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const valid = d => { const x = new Date(d); return isNaN(+x) ? null : x; };
/* биті або порожні дати не мають роняти екран */
const fmt = (d, o) => { const x = valid(d); return x ? new Intl.DateTimeFormat(I18n.intl(), o).format(x) : '—'; };
const fmtTime  = d => fmt(d, {hour:'2-digit', minute:'2-digit', hour12:false});
const fmtLong  = d => valid(d) ? cap(fmt(d, {weekday:'long'})) + ', ' + fmt(d, {day:'numeric', month:'long'}) : '—';
const fmtDM    = d => fmt(d, {day:'numeric', month:'long'});
const fmtDMs   = d => fmt(d, {day:'2-digit', month:'2-digit'});
const fmtMon   = d => cap(fmt(d, {month:'long', year:'numeric'}));
const fmtMonth = d => cap(fmt(d, {month:'long'}));
const fmtMonS  = d => cap(fmt(d, {month:'short'}));
const fmtDow   = d => cap(fmt(d, {weekday:'short'})).replace('.','');
const relDay = d => {
  if (!valid(d)) return '—';
  const n = d0(new Date()), x = d0(d), diff = Math.round((x - n) / DAY);
  if (diff === 0) return t('common.today');
  if (diff === 1) return t('common.tomorrow');
  if (diff === -1) return t('common.yesterday');
  return fmtDM(d);
};
/* Форми числа. Слов'янські мови мають три форми, англійська — дві;
   самі слова лежать у словнику як «одна|дві|п'ять». */
const PLURAL_IDX = {
  en: n => (n === 1 ? 0 : 1),
  other: n => {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return 2;
    if (b > 1 && b < 5) return 1;
    if (b === 1) return 0;
    return 2;
  },
};
const nOf = (n, key, uk) => {
  const forms = t(key, uk).split('|');
  const i = (PLURAL_IDX[LANG] || PLURAL_IDX.other)(n);
  return n + ' ' + (forms[i] || forms[forms.length - 1]);
};
/* «серпень», але «August»: у слов'янських мовах місяць пишеться з малої */
const monthWord = d => (LANG === 'en' ? fmtMonth(d) : fmtMonth(d).toLowerCase());
const nSessions = n => nOf(n, 'plural.sessions', 'тренування|тренування|тренувань');

const nDays     = n => nOf(n, 'plural.days',     'день|дні|днів');

/* {name}, {sum} тощо в перекладних рядках */
const fill = (s, v) => String(s).replace(/\{(\w+)\}/g, (_, k) => (v[k] !== undefined ? v[k] : ''));
const uid = p => (p || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const cx = (...a) => a.filter(Boolean).join(' ');

const hueOf = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return 228 + h % 62; };
const phoneMask = v => {
  const dg = String(v || '').replace(/\D/g,'').replace(/^380/, '').replace(/^0/, '').slice(0, 9);

};
/* логін — це або пошта, або номер: жодних кодів і підтверджень */
const isEmail = v => /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(String(v || '').trim());
const isPhone = v => String(v || '').replace(/\D/g,'').length >= 9;

const normLogin = v => {
  const s = String(v || '').trim();
  if (s.indexOf('@') > 0) return s.toLowerCase();
  const d = s.replace(/\D/g,'');
  if (!d) return s.toLowerCase();
  if (d.length === 9) return '380' + d;
  return d.replace(/^0/, '380');
};
const telHref = p => 'tel:' + String(p || '').replace(/[^\d+]/g,'');
const smsHref = (p, txt) => 'sms:' + String(p || '').replace(/[^\d+]/g,'') + '?&body=' + encodeURIComponent(txt || '');

/* ─────────────────── сховище ───────────────────
   Дані клієнтів — персональні, тому лишаються на пристрої. За бажанням
   тренера база шифрується AES-GCM ключем, похідним від PIN (PBKDF2).
   Без PIN у localStorage лежить лише шифротекст.                     */
const KEY = 'protrainer.v1';
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

const Vault = {
  key: null,                                   // CryptoKey живе лише в пам'яті
  async derive(pin, saltB64){
    const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    return {key, salt:b64(salt)};
  },
  async hash(pin, saltB64){
    const h = await crypto.subtle.digest('SHA-256', enc.encode(saltB64 + '|' + pin));
    return b64(h);
  },
  /* Ключ для копії на сервері.

     Спершу цей ключ виводився з пароля напряму. Виходило коротко, але
     жорстоко: забутий пароль означав, що копію не відкрити нікому, і
     тренер разом із паролем втрачав усю базу клієнтів. Для робочого
     інструмента це надто дорога ціна за красиву властивість.

     Тепер ключ копії (K) випадковий, а пароль — лише замок на ньому:
     на сервері поруч із копією лежить wrap — той самий K, зашифрований
     ключем із пароля. Пароль змінюється — змінюється тільки замок, сама
     копія лишається на місці. Це ж дає й відновлення: якщо тренер не
     вимкнув його, K зберігається в нас окремо і видається після коду з
     пошти.

     token — SHA-256 від ключа з пароля; ним пристрій доводить серверу,
     що пароль знає. Сам пароль і сам K туди не їдуть (окрім згаданого
     відновлення, і тільки якщо тренер його лишив увімкненим).

     have: нічого → новий випадковий K; {raw} → взяти готовий;
           {wrap} → відкрити наявний паролем (кине, якщо пароль не той). */
  async cloud(pass, saltB64, have){
    const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const pk = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
    const pkRaw = b64(await crypto.subtle.exportKey('raw', pk));
    const token = b64(await crypto.subtle.digest('SHA-256', unb64(pkRaw)));

    const raw = have && have.raw ? have.raw
              : have && have.wrap ? await Vault.decryptWith(pk, have.wrap.iv, have.wrap.ct)
              : b64(crypto.getRandomValues(new Uint8Array(32)));
    const wrap = (have && have.wrap) || await Vault.encryptWith(pk, raw);
    /* pkRaw віддаємо, щоб не виводити ключ із пароля двічі: 150 000
       ітерацій на телефоні коштують помітних часток секунди, а замок
       приходить із сервера вже після того, як token обчислено. */
    return {key: await Vault.importRaw(raw), raw, token, salt: b64(salt), wrap, pkRaw};
  },
  /* відкрити замок уже виведеним ключем із пароля */
  async unwrap(pkRaw, wrap){
    return Vault.decryptWith(await Vault.importRaw(pkRaw), wrap.iv, wrap.ct);
  },
  async importRaw(rawB64){
    return crypto.subtle.importKey('raw', unb64(rawB64), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
  },
  async encryptWith(key, text){
    const ivb = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv:ivb}, key, enc.encode(text));
    return {iv:b64(ivb), ct:b64(ct)};
  },
  async decryptWith(key, iv, ct){
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(iv)}, key, unb64(ct));
    return dec.decode(pt);
  },
  async encrypt(text){
    const ivb = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv:ivb}, Vault.key, enc.encode(text));
    return {iv:b64(ivb), ct:b64(ct)};
  },
  async decrypt(iv, ct){
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(iv)}, Vault.key, unb64(ct));
    return dec.decode(pt);
  },
};

const BACKUP_KEY = KEY + '.backup';

/* ─── сховище ───
   localStorage у WebView система може очистити, коли на пристрої бракує
   місця, — тобто тренер ризикує втратити клієнтів. Тому все пишеться і в
   localStorage, і в нативне сховище (@capacitor/preferences), а читається
   з пам'яті, яку ми наповнюємо на старті. Синхронний API лишається таким
   самим, тож решта коду не змінюється.                                  */
const Box = {
  cache: new Map(),
  plugin(){
    return (typeof window !== 'undefined' && window.Capacitor && window.Capacitor.Plugins
      && window.Capacitor.Plugins.Preferences) || null;
  },
  native(){ return !!Box.plugin(); },
  ls(k){ try { return localStorage.getItem(k); } catch { return null; } },
  /* читаємо обидва сховища; нативне головніше, бо переживає очищення WebView */
  async hydrate(keys){
    const P = Box.plugin();
    for (const k of keys){
      let v = null;
      if (P){ try { v = (await P.get({key: k})).value; } catch {} }
      if (v == null) v = Box.ls(k);
      if (v != null){
        Box.cache.set(k, v);
        if (P && Box.ls(k) !== v){ try { localStorage.setItem(k, v); } catch {} }   /* повертаємо копію у WebView */
      }
    }
  },
  get(k){ return Box.cache.has(k) ? Box.cache.get(k) : Box.ls(k); },
  /* другу вкладку або відновлення ззовні помічаємо через подію storage */
  listening: false,
  listen(){
    if (typeof window === 'undefined' || Box.listening || !window.addEventListener) return;
    Box.listening = true;
    window.addEventListener('storage', e => {
      if (!e || !e.key || !Box.cache.has(e.key)) return;
      Box.cache.set(e.key, e.newValue);
      if (e.key === META_KEY) Access.emit();          /* доступ міг змінитись */
    });
  },
  set(k, v){
    Box.cache.set(k, v);
    let ok = true;
    try { localStorage.setItem(k, v); } catch { ok = false; }
    const P = Box.plugin();
    if (P) { P.set({key: k, value: v}).catch(() => {}); ok = true; }               /* нативне сховище без квоти */
    return ok;
  },
  remove(k){
    Box.cache.delete(k);
    try { localStorage.removeItem(k); } catch {}
    const P = Box.plugin();
    if (P) P.remove({key: k}).catch(() => {});
  },
};
/* Резервна копія — знімок бази поруч з робочими даними плюс файл на вимогу.
   Автоматична копія робиться раз на добу, коли застосунок відкритий. */
const Backups = {
  make(){
    const ok = Box.set(BACKUP_KEY, JSON.stringify({ts: Date.now(), db: Store.state}));
    if (ok) Act.markBackup();
    return ok;
  },
  read(){ try { return JSON.parse(Box.get(BACKUP_KEY) || 'null'); } catch { return null; } },
  file(){
    return Files.save('protrainer-' + iso(new Date()) + '.json',
      'application/json', JSON.stringify(Store.state, null, 2));
  },
};

const META_KEY = KEY + '.meta';
const Disk = {
  hydrate(){ Box.listen(); return Box.hydrate([KEY, META_KEY, BACKUP_KEY, DEMO_IAP_KEY]); },
  readMeta(){ try { return JSON.parse(Box.get(META_KEY) || 'null'); } catch { return null; } },
  writeMeta(m){ Box.set(META_KEY, JSON.stringify(m)); },
  readRaw(){ return Box.get(KEY); },
  writeRaw(s){ return Box.set(KEY, s); },
  /* дані стираємо, а акаунт і пробний період лишаємо: інакше очищення
     даних дало б новий безкоштовний період */
  clear(){
    const m = Disk.readMeta() || {};
    Box.remove(KEY);
    Box.set(META_KEY, JSON.stringify({salt: m.salt, account: m.account, access: m.access, device: m.device}));
  },
  /* Вихід — не стирання: акаунт і дані на місці, просто наступного разу
     застосунок спитає логін. Позначку знімає вдалий вхід. */
  signOut(){ const m = Disk.readMeta() || {}; Disk.writeMeta({...m, signedOut: true}); },
  signedOut(){ return !!(Disk.readMeta() || {}).signedOut; },
  signIn(){ const m = Disk.readMeta() || {}; delete m.signedOut; Disk.writeMeta(m); },
};

/* ─────────────────── віддати файл ───────────────────
   У браузері файл забирає посилання з download. У нативній оболонці таке
   посилання нікуди не веде: там файл треба покласти на диск і відкрити
   системний «Поділитися» — інакше тренер натискає «Зберегти» і нічого
   не відбувається. Обидва шляхи ховаємо сюди, щоб не дублювати їх у
   резервній копії та в експорті.                                      */
const Files = {
  plugins(){
    const C = typeof window !== 'undefined' && window.Capacitor;
    const P = C && C.Plugins;
    return P && P.Filesystem && P.Share ? P : null;
  },
  async save(name, mime, text){
    const P = Files.plugins();
    if (P){
      try {
        const r = await P.Filesystem.writeFile({path: name, data: text, directory: 'CACHE', encoding: 'utf8'});
        await P.Share.share({title: name, url: r.uri});
        return true;
      } catch { /* нижче спробуємо як у браузері */ }
    }
    try {
      const blob = new Blob([text], {type: mime + ';charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      return true;
    } catch { return false; }
  },
};

/* ─────────────────── фото клієнтів ───────────────────
   Знімок із телефона важить 3–5 МБ, а в базі він лежав би цілком, ще й
   у base64 (+37%). Квота localStorage — 5 МБ на весь кабінет, тож двох
   фото досить, щоб база перестала зберігатись, і тренер втратив би день
   роботи, не зрозумівши чому. Аватар ніде не більший за 92 px, тому 384 px
   вистачає навіть на екран із потрійною щільністю: 4 МБ → 20–40 КБ.     */
const PHOTO = {
  side: 384,                 /* сторона квадрата, більше не потрібно */
  budget: 40 * 1024,         /* стеля довжини dataURL, символів */
  q: [0.72, 0.6, 0.5, 0.42], /* якість: знижуємо, поки не влізе в стелю */
  limit: 12 * 1024 * 1024,   /* більший файл навіть не декодуємо */
};

const Photo = {
  /* EXIF-поворот: createImageBitmap уміє його враховувати, <img> — не всюди.
     Але декодування там позаекранне і в деяких WebView просто не відповідає —
     тоді фото мовчки не з'явилось би. Тому чекаємо обмежений час і падаємо
     на <img>: краще знімок без урахування EXIF, ніж без знімка. */
  async decode(src){
    if (src instanceof Blob && typeof createImageBitmap === 'function'){
      try {
        const bmp = await Promise.race([
          createImageBitmap(src, {imageOrientation: 'from-image'}),
          new Promise(res => setTimeout(() => res(null), 4000)),
        ]);
        if (bmp) return bmp;
      } catch {}
    }
    const url = src instanceof Blob ? URL.createObjectURL(src) : src;
    try {
      return await new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = () => rej(new Error('decode'));
        img.src = url;
      });
    } finally { if (src instanceof Blob) URL.revokeObjectURL(url); }
  },
  /* квадрат по центру: аватар усе одно круглий, поля були б зайвою вагою */
  crop(img){
    const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
    if (!w || !h) throw new Error('empty');
    const side = Math.max(1, Math.min(PHOTO.side, w, h));
    const c = document.createElement('canvas');
    c.width = c.height = side;
    const k = Math.max(side / w, side / h);
    c.getContext('2d').drawImage(img, (side - w * k) / 2, (side - h * k) / 2, w * k, h * k);
    if (img.close) img.close();
    return c;
  },
  shrink(img){
    const c = Photo.crop(img);
    let out = '';
    for (const q of PHOTO.q){
      out = c.toDataURL('image/jpeg', q);
      if (out.length <= PHOTO.budget) break;
    }
    if (!out || out.indexOf('data:image') !== 0) throw new Error('encode');
    return out;
  },
  async fromFile(file){
    if (!file || (file.type && file.type.indexOf('image/') !== 0)) throw new Error('type');
    if (file.size > PHOTO.limit) throw new Error('big');
    return Photo.shrink(await Photo.decode(file));
  },
  async fromUrl(url){ return Photo.shrink(await Photo.decode(url)); },
  /* фото, збережені попередніми версіями, лежать нестиснутими: один раз
     проходимось по них уже після старту, щоб не тримати екран */
  async shrinkStored(){
    const db = Store.state;
    if (!db || !db.clients) return 0;
    const heavy = db.clients.filter(c => c.photo && c.photo.length > PHOTO.budget * 1.5);
    const big = db.profile && db.profile.photo && db.profile.photo.length > PHOTO.budget * 1.5;
    if (!heavy.length && !big) return 0;
    const small = new Map();
    for (const c of heavy){
      try { small.set(c.id, await Photo.fromUrl(c.photo)); } catch {}
    }
    let prof = null;
    if (big){ try { prof = await Photo.fromUrl(db.profile.photo); } catch {} }
    if (!small.size && !prof) return 0;
    Store.patch(d => ({...d,
      clients: d.clients.map(c => (small.has(c.id) ? {...c, photo: small.get(c.id)} : c)),
      profile: prof ? {...d.profile, photo: prof} : d.profile}));
    return small.size + (prof ? 1 : 0);
  },
};

/* ─────────────────── синхронізація ───────────────────
   Локально-перше сховище: кожна зміна лягає в чергу outbox і чекає
   мережі. Поки ендпойнт не заданий — застосунок працює автономно,
   черга просто накопичує зміни (і показує це у профілі).            */
const Sync = {
  outbox: [],
  status: 'local',                              // local | queued | syncing | ok | error
  listeners: new Set(),
  endpoint(){ return (Store.state && Store.state.settings.syncUrl) || ''; },
  push(op, payload){
    Sync.outbox.push({id:uid('op'), op, payload, ts:Date.now()});
    if (Sync.outbox.length > 500) Sync.outbox.splice(0, Sync.outbox.length - 500);
    Sync.status = Sync.endpoint() ? (navigator.onLine ? 'queued' : 'local') : 'local';
    Sync.emit();
    if (Sync.endpoint() && navigator.onLine) Sync.flush();
  },
  emit(){ Sync.listeners.forEach(f => f(Sync.status, Sync.outbox.length)); },
  async flush(){
    const url = Sync.endpoint();
    if (!url || !Sync.outbox.length || Sync.status === 'syncing') return;
    Sync.status = 'syncing'; Sync.emit();
    const batch = Sync.outbox.slice(0, 100);
    try {
      const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({device: Store.state.device, ops: batch})});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      Sync.outbox = Sync.outbox.slice(batch.length);
      Sync.status = Sync.outbox.length ? 'queued' : 'ok';
      Store.patch(db => ({...db, syncedAt: Date.now()}));
    } catch (e) {
      Sync.status = 'error';                    // черга лишається — спробуємо пізніше
    }
    Sync.emit();
  },
};
window.addEventListener('online', () => Sync.flush());

/* ─── міст до магазину ───
   Реальні покупки живуть у нативній оболонці: StoreKit 2 (iOS) або
   Play Billing (Android). Оболонка має покласти у window.ProTrainerIAP
