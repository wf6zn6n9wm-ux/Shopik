<!doctype html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" id="metaTheme" />
<meta name="description" content="PRO Trainer — робочий кабінет персонального тренера: клієнти, розклад, гроші, продажі." />
<title>PRO Trainer — кабінет персонального тренера</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Onest:wght@500;600;700;800&display=swap" rel="stylesheet">

<!-- ==================================================================
     PRO TRAINER · DESIGN SYSTEM (v1)
     ------------------------------------------------------------------
     Робочий кабінет персонального тренера. Не фітнес-трекер: клієнти,
     розклад, гроші, продажі — в одному місці. Відчуття продукту рівня
     хорошого банківського застосунку.

     ТЕМИ     Light (білий фон, світло-сірі картки) і Dark (майже чорний
              графіт, темно-сірі картки). Єдина система токенів: різні
              лише значення, назви й ролі однакові.
     АКЦЕНТ   Iris / Purple. Колір лише там, де він допомагає читати
              інформацію: гроші, статус, дія.
     ТИПО     Onest (дисплей, великі числа) + Manrope (UI), tabular-nums.
     РАДІУСИ  12 / 16 / 20 / 26 / 999
     СІТКА    4pt, великі відступи 18–22px, оболонка 480px
     РУХ      тільки transform/opacity, ease-out, 160–420ms
     ================================================================== -->
<style>
  :root{
    /* ── акцент: спільний для обох тем ── */
    --accent:#6B4DFF; --accent-2:#8B6BFF; --accent-3:#5636E8;
    --accent-ink:#ffffff;
    --pos:#12B76A; --warn:#F79009; --neg:#F04438; --info:#3B9DF8;

    /* ── геометрія ── */
    --r-xs:10px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
    --shell:480px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --nav-h:64px;
    --ease:cubic-bezier(.16,1,.3,1);
  }

  /* ── LIGHT ── */
  :root, html[data-theme="light"]{
    --bg:#F5F5F9; --bg-2:#FFFFFF;
    --surface:#FFFFFF; --surface-2:#F1F1F6; --surface-3:#E9E9F1;
    --ink:#12121A; --ink-2:#5A5A6B; --ink-3:#8C8C9C; --ink-4:#B4B4C2;
    --line:#EAEAF1; --line-2:#DEDEE8;
    --accent-soft:rgba(107,77,255,.09); --accent-soft-2:rgba(107,77,255,.16);
    --pos-soft:rgba(18,183,106,.12); --warn-soft:rgba(247,144,9,.12); --neg-soft:rgba(240,68,56,.10);
    --hero-1:#7A5BFF; --hero-2:#5B37F0; --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.78);
    --shadow-1:0 2px 8px -4px rgba(20,20,45,.10);
    --shadow-2:0 12px 30px -18px rgba(20,20,45,.28);
    --shadow-3:0 22px 50px -28px rgba(56,32,160,.45);
    --skeleton:linear-gradient(90deg,#EDEDF4 25%,#F6F6FA 50%,#EDEDF4 75%);
    --scrim:rgba(18,18,30,.34);
  }
  /* ── DARK ── */
  html[data-theme="dark"]{
    --bg:#08080B; --bg-2:#0E0E13;
    --surface:#15151C; --surface-2:#1C1C25; --surface-3:#24242F;
    --ink:#F5F5F8; --ink-2:#9E9EAF; --ink-3:#71717F; --ink-4:#4C4C58;
    --line:#23232C; --line-2:#2E2E39;
    --accent-soft:rgba(123,92,255,.16); --accent-soft-2:rgba(123,92,255,.26);
    --pos-soft:rgba(18,183,106,.16); --warn-soft:rgba(247,144,9,.16); --neg-soft:rgba(240,68,56,.16);
    --hero-1:#3B2B8F; --hero-2:#241A63; --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.72);
    --shadow-1:0 2px 8px -4px rgba(0,0,0,.6);
    --shadow-2:0 14px 34px -20px rgba(0,0,0,.85);
    --shadow-3:0 22px 50px -28px rgba(0,0,0,.9);
    --skeleton:linear-gradient(90deg,#1B1B23 25%,#23232D 50%,#1B1B23 75%);
    --scrim:rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    color:var(--ink);
    font-family:'Manrope',ui-sans-serif,-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    font-size:15px; line-height:1.42;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow-x:hidden;
    transition:background-color .28s var(--ease), color .28s var(--ease);
  }
  #root{max-width:var(--shell);margin-inline:auto;min-height:100vh;position:relative;isolation:isolate;
    background:var(--bg);overflow-x:hidden;}
  .sechead > .h2{min-width:0;}
  .sechead .link{flex:none;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  button{border:0;background:none;cursor:pointer;padding:0;}
  a{color:var(--accent);text-decoration:none;}
  ::-webkit-scrollbar{width:0;height:0;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.02em;}
  .dsp{font-family:'Onest',ui-sans-serif,sans-serif;letter-spacing:-.03em;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ══════════ оболонка ══════════ */
  .app{min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 80px);}
  .screen{padding:0 18px 18px;animation:screenIn .34s var(--ease);}
  @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .appbar{position:sticky;top:0;z-index:30;padding:calc(var(--safe-top) + 12px) 18px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(180deg,var(--bg) 72%,transparent);backdrop-filter:blur(10px);}
  .appbar .title{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .iconbtn{width:42px;height:42px;border-radius:var(--r-sm);display:grid;place-items:center;
    color:var(--ink);position:relative;transition:transform .16s var(--ease),background .16s;}
  .iconbtn:active{transform:scale(.92);}
  .iconbtn.boxed{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);}
  .iconbtn .bell-dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);border:2px solid var(--bg);}

  .h1{font-family:'Onest',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.035em;margin:2px 0 2px;}
  .h1-sub{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:-.01em;}
  .h2{font-size:17px;font-weight:800;letter-spacing:-.025em;}
  .muted{color:var(--ink-2);}
  .mute3{color:var(--ink-3);}
  .sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 2px 12px;}
  .sechead .link{color:var(--accent);font-weight:700;font-size:13.5px;}
  .sechead.tight{margin-top:18px;}

  /* ══════════ картки ══════════ */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow-1);position:relative;}
  .card.flat{box-shadow:none;}
  .card.pad{padding:16px;}
  .press{transition:transform .16s var(--ease);}
  .press:active{transform:scale(.985);}

  /* hero — дохід */
  .hero{border-radius:var(--r-xl);padding:18px 18px 16px;color:var(--hero-ink);position:relative;overflow:hidden;
    background:linear-gradient(140deg,var(--hero-1),var(--hero-2));box-shadow:var(--shadow-3);
    border:1px solid rgba(255,255,255,.08);}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.16),transparent 55%);}
  .hero .lbl{font-size:13.5px;font-weight:600;color:var(--hero-sub);}
  .hero .val{font-family:'Onest',sans-serif;font-size:38px;font-weight:800;letter-spacing:-.04em;margin:6px 0 2px;line-height:1.05;}
  .hero .sub{font-size:13px;color:var(--hero-sub);font-weight:600;}
  .hero .delta{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.16);font-size:12.5px;font-weight:800;}
  .hero .delta.pos{color:#8AF0BE;} .hero .delta.neg{color:#FFB4AE;}
  .hero .spark{position:absolute;right:16px;bottom:14px;display:flex;align-items:flex-end;gap:5px;height:56px;}
  .hero .spark i{width:8px;border-radius:4px;background:rgba(255,255,255,.34);display:block;
    animation:sparkIn .5s var(--ease) both;}
  .hero .spark i.on{background:rgba(255,255,255,.92);}
  @keyframes sparkIn{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}

  /* три метрики */
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 11px 11px;
    box-shadow:var(--shadow-1);min-width:0;overflow:hidden;}
  .kpi .k{font-size:12px;color:var(--ink-2);font-weight:600;}
  .kpi .v{font-family:'Onest',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.04em;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .ic{margin-top:9px;color:var(--accent);opacity:.9;}

  /* ══════════ рядки списку ══════════ */
  .rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-1);}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;
    border-top:1px solid var(--line);transition:background .16s;}
  .rows .row:first-child{border-top:0;}
  .row:active{background:var(--surface-2);}
  .row .nm{font-weight:700;font-size:14.5px;letter-spacing:-.01em;}
  .row .ds{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .tm{font-family:'Onest',sans-serif;font-weight:700;font-size:15px;color:var(--accent);letter-spacing:-.03em;min-width:48px;}
  .chev{color:var(--ink-4);flex:none;}
  .dot-st{width:9px;height:9px;border-radius:50%;flex:none;}

  /* аватар */
  .av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;
    font-family:'Onest',sans-serif;letter-spacing:-.02em;overflow:hidden;background-size:cover;background-position:center;}
  .av.ring{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent-soft-2);}

  /* ══════════ кнопки ══════════ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;
    border-radius:var(--r-md);font-weight:800;font-size:15px;letter-spacing:-.01em;
    transition:transform .16s var(--ease),opacity .16s,background .16s;}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -14px var(--accent);}
  .btn.sec{background:var(--surface-2);color:var(--ink);}
  .btn.ghost{background:transparent;color:var(--accent);}
  .btn.soft{background:var(--accent-soft);color:var(--accent);}
  .btn.danger{background:var(--neg-soft);color:var(--neg);}
  .btn.wide{width:100%;}
  .btn.sm{height:40px;font-size:13.5px;padding:0 14px;border-radius:var(--r-sm);}
  .btn.lg{height:56px;font-size:16px;border-radius:var(--r-lg);}

  .fab{position:fixed;right:calc(50% - min(50vw,var(--shell)/2) + 18px);
    bottom:calc(var(--nav-h) + var(--safe-bottom) + 18px);z-index:35;
    width:56px;height:56px;border-radius:20px;display:grid;place-items:center;
    background:var(--accent);color:#fff;box-shadow:0 16px 32px -14px var(--accent);
    transition:transform .18s var(--ease);}
  .fab:active{transform:scale(.9) rotate(45deg);}

  /* чіпи / таби */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;}
  .chip{flex:none;height:36px;padding:0 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;
    background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:13px;transition:.16s;}
  .chip.on{background:var(--accent);color:#fff;}
  .chip.soft.on{background:var(--accent-soft);color:var(--accent);}

  .segm{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:4px;gap:4px;}
  .segm button{flex:1;height:36px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink-2);transition:.18s var(--ease);}
  .segm button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);}
  html[data-theme="dark"] .segm button.on{background:var(--surface-3);}

  .tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:6px;}
  .tabs button{padding:12px 0 11px;font-weight:700;font-size:14.5px;color:var(--ink-3);position:relative;}
  .tabs button.on{color:var(--ink);}
  .tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:var(--accent);}

  .badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;
    font-size:11.5px;font-weight:800;letter-spacing:.01em;}
  .badge.pos{background:var(--pos-soft);color:var(--pos);}
  .badge.warn{background:var(--warn-soft);color:var(--warn);}
  .badge.neg{background:var(--neg-soft);color:var(--neg);}
  .badge.acc{background:var(--accent-soft);color:var(--accent);}
  .badge.mut{background:var(--surface-2);color:var(--ink-2);}

  /* ══════════ поля ══════════ */
  .field{margin-top:14px;}
  .field > label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 2px 7px;}
  .inp{width:100%;height:52px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);
    padding:0 14px;font-weight:600;font-size:15.5px;color:var(--ink);outline:none;transition:.16s;}
  .inp::placeholder{color:var(--ink-4);font-weight:500;}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft);}
  textarea.inp{height:auto;min-height:104px;padding:13px 14px;line-height:1.45;resize:vertical;}
  .inp.err{border-color:var(--neg);box-shadow:0 0 0 3.5px var(--neg-soft);}
  .field .hint{font-size:12px;color:var(--ink-3);margin:6px 2px 0;}
  .field .hint.bad{color:var(--neg);}
  .inp-wrap{position:relative;}
  .inp-wrap .suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:700;}
  .inp-wrap .lead{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);}
  .inp-wrap.lead-pad .inp{padding-left:42px;}

  .search{position:relative;}
  .search .inp{padding-left:42px;height:48px;background:var(--surface-2);border-color:transparent;}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);}

  .switch{width:50px;height:30px;border-radius:999px;background:var(--surface-3);position:relative;transition:.2s var(--ease);flex:none;}
  .switch.on{background:var(--accent);}
  .switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
    transition:.2s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .switch.on i{left:23px;}

  .setrow{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;border-top:1px solid var(--line);}
  .rows .setrow:first-child{border-top:0;}
  .setrow .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none;}
  .setrow .tx{flex:1;min-width:0;}
  .setrow .tx b{font-weight:700;font-size:14.5px;display:block;}
  .setrow .tx span{font-size:12.5px;color:var(--ink-2);}
  .setrow .rt{color:var(--ink-3);font-weight:700;font-size:13.5px;}

  /* ══════════ шторки / модалки ══════════ */
  .scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);backdrop-filter:blur(2px);
    animation:fade .22s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--shell));z-index:61;
    background:var(--bg-2);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--safe-bottom));
    box-shadow:0 -20px 50px -30px rgba(0,0,0,.5);animation:sheetIn .34s var(--ease) both;
    max-height:92vh;overflow-y:auto;border-top:1px solid var(--line);}
  @keyframes sheetIn{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
  .grip{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:2px auto 12px;}
  .sheet h3{font-family:'Onest',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px;}

  .page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
    max-width:var(--shell);margin-inline:auto;animation:pageIn .3s var(--ease) both;
    padding-bottom:calc(24px + var(--safe-bottom));}
  @keyframes pageIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
  .page .appbar{background:linear-gradient(180deg,var(--bg) 74%,transparent);}

  /* ══════════ нижня навігація ══════════ */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--shell));z-index:40;
    height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);
    display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
    background:color-mix(in srgb,var(--bg-2) 88%,transparent);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);}
  .nav button{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    color:var(--ink-3);font-size:10.5px;font-weight:700;transition:color .18s;}
  .nav button.on{color:var(--accent);}
  .nav button svg{transition:transform .22s var(--ease);}
  .nav button.on svg{transform:translateY(-1px) scale(1.06);}

  /* ══════════ календар ══════════ */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding:6px 0;}
  .cal-day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-weight:700;font-size:14px;color:var(--ink);transition:.16s;}
  .cal-day.out{color:var(--ink-4);}
  .cal-day.today{color:var(--accent);}
  .cal-day.on{background:var(--accent);color:#fff;}
  .cal-day.rng{background:var(--accent-soft);border-radius:0;color:var(--ink);}
  .cal-day.rng.a{border-radius:12px 0 0 12px;}
  .cal-day.rng.b{border-radius:0 12px 12px 0;}
  .cal-day.edge{background:var(--accent);color:#fff;border-radius:12px;}
  .cal-day.edge .pips i{background:#fff;}
  .cal-day .pips{display:flex;gap:2px;height:4px;}
  .cal-day .pips i{width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .cal-day.on .pips i{background:#fff;}
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .week-day{border-radius:14px;padding:9px 0;text-align:center;background:var(--surface);border:1px solid var(--line);transition:.16s;}
  .week-day .wd{font-size:10.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;}

  .week-day.on .wd{color:rgba(255,255,255,.8);}
  .week-day .cnt{height:4px;margin-top:5px;display:flex;justify-content:center;gap:2px;}
  .week-day .cnt i{width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .week-day.on .cnt i{background:#fff;}

  .tl{position:relative;padding-left:56px;}
  .tl .hr{position:relative;min-height:56px;border-top:1px dashed var(--line-2);}
  .tl .hr > .lab{position:absolute;left:-56px;top:-9px;width:46px;text-align:right;font-size:11.5px;font-weight:700;color:var(--ink-3);}
  .ev{border-radius:14px;padding:9px 12px;margin:4px 0;border-left:3px solid var(--accent);
    background:var(--accent-soft);color:var(--ink);}
  .ev b{font-size:13.5px;font-weight:800;display:block;}
  .ev span{font-size:12px;color:var(--ink-2);}
  .ev.t1{border-left-color:var(--accent);background:var(--accent-soft);}
  .ev.t2{border-left-color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 12%,transparent);}
  .ev.t3{border-left-color:var(--accent-3);background:color-mix(in srgb,var(--accent-3) 12%,transparent);}
  .ev.done{opacity:.62;}
  .ev.canceled{opacity:.5;text-decoration:line-through;}
  .ev.noshow{opacity:.72;border-left-style:dashed;border-left-color:var(--neg);background:var(--neg-soft);}
  .ev .go{flex:none;height:30px;padding:0 10px;border-radius:9px;background:var(--accent);color:#fff;
    font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:5px;}

  /* ══════════ графіки ══════════ */
  .chart{width:100%;display:block;overflow:visible;}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;}
  .bars .b{flex:1;border-radius:6px 6px 4px 4px;background:var(--accent-soft-2);position:relative;transition:.3s var(--ease);}
  .bars .b.on{background:var(--accent);}
  .bars .b span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink-3);font-weight:700;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;}
  .legend span{font-size:12.5px;color:var(--ink-2);font-weight:600;}

  /* ══════════ стани ══════════ */
  .empty{text-align:center;padding:34px 20px;}
  .empty .ic{width:74px;height:74px;border-radius:24px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;margin:0 auto 14px;}
  .empty b{display:block;font-family:'Onest',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.02em;}
  .empty p{color:var(--ink-2);font-size:13.5px;margin:6px auto 16px;max-width:280px;}

  .sk{border-radius:12px;background:var(--skeleton);background-size:200% 100%;animation:sh 1.25s linear infinite;}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

  .toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);
    z-index:80;width:min(100% - 32px,var(--shell) - 32px);display:flex;flex-direction:column;gap:8px;pointer-events:none;}
  .toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:13px 15px;font-weight:700;font-size:13.5px;
    box-shadow:var(--shadow-2);display:flex;align-items:center;gap:10px;animation:toastIn .3s var(--ease) both;}
  .toast.ok{background:var(--pos);color:#fff;} .toast.bad{background:var(--neg);color:#fff;}
  @keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* тарифи */
  .plan{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;
    border-radius:var(--r-lg);background:var(--surface);border:1.5px solid var(--line);
    transition:.16s var(--ease);}

    display:grid;place-items:center;}
  .plan.on .radio{border-color:var(--accent);}
  .plan.on .radio i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:block;}
  .plan .pr{font-family:'Onest',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.03em;}
  .feat{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14.5px;font-weight:600;}
  .feat .ok{width:22px;height:22px;border-radius:50%;background:var(--pos-soft);color:var(--pos);
    display:grid;place-items:center;flex:none;}

  /* онбординг / авторизація */
  .ob{min-height:100vh;display:flex;flex-direction:column;padding:calc(var(--safe-top) + 20px) 22px calc(22px + var(--safe-bottom));}
  .ob-art{flex:1;display:grid;place-items:center;padding:14px 0;}
  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
  .dots i{width:7px;height:7px;border-radius:4px;background:var(--line-2);transition:.24s var(--ease);}
  .dots i.on{width:22px;background:var(--accent);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--accent-2),var(--accent-3));
    display:grid;place-items:center;color:#fff;box-shadow:0 10px 22px -12px var(--accent);}
  .brand b{font-family:'Onest',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.03em;}

  .pin-dots{display:flex;gap:14px;justify-content:center;margin:22px 0 8px;}
  .pin-dots i{width:14px;height:14px;border-radius:50%;background:var(--surface-3);transition:.18s var(--ease);}
  .pin-dots i.on{background:var(--accent);transform:scale(1.12);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;}
  .keypad button{height:62px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
    font-family:'Onest',sans-serif;font-size:23px;font-weight:700;transition:transform .14s var(--ease);}
  .keypad button:active{transform:scale(.94);background:var(--surface-2);}
  .keypad button.flat{background:transparent;border-color:transparent;font-size:15px;font-weight:700;color:var(--ink-2);}
  .shake{animation:shake .4s;}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-6px)}}

  .stack{display:flex;flex-direction:column;gap:9px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .rowline{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);}
  .rowline:first-child{border-top:0;}
  .money{font-family:'Onest',sans-serif;font-weight:800;letter-spacing:-.03em;}
  .fade-in{animation:fade .3s ease both;}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

  ['Необов’язково. Поки порожньо — застосунок працює автономно', 'Необязательно. Пока пусто — приложение работает автономно', 'Optional. While empty, the app works offline', 'Opcjonalnie. Dopóki puste — aplikacja działa offline'],
  ['Проведіть перше тренування — і графік почне заповнюватись.', 'Проведите первую тренировку — и график начнёт заполняться.', 'Complete your first session and the chart will fill up.', 'Przeprowadź pierwszy trening — wykres zacznie się wypełniać.'],
  ['Не вдалося показати цей блок. Дані на пристрої не втрачені.', 'Не удалось показать этот блок. Данные на устройстве не потеряны.', 'Couldn’t render this block. Your data on the device is intact.', 'Nie udało się wyświetlić tego bloku. Dane na urządzeniu są całe.'],
  ['Ця сума підставлятиметься в кожне тренування з цим клієнтом', 'Эта сумма будет подставляться в каждую тренировку с этим клиентом', 'This amount will be prefilled for every session with this client', 'Ta kwota będzie wstawiana do każdego treningu z tym klientem'],
  ['Воно лишиться в історії як скасоване і не потрапить у дохід.', 'Она останется в истории как отменённая и не попадёт в доход.', 'It stays in history as cancelled and won’t count as income.', 'Zostanie w historii jako odwołany i nie wliczy się do dochodu.'],
  ['Оформіть абонемент клієнту з його картки або зі списку пакетів.', 'Оформите абонемент клиенту из его карточки или из списка пакетов.', 'Issue a package from a client’s card or from the packages list.', 'Wystaw karnet z karty klienta lub z listy pakietów.'],
  ['Такі клієнти з’являться на головній у блоці «Кому час написати»', 'Такие клиенты появятся на главной в блоке «Кому пора написать»', 'Such clients appear on the home screen under “Time to text”', 'Tacy klienci pojawią się na ekranie głównym w bloku „Czas napisać”'],
  ['Тренувань не заплановано. Гарний момент, щоб запросити клієнта.', 'Тренировок не запланировано. Хороший момент, чтобы пригласить клиента.', 'No sessions planned. A good moment to invite a client.', 'Brak zaplanowanych treningów. Dobry moment, żeby zaprosić klienta.'],
  ['Закріплена ціна цього клієнта — можна змінити для цього тренування', 'Закреплённая цена этого клиента — можно изменить для этой тренировки', 'This client’s pinned price — you can change it for this session', 'Przypisana cena tego klienta — można zmienić dla tego treningu'],
  ['Спочатку додайте товар — потім його можна буде продавати клієнтам.', 'Сначала добавьте товар — потом его можно будет продавать клиентам.', 'Add a product first — then you can sell it to clients.', 'Najpierw dodaj towar — potem będzie można go sprzedawać klientom.'],
  ['{name}, привіт! Нагадую про тренування {when} о {time}. Буду чекати!', '{name}, привет! Напоминаю о тренировке {when} в {time}. Буду ждать!', 'Hi {name}! A reminder about your session {when} at {time}. See you!', 'Cześć {name}! Przypominam o treningu {when} o {time}. Czekam!'],
  ['Нічого не надсилається на сервер, поки ви не увімкнете синхронізацію', 'Ничего не отправляется на сервер, пока вы не включите синхронизацию', 'Nothing is sent to a server until you turn on sync', 'Nic nie jest wysyłane na serwer, dopóki nie włączysz synchronizacji'],
  ['Підставлено ціну за замовчуванням — змініть, якщо сьогодні інша сума', 'Подставлена цена по умолчанию — измените, если сегодня другая сумма', 'Default price prefilled — change it if today’s amount differs', 'Wstawiono cenę domyślną — zmień, jeśli dziś inna kwota'],
  ['Тут з’являться нагадування про тренування, борги та залишки товарів.', 'Здесь появятся напоминания о тренировках, долгах и остатках товаров.', 'Reminders about sessions, debts and stock will appear here.', 'Tu pojawią się przypomnienia o treningach, długach i stanach towarów.'],
  ['{name}, доброго дня! Нагадую про оплату за тренування — {sum}. Дякую!', '{name}, добрый день! Напоминаю об оплате за тренировки — {sum}. Спасибо!', 'Hello {name}! A reminder about payment for your sessions — {sum}. Thank you!', 'Dzień dobry {name}! Przypominam o płatności za treningi — {sum}. Dziękuję!'],
  ['Копія містить клієнтів, тренування, продажі, абонементи й налаштування.', 'Копия содержит клиентов, тренировки, продажи, абонементы и настройки.', 'The backup contains clients, sessions, sales, packages and settings.', 'Kopia zawiera klientów, treningi, sprzedaż, karnety i ustawienia.'],
  ['{name}, доброго дня! Підтвердіть, будь ласка, тренування {when} о {time}.', '{name}, добрый день! Подтвердите, пожалуйста, тренировку {when} в {time}.', 'Hello {name}, could you confirm your session {when} at {time}?', 'Dzień dobry {name}! Proszę o potwierdzenie treningu {when} o {time}.'],
  ['Додайте першого клієнта — і зможете планувати тренування та рахувати дохід.', 'Добавьте первого клиента — и сможете планировать тренировки и считать доход.', 'Add your first client to plan sessions and count income.', 'Dodaj pierwszego klienta — będziesz planować treningi i liczyć dochód.'],
  ['Мінімум 4 символи. Знадобиться лише щоб відкрити кабінет на цьому пристрої.', 'Минимум 4 символа. Понадобится только чтобы открыть кабинет на этом устройстве.', 'At least 4 characters. Only needed to open the account on this device.', 'Minimum 4 znaki. Potrzebne tylko do otwarcia konta na tym urządzeniu.'],
  ['Дані на місці — нічого не втрачено. Спробуйте ще раз або оберіть інший план.', 'Данные на месте — ничего не потеряно. Попробуйте ещё раз или выберите другой план.', 'Your data is safe — nothing is lost. Try again or pick another plan.', 'Dane są bezpieczne — nic nie zginęło. Spróbuj ponownie lub wybierz inny plan.'],
  ['Додайте протеїн, шейкер чи резинки — застосунок рахуватиме залишок і прибуток.', 'Добавьте протеин, шейкер или резинки — приложение посчитает остаток и прибыль.', 'Add protein, a shaker or bands — the app will track stock and profit.', 'Dodaj odżywkę, shaker czy gumy — aplikacja policzy stan i zysk.'],
  ['Створіть перший пакет — далі його можна буде оформлювати клієнтам у два дотики.', 'Создайте первый пакет — дальше его можно будет оформлять клиентам в два касания.', 'Create your first package — then you can issue it to clients in two taps.', 'Utwórz pierwszy pakiet — potem wystawisz go klientom w dwa dotknięcia.'],
  ['Демо-режим: магазин ще не підключено, покупка імітується для перевірки сценарію.', 'Демо-режим: магазин ещё не подключён, покупка имитируется для проверки сценария.', 'Demo mode: the store isn’t connected yet, the purchase is simulated.', 'Tryb demo: sklep nie jest jeszcze podłączony, zakup jest symulowany.'],
  ['Кабінет прив’яжеться до вашої пошти або номера — дані з демо залишаться на місці.', 'Кабинет привяжется к вашей почте или номеру — данные из демо останутся на месте.', 'The account is linked to your email or phone — demo data stays put.', 'Konto zostanie powiązane z e-mailem lub numerem — dane demo pozostaną.'],
  ['Повний доступ до всіх функцій. Оплата — тільки після завершення пробного періоду.', 'Полный доступ ко всем функциям. Оплата — только после окончания пробного периода.', 'Full access to everything. You pay only after the trial ends.', 'Pełny dostęp do wszystkich funkcji. Płatność dopiero po okresie próbnym.'],
  ['Ці числа підставлятимуться в кожне тренування. Змінити можна будь-коли в профілі.', 'Эти числа будут подставляться в каждую тренировку. Изменить можно когда угодно в профиле.', 'These numbers prefill every session. You can change them anytime in the profile.', 'Te liczby będą wstawiane do każdego treningu. Zmienisz je kiedykolwiek w profilu.'],
  ['Разом із ним зникнуть його тренування, продажі та нотатки. Дію не можна скасувати.', 'Вместе с ним исчезнут его тренировки, продажи и заметки. Действие нельзя отменить.', 'Their sessions, sales and notes will be deleted too. This can’t be undone.', 'Razem z nim znikną jego treningi, sprzedaż i notatki. Tej akcji nie można cofnąć.'],
  ['{name}, привіт! Підкажіть, коли зручно закрити оплату за минулі тренування ({sum})?', '{name}, привет! Подскажите, когда удобно закрыть оплату за прошлые тренировки ({sum})?', 'Hi {name}! When would it be convenient to settle payment for your past sessions ({sum})?', 'Cześć {name}! Kiedy będzie Ci wygodnie uregulować płatność za poprzednie treningi ({sum})?'],
  ['Достатньо пошти або номера — жодних кодів і підтверджень. Пароль можна не вигадувати.', 'Достаточно почты или номера — никаких кодов и подтверждений. Пароль можно не придумывать.', 'Just an email or phone — no codes, no confirmations. A password is optional.', 'Wystarczy e-mail lub numer — bez kodów i potwierdzeń. Hasło jest opcjonalne.'],
  ['Записуйте ваги, самопочуття, побажання — усе, що знадобиться на наступному тренуванні.', 'Записывайте веса, самочувствие, пожелания — всё, что понадобится на следующей тренировке.', 'Note weights, how they felt, requests — anything useful for the next session.', 'Zapisuj ciężary, samopoczucie, życzenia — wszystko, co przyda się na kolejnym treningu.'],
  ['8 клієнтів, історія за 2 місяці, товари й абонементи. Все можна видалити одним дотиком.', '8 клиентов, история за 2 месяца, товары и абонементы. Всё можно удалить одним касанием.', '8 clients, 2 months of history, products and packages. All removable in one tap.', '8 klientów, historia z 2 miesięcy, towary i karnety. Wszystko usuniesz jednym dotknięciem.'],
  ['Нічого не спишеться автоматично: план ви оберете самі, коли пробний період завершиться.', 'Ничего не спишется автоматически: план вы выберете сами, когда пробный период закончится.', 'Nothing is charged automatically: you pick a plan yourself when the trial ends.', 'Nic nie zostanie pobrane automatycznie: plan wybierzesz sam, gdy okres próbny się skończy.'],
  ['Ніхто не зник з поля зору — у всіх активних клієнтів є свіжі тренування або запис наперед.', 'Никто не пропал из виду — у всех активных клиентов есть свежие тренировки или запись наперёд.', 'Nobody slipped away — every active client has a recent session or an upcoming booking.', 'Nikt nie zniknął z pola widzenia — wszyscy aktywni klienci mają świeże treningi lub zapis na przyszłość.'],
  ['Відкрив застосунок і за три секунди бачиш: скільки тренувань сьогодні і скільки ви заробили.', 'Открыл приложение и за три секунды видишь: сколько тренировок сегодня и сколько вы заработали.', 'Open the app and in three seconds you see how many sessions you have today and how much you earned.', 'Otwierasz aplikację i w trzy sekundy widzisz: ile masz dziś treningów i ile zarobiłeś.'],
  ['Оборот, відсоток залу і чисті — рахуються автоматично. Продажі товарів і абонементи теж тут.', 'Оборот, процент зала и чистыми — считаются автоматически. Продажи товаров и абонементы тоже здесь.', 'Turnover, the gym’s cut and your net — calculated automatically. Product sales and packages are here too.', 'Obrót, prowizja klubu i kwota netto — liczone automatycznie. Sprzedaż towarów i karnety też tutaj.'],
  ['Картка клієнта, історія, борги, абонементи й нагадування. Нове тренування — за кілька дотиків.', 'Карточка клиента, история, долги, абонементы и напоминания. Новая тренировка — за пару касаний.', 'A client card, history, debts, packages and reminders. A new session takes a few taps.', 'Karta klienta, historia, długi, karnety i przypomnienia. Nowy trening w kilka dotknięć.'],
  ['Усі ваші клієнти, тренування та фінансові дані збережені. Оберіть план, щоб продовжити роботу.', 'Все ваши клиенты, тренировки и финансовые данные сохранены. Выберите план, чтобы продолжить работу.', 'All your clients, sessions and financial data are saved. Choose a plan to keep working.', 'Wszyscy Twoi klienci, treningi i dane finansowe są zapisane. Wybierz plan, aby kontynuować pracę.'],
  ['Поточні дані буде замінено даними з копії. Якщо після копії щось змінювалось — ці зміни зникнуть.', 'Текущие данные будут заменены данными из копии. Если после копии что-то менялось — эти изменения исчезнут.', 'Current data will be replaced by the backup. Anything changed after the backup will be lost.', 'Bieżące dane zostaną zastąpione danymi z kopii. Zmiany po wykonaniu kopii przepadną.'],
  ['Створіть пакет — напр. 8 тренувань за 5 600 ₴. Кожне проведене тренування списується автоматично.', 'Создайте пакет — напр. 8 тренировок за 5 600 ₴. Каждая проведённая тренировка списывается автоматически.', 'Create a package — e.g. 8 sessions for 5,600 ₴. Each completed session is deducted automatically.', 'Utwórz pakiet — np. 8 treningów za 5 600 ₴. Każdy odbyty trening odlicza się automatycznie.'],
  ['Дані клієнтів, тренування та фінанси зберігаються незалежно від підписки — вони нікуди не зникають.', 'Данные клиентов, тренировки и финансы хранятся независимо от подписки — они никуда не исчезают.', 'Client data, sessions and finances are stored regardless of the subscription — nothing disappears.', 'Dane klientów, treningi i finanse są przechowywane niezależnie od subskrypcji — nic nie znika.'],
  ['{name}, доброго дня! Пропоную повернутись до тренувань — почнемо з легкого відновлювального. Коли зручно?', '{name}, добрый день! Предлагаю вернуться к тренировкам — начнём с лёгкой восстановительной. Когда удобно?', 'Hello {name}! How about getting back to training — we can start with an easy recovery session. When suits you?', 'Dzień dobry {name}! Proponuję wrócić do treningów — zaczniemy od lekkiego, regeneracyjnego. Kiedy Ci pasuje?'],
  ['Схоже, збережена база пошкоджена. Можна почати з чистого аркуша — або відновити з резервної копії пізніше.', 'Похоже, сохранённая база повреждена. Можно начать с чистого листа — или восстановить из резервной копии позже.', 'The saved database looks damaged. You can start fresh — or restore from a backup later.', 'Wygląda na to, że zapisana baza jest uszkodzona. Można zacząć od zera — albo później odtworzyć z kopii.'],
  ['Клієнти, тренування, продажі та налаштування зникнуть із цього пристрою. Радимо спершу зберегти резервну копію.', 'Клиенты, тренировки, продажи и настройки исчезнут с этого устройства. Советуем сначала сохранить резервную копию.', 'Clients, sessions, sales and settings will be erased from this device. Save a backup first.', 'Klienci, treningi, sprzedaż i ustawienia znikną z tego urządzenia. Radzimy najpierw zapisać kopię.'],
  ['{name}, привіт! Давно вас не було в залі — усе гаразд? Є вільні місця на цьому тижні, можу поставити ваш звичний час.', '{name}, привет! Давно вас не было в зале — всё в порядке? На этой неделе есть свободные места, могу поставить ваше привычное время.', 'Hi {name}! Haven’t seen you at the gym for a while — all good? I have slots free this week and can keep your usual time.', 'Cześć {name}! Dawno Cię nie było na siłowni — wszystko w porządku? W tym tygodniu mam wolne terminy, mogę zarezerwować Twoją zwykłą godzinę.'],

  const d = I18N[LANG] || {}, o = OVERRIDE[LANG] || {};
  const uk = fallback !== undefined ? fallback : OVERRIDE.uk[key];

  missing(code = LANG){

    Object.keys(OVERRIDE.uk).forEach(k => put(k, OVERRIDE.uk[k]));

/* ─────────────────── сховище ───────────────────
   Дані клієнтів — персональні, тому лишаються на пристрої. За бажанням
   тренера база шифрується AES-GCM ключем, похідним від PIN (PBKDF2).
   Без PIN у localStorage лежить лише шифротекст.                     */
const KEY = 'protrainer.v1';
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

const Vault = {
  key: null,                                   // CryptoKey живе лише в пам'яті
  async derive(pin, saltB64){
    const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    return {key, salt:b64(salt)};
  },
  async hash(pin, saltB64){
    const h = await crypto.subtle.digest('SHA-256', enc.encode(saltB64 + '|' + pin));
    return b64(h);
  },
  async encrypt(text){
    const ivb = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv:ivb}, Vault.key, enc.encode(text));
    return {iv:b64(ivb), ct:b64(ct)};
  },
  async decrypt(iv, ct){
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(iv)}, Vault.key, unb64(ct));
    return dec.decode(pt);
  },
};

const BACKUP_KEY = KEY + '.backup';

/* ─── сховище ───
   localStorage у WebView система може очистити, коли на пристрої бракує
   місця, — тобто тренер ризикує втратити клієнтів. Тому все пишеться і в
   localStorage, і в нативне сховище (@capacitor/preferences), а читається
   з пам'яті, яку ми наповнюємо на старті. Синхронний API лишається таким
   самим, тож решта коду не змінюється.                                  */
const Box = {
  cache: new Map(),
  plugin(){
    return (typeof window !== 'undefined' && window.Capacitor && window.Capacitor.Plugins
      && window.Capacitor.Plugins.Preferences) || null;
  },
  native(){ return !!Box.plugin(); },
  ls(k){ try { return localStorage.getItem(k); } catch { return null; } },
  /* читаємо обидва сховища; нативне головніше, бо переживає очищення WebView */
  async hydrate(keys){
    const P = Box.plugin();
    for (const k of keys){
      let v = null;
      if (P){ try { v = (await P.get({key: k})).value; } catch {} }
      if (v == null) v = Box.ls(k);
      if (v != null){
        Box.cache.set(k, v);
        if (P && Box.ls(k) !== v){ try { localStorage.setItem(k, v); } catch {} }   /* повертаємо копію у WebView */
      }
    }
  },
  get(k){ return Box.cache.has(k) ? Box.cache.get(k) : Box.ls(k); },
  /* другу вкладку або відновлення ззовні помічаємо через подію storage */
  listening: false,
  listen(){
    if (typeof window === 'undefined' || Box.listening || !window.addEventListener) return;
    Box.listening = true;
    window.addEventListener('storage', e => {
      if (!e || !e.key || !Box.cache.has(e.key)) return;
      Box.cache.set(e.key, e.newValue);
      if (e.key === META_KEY) Access.emit();          /* доступ міг змінитись */
    });
  },
  set(k, v){
    Box.cache.set(k, v);
    let ok = true;
    try { localStorage.setItem(k, v); } catch { ok = false; }
    const P = Box.plugin();
    if (P) { P.set({key: k, value: v}).catch(() => {}); ok = true; }               /* нативне сховище без квоти */
    return ok;
  },
  remove(k){
    Box.cache.delete(k);
    try { localStorage.removeItem(k); } catch {}
    const P = Box.plugin();
    if (P) P.remove({key: k}).catch(() => {});
  },
};
/* Резервна копія — знімок бази поруч з робочими даними плюс файл на вимогу.
   Автоматична копія робиться раз на добу, коли застосунок відкритий. */
const Backups = {
  make(){
    const ok = Box.set(BACKUP_KEY, JSON.stringify({ts: Date.now(), db: Store.state}));
    if (ok) Act.markBackup();
    return ok;
  },
  read(){ try { return JSON.parse(Box.get(BACKUP_KEY) || 'null'); } catch { return null; } },
  file(){

      const blob = new Blob([JSON.stringify(Store.state, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);

      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      return true;
    } catch { return false; }
  },
};

const META_KEY = KEY + '.meta';
const Disk = {
  hydrate(){ Box.listen(); return Box.hydrate([KEY, META_KEY, BACKUP_KEY, DEMO_IAP_KEY]); },
  readMeta(){ try { return JSON.parse(Box.get(META_KEY) || 'null'); } catch { return null; } },
  writeMeta(m){ Box.set(META_KEY, JSON.stringify(m)); },
  readRaw(){ return Box.get(KEY); },
  writeRaw(s){ return Box.set(KEY, s); },
  /* дані стираємо, а акаунт і пробний період лишаємо: інакше очищення
     даних дало б новий безкоштовний період */
  clear(){
    const m = Disk.readMeta() || {};
    Box.remove(KEY);
    Box.set(META_KEY, JSON.stringify({salt: m.salt, account: m.account, access: m.access}));
  },
};

/* ─────────────────── синхронізація ───────────────────
   Локально-перше сховище: кожна зміна лягає в чергу outbox і чекає
   мережі. Поки ендпойнт не заданий — застосунок працює автономно,
   черга просто накопичує зміни (і показує це у профілі).            */
const Sync = {
  outbox: [],
  status: 'local',                              // local | queued | syncing | ok | error
  listeners: new Set(),
  endpoint(){ return (Store.state && Store.state.settings.syncUrl) || ''; },
  push(op, payload){
    Sync.outbox.push({id:uid('op'), op, payload, ts:Date.now()});
    if (Sync.outbox.length > 500) Sync.outbox.splice(0, Sync.outbox.length - 500);
    Sync.status = Sync.endpoint() ? (navigator.onLine ? 'queued' : 'local') : 'local';
    Sync.emit();
    if (Sync.endpoint() && navigator.onLine) Sync.flush();
  },
  emit(){ Sync.listeners.forEach(f => f(Sync.status, Sync.outbox.length)); },
  async flush(){
    const url = Sync.endpoint();
    if (!url || !Sync.outbox.length || Sync.status === 'syncing') return;
    Sync.status = 'syncing'; Sync.emit();
    const batch = Sync.outbox.slice(0, 100);
    try {
      const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({device: Store.state.device, ops: batch})});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      Sync.outbox = Sync.outbox.slice(batch.length);
      Sync.status = Sync.outbox.length ? 'queued' : 'ok';
      Store.patch(db => ({...db, syncedAt: Date.now()}));
    } catch (e) {
      Sync.status = 'error';                    // черга лишається — спробуємо пізніше
    }
    Sync.emit();
  },
};
window.addEventListener('online', () => Sync.flush());

   демо-реалізація: вона імітує покупку й зберігає її окремо від даних
   застосунку, щоб можна було перевірити «Відновити покупку». */
const DEMO_IAP_KEY = 'protrainer.iap.demo';
/* Контракт моста (native/iap-bridge.js реалізує його для Capacitor):
     platform            'ios' | 'android'
     buy(productId)   →  {ok, transactionId?, ts?, expiresAt?, error?}
     restore()        →  {ok, purchases:[{productId, transactionId, ts, expiresAt?}]}
     status()         →  {ok, active, productId?, expiresAt?, autoRenew?}   (необов'язково)
   Якщо магазин повідомляє expiresAt — беремо його, він знає про продовження
   й скасування більше, ніж застосунок. */
const IAP = {
  bridge(){ return (typeof window !== 'undefined' && window.ProTrainerIAP) || null; },
  platform(){ const b = IAP.bridge(); return b ? (b.platform || 'native') : 'demo'; },
  connected(){ return !!IAP.bridge(); },
  async status(){ const b = IAP.bridge(); return b && b.status ? b.status() : {ok:false}; },
  demo: {fail: false},
  demoRead(){ try { return JSON.parse(Box.get(DEMO_IAP_KEY) || 'null'); } catch { return null; } },
  demoWrite(v){ Box.set(DEMO_IAP_KEY, JSON.stringify(v)); },
  async buy(productId){
    const b = IAP.bridge();
    if (b) return b.buy(productId);
    await sleep(600);
    if (IAP.demo.fail) return {ok:false, error:'payment_declined'};
    const rec = {productId, transactionId: 'demo_' + uid('tx'), ts: Date.now()};
    IAP.demoWrite(rec);
    return {ok:true, transactionId: rec.transactionId, ts: rec.ts};
  },
  async restore(){
    const b = IAP.bridge();
    if (b) return b.restore();
    await sleep(500);
    const rec = IAP.demoRead();
    return {ok:true, purchases: rec ? [rec] : []};
  },
};

/* ─── нагадування ───
   У браузері сповіщення живуть, поки відкритий застосунок. У нативній
   оболонці (@capacitor/local-notifications) їх можна запланувати наперед —
   тоді вони приходять і з закритим застосунком. Розклад перескладається
   щоразу, коли змінюються тренування або налаштування.                  */
const NOTIF_KEY = KEY + '.notif';
const minsLabel = m => m >= 60 ? (m / 60) + ' ' + t('unit.hour','год') : m + ' ' + t('unit.min','хв');

const Notifier = {
  plugin(){
    return (typeof window !== 'undefined' && window.Capacitor && window.Capacitor.Plugins
      && window.Capacitor.Plugins.LocalNotifications) || null;
  },
  native(){ return !!Notifier.plugin(); },
  granted: false,
  async ensure(){
    const P = Notifier.plugin();
    if (P){
      try { const r = await P.requestPermissions(); Notifier.granted = !!r && r.display === 'granted'; }
      catch { Notifier.granted = false; }
      return Notifier.granted;
    }
    if (typeof Notification === 'undefined') return false;
    try { Notifier.granted = (await Notification.requestPermission()) === 'granted'; } catch { Notifier.granted = false; }
    return Notifier.granted;
  },
  permission(){
    if (Notifier.native()) return Notifier.granted ? 'granted' : 'default';
    return typeof Notification === 'undefined' ? 'unsupported' : Notification.permission;
  },
  show(title, body, tag){
    const P = Notifier.plugin();
    if (P){
      P.schedule({notifications: [{id: Notifier.id(tag, 0), title, body, schedule: {at: new Date(Date.now() + 800)}}]})
       .catch(() => {});
      return;
    }
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted')
        new Notification(title, {body, tag, icon: 'icon.svg'});
    } catch {}
  },
  /* стабільний числовий id: плагін приймає лише int */
  id(sessionId, min){
    let h = 0;
    const src = String(sessionId) + '|' + min;
    for (let i = 0; i < src.length; i++) h = (h * 31 + src.charCodeAt(i)) % 2000000000;
    return h + 1;
  },
  /* що саме треба нагадати найближчим тижнем */
  plan(db){
    const out = [], now = Date.now(), horizon = now + 7 * DAY;
    (db.settings.notif.before || []).forEach(m => {
      db.sessions.filter(x => x.status === 'planned').forEach(x => {
        const at = +new Date(x.start) - m * 60000;
        if (at > now + 30000 && at < horizon){
          const c = byId(db.clients, x.clientId);
          out.push({id: Notifier.id(x.id, m), at: new Date(at),
            title: '🏋️ ' + t('n.before','Тренування за') + ' ' + minsLabel(m),
            body: (c ? c.name : t('session.one','Тренування')) + ' · ' + fmtTime(x.start)});
        }
      });
    });
    return out.sort((a, b) => a.at - b.at).slice(0, 60);   /* у плагінів є ліміти */
  },
  async sync(db){
    const P = Notifier.plugin();
    if (!P) return {ok:false, native:false};
    if (!Notifier.granted && !(await Notifier.ensure())) return {ok:false, denied:true};
    let prev = [];
    try { prev = JSON.parse(Box.get(NOTIF_KEY) || '[]'); } catch {}
    try { if (prev.length) await P.cancel({notifications: prev.map(id => ({id}))}); } catch {}
    const list = Notifier.plan(db);
    try {
      if (list.length) await P.schedule({notifications: list.map(x => ({
        id: x.id, title: x.title, body: x.body, schedule: {at: x.at}, smallIcon: 'ic_stat_icon',
      }))});
    } catch (e){ return {ok:false, error: String(e)}; }
    Box.set(NOTIF_KEY, JSON.stringify(list.map(x => x.id)));
    return {ok:true, scheduled: list.length};
  },
};

const Access = {
  listeners: new Set(),
  emit(){ Access.listeners.forEach(f => f()); Store.emit(); },
  read(){ const m = Disk.readMeta() || {}; return m.access || {}; },
  write(patch){
    const m = Disk.readMeta() || {};
    const access = {...(m.access || {}), ...patch};
    Disk.writeMeta({...m, access});
    Sync.push('access', access);          /* сервер стане джерелом правди, коли з'явиться */
    Access.emit();
    return access;
  },
  /* пробний період прив'язаний до акаунта і стартує один раз */
  startTrial(){
    const a = Access.read();
    if (a.trialStartedAt) return a;
    return Access.write({trialStartedAt: Date.now(), status:'trial'});
  },
  trialEnds(){ const a = Access.read(); return a.trialStartedAt ? a.trialStartedAt + TRIAL_DAYS * DAY : 0; },

  state(now){
    const a = Access.read();
    const t = now || Date.now();
    const sub = (a.expiresAt && a.plan)
      ? (t < a.expiresAt
          ? {kind: a.autoRenew === false ? 'SUBSCRIPTION_CANCELLED' : 'SUBSCRIPTION_ACTIVE',
             allowed:true, until:a.expiresAt, plan:a.plan}
          : {kind:'SUBSCRIPTION_EXPIRED', allowed:false, until:a.expiresAt, plan:a.plan})
      : null;
    if (sub && sub.allowed) return sub;

    const trial = a.trialStartedAt ? (() => {
      const ends = a.trialStartedAt + TRIAL_DAYS * DAY;
      const left = Math.max(0, Math.ceil((ends - t) / DAY));
      return left > 0
        ? {kind:'TRIAL_ACTIVE', allowed:true, left, until:ends}
        : {kind:'TRIAL_EXPIRED', allowed:false, until:ends};
    })() : null;
    if (trial && trial.allowed) return trial;

    if (a.status === 'pending') return {kind:'PAYMENT_PENDING', allowed:true, plan:a.pendingPlan};
    if (a.status === 'failed')  return {kind:'PAYMENT_FAILED', allowed:false, error:a.error, plan:a.pendingPlan};
    return sub || trial || {kind:'TRIAL_NOT_STARTED', allowed:true};
  },
  allowed(){ return Access.state().allowed; },

  async purchase(planId){
    const plan = planById(planId);
    if (!plan) return {ok:false, error:'unknown_plan'};
    Access.write({status:'pending', pendingPlan: planId, error:null});
    try {
      const r = await IAP.buy(plan.productId);
      if (!r || !r.ok) throw new Error((r && r.error) || 'payment_failed');
      /* продовження додається до чинного строку, а не обнуляє його */
      const from = Math.max(Date.now(), Access.read().expiresAt || 0);
      const until = r.expiresAt || +addMonthsKeep(new Date(from), plan.months);
      Access.write({status:'active', plan: plan.id, productId: plan.productId,
        purchasedAt: Date.now(), expiresAt: until,
        autoRenew: true, transactionId: r.transactionId, lastVerifiedAt: Date.now(),
        pendingPlan: null, error: null});
      return {ok:true};
    } catch (e){
      /* дані недоторкані — лише позначаємо, що оплата не пройшла */
      Access.write({status:'failed', error: String((e && e.message) || e)});
      return {ok:false, error: String((e && e.message) || e)};
    }
  },
  async restore(){
    try {
      const r = await IAP.restore();
      const list = (r && r.purchases) || [];
      if (!list.length) return {ok:false, error:'nothing_to_restore'};
      const rec = list[list.length - 1];
      const plan = PLANS.find(p => p.productId === rec.productId);
      if (!plan) return {ok:false, error:'unknown_product'};
      const expires = rec.expiresAt || +addMonthsKeep(new Date(rec.ts || Date.now()), plan.months);
      Access.write({status: expires > Date.now() ? 'active' : 'expired', plan: plan.id, productId: plan.productId,
        purchasedAt: rec.ts || Date.now(), expiresAt: expires, autoRenew: true,
        transactionId: rec.transactionId, lastVerifiedAt: Date.now(), error: null});
      return {ok: expires > Date.now(), expiresAt: expires};
    } catch (e){ return {ok:false, error: String((e && e.message) || e)}; }
  },
  cancel(){ return Access.write({autoRenew: false}); },        /* доступ лишається до дати */
  resume(){ return Access.write({autoRenew: true}); },
  /* без мережі нічого не блокуємо: працюємо за локальним записом,
     а щойно з'явиться зв'язок — перевіряємо статус у магазині */
  async verify(){
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return {ok:false, offline:true};
    const a = Access.read();
    if (!a.plan) return {ok:false};
    /* магазин знає про продовження й скасування — його відповідь головніша */
    const st = await IAP.status();
    if (st && st.ok){
      Access.write({
        expiresAt: st.expiresAt || a.expiresAt,
        autoRenew: st.autoRenew === undefined ? a.autoRenew : st.autoRenew,
        status: st.active ? 'active' : 'expired',
        lastVerifiedAt: Date.now(),
      });
      return {ok:true, active: st.active};
    }
    const r = await IAP.restore();
    if (!r || !r.ok) return {ok:false};
    Access.write({lastVerifiedAt: Date.now()});
    return {ok:true};
  },
};
function useAccess(){
  const [, force] = useState(0);
  useEffect(() => { const f = () => force(x => x + 1); Access.listeners.add(f); return () => Access.listeners.delete(f); }, []);
  return Access.state();
}

/* ─────────────────── фінансовий рушій ───────────────────
   Оборот   — скільки заплатив клієнт.
   Залу     — комісія клубу: % / фіксована сума / без комісії.
   Чистими  — те, що лишається тренеру.
   Товари комісією залу не обкладаються: там прибуток = ціна − закупка. */
function split(gross, s){
  const g = Math.max(0, Math.round(Number(gross) || 0));
  let gym = 0;
  if (!s || s.gymMode === 'percent') gym = Math.round(g * ((s ? s.gymPercent : 15) / 100));
  else if (s.gymMode === 'fixed') gym = Math.min(g, Math.round(s.gymFixed || 0));
  else gym = 0;
  return {gross:g, gym, net:g - gym};
}
/* тренування, які реально приносять гроші (скасовані — ні) */
const isBillable = s => s.status !== 'canceled' && s.status !== 'noshow';
const SES_STATUS = {
  planned:  {t:'Заплановано', tone:'acc'},
  done:     {t:'Проведено',   tone:'pos'},
  canceled: {t:'Скасовано',   tone:'mut'},
  noshow:   {t:'Не прийшов',  tone:'neg'},
};
const statusTitle = k => t('status.' + k, (SES_STATUS[k] || SES_STATUS.planned).t);
const inRange = (ts, from, to) => ts >= +from && ts < +to;

function periodRange(kind, base){
  const b = d0(base || new Date());
  if (kind === 'day')   return [b, addDays(b, 1)];
  if (kind === 'week')  { const w = (b.getDay() + 6) % 7; const from = addDays(b, -w); return [from, addDays(from, 7)]; }
  if (kind === 'month') { const from = new Date(b.getFullYear(), b.getMonth(), 1); return [from, addMonths(from, 1)]; }
  if (kind === 'year')  { const from = new Date(b.getFullYear(), 0, 1); return [from, new Date(b.getFullYear() + 1, 0, 1)]; }
  return [b, addDays(b, 1)];
}

function stats(db, from, to){
  const S = db.settings;
  const ses = db.sessions.filter(s => isBillable(s) && inRange(+new Date(s.start), from, to));
  const gross = sum(ses, s => s.price);
  const gym   = sum(ses, s => split(s.price, S).gym);
  const sales = db.sales.filter(x => inRange(x.ts, from, to));
  const salesRevenue = sum(sales, x => x.price * x.qty);
  const salesProfit  = sum(sales, x => {
    const p = byId(db.products, x.productId);
    return (x.price - (p ? p.cost : 0)) * x.qty;
  });
  const uniq = new Set(ses.map(s => s.clientId));
  const newC = db.clients.filter(c => inRange(c.createdAt, from, to)).length;
  const subsSold = sum(db.subs.filter(x => inRange(x.ts, from, to)), x => x.price);
  const done = ses.filter(s => s.status === 'done').length;
  const debt = sum(ses.filter(isDebt), s => s.price);
  return {
    gross, gym, net: gross - gym, count: ses.length, done,
    avg: ses.length ? Math.round(gross / ses.length) : 0,
    salesRevenue, salesProfit, salesCount: sum(sales, x => x.qty),
    clients: uniq.size, newClients: newC, subsSold,
    perClient: uniq.size ? Math.round((gross - gym) / uniq.size) : 0,
    sesPerClient: uniq.size ? Math.round(ses.length / uniq.size * 10) / 10 : 0,
    total: gross - gym + salesProfit, debt,
  };
}
/* динаміка: порівнюємо однакові за довжиною відрізки — інакше 3-го числа
   місяць завжди «мінус 90%» проти повного попереднього */
function deltaFor(db, kind, base){
  const [from, to] = periodRange(kind, base || new Date());
  const len = +to - +from;
  const slice = clamp(+addDays(d0(new Date()), 1) - +from, DAY, len);
  const cur = stats(db, from, new Date(+from + slice));
  const pFrom = new Date(+from - len);
  const prev = stats(db, pFrom, new Date(+pFrom + slice));
  return prev.net ? Math.round((cur.net - prev.net) / prev.net * 1000) / 10 : (cur.net ? 100 : 0);
}

/* довільний період: {kind:'custom', from:'2026-08-05', to:'2026-08-12'} */
function periodOf(p){
  if (p && p.kind === 'custom' && p.from){
    const from = d0(new Date(p.from + 'T00:00:00'));
    const to = d0(new Date((p.to || p.from) + 'T00:00:00'));
    return [from, addDays(to, 1)];
  }
  return periodRange((p && p.kind) || 'month', new Date());
}
/* динаміка проти попереднього відрізка такої ж довжини */
function deltaRange(db, from, to){
  const len = +to - +from;
  const slice = clamp(+addDays(d0(new Date()), 1) - +from, DAY, len);
  const cur = stats(db, from, new Date(+from + slice));
  const pFrom = new Date(+from - len);
  const prev = stats(db, pFrom, new Date(+pFrom + slice));
  return prev.net ? Math.round((cur.net - prev.net) / prev.net * 1000) / 10 : (cur.net ? 100 : 0);
}
const periodLabel = (p, from, to) => {
  if (!p || p.kind !== 'custom') return '';
  const last = addDays(to, -1);
  return sameDay(from, last) ? fmtDM(from) : fmtDMs(from) + ' — ' + fmtDMs(last);
};

/* борг — проведене й неоплачене тренування поза абонементом */
const isDebt = s => s.status === 'done' && !s.paid && !s.subId;
const debtDays = s => Math.max(0, Math.floor((Date.now() - +new Date(s.start)) / DAY));

function clientStats(db, id){
  const ses = db.sessions.filter(s => s.clientId === id && isBillable(s));
  const done = ses.filter(s => s.status === 'done');
  const sales = db.sales.filter(x => x.clientId === id);
  const spent = sum(done, s => s.price) + sum(sales, x => x.price * x.qty);
  const debt = sum(db.sessions.filter(s => s.clientId === id && isDebt(s)), s => s.price);
  const future = db.sessions.filter(s => s.clientId === id && s.status === 'planned' && +new Date(s.start) >= Date.now())
                            .sort((a,b) => +new Date(a.start) - +new Date(b.start));
  const last = done.sort((a,b) => +new Date(b.start) - +new Date(a.start))[0];
  const sub = db.subs.filter(x => x.clientId === id && x.used < x.total)
                     .sort((a,b) => a.ts - b.ts)[0];
  return {
    total: ses.length, done: done.length, spent, debt, sub,
    next: future[0] || null, last: last || null,
    lapsedDays: last ? Math.floor((Date.now() - +new Date(last.start)) / DAY) : null,
  };
}
/* історія клієнта — тренування + продажі + абонементи в одну стрічку */
function clientFeed(db, id){
  const out = [];
  const past = s => s.status !== 'planned' || +new Date(s.start) < Date.now();
  db.sessions.filter(s => s.clientId === id && past(s)).forEach(s => out.push({
    kind:'session', ts:+new Date(s.start), title: typeTitle(s.type),
    amount: s.status === 'canceled' ? 0 : s.price, ref:s,
    tag: s.status === 'canceled' ? 'canceled' : (s.subId ? 'package' : (s.paid ? 'paid' : 'debt')),
  }));
  db.sales.filter(x => x.clientId === id).forEach(x => {
    const p = byId(db.products, x.productId);
    out.push({kind:'sale', ts:x.ts, title:(p ? p.name : 'Товар') + (x.qty > 1 ? ' ×' + x.qty : ''),
      amount:x.price * x.qty, ref:x, tag:'paid'});
  });
  db.subs.filter(x => x.clientId === id).forEach(x => {
    const p = byId(db.packages, x.packageId);
    out.push({kind:'sub', ts:x.ts, title:t('feed.sub','Абонемент') + ' · ' + (p ? p.title : x.total + ' ' + t('unit.ses','трен.')),
      amount:x.price, ref:x, tag:'paid'});
  });
  return out.sort((a,b) => b.ts - a.ts);
}

/* ціна одного тренування: за замовчуванням із налаштувань, але якщо за
   клієнтом закріплена своя — беремо її; тип лише коригує суму */
const clientPrice = (db, clientId) => {
  const c = clientId ? byId(db.clients, clientId) : null;
  return (c && c.price) || db.settings.price;
};
const typedPrice = (base, type) =>
  type === 'online' ? Math.round(base * .7)
  : type === 'split' ? Math.round(base * 1.4)
  : Math.round(base);

const SES_TYPES = {
  personal: {title:'Персональна', hue:'t1', dur:60},
  pair:     {title:'Парна',       hue:'t2', dur:60},
  online:   {title:'Онлайн',      hue:'t3', dur:45},

const GOALS = ['Схуднення','Набір маси','Рельєф','Сила','Здоров’я спини','Реабілітація','Витривалість'];
const goalTitle = g => (g ? t('goal.' + g, g) : '');
const goals = () => GOALS.map(goalTitle);
/* назву типу беремо в момент показу — інакше вона застигла б мовою запуску */
const typeTitle = k => t('type.' + k, (SES_TYPES[k] || SES_TYPES.personal).title);
/* дні тижня — з Intl, щоб не вести свій список для кожної мови */

const Store = {
  state: null,
  subs: new Set(),
  ready: false,
  init(db){ Store.state = db; Store.ready = true; Store.emit(); },
  emit(){ Store.subs.forEach(f => f(Store.state)); },
  patch(fn, op){
    Store.state = fn(Store.state);
    Store.persist();
    if (op) Sync.push(op.name, op.data);
    Store.emit();
  },
  async persist(){
    const json = JSON.stringify(Store.state);
    const meta = Disk.readMeta() || {};
    try {
      if (Store.state.settings.secure && Vault.key){
        const {iv, ct} = await Vault.encrypt(json);
        Disk.writeRaw(JSON.stringify({enc: 1, iv, ct}));
      } else {
        Disk.writeRaw(json);
      }
      Disk.writeMeta({...meta, savedAt: Date.now(), enc: !!(Store.state.settings.secure && Vault.key)});
    } catch (e) { console.warn('persist', e); }
  },
};
function useDB(){
  const [, force] = useState(0);
  useEffect(() => {
    const f = () => force(x => x + 1);
    Store.subs.add(f);
    return () => Store.subs.delete(f);
  }, []);
  return Store.state;
}

/* ─────────────────── дії (єдина точка змін) ─────────────────── */
const Act = {
  settings(patch){ Store.patch(db => ({...db, settings:{...db.settings, ...patch}}), {name:'settings', data:patch}); },
  profile(patch){ Store.patch(db => ({...db, profile:{...db.profile, ...patch}}), {name:'profile', data:patch}); },

  addClient(c){
    const client = {id: uid('cl'), name:'', phone:'', goal:'', photo:'', note:'', price: null,
                    createdAt: Date.now(), archived:false, ...c};
    Store.patch(db => ({...db, clients:[client, ...db.clients]}), {name:'client.add', data:client});
    return client;
  },
  updClient(id, patch){ Store.patch(db => ({...db, clients: db.clients.map(c => c.id === id ? {...c, ...patch} : c)}), {name:'client.upd', data:{id, patch}}); },
  delClient(id){
    Store.patch(db => ({...db,
      clients: db.clients.filter(c => c.id !== id),
      sessions: db.sessions.filter(s => s.clientId !== id),
      sales: db.sales.filter(s => s.clientId !== id),
      subs: db.subs.filter(s => s.clientId !== id),
      notes: db.notes.filter(n => n.clientId !== id),
    }), {name:'client.del', data:{id}});
  },

  addSession(s){
    const ses = {id: uid('ses'), clientId:'', start: new Date().toISOString(), dur:60, type:'personal',
                 price: Store.state.settings.price, paid:false, status:'planned', subId:null, note:'', createdAt: Date.now(), ...s};
    Store.patch(db => {
      let subs = db.subs;
      if (ses.subId) subs = subs.map(x => x.id === ses.subId ? {...x, used: Math.min(x.total, x.used + (ses.status === 'done' ? 1 : 0))} : x);
      return {...db, sessions:[...db.sessions, ses], subs};
    }, {name:'session.add', data:ses});
    return ses;
  },
  updSession(id, patch){ Store.patch(db => ({...db, sessions: db.sessions.map(s => s.id === id ? {...s, ...patch} : s)}), {name:'session.upd', data:{id, patch}}); },
  delSession(id){
    Store.patch(db => {
      const s = byId(db.sessions, id);
      const subs = s && s.subId && s.status === 'done'
        ? db.subs.map(x => x.id === s.subId ? {...x, used: Math.max(0, x.used - 1)} : x) : db.subs;
      return {...db, sessions: db.sessions.filter(x => x.id !== id), subs};
    }, {name:'session.del', data:{id}});
  },
  /* провести тренування: списати заняття з абонемента або лишити борг */
  complete(id, paid){
    Store.patch(db => {
      const s = byId(db.sessions, id);
      if (!s || s.status === 'done') return db;
      let subs = db.subs;
      if (s.subId) subs = subs.map(x => x.id === s.subId ? {...x, used: Math.min(x.total, x.used + 1)} : x);
      return {...db,
        sessions: db.sessions.map(x => x.id === id ? {...x, status:'done', paid: !!paid || !!s.subId, paidAt: paid ? Date.now() : x.paidAt} : x),
        subs};
    }, {name:'session.done', data:{id, paid}});
  },
  pay(id){ Store.patch(db => ({...db, sessions: db.sessions.map(s => s.id === id ? {...s, paid:true, paidAt: Date.now()} : s)}), {name:'session.pay', data:{id}}); },
  cancel(id){
    Store.patch(db => {
      const s = byId(db.sessions, id);
      const subs = s && s.subId && s.status === 'done'
        ? db.subs.map(x => x.id === s.subId ? {...x, used: Math.max(0, x.used - 1)} : x) : db.subs;
      return {...db, sessions: db.sessions.map(x => x.id === id ? {...x, status:'canceled', paid:false} : x), subs};
    }, {name:'session.cancel', data:{id}});
  },

  /* клієнт не прийшов: тренування лишається в історії, але не в доході */
  noshow(id){
    Store.patch(db => {
      const s = byId(db.sessions, id);
      const subs = s && s.subId && s.status === 'done'
        ? db.subs.map(x => x.id === s.subId ? {...x, used: Math.max(0, x.used - 1)} : x) : db.subs;
      return {...db, sessions: db.sessions.map(x => x.id === id ? {...x, status:'noshow', paid:false} : x), subs};
    }, {name:'session.noshow', data:{id}});
  },
  /* закрити всі борги клієнта одним дотиком */
  payClient(clientId){
    Store.patch(db => ({...db, sessions: db.sessions.map(s =>
      (s.clientId === clientId && isDebt(s)) ? {...s, paid:true, paidAt: Date.now()} : s)}),
      {name:'client.payAll', data:{clientId}});
  },
  markBackup(){ Store.patch(db => ({...db, settings:{...db.settings, backup:{...db.settings.backup, lastAt: Date.now()}}})); },

  addProduct(p){
    const pr = {id: uid('pr'), name:'', price:0, cost:0, stock:0, sold:0, icon:'💊', createdAt: Date.now(), ...p};
    Store.patch(db => ({...db, products:[pr, ...db.products]}), {name:'product.add', data:pr});
    return pr;
  },
  updProduct(id, patch){ Store.patch(db => ({...db, products: db.products.map(p => p.id === id ? {...p, ...patch} : p)}), {name:'product.upd', data:{id, patch}}); },
  delProduct(id){ Store.patch(db => ({...db, products: db.products.filter(p => p.id !== id)}), {name:'product.del', data:{id}}); },
  sell(sale){
    const s = {id: uid('sl'), ts: Date.now(), qty:1, ...sale};
    Store.patch(db => ({...db,
      sales: [...db.sales, s],
      products: db.products.map(p => p.id === s.productId
        ? {...p, stock: Math.max(0, p.stock - s.qty), sold: (p.sold || 0) + s.qty} : p),
    }), {name:'sale.add', data:s});
    return s;
  },

  addPackage(p){
    const pk = {id: uid('pk'), title:'', sessions:8, price:0, days:60, active:true, createdAt: Date.now(), ...p};
    Store.patch(db => ({...db, packages:[pk, ...db.packages]}), {name:'package.add', data:pk});
    return pk;
  },
  updPackage(id, patch){ Store.patch(db => ({...db, packages: db.packages.map(p => p.id === id ? {...p, ...patch} : p)}), {name:'package.upd', data:{id, patch}}); },
  delPackage(id){ Store.patch(db => ({...db, packages: db.packages.filter(p => p.id !== id)}), {name:'package.del', data:{id}}); },
  buyPackage(clientId, pkg){
    const sub = {id: uid('sub'), clientId, packageId: pkg.id, total: pkg.sessions, used: 0,
                 price: pkg.price, ts: Date.now(), expiresAt: Date.now() + (pkg.days || 60) * DAY};
    Store.patch(db => ({...db, subs:[...db.subs, sub]}), {name:'sub.add', data:sub});
    return sub;
  },

  addNote(clientId, text){
    const n = {id: uid('nt'), clientId, text, ts: Date.now()};
    Store.patch(db => ({...db, notes:[n, ...db.notes]}), {name:'note.add', data:n});
    return n;
  },
  delNote(id){ Store.patch(db => ({...db, notes: db.notes.filter(n => n.id !== id)}), {name:'note.del', data:{id}}); },

  notify(n){
    const item = {id: uid('nf'), ts: Date.now(), read:false, type:'info', ...n};
    Store.patch(db => ({...db, notifs:[item, ...db.notifs].slice(0, 200)}));
    return item;
  },
  readNotifs(){ Store.patch(db => ({...db, notifs: db.notifs.map(n => ({...n, read:true}))})); },
  clearNotifs(){ Store.patch(db => ({...db, notifs: []})); },
  markFired(key){ Store.patch(db => ({...db, fired:{...db.fired, [key]: Date.now()}})); },
};

/* ─────────────────── демодані ─────────────────── */
function seedDB(profile){
  const db = emptyDB();
  db.profile = {...db.profile, ...profile};
  db.onboarded = true;
  const rnd = (() => { let s = 42; return () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648; })();
  const pick = a => a[Math.floor(rnd() * a.length)];

  const nm = (k, uk) => t('demo.' + k, uk);
  const names = [
    [nm('n1','Іван Петров'),'Схуднення'], [nm('n2','Максим Коваль'),'Набір маси'], [nm('n3','Олег Бондар'),'Сила'],
    [nm('n4','Анна Мельник'),'Рельєф'], [nm('n5','Софія Ткаченко'),'Здоров’я спини'], [nm('n6','Дмитро Шевчук'),'Витривалість'],
    [nm('n7','Ольга Кравець'),'Схуднення'], [nm('n8','Артем Лисенко'),'Набір маси'],
  ];
  /* у двох клієнтів своя закріплена ціна — так видно, що сума не однакова для всіх */
  const ownPrice = {cl_6: 900, cl_7: 700};
  db.clients = names.map(([name, goal], i) => ({
    id: 'cl_' + i, name, goal, phone: phoneMask('0' + (63 + i % 6) + String(1000000 + Math.floor(rnd() * 8999999)).slice(0,7)),
    photo:'', note:'', price: ownPrice['cl_' + i] || null,
    createdAt: Date.now() - (120 - i * 11) * DAY, archived:false,
  }));

  db.products = [
    {id:'pr_1', name:nm('p1','Протеїн'), price:1400, cost:1050, stock:4, sold:9,  icon:'🥤', createdAt:Date.now()},
    {id:'pr_2', name:nm('p2','Креатин'), price:800,  cost:500,  stock:7, sold:10, icon:'💊', createdAt:Date.now()},
    {id:'pr_3', name:nm('p3','Шейкер'),  price:250,  cost:120,  stock:12, sold:14, icon:'🍶', createdAt:Date.now()},
    {id:'pr_4', name:nm('p4','Рукавички'), price:600, cost:380, stock:3, sold:6,  icon:'🧤', createdAt:Date.now()},
    {id:'pr_5', name:nm('p5','Вітаміни'), price:900, cost:620,  stock:1, sold:4,  icon:'🟠', createdAt:Date.now()},
    {id:'pr_6', name:nm('p6','Резинки'),  price:450, cost:210,  stock:8, sold:7,  icon:'🎯', createdAt:Date.now()},
  ];
  db.packages = [
    {id:'pk_1', title:nSessions(8),  sessions:8,  price:5600,  days:60, active:true, createdAt:Date.now()},
    {id:'pk_2', title:nSessions(12), sessions:12, price:7800,  days:75, active:true, createdAt:Date.now()},
    {id:'pk_3', title:nSessions(16), sessions:16, price:10000, days:90, active:true, createdAt:Date.now()},
  ];
  db.subs = [
    {id:'sub_1', clientId:'cl_0', packageId:'pk_1', total:8,  used:6, price:5600, ts: Date.now() - 22 * DAY, expiresAt: Date.now() + 38 * DAY},
    {id:'sub_2', clientId:'cl_3', packageId:'pk_2', total:12, used:9, price:7800, ts: Date.now() - 30 * DAY, expiresAt: Date.now() + 45 * DAY},
  ];

  /* історія за 70 днів назад + розклад на 10 днів уперед */
  const price = db.settings.price;
  const mk = (clientId, date, h, m, o) => ({
    id: uid('ses'), clientId, start: new Date(new Date(date).setHours(h, m, 0, 0)).toISOString(),
    dur:60, type:'personal', price, paid:true, status:'done', subId:null, note:'', createdAt: Date.now(), ...o,
  });
  const list = [];
  for (let d = 70; d >= 1; d--){
    const day = addDays(new Date(), -d);
    const wd = day.getDay();
    const count = wd === 0 ? 0 : (wd === 6 ? 2 : 3 + Math.floor(rnd() * 3));
    const slots = [8, 10, 11.5, 13, 15.5, 17, 18.5, 20];
    const used = [];
    for (let i = 0; i < count; i++){
      let s; do { s = pick(slots); } while (used.includes(s)); used.push(s);
      const c = pick(db.clients);
      const type = rnd() > .86 ? pick(['pair','online','split']) : 'personal';
      const sub = db.subs.find(x => x.clientId === c.id && rnd() > .6);
      const own = c.price || price;
      list.push(mk(c.id, day, Math.floor(s), (s % 1) * 60, {
        type, price: type === 'split' ? Math.round(own * 1.4) : (type === 'online' ? Math.round(own * .7) : own),
        dur: SES_TYPES[type].dur,
        subId: sub ? sub.id : null,
        paid: sub ? true : (d > 12 ? true : rnd() > .3),
        status: rnd() > .96 ? 'canceled' : 'done',
      }));
    }
  }
  /* сьогодні — як у референсі: 6 тренувань */
  const today = new Date();
  [[10,0,'cl_0','done',true],[11,30,'cl_1','done',false],[13,0,'cl_2','done',true],
   [15,30,'cl_3','planned',false],[17,0,'cl_5','planned',false],[19,0,'cl_4','planned',false]]
   .forEach(([h, m, c, st, paid]) => list.push(mk(c, today, h, m, {status:st, paid, subId: c === 'cl_0' ? 'sub_1' : null})));

  for (let d = 1; d <= 10; d++){
    const day = addDays(new Date(), d);
    if (day.getDay() === 0) continue;
    const slots = [9, 11, 13, 16, 18, 19.5];
    const count = 2 + Math.floor(rnd() * 3);
    const used = [];
    for (let i = 0; i < count; i++){
      let s; do { s = pick(slots); } while (used.includes(s)); used.push(s);
      const c = pick(db.clients);
      list.push(mk(c.id, day, Math.floor(s), (s % 1) * 60, {status:'planned', paid:false, price: c.price || price,
        subId: db.subs.find(x => x.clientId === c.id) ? db.subs.find(x => x.clientId === c.id).id : null}));
    }
  }
  db.sessions = list.sort((a, b) => +new Date(a.start) - +new Date(b.start));

  /* борг у Максима — як у референсі */
  const mx = db.sessions.filter(s => s.clientId === 'cl_1' && s.status === 'done');
  mx.slice(-1).forEach(s => { s.paid = false; s.subId = null; });

  db.sales = [
    {id:'sl_1', clientId:'cl_0', productId:'pr_1', qty:1, price:1400, ts: Date.now() - 4 * DAY},
    {id:'sl_2', clientId:'cl_2', productId:'pr_2', qty:1, price:800,  ts: Date.now() - 9 * DAY},
    {id:'sl_3', clientId:'cl_3', productId:'pr_3', qty:2, price:250,  ts: Date.now() - 12 * DAY},
    {id:'sl_4', clientId:'cl_5', productId:'pr_4', qty:1, price:600,  ts: Date.now() - 2 * DAY},
  ];
  db.notes = [
    {id:'nt_1', clientId:'cl_0', text:nm('t1','Збільшити робочу вагу в присіді на наступному тренуванні.'), ts: Date.now() - 2 * DAY},
    {id:'nt_2', clientId:'cl_0', text:nm('t2','Скаржиться на праве коліно — прибрати випади.'), ts: Date.now() - 9 * DAY},
    {id:'nt_3', clientId:'cl_3', text:nm('t3','Мета — рельєф до відпустки в вересні.'), ts: Date.now() - 5 * DAY},
  ];
  return db;
}

const Sheet = ({open, onClose, title, sub, children, tall}) => {
  useEffect(() => {
    if (!open) return;
    const esc = e => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', esc);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', esc); document.body.style.overflow = ''; };
  }, [open, onClose]);
  if (!open) return null;
  return (
    <Fragment>
      <div className="scrim" onClick={onClose}/>
      <div className="sheet" style={tall ? {minHeight:'70vh'} : null} role="dialog" aria-modal="true" aria-label={title || ''}>
        <div className="grip"/>
