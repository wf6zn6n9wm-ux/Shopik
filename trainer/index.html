   застосунку, щоб можна було перевірити «Відновити покупку». */
const DEMO_IAP_KEY = 'protrainer.iap.demo';
/* Контракт моста (native/iap-bridge.js реалізує його для Capacitor):
     platform            'ios' | 'android'
     buy(productId)   →  {ok, transactionId?, ts?, expiresAt?, error?}
     restore()        →  {ok, purchases:[{productId, transactionId, ts, expiresAt?}]}
     status()         →  {ok, active, productId?, expiresAt?, autoRenew?}   (необов'язково)
   Якщо магазин повідомляє expiresAt — беремо його, він знає про продовження
   й скасування більше, ніж застосунок. */
const IAP = {
  bridge(){ return (typeof window !== 'undefined' && window.ProTrainerIAP) || null; },
  platform(){ const b = IAP.bridge(); return b ? (b.platform || 'native') : 'demo'; },
  connected(){ return !!IAP.bridge(); },
  async status(){ const b = IAP.bridge(); return b && b.status ? b.status() : {ok:false}; },
  /* Імітація покупки — інструмент розробки, і місце їй лише там.
     На живому сайті магазину немає, тож без цієї перевірки кнопка
     «Продовжити» видавала б підписку задарма кожному, хто її натисне.
     Дозволяємо тільки локально або за явним прапорцем. */
  demoAllowed(){
    if (typeof window === 'undefined') return true;            /* перевірки в пісочниці */
    if (window.PRO_TRAINER_DEMO === true) return true;
    const h = (window.location && window.location.hostname) || '';
    return h === 'localhost' || h === '127.0.0.1' || h === '';
  },
  demo: {fail: false},
  demoRead(){ try { return JSON.parse(Box.get(DEMO_IAP_KEY) || 'null'); } catch { return null; } },
  demoWrite(v){ Box.set(DEMO_IAP_KEY, JSON.stringify(v)); },
  async buy(productId){
    const b = IAP.bridge();
    if (b) return b.buy(productId);
    if (!IAP.demoAllowed()) return {ok:false, error:'no_store'};
    await sleep(600);
    if (IAP.demo.fail) return {ok:false, error:'payment_declined'};
    const rec = {productId, transactionId: 'demo_' + uid('tx'), ts: Date.now()};
    IAP.demoWrite(rec);
    return {ok:true, transactionId: rec.transactionId, ts: rec.ts};
  },
  async restore(){
    const b = IAP.bridge();
    if (b) return b.restore();
    await sleep(500);
    const rec = IAP.demoRead();
    return {ok:true, purchases: rec ? [rec] : []};
  },
};

/* ─── оплата у вебі ───
   Магазин утримує 15–30% з кожного платежу, тому та сама підписка на сайті
   коштує дешевше — це те, що застосунок пропонує кнопкою «Активувати у WEB».
   Карток застосунок не бачить: він лише відкриває сторінку оплати в браузері,
   а потім питає сервер, чи з'явилась ліцензія на цей логін.

   Підписка живе на сервері й прив'язана до логіна, а доступ — до пристроїв:
   їх не більше WEB.devices, інакше знання чужої пошти давало б чужу підписку.

   ⚠️ Перед публікацією в App Store: посилання на зовнішню оплату з
   iOS-застосунку потребує окремого дозволу Apple (External Purchase Link
   Entitlement; у ЄС — DMA). Без нього кнопку слід лишити тільки у вебі —
   для цього достатньо не задавати WEB.base у нативній збірці.          */
const WEB = {
  base: 'https://pro-trainer.pro',   /* порожньо — той самий домен, що й сторінка */
  devices: 3,          /* скільки пристроїв на одну підписку */
  poll: 4000,          /* як часто питати сервер, поки чекаємо оплату */
  wait: 10 * 60 * 1000,/* скільки всього чекати */
};

const Web = {
  base(){
    if (WEB.base) return WEB.base.replace(/\/+$/, '');
    /* У нативній оболонці WebView теж відкритий по https — але на localhost,
       де лежить сам застосунок, а не сайт. Брати цю адресу за домен не можна:
       на Android кнопка вела б на https://localhost/pay, тобто в нікуди.
       Без заданого WEB.base кнопки оплати на сайті просто не буде. */
    const C = typeof window !== 'undefined' && window.Capacitor;
    if (C && C.getPlatform && C.getPlatform() !== 'web') return '';
    if (typeof location !== 'undefined' && /^https?:/.test(location.protocol)) return location.origin;
    return '';
  },
  enabled(){ return !!Web.base(); },
  login(){ const m = Disk.readMeta() || {}; return (m.account && m.account.login) || ''; },
  /* ідентифікатор пристрою переживає очищення даних — інакше кожне
     «Видалити всі дані» з'їдало б слот у ліцензії */
  device(){
    const m = Disk.readMeta() || {};
    if (m.device) return m.device;
    const id = uid('dev');
    Disk.writeMeta({...m, device: id});
    return id;
  },
  query(extra){
    return new URLSearchParams({login: Web.login(), device: Web.device(), lang: I18n.get(), ...(extra || {})});
  },
  payUrl(planId){ return Web.base() + '/pay?' + Web.query({plan: planId}); },
  accountUrl(){ return Web.base() + '/account?' + Web.query(); },
  open(url){
    if (typeof window === 'undefined') return;
    const C = window.Capacitor;
    const B = C && C.Plugins && C.Plugins.Browser;
    if (B && B.open) { B.open({url}); return; }   /* нативна оболонка: системний браузер */
    window.open(url, '_blank', 'noopener');
  },
  async ask(path, params){
    const base = Web.base();
    if (!base) return {ok:false, error:'web_disabled'};
    try {
      const q = new URLSearchParams({login: Web.login(), device: Web.device(), ...(params || {})});
      const r = await fetch(base + path + '?' + q, {headers:{'accept':'application/json'}});
      if (!r.ok) return {ok:false, error:'http_' + r.status};
      return await r.json();
    } catch (e){ return {ok:false, error:'network'}; }
  },
  /* {ok, active, plan, expiresAt, autoRenew, devices, error} */
  licence(){ return Web.ask('/api/licence'); },
  /* {ok, started, startedAt, endsAt, expired} — дата першого запуску
     живе на сервері, інакше перевстановлення давало б нові 14 днів */
  /* мову передаємо на старті: нею потім прийде лист про кінець пробного */
  trial(start){ return Web.ask('/api/trial', start ? {start: '1', lang: I18n.get()} : null); },
  /* прив'язати цей пристрій до вже оплаченої підписки */
  claim(){ return Web.ask('/api/claim'); },
  /* Відновлення пароля. Логін передаємо явно: людина його щойно ввела, а
     в пам'яті пристрою лежить той, під яким заходили востаннє. */
  async at(path, params){
    const base = Web.base();
    if (!base) return {ok:false, error:'web_disabled'};
    try {
      const r = await fetch(base + path + '?' + new URLSearchParams(params),
                            {headers:{'accept':'application/json'}});
      const j = await r.json().catch(() => null);
      return j || {ok:false, error:'http_' + r.status};
    } catch (e){ return {ok:false, error:'network'}; }
  },
  sendCode(login){ return Web.at('/api/reset', {login, lang: I18n.get()}); },
  checkCode(login, code){ return Web.at('/api/reset', {login, code}); },
};

/* ─── копія бази на сервері ───
   Сховище браузера недовговічне: Safari стирає його приблизно за тиждень
   без відвідувань, чистка історії — одразу, а новий телефон починає з
   порожнього кабінету. Для тренера це втрата бази клієнтів.

   Тому база їде на сервер — але зашифрованою. Ключ копії лежить на
   пристрої, на сервері поруч із шифротекстом лежить лише замок на
   ньому — той самий ключ, зашифрований паролем кабінета. Той, хто знає
   пароль, відкриє копію на будь-якому пристрої.

   Відновлення. За замовчуванням ми лишаємо в себе й сам ключ, щоб
   повернути базу тому, хто забув пароль: підтвердження — код на пошту.
   Це чесна ціна: ми технічно можемо відкрити копію. Кому такий обмін не
   підходить, вимикає відновлення в налаштуваннях — тоді ключ у нас не
   зберігається, і забутий пароль означає втрату копії.               */
const Cloud = {
  key: null,
  status: 'off',                       // off | ok | saving | error
  why: '',                             // чому не вдалося — щоб не мовчати
  at: 0,                               // коли востаннє збереглось
  timer: null,
  listeners: new Set(),
  meta(){ return Disk.readMeta() || {}; },
  /* Ключ копії заводиться під час реєстрації або входу — тобто там, де
     людина вводить пароль. Кабінети, заведені до появи копій, живуть без
     нього: перемикач у налаштуваннях каже «увімкнено», а на сервер не
     їде нічого. Тому стан ключа видно окремо — щоб налаштування не
     обіцяли того, чого немає. */
  armed(){ return !!Cloud.meta().cloudKey; },
  on(){ return Web.enabled() && Cloud.armed() && Store.state.settings.cloud !== false; },
  emit(){ Cloud.listeners.forEach(f => f(Cloud.status, Cloud.at)); },
  async ready(){
    const m = Cloud.meta();
    if (!m.cloudKey) return null;
    if (!Cloud.key) Cloud.key = await Vault.importRaw(m.cloudKey);
    return Cloud.key;
  },
  /* чи лишати ключ у нас, щоб уміти відновити пароль */
  recovers(){ return Store.state.settings.recover !== false; },
  /* ключ, замок і сіль запам'ятовуються після входу — далі пароль не потрібен */
  /* Поява й зникнення ключа — така сама зміна стану, як і збереження:
     екран, який каже «копії немає», інакше лишався б із учорашньою
     правдою, доки щось інше не змусить його перемалюватись. */
  remember(c){
    Disk.writeMeta({...Cloud.meta(), cloudKey: c.raw, cloudToken: c.token, cloudWrap: c.wrap, salt: c.salt});
    Cloud.key = c.key;
    Cloud.emit();
  },
  forget(){
    const m = Cloud.meta();
    delete m.cloudKey; delete m.cloudToken; delete m.cloudWrap;
    Disk.writeMeta(m);
    Cloud.key = null;
    Cloud.emit();
  },
  /* Пишемо не на кожен дотик: інакше кожне натискання летіло б у мережу.
     Останнє збереження за десять секунд перекриває всі попередні. */
  later(json){
    if (!Cloud.on()) return;
    clearTimeout(Cloud.timer);
    Cloud.timer = setTimeout(() => Cloud.push(json), 10000);
  },
  async push(json){
    if (!Cloud.on()) return {ok:false, error:'off'};
    const m = Cloud.meta();
    try {
      await Cloud.ready();
      Cloud.status = 'saving'; Cloud.emit();
      const {iv, ct} = await Vault.encryptWith(Cloud.key, json || JSON.stringify(Store.state));
      /* keep — сам ключ копії. Їде, лише поки ввімкнене відновлення;
         порожній рядок — прямий наказ серверу свій примірник стерти. */
      const r = await fetch(Web.base() + '/api/db?' + new URLSearchParams({login: Web.login(), token: m.cloudToken}),
        {method:'POST', headers:{'Content-Type':'application/json'},
         body: JSON.stringify({salt: m.salt, wrap: m.cloudWrap || null, iv, ct,
                               keep: Cloud.recovers() ? m.cloudKey : ''})});
      const j = await r.json().catch(() => null);
      if (!j || !j.ok) throw new Error((j && j.error) || 'http_' + r.status);
      Cloud.status = 'ok'; Cloud.why = ''; Cloud.at = j.savedAt; Cloud.emit();
      return j;
    } catch (e){
      Cloud.status = 'error'; Cloud.why = String((e && e.message) || e); Cloud.emit();
      return {ok:false, error: Cloud.why};
    }
  },
  /* що лежить на сервері для цього логіна — без пароля, лише факт і сіль */
  peek(login){ return Web.at('/api/db', {login}); },
  /* забрати й розшифрувати; ключ виводиться з пароля тут-таки */
  async restore(login, token, key){
    const r = await Web.at('/api/db', {login, token});
    if (!r.ok || !r.has) return {ok:false, error: r.error || 'empty'};
    try {
      const json = await Vault.decryptWith(key, r.iv, r.ct);
      return {ok:true, json, savedAt: r.savedAt};
    } catch (e){ return {ok:false, error:'bad_key'}; }
  },
  /* ─── відкрити копію паролем ───
     Повний шлях для нового пристрою: вивести ключ із пароля, довести
     ним своє право забрати запис, зняти замок і розшифрувати базу.

     wrong_token означає рівно одне: копія є, але пароль не той. Це не
     помилка мережі, і поводитись із нею як із «копії немає» не можна —
     інакше людина мовчки отримала б порожній кабінет замість своєї
     бази. Тому помилку віддаємо назовні як є.

     Записи без замка — з першої версії копій, там ключем був сам
     пароль. Читаємо їх як були; наступний вхід перекладе кабінет на
     новий лад сам.                                                    */
  async open(login, pass, salt){
    const probe = await Vault.cloud(pass, salt);
    const r = await Web.at('/api/db', {login, token: probe.token});
    if (!r.ok) return {ok:false, error: r.error || 'denied'};
    if (!r.has) return {ok:false, error:'empty'};
    try {
      /* Запис без замка — з першої версії копій: там ключем був сам
         пароль. Читаємо його як є, але замок тут-таки й робимо, щоб
         наступний же запис поклав копію на новий лад. Без цього рядка
         кабінет лишався б старим назавжди, хоч би скільки разів у нього
         заходили. */
      const raw = r.wrap ? await Vault.unwrap(probe.pkRaw, r.wrap) : probe.pkRaw;
      const wrap = r.wrap || await Vault.encryptWith(await Vault.importRaw(probe.pkRaw), raw);
      const cred = {...probe, raw, key: await Vault.importRaw(raw), wrap};
      return {ok:true, json: await Vault.decryptWith(cred.key, r.iv, r.ct), cred, savedAt: r.savedAt};
    } catch (e){ return {ok:false, error:'bad_key'}; }
  },
  /* ─── новий пароль після відновлення ───
     Квиток видає /api/reset тому, хто підтвердив пошту. Він дозволяє
     замінити замок і token — але не саму копію: ключ від неї не
     змінюється, тож перекладати мегабайти даних не доводиться. */
  async rekey(login, ticket, c){
    const r = await fetch(Web.base() + '/api/db?' + new URLSearchParams({login, token: c.token, ticket}),
      {method:'POST', headers:{'Content-Type':'application/json'},
       body: JSON.stringify({wrap: c.wrap, salt: c.salt})});
    return (await r.json().catch(() => null)) || {ok:false, error:'http_' + r.status};
  },
};

/* ─── переписка з підтримкою ───
   Тренер, у якого щось не працює, пошти не напише: він або спитає в
   месенджері, або мовчки закриє застосунок. Тому питання ставиться прямо
   тут, а відповідь приходить сюди ж.

   Живого зв'язку немає: поки екран відкритий, застосунок перепитує
   сервер раз на кілька секунд. На око різниця непомітна, а сокетів на
   нашому тарифі не буває.

   Хто ми такі — доводимо тим самим token, яким відкривається копія бази.
   Його немає в кабінетів, заведених до появи паролів; для них лишається
   пристрій, і сервер упізнає його сам.                                  */
/* Через скільки нагадати про копію тому, хто відклав. Не «ніколи»: ціна
   втраченої бази клієнтів від відкладання не зменшується. */
const CLOUD_NAG = 14 * 86400000;

const HELP_POLL = 5000;

const Help = {
  msgs: [],
  unread: 0,
  loaded: false,
  listeners: new Set(),
  emit(){ Help.listeners.forEach(f => f(Help.msgs, Help.unread)); },
  can(){ return Web.enabled() && !!Web.login(); },
  q(extra){
    const m = Disk.readMeta() || {};
    return {login: Web.login(), device: Web.device(), token: m.cloudToken || '',
            lang: I18n.get(), ...(extra || {})};
  },
  async load(){
    if (!Help.can()) return {ok:false, error:'web_disabled'};
    const r = await Web.at('/api/chat', Help.q());
    if (!r || !r.ok) return r || {ok:false, error:'network'};
    /* Нова відповідь, поки екран закритий, — привід сказати про це там,
       де тренер і так дивиться: у сповіщеннях. Один раз на відповідь. */
    const fresh = r.unread > Help.unread && Help.loaded;
    Help.msgs = r.msgs || [];
    Help.unread = r.unread || 0;
    Help.loaded = true;
    Help.emit();
    if (fresh) Act.notify({title: t('help.reply','Відповідь підтримки'),
                           body: (Help.msgs[Help.msgs.length - 1] || {}).text || '',
                           type:'info', to:'support'});
    return r;
  },
  async send(text){
    if (!Help.can()) return {ok:false, error:'web_disabled'};
    const r = await fetch(Web.base() + '/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Help.q({text})),
    }).then(x => x.json().catch(() => null)).catch(() => null);
    if (r && r.ok) await Help.load();
    return r || {ok:false, error:'network'};
  },
  async seen(){
    if (!Help.can() || !Help.unread) return;
    Help.unread = 0; Help.emit();
    await fetch(Web.base() + '/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Help.q({seen: 1})),
    }).catch(() => {});
  },
};

/* ─── нагадування ───
   У браузері сповіщення живуть, поки відкритий застосунок. У нативній
   оболонці (@capacitor/local-notifications) їх можна запланувати наперед —
   тоді вони приходять і з закритим застосунком. Розклад перескладається
   щоразу, коли змінюються тренування або налаштування.                  */
/* скільки тримати позначки «це нагадування вже показували» */
const FIRED_KEEP = 30 * 86400000;

const NOTIF_KEY = KEY + '.notif';
const NOTIF_LIMIT = 56;      /* iOS тримає не більше 64 на застосунок — лишаємо запас */
const NOTIF_DAYS  = 30;      /* далі планувати немає сенсу: розклад ще зміниться */
const NOTIF_EXTRA = 0.4;     /* яку частку бюджету можна віддати другим інтервалам */
const NOTIF_EXTRA_DAYS = 2;  /* короткий інтервал корисний лише найближчим дням */
const minsLabel = m => m >= 60 ? (m / 60) + ' ' + t('unit.hour','год') : m + ' ' + t('unit.min','хв');

const Notifier = {
  plugin(){
    return (typeof window !== 'undefined' && window.Capacitor && window.Capacitor.Plugins
      && window.Capacitor.Plugins.LocalNotifications) || null;
  },
  native(){ return !!Notifier.plugin(); },
  granted: false,
  async ensure(){
    const P = Notifier.plugin();
    if (P){
      try { const r = await P.requestPermissions(); Notifier.granted = !!r && r.display === 'granted'; }
      catch { Notifier.granted = false; }
      return Notifier.granted;
    }
    if (typeof Notification === 'undefined') return false;
    try { Notifier.granted = (await Notification.requestPermission()) === 'granted'; } catch { Notifier.granted = false; }
    return Notifier.granted;
  },
  permission(){
    if (Notifier.native()) return Notifier.granted ? 'granted' : 'default';
    return typeof Notification === 'undefined' ? 'unsupported' : Notification.permission;
  },
  show(title, body, tag){
    const P = Notifier.plugin();
    if (P){
      P.schedule({notifications: [{id: Notifier.id(tag, 0), title, body, schedule: {at: new Date(Date.now() + 800)}}]})
       .catch(() => {});
      return;
    }
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted')
        new Notification(title, {body, tag, icon: 'icon.svg'});
    } catch {}
  },
  /* стабільний числовий id: плагін приймає лише int */
  id(sessionId, min){
    let h = 0;
    const src = String(sessionId) + '|' + min;
    for (let i = 0; i < src.length; i++) h = (h * 31 + src.charCodeAt(i)) % 2000000000;
    return h + 1;
  },
  /* Розклад наперед.

     iOS тримає не більше 64 запланованих сповіщень на застосунок, тож
     бюджет — головне обмеження, а не горизонт. Раніше ми брали перші 60
     за часом: у тренера з шістьма тренуваннями на день два інтервали
     з'їдали бюджет за п'ять днів, а далі тиша. Тому спершу даємо по
     одному сповіщенню на кожне тренування — так розклад тягнеться на
     тижні, — і лише залишком бюджету додаємо другий інтервал найближчим.

     Якщо тренувань більше, ніж слотів, останнім ставимо нагадування
     відкрити застосунок: без нього тренер просто перестав би отримувати
     сповіщення й не дізнався б про це.                                */
  build(db){
    const now = Date.now(), horizon = now + NOTIF_DAYS * DAY;
    const mins = [...(db.settings.notif.before || [])].sort((a, b) => b - a);
    if (!mins.length) return {list: [], until: 0, truncated: false};

    const ses = db.sessions
      .filter(x => x.status === 'planned' && +new Date(x.start) > now && +new Date(x.start) < horizon)
      .sort((a, b) => +new Date(a.start) - +new Date(b.start));

    const make = (x, m) => {
      const at = +new Date(x.start) - m * 60000;
      if (at <= now + 30000 || at >= horizon) return null;
      const c = byId(db.clients, x.clientId);
      return {id: Notifier.id(x.id, m), at: new Date(at),
        title: '🏋️ ' + t('n.before','Тренування за') + ' ' + minsLabel(m),
        body: (c ? c.name : t('session.one','Тренування')) + ' · ' + fmtTime(x.start)};
    };

    /* Другий, короткий інтервал («за 15 хвилин») має сенс лише для
       найближчих днів — саме він рятує від запізнення. Тому місце під
       нього резервуємо наперед, інакше покриття дальніх днів забрало б
       увесь бюджет і другий інтервал не дістався б нікому. */
    const near = ses.filter(x => +new Date(x.start) < now + NOTIF_EXTRA_DAYS * DAY);
    const reserve = mins.length > 1
      ? Math.min(near.length * (mins.length - 1), Math.round(NOTIF_LIMIT * NOTIF_EXTRA))
      : 0;

    const out = [], covered = [];
    const taken = new Set();
    const push = n => { out.push(n); taken.add(n.id); };
    /* найбільший інтервал головний, але для тренування «вже за 20 хвилин»
       він у минулому — тоді беремо наступний, що ще попереду */
    const primary = x => mins.map(m => make(x, m)).find(n => n && !taken.has(n.id));

    let i = 0;
    for (; i < ses.length && out.length < NOTIF_LIMIT - reserve; i++){
      const n = primary(ses[i]);
      if (n){ push(n); covered.push(ses[i]); }
    }
    /* Найближчі визначають лише розмір резерву. Витрачаємо його по
       черзі з найранішого: при вільному розкладі другий інтервал має
       дістатись усім, а не тільки тренуванням на два дні вперед. */
    for (const x of covered){
      if (out.length >= NOTIF_LIMIT) break;
      for (let k = 0; k < mins.length && out.length < NOTIF_LIMIT; k++){
        const n = make(x, mins[k]);
        if (n && !taken.has(n.id)) push(n);
      }
    }
    /* якщо резерв не знадобився — дотягуємо покриття далі */
    for (; i < ses.length && out.length < NOTIF_LIMIT; i++){
      const n = primary(ses[i]);
      if (n){ push(n); covered.push(ses[i]); }
    }

    const truncated = ses.length > covered.length;
    const until = covered.length ? +new Date(covered[covered.length - 1].start) : 0;
    if (truncated && until){
      /* вранці наступного дня після останнього покритого тренування */
      const at = new Date(until);
      at.setDate(at.getDate() + 1);
      at.setHours(9, 0, 0, 0);
      if (+at > now) out.push({id: Notifier.id('refresh', 0), at,
        title: '🏋️ PRO Trainer',
        body: t('n.refresh','Відкрийте застосунок, щоб оновити нагадування на наступні дні')});
    }
    out.sort((a, b) => a.at - b.at);
    return {list: out, until, truncated};
  },
  plan(db){ return Notifier.build(db).list; },
  /* що показати в налаштуваннях: до якої дати розклад справді дотягується */
  coverage(db){
    const r = Notifier.build(db);
    return {count: r.list.length, until: r.until, truncated: r.truncated};
  },
  async sync(db){
    const P = Notifier.plugin();
    if (!P) return {ok:false, native:false};
    if (!Notifier.granted && !(await Notifier.ensure())) return {ok:false, denied:true};
    let prev = [];
    try { prev = JSON.parse(Box.get(NOTIF_KEY) || '[]'); } catch {}
    try { if (prev.length) await P.cancel({notifications: prev.map(id => ({id}))}); } catch {}
    const list = Notifier.plan(db);
    try {
      if (list.length) await P.schedule({notifications: list.map(x => ({
        id: x.id, title: x.title, body: x.body, schedule: {at: x.at}, smallIcon: 'ic_stat_icon',
      }))});
    } catch (e){ return {ok:false, error: String(e)}; }
    Box.set(NOTIF_KEY, JSON.stringify(list.map(x => x.id)));
    return {ok:true, scheduled: list.length};
  },
};

const Access = {
  listeners: new Set(),
  emit(){ Access.listeners.forEach(f => f()); Store.emit(); },
  read(){ const m = Disk.readMeta() || {}; return m.access || {}; },
  write(patch){
    const m = Disk.readMeta() || {};
    const access = {...(m.access || {}), ...patch};
    Disk.writeMeta({...m, access});
    Sync.push('access', access);          /* сервер стане джерелом правди, коли з'явиться */
    Access.emit();
    return access;
  },
  /* Пробний період прив'язаний до акаунта і стартує один раз. Локальну
     дату ставимо одразу — застосунок має працювати й без мережі, — а
     сервер запам'ятовує її як справжню: інакше перевстановлення давало б
     нові 14 днів скільки завгодно разів. */
  startTrial(){
    const a = Access.read();
    if (a.trialStartedAt) return a;
    const next = Access.write({trialStartedAt: Date.now(), status:'trial'});
    if (Web.enabled() && Web.login()) Web.trial(true).then(Access.fromTrial, () => {});
    return next;
  },
  /* відповідь сервера про пробний період головніша за локальну дату,
     але лише в один бік: підсунути пізнішу дату й подовжити собі
     пробний період не вийде */
  fromTrial(r){
    if (!r || !r.started || !r.startedAt) return {ok:false};
    const a = Access.read();
    if (a.trialStartedAt && a.trialStartedAt <= r.startedAt) return {ok:true, kept:true};
    Access.write({trialStartedAt: r.startedAt, status: a.status || 'trial'});
    return {ok:true, moved:true};
  },
  trialEnds(){ const a = Access.read(); return a.trialStartedAt ? a.trialStartedAt + TRIAL_DAYS * DAY : 0; },

  state(now){
    const a = Access.read();
    const t = now || Date.now();
    const sub = (a.expiresAt && a.plan)
      ? (t < a.expiresAt
          ? {kind: a.autoRenew === false ? 'SUBSCRIPTION_CANCELLED' : 'SUBSCRIPTION_ACTIVE',
             allowed:true, until:a.expiresAt, plan:a.plan}
          : {kind:'SUBSCRIPTION_EXPIRED', allowed:false, until:a.expiresAt, plan:a.plan})
      : null;
    if (sub && sub.allowed) return sub;

    const trial = a.trialStartedAt ? (() => {
      const ends = a.trialStartedAt + TRIAL_DAYS * DAY;
      const left = Math.max(0, Math.ceil((ends - t) / DAY));
      return left > 0
        ? {kind:'TRIAL_ACTIVE', allowed:true, left, until:ends}
        : {kind:'TRIAL_EXPIRED', allowed:false, until:ends};
    })() : null;
    if (trial && trial.allowed) return trial;

    if (a.status === 'pending') return {kind:'PAYMENT_PENDING', allowed:true, plan:a.pendingPlan};
    if (a.status === 'failed')  return {kind:'PAYMENT_FAILED', allowed:false, error:a.error, plan:a.pendingPlan};
    return sub || trial || {kind:'TRIAL_NOT_STARTED', allowed:true};
  },
  allowed(){ return Access.state().allowed; },

  async purchase(planId){
    const plan = planById(planId);
    if (!plan) return {ok:false, error:'unknown_plan'};
    Access.write({status:'pending', pendingPlan: planId, error:null});
    try {
      const r = await IAP.buy(plan.productId);
      if (!r || !r.ok) throw new Error((r && r.error) || 'payment_failed');
      /* продовження додається до чинного строку, а не обнуляє його */
      const from = Math.max(Date.now(), Access.read().expiresAt || 0);
      const until = r.expiresAt || +addMonthsKeep(new Date(from), plan.months);
      Access.write({status:'active', plan: plan.id, productId: plan.productId,
        purchasedAt: Date.now(), expiresAt: until,
        autoRenew: true, transactionId: r.transactionId, lastVerifiedAt: Date.now(),
        pendingPlan: null, error: null});
      return {ok:true};
    } catch (e){
      /* дані недоторкані — лише позначаємо, що оплата не пройшла */
      Access.write({status:'failed', error: String((e && e.message) || e)});
      return {ok:false, error: String((e && e.message) || e)};
    }
  },
  async restore(){
    try {
      /* підписку могли оформити на сайті — тоді її треба прив'язати
         до цього пристрою, а не шукати в магазині */
      if (Web.enabled() && Web.login()){
        const c = await Web.claim();
        if (c && c.active) return Access.fromWeb(c);
        if (c && c.error === 'device_limit') return {ok:false, error:'device_limit'};
      }
      const r = await IAP.restore();
      const list = (r && r.purchases) || [];
      if (!list.length) return {ok:false, error:'nothing_to_restore'};
      const rec = list[list.length - 1];
      const plan = PLANS.find(p => p.productId === rec.productId);
      if (!plan) return {ok:false, error:'unknown_product'};
      const expires = rec.expiresAt || +addMonthsKeep(new Date(rec.ts || Date.now()), plan.months);
      Access.write({status: expires > Date.now() ? 'active' : 'expired', plan: plan.id, productId: plan.productId,
        purchasedAt: rec.ts || Date.now(), expiresAt: expires, autoRenew: true,
        transactionId: rec.transactionId, lastVerifiedAt: Date.now(), error: null});
      return {ok: expires > Date.now(), expiresAt: expires};
    } catch (e){ return {ok:false, error: String((e && e.message) || e)}; }
  },
  /* ліцензія з сайту: сервер — джерело правди, дату рахує він */
  fromWeb(lic){
    if (!lic || !lic.active) return {ok:false};
    const plan = planById(lic.plan);
    Access.write({status:'active', source:'web', plan: lic.plan,
      productId: plan ? plan.productId : null,
      purchasedAt: lic.purchasedAt || Date.now(), expiresAt: lic.expiresAt,
      autoRenew: lic.autoRenew !== false, transactionId: lic.orderId || null,
      lastVerifiedAt: Date.now(), pendingPlan: null, error: null});
    return {ok:true, expiresAt: lic.expiresAt};
  },
  /* чекаємо, поки на сайті пройде оплата; кожні WEB.poll питаємо сервер */
  async awaitWeb(onTick){
    const till = Date.now() + WEB.wait;
    while (Date.now() < till){
      const lic = await Web.licence();
      if (lic && lic.active) return Access.fromWeb(lic);
      if (onTick && onTick() === false) return {ok:false, error:'cancelled'};
      await sleep(WEB.poll);
    }
    return {ok:false, error:'timeout'};
  },
  cancel(){ return Access.write({autoRenew: false}); },        /* доступ лишається до дати */
  resume(){ return Access.write({autoRenew: true}); },
  /* без мережі нічого не блокуємо: працюємо за локальним записом,
     а щойно з'явиться зв'язок — перевіряємо статус у магазині */
  async verify(){
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return {ok:false, offline:true};
    const a = Access.read();
    /* спершу пробний період: він міг початись на іншому пристрої,
       та й після перевстановлення локальної дати просто немає */
    if (Web.enabled() && Web.login() && !a.expiresAt){
      const r = await Web.trial(false);
      if (r && r.started) Access.fromTrial(r);
      else if (r && r.ok && !r.started && a.trialStartedAt) Web.trial(true).then(Access.fromTrial, () => {});
    }
    if (!a.plan) return {ok:false};
    if (a.source === 'web'){
      const lic = await Web.licence();
      if (!lic || lic.ok === false) return {ok:false};
      if (lic.active) return Access.fromWeb(lic);
      /* сервер — джерело правди для веб-підписки: якщо він каже «немає»,
         то й строку немає, інакше локальний запис пережив би скасування */
      Access.write({status:'expired', autoRenew:false, expiresAt: Date.now(), lastVerifiedAt: Date.now()});
      return {ok:true, active:false};
    }
    /* магазин знає про продовження й скасування — його відповідь головніша */
    const st = await IAP.status();
    if (st && st.ok){
      Access.write({
        expiresAt: st.expiresAt || a.expiresAt,
        autoRenew: st.autoRenew === undefined ? a.autoRenew : st.autoRenew,
        status: st.active ? 'active' : 'expired',
        lastVerifiedAt: Date.now(),
      });
      return {ok:true, active: st.active};
    }
    const r = await IAP.restore();
    if (!r || !r.ok) return {ok:false};
    Access.write({lastVerifiedAt: Date.now()});
    return {ok:true};
  },
};
/* Стан копії на сервері. Досі його ніхто не питав: Cloud рахував його
   для себе, а на екрані не було нічого — зірвана копія мовчала. */
function useCloud(){
  const [, force] = useState(0);
  useEffect(() => {
    const f = () => force(x => x + 1);
    Cloud.listeners.add(f);
    return () => Cloud.listeners.delete(f);
  }, []);
  return {status: Cloud.status, why: Cloud.why, at: Cloud.at};
}

/* Переписка з підтримкою. Той самий підхід: стан живе поза React, а
   екран лише слухає — інакше повідомлення губилися б при кожному
   переході між сторінками. */
function useHelp(){
  const [, force] = useState(0);
  useEffect(() => {
    const f = () => force(x => x + 1);
    Help.listeners.add(f);
    return () => Help.listeners.delete(f);
  }, []);
  return {msgs: Help.msgs, unread: Help.unread, loaded: Help.loaded};
}

function useAccess(){
  const [, force] = useState(0);
  useEffect(() => { const f = () => force(x => x + 1); Access.listeners.add(f); return () => Access.listeners.delete(f); }, []);
  return Access.state();
}

/* ─────────────────── фінансовий рушій ───────────────────
   Оборот   — скільки заплатив клієнт.
   Залу     — комісія клубу: % / фіксована сума / без комісії.
   Чистими  — те, що лишається тренеру.
   Товари комісією залу не обкладаються: там прибуток = ціна − закупка. */
function split(gross, s){
  const g = Math.max(0, Math.round(Number(gross) || 0));
  let gym = 0;
  if (!s || s.gymMode === 'percent') gym = Math.round(g * ((s ? s.gymPercent : 15) / 100));
  else if (s.gymMode === 'fixed') gym = Math.min(g, Math.round(s.gymFixed || 0));
  else gym = 0;
  return {gross:g, gym, net:g - gym};
}
/* тренування, які реально приносять гроші (скасовані — ні) */
const isBillable = s => s.status !== 'canceled' && s.status !== 'noshow';
const SES_STATUS = {
  planned:  {t:'Заплановано', tone:'acc'},
  done:     {t:'Проведено',   tone:'pos'},
  canceled: {t:'Скасовано',   tone:'mut'},
  noshow:   {t:'Не прийшов',  tone:'neg'},
};
const statusTitle = k => t('status.' + k, (SES_STATUS[k] || SES_STATUS.planned).t);
const inRange = (ts, from, to) => ts >= +from && ts < +to;

function periodRange(kind, base){
  const b = d0(base || new Date());
  if (kind === 'day')   return [b, addDays(b, 1)];
  if (kind === 'week')  { const w = (b.getDay() + 6) % 7; const from = addDays(b, -w); return [from, addDays(from, 7)]; }
  if (kind === 'month') { const from = new Date(b.getFullYear(), b.getMonth(), 1); return [from, addMonths(from, 1)]; }
  if (kind === 'year')  { const from = new Date(b.getFullYear(), 0, 1); return [from, new Date(b.getFullYear() + 1, 0, 1)]; }
  return [b, addDays(b, 1)];
}

function stats(db, from, to){
  const S = db.settings;
  const ses = db.sessions.filter(s => isBillable(s) && inRange(+new Date(s.start), from, to));
  const gross = sum(ses, s => s.price);
  const gym   = sum(ses, s => split(s.price, S).gym);
  const sales = db.sales.filter(x => inRange(x.ts, from, to));
  const salesRevenue = sum(sales, x => x.price * x.qty);
  const salesProfit  = sum(sales, x => {
    const p = byId(db.products, x.productId);
    return (x.price - (p ? p.cost : 0)) * x.qty;
  });
  const uniq = new Set(ses.map(s => s.clientId));
  const newC = db.clients.filter(c => inRange(c.createdAt, from, to)).length;
  const subsSold = sum(db.subs.filter(x => inRange(x.ts, from, to)), x => x.price);
  const done = ses.filter(s => s.status === 'done').length;
  /* ─── зароблене й заплановане ───
     Оборот рахує всі тренування періоду, зокрема ті, що ще попереду. Для
     обороту це правильно, а для слова «заробив» — ні: о восьмій ранку
     тренер бачив увесь день як уже отриманий, а потім число зменшувалось,
     коли хтось не приходив. Тому рахуємо окремо: зароблене — це
     проведене, решта — план. */
  const doneSes = ses.filter(s => s.status === 'done');
  const earned = sum(doneSes, s => split(s.price, S).net);
  const debt = sum(ses.filter(isDebt), owed);
  return {
    gross, gym, net: gross - gym, count: ses.length, done,
    earned, planned: (gross - gym) - earned, plannedCount: ses.length - doneSes.length,
    avg: ses.length ? Math.round(gross / ses.length) : 0,
    salesRevenue, salesProfit, salesCount: sum(sales, x => x.qty),
    clients: uniq.size, newClients: newC, subsSold,
    perClient: uniq.size ? Math.round((gross - gym) / uniq.size) : 0,
    sesPerClient: uniq.size ? Math.round(ses.length / uniq.size * 10) / 10 : 0,
    total: gross - gym + salesProfit, debt,
  };
}
/* ─────────── експорт фінансів у CSV ───────────
   Те, що тренер віддає бухгалтеру: список рухів грошей за період.

   Головна пастка тут — абонемент. Клієнт платить за нього одразу, але в
   дохід гроші заходять у міру проведення тренувань. Якщо покласти в один
   стовпець і покупку абонемента, і тренування з нього, сума задвоїться.
   Тому в кожного рядка є стовпець «У доході»: покупка абонемента —
   «ні», проведене з нього тренування — «так». Підсумок рахується тільки
   по «так» і сходиться з тим, що показує екран «Фінанси».             */
const CSV_SEP = () => (LANG === 'en' ? ',' : ';');   /* Excel слухає роздільник списку локалі */
const csvCell = v => {
  const s = String(v === null || v === undefined ? '' : v);
  return /["\n;,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const csvRows = rows => rows.map(r => r.map(csvCell).join(CSV_SEP())).join('\r\n');

function financeCsv(db, from, to){
  const S = db.settings;
  const name = id => { const c = byId(db.clients, id); return c ? c.name : '—'; };
  const day = ts => iso(new Date(ts));
  const YES = t('csv.yes','так'), NO = t('csv.no','ні');
  const rows = [];

  db.sessions
    .filter(x => isBillable(x) && inRange(+new Date(x.start), from, to))
    .forEach(x => {
      const m = split(x.price, S);
      rows.push([day(x.start), fmtTime(x.start), t('csv.session','Тренування'), name(x.clientId),
        typeTitle(x.type), m.gross, m.gym, m.net,
        x.subId ? t('pay.package','З абонемента') : x.paid ? t('pay.paid','Оплачено') : t('pay.debt','Не оплачено'),
        YES]);
    });

  db.sales.filter(x => inRange(x.ts, from, to)).forEach(x => {
    const pr = byId(db.products, x.productId);
    const gross = x.price * x.qty;
    const profit = (x.price - (pr ? pr.cost : 0)) * x.qty;
    rows.push([day(x.ts), '', t('csv.goods','Товар'), name(x.clientId),
      (pr ? pr.name : '—') + ' × ' + x.qty, gross, 0, profit, t('pay.paid','Оплачено'), YES]);
  });

  db.subs.filter(x => inRange(x.ts, from, to)).forEach(x => {
    const pk = byId(db.packages, x.packageId);
    rows.push([day(x.ts), '', t('csv.sub','Абонемент'), name(x.clientId),
      (pk ? pk.title : nSessions(x.total)) + ' · ' + t('csv.prepaid','передоплата'),
      x.price, 0, 0, t('pay.paid','Оплачено'), NO]);
  });

  rows.sort((a, b) => (a[0] === b[0] ? String(a[1]).localeCompare(String(b[1])) : a[0].localeCompare(b[0])));

  const st = stats(db, from, to);
  const head = [t('csv.date','Дата'), t('csv.time','Час'), t('csv.kind','Тип'), t('csv.client','Клієнт'),
    t('csv.what','Опис'), t('csv.gross','Сума'), t('fin.fee','Комісія залу'), t('home.net','Чистими'),
    t('csv.pay','Оплата'), t('csv.counted','У доході')];
  /* Два підсумки, а не один: якщо просто скласти стовпець «Сума», вийде
     більше, ніж «Разом» — на суму куплених абонементів. Тому вони
     виведені окремим рядком, і розбіжність перестає бути загадкою. */
  const foot = [[t('csv.total','Разом'), '', '', '', t('csv.total.note','тільки рядки, де «У доході» = так'),
    st.gross + st.salesRevenue, st.gym, st.total, '', '']];
  if (st.subsSold) foot.push([t('csv.sub','Абонемент'), '', '', '',
    t('csv.sub.note','передоплата: у дохід заходить у міру проведення тренувань'),
    st.subsSold, 0, 0, '', '']);

  return '\ufeff' + csvRows([head, ...rows, ...foot]) + '\r\n';
}

/* Дохід по днях або місяцях — одним проходом.

   Раніше кожна точка графіка рахувалась через stats(), тобто перебирала
   всю історію тренувань: 30 точок × 5 000 тренувань на третій рік роботи
   = 150 000 проходів на кожен рендер екрана «Фінанси». Тепер один прохід
   розкладає тренування по кошиках, а точки лише беруть готове.        */
/* doneOnly — рахувати лише проведені. Потрібно там, де поруч стоїть
   слово «заробив»: смужка за тиждень із запланованим сьогодні задирала б
   останній стовпчик вище за число під ним. */
function netByBucket(db, from, to, byMonth, doneOnly){
  const S = db.settings, out = new Map();
  db.sessions.forEach(x => {
    if (doneOnly ? x.status !== 'done' : !isBillable(x)) return;
    const d = valid(x.start);
    if (!d || !inRange(+d, from, to)) return;
    const k = byMonth ? d.getFullYear() + '.' + d.getMonth() : iso(d);
    out.set(k, (out.get(k) || 0) + split(x.price, S).net);
  });
  return out;
}
const mKey = d => d.getFullYear() + '.' + d.getMonth();

/* динаміка: порівнюємо однакові за довжиною відрізки — інакше 3-го числа
   місяць завжди «мінус 90%» проти повного попереднього */
function deltaFor(db, kind, base){
  const [from, to] = periodRange(kind, base || new Date());
  const len = +to - +from;
  const slice = clamp(+addDays(d0(new Date()), 1) - +from, DAY, len);
  const cur = stats(db, from, new Date(+from + slice));
  const pFrom = new Date(+from - len);
  const prev = stats(db, pFrom, new Date(+pFrom + slice));
  /* Порівнюємо зароблене, бо саме воно стоїть поруч на екрані. Якби
     відсоток рахувався від обороту, він описував би інше число, ніж те,
     що людина бачить, — і вранці показував би зростання на порожньому
     місці, лише тому, що на день записано більше тренувань. */
  return prev.earned ? Math.round((cur.earned - prev.earned) / prev.earned * 1000) / 10
       : (cur.earned ? 100 : 0);
}

/* довільний період: {kind:'custom', from:'2026-08-05', to:'2026-08-12'} */
function periodOf(p){
  if (p && p.kind === 'custom' && p.from){
    const from = d0(new Date(p.from + 'T00:00:00'));
    const to = d0(new Date((p.to || p.from) + 'T00:00:00'));
    return [from, addDays(to, 1)];
  }
  return periodRange((p && p.kind) || 'month', new Date());
}
/* динаміка проти попереднього відрізка такої ж довжини */
function deltaRange(db, from, to){
  const len = +to - +from;
  const slice = clamp(+addDays(d0(new Date()), 1) - +from, DAY, len);
  const cur = stats(db, from, new Date(+from + slice));
  const pFrom = new Date(+from - len);
  const prev = stats(db, pFrom, new Date(+pFrom + slice));
  return prev.net ? Math.round((cur.net - prev.net) / prev.net * 1000) / 10 : (cur.net ? 100 : 0);
}
const periodLabel = (p, from, to) => {
  if (!p || p.kind !== 'custom') return '';
  const last = addDays(to, -1);
  return sameDay(from, last) ? fmtDM(from) : fmtDMs(from) + ' — ' + fmtDMs(last);
};

/* борг — проведене й неоплачене тренування поза абонементом */
/* Скільки днів до найближчого дня народження. Рік беремо поточний, а
   якщо дата вже минула — наступний. 29 лютого в невисокосний рік
   з'їжджає на 1 березня, і це краще, ніж пропустити його зовсім. */
const bdIn = (birthday, from) => {
  if (!birthday) return null;
  const [, m, d] = String(birthday).split('-').map(Number);
  if (!m || !d) return null;
  const base = d0(from || new Date());
  let next = d0(new Date(base.getFullYear(), m - 1, d));
  if (+next < +base) next = d0(new Date(base.getFullYear() + 1, m - 1, d));
  return Math.round((+next - +base) / DAY);
};

const isDebt = s => s.status === 'done' && !s.paid && !s.subId;
/* скільки ще винен за це тренування: клієнт міг віддати частину */
const owed = s => Math.max(0, s.price - (s.paidPart || 0));
const debtDays = s => Math.max(0, Math.floor((Date.now() - +new Date(s.start)) / DAY));

function clientStats(db, id){
  const ses = db.sessions.filter(s => s.clientId === id && isBillable(s));
  const done = ses.filter(s => s.status === 'done');
  const sales = db.sales.filter(x => x.clientId === id);
  const spent = sum(done, s => s.price) + sum(sales, x => x.price * x.qty);
  const debt = sum(db.sessions.filter(s => s.clientId === id && isDebt(s)), owed);
  const future = db.sessions.filter(s => s.clientId === id && s.status === 'planned' && +new Date(s.start) >= Date.now())
                            .sort((a,b) => +new Date(a.start) - +new Date(b.start));
  const last = done.sort((a,b) => +new Date(b.start) - +new Date(a.start))[0];
  const sub = db.subs.filter(x => x.clientId === id && x.used < x.total)
                     .sort((a,b) => a.ts - b.ts)[0];
  return {
    total: ses.length, done: done.length, spent, debt, sub,
    next: future[0] || null, last: last || null,
    lapsedDays: last ? Math.floor((Date.now() - +new Date(last.start)) / DAY) : null,
  };
}
/* історія клієнта — тренування + продажі + абонементи в одну стрічку */
function clientFeed(db, id){
  const out = [];
  const past = s => s.status !== 'planned' || +new Date(s.start) < Date.now();
  db.sessions.filter(s => s.clientId === id && past(s)).forEach(s => out.push({
    kind:'session', ts:+new Date(s.start), title: typeTitle(s.type),
    amount: s.status === 'canceled' ? 0 : s.price, ref:s,
    tag: s.status === 'canceled' ? 'canceled' : (s.subId ? 'package' : (s.paid ? 'paid' : 'debt')),
  }));
  db.sales.filter(x => x.clientId === id).forEach(x => {
    const p = byId(db.products, x.productId);
    out.push({kind:'sale', ts:x.ts, title:(p ? p.name : 'Товар') + (x.qty > 1 ? ' ×' + x.qty : ''),
      amount:x.price * x.qty, ref:x, tag:'paid'});
  });
  db.subs.filter(x => x.clientId === id).forEach(x => {
    const p = byId(db.packages, x.packageId);
    out.push({kind:'sub', ts:x.ts, title:t('feed.sub','Абонемент') + ' · ' + (p ? p.title : x.total + ' ' + t('unit.ses','трен.')),
      amount:x.price, ref:x, tag:'paid'});
  });
  return out.sort((a,b) => b.ts - a.ts);
}

/* ціна одного тренування: за замовчуванням із налаштувань, але якщо за
   клієнтом закріплена своя — беремо її; тип лише коригує суму */
const clientPrice = (db, clientId) => {
  const c = clientId ? byId(db.clients, clientId) : null;
  return (c && c.price) || db.settings.price;
};
const typedPrice = (base, type) =>
  type === 'online' ? Math.round(base * .7)
  : type === 'split' ? Math.round(base * 1.4)
  : Math.round(base);

function emptyDB(){
  return {
    v: 1, device: uid('dev'), createdAt: Date.now(), syncedAt: 0,

         крадіжка сховища, тому за замовчуванням — увімкнено. */
      recover: true,

      /* тільки те, що застосунок справді вміє надіслати: записатись сам

const Store = {
  state: null,
  subs: new Set(),
  ready: false,
  init(db){ Store.state = db; Store.ready = true; Store.emit(); },
  emit(){ Store.subs.forEach(f => f(Store.state)); },
  patch(fn, op){
    Store.state = fn(Store.state);
    Store.persist();
    if (op) Sync.push(op.name, op.data);
    Store.emit();
  },
  warned: false,
  async persist(){
    const json = JSON.stringify(Store.state);
    const meta = Disk.readMeta() || {};
    try {
      let ok;
      if (Store.state.settings.secure && Vault.key){
        const {iv, ct} = await Vault.encrypt(json);
        ok = Disk.writeRaw(JSON.stringify({enc: 1, iv, ct}));
      } else {
        ok = Disk.writeRaw(json);
      }
      Disk.writeMeta({...meta, savedAt: Date.now(), enc: !!(Store.state.settings.secure && Vault.key)});
      /* сховище переповнене — раніше запис просто не відбувався, і тренер
         дізнавався про це, лише втративши день роботи. Попереджаємо один
         раз за сеанс, інакше тост висів би після кожного дотику */
      if (!ok && !Store.warned){
        Store.warned = true;
        Toaster.bad(t('save.full','Не вистачає місця — збережіть резервну копію'));
      }
      if (ok) Store.warned = false;
      Cloud.later(json);
    } catch (e) { console.warn('persist', e); }
  },
};
function useDB(){
  const [, force] = useState(0);
  useEffect(() => {
    const f = () => force(x => x + 1);
    Store.subs.add(f);
    return () => Store.subs.delete(f);
  }, []);
  return Store.state;
}

/* ─────────────────── дії (єдина точка змін) ─────────────────── */
const Act = {
  settings(patch){ Store.patch(db => ({...db, settings:{...db.settings, ...patch}}), {name:'settings', data:patch}); },
  profile(patch){ Store.patch(db => ({...db, profile:{...db.profile, ...patch}}), {name:'profile', data:patch}); },

  addClient(c){
    const client = {id: uid('cl'), name:'', phone:'', goal:'', photo:'', note:'', price: null,
                    createdAt: Date.now(), archived:false, ...c};
    Store.patch(db => ({...db, clients:[client, ...db.clients]}), {name:'client.add', data:client});
    return client;
  },
  updClient(id, patch){ Store.patch(db => ({...db, clients: db.clients.map(c => c.id === id ? {...c, ...patch} : c)}), {name:'client.upd', data:{id, patch}}); },
  /* ─── архів ───
     Клієнт пішов — його не треба бачити щодня, але й видаляти шкода:
     разом із ним зникнуть його тренування й продажі, тобто зміняться
     гроші за минулі місяці. Звіт, уже відданий бухгалтеру, перестане
     сходитись із застосунком.

     Архів прибирає людину зі списків і підказок, лишаючи історію на
     місці. Поле archived було в базі з самого початку, і всі списки його
     вже враховували — не було лише способу його поставити. */
  /* ─── прибрати приклад ───
     Забираємо тільки помічені записи, власні лишаються. Так «видалити
     одним дотиком» справді працює й не забирає нічого зайвого — навіть
     якщо тренер уже встиг завести своїх клієнтів поруч із прикладом. */
  clearDemo(){
    Store.patch(db => {
      const off = list => (list || []).filter(x => !x.demo);
      return {...db, demo: false,
        clients: off(db.clients), sessions: off(db.sessions), products: off(db.products),
        sales: off(db.sales), packages: off(db.packages), subs: off(db.subs),
        notes: off(db.notes), measures: off(db.measures)};
    }, {name: 'demo.clear'});
  },

  archiveClient(id, on){
    Store.patch(db => ({...db, clients: db.clients.map(c => c.id === id ? {...c, archived: on !== false} : c)}),
      {name:'client.archive', data:{id, on}});
  },
  delClient(id){
    Store.patch(db => ({...db,
      clients: db.clients.filter(c => c.id !== id),
      sessions: db.sessions.filter(s => s.clientId !== id),
      sales: db.sales.filter(s => s.clientId !== id),
      subs: db.subs.filter(s => s.clientId !== id),
      measures: (db.measures || []).filter(m => m.clientId !== id),
      notes: db.notes.filter(n => n.clientId !== id),
    }), {name:'client.del', data:{id}});
  },

  addSession(s){
    /* groupId — спільний для тренування, яке проводять кільком клієнтам
       одночасно. Кожен учасник лишається окремим записом: у нього своя
       ціна, оплата й борг, тож гроші рахуються так само, як завжди. */
    const ses = {id: uid('ses'), clientId:'', start: new Date().toISOString(), dur:60, type:'personal',
                 price: Store.state.settings.price, paid:false, status:'planned', subId:null, groupId:null,
                 repeatId:null, paidPart:0, note:'', createdAt: Date.now(), ...s};
    Store.patch(db => {
      let subs = db.subs;
      /* Списуємо лише те, що є. Вичерпаний абонемент не має мовчки
         оплачувати ще одне заняття — див. complete(). */
      if (ses.subId && ses.status === 'done'){
        const sub = byId(subs, ses.subId);
        if (sub && sub.used < sub.total) subs = subs.map(x => x.id === ses.subId ? {...x, used: x.used + 1} : x);
        else { ses.subId = null; ses.paid = false; }
      }
      return {...db, sessions:[...db.sessions, ses], subs};
    }, {name:'session.add', data:ses});
    return ses;
  },
  /* ─── правка тренування ───
     Майже завжди це просто заміна полів. Крім одного: якщо в уже
     проведеному тренуванні міняють абонемент, разом із ним має
     змінитись і залишок.

     Без цього виходило двома способами погано. Вписали абонемент у
     проведене — борг зникав, а з абонемента не списувалось: тренер не
     отримував ні грошей, ні боргу, клієнт лишався з повним пакетом.
     Прибрали абонемент — заняття з пакета вже було з'їдено, і клієнт
     утрачав його ні за що.

     Вичерпаний абонемент вписати не дамо — так само, як при проведенні:
     мовчки безкоштовне заняття гірше за відмову. */
  updSession(id, patch){
    let over = false;
    Store.patch(db => {
      const s = byId(db.sessions, id);
      if (!s) return db;
      let subs = db.subs, next = {...s, ...patch};
      if (s.status === 'done' && patch.subId !== undefined && patch.subId !== s.subId){
        if (s.subId) subs = subs.map(x => x.id === s.subId ? {...x, used: Math.max(0, x.used - 1)} : x);
        if (patch.subId){
          const sub = byId(subs, patch.subId);
          if (sub && sub.used < sub.total) subs = subs.map(x => x.id === patch.subId ? {...x, used: x.used + 1} : x);
          else { over = true; next.subId = null; }
        }
        /* «оплачено» тут означає саме «з абонемента»: зняли абонемент —
           лишився звичайний борг, і його видно */
        next.paid = next.subId ? true : !!patch.paid;
      }
      return {...db, sessions: db.sessions.map(x => x.id === id ? next : x), subs};
    }, {name:'session.upd', data:{id, patch}});
    return {over};
  },
  delSession(id){
    Store.patch(db => {
      const s = byId(db.sessions, id);
      const subs = s && s.subId && s.status === 'done'
        ? db.subs.map(x => x.id === s.subId ? {...x, used: Math.max(0, x.used - 1)} : x) : db.subs;
      return {...db, sessions: db.sessions.filter(x => x.id !== id), subs};
    }, {name:'session.del', data:{id}});
  },
  /* ─── провести тренування ───
     Списуємо заняття з абонемента — якщо там ще є що списувати.

     Раніше тут стояло Math.min(total, used + 1): коли абонемент уже
     вичерпано, лічильник просто впирався в межу, а тренування все одно
     позначалось як оплачене з абонемента. Тренер відпрацьовував
     безкоштовно, і ніде цього не було видно — ні грошей, ні боргу.
     Дійти до цього легко: два заняття наперед прив'язані до абонемента,
     у якому лишалось одне.

     Тепер, коли списувати нема з чого, тренування стає звичайним
     неоплаченим — тобто боргом, який тренер побачить. Прив'язку до
     абонемента прибираємо: інакше борг лишився б невидимим, бо
     тренування «з абонемента» боргом не рахується. */
  complete(id, paid){
    let over = false;
    Store.patch(db => {
      const s = byId(db.sessions, id);
      if (!s || s.status === 'done') return db;
      let subs = db.subs, subId = s.subId;
      if (subId){
        const sub = byId(subs, subId);
        if (sub && sub.used < sub.total)
          subs = subs.map(x => x.id === subId ? {...x, used: x.used + 1} : x);
        else { over = true; subId = null; }
      }
      const fromSub = !!subId;
      return {...db,
        sessions: db.sessions.map(x => x.id === id
          ? {...x, status:'done', subId, paid: !!paid || fromSub, paidAt: paid ? Date.now() : x.paidAt}
          : x),
        subs};
    }, {name:'session.done', data:{id, paid}});
    return {over};
  },
  pay(id){ Store.patch(db => ({...db, sessions: db.sessions.map(s => s.id === id ? {...s, paid:true, paidAt: Date.now()} : s)}), {name:'session.pay', data:{id}}); },
  /* ─── скасувати тренування ───
     Групове скасовується цілком — так само, як переноситься. У календарі
     це одна картка, і тренер, який тисне «Скасувати тренування», має на
     увазі заняття, а не одного учасника. Раніше скасовувався саме один:
     решта лишалась у планах, і застосунок далі рахував їх як очікуваний
     дохід і нагадував про них.

     Прибрати з заняття когось одного — це «Клієнт не прийшов» або
     видалення учасника, і для цього є свої кнопки. */
  cancel(id){
    Store.patch(db => {
      const s = byId(db.sessions, id);
      if (!s) return db;
      const hit = x => x.id === id || (s.groupId && x.groupId === s.groupId);
      let subs = db.subs;
      db.sessions.filter(x => hit(x) && x.subId && x.status === 'done').forEach(x => {
        subs = subs.map(y => y.id === x.subId ? {...y, used: Math.max(0, y.used - 1)} : y);
      });
      return {...db, sessions: db.sessions.map(x => hit(x) ? {...x, status:'canceled', paid:false} : x), subs};
    }, {name:'session.cancel', data:{id}});
  },

  /* клієнт не прийшов: тренування лишається в історії, але не в доході */
  noshow(id){
    Store.patch(db => {
      const s = byId(db.sessions, id);
      const subs = s && s.subId && s.status === 'done'
        ? db.subs.map(x => x.id === s.subId ? {...x, used: Math.max(0, x.used - 1)} : x) : db.subs;
      return {...db, sessions: db.sessions.map(x => x.id === id ? {...x, status:'noshow', paid:false} : x), subs};
    }, {name:'session.noshow', data:{id}});
  },
  /* Перенести тренування. Групове рухаємо цілком: це одне заняття, і
     лишити одного учасника на старому часі означало б розірвати групу
     мовчки. Щоб перенести когось одного, його прибирають з групи.

     Проведене лишається проведеним — переносять його, щоб виправити
     дату, а не щоб скасувати роботу. Раніше перенос повертав будь-яке
     тренування в «заплановано», і за одне заняття з абонемента
     списувалось двічі: перший раз при проведенні, другий — коли тренер
     проводив його знову після переносу. Клієнт втрачав оплачене заняття.

     А от «не прийшов» переносять саме щоб домовитись на інший час —
     таке повертаємо в план. */
  moveSession(id, when){
    const s = byId(Store.state.sessions, id);
    if (!s) return;
    const start = new Date(when).toISOString();
    const hit = x => x.id === id || (s.groupId && x.groupId === s.groupId);
    const next = st => st === 'noshow' ? 'planned' : st;
    Store.patch(db => ({...db, sessions: db.sessions.map(x =>
      hit(x) ? {...x, start, status: next(x.status)} : x)}),
      {name:'session.move', data:{id, start}});
  },

  /* Дописати клієнта в уже створене тренування. Якщо воно було
     одиночним — стає груповим, тому groupId проставляється і першому.
     Новому учаснику ставимо «не оплачено»: він щойно приєднався, і
     видавати це за оплату не можна. Абонемент не чіпаємо — у групі він
     не списується, як і при створенні. */
  joinSession(id, clientId){
    const s = byId(Store.state.sessions, id);
    if (!s || s.clientId === clientId) return null;
    const gid = s.groupId || uid('grp');
    if (Store.state.sessions.some(x => x.groupId === gid && x.clientId === clientId)) return null;
    const mate = {id: uid('ses'), clientId, start: s.start, dur: s.dur, type: s.type,
                  price: s.price, paid: false, status: s.status, subId: null,
                  groupId: gid, repeatId: null, note: '', createdAt: Date.now()};
    Store.patch(db => ({...db,
      sessions: [...db.sessions.map(x => x.id === id ? {...x, groupId: gid} : x), mate]}),
      {name:'session.join', data:{id, clientId}});
    return mate;
  },

  /* Прибрати решту серії. Проведені не чіпаємо — вони вже в історії й у
     доході; знімаємо тільки заплановані, починаючи з цього. */
  delSeries(repeatId, fromTs){
    Store.patch(db => ({...db, sessions: db.sessions.filter(s =>
      !(s.repeatId === repeatId && s.status === 'planned' && +new Date(s.start) >= fromTs))}),
      {name:'session.series.del', data:{repeatId, fromTs}});
  },

  /* закрити всі борги клієнта одним дотиком */
  /* Клієнт віддав гроші. Без суми — закриваємо весь борг; із сумою
     гасимо тренування від найстарішого, і те, на яке грошей не
     вистачило, лишається з часткою — інакше борг у списку не зменшився б
     на віддане. */
  payClient(clientId, amount){
    Store.patch(db => {
      const queue = db.sessions
        .filter(s => s.clientId === clientId && isDebt(s))
        .sort((a, b) => +new Date(a.start) - +new Date(b.start));
      let rest = amount == null ? Infinity : Math.max(0, amount);
      const done = new Map();
      queue.forEach(s => {
        if (rest <= 0) return;
        const left = owed(s);
        const take = Math.min(left, rest);
        rest -= take;
        done.set(s.id, take >= left
          ? {...s, paid: true, paidAt: Date.now(), paidPart: 0}
          : {...s, paidPart: (s.paidPart || 0) + take});
      });
      return {...db, sessions: db.sessions.map(x => done.get(x.id) || x)};
    }, {name:'client.payAll', data:{clientId, amount}});
  },
  markBackup(){ Store.patch(db => ({...db, settings:{...db.settings, backup:{...db.settings.backup, lastAt: Date.now()}}})); },

  addProduct(p){
    const pr = {id: uid('pr'), name:'', price:0, cost:0, stock:0, sold:0, icon:'💊', createdAt: Date.now(), ...p};
    Store.patch(db => ({...db, products:[pr, ...db.products]}), {name:'product.add', data:pr});
    return pr;
  },
  updProduct(id, patch){ Store.patch(db => ({...db, products: db.products.map(p => p.id === id ? {...p, ...patch} : p)}), {name:'product.upd', data:{id, patch}}); },
  delProduct(id){ Store.patch(db => ({...db, products: db.products.filter(p => p.id !== id)}), {name:'product.del', data:{id}}); },
  sell(sale){
    const s = {id: uid('sl'), ts: Date.now(), qty:1, ...sale};
    Store.patch(db => ({...db,
      sales: [...db.sales, s],
      products: db.products.map(p => p.id === s.productId
        ? {...p, stock: Math.max(0, p.stock - s.qty), sold: (p.sold || 0) + s.qty} : p),
    }), {name:'sale.add', data:s});
    return s;
  },

  addPackage(p){
    const pk = {id: uid('pk'), title:'', sessions:8, price:0, days:60, active:true, createdAt: Date.now(), ...p};
    Store.patch(db => ({...db, packages:[pk, ...db.packages]}), {name:'package.add', data:pk});
    return pk;
  },
  updPackage(id, patch){ Store.patch(db => ({...db, packages: db.packages.map(p => p.id === id ? {...p, ...patch} : p)}), {name:'package.upd', data:{id, patch}}); },
  delPackage(id){ Store.patch(db => ({...db, packages: db.packages.filter(p => p.id !== id)}), {name:'package.del', data:{id}}); },
  buyPackage(clientId, pkg){
    const sub = {id: uid('sub'), clientId, packageId: pkg.id, total: pkg.sessions, used: 0,
                 price: pkg.price, ts: Date.now(), expiresAt: Date.now() + (pkg.days || 60) * DAY};
    Store.patch(db => ({...db, subs:[...db.subs, sub]}), {name:'sub.add', data:sub});
    return sub;
  },

  /* Заміри — річ добровільна: тренер або веде їх, або ні. Тому це не
     обов'язкове поле в картці, а окремий запис, якого може не бути
     жодного, і застосунок від цього нічого не втрачає. */
  addMeasure(m){
    const rec = {id: uid('ms'), ts: Date.now(), weight:0, waist:0, chest:0, hip:0, note:'', ...m};
    Store.patch(db => ({...db, measures: [rec, ...(db.measures || [])]}), {name:'measure.add', data:rec});
    return rec;
  },
  delMeasure(id){
    Store.patch(db => ({...db, measures: (db.measures || []).filter(m => m.id !== id)}),
      {name:'measure.del', data:{id}});
  },

  addNote(clientId, text){
    const n = {id: uid('nt'), clientId, text, ts: Date.now()};
    Store.patch(db => ({...db, notes:[n, ...db.notes]}), {name:'note.add', data:n});
    return n;
  },
  delNote(id){ Store.patch(db => ({...db, notes: db.notes.filter(n => n.id !== id)}), {name:'note.del', data:{id}}); },

  notify(n){
    const item = {id: uid('nf'), ts: Date.now(), read:false, type:'info', ...n};
    Store.patch(db => ({...db, notifs:[item, ...db.notifs].slice(0, 200)}));
    return item;
  },
  readNotifs(){ Store.patch(db => ({...db, notifs: db.notifs.map(n => ({...n, read:true}))})); },
  clearNotifs(){ Store.patch(db => ({...db, notifs: []})); },
  markFired(key){ Store.patch(db => ({...db, fired:{...db.fired, [key]: Date.now()}})); },
  /* ─── прибрати старі позначки ───
     fired існує рівно для того, щоб не показати одне нагадування двічі.
     Через тиждень ця позначка вже нічого не тримає, а лежить вічно: за
     рік у тренера з шістьма тренуваннями на день їх набігає близько
     семи тисяч — чверть мегабайта.

     Само собою це не страшно, але копія бази на сервері обмежена
     мегабайтом, і років за два-три вона просто перестала б зберігатись.
     Мовчки: застосунок працює, копія не оновлюється, дізнатись нема як.

     Місяця із запасом вистачає: усі нагадування прив'язані до дня або
     до найближчого тренування. */
  sweepFired(){
    const edge = Date.now() - FIRED_KEEP;
    Store.patch(db => {
      const fired = {};
      let dropped = 0;
      for (const k in db.fired){
        if (db.fired[k] > edge) fired[k] = db.fired[k]; else dropped++;
      }
      return dropped ? {...db, fired} : db;
    });
  },
};

/* ─── приклад ───
   Кожен запис прикладу помічений demo:true. Помітка потрібна не для
   краси: без неї прибрати приклад можна було тільки разом із власними
   даними, і обіцянка «все можна видалити одним дотиком» не виконувалась
   ніяк. */
function markDemo(db){
  const on = list => (list || []).map(x => ({...x, demo: true}));
  return {...db, demo: true,
    clients: on(db.clients), sessions: on(db.sessions), products: on(db.products),
    sales: on(db.sales), packages: on(db.packages), subs: on(db.subs),
    notes: on(db.notes), measures: on(db.measures)};
}

function seedDB(profile){
  const db = emptyDB();
  db.profile = {...db.profile, ...profile};
  db.onboarded = true;
  const rnd = (() => { let s = 42; return () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648; })();
  const pick = a => a[Math.floor(rnd() * a.length)];

  const nm = (k, uk) => t('demo.' + k, uk);
  const names = [
    [nm('n1','Іван Петров'),'Схуднення'], [nm('n2','Максим Коваль'),'Набір маси'], [nm('n3','Олег Бондар'),'Сила'],
    [nm('n4','Анна Мельник'),'Рельєф'], [nm('n5','Софія Ткаченко'),'Здоров’я спини'], [nm('n6','Дмитро Шевчук'),'Витривалість'],
    [nm('n7','Ольга Кравець'),'Схуднення'], [nm('n8','Артем Лисенко'),'Набір маси'],
  ];
  /* у двох клієнтів своя закріплена ціна — так видно, що сума не однакова для всіх */
  const ownPrice = {cl_6: 900, cl_7: 700};
  db.clients = names.map(([name, goal], i) => ({
    id: 'cl_' + i, name, goal, phone: phoneMask('0' + (63 + i % 6) + String(1000000 + Math.floor(rnd() * 8999999)).slice(0,7)),
    photo:'', note:'', price: ownPrice['cl_' + i] || null,
    createdAt: Date.now() - (120 - i * 11) * DAY, archived:false,
  }));

  db.products = [
    {id:'pr_1', name:nm('p1','Протеїн'), price:1400, cost:1050, stock:4, sold:9,  icon:'🥤', createdAt:Date.now()},
    {id:'pr_2', name:nm('p2','Креатин'), price:800,  cost:500,  stock:7, sold:10, icon:'💊', createdAt:Date.now()},
    {id:'pr_3', name:nm('p3','Шейкер'),  price:250,  cost:120,  stock:12, sold:14, icon:'🍶', createdAt:Date.now()},
    {id:'pr_4', name:nm('p4','Рукавички'), price:600, cost:380, stock:3, sold:6,  icon:'🧤', createdAt:Date.now()},
    {id:'pr_5', name:nm('p5','Вітаміни'), price:900, cost:620,  stock:1, sold:4,  icon:'🟠', createdAt:Date.now()},
    {id:'pr_6', name:nm('p6','Резинки'),  price:450, cost:210,  stock:8, sold:7,  icon:'🎯', createdAt:Date.now()},
  ];
  db.packages = [
    {id:'pk_1', title:nSessions(8),  sessions:8,  price:5600,  days:60, active:true, createdAt:Date.now()},
    {id:'pk_2', title:nSessions(12), sessions:12, price:7800,  days:75, active:true, createdAt:Date.now()},
    {id:'pk_3', title:nSessions(16), sessions:16, price:10000, days:90, active:true, createdAt:Date.now()},
  ];
  db.subs = [
    {id:'sub_1', clientId:'cl_0', packageId:'pk_1', total:8,  used:6, price:5600, ts: Date.now() - 22 * DAY, expiresAt: Date.now() + 38 * DAY},
    {id:'sub_2', clientId:'cl_3', packageId:'pk_2', total:12, used:9, price:7800, ts: Date.now() - 30 * DAY, expiresAt: Date.now() + 45 * DAY},
  ];

  /* історія за 70 днів назад + розклад на 10 днів уперед */
  const price = db.settings.price;
  const mk = (clientId, date, h, m, o) => ({
    id: uid('ses'), clientId, start: new Date(new Date(date).setHours(h, m, 0, 0)).toISOString(),
    dur:60, type:'personal', price, paid:true, status:'done', subId:null, note:'', createdAt: Date.now(), ...o,
  });
  const list = [];
  for (let d = 70; d >= 1; d--){
    const day = addDays(new Date(), -d);
    const wd = day.getDay();
    const count = wd === 0 ? 0 : (wd === 6 ? 2 : 3 + Math.floor(rnd() * 3));
    const slots = [8, 10, 11.5, 13, 15.5, 17, 18.5, 20];
    const used = [];
    for (let i = 0; i < count; i++){
      let s; do { s = pick(slots); } while (used.includes(s)); used.push(s);
      const c = pick(db.clients);
      const type = rnd() > .86 ? pick(['pair','online','split']) : 'personal';
      const sub = db.subs.find(x => x.clientId === c.id && rnd() > .6);
      const own = c.price || price;
      list.push(mk(c.id, day, Math.floor(s), (s % 1) * 60, {
        type, price: type === 'split' ? Math.round(own * 1.4) : (type === 'online' ? Math.round(own * .7) : own),
        dur: SES_TYPES[type].dur,
        subId: sub ? sub.id : null,
        paid: sub ? true : (d > 12 ? true : rnd() > .3),
        status: rnd() > .96 ? 'canceled' : 'done',
      }));
    }
  }
  /* сьогодні — як у референсі: 6 тренувань */
  const today = new Date();
  [[10,0,'cl_0','done',true],[11,30,'cl_1','done',false],[13,0,'cl_2','done',true],
   [15,30,'cl_3','planned',false],[17,0,'cl_5','planned',false],[19,0,'cl_4','planned',false]]
   .forEach(([h, m, c, st, paid]) => list.push(mk(c, today, h, m, {status:st, paid, subId: c === 'cl_0' ? 'sub_1' : null})));

  for (let d = 1; d <= 10; d++){
    const day = addDays(new Date(), d);
    if (day.getDay() === 0) continue;
    const slots = [9, 11, 13, 16, 18, 19.5];
    const count = 2 + Math.floor(rnd() * 3);
    const used = [];
    for (let i = 0; i < count; i++){
      let s; do { s = pick(slots); } while (used.includes(s)); used.push(s);
      const c = pick(db.clients);
      list.push(mk(c.id, day, Math.floor(s), (s % 1) * 60, {status:'planned', paid:false, price: c.price || price,
        subId: db.subs.find(x => x.clientId === c.id) ? db.subs.find(x => x.clientId === c.id).id : null}));
    }
  }
  db.sessions = list.sort((a, b) => +new Date(a.start) - +new Date(b.start));

  /* борг у Максима — як у референсі */
  const mx = db.sessions.filter(s => s.clientId === 'cl_1' && s.status === 'done');
  mx.slice(-1).forEach(s => { s.paid = false; s.subId = null; });

  db.sales = [
    {id:'sl_1', clientId:'cl_0', productId:'pr_1', qty:1, price:1400, ts: Date.now() - 4 * DAY},
    {id:'sl_2', clientId:'cl_2', productId:'pr_2', qty:1, price:800,  ts: Date.now() - 9 * DAY},
    {id:'sl_3', clientId:'cl_3', productId:'pr_3', qty:2, price:250,  ts: Date.now() - 12 * DAY},
    {id:'sl_4', clientId:'cl_5', productId:'pr_4', qty:1, price:600,  ts: Date.now() - 2 * DAY},
  ];
  db.notes = [
    {id:'nt_1', clientId:'cl_0', text:nm('t1','Збільшити робочу вагу в присіді на наступному тренуванні.'), ts: Date.now() - 2 * DAY},
    {id:'nt_2', clientId:'cl_0', text:nm('t2','Скаржиться на праве коліно — прибрати випади.'), ts: Date.now() - 9 * DAY},
    {id:'nt_3', clientId:'cl_3', text:nm('t3','Мета — рельєф до відпустки в вересні.'), ts: Date.now() - 5 * DAY},
  ];
  return db;
}

const Sheet = ({open, onClose, title, sub, children, tall}) => {
  const box = useRef(null);
  const scrim = useRef(null);

  useEffect(() => {
    if (!open) return;
    const esc = e => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', esc);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', esc); document.body.style.overflow = ''; };
  }, [open, onClose]);

  /* Закриття свайпом униз. Шторка показує ручку, тобто обіцяє жест — без
     нього тренер тягне її вниз і думає, що застосунок завис.

     Але шторка сама і є список, який прокручується. Якщо дозволити жест
     скрізь, де список опинився вгорі, довгий список стає непрокручуваним:
     гортаєш клієнтів догори, останній рух доходить до верху — і шторка
     закривається просто тому, що палець ще їхав донизу.

     Тому: у довгому списку тягнемо тільки за верх шторки — за ручку й
     заголовок, там прокручувати нічого. У короткій, де списку немає,
     тягнеться звідусіль, як і має бути.

     Слухачі нативні: React вішає touchmove пасивно, і preventDefault()
     у ньому не спрацював би.                                          */
  const GRAB = 64;                     /* висота ручки із заголовком */
  useEffect(() => {
    const el = box.current;
    if (!open || !el) return;
    let from = null, dy = 0, t0 = 0, byGrip = false;
    const down = e => {
      if (el.scrollTop > 0) return;
      const scrolls = el.scrollHeight > el.clientHeight + 1;
      byGrip = e.touches[0].clientY - el.getBoundingClientRect().top <= GRAB;
      if (scrolls && !byGrip) return;
      from = e.touches[0].clientY; dy = 0; t0 = Date.now();
      el.style.animation = 'none';
      el.style.transition = 'none';
    };
    const move = e => {
      if (from === null) return;
      const d = e.touches[0].clientY - from;
      if (d <= 0){ dy = 0; el.style.transform = 'translate(-50%,0)'; return; }
      dy = d;
      e.preventDefault();                        /* інакше сторінка пружинить під шторкою */
      el.style.transform = 'translate(-50%,' + d + 'px)';
      if (scrim.current) scrim.current.style.opacity = String(Math.max(0, 1 - d / 320));
    };
    const up = () => {
      if (from === null) return;
      /* Швидкий рух закриває тільки коли тягли за ручку: у списку
         швидкий рух — це звичайне гортання, а не намір закрити. */
      const quick = byGrip && dy / Math.max(1, Date.now() - t0) > 0.5;
      from = null;
      if (dy > 90 || (quick && dy > 24)) return onClose();
      el.style.transition = 'transform .24s var(--ease)';
      el.style.transform = 'translate(-50%,0)';
      if (scrim.current) scrim.current.style.opacity = '';
    };
    el.addEventListener('touchstart', down, {passive: true});
    el.addEventListener('touchmove', move, {passive: false});
    el.addEventListener('touchend', up);
    el.addEventListener('touchcancel', up);
    return () => {
      el.removeEventListener('touchstart', down);
      el.removeEventListener('touchmove', move);
      el.removeEventListener('touchend', up);
      el.removeEventListener('touchcancel', up);
    };
  }, [open, onClose]);

  if (!open) return null;
  return (
    <Fragment>
      <div className="scrim" ref={scrim} onClick={onClose}/>
      <div className="sheet" ref={box} style={tall ? {minHeight:'70vh'} : null}
           role="dialog" aria-modal="true" aria-label={title || ''}>
        <div className="grip"/>
        {title && <h3>{title}</h3>}
        {sub && <div className="muted" style={{fontSize:13.5, marginBottom:10}}>{sub}</div>}
        {children}
      </div>
    </Fragment>
  );
};

const Toaster = {
  list: [], subs: new Set(),
  show(text, kind){
    const item = {id: uid('ts'), text, kind};
    Toaster.list = [...Toaster.list, item];
    Toaster.subs.forEach(f => f());
    setTimeout(() => { Toaster.list = Toaster.list.filter(x => x.id !== item.id); Toaster.subs.forEach(f => f()); }, 2600);
  },
  ok: tx => Toaster.show(tx, 'ok'),
  bad: tx => Toaster.show(tx, 'bad'),
};
const ToastHost = () => {
  const [, f] = useState(0);
  useEffect(() => { const fn = () => f(x => x + 1); Toaster.subs.add(fn); return () => Toaster.subs.delete(fn); }, []);
  return (
    <div className="toast-wrap">
      {Toaster.list.map(x => (
        <div key={x.id} className={cx('toast', x.kind)}>
          {x.kind === 'ok' ? <Ic.check size={18}/> : x.kind === 'bad' ? <Ic.warn size={18}/> : <Ic.info size={18}/>}
          <span>{x.text}</span>
        </div>
      ))}
    </div>
  );
};

/* межа помилки: збій одного екрана не кладе застосунок */
class Boundary extends React.Component {
  constructor(p){ super(p); this.state = {err: null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err){ console.error('[screen]', err); }
  render(){
    if (this.state.err) return (
      <div className="screen">
        <ErrorBox text={String(this.state.err.message || this.state.err)}
                  onRetry={() => this.setState({err: null})}/>
      </div>
    );
    return this.props.children;
  }
}

/* площа-лінія з градієнтом */
const Area = ({data, height = 150, fmtV = moneyShort}) => {
  const W = 320, H = height, pad = 6;
  const max = Math.max(1, ...data.map(d => d.v));
  const n = Math.max(1, data.length - 1);
  const px = i => pad + i * ((W - pad * 2) / n);
  const py = v => H - 22 - (v / max) * (H - 40);
  const pts = data.map((d, i) => [px(i), py(d.v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${px(n)} ${H - 22} L${px(0)} ${H - 22} Z`;
  const last = data[data.length - 1];
  return (
    <svg className="chart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{height}}>
      <defs>
        <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--accent)" stopOpacity=".34"/>
          <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
        </linearGradient>
      </defs>
      {[0, .5, 1].map(k => (
        <line key={k} x1="0" x2={W} y1={py(max * k)} y2={py(max * k)} stroke="var(--line)" strokeWidth="1"/>
      ))}
      <path d={area} fill="url(#ag)"/>
      <path d={line} fill="none" stroke="var(--accent)" strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"/>
      {last && <circle cx={px(n)} cy={py(last.v)} r="4" fill="var(--accent)" stroke="var(--surface)" strokeWidth="2.5"/>}
      {data.map((d, i) => (i % Math.ceil(data.length / 6) === 0 || i === data.length - 1) && (
        <text key={i} x={px(i)} y={H - 5} fontSize="9.5" fontWeight="700" fill="var(--ink-3)"
              textAnchor={i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle'}>{d.label}</text>
      ))}
    </svg>
  );
};

/* кільце структури доходу */
const Donut = ({parts, size = 132, center}) => {
  const total = Math.max(1, sum(parts, p => p.v));
  const R = size / 2 - 11, C = 2 * Math.PI * R;
  let off = 0;
  return (
    <div style={{position:'relative', width:size, height:size, flex:'none'}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={R} fill="none" stroke="var(--surface-2)" strokeWidth="13"/>
        {parts.map((p, i) => {
          const len = (p.v / total) * C;
          const el = <circle key={i} cx={size/2} cy={size/2} r={R} fill="none" stroke={p.c} strokeWidth="13"
                             strokeDasharray={`${len} ${C - len}`} strokeDashoffset={-off} strokeLinecap="butt"/>;
          off += len;
          return el;
        })}
      </svg>
      <div style={{position:'absolute', inset:0, display:'grid', placeItems:'center', textAlign:'center'}}>{center}</div>
    </div>
  );
};

/* мінісерія в hero */

           style={{height: Math.max(8, Math.round(v / max * 52)) + 'px', animationDelay: (i * 40) + 'ms'}}/>
      ))}

/* сітка часу — один тап замість колеса */
const TimePick = ({value, onChange, taken = []}) => {
  const db = useDB();
  const S = db.settings;
  const slots = [];
  for (let h = S.dayStart; h <= S.dayEnd; h++){ slots.push(h + ':00'); if (h < S.dayEnd) slots.push(h + ':30'); }
  const cur = fmtTime(value);
  const norm = s => { const [h, m] = s.split(':').map(Number); return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'); };
  return (
    <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:7, marginTop:2}}>
      {slots.map(s => {
        const busy = taken.includes(norm(s));
        return (
          <button key={s} className={cx('chip', cur === norm(s) && 'on')}
                  style={{width:'100%', justifyContent:'center', opacity: busy && cur !== norm(s) ? .45 : 1}}
                  onClick={() => { const [h, m] = s.split(':').map(Number); const x = new Date(value); x.setHours(h, m, 0, 0); onChange(x); }}>
            {norm(s)}{busy && cur !== norm(s) ? ' •' : ''}
          </button>
        );
      })}
    </div>
  );
};
