/* ─────────── форма тренування (створення / редагування) ─────────── */
const SessionForm = ({params, onClose}) => {
  const db = useDB();
  const nav = useNav();
  const edit = params.id ? byId(db.sessions, params.id) : null;
  const S = db.settings;
  const base = edit ? new Date(edit.start) : (() => {
    const d = params.date ? new Date(params.date) : new Date();
    if (!params.date) d.setHours(d.getHours() + 1, 0, 0, 0);
    else if (!params.keepTime) d.setHours(10, 0, 0, 0);
    return d;
  })();

  const [f, setF] = useState({
    clientId: edit ? edit.clientId : (params.clientId || ''),
    when: base,
    type: edit ? edit.type : 'personal',
    price: edit ? edit.price : clientPrice(db, params.clientId || ''),
    paid: edit ? edit.paid : false,
    subId: edit ? edit.subId : null,
    note: edit ? edit.note : '',
    dur: edit ? edit.dur : 60,
  });
  const [err, setErr] = useState('');
  const set = (k, v) => setF(x => ({...x, [k]: v}));

  /* абонемент клієнта підставляється сам */
  const sub = useMemo(() => db.subs.find(x => x.clientId === f.clientId && x.used < x.total), [db.subs, f.clientId]);
  const who = f.clientId ? byId(db.clients, f.clientId) : null;
  const base$ = clientPrice(db, f.clientId);          /* ціна клієнта або за замовчуванням */

  useEffect(() => {
    if (!f.clientId || edit) return;
    if (sub) setF(x => ({...x, subId: sub.id, paid: true, price: Math.round(sub.price / sub.total)}));
    else setF(x => ({...x, subId: null, price: typedPrice(base$, x.type)}));
  }, [f.clientId]);

  useEffect(() => {
    if (edit) return;
    setF(x => ({...x, dur: SES_TYPES[f.type].dur,
      price: x.subId ? x.price : typedPrice(base$, f.type)}));
  }, [f.type]);

  const taken = db.sessions
    .filter(s => s.status !== 'canceled' && sameDay(s.start, f.when) && (!edit || s.id !== edit.id))
    .map(s => fmtTime(s.start));

  const sp = split(f.price, S);
  const conflict = taken.includes(fmtTime(f.when));

  function save(){
    if (!f.clientId){ setErr(t('session.err.client','Оберіть клієнта')); return; }
    const payload = {clientId: f.clientId, start: f.when.toISOString(), type: f.type, price: f.price,
                     paid: f.paid, subId: f.subId, note: f.note, dur: f.dur};
    if (edit) { Act.updSession(edit.id, payload); Toaster.ok(t('session.saved','Зміни збережено')); }
    else { Act.addSession({...payload, status: +f.when < Date.now() ? 'done' : 'planned'}); Toaster.ok(t('session.added','Тренування додано')); }
    onClose();
  }

  return (
    <Page title={edit ? t('session.edit','Тренування') : t('session.new','Нове тренування')} onClose={onClose}
          right={edit && (
            <button className="iconbtn" onClick={() => { Act.delSession(edit.id); Toaster.show(t('session.deleted','Видалено')); onClose(); }}
                    aria-label={t('common.delete')}><Ic.trash size={19}/></button>)}
          footer={<Btn kind="pri" size="lg" wide onClick={save}>{t('session.save','Зберегти тренування')}</Btn>}>
      <Field label={t('session.client','Клієнт')} hint={err} bad>
        <ClientPick value={f.clientId} onPick={id => { set('clientId', id); setErr(''); }}
                    onCreate={q => nav.go('client.new', {name: q, then:'session'})}/>
      </Field>

      <Field label={t('common.date','Дата')}>
        <DatePick value={f.when} onChange={d => set('when', d)}/>
      </Field>

      <Field label={t('session.time','Час')} hint={conflict ? t('session.conflict','На цей час уже є тренування') : null} bad={conflict}>
        <TimePick value={f.when} onChange={d => set('when', d)} taken={taken}/>
      </Field>

      <Field label={t('session.type','Тип тренування')}>
        <div className="chips">
          {Object.entries(SES_TYPES).map(([k, v]) => (
            <button key={k} className={cx('chip', f.type === k && 'on')} onClick={() => set('type', k)}>{v.title}</button>
          ))}
        </div>
      </Field>

      <Field label={t('session.price','Вартість')}
             hint={f.subId ? t('session.price.sub','Ціна одного заняття з абонемента')
                   : who && who.price ? t('session.price.fix','Закріплена ціна цього клієнта — можна змінити для цього тренування')
                   : t('session.price.def','Підставлено ціну за замовчуванням — змініть, якщо сьогодні інша сума')}>
        <Input value={f.price} onChange={e => set('price', +e.target.value.replace(/\D/g,'') || 0)} inputMode="numeric" suffix={S.currency}/>
        {!f.subId && (
          <div className="chips" style={{marginTop:8}}>
            {[...new Set([base$, S.price, Math.round(base$ * 1.25), Math.round(base$ * .75)])]
              .filter(v => v > 0).sort((a, b) => a - b).map(v => (
              <button key={v} className={cx('chip', f.price === v && 'on')} onClick={() => set('price', v)}>{money(v)}</button>
            ))}
          </div>
        )}
      </Field>

      <Field label={t('session.payment','Оплата')}>
        <div className="segm">
          <button className={cx(f.subId && 'on')} disabled={!sub}
                  onClick={() => sub && setF(x => ({...x, subId: sub.id, paid:true, price: Math.round(sub.price / sub.total)}))}
                  style={{opacity: sub ? 1 : .4}}>{t('pay.package','З абонемента')}</button>
          <button className={cx(!f.subId && f.paid && 'on')} onClick={() => setF(x => ({...x, subId:null, paid:true}))}>{t('pay.paid','Оплачено')}</button>
          <button className={cx(!f.subId && !f.paid && 'on')} onClick={() => setF(x => ({...x, subId:null, paid:false}))}>{t('pay.later','Потім')}</button>
        </div>
      </Field>
      {sub && f.subId && (
        <div className="muted" style={{fontSize:12.5, marginTop:8, marginLeft:2}}>
          {t('session.sub.left','Залишок абонемента')}: {sub.total - sub.used} / {sub.total}
        </div>
      )}

      <div className="card pad" style={{marginTop:16, background:'var(--accent-soft)', borderColor:'transparent'}}>
        <Rowline k={t('home.turnover','Оборот')} v={money(sp.gross)}/>
        {S.gymMode !== 'none' && <Rowline k={t('home.gym','Залу')} v={'−' + money(sp.gym)} tone="var(--ink-2)"/>}
        <Rowline k={t('session.toyou','Тренеру')} v={money(sp.net)} tone="var(--accent)" strong/>
      </div>

      <Field label={t('session.note','Нотатка до тренування')}>
        <textarea className="inp" value={f.note} onChange={e => set('note', e.target.value)}
                  placeholder={t('session.note.ph','Напр.: тест на 1ПМ, або прийти на 10 хв раніше')}/>
      </Field>
    </Page>
  );
};

/* ─────────── 5. КАЛЕНДАР ─────────── */
const Calendar = ({loading}) => {
  const db = useDB();
  const nav = useNav();
  const [view, setView] = useState('day');
  const [cur, setCur] = useState(() => d0(new Date()));
  const [open, setOpen] = useState(null);
  const S = db.settings;

  const sesOf = d => db.sessions.filter(s => sameDay(s.start, d))
    .sort((a, b) => +new Date(a.start) - +new Date(b.start));
  const dayList = sesOf(cur);
  const dayStats = useMemo(() => {
    const [f, tt] = periodRange('day', cur);
    return stats(db, f, tt);
  }, [db, cur]);

  const weekStart = useMemo(() => addDays(cur, -((cur.getDay() + 6) % 7)), [cur]);
  const monthCells = useMemo(() => {
    const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const start = addDays(first, -((first.getDay() + 6) % 7));
    return Array.from({length: 42}, (_, i) => addDays(start, i));
  }, [cur]);

  if (loading) return <SkScreen/>;

  const shift = n => setCur(view === 'month' ? addMonths(cur, n) : addDays(cur, view === 'week' ? n * 7 : n));

  return (
    <Fragment>
      <div className="appbar">
        <button className="iconbtn" onClick={() => shift(-1)} aria-label="−"><Ic.left/></button>
        <button className="title" onClick={() => setCur(d0(new Date()))}>
          {view === 'month' ? fmtMon(cur) : view === 'week'
            ? fmtDMs(weekStart) + ' — ' + fmtDMs(addDays(weekStart, 6))
            : cap(relDay(cur)) + ', ' + fmtDM(cur)}
        </button>
        <button className="iconbtn" onClick={() => shift(1)} aria-label="+"><Ic.right/></button>
      </div>

      <div className="screen">
        <Segm value={view} onChange={setView}
              items={[{v:'day', t:t('common.day','День')}, {v:'week', t:t('common.week','Тиждень')}, {v:'month', t:t('common.month','Місяць')}]}/>

        {view === 'week' && (
          <div className="week-strip" style={{marginTop:12}}>
            {Array.from({length:7}, (_, i) => addDays(weekStart, i)).map((d, i) => {
              const n = sesOf(d).filter(s => s.status !== 'canceled').length;
              return (
                <button key={i} className={cx('week-day', sameDay(d, cur) && 'on')} onClick={() => setCur(d0(d))}>
                  <div className="wd">{fmtDow(d)}</div>
                  <div className="dn num">{d.getDate()}</div>
                  <div className="cnt">{Array.from({length: Math.min(n, 3)}, (_, k) => <i key={k}/>)}</div>
                </button>
              );
            })}
          </div>
        )}

        {view === 'month' && (
          <div style={{marginTop:12}}>
            <div className="cal-grid">
              {['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(d => <div key={d} className="cal-dow">{d}</div>)}
            </div>
            <div className="cal-grid">
              {monthCells.map((d, i) => {
                const n = sesOf(d).filter(s => s.status !== 'canceled').length;
                return (
                  <button key={i} className={cx('cal-day', d.getMonth() !== cur.getMonth() && 'out',
                                                sameDay(d, new Date()) && 'today', sameDay(d, cur) && 'on')}
                          onClick={() => setCur(d0(d))}>
                    <span className="num">{d.getDate()}</span>
                    <span className="pips">{Array.from({length: Math.min(n, 3)}, (_, k) => <i key={k}/>)}</span>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* підсумок дня */}
        <div className="card pad" style={{marginTop:14, display:'flex', gap:14, alignItems:'center'}}>
          <div style={{flex:1}}>
            <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{cap(relDay(cur))}</div>
            <div className="dsp" style={{fontSize:19, fontWeight:800, marginTop:2}}>
              {nSessions(dayList.filter(s => s.status !== 'canceled').length)}
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('home.net','Чистими')}</div>
            <div className="money num" style={{fontSize:19, color:'var(--accent)'}}>{money(dayStats.net)}</div>
          </div>
        </div>

        {/* стрічка дня */}
        {dayList.length === 0 ? (
          <div className="card" style={{marginTop:12}}>
            <Empty icon={<Ic.cal size={28}/>} title={t('cal.free','Вільний день')}
                   text={t('cal.free.t','На цю дату тренувань немає.')}
                   action={<Btn kind="soft" size="sm" onClick={() => nav.go('session.new', {date: cur.toISOString()})}>
                             <Ic.plus size={17}/>{t('cal.add','Додати тренування')}</Btn>}/>
          </div>
        ) : view === 'day' ? (
          <div className="tl" style={{marginTop:16}}>
            {Array.from({length: S.dayEnd - S.dayStart + 1}, (_, i) => S.dayStart + i).map(h => {
              const items = dayList.filter(s => new Date(s.start).getHours() === h);
              return (
                <div key={h} className="hr">
                  <div className="lab num">{String(h).padStart(2,'0')}:00</div>
                  {items.map(s => {
                    const c = byId(db.clients, s.clientId);
                    return (
                      <button key={s.id} className={cx('ev', (SES_TYPES[s.type] || SES_TYPES.personal).hue, s.status)}
                              style={{width:'100%', textAlign:'left'}} onClick={() => setOpen(s)}>
                        <b>{fmtTime(s.start)} · {c ? c.name : '—'}</b>
                        <span>{(SES_TYPES[s.type] || SES_TYPES.personal).title} · {money(s.price)} · {payLabel(s)}</span>
                      </button>
                    );
                  })}
                </div>
              );
            })}
          </div>
        ) : (
          <div className="rows" style={{marginTop:12}}>
            {dayList.map(s => <SessionRow key={s.id} s={s} onOpen={setOpen}/>)}
          </div>
        )}
      </div>

      <button className="fab" onClick={() => nav.go('session.new', {date: cur.toISOString()})} aria-label={t('cal.add')}>
        <Ic.plus size={26}/>
      </button>
      {open && <SessionSheet id={open.id} onClose={() => setOpen(null)}/>}
    </Fragment>
  );
};

/* ─────────── 6. КЛІЄНТИ ─────────── */
const Clients = ({loading}) => {
  const db = useDB();
  const nav = useNav();
  const [q, setQ] = useState('');
  const [sort, setSort] = useState('next');

  const rows = useMemo(() => db.clients.filter(c => !c.archived).map(c => ({c, st: clientStats(db, c.id)})), [db]);
  const filtered = rows.filter(({c}) => (c.name + ' ' + (c.phone || '') + ' ' + (c.goal || ''))
    .toLowerCase().includes(q.trim().toLowerCase()));
  const sorted = [...filtered].sort((a, b) => {
    if (sort === 'name') return a.c.name.localeCompare(b.c.name, 'uk');
    if (sort === 'debt') return b.st.debt - a.st.debt;
    if (sort === 'top')  return b.st.spent - a.st.spent;
    const an = a.st.next ? +new Date(a.st.next.start) : Infinity;
    const bn = b.st.next ? +new Date(b.st.next.start) : Infinity;
    return an - bn;
  });

  if (loading) return <SkScreen/>;

  return (
    <Fragment>
      <div className="appbar">
        <div className="title">{t('nav.clients','Клієнти')} · {db.clients.filter(c => !c.archived).length}</div>
        <button className="iconbtn boxed" onClick={() => nav.go('client.new')} aria-label={t('client.new')}>
          <Ic.plus size={20} style={{color:'var(--accent)'}}/>
        </button>
      </div>

      <div className="screen">
        <div className="search">
          <Ic.search size={18}/>
          <input className="inp" placeholder={t('client.search','Пошук за іменем або телефоном')}
                 value={q} onChange={e => setQ(e.target.value)}/>
        </div>

        <div className="chips" style={{marginTop:10}}>
          {[['next', t('client.sort.next','Найближчі')], ['name', t('client.sort.name','За іменем')],
            ['debt', t('client.sort.debt','З боргом')], ['top', t('client.sort.top','Найцінніші')]].map(([v, tx]) => (
            <button key={v} className={cx('chip', sort === v && 'on')} onClick={() => setSort(v)}>{tx}</button>
          ))}
        </div>

        {db.clients.length === 0 ? (
          <Empty icon={<Ic.users size={30}/>} title={t('client.empty','Ще немає клієнтів')}
                 text={t('client.empty.t','Додайте першого клієнта — і зможете планувати тренування та рахувати дохід.')}
                 action={<Btn kind="pri" onClick={() => nav.go('client.new')}><Ic.plus size={18}/>{t('client.new','Новий клієнт')}</Btn>}/>
        ) : sorted.length === 0 ? (
          <Empty icon={<Ic.search size={28}/>} title={t('client.nofind','Нікого не знайшли')}
                 text={t('client.nofind.t','Перевірте запит або створіть нового клієнта.')}
                 action={<Btn kind="soft" size="sm" onClick={() => nav.go('client.new', {name: q})}>
                           <Ic.plus size={17}/>{t('client.new','Новий клієнт')}</Btn>}/>
        ) : (
          <div className="rows" style={{marginTop:12}}>
            {sorted.map(({c, st}) => (
              <button key={c.id} className="row" onClick={() => nav.go('client', {id: c.id})}>
                <Avatar name={c.name} photo={c.photo} size={46} ring={!!st.sub}/>
                <div style={{flex:1, minWidth:0}}>
                  <div className="nm" style={{display:'flex', alignItems:'center', gap:6}}>
                    <span style={{whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{c.name}</span>
                    {st.debt > 0 && <span className="badge neg">{money(st.debt)}</span>}
                  </div>
                  <div className="ds">
                    {nSessions(st.done)}
                    {st.next ? ' · ' + t('client.next','далі') + ' ' + relDay(st.next.start).toLowerCase() + ', ' + fmtTime(st.next.start)
                             : st.lapsedDays !== null ? ' · ' + nDays(st.lapsedDays) + ' ' + t('lapse.without','без тренувань') : ''}
                  </div>
                </div>
                {st.sub && <span className="badge acc">{st.sub.total - st.sub.used}</span>}
                <Ic.right size={17} className="chev"/>
              </button>
            ))}
          </div>
        )}
      </div>

      <button className="fab" onClick={() => nav.go('client.new')} aria-label={t('client.new')}><Ic.plus size={26}/></button>
    </Fragment>
  );
};

        <Btn kind="sec" wide onClick={() => nav.go('packages', {clientId: c.id})}><Ic.ticket size={18}/>{t('client.buysub','Оформити абонемент')}</Btn>

/* ─────────── 8. ДОДАТИ / РЕДАГУВАТИ КЛІЄНТА ─────────── */
const ClientForm = ({params, onClose}) => {
  const db = useDB();
  const nav = useNav();
  const edit = params.id ? byId(db.clients, params.id) : null;
  const [f, setF] = useState({
    name: edit ? edit.name : (params.name || ''),
    phone: edit ? edit.phone : '+380 ',
    goal: edit ? edit.goal : '',
    photo: edit ? edit.photo : '',
    note: edit ? edit.note : '',
    price: edit && edit.price ? String(edit.price) : '',
  });
  const [err, setErr] = useState({});
  const set = (k, v) => { setF(x => ({...x, [k]: v})); setErr(x => ({...x, [k]: null})); };

  function photo(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024){ Toaster.bad(t('photo.big','Фото завелике — до 3 МБ')); return; }
    const r = new FileReader();
    r.onload = () => set('photo', r.result);
    r.onerror = () => Toaster.bad(t('photo.err','Не вдалося прочитати фото'));
    r.readAsDataURL(file);
  }

  function save(){
    const e = {};
    if (f.name.trim().length < 2) e.name = t('client.err.name','Вкажіть ім’я');
    setErr(e);
    if (Object.keys(e).length) return;
    const data = {...f, name: f.name.trim(), price: f.price ? +f.price : null};
    if (edit){
      Act.updClient(edit.id, data);
      Toaster.ok(t('client.saved','Зміни збережено'));
      onClose();
    } else {
      const c = Act.addClient(data);
      Toaster.ok(t('client.added','Клієнта додано'));
      onClose();
      if (params.then === 'session') setTimeout(() => nav.go('session.new', {clientId: c.id}), 80);
    }
  }

  return (
    <Page title={edit ? t('client.edit','Редагувати') : t('client.new','Новий клієнт')} onClose={onClose}
          footer={<Btn kind="pri" size="lg" wide onClick={save}>{t('common.save','Зберегти')}</Btn>}>
      <div style={{display:'grid', placeItems:'center', marginTop:6}}>
        <label style={{position:'relative', cursor:'pointer'}}>
          <Avatar name={f.name || '?'} photo={f.photo} size={92}/>
          <div style={{position:'absolute', right:-2, bottom:-2, width:30, height:30, borderRadius:'50%',
                       background:'var(--accent)', color:'#fff', display:'grid', placeItems:'center',
                       border:'3px solid var(--bg)'}}><Ic.plus size={16}/></div>
          <input type="file" accept="image/*" onChange={photo} style={{display:'none'}}/>
        </label>
        {f.photo && <button className="btn ghost sm" style={{color:'var(--ink-3)'}} onClick={() => set('photo','')}>{t('photo.del','Прибрати фото')}</button>}
      </div>

      <Field label={t('client.name','Ім’я')} hint={err.name} bad>
        <Input value={f.name} onChange={e => set('name', e.target.value)} placeholder="Іван Петров" bad={!!err.name} autoFocus={!edit}/>
      </Field>
      <Field label={t('client.phone','Телефон')}>
        <Input value={f.phone} onChange={e => set('phone', phoneMask(e.target.value))} inputMode="tel"/>
      </Field>
      <Field label={t('client.price','Вартість тренування')}
             hint={f.price
               ? t('client.price.fix','Ця сума підставлятиметься в кожне тренування з цим клієнтом')
               : t('client.price.def','Порожньо — береться ціна за замовчуванням, ') + money(db.settings.price)}>
        <Input value={f.price} onChange={e => set('price', e.target.value.replace(/\D/g,''))}
               inputMode="numeric" placeholder={String(db.settings.price)} suffix={db.settings.currency}/>
      </Field>
      <Field label={t('client.goal','Мета')}>
        <div className="chips">
          {GOALS.map(g => (
            <button key={g} className={cx('chip', f.goal === g && 'on')} onClick={() => set('goal', f.goal === g ? '' : g)}>{g}</button>
          ))}
        </div>
      </Field>
      <Field label={t('client.note','Коротка нотатка')}>
        <textarea className="inp" style={{minHeight:80}} value={f.note} onChange={e => set('note', e.target.value)}
                  placeholder={t('client.note.ph','Напр.: травма коліна, працює до 19:00')}/>
      </Field>
    </Page>
  );
};

/* ─────────── повідомлення клієнту (борг / повернення) ─────────── */
const Remind = ({params, onClose}) => {
  const db = useDB();
  const c = byId(db.clients, params.clientId);
  const st = c ? clientStats(db, c.id) : null;
  const name = c ? c.name.split(' ')[0] : '';
  const tpl = params.kind === 'lapsed'
    ? [
        `${name}, привіт! Давно вас не було в залі — усе гаразд? Є вільні місця на цьому тижні, можу поставити ваш звичний час.`,
        `${name}, доброго дня! Пропоную повернутись до тренувань — почнемо з легкого відновлювального. Коли зручно?`,
      ]
    : [
        `${name}, доброго дня! Нагадую про оплату за тренування — ${money(params.sum || (st ? st.debt : 0))}. Дякую!`,
        `${name}, привіт! Підкажіть, коли зручно закрити оплату за минулі тренування (${money(params.sum || (st ? st.debt : 0))})?`,
      ];
  const [text, setText] = useState(tpl[0]);
  if (!c) return <Page title="—" onClose={onClose}><ErrorBox title={t('client.gone','Клієнта не знайдено')}/></Page>;

  return (
    <Page title={t('remind.title','Повідомлення')} sub={c.name} onClose={onClose}
          footer={
            <div className="stack">
              <a className="btn pri wide" href={smsHref(c.phone, text)}><Ic.msg size={18}/>{t('remind.sms','Надіслати SMS')}</a>
              <div className="grid2">
                <a className="btn sec" href={telHref(c.phone)}><Ic.phone size={18}/>{t('remind.call','Подзвонити')}</a>
                <Btn kind="sec" onClick={() => {
                  navigator.clipboard && navigator.clipboard.writeText(text);
                  Toaster.ok(t('remind.copied','Текст скопійовано'));
                }}><Ic.copy size={18}/>{t('remind.copy','Копіювати')}</Btn>
              </div>
            </div>}>
      <div className="card pad" style={{marginTop:4, display:'flex', gap:12, alignItems:'center'}}>
        <Avatar name={c.name} photo={c.photo} size={46}/>
        <div style={{flex:1, minWidth:0}}>
          <b style={{fontSize:15}}>{c.name}</b>
          <div className="muted num" style={{fontSize:13}}>{c.phone || t('remind.nophone','Номер не вказано')}</div>
        </div>
        {st && st.debt > 0 && <span className="badge neg">{money(st.debt)}</span>}
      </div>

      <Field label={t('remind.tpl','Шаблон')}>
        <div className="stack">
          {tpl.map((x, i) => (
            <button key={i} className={cx('card pad press')} style={{textAlign:'left', fontSize:13.5, lineHeight:1.5,
                    borderColor: text === x ? 'var(--accent)' : 'var(--line)'}} onClick={() => setText(x)}>{x}</button>
          ))}
        </div>
      </Field>
      <Field label={t('remind.text','Текст повідомлення')}>
        <textarea className="inp" value={text} onChange={e => setText(e.target.value)}/>
      </Field>
    </Page>
  );
};

/* ─────────── борги (повний список) ─────────── */
const Debts = ({onClose}) => {
  const db = useDB();
  const nav = useNav();
  const items = useMemo(() => {
    const m = new Map();
    db.sessions.filter(isDebt).forEach(s => {
      const cur = m.get(s.clientId) || {clientId: s.clientId, sum:0, n:0, oldest: s.start, list:[]};
      cur.sum += s.price; cur.n++; cur.list.push(s);
      if (+new Date(s.start) < +new Date(cur.oldest)) cur.oldest = s.start;
      m.set(s.clientId, cur);
    });
    return [...m.values()].sort((a, b) => b.sum - a.sum);
  }, [db.sessions]);
  const total = sum(items, x => x.sum);

  return (
    <Page title={t('menu.debts','Борги')} onClose={onClose}>
      {items.length === 0 ? (
        <Empty icon={<Ic.check size={30}/>} title={t('debts.none','Боргів немає')}
               text={t('debts.none.t','Усі проведені тренування оплачені. Так тримати.')}/>
      ) : (
        <Fragment>
          <div className="card pad" style={{marginTop:4}}>
            <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('debts.total','Загалом винні')}</div>
            <div className="dsp num" style={{fontSize:28, fontWeight:800, color:'var(--neg)'}}>{money(total)}</div>
            <div className="muted" style={{fontSize:12.5}}>{nClients(items.length)} · {nSessions(sum(items, x => x.n))}</div>
          </div>
          <div className="stack" style={{marginTop:12}}>
            {items.map(d => {
              const c = byId(db.clients, d.clientId);
              if (!c) return null;
              return (
                <div key={d.clientId} className="card pad">
                  <div style={{display:'flex', gap:12, alignItems:'center'}}>
                    <Avatar name={c.name} photo={c.photo} size={44}/>
                    <div style={{flex:1, minWidth:0}}>
                      <b style={{fontSize:15}}>{c.name}</b>
                      <div className="muted" style={{fontSize:12.5}}>
                        {nSessions(d.n)} · {t('debt.from','з')} {fmtDM(d.oldest)}
                      </div>
                    </div>
                    <div className="money num" style={{fontSize:17, color:'var(--neg)'}}>{money(d.sum)}</div>
                  </div>
                  <div className="grid2" style={{marginTop:10}}>
                    <Btn kind="soft" size="sm" onClick={() => nav.go('remind', {clientId: c.id, sum: d.sum})}>
                      <Ic.msg size={16}/>{t('debt.remind','Нагадати')}
                    </Btn>
                    <Btn kind="pri" size="sm" onClick={() => {
                      d.list.forEach(s => Act.pay(s.id));
                      Toaster.ok(t('debt.closed','Борг закрито'));
                    }}><Ic.check size={16}/>{t('debt.pay','Оплачено')}</Btn>
                  </div>
                </div>
              );
            })}
          </div>
        </Fragment>
      )}
    </Page>
  );
};

/* ─────────── кому час написати (повний список) ─────────── */
const Lapsed = ({onClose}) => {
  const db = useDB();
  const nav = useNav();
  const S = db.settings;
  const items = useMemo(() => db.clients.filter(c => !c.archived).map(c => ({c, st: clientStats(db, c.id)}))
    .filter(x => x.st.lapsedDays !== null && x.st.lapsedDays >= S.lapseDays && !x.st.next)
    .sort((a, b) => b.st.lapsedDays - a.st.lapsedDays), [db]);

  return (
    <Page title={t('home.lapsed','Кому час написати')} sub={t('lapse.sub','Не тренувались понад') + ' ' + nDays(S.lapseDays)} onClose={onClose}>
      {items.length === 0 ? (
        <Empty icon={<Ic.fire size={30}/>} title={t('lapse.none','Усі на місці')}
               text={t('lapse.none.t','Ніхто не зник з поля зору — у всіх активних клієнтів є свіжі тренування або запис наперед.')}/>
      ) : (
        <div className="stack" style={{marginTop:4}}>
          {items.map(({c, st}) => <LapsedCard key={c.id} c={c} days={st.lapsedDays} last={st.last}/>)}
        </div>
      )}
    </Page>
  );
};

/* ─────────── 9. ПРОДАЖІ (товари + абонементи) ─────────── */
const Sales = ({loading}) => {
  const db = useDB();
  const nav = useNav();
  const [tab, setTab] = useState('goods');
  if (loading) return <SkScreen/>;

  const [mFrom, mTo] = periodRange('month', new Date());
  const st = stats(db, mFrom, mTo);
  const lowStock = db.products.filter(p => p.stock > 0 && p.stock <= 2).length;
  const outStock = db.products.filter(p => p.stock === 0).length;
  const activeSubs = db.subs.filter(s => s.used < s.total);

  return (
    <Fragment>
      <div className="appbar">
        <div className="title">{t('nav.sales','Продажі')}</div>
        <button className="iconbtn boxed" onClick={() => nav.go(tab === 'goods' ? 'product.new' : 'package.new')}
                aria-label={t('common.add')}><Ic.plus size={20} style={{color:'var(--accent)'}}/></button>
      </div>

      <div className="screen">
        {/* підсумок місяця */}
        <div className="card pad">
          <div className="between">
            <div>
              <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('sales.month','Продажі за')} {fmtMonth(new Date()).toLowerCase()}</div>
              <div className="dsp num" style={{fontSize:26, fontWeight:800, marginTop:2}}>{money(st.salesRevenue)}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('sales.profit','Прибуток')}</div>
              <div className="money num" style={{fontSize:18, color:'var(--pos)'}}>{money(st.salesProfit)}</div>
            </div>
          </div>
          <div className="muted" style={{fontSize:12.5, marginTop:6}}>
            {t('sales.units','Продано одиниць')}: {st.salesCount}
          </div>
        </div>

        <Tabs value={tab} onChange={setTab}
              items={[{v:'goods', t:t('sales.goods','Товари')}, {v:'subs', t:t('sales.subs','Абонементи')}]}/>

        {tab === 'goods' ? (
          <Fragment>
            {(lowStock > 0 || outStock > 0) && (
              <div className="card pad" style={{marginTop:12, display:'flex', gap:10, alignItems:'center',
                   background:'var(--warn-soft)', borderColor:'transparent'}}>
                <Ic.warn size={20} style={{color:'var(--warn)'}}/>

                     text={t('goods.empty.t','Додайте протеїн, шейкер чи резинки — застосунок рахуватиме залишок і прибуток.')}
                     action={<Btn kind="pri" onClick={() => nav.go('product.new')}><Ic.plus size={18}/>{t('goods.new','Новий товар')}</Btn>}/>
            ) : (
              <Fragment>
                <div className="stack" style={{marginTop:12}}>
                  {db.products.map(p => (
                    <button key={p.id} className="card pad press" style={{textAlign:'left', display:'flex', gap:12, alignItems:'center'}}
                            onClick={() => nav.go('product.new', {id: p.id})}>
                      <div style={{width:46, height:46, borderRadius:14, background:'var(--surface-2)', display:'grid',
                                   placeItems:'center', fontSize:22, flex:'none'}}>{p.icon}</div>
                      <div style={{flex:1, minWidth:0}}>

const PERIODS = () => ([
  {v:'day',   t:t('common.today','Сьогодні')},
  {v:'week',  t:t('common.week','Тиждень')},
  {v:'month', t:t('common.month','Місяць')},
  {v:'year',  t:t('common.year','Рік')},
]);

const Finance = ({onClose}) => {
  const db = useDB();
  const nav = useNav();
  const [p, setP] = useState('month');
  const [from, to] = periodRange(p, new Date());
  const st = stats(db, from, to);
  const delta = useMemo(() => deltaFor(db, p), [db, p]);

  /* серія: по днях (день/тиждень/місяць) або по місяцях (рік) */
  const series = useMemo(() => {
    if (p === 'year'){
      return Array.from({length:12}, (_, i) => {
        const m = new Date(from.getFullYear(), i, 1);
        const s = stats(db, m, addMonths(m, 1));
        return {label: fmtMonS(m), v: s.net};
      });
    }
    const days = p === 'day' ? 7 : Math.round((+to - +from) / DAY);
    const start = p === 'day' ? addDays(from, -6) : from;
    return Array.from({length: days}, (_, i) => {
      const d = addDays(start, i);
      const s = stats(db, d, addDays(d, 1));
      return {label: p === 'month' ? String(d.getDate()) : fmtDow(d), v: s.net, on: sameDay(d, new Date())};
    });
  }, [db, p]);

  const parts = [
    {t: t('fin.sessions','Тренування'), v: st.net, c:'var(--accent)'},
    {t: t('fin.goods','Товари'), v: st.salesProfit, c:'var(--accent-2)'},
  ];

  return (
    <Page title={t('menu.fin','Фінанси')} onClose={onClose}
          right={<button className="iconbtn" onClick={() => nav.go('stats')} aria-label={t('menu.stats')}><Ic.chart size={20}/></button>}>
      <Segm value={p} onChange={setP} items={PERIODS()}/>

      <div className="hero" style={{marginTop:14}}>
        <div className="between">
          <span className="lbl">{t('fin.total','Загальний дохід')}</span>
          <span className={cx('delta', delta >= 0 ? 'pos' : 'neg')}>{pct(delta)}</span>
        </div>
        <div className="val num">{money(st.total)}</div>
        <div className="sub">{nSessions(st.count)} · {t('fin.goods','товари')} {money(st.salesProfit)}</div>
      </div>

      <div className="card pad" style={{marginTop:12}}>
        <Rowline k={t('home.turnover','Оборот')} v={money(st.gross)} strong/>

/* ─────────── 14. СТАТИСТИКА / DASHBOARD ─────────── */
const Stats = ({onClose}) => {
  const db = useDB();
  const nav = useNav();
  const [p, setP] = useState('month');
  const [from, to] = periodRange(p, new Date());
  const st = stats(db, from, to);

  const top = useMemo(() => db.clients.map(c => {
    const ses = db.sessions.filter(s => s.clientId === c.id && isBillable(s) && inRange(+new Date(s.start), from, to));
    const sales = db.sales.filter(x => x.clientId === c.id && inRange(x.ts, from, to));
    return {c, n: ses.length, v: sum(ses, s => s.price) + sum(sales, x => x.price * x.qty)};
  }).filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 5), [db, p]);

  const byType = useMemo(() => {
    const m = {};
    db.sessions.filter(s => isBillable(s) && inRange(+new Date(s.start), from, to))
      .forEach(s => { m[s.type] = (m[s.type] || 0) + 1; });
    return Object.entries(m).map(([k, v]) => ({t: (SES_TYPES[k] || SES_TYPES.personal).title, v}));
  }, [db, p]);

  const dow = useMemo(() => {
    const names = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
    const m = new Array(7).fill(0);
    db.sessions.filter(s => isBillable(s) && inRange(+new Date(s.start), from, to))
      .forEach(s => { const d = (new Date(s.start).getDay() + 6) % 7; m[d] += s.price; });
    return m.map((v, i) => ({label: names[i], v, on: i === (new Date().getDay() + 6) % 7}));
  }, [db, p]);

  const cards = [
    {k: t('st.income','Дохід'), v: money(st.gross), ic:<Ic.refresh size={18}/>},
    {k: t('st.net','Чистий дохід'), v: money(st.net), ic:<Ic.wallet size={18}/>, tone:'var(--accent)'},
    {k: t('st.gym','Віддано залу'), v: money(st.gym), ic:<Ic.bank size={18}/>},
    {k: t('st.count','Тренувань'), v: st.count, ic:<Ic.dumb size={18}/>},
    {k: t('st.clients','Клієнтів'), v: st.clients, ic:<Ic.users size={18}/>},
    {k: t('st.new','Нових клієнтів'), v: st.newClients, ic:<Ic.star size={18}/>, tone:'var(--pos)'},
    {k: t('st.sales','Продажів'), v: st.salesCount, ic:<Ic.bag size={18}/>},
    {k: t('st.gprofit','Прибуток з товарів'), v: money(st.salesProfit), ic:<Ic.box size={18}/>, tone:'var(--pos)'},
    {k: t('st.avg','Середній чек'), v: money(st.avg), ic:<Ic.card size={18}/>},
    {k: t('st.per','Тренувань на клієнта'), v: st.sesPerClient, ic:<Ic.target size={18}/>},
  ];

  return (
    <Page title={t('menu.stats','Статистика')} onClose={onClose}
          right={<button className="iconbtn" onClick={() => nav.go('finance')} aria-label={t('menu.fin')}><Ic.wallet size={20}/></button>}>
      <Segm value={p} onChange={setP} items={PERIODS()}/>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:9, marginTop:14}}>
        {cards.map((c, i) => (
          <div key={i} className="card pad">
            <div style={{color:'var(--accent)', opacity:.9}}>{c.ic}</div>
            <div className="dsp num" style={{fontSize:19, fontWeight:800, marginTop:8, color: c.tone}}>{c.v}</div>
            <div className="muted" style={{fontSize:12, fontWeight:600, marginTop:2}}>{c.k}</div>
          </div>
        ))}
      </div>

      <div className="sechead"><div className="h2">{t('st.dow','Дохід по днях тижня')}</div></div>
      <div className="card pad">
        {dow.every(d => !d.v)
          ? <Empty icon={<Ic.chart size={28}/>} title={t('fin.nodata','Даних поки немає')}/>
          : <Bars data={dow}/>}

      <div className="sechead"><div className="h2">{t('st.top','Найцінніші клієнти')}</div></div>
      {top.length === 0 ? (

             text={t('st.top.none.t','За цей період ще не було оплачених тренувань.')}/></div>

          <div className="card pad">

const Settings = ({onClose}) => {
  const db = useDB();
  const nav = useNav();
  const S = db.settings;
  const [wipe, setWipe] = useState(false);
  const [pinMode, setPinMode] = useState(null);       // set | confirm
  const [pin1, setPin1] = useState('');
  const [perm, setPerm] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'unsupported');

  async function askPerm(){
    if (typeof Notification === 'undefined'){ Toaster.bad(t('set.notif.no','Цей браузер не вміє показувати сповіщення')); return; }
    const r = await Notification.requestPermission();
    setPerm(r);
    if (r === 'granted') Toaster.ok(t('set.notif.ok','Сповіщення увімкнено'));
  }

  function exportJson(){
    try {
      const blob = new Blob([JSON.stringify(Store.state, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'protrainer-' + iso(new Date()) + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      Toaster.ok(t('set.backup.ok','Копію збережено'));
    } catch { Toaster.bad(t('set.backup.err','Не вдалося зберегти копію')); }
  }
  function importJson(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data || !Array.isArray(data.clients)) throw new Error('bad');
        Store.patch(() => ({...emptyDB(), ...data}));
        Toaster.ok(t('set.restore.ok','Дані відновлено'));
      } catch { Toaster.bad(t('set.restore.err','Файл не схожий на копію PRO Trainer')); }
    };
    r.readAsText(file);
  }

  async function onPin(pin){
    if (pinMode === 'set'){ setPin1(pin); setPinMode('confirm'); return; }
    if (pin !== pin1){ Toaster.bad(t('pin.mismatch','PIN не збігся, спробуйте ще')); setPinMode('set'); setPin1(''); return; }
    const meta = Disk.readMeta() || {};
    const {key, salt} = await Vault.derive(pin, meta.pinSalt);
    Vault.key = key;
    Disk.writeMeta({...meta, pinSalt: salt, enc: true});
    Act.settings({secure: true});
    setPinMode(null);
    Toaster.ok(t('pin.on','Базу зашифровано'));
  }

  return (
    <Fragment>
      <Page title={t('menu.set','Налаштування')} onClose={onClose}>
        <div className="sechead tight"><div className="h2">{t('set.money','Гроші')}</div></div>
        <div className="card pad">
          <Field label={t('setup.price','Вартість тренування за замовчуванням')}
                 hint={t('setup.price.hint','Сума підставляється в нове тренування — її можна змінити в будь-якому тренуванні або закріпити окрему ціну за клієнтом.')}>
            <Input value={S.price} onChange={e => Act.settings({price: +e.target.value.replace(/\D/g,'') || 0})}
                   inputMode="numeric" suffix={S.currency} autoFocus={false}/>
          </Field>
          <Field label={t('setup.gym','Що ви віддаєте залу')}>
            <div className="segm">
              {[['percent', t('gym.pct','Відсоток')], ['fixed', t('gym.fix','Фікс. сума')], ['none', t('gym.none','Без комісії')]].map(([v, tx]) => (
                <button key={v} className={cx(S.gymMode === v && 'on')} onClick={() => Act.settings({gymMode: v})}>{tx}</button>
              ))}
            </div>
          </Field>
          {S.gymMode === 'percent' && (

/* ─────────── нагадування ───────────
   Поки застосунок відкритий — планувальник щохвилини перевіряє розклад
   і показує системне сповіщення (Notification API) та запис у стрічці.  */
function useReminders(db){
  useEffect(() => {
    if (!db) return;
    let alive = true;
    const fire = (key, {title, body, type, tone, clientId, to}) => {
      if (Store.state.fired[key]) return;
      Act.markFired(key);
      Act.notify({title, body, type, tone, clientId, to});
      try {
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted')
          new Notification(title, {body, tag: key, icon: 'icon.svg'});
      } catch {}
    };
    const tick = () => {
      if (!alive || !Store.state) return;
      const s = Store.state, N = s.settings.notif, now = Date.now();

      s.sessions.filter(x => x.status === 'planned').forEach(x => {
        const dt = +new Date(x.start) - now;
        const c = byId(s.clients, x.clientId);
        const nm = c ? c.name : t('session.one','Тренування');
        if (N.before20 && dt > 14 * 60000 && dt <= 20 * 60000)
          fire('b20_' + x.id, {title:'🏋️ ' + t('n.soon','Тренування за 20 хвилин'),
            body: nm + ' · ' + fmtTime(x.start), type:'session', clientId: x.clientId});
        if (N.before5 && dt > 0 && dt <= 5 * 60000)
          fire('b5_' + x.id, {title:'🏋️ ' + t('n.soon5','Тренування за 5 хвилин'),
            body: nm + ' · ' + fmtTime(x.start), type:'session', clientId: x.clientId});
      });

      /* щоденні перевірки — раз на добу */
      const dayKey = iso(new Date());
      if (!s.fired['day_' + dayKey]){
        Act.markFired('day_' + dayKey);
        if (N.debt){
          const debts = s.sessions.filter(isDebt);
          const total = sum(debts, x => x.price);
          if (total > 0) fire('debt_' + dayKey, {title: t('n.debt.t','Є неоплачені тренування'),
            body: money(total) + ' · ' + nClients(new Set(debts.map(x => x.clientId)).size), type:'debt', tone:'bad', to:'debts'});
        }
        if (N.lapsed){
          s.clients.filter(c => !c.archived).forEach(c => {
            const cs = clientStats(s, c.id);
            if (cs.lapsedDays !== null && cs.lapsedDays >= s.settings.lapseDays && !cs.next)
              fire('lap_' + c.id + '_' + Math.floor(cs.lapsedDays / 7), {
                title: c.name.split(' ')[0] + ' ' + t('n.lapsed.t','давно не тренувався'),
                body: t('lapse.last','Востаннє') + ': ' + (cs.last ? fmtDM(cs.last.start) : '—'),
                type:'lapsed', clientId: c.id});
          });
        }
        if (N.packageEnd){
          s.subs.filter(x => x.total - x.used <= 1 && x.used < x.total).forEach(x => {
            const c = byId(s.clients, x.clientId);
            if (c) fire('sub_' + x.id, {title: t('n.pack.t','Абонемент закінчується'),
              body: c.name + ' · ' + t('subs.left','залишилось') + ' ' + nSessions(x.total - x.used),
              type:'pack', tone:'warn', clientId: c.id});
          });
        }
        if (N.stock){
          s.products.filter(p => p.stock <= 1).forEach(p => {
            fire('stock_' + p.id + '_' + p.stock, {title: p.stock === 0 ? t('n.stock.out','Товар закінчився') : t('n.stock.low','Товар закінчується'),
              body: p.name + ' · ' + t('goods.left','залишок') + ' ' + p.stock, type:'stock', tone:'warn', to:'sales'});
          });
        }
      }
    };
    const id = setInterval(tick, 60000);
    const x = setTimeout(tick, 2500);
    return () => { alive = false; clearInterval(id); clearTimeout(x); };
  }, [!!db]);
}

/* ─────────── тема ─────────── */
function useTheme(mode){
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => {
      const dark = mode === 'dark' || (mode === 'system' && mq.matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      const m = document.getElementById('metaTheme');
      if (m) m.setAttribute('content', dark ? '#08080B' : '#F5F5F9');
    };
    apply();
    mq.addEventListener('change', apply);
    return () => mq.removeEventListener('change', apply);
  }, [mode]);
}

/* ─────────── маршрути ─────────── */

  'notifs':      p => <Notifs {...p}/>,
  'client':      p => <ClientPage {...p}/>,
  'client.new':  p => <ClientForm {...p}/>,
  'session.new': p => <SessionForm {...p}/>,

  'product.new': p => <ProductForm {...p}/>,
  'package.new': p => <PackageForm {...p}/>,

const TABS = [
  {k:'home',    ic: Ic.home,   t:() => t('nav.home','Головна')},
  {k:'cal',     ic: Ic.cal,    t:() => t('nav.cal','Календар')},
  {k:'clients', ic: Ic.users,  t:() => t('nav.clients','Клієнти')},
  {k:'sales',   ic: Ic.bag,    t:() => t('nav.sales','Продажі')},
  {k:'profile', ic: Ic.user,   t:() => t('nav.profile','Профіль')},
];

/* ─────────── оболонка ─────────── */
const Shell = () => {
  const db = useDB();
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]);
  const [quick, setQuick] = useState(false);
  const [loading, setLoading] = useState(true);

  useTheme(db.settings.theme);
  useReminders(db);
  useEffect(() => { const x = setTimeout(() => setLoading(false), 420); return () => clearTimeout(x); }, []);

  /* апаратна кнопка «назад» закриває верхній екран, а не застосунок:
     кожен відкритий екран — один запис в історії, знімається лише через popstate */
  const pushed = useRef(0);
  const go = useCallback((name, params) => {
    if (!ROUTES[name]){ setTab(name); return; }
    setStack(s => [...s, {name, params: params || {}, key: uid('rt')}]);
    try { history.pushState({pt: ++pushed.current}, ''); } catch { pushed.current++; }
  }, []);
  useEffect(() => {
    const onPop = () => {
      pushed.current = Math.max(0, pushed.current - 1);
      setStack(s => (s.length ? s.slice(0, -1) : s));
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  const closeTop = useCallback(() => {
    if (pushed.current > 0){ try { history.back(); return; } catch {} }
    setStack(s => s.slice(0, -1));
  }, []);
  const toTab = useCallback(k => {
    if (pushed.current > 0){ const n = pushed.current; pushed.current = 0; try { history.go(-n); } catch {} }
    setStack([]);
    setTab(k);
  }, []);

  const nav = useMemo(() => ({go, back: closeTop, tab: toTab}), [go, closeTop, toTab]);

  const Screen = {home: Home, cal: Calendar, clients: Clients, sales: Sales, profile: Profile}[tab] || Home;

  return (
    <NavCtx.Provider value={nav}>
      <div className="app">
        <Boundary key={tab}><Screen loading={loading}/></Boundary>

        {tab === 'home' && (
          <button className="fab" onClick={() => setQuick(true)} aria-label={t('common.add','Додати')}><Ic.plus size={26}/></button>
        )}

        <nav className="nav">
          {TABS.map(x => (
            <button key={x.k} className={cx(tab === x.k && 'on')} onClick={() => toTab(x.k)}
                    aria-current={tab === x.k ? 'page' : undefined}>
              <x.ic size={23}/><span>{x.t()}</span>
            </button>
          ))}
        </nav>

        {stack.map((r, i) => (
          <Boundary key={r.key}>
            <div style={{zIndex: 50 + i, position:'relative'}}>
              {ROUTES[r.name]({params: r.params, onClose: closeTop})}
            </div>
          </Boundary>
        ))}

        <QuickAdd open={quick} onClose={() => setQuick(false)}/>
        <ToastHost/>
      </div>
    </NavCtx.Provider>
  );
};

/* ─────────── запуск ─────────── */
const Boot = () => {
  const [phase, setPhase] = useState('load');       // load | onboard | auth | setup | pin | app | error
  const [account, setAccount] = useState(null);
  const [pinErr, setPinErr] = useState('');
  const [, force] = useState(0);

  useEffect(() => {
    (async () => {
      try {
        const raw = Disk.readRaw();
        if (!raw){ setPhase('onboard'); return; }
        const parsed = JSON.parse(raw);
        if (parsed && parsed.enc){ setPhase('pin'); return; }
        boot(parsed);
      } catch (e){
        console.error(e);
        setPhase('error');
      }
    })();
  }, []);

  function boot(data){
    const db = {...emptyDB(), ...data, settings: {...emptyDB().settings, ...(data.settings || {})}};
    I18n.set(db.settings.lang);
    Store.init(db);
    setPhase(db.onboarded ? 'app' : 'onboard');
  }

  async function unlock(pin){
    try {
      const meta = Disk.readMeta() || {};
      const {key} = await Vault.derive(pin, meta.pinSalt);
      Vault.key = key;
      const raw = JSON.parse(Disk.readRaw());
      const json = await Vault.decrypt(raw.iv, raw.ct);
      boot(JSON.parse(json));
    } catch (e){
      Vault.key = null;
      setPinErr(t('pin.wrong','Невірний PIN'));
      force(x => x + 1);
    }
  }

  if (phase === 'load') return <SkScreen/>;
  if (phase === 'error') return (
    <div className="screen" style={{paddingTop:60}}>
      <ErrorBox title={t('boot.err','Не вдалося прочитати дані')}
                text={t('boot.err.t','Схоже, збережена база пошкоджена. Можна почати з чистого аркуша — або відновити з резервної копії пізніше.')}
                onRetry={() => location.reload()}/>
      <Btn kind="danger" wide style={{marginTop:12}} onClick={() => { Disk.clear(); location.reload(); }}>
        {t('boot.reset','Почати з чистого аркуша')}
      </Btn>
    </div>
  );
  if (phase === 'pin') return <PinLock mode="enter" onPin={unlock} error={pinErr}/>;
  if (phase === 'onboard') return <Onboarding onDone={() => setPhase('auth')}/>;
  if (phase === 'auth') return <Auth onReady={r => { setAccount(r.account); setPhase('setup'); }}/>;
  if (phase === 'setup') return (
    <Setup account={account} onDone={(settings, demo, acc, name) => {
      const phone = acc && acc.kind === 'phone' ? phoneMask(acc.login) : '';
      const email = acc && acc.kind === 'email' ? acc.login : '';
      const base = demo ? seedDB({name, phone, email}) : emptyDB();
      const db = {...base, onboarded: true,
        profile: {...base.profile, name: name || base.profile.name, phone, email},
        settings: {...base.settings, ...settings}};
      I18n.set(db.settings.lang);
      Store.init(db);
      Store.persist();
      setPhase('app');
    }}/>
  );
  return <Shell/>;
};

/* сервіс-воркер: офлайн-режим і швидкий старт */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

ReactDOM.createRoot(document.getElementById('root')).render(
