<!doctype html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" id="metaTheme" />
<meta name="description" content="PRO Trainer — робочий кабінет персонального тренера: клієнти, розклад, гроші, продажі." />
<title>PRO Trainer — кабінет персонального тренера</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Onest:wght@500;600;700;800&display=swap" rel="stylesheet">

<!-- ==================================================================
     PRO TRAINER · DESIGN SYSTEM (v1)
     ------------------------------------------------------------------
     Робочий кабінет персонального тренера. Не фітнес-трекер: клієнти,
     розклад, гроші, продажі — в одному місці. Відчуття продукту рівня
     хорошого банківського застосунку.

     ТЕМИ     Light (білий фон, світло-сірі картки) і Dark (майже чорний
              графіт, темно-сірі картки). Єдина система токенів: різні
              лише значення, назви й ролі однакові.
     АКЦЕНТ   Iris / Purple. Колір лише там, де він допомагає читати
              інформацію: гроші, статус, дія.
     ТИПО     Onest (дисплей, великі числа) + Manrope (UI), tabular-nums.
     РАДІУСИ  12 / 16 / 20 / 26 / 999
     СІТКА    4pt, великі відступи 18–22px, оболонка 480px
     РУХ      тільки transform/opacity, ease-out, 160–420ms
     ================================================================== -->
<style>
  :root{
    /* ── акцент: спільний для обох тем ── */
    --accent:#6B4DFF; --accent-2:#8B6BFF; --accent-3:#5636E8;
    --accent-ink:#ffffff;
    --pos:#12B76A; --warn:#F79009; --neg:#F04438; --info:#3B9DF8;

    /* ── геометрія ── */
    --r-xs:10px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
    --shell:480px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --nav-h:64px;
    --ease:cubic-bezier(.16,1,.3,1);
  }

  /* ── LIGHT ── */
  :root, html[data-theme="light"]{
    --bg:#F5F5F9; --bg-2:#FFFFFF;
    --surface:#FFFFFF; --surface-2:#F1F1F6; --surface-3:#E9E9F1;
    --ink:#12121A; --ink-2:#5A5A6B; --ink-3:#8C8C9C; --ink-4:#B4B4C2;
    --line:#EAEAF1; --line-2:#DEDEE8;
    --accent-soft:rgba(107,77,255,.09); --accent-soft-2:rgba(107,77,255,.16);
    --pos-soft:rgba(18,183,106,.12); --warn-soft:rgba(247,144,9,.12); --neg-soft:rgba(240,68,56,.10);
    --hero-1:#7A5BFF; --hero-2:#5B37F0; --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.78);
    --shadow-1:0 2px 8px -4px rgba(20,20,45,.10);
    --shadow-2:0 12px 30px -18px rgba(20,20,45,.28);
    --shadow-3:0 22px 50px -28px rgba(56,32,160,.45);
    --skeleton:linear-gradient(90deg,#EDEDF4 25%,#F6F6FA 50%,#EDEDF4 75%);
    --scrim:rgba(18,18,30,.34);
  }
  /* ── DARK ── */
  html[data-theme="dark"]{
    --bg:#08080B; --bg-2:#0E0E13;
    --surface:#15151C; --surface-2:#1C1C25; --surface-3:#24242F;
    --ink:#F5F5F8; --ink-2:#9E9EAF; --ink-3:#71717F; --ink-4:#4C4C58;
    --line:#23232C; --line-2:#2E2E39;
    --accent-soft:rgba(123,92,255,.16); --accent-soft-2:rgba(123,92,255,.26);
    --pos-soft:rgba(18,183,106,.16); --warn-soft:rgba(247,144,9,.16); --neg-soft:rgba(240,68,56,.16);
    --hero-1:#3B2B8F; --hero-2:#241A63; --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.72);
    --shadow-1:0 2px 8px -4px rgba(0,0,0,.6);
    --shadow-2:0 14px 34px -20px rgba(0,0,0,.85);
    --shadow-3:0 22px 50px -28px rgba(0,0,0,.9);
    --skeleton:linear-gradient(90deg,#1B1B23 25%,#23232D 50%,#1B1B23 75%);
    --scrim:rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    color:var(--ink);
    font-family:'Manrope',ui-sans-serif,-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    font-size:15px; line-height:1.42;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow-x:hidden;
    transition:background-color .28s var(--ease), color .28s var(--ease);
  }
  #root{max-width:var(--shell);margin-inline:auto;min-height:100vh;position:relative;isolation:isolate;
    background:var(--bg);overflow-x:hidden;}
  .sechead > .h2{min-width:0;}
  .sechead .link{flex:none;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  button{border:0;background:none;cursor:pointer;padding:0;}
  a{color:var(--accent);text-decoration:none;}
  ::-webkit-scrollbar{width:0;height:0;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.02em;}
  .dsp{font-family:'Onest',ui-sans-serif,sans-serif;letter-spacing:-.03em;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ══════════ оболонка ══════════ */
  .app{min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 80px);}
  .screen{padding:0 18px 18px;animation:screenIn .34s var(--ease);}
  @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .appbar{position:sticky;top:0;z-index:30;padding:calc(var(--safe-top) + 12px) 18px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(180deg,var(--bg) 72%,transparent);backdrop-filter:blur(10px);}
  .appbar .title{font-size:16px;font-weight:800;letter-spacing:-.02em;}
  .iconbtn{width:42px;height:42px;border-radius:var(--r-sm);display:grid;place-items:center;
    color:var(--ink);position:relative;transition:transform .16s var(--ease),background .16s;}
  .iconbtn:active{transform:scale(.92);}
  .iconbtn.boxed{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);}
  .iconbtn .bell-dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;
    background:var(--accent);border:2px solid var(--bg);}

  .h1{font-family:'Onest',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.035em;margin:2px 0 2px;}
  .h1-sub{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:-.01em;}
  .h2{font-size:17px;font-weight:800;letter-spacing:-.025em;}
  .muted{color:var(--ink-2);}
  .mute3{color:var(--ink-3);}
  .sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 2px 12px;}
  .sechead .link{color:var(--accent);font-weight:700;font-size:13.5px;}
  .sechead.tight{margin-top:18px;}

  /* ══════════ картки ══════════ */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow-1);position:relative;}
  .card.flat{box-shadow:none;}
  .card.pad{padding:16px;}
  .press{transition:transform .16s var(--ease);}
  .press:active{transform:scale(.985);}

  /* hero — дохід */
  .hero{border-radius:var(--r-xl);padding:18px 18px 16px;color:var(--hero-ink);position:relative;overflow:hidden;
    background:linear-gradient(140deg,var(--hero-1),var(--hero-2));box-shadow:var(--shadow-3);
    border:1px solid rgba(255,255,255,.08);}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.16),transparent 55%);}
  .hero .lbl{font-size:13.5px;font-weight:600;color:var(--hero-sub);}
  .hero .val{font-family:'Onest',sans-serif;font-size:38px;font-weight:800;letter-spacing:-.04em;margin:6px 0 2px;line-height:1.05;}
  .hero .sub{font-size:13px;color:var(--hero-sub);font-weight:600;}
  .hero .delta{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.16);font-size:12.5px;font-weight:800;}
  .hero .delta.pos{color:#8AF0BE;} .hero .delta.neg{color:#FFB4AE;}
  .hero .spark{position:absolute;right:16px;bottom:14px;display:flex;align-items:flex-end;gap:5px;height:56px;}
  .hero .spark i{width:8px;border-radius:4px;background:rgba(255,255,255,.34);display:block;
    animation:sparkIn .5s var(--ease) both;}
  .hero .spark i.on{background:rgba(255,255,255,.92);}
  @keyframes sparkIn{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}

  /* три метрики */
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 11px 11px;
    box-shadow:var(--shadow-1);min-width:0;overflow:hidden;}
  .kpi .k{font-size:12px;color:var(--ink-2);font-weight:600;}
  .kpi .v{font-family:'Onest',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.04em;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .ic{margin-top:9px;color:var(--accent);opacity:.9;}

  /* ══════════ рядки списку ══════════ */
  .rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-1);}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;
    border-top:1px solid var(--line);transition:background .16s;}
  .rows .row:first-child{border-top:0;}
  .row:active{background:var(--surface-2);}
  .row .nm{font-weight:700;font-size:14.5px;letter-spacing:-.01em;}
  .row .ds{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .tm{font-family:'Onest',sans-serif;font-weight:700;font-size:15px;color:var(--accent);letter-spacing:-.03em;min-width:48px;}
  .chev{color:var(--ink-4);flex:none;}
  .dot-st{width:9px;height:9px;border-radius:50%;flex:none;}

  /* аватар */
  .av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;
    font-family:'Onest',sans-serif;letter-spacing:-.02em;overflow:hidden;background-size:cover;background-position:center;}
  .av.ring{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent-soft-2);}

  /* ══════════ кнопки ══════════ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;
    border-radius:var(--r-md);font-weight:800;font-size:15px;letter-spacing:-.01em;
    transition:transform .16s var(--ease),opacity .16s,background .16s;}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -14px var(--accent);}
  .btn.sec{background:var(--surface-2);color:var(--ink);}
  .btn.ghost{background:transparent;color:var(--accent);}
  .btn.soft{background:var(--accent-soft);color:var(--accent);}
  .btn.danger{background:var(--neg-soft);color:var(--neg);}
  .btn.wide{width:100%;}
  .btn.sm{height:40px;font-size:13.5px;padding:0 14px;border-radius:var(--r-sm);}
  .btn.lg{height:56px;font-size:16px;border-radius:var(--r-lg);}

  .fab{position:fixed;right:calc(50% - min(50vw,var(--shell)/2) + 18px);
    bottom:calc(var(--nav-h) + var(--safe-bottom) + 18px);z-index:35;
    width:56px;height:56px;border-radius:20px;display:grid;place-items:center;
    background:var(--accent);color:#fff;box-shadow:0 16px 32px -14px var(--accent);
    transition:transform .18s var(--ease);}
  .fab:active{transform:scale(.9) rotate(45deg);}

  /* чіпи / таби */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;}
  .chip{flex:none;height:36px;padding:0 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;
    background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:13px;transition:.16s;}
  .chip.on{background:var(--accent);color:#fff;}
  .chip.soft.on{background:var(--accent-soft);color:var(--accent);}

  .segm{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:4px;gap:4px;}
  .segm button{flex:1;height:36px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink-2);transition:.18s var(--ease);}
  .segm button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);}
  html[data-theme="dark"] .segm button.on{background:var(--surface-3);}

  .tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:6px;}
  .tabs button{padding:12px 0 11px;font-weight:700;font-size:14.5px;color:var(--ink-3);position:relative;}
  .tabs button.on{color:var(--ink);}
  .tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:var(--accent);}

  .badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;
    font-size:11.5px;font-weight:800;letter-spacing:.01em;}
  .badge.pos{background:var(--pos-soft);color:var(--pos);}
  .badge.warn{background:var(--warn-soft);color:var(--warn);}
  .badge.neg{background:var(--neg-soft);color:var(--neg);}
  .badge.acc{background:var(--accent-soft);color:var(--accent);}
  .badge.mut{background:var(--surface-2);color:var(--ink-2);}

  /* ══════════ поля ══════════ */
  .field{margin-top:14px;}
  .field > label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 2px 7px;}
  .inp{width:100%;height:52px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);
    padding:0 14px;font-weight:600;font-size:15.5px;color:var(--ink);outline:none;transition:.16s;}
  .inp::placeholder{color:var(--ink-4);font-weight:500;}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft);}
  textarea.inp{height:auto;min-height:104px;padding:13px 14px;line-height:1.45;resize:vertical;}
  .inp.err{border-color:var(--neg);box-shadow:0 0 0 3.5px var(--neg-soft);}
  .field .hint{font-size:12px;color:var(--ink-3);margin:6px 2px 0;}
  .field .hint.bad{color:var(--neg);}
  .inp-wrap{position:relative;}
  .inp-wrap .suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:700;}
  .inp-wrap .lead{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);}
  .inp-wrap.lead-pad .inp{padding-left:42px;}

  .search{position:relative;}
  .search .inp{padding-left:42px;height:48px;background:var(--surface-2);border-color:transparent;}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);}

  .switch{width:50px;height:30px;border-radius:999px;background:var(--surface-3);position:relative;transition:.2s var(--ease);flex:none;}
  .switch.on{background:var(--accent);}
  .switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
    transition:.2s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .switch.on i{left:23px;}

  .setrow{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;border-top:1px solid var(--line);}
  .rows .setrow:first-child{border-top:0;}
  .setrow .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none;}
  .setrow .tx{flex:1;min-width:0;}
  .setrow .tx b{font-weight:700;font-size:14.5px;display:block;}
  .setrow .tx span{font-size:12.5px;color:var(--ink-2);}
  .setrow .rt{color:var(--ink-3);font-weight:700;font-size:13.5px;}

  /* ══════════ шторки / модалки ══════════ */
  .scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);backdrop-filter:blur(2px);
    animation:fade .22s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--shell));z-index:61;
    background:var(--bg-2);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--safe-bottom));
    box-shadow:0 -20px 50px -30px rgba(0,0,0,.5);animation:sheetIn .34s var(--ease) both;
    max-height:92vh;overflow-y:auto;border-top:1px solid var(--line);}
  @keyframes sheetIn{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
  .grip{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:2px auto 12px;}
  .sheet h3{font-family:'Onest',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px;}

  .page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
    max-width:var(--shell);margin-inline:auto;animation:pageIn .3s var(--ease) both;
    padding-bottom:calc(24px + var(--safe-bottom));}
  @keyframes pageIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
  .page .appbar{background:linear-gradient(180deg,var(--bg) 74%,transparent);}

  /* ══════════ нижня навігація ══════════ */
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--shell));z-index:40;
    height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);
    display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
    background:color-mix(in srgb,var(--bg-2) 88%,transparent);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);}
  .nav button{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    color:var(--ink-3);font-size:10.5px;font-weight:700;transition:color .18s;}
  .nav button.on{color:var(--accent);}
  .nav button svg{transition:transform .22s var(--ease);}
  .nav button.on svg{transform:translateY(-1px) scale(1.06);}

  /* ══════════ календар ══════════ */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding:6px 0;}
  .cal-day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-weight:700;font-size:14px;color:var(--ink);transition:.16s;}
  .cal-day.out{color:var(--ink-4);}
  .cal-day.today{color:var(--accent);}
  .cal-day.on{background:var(--accent);color:#fff;}
  .cal-day .pips{display:flex;gap:2px;height:4px;}
  .cal-day .pips i{width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .cal-day.on .pips i{background:#fff;}
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .week-day{border-radius:14px;padding:9px 0;text-align:center;background:var(--surface);border:1px solid var(--line);transition:.16s;}
  .week-day .wd{font-size:10.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;}
  .week-day .dn{font-family:'Onest',sans-serif;font-weight:800;font-size:16px;margin-top:2px;}
  .week-day.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .week-day.on .wd{color:rgba(255,255,255,.8);}
  .week-day .cnt{height:4px;margin-top:5px;display:flex;justify-content:center;gap:2px;}

<script type="text/babel" data-presets="react">
/* ══════════════════════════════════════════════════════════════════
   PRO TRAINER · ЯДРО
   i18n · формати · сховище (шифроване) · фінансовий рушій · дані
   ══════════════════════════════════════════════════════════════════ */
const {useState, useEffect, useRef, useMemo, useCallback, Fragment} = React;

/* ─────────────────── i18n ───────────────────
   MVP — українська. Щоб додати мову: додай словник у I18N і код у LANGS.
   t(key, uk) шукає ключ у активній мові → у 'uk' → у запасному тексті.
   I18n.missing() віддає JSON-скелет усіх ключів, яких бракує в мові —
   з нього і збирається наступний переклад.                            */
const LANGS = [
  {code:'uk', title:'Українська', intl:'uk-UA', flag:'🇺🇦'},
  {code:'ru', title:'Русский',    intl:'ru-RU', flag:'🌐'},
  {code:'en', title:'English',    intl:'en-GB', flag:'🇬🇧'},
  {code:'pl', title:'Polski',     intl:'pl-PL', flag:'🇵🇱'},
];

const I18N = {
  uk:{
    'nav.home':'Головна','nav.cal':'Календар','nav.clients':'Клієнти','nav.sales':'Продажі','nav.profile':'Профіль',
    'home.title':'Сьогодні','home.income':'Дохід сьогодні','home.turnover':'Оборот','home.gym':'Залу','home.net':'Чистими',

    'home.lapsed':'Кому час написати','common.save':'Зберегти','common.cancel':'Скасувати','common.add':'Додати',
    'common.today':'Сьогодні','common.tomorrow':'Завтра','common.yesterday':'Вчора','common.week':'Тиждень',
    'common.month':'Місяць','common.year':'Рік','common.day':'День','common.back':'Назад','common.done':'Готово',
    'common.delete':'Видалити','common.edit':'Редагувати','common.search':'Пошук','common.retry':'Спробувати ще',
    'session.personal':'Персональна тренування','pay.paid':'Оплачено','pay.debt':'Не оплачено','pay.package':'З абонемента',
  },
  /* Заготовки: заповнюються з I18n.missing(). Порожні ключі падають на 'uk'. */
  ru:{ 'nav.home':'Главная','nav.cal':'Календарь','nav.clients':'Клиенты','nav.sales':'Продажи','nav.profile':'Профиль',
       'home.title':'Сегодня','home.income':'Доход сегодня','home.turnover':'Оборот','home.gym':'Залу','home.net':'Чистыми',
       'home.upcoming':'Ближайшие тренировки','home.debts':'Долги клиентов','home.all':'Смотреть все' },
  en:{ 'nav.home':'Home','nav.cal':'Calendar','nav.clients':'Clients','nav.sales':'Sales','nav.profile':'Profile',
       'home.title':'Today','home.income':'Income today','home.turnover':'Gross','home.gym':'Gym','home.net':'Net',
       'home.upcoming':'Upcoming sessions','home.debts':'Client debts','home.all':'See all' },
  pl:{ 'nav.home':'Główna','nav.cal':'Kalendarz','nav.clients':'Klienci','nav.sales':'Sprzedaż','nav.profile':'Profil',
       'home.title':'Dzisiaj','home.income':'Dochód dzisiaj','home.turnover':'Obrót','home.gym':'Klub','home.net':'Na rękę',
       'home.upcoming':'Najbliższe treningi','home.debts':'Długi klientów','home.all':'Zobacz wszystkie' },
};

let LANG = 'uk';
const _seen = new Map();               // key → запасний український текст
function t(key, fallback){
  if (fallback !== undefined) _seen.set(key, fallback);
  const d = I18N[LANG] || {};
  return d[key] || I18N.uk[key] || fallback || key;
}
const I18n = {
  set(code){ LANG = I18N[code] ? code : 'uk'; document.documentElement.lang = LANG; },
  get(){ return LANG; },
  intl(){ return (LANGS.find(l => l.code === LANG) || LANGS[0]).intl; },
  /* ключі, яких бракує в мові — готовий скелет для перекладача */
  missing(code = LANG){
    const d = I18N[code] || {}, out = {};
    [...Object.keys(I18N.uk), ..._seen.keys()].forEach(k => {
      if (!d[k]) out[k] = I18N.uk[k] || _seen.get(k) || '';
    });
    return out;
  },
};
window.__i18n = I18n;

/* ─────────────────── формати ─────────────────── */
const NBSP = ' ';
const CUR  = () => (Store.state && Store.state.settings.currency) || '₴';
const num = n => {
  const v = Math.round(Number(n) || 0);
  return String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
};
const money = (n, cur) => (Number(n) < 0 ? '−' : '') + num(n) + NBSP + (cur === false ? '' : CUR());
/* скорочуємо лише справді довгі суми, щоб в одному рядку не стояли
   «49k ₴» і «7 332 ₴» — це читається як помилка */
const moneyShort = n => {
  const v = Math.abs(Math.round(Number(n) || 0));
  if (v >= 1000000) return (v / 1000000).toFixed(1).replace('.0','') + 'M' + NBSP + CUR();
  if (v >= 100000)  return Math.round(v / 1000) + 'k' + NBSP + CUR();
  return money(n);
};
const pct = n => (n > 0 ? '+' : '') + (Math.abs(n) >= 10 ? Math.round(n) : Math.round(n * 10) / 10) + '%';

const DAY = 86400000;
const d0  = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d); x.setDate(1); x.setMonth(x.getMonth() + n); return x; };
const sameDay = (a, b) => d0(a).getTime() === d0(b).getTime();
const iso = d => { const x = valid(d) || new Date(); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const valid = d => { const x = new Date(d); return isNaN(+x) ? null : x; };
/* биті або порожні дати не мають роняти екран */
const fmt = (d, o) => { const x = valid(d); return x ? new Intl.DateTimeFormat(I18n.intl(), o).format(x) : '—'; };
const fmtTime  = d => fmt(d, {hour:'2-digit', minute:'2-digit', hour12:false});
const fmtLong  = d => valid(d) ? cap(fmt(d, {weekday:'long'})) + ', ' + fmt(d, {day:'numeric', month:'long'}) : '—';
const fmtDM    = d => fmt(d, {day:'numeric', month:'long'});
const fmtDMs   = d => fmt(d, {day:'2-digit', month:'2-digit'});
const fmtMon   = d => cap(fmt(d, {month:'long', year:'numeric'}));
const fmtMonth = d => cap(fmt(d, {month:'long'}));
const fmtMonS  = d => cap(fmt(d, {month:'short'}));
const fmtDow   = d => cap(fmt(d, {weekday:'short'})).replace('.','');
const relDay = d => {
  if (!valid(d)) return '—';
  const n = d0(new Date()), x = d0(d), diff = Math.round((x - n) / DAY);
  if (diff === 0) return t('common.today');
  if (diff === 1) return t('common.tomorrow');
  if (diff === -1) return t('common.yesterday');
  return fmtDM(d);
};
/* «6 тренувань» / «1 тренування» — українські форми числа */
const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
};
const nSessions = n => n + ' ' + plural(n, 'тренування', 'тренування', 'тренувань');
const nClients  = n => n + ' ' + plural(n, 'клієнт', 'клієнти', 'клієнтів');
const nDays     = n => n + ' ' + plural(n, 'день', 'дні', 'днів');

const uid = p => (p || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const cx = (...a) => a.filter(Boolean).join(' ');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
const byId = (arr, id) => arr.find(x => x.id === id);
const initials = name => (name || '?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
/* відтінок аватара тримаємо у фіолетово-синій родині акценту */
const hueOf = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return 228 + h % 62; };
const phoneMask = v => {
  const dg = String(v || '').replace(/\D/g,'').replace(/^380/, '').replace(/^0/, '').slice(0, 9);
  let out = '+380';
  if (dg.length) out += ' ' + dg.slice(0,2);
  if (dg.length > 2) out += ' ' + dg.slice(2,5);
  if (dg.length > 5) out += ' ' + dg.slice(5,7);
  if (dg.length > 7) out += ' ' + dg.slice(7,9);
  return out;
};
/* логін — це або пошта, або номер: жодних кодів і підтверджень */
const isEmail = v => /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(String(v || '').trim());
const isPhone = v => String(v || '').replace(/\D/g,'').length >= 9;
const isLogin = v => isEmail(v) || isPhone(v);
const normLogin = v => {
  const s = String(v || '').trim();
  if (s.indexOf('@') > 0) return s.toLowerCase();
  const d = s.replace(/\D/g,'');
  if (!d) return s.toLowerCase();
  if (d.length === 9) return '380' + d;
  return d.replace(/^0/, '380');
};
const telHref = p => 'tel:' + String(p || '').replace(/[^\d+]/g,'');
const smsHref = (p, txt) => 'sms:' + String(p || '').replace(/[^\d+]/g,'') + '?&body=' + encodeURIComponent(txt || '');

/* ─────────────────── сховище ───────────────────
   Дані клієнтів — персональні, тому лишаються на пристрої. За бажанням
   тренера база шифрується AES-GCM ключем, похідним від PIN (PBKDF2).
   Без PIN у localStorage лежить лише шифротекст.                     */
const KEY = 'protrainer.v1';
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

const Vault = {
  key: null,                                   // CryptoKey живе лише в пам'яті
  async derive(pin, saltB64){
    const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    return {key, salt:b64(salt)};
  },
  async hash(pin, saltB64){
    const h = await crypto.subtle.digest('SHA-256', enc.encode(saltB64 + '|' + pin));
    return b64(h);
  },
  async encrypt(text){
    const ivb = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv:ivb}, Vault.key, enc.encode(text));
    return {iv:b64(ivb), ct:b64(ct)};
  },
  async decrypt(iv, ct){
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(iv)}, Vault.key, unb64(ct));
    return dec.decode(pt);
  },
};

const Disk = {
  readMeta(){ try { return JSON.parse(localStorage.getItem(KEY + '.meta') || 'null'); } catch { return null; } },
  writeMeta(m){ try { localStorage.setItem(KEY + '.meta', JSON.stringify(m)); } catch {} },
  readRaw(){ try { return localStorage.getItem(KEY); } catch { return null; } },
  writeRaw(s){ try { localStorage.setItem(KEY, s); return true; } catch { return false; } },
  clear(){ try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '.meta'); } catch {} },
};

/* ─────────────────── синхронізація ───────────────────
   Локально-перше сховище: кожна зміна лягає в чергу outbox і чекає
   мережі. Поки ендпойнт не заданий — застосунок працює автономно,
   черга просто накопичує зміни (і показує це у профілі).            */
const Sync = {
  outbox: [],
  status: 'local',                              // local | queued | syncing | ok | error
  listeners: new Set(),
  endpoint(){ return (Store.state && Store.state.settings.syncUrl) || ''; },
  push(op, payload){
    Sync.outbox.push({id:uid('op'), op, payload, ts:Date.now()});
    if (Sync.outbox.length > 500) Sync.outbox.splice(0, Sync.outbox.length - 500);
    Sync.status = Sync.endpoint() ? (navigator.onLine ? 'queued' : 'local') : 'local';
    Sync.emit();
    if (Sync.endpoint() && navigator.onLine) Sync.flush();
  },
  emit(){ Sync.listeners.forEach(f => f(Sync.status, Sync.outbox.length)); },
  async flush(){
    const url = Sync.endpoint();
    if (!url || !Sync.outbox.length || Sync.status === 'syncing') return;
    Sync.status = 'syncing'; Sync.emit();
    const batch = Sync.outbox.slice(0, 100);
    try {
      const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({device: Store.state.device, ops: batch})});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      Sync.outbox = Sync.outbox.slice(batch.length);
      Sync.status = Sync.outbox.length ? 'queued' : 'ok';
      Store.patch(db => ({...db, syncedAt: Date.now()}));
    } catch (e) {
      Sync.status = 'error';                    // черга лишається — спробуємо пізніше
    }
    Sync.emit();
  },
};
window.addEventListener('online', () => Sync.flush());

/* ─────────────────── фінансовий рушій ───────────────────
   Оборот   — скільки заплатив клієнт.
   Залу     — комісія клубу: % / фіксована сума / без комісії.
   Чистими  — те, що лишається тренеру.
   Товари комісією залу не обкладаються: там прибуток = ціна − закупка. */
function split(gross, s){
  const g = Math.max(0, Math.round(Number(gross) || 0));
  let gym = 0;
  if (!s || s.gymMode === 'percent') gym = Math.round(g * ((s ? s.gymPercent : 15) / 100));
  else if (s.gymMode === 'fixed') gym = Math.min(g, Math.round(s.gymFixed || 0));
  else gym = 0;
  return {gross:g, gym, net:g - gym};
}
/* тренування, які реально приносять гроші (скасовані — ні) */
const isBillable = s => s.status !== 'canceled';
const inRange = (ts, from, to) => ts >= +from && ts < +to;

function periodRange(kind, base){
  const b = d0(base || new Date());
  if (kind === 'day')   return [b, addDays(b, 1)];
  if (kind === 'week')  { const w = (b.getDay() + 6) % 7; const from = addDays(b, -w); return [from, addDays(from, 7)]; }
  if (kind === 'month') { const from = new Date(b.getFullYear(), b.getMonth(), 1); return [from, addMonths(from, 1)]; }
  if (kind === 'year')  { const from = new Date(b.getFullYear(), 0, 1); return [from, new Date(b.getFullYear() + 1, 0, 1)]; }
  return [b, addDays(b, 1)];
}

function stats(db, from, to){
  const S = db.settings;
  const ses = db.sessions.filter(s => isBillable(s) && inRange(+new Date(s.start), from, to));
  const gross = sum(ses, s => s.price);
  const gym   = sum(ses, s => split(s.price, S).gym);
  const sales = db.sales.filter(x => inRange(x.ts, from, to));
  const salesRevenue = sum(sales, x => x.price * x.qty);
  const salesProfit  = sum(sales, x => {
    const p = byId(db.products, x.productId);
    return (x.price - (p ? p.cost : 0)) * x.qty;
  });
  const uniq = new Set(ses.map(s => s.clientId));
  const newC = db.clients.filter(c => inRange(c.createdAt, from, to)).length;
  const done = ses.filter(s => s.status === 'done').length;
  const debt = sum(ses.filter(isDebt), s => s.price);
  return {
    gross, gym, net: gross - gym, count: ses.length, done,
    avg: ses.length ? Math.round(gross / ses.length) : 0,
    salesRevenue, salesProfit, salesCount: sum(sales, x => x.qty),
    clients: uniq.size, newClients: newC,
    perClient: uniq.size ? Math.round((gross - gym) / uniq.size) : 0,
    sesPerClient: uniq.size ? Math.round(ses.length / uniq.size * 10) / 10 : 0,
    total: gross - gym + salesProfit, debt,
  };
}
/* динаміка: порівнюємо однакові за довжиною відрізки — інакше 3-го числа
   місяць завжди «мінус 90%» проти повного попереднього */
function deltaFor(db, kind, base){
  const [from, to] = periodRange(kind, base || new Date());
  const len = +to - +from;
  const slice = clamp(+addDays(d0(new Date()), 1) - +from, DAY, len);
  const cur = stats(db, from, new Date(+from + slice));
  const pFrom = new Date(+from - len);
  const prev = stats(db, pFrom, new Date(+pFrom + slice));
  return prev.net ? Math.round((cur.net - prev.net) / prev.net * 1000) / 10 : (cur.net ? 100 : 0);
}

/* борг — проведене й неоплачене тренування поза абонементом */
const isDebt = s => s.status === 'done' && !s.paid && !s.subId;
const debtDays = s => Math.max(0, Math.floor((Date.now() - +new Date(s.start)) / DAY));

function clientStats(db, id){
  const ses = db.sessions.filter(s => s.clientId === id && isBillable(s));
  const done = ses.filter(s => s.status === 'done');
  const sales = db.sales.filter(x => x.clientId === id);
  const spent = sum(done, s => s.price) + sum(sales, x => x.price * x.qty);
  const debt = sum(db.sessions.filter(s => s.clientId === id && isDebt(s)), s => s.price);
  const future = db.sessions.filter(s => s.clientId === id && s.status === 'planned' && +new Date(s.start) >= Date.now())
                            .sort((a,b) => +new Date(a.start) - +new Date(b.start));
  const last = done.sort((a,b) => +new Date(b.start) - +new Date(a.start))[0];
  const sub = db.subs.filter(x => x.clientId === id && x.used < x.total)
                     .sort((a,b) => a.ts - b.ts)[0];
  return {
    total: ses.length, done: done.length, spent, debt, sub,
    next: future[0] || null, last: last || null,
    lapsedDays: last ? Math.floor((Date.now() - +new Date(last.start)) / DAY) : null,
  };
}
/* історія клієнта — тренування + продажі + абонементи в одну стрічку */
function clientFeed(db, id){
  const out = [];
  const past = s => s.status !== 'planned' || +new Date(s.start) < Date.now();
  db.sessions.filter(s => s.clientId === id && past(s)).forEach(s => out.push({
    kind:'session', ts:+new Date(s.start), title: SES_TYPES[s.type] ? SES_TYPES[s.type].title : 'Тренування',
    amount: s.status === 'canceled' ? 0 : s.price, ref:s,
    tag: s.status === 'canceled' ? 'canceled' : (s.subId ? 'package' : (s.paid ? 'paid' : 'debt')),
  }));
  db.sales.filter(x => x.clientId === id).forEach(x => {
    const p = byId(db.products, x.productId);
    out.push({kind:'sale', ts:x.ts, title:(p ? p.name : 'Товар') + (x.qty > 1 ? ' ×' + x.qty : ''),
      amount:x.price * x.qty, ref:x, tag:'paid'});
  });
  db.subs.filter(x => x.clientId === id).forEach(x => {
    const p = byId(db.packages, x.packageId);
    out.push({kind:'sub', ts:x.ts, title:'Абонемент · ' + (p ? p.title : x.total + ' трен.'),
      amount:x.price, ref:x, tag:'paid'});
  });
  return out.sort((a,b) => b.ts - a.ts);
}

/* ціна одного тренування: за замовчуванням із налаштувань, але якщо за
   клієнтом закріплена своя — беремо її; тип лише коригує суму */
const clientPrice = (db, clientId) => {

  return (c && c.price) || db.settings.price;
};
const typedPrice = (base, type) =>
  type === 'online' ? Math.round(base * .7)
  : type === 'split' ? Math.round(base * 1.4)
  : Math.round(base);

/* ─────────────────── сховище стану ─────────────────── */
function emptyDB(){
  return {
    v: 1, device: uid('dev'), createdAt: Date.now(), syncedAt: 0,

    },
    clients: [], sessions: [], products: [], sales: [], packages: [], subs: [], notes: [], notifs: [],
    onboarded: false, auth: null, fired: {},
  };

const Store = {
  state: null,
  subs: new Set(),
  ready: false,
  init(db){ Store.state = db; Store.ready = true; Store.emit(); },
  emit(){ Store.subs.forEach(f => f(Store.state)); },
  patch(fn, op){
    Store.state = fn(Store.state);
    Store.persist();
    if (op) Sync.push(op.name, op.data);
    Store.emit();
  },
  async persist(){
    const json = JSON.stringify(Store.state);
    const meta = Disk.readMeta() || {};
    try {
      if (Store.state.settings.secure && Vault.key){
        const {iv, ct} = await Vault.encrypt(json);
        Disk.writeRaw(JSON.stringify({enc: 1, iv, ct}));
      } else {
        Disk.writeRaw(json);
      }
      Disk.writeMeta({...meta, savedAt: Date.now(), enc: !!(Store.state.settings.secure && Vault.key)});
    } catch (e) { console.warn('persist', e); }
  },
};
function useDB(){
  const [, force] = useState(0);
  useEffect(() => {
    const f = () => force(x => x + 1);
    Store.subs.add(f);
    return () => Store.subs.delete(f);
  }, []);
  return Store.state;
}

/* ─────────────────── дії (єдина точка змін) ─────────────────── */
const Act = {
  settings(patch){ Store.patch(db => ({...db, settings:{...db.settings, ...patch}}), {name:'settings', data:patch}); },
  profile(patch){ Store.patch(db => ({...db, profile:{...db.profile, ...patch}}), {name:'profile', data:patch}); },

  addClient(c){
    const client = {id: uid('cl'), name:'', phone:'', goal:'', photo:'', note:'', price: null,
                    createdAt: Date.now(), archived:false, ...c};
    Store.patch(db => ({...db, clients:[client, ...db.clients]}), {name:'client.add', data:client});
    return client;
  },
  updClient(id, patch){ Store.patch(db => ({...db, clients: db.clients.map(c => c.id === id ? {...c, ...patch} : c)}), {name:'client.upd', data:{id, patch}}); },
  delClient(id){
    Store.patch(db => ({...db,
      clients: db.clients.filter(c => c.id !== id),
      sessions: db.sessions.filter(s => s.clientId !== id),
      sales: db.sales.filter(s => s.clientId !== id),
      subs: db.subs.filter(s => s.clientId !== id),
      notes: db.notes.filter(n => n.clientId !== id),
    }), {name:'client.del', data:{id}});
  },

  addSession(s){
    const ses = {id: uid('ses'), clientId:'', start: new Date().toISOString(), dur:60, type:'personal',
                 price: Store.state.settings.price, paid:false, status:'planned', subId:null, note:'', createdAt: Date.now(), ...s};
    Store.patch(db => {
      let subs = db.subs;
      if (ses.subId) subs = subs.map(x => x.id === ses.subId ? {...x, used: Math.min(x.total, x.used + (ses.status === 'done' ? 1 : 0))} : x);
      return {...db, sessions:[...db.sessions, ses], subs};
    }, {name:'session.add', data:ses});
    return ses;
  },
  updSession(id, patch){ Store.patch(db => ({...db, sessions: db.sessions.map(s => s.id === id ? {...s, ...patch} : s)}), {name:'session.upd', data:{id, patch}}); },
  delSession(id){
    Store.patch(db => {
      const s = byId(db.sessions, id);
      const subs = s && s.subId && s.status === 'done'
        ? db.subs.map(x => x.id === s.subId ? {...x, used: Math.max(0, x.used - 1)} : x) : db.subs;
      return {...db, sessions: db.sessions.filter(x => x.id !== id), subs};
    }, {name:'session.del', data:{id}});
  },
  /* провести тренування: списати заняття з абонемента або лишити борг */
  complete(id, paid){
    Store.patch(db => {
      const s = byId(db.sessions, id);
      if (!s || s.status === 'done') return db;
      let subs = db.subs;
      if (s.subId) subs = subs.map(x => x.id === s.subId ? {...x, used: Math.min(x.total, x.used + 1)} : x);
      return {...db,
        sessions: db.sessions.map(x => x.id === id ? {...x, status:'done', paid: !!paid || !!s.subId, paidAt: paid ? Date.now() : x.paidAt} : x),
        subs};
    }, {name:'session.done', data:{id, paid}});
  },
  pay(id){ Store.patch(db => ({...db, sessions: db.sessions.map(s => s.id === id ? {...s, paid:true, paidAt: Date.now()} : s)}), {name:'session.pay', data:{id}}); },
  cancel(id){
    Store.patch(db => {
      const s = byId(db.sessions, id);
      const subs = s && s.subId && s.status === 'done'
        ? db.subs.map(x => x.id === s.subId ? {...x, used: Math.max(0, x.used - 1)} : x) : db.subs;
      return {...db, sessions: db.sessions.map(x => x.id === id ? {...x, status:'canceled', paid:false} : x), subs};
    }, {name:'session.cancel', data:{id}});
  },

  addProduct(p){
    const pr = {id: uid('pr'), name:'', price:0, cost:0, stock:0, sold:0, icon:'💊', createdAt: Date.now(), ...p};
    Store.patch(db => ({...db, products:[pr, ...db.products]}), {name:'product.add', data:pr});
    return pr;
  },
  updProduct(id, patch){ Store.patch(db => ({...db, products: db.products.map(p => p.id === id ? {...p, ...patch} : p)}), {name:'product.upd', data:{id, patch}}); },
  delProduct(id){ Store.patch(db => ({...db, products: db.products.filter(p => p.id !== id)}), {name:'product.del', data:{id}}); },
  sell(sale){
    const s = {id: uid('sl'), ts: Date.now(), qty:1, ...sale};
    Store.patch(db => ({...db,
      sales: [...db.sales, s],
      products: db.products.map(p => p.id === s.productId
        ? {...p, stock: Math.max(0, p.stock - s.qty), sold: (p.sold || 0) + s.qty} : p),
    }), {name:'sale.add', data:s});
    return s;
  },

  addPackage(p){
    const pk = {id: uid('pk'), title:'', sessions:8, price:0, days:60, active:true, createdAt: Date.now(), ...p};
    Store.patch(db => ({...db, packages:[pk, ...db.packages]}), {name:'package.add', data:pk});
    return pk;
  },
  updPackage(id, patch){ Store.patch(db => ({...db, packages: db.packages.map(p => p.id === id ? {...p, ...patch} : p)}), {name:'package.upd', data:{id, patch}}); },
  delPackage(id){ Store.patch(db => ({...db, packages: db.packages.filter(p => p.id !== id)}), {name:'package.del', data:{id}}); },
  buyPackage(clientId, pkg){
    const sub = {id: uid('sub'), clientId, packageId: pkg.id, total: pkg.sessions, used: 0,
                 price: pkg.price, ts: Date.now(), expiresAt: Date.now() + (pkg.days || 60) * DAY};
    Store.patch(db => ({...db, subs:[...db.subs, sub]}), {name:'sub.add', data:sub});
    return sub;
  },

  addNote(clientId, text){
    const n = {id: uid('nt'), clientId, text, ts: Date.now()};
    Store.patch(db => ({...db, notes:[n, ...db.notes]}), {name:'note.add', data:n});
    return n;
  },
  delNote(id){ Store.patch(db => ({...db, notes: db.notes.filter(n => n.id !== id)}), {name:'note.del', data:{id}}); },

  notify(n){
    const item = {id: uid('nf'), ts: Date.now(), read:false, type:'info', ...n};
    Store.patch(db => ({...db, notifs:[item, ...db.notifs].slice(0, 200)}));
    return item;
  },
  readNotifs(){ Store.patch(db => ({...db, notifs: db.notifs.map(n => ({...n, read:true}))})); },
  clearNotifs(){ Store.patch(db => ({...db, notifs: []})); },
  markFired(key){ Store.patch(db => ({...db, fired:{...db.fired, [key]: Date.now()}})); },
};

function seedDB(profile){
  const db = emptyDB();
  db.profile = {...db.profile, ...profile};
  db.onboarded = true;
  const rnd = (() => { let s = 42; return () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648; })();
  const pick = a => a[Math.floor(rnd() * a.length)];

  const names = [
    ['Іван Петров','Схуднення'], ['Максим Коваль','Набір маси'], ['Олег Бондар','Сила'],
    ['Анна Мельник','Рельєф'], ['Софія Ткаченко','Здоров’я спини'], ['Дмитро Шевчук','Витривалість'],
    ['Ольга Кравець','Схуднення'], ['Артем Лисенко','Набір маси'],
  ];
  /* у двох клієнтів своя закріплена ціна — так видно, що сума не однакова для всіх */
  const ownPrice = {cl_6: 900, cl_7: 700};
  db.clients = names.map(([name, goal], i) => ({
    id: 'cl_' + i, name, goal, phone: phoneMask('0' + (63 + i % 6) + String(1000000 + Math.floor(rnd() * 8999999)).slice(0,7)),
    photo:'', note:'', price: ownPrice['cl_' + i] || null,
    createdAt: Date.now() - (120 - i * 11) * DAY, archived:false,
  }));

  db.products = [
    {id:'pr_1', name:'Протеїн', price:1400, cost:1050, stock:4, sold:9,  icon:'🥤', createdAt:Date.now()},
    {id:'pr_2', name:'Креатин', price:800,  cost:500,  stock:7, sold:10, icon:'💊', createdAt:Date.now()},
    {id:'pr_3', name:'Шейкер',  price:250,  cost:120,  stock:12, sold:14, icon:'🍶', createdAt:Date.now()},
    {id:'pr_4', name:'Рукавички', price:600, cost:380, stock:3, sold:6,  icon:'🧤', createdAt:Date.now()},
    {id:'pr_5', name:'Вітаміни', price:900, cost:620,  stock:1, sold:4,  icon:'🟠', createdAt:Date.now()},
    {id:'pr_6', name:'Резинки',  price:450, cost:210,  stock:8, sold:7,  icon:'🎯', createdAt:Date.now()},
  ];
  db.packages = [
    {id:'pk_1', title:'8 тренувань',  sessions:8,  price:5600,  days:60, active:true, createdAt:Date.now()},
    {id:'pk_2', title:'12 тренувань', sessions:12, price:7800,  days:75, active:true, createdAt:Date.now()},
    {id:'pk_3', title:'16 тренувань', sessions:16, price:10000, days:90, active:true, createdAt:Date.now()},
  ];
  db.subs = [
    {id:'sub_1', clientId:'cl_0', packageId:'pk_1', total:8,  used:6, price:5600, ts: Date.now() - 22 * DAY, expiresAt: Date.now() + 38 * DAY},
    {id:'sub_2', clientId:'cl_3', packageId:'pk_2', total:12, used:9, price:7800, ts: Date.now() - 30 * DAY, expiresAt: Date.now() + 45 * DAY},
  ];

  /* історія за 70 днів назад + розклад на 10 днів уперед */
  const price = db.settings.price;
  const mk = (clientId, date, h, m, o) => ({
    id: uid('ses'), clientId, start: new Date(new Date(date).setHours(h, m, 0, 0)).toISOString(),
    dur:60, type:'personal', price, paid:true, status:'done', subId:null, note:'', createdAt: Date.now(), ...o,
  });
  const list = [];
  for (let d = 70; d >= 1; d--){
    const day = addDays(new Date(), -d);
    const wd = day.getDay();
    const count = wd === 0 ? 0 : (wd === 6 ? 2 : 3 + Math.floor(rnd() * 3));
    const slots = [8, 10, 11.5, 13, 15.5, 17, 18.5, 20];
    const used = [];
    for (let i = 0; i < count; i++){
      let s; do { s = pick(slots); } while (used.includes(s)); used.push(s);
      const c = pick(db.clients);
      const type = rnd() > .86 ? pick(['pair','online','split']) : 'personal';
      const sub = db.subs.find(x => x.clientId === c.id && rnd() > .6);
      const own = c.price || price;
      list.push(mk(c.id, day, Math.floor(s), (s % 1) * 60, {
        type, price: type === 'split' ? Math.round(own * 1.4) : (type === 'online' ? Math.round(own * .7) : own),
        dur: SES_TYPES[type].dur,
        subId: sub ? sub.id : null,
        paid: sub ? true : (d > 12 ? true : rnd() > .3),
        status: rnd() > .96 ? 'canceled' : 'done',
      }));
    }
  }
  /* сьогодні — як у референсі: 6 тренувань */
  const today = new Date();
  [[10,0,'cl_0','done',true],[11,30,'cl_1','done',false],[13,0,'cl_2','done',true],
   [15,30,'cl_3','planned',false],[17,0,'cl_5','planned',false],[19,0,'cl_4','planned',false]]
   .forEach(([h, m, c, st, paid]) => list.push(mk(c, today, h, m, {status:st, paid, subId: c === 'cl_0' ? 'sub_1' : null})));

  for (let d = 1; d <= 10; d++){
    const day = addDays(new Date(), d);
    if (day.getDay() === 0) continue;
    const slots = [9, 11, 13, 16, 18, 19.5];
    const count = 2 + Math.floor(rnd() * 3);
    const used = [];
    for (let i = 0; i < count; i++){
      let s; do { s = pick(slots); } while (used.includes(s)); used.push(s);
      const c = pick(db.clients);
      list.push(mk(c.id, day, Math.floor(s), (s % 1) * 60, {status:'planned', paid:false, price: c.price || price,
        subId: db.subs.find(x => x.clientId === c.id) ? db.subs.find(x => x.clientId === c.id).id : null}));
    }
  }
  db.sessions = list.sort((a, b) => +new Date(a.start) - +new Date(b.start));

  /* борг у Максима — як у референсі */
  const mx = db.sessions.filter(s => s.clientId === 'cl_1' && s.status === 'done');
  mx.slice(-1).forEach(s => { s.paid = false; s.subId = null; });

  db.sales = [
    {id:'sl_1', clientId:'cl_0', productId:'pr_1', qty:1, price:1400, ts: Date.now() - 4 * DAY},
    {id:'sl_2', clientId:'cl_2', productId:'pr_2', qty:1, price:800,  ts: Date.now() - 9 * DAY},
    {id:'sl_3', clientId:'cl_3', productId:'pr_3', qty:2, price:250,  ts: Date.now() - 12 * DAY},
    {id:'sl_4', clientId:'cl_5', productId:'pr_4', qty:1, price:600,  ts: Date.now() - 2 * DAY},
  ];
  db.notes = [
    {id:'nt_1', clientId:'cl_0', text:'Збільшити робочу вагу в присіді на наступному тренуванні.', ts: Date.now() - 2 * DAY},
    {id:'nt_2', clientId:'cl_0', text:'Скаржиться на праве коліно — прибрати випади.', ts: Date.now() - 9 * DAY},
    {id:'nt_3', clientId:'cl_3', text:'Мета — рельєф до відпустки в вересні.', ts: Date.now() - 5 * DAY},
  ];
  return db;
}

const Avatar = ({name, photo, size = 42, hue, className, ring}) => {
  const h = hue !== undefined ? hue : hueOf(name || '?');
  const st = photo
    ? {width:size, height:size, backgroundImage:`url(${photo})`}
    : {width:size, height:size, fontSize: Math.round(size * .38),
       background:`linear-gradient(140deg,hsl(${h} 58% 63%),hsl(${h + 18} 54% 45%))`};
  return <div className={cx('av', ring && 'ring', className)} style={st} aria-hidden="true">{photo ? '' : initials(name)}</div>;
};

const Sheet = ({open, onClose, title, sub, children, tall}) => {
  useEffect(() => {
    if (!open) return;
    const esc = e => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', esc);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', esc); document.body.style.overflow = ''; };
  }, [open, onClose]);
  if (!open) return null;
  return (
    <Fragment>
      <div className="scrim" onClick={onClose}/>
      <div className="sheet" style={tall ? {minHeight:'70vh'} : null} role="dialog" aria-modal="true" aria-label={title || ''}>
        <div className="grip"/>
        {title && <h3>{title}</h3>}
        {sub && <div className="muted" style={{fontSize:13.5, marginBottom:10}}>{sub}</div>}
        {children}
      </div>
    </Fragment>
  );
};

/* тости */
const Toaster = {
  list: [], subs: new Set(),
  show(text, kind){
    const item = {id: uid('ts'), text, kind};
    Toaster.list = [...Toaster.list, item];
    Toaster.subs.forEach(f => f());
    setTimeout(() => { Toaster.list = Toaster.list.filter(x => x.id !== item.id); Toaster.subs.forEach(f => f()); }, 2600);
  },
  ok: tx => Toaster.show(tx, 'ok'),
  bad: tx => Toaster.show(tx, 'bad'),
};
const ToastHost = () => {
  const [, f] = useState(0);
  useEffect(() => { const fn = () => f(x => x + 1); Toaster.subs.add(fn); return () => Toaster.subs.delete(fn); }, []);
  return (
    <div className="toast-wrap">
      {Toaster.list.map(x => (
        <div key={x.id} className={cx('toast', x.kind)}>
          {x.kind === 'ok' ? <Ic.check size={18}/> : x.kind === 'bad' ? <Ic.warn size={18}/> : <Ic.info size={18}/>}
          <span>{x.text}</span>
        </div>
      ))}
    </div>
  );
};

/* межа помилки: збій одного екрана не кладе застосунок */
class Boundary extends React.Component {
  constructor(p){ super(p); this.state = {err: null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err){ console.error('[screen]', err); }
  render(){
    if (this.state.err) return (
      <div className="screen">
        <ErrorBox text={String(this.state.err.message || this.state.err)}
                  onRetry={() => this.setState({err: null})}/>
      </div>
    );
    return this.props.children;
  }
}

/* площа-лінія з градієнтом */
const Area = ({data, height = 150, fmtV = moneyShort}) => {
  const W = 320, H = height, pad = 6;
  const max = Math.max(1, ...data.map(d => d.v));
  const n = Math.max(1, data.length - 1);
  const px = i => pad + i * ((W - pad * 2) / n);
  const py = v => H - 22 - (v / max) * (H - 40);
  const pts = data.map((d, i) => [px(i), py(d.v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${px(n)} ${H - 22} L${px(0)} ${H - 22} Z`;
  const last = data[data.length - 1];
  return (
    <svg className="chart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{height}}>
      <defs>
        <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--accent)" stopOpacity=".34"/>
          <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
        </linearGradient>
      </defs>
      {[0, .5, 1].map(k => (
        <line key={k} x1="0" x2={W} y1={py(max * k)} y2={py(max * k)} stroke="var(--line)" strokeWidth="1"/>
      ))}
      <path d={area} fill="url(#ag)"/>
      <path d={line} fill="none" stroke="var(--accent)" strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"/>
      {last && <circle cx={px(n)} cy={py(last.v)} r="4" fill="var(--accent)" stroke="var(--surface)" strokeWidth="2.5"/>}
      {data.map((d, i) => (i % Math.ceil(data.length / 6) === 0 || i === data.length - 1) && (
        <text key={i} x={px(i)} y={H - 5} fontSize="9.5" fontWeight="700" fill="var(--ink-3)"
              textAnchor={i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle'}>{d.label}</text>
      ))}
    </svg>
  );
};

/* кільце структури доходу */
const Donut = ({parts, size = 132, center}) => {
  const total = Math.max(1, sum(parts, p => p.v));
  const R = size / 2 - 11, C = 2 * Math.PI * R;
  let off = 0;
  return (
    <div style={{position:'relative', width:size, height:size, flex:'none'}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={R} fill="none" stroke="var(--surface-2)" strokeWidth="13"/>
        {parts.map((p, i) => {
          const len = (p.v / total) * C;
          const el = <circle key={i} cx={size/2} cy={size/2} r={R} fill="none" stroke={p.c} strokeWidth="13"
                             strokeDasharray={`${len} ${C - len}`} strokeDashoffset={-off} strokeLinecap="butt"/>;
          off += len;
          return el;
        })}
      </svg>
      <div style={{position:'absolute', inset:0, display:'grid', placeItems:'center', textAlign:'center'}}>{center}</div>
    </div>
  );
};

/* мінісерія в hero */

  return (

           style={{height: Math.max(8, Math.round(v / max * 52)) + 'px', animationDelay: (i * 40) + 'ms'}}/>
      ))}

  );
};

const StatusDot = ({s}) => {

const DatePick = ({value, onChange}) => {
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(new Date(), i));
  const sel = d0(value);
  const isCustom = !days.some(d => sameDay(d, sel));
  return (
    <div className="chips" style={{marginTop:2}}>
      {days.map((d, i) => (
        <button key={i} className={cx('chip', sameDay(d, sel) && 'on')}
                onClick={() => { const x = new Date(value); const nd = new Date(d); nd.setHours(x.getHours(), x.getMinutes(), 0, 0); onChange(nd); }}>
          {i === 0 ? t('common.today') : i === 1 ? t('common.tomorrow') : fmtDow(d) + ' ' + d.getDate()}
        </button>
      ))}
      <label className={cx('chip', isCustom && 'on')} style={{position:'relative', cursor:'pointer'}}>
        <Ic.cal size={16}/>{isCustom ? fmtDMs(sel) : t('common.date','Дата')}

          if (!e.target.value) return;
          const [y, m, dd] = e.target.value.split('-').map(Number);
          const x = new Date(value); x.setFullYear(y, m - 1, dd); onChange(x);
        }} style={{position:'absolute', inset:0, opacity:0, width:'100%', height:'100%'}}/>
      </label>
    </div>
  );

/* сітка часу — один тап замість колеса */
const TimePick = ({value, onChange, taken = []}) => {
  const db = useDB();
  const S = db.settings;
  const slots = [];
  for (let h = S.dayStart; h <= S.dayEnd; h++){ slots.push(h + ':00'); if (h < S.dayEnd) slots.push(h + ':30'); }
  const cur = fmtTime(value);
  const norm = s => { const [h, m] = s.split(':').map(Number); return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'); };
  return (
    <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:7, marginTop:2}}>
      {slots.map(s => {
        const busy = taken.includes(norm(s));
        return (
          <button key={s} className={cx('chip', cur === norm(s) && 'on')}
                  style={{width:'100%', justifyContent:'center', opacity: busy && cur !== norm(s) ? .45 : 1}}
                  onClick={() => { const [h, m] = s.split(':').map(Number); const x = new Date(value); x.setHours(h, m, 0, 0); onChange(x); }}>
            {norm(s)}{busy && cur !== norm(s) ? ' •' : ''}
          </button>
        );
      })}
    </div>
  );
};

/* ─────────────────── 2. ВХІД / РЕЄСТРАЦІЯ ─────────────────── */
const Auth = ({onReady}) => {
  const [mode, setMode] = useState('reg');       // reg | login
  const [f, setF] = useState({login:'', pass:''});
  const [show, setShow] = useState(false);
  const [err, setErr] = useState({});
  const [busy, setBusy] = useState(false);
  const meta0 = Disk.readMeta();
  const hasAcc = !!(meta0 && meta0.account);

  useEffect(() => { if (hasAcc) setMode('login'); }, [hasAcc]);
  const set = (k, v) => { setF(x => ({...x, [k]: v})); setErr(x => ({...x, [k]: null})); };

  async function submit(){
    const e = {};
    const login = f.login.trim();
    if (!isLogin(login)) e.login = t('auth.err.login','Введіть пошту або номер телефону');
    if (f.pass.length < 4) e.pass = t('auth.err.pass','Пароль — від 4 символів');
    setErr(e);
    if (Object.keys(e).length) return;
    setBusy(true);
    try {
      const meta = Disk.readMeta() || {};
      const salt = meta.salt || b64(crypto.getRandomValues(new Uint8Array(16)));
      const hash = await Vault.hash(f.pass, salt);
      const norm = normLogin(login);
      if (mode === 'login'){
        const a = meta.account;
        const match = a && (a.login === norm || a.email === norm);   /* старі кабінети зберігали пошту */
        if (!match || a.hash !== hash){
          setErr({pass: t('auth.err.bad','Логін або пароль не підходять')});
          setBusy(false);
          return;
        }
        onReady({account: a, fresh:false});
      } else {
        const account = {login: norm, raw: login, kind: isEmail(login) ? 'email' : 'phone',
                         hash, createdAt: Date.now()};
        Disk.writeMeta({...meta, salt, account});
        onReady({account, fresh:true});
      }
    } catch (ex){
      setErr({pass: t('auth.err.crypto','Не вдалося перевірити пароль на цьому пристрої')});
      setBusy(false);
    }
  }

  return (
    <div className="ob fade-in">
      <div className="brand" style={{marginBottom:24}}><div className="mark"><Ic.dumb size={21}/></div><b>PRO Trainer</b></div>
      <div style={{flex:1}}>
        <div className="dsp" style={{fontSize:27, fontWeight:800, letterSpacing:'-.035em'}}>
          {mode === 'reg' ? t('auth.reg','Створити кабінет') : t('auth.login','З поверненням')}
        </div>
        <p className="muted" style={{fontSize:14, marginTop:8}}>
          {mode === 'reg'
            ? t('auth.reg.sub','Логін і пароль ви придумуєте самі — жодних кодів і підтверджень. Дані клієнтів лишаються на цьому пристрої.')
            : t('auth.login.sub','Введіть логін і пароль, які придумали під час реєстрації.')}
        </p>

        <Field label={t('auth.loginlbl','Логін — пошта або телефон')} hint={err.login} bad>
          <Input value={f.login} onChange={e => set('login', e.target.value)}
                 placeholder="trainer@mail.com або 067 123 45 67"
                 autoCapitalize="off" autoCorrect="off" spellCheck="false" bad={!!err.login}/>
        </Field>
        <Field label={t('auth.pass','Пароль')} hint={err.pass || (mode === 'reg' ? t('auth.pass.hint','Мінімум 4 символи. Він потрібен лише щоб відкрити кабінет на цьому пристрої.') : null)} bad={!!err.pass}>
          <Input value={f.pass} onChange={e => set('pass', e.target.value)}
                 type={show ? 'text' : 'password'} placeholder="••••" bad={!!err.pass}
                 suffix={
                   <button onClick={() => setShow(!show)} style={{color:'var(--accent)', fontWeight:700, fontSize:12.5}}>
                     {show ? t('auth.hide','Сховати') : t('auth.show','Показати')}
                   </button>}/>
        </Field>
      </div>

      <div style={{marginTop:20}}>
        <Btn kind="pri" size="lg" wide onClick={submit} disabled={busy}>
          {busy ? t('auth.wait','Хвилинку…') : mode === 'reg' ? t('auth.create','Створити кабінет') : t('auth.enter','Увійти')}
        </Btn>
        <button className="btn ghost wide" style={{marginTop:6}} onClick={() => { setErr({}); setMode(mode === 'reg' ? 'login' : 'reg'); }}>
          {mode === 'reg' ? t('auth.have','Вже є кабінет — увійти') : t('auth.no','Немає кабінету — створити')}
        </button>
        {!hasAcc && (
          <button className="btn ghost wide" style={{color:'var(--ink-3)'}} onClick={() => onReady({account:null, fresh:true})}>
            {t('auth.guest','Спробувати без реєстрації')}
          </button>
        )}
      </div>
    </div>
  );
};

/* PIN-замок: потрібен, коли увімкнено шифрування бази */
const PinLock = ({mode, onPin, onCancel, error}) => {
  const [pin, setPin] = useState('');
  const [shake, setShake] = useState(false);
  useEffect(() => { if (error){ setShake(true); setPin(''); const x = setTimeout(() => setShake(false), 420); return () => clearTimeout(x); } }, [error]);
  const push = d => {
    const v = (pin + d).slice(0, 4);
    setPin(v);
    if (v.length === 4) setTimeout(() => { onPin(v); setPin(''); }, 120);
  };
  return (
    <div className="ob fade-in" style={{justifyContent:'center'}}>
      <div style={{textAlign:'center', marginTop:'auto'}}>
        <div style={{width:64, height:64, borderRadius:20, background:'var(--accent-soft)',
             color:'var(--accent)', display:'grid', placeItems:'center', margin:'0 auto 14px'}}><Ic.lock size={26}/></div>
        <div className="dsp" style={{fontSize:22, fontWeight:800}}>
          {mode === 'set' ? t('pin.set','Придумайте PIN') : mode === 'confirm' ? t('pin.again','Повторіть PIN') : t('pin.enter','Введіть PIN')}
        </div>
        <p className="muted" style={{fontSize:13.5, marginTop:6}}>
          {error || t('pin.sub','4 цифри, щоб відкрити базу клієнтів')}
        </p>
        <div className={cx('pin-dots', shake && 'shake')}>
          {[0,1,2,3].map(i => <i key={i} className={cx(i < pin.length && 'on')}/>)}
        </div>
      </div>
      <div className="keypad" style={{marginTop:'auto'}}>
        {[1,2,3,4,5,6,7,8,9].map(d => <button key={d} onClick={() => push(String(d))}>{d}</button>)}
        <button className="flat" onClick={onCancel}>{onCancel ? t('common.cancel') : ''}</button>
        <button onClick={() => push('0')}>0</button>
        <button className="flat" onClick={() => setPin(pin.slice(0, -1))}>⌫</button>
      </div>
    </div>
  );
};

const Home = ({loading}) => {
  const db = useDB();
  const nav = useNav();
  const [menu, setMenu] = useState(false);
  const [sesOpen, setSesOpen] = useState(null);
  const now = new Date();

  const S = db.settings;
  const [dFrom, dTo] = periodRange('day', now);
  const today = stats(db, dFrom, dTo);
  const delta = deltaFor(db, 'day');
  const [mFrom, mTo] = periodRange('month', now);
  const month = stats(db, mFrom, mTo);

  const spark = useMemo(() => Array.from({length:7}, (_, i) => {
    const [f, tt] = periodRange('day', addDays(now, i - 6));
    return stats(db, f, tt).net;
  }), [db]);

  const upcoming = db.sessions
    .filter(s => s.status === 'planned' && +new Date(s.start) >= now - 30 * 60000)
    .sort((a, b) => +new Date(a.start) - +new Date(b.start));
  const todayList = db.sessions
    .filter(s => sameDay(s.start, now) && s.status !== 'canceled')
    .sort((a, b) => +new Date(a.start) - +new Date(b.start));
  const list = (upcoming.length ? upcoming : todayList).slice(0, 4);

  const debts = db.sessions.filter(isDebt).sort((a, b) => +new Date(a.start) - +new Date(b.start));
  const debtByClient = useMemo(() => {
    const m = new Map();
    debts.forEach(s => {
      const cur = m.get(s.clientId) || {clientId: s.clientId, sum:0, oldest: s.start, n:0};
      cur.sum += s.price; cur.n++;
      if (+new Date(s.start) < +new Date(cur.oldest)) cur.oldest = s.start;
      m.set(s.clientId, cur);
    });
    return [...m.values()].sort((a, b) => b.sum - a.sum);
  }, [db.sessions]);

  const lapsed = useMemo(() => db.clients.filter(c => !c.archived).map(c => {
    const cs = clientStats(db, c.id);
    return {c, ...cs};
  }).filter(x => x.lapsedDays !== null && x.lapsedDays >= S.lapseDays && !x.next)
    .sort((a, b) => b.lapsedDays - a.lapsedDays), [db]);

  const unread = db.notifs.filter(n => !n.read).length;

  if (loading) return <SkScreen/>;

  return (
    <Fragment>
      <div className="appbar">
        <button className="iconbtn" onClick={() => setMenu(true)} aria-label="Меню"><Ic.menu/></button>
        <div style={{flex:1}}/>
        <button className="iconbtn" onClick={() => nav.go('notifs')} aria-label="Сповіщення">
          <Ic.bell/>{unread > 0 && <i className="bell-dot"/>}
        </button>
      </div>

      <div className="screen">
        <div className="between" style={{alignItems:'flex-start'}}>
          <div>
            <div className="h1">{t('home.title','Сьогодні')}</div>
            <div className="h1-sub">{fmtLong(now)}</div>
          </div>
          <button className="iconbtn boxed" onClick={() => nav.tab('cal')} aria-label={t('nav.cal')}>
            <Ic.cal size={20} style={{color:'var(--accent)'}}/>
          </button>
        </div>

        {/* дохід */}
        <button className="hero press" style={{marginTop:16, width:'100%', textAlign:'left', display:'block'}}
                onClick={() => nav.go('finance')}>
          <div className="between">
            <span className="lbl">{t('home.income','Дохід сьогодні')}</span>
            <span className={cx('delta', delta >= 0 ? 'pos' : 'neg')}>
              {pct(delta)}{delta >= 0 ? <Ic.up size={13}/> : <Ic.down size={13}/>}
            </span>
          </div>
          <div className="val num">{money(today.net)}</div>
          <div className="sub">{nSessions(today.count)}</div>
          <Spark data={spark}/>
        </button>

        {/* три метрики — за поточний місяць */}
        <div className="sechead tight">
          <div className="h2" style={{fontSize:14, color:'var(--ink-2)'}}>
            {t('home.month','Цього місяця')} · {fmtMonth(now).toLowerCase()}
          </div>
          <button className="link" onClick={() => nav.go('finance')}>{t('home.details','Деталі')}</button>
        </div>
        <div className="kpis" style={{marginTop:0}}>
          {[
            {k: t('home.turnover','Оборот'), v: month.gross, ic: <Ic.refresh size={19}/>},
            {k: t('home.gym','Залу'),        v: month.gym,   ic: <Ic.bank size={19}/>},
            {k: t('home.net','Чистими'),     v: month.net,   ic: <Ic.wallet size={19}/>},
          ].map((x, i) => (
            <button key={i} className="kpi press" style={{textAlign:'left'}} onClick={() => nav.go('finance')}>
              <div className="k">{x.k}</div>
              <div className="v num">{moneyShort(x.v)}</div>
              <div className="ic">{x.ic}</div>
            </button>
          ))}
        </div>

        {/* найближчі тренування */}
        <div className="sechead">
          <div className="h2">{t('home.upcoming','Найближчі тренування')}</div>
          <button className="link" onClick={() => nav.tab('cal')}>{t('home.all','Дивитись усі')}</button>
        </div>

          <div className="card">
            <Empty icon={<Ic.cal size={28}/>} title={t('home.free','Сьогодні вільно')}
                   text={t('home.free.t','Тренувань не заплановано. Гарний момент, щоб запросити клієнта.')}
                   action={<Btn kind="soft" size="sm" onClick={() => nav.go('session.new')}>

          </div>
        ) : (
          <div className="rows">{list.map(s => <SessionRow key={s.id} s={s} onOpen={setSesOpen}/>)}</div>

        {/* борги — блок з'являється лише коли вони є */}

          <Fragment>
