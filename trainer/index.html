/* ─────────────────── 2. ВХІД / РЕЄСТРАЦІЯ ─────────────────── */
/* Що дістається новому кабінету від попереднього.

   Підписка належить кабінету, а не пристрою: інакше досить було б
   вигадати новий логін, щоб отримати чужий оплачений доступ — або, як
   сталось у нас, успадкувати давню тестову покупку й довго не розуміти,
   звідки вона.

   Пробний період — навпаки, прив'язаний до пристрою. Якби він теж
   скидався, його починали б заново нескінченно, просто міняючи логін. */
const carryAccess = (prev, login, access) =>
  (prev && prev.login !== login) ? {trialStartedAt: (access || {}).trialStartedAt} : access;

const Auth = ({onReady, save}) => {
  const [mode, setMode] = useState('reg');       // reg | login
  const [f, setF] = useState({login:'', pass:''});
  /* Пароль обов'язковий: у кабінеті лежить база клієнтів із телефонами
     та грошима, і залишати її відкритою кожному, хто взяв телефон у
     руки, не можна. */
  const protect = mode === 'reg';
  const [askPass, setAskPass] = useState(false); // на вході, якщо кабінет захищений
  /* копія з таким логіном є, але пароль до неї інший — тоді доречно
     запропонувати відновлення прямо на реєстрації */
  const [exists, setExists] = useState(false);
  /* відновлення пароля: null → крок коду → крок нового пароля */
  const [lost, setLost] = useState(null);        // null | 'code' | 'new'
  /* що сервер повернув після підтвердження пошти: ключ від копії, сіль
     і квиток на заміну замка. Без ключа копію повертати нічим. */
  const [keep, setKeep] = useState(null);
  const [code, setCode] = useState('');
  const [note, setNote] = useState('');
  const [show, setShow] = useState(false);
  const [err, setErr] = useState({});
  const [busy, setBusy] = useState(false);
  const meta0 = Disk.readMeta();
  const hasAcc = !!(meta0 && meta0.account);

  useEffect(() => { if (hasAcc && !save) setMode('login'); }, [hasAcc, save]);
  const set = (k, v) => { setF(x => ({...x, [k]: v})); setErr(x => ({...x, [k]: null})); };

  /* ─── забутий пароль ───
     Сервер пароля не знає й не зберігає: він лише підтверджує, що
     скринька ваша. Новий пароль задається тут, на пристрої. Разом із
     підтвердженням приходить ключ від копії — якщо тренер не вимикав
     відновлення, база повертається тим самим кроком. */
  async function sendCode(){
    const login = f.login.trim();
    if (!isEmail(login)) return setErr({login: t('auth.err.mailonly','Введіть пошту, на яку заводили кабінет')});
    setErr({}); setNote(''); setBusy(true);
    const r = await Web.sendCode(login);
    setBusy(false);
    if (r.ok && r.sent){ setLost('code'); setNote(t('auth.sent','Лист із кодом пішов. Перевірте пошту, зокрема теку «Спам»')); return; }
    setErr({login: r.error === 'too_soon'
      ? t('auth.err.soon','Код уже надіслано. Наступний можна замовити за хвилину')
      : t('auth.err.mail','Не вдалося надіслати лист. Спробуйте пізніше або напишіть у підтримку')});
  }
  async function checkCode(){
    if (code.trim().length !== 6) return setErr({code: t('auth.err.code6','Код — шість цифр')});
    setErr({}); setBusy(true);
    const r = await Web.checkCode(f.login.trim(), code.trim());
    setBusy(false);
    if (r.verified){
      setKeep({key: r.key || '', salt: r.salt || '', ticket: r.ticket || ''});
      setLost('new');
      setNote(r.key
        ? t('auth.new.back','Пошту підтверджено. Придумайте новий пароль — клієнти, тренування та історія повернуться')
        : t('auth.new.gone','Пошту підтверджено. Копію відкрити нічим: у цьому кабінеті відновлення було вимкнене, і ключ від копії лишався тільки у вас. Кабінет почнеться з чистого аркуша'));
      return;
    }
    setErr({code: r.error === 'expired' ? t('auth.err.old','Код застарів — замовте новий')
          : r.error === 'too_many' ? t('auth.err.many','Забагато спроб — замовте новий код')
          : t('auth.err.codebad','Код не підходить')});
  }
  async function setNewPass(){
    if (f.pass.length < 4) return setErr({pass: t('auth.err.pass','Пароль — від 4 символів')});
    setBusy(true);
    const login = normLogin(f.login.trim());
    const meta = Disk.readMeta() || {};
    const had = meta.account && meta.account.login === login ? meta.account : null;
    /* Сіль беремо ту, з якою жила копія: інакше новий замок не став би
       на місце старого й сервер не зміг би звести їх докупи. */
    const salt = (keep && keep.salt) || meta.salt || b64(crypto.getRandomValues(new Uint8Array(16)));
    /* Ключ від копії не змінюється — змінюється лише замок на ньому. Тому
       мегабайти даних перекладати не доводиться, і копія лишається тією
       самою, з усією історією. */
    const c = await Vault.cloud(f.pass, salt, keep && keep.key ? {raw: keep.key} : null);
    const hash = await Vault.hash(f.pass, salt);
    const account = had ? {...had, hash}
      : {login, raw: f.login.trim(), kind: isEmail(f.login) ? 'email' : 'phone', hash, createdAt: Date.now()};

    let restored = null;
    if (keep && keep.ticket){
      const rk = await Cloud.rekey(login, keep.ticket, c);
      if (!rk.ok){
        setBusy(false);
        return setErr({pass: t('auth.err.rekey','Не вдалося застосувати новий пароль. Спробуйте ще раз або замовте новий код')});
      }
      const got = await Cloud.restore(login, c.token, c.key);
      if (got.ok) restored = got.json;
    }

    Disk.writeMeta({...meta, salt, account, access: carryAccess(meta.account, login, meta.access)});
    Cloud.remember(c);
    if (!restored) Cloud.push().catch(() => {});
    setBusy(false);
    Toaster.ok(t('auth.done','Пароль змінено'));
    /* нічого не повернулось і кабінету тут не було — це чистий старт,
       і людині потрібен майстер налаштувань, а не порожній застосунок */
    onReady({account, fresh: !restored && !had, restored});
  }

  async function submit(){
    const e = {};
    const login = f.login.trim();
    /* Заводимо тільки на пошту. Номер як логін виглядав зручним, а
       насправді вів у три глухі кути одразу: пароль такому кабінету не
       відновити, лист про кінець пробного не надіслати, а забутий пароль
       означав втрату копії назавжди. Обіцяти вхід, який ми не вміємо
       повернути, не можна.

       На вхід номер приймаємо: кабінети, заведені на нього раніше,
       нікуди не поділись, і замикати людину зовні через нашу зміну
       правил — гірше за саму помилку. */
    if (mode === 'reg' || save){
      if (!isEmail(login)) e.login = isPhone(login)
        ? t('auth.err.phone','Кабінет заводиться на пошту: на неї приходить код, якщо забудете пароль. Номер телефону вкажете у профілі')
        : t('auth.err.login','Введіть пошту');
    } else if (!isLogin(login)) e.login = t('auth.err.login','Введіть пошту');
    if ((protect || askPass) && f.pass.length < 4) e.pass = t('auth.err.pass','Пароль — від 4 символів');
    setErr(e);
    /* підказка від минулої спроби до нової не має відношення: логін уже
       інший, а порада лишалась би стояти під ним як свіжа */
    setNote('');
    if (Object.keys(e).length) return;
    setBusy(true);
    try {
      const meta = Disk.readMeta() || {};
      const salt = meta.salt || b64(crypto.getRandomValues(new Uint8Array(16)));
      const norm = normLogin(login);
      const hash = (protect || askPass) ? await Vault.hash(f.pass, salt) : null;

      if (mode === 'login'){
        const a = meta.account;
        const match = a && (a.login === norm || a.email === norm);
        /* ─── кабінета на цьому пристрої немає ───
           Це ще не привід казати «немає». Новий телефон — звичайна
           справа, і людина, яка натиснула «Увійти», має потрапити до
           себе, а не в глухий кут із порадою натиснути іншу кнопку.
           Тому питаємо сервер: якщо копія є — просимо пароль і
           розгортаємо базу тут. */
        if (!match){
          const found = Web.enabled() ? await Cloud.peek(norm) : {ok:false, error:'web_disabled'};
          /* ─── три різні речі, які досі виглядали однаково ───
             Сервер не відповів, копії немає, копія є — і на всі три
             застосунок казав «такого кабінету немає». Перше — брехня:
             людина йде міняти пошту, хоча міняти нічого не треба.
             Друге — правда, але тупик: що робити далі, не сказано. */
          if (!found.ok){
            setErr({login: t('auth.err.net','Не вдалося зв’язатися з сервером. Перевірте інтернет і спробуйте ще раз')});
            setBusy(false); return;
          }
          if (!found.has){
            setErr({login: t('auth.err.nouser','Такого кабінету на цьому пристрої немає')});
            setNote(t('auth.err.nouser.t','Копії цього кабінета на сервері немає — швидше за все, він живе на тому телефоні, де його заводили. Відкрийте застосунок там і увімкніть «Копію на сервері» в налаштуваннях: після цього вхід тут спрацює. Або перенесіть дані файлом — «Резервна копія» → «Створити копію зараз».'));
            setBusy(false); return;
          }
          if (!askPass){
            setAskPass(true); setBusy(false);
            setNote(t('auth.found','Кабінет знайдено. Введіть пароль — клієнти, тренування та історія повернуться на цей пристрій'));
            return;
          }
          const got = await Cloud.open(norm, f.pass, found.salt);
          if (!got.ok){
            /* «Пароль не підходить» кажемо тільки коли сервер справді
               відмовив у записі. Обрив зв'язку — інша річ: назвати його
               невірним паролем означає відправити людину міняти те, що
               й так правильне. */
            const wrong = got.error === 'wrong_token' || got.error === 'bad_key';
            if (wrong) setExists(true);
            setErr({pass: wrong
              ? t('auth.err.bad','Пароль не підходить')
              : t('auth.err.net','Не вдалося зв’язатися з сервером. Перевірте інтернет і спробуйте ще раз')});
            setBusy(false); return;
          }
          const acc = {login: norm, raw: login, kind: isEmail(login) ? 'email' : 'phone',
                       hash: await Vault.hash(f.pass, found.salt), createdAt: Date.now()};
          Disk.writeMeta({...meta, salt: found.salt, account: acc,
                          access: carryAccess(meta.account, norm, meta.access)});
          Cloud.remember(got.cred);
          onReady({account: acc, fresh:false, restored: got.json});
          return;
        }
        if (a.hash && !askPass){ setAskPass(true); setBusy(false); return; }   /* кабінет під паролем */
        if (a.hash && a.hash !== hash){ setErr({pass: t('auth.err.bad','Пароль не підходить')}); setBusy(false); return; }
        /* Ключ копії беремо з сервера, а не вигадуємо новий: інакше кожен
           вхід перешифровував би всю копію заново. Немає зв'язку або
           копії — заводимо ключ тут, перший же запис його й покладе. */
        if (f.pass){
          const got = Web.enabled() ? await Cloud.open(norm, f.pass, salt) : {ok:false};
          Cloud.remember(got.ok ? got.cred : await Vault.cloud(f.pass, salt));
        }
        onReady({account: a, fresh:false});
      } else {
        /* Новий кабінет із тим самим логіном — можливо, це та сама людина
           на новому телефоні. Питаємо сервер: якщо копія є і пароль її
           відкриває, повертаємо роботу замість порожнього кабінета. */
        let useSalt = salt, restored = null;
        const found = Web.enabled() ? await Cloud.peek(norm) : {ok:false};
        if (found.ok && found.has && found.salt){
          const got = await Cloud.open(norm, f.pass, found.salt);
          if (got.ok){ useSalt = found.salt; restored = got.json; Cloud.remember(got.cred); }
          /* Копія є, але пароль до неї інший. Мовчки завести порожній
             кабінет тут не можна: людина побачила б порожньо й вирішила,
             що база пропала, — а вона ціла й лежить за іншим паролем. */
          else if (got.error === 'wrong_token' || got.error === 'bad_key'){
            setExists(true);
            setErr({pass: t('auth.err.exists','Кабінет із такою поштою вже є, і пароль до нього інший. Введіть свій пароль — або відновіть його')});
            setBusy(false); return;
          }
          /* Копія є, але дістати її не вдалося — зв'язок. Заводити тут
             порожній кабінет не можна: він забере логін собі, отримає
             власний ключ, і копія лишиться на сервері нікому не
             потрібною. Краще чесно попросити спробувати ще раз. */
          else {
            setErr({login: t('auth.err.net','Не вдалося зв’язатися з сервером. Перевірте інтернет і спробуйте ще раз')});
            setBusy(false); return;
          }
        }
        if (!restored) Cloud.remember(await Vault.cloud(f.pass, useSalt));

        const account = {login: norm, raw: login, kind: isEmail(login) ? 'email' : 'phone',
                         hash: await Vault.hash(f.pass, useSalt), createdAt: Date.now()};
        const access = carryAccess(meta.account, norm, meta.access);
        Disk.writeMeta({...Disk.readMeta(), salt: useSalt, account, access});
        onReady({account, fresh: !restored, restored});
      }
    } catch (ex){
      setErr({pass: t('auth.err.crypto','Не вдалося перевірити пароль на цьому пристрої')});
      setBusy(false);
    }
  }

  const title = save ? t('auth.save','Зберегти дані')
              : mode === 'reg' ? t('auth.reg','Створити кабінет') : t('auth.login','З поверненням');
  const sub = save ? t('auth.save.sub','Кабінет прив’яжеться до вашої пошти — дані з демо залишаться на місці.')
            : mode === 'reg' ? t('auth.reg.sub','Пошта й пароль. На пошту прийде код, якщо пароль колись забудеться, — тому кабінет заводиться саме на неї.')
            : t('auth.login.sub','Введіть логін, з яким створювали кабінет.');

  return (
    <div className="ob fade-in">
      <div className="brand" style={{marginBottom:24}}><div className="mark"><Ic.dumb size={21}/></div><b>PRO Trainer</b></div>
      <div style={{flex:1}}>
        <div className="dsp" style={{fontSize:27, fontWeight:800, letterSpacing:'-.035em'}}>{title}</div>
        <p className="muted" style={{fontSize:14, marginTop:8}}>{sub}</p>

        <Field label={t('auth.loginlbl','Пошта')} hint={err.login} bad>
          <Input value={f.login} onChange={e => set('login', e.target.value)}
                 placeholder="trainer@mail.com"
                 autoCapitalize="off" autoCorrect="off" spellCheck="false" bad={!!err.login}/>
        </Field>

        {(protect || askPass || lost === 'new') && lost !== 'code' && (
          <Field label={t('auth.pass','Пароль')} hint={err.pass || (protect ? t('auth.pass.hint','Мінімум 4 символи. Знадобиться лише щоб відкрити кабінет на цьому пристрої.') : null)} bad={!!err.pass}>
            <Input value={f.pass} onChange={e => set('pass', e.target.value)} autoFocus
                   type={show ? 'text' : 'password'} placeholder="••••" bad={!!err.pass}
                   suffix={
                     <button onClick={() => setShow(!show)} style={{color:'var(--accent)', fontWeight:700, fontSize:12.5}}>
                       {show ? t('auth.hide','Сховати') : t('auth.show','Показати')}
                     </button>}/>
          </Field>
        )}

        {lost === 'code' && (
          <Field label={t('auth.code','Код із листа')} hint={err.code} bad={!!err.code}>
            <Input value={code} onChange={e => { setCode(e.target.value.replace(/\D/g, '').slice(0, 6)); setErr({}); }}
                   inputMode="numeric" placeholder="123456" bad={!!err.code} autoFocus/>
          </Field>
        )}
        {note && <p className="muted" style={{fontSize:13, marginTop:10, lineHeight:1.5}}>{note}</p>}

        {/* Відновлення пропонуємо там, де воно потрібне: на кроці пароля
            або коли з'ясувалось, що копія є, а пароль до неї не той */}
        {(askPass || exists) && !lost && (
          <button className="btn ghost sm" style={{marginTop:10, paddingLeft:0}} onClick={sendCode} disabled={busy}>
            <Ic.lock size={16}/>{t('auth.lost','Забули пароль?')}
          </button>
        )}
      </div>

      <div style={{marginTop:20}}>
        <Btn kind="pri" size="lg" wide disabled={busy}
             onClick={lost === 'code' ? checkCode : lost === 'new' ? setNewPass : submit}>
          {busy ? t('auth.wait','Хвилинку…')
            : lost === 'code' ? t('auth.code.go','Підтвердити код')
            : lost === 'new' ? t('auth.new.go','Зберегти пароль')
            : mode === 'reg' ? t('auth.go','Продовжити') : t('auth.enter','Увійти')}
        </Btn>
        {lost && (
          <button className="btn ghost wide" style={{marginTop:6}}
                  onClick={() => { setLost(null); setKeep(null); setCode(''); setNote(''); setErr({}); }}>

        )}
        {!save && !lost && (
          <button className="btn ghost wide" style={{marginTop:6}}
                  onClick={() => { setErr({}); setAskPass(false); setMode(mode === 'reg' ? 'login' : 'reg'); }}>

          </button>
        )}
        {!hasAcc && !save && !lost && (

/* PIN-замок: потрібен, коли увімкнено шифрування бази */
const PinLock = ({mode, onPin, onCancel, error}) => {
  const [pin, setPin] = useState('');
  const [shake, setShake] = useState(false);
  useEffect(() => { if (error){ setShake(true); setPin(''); const x = setTimeout(() => setShake(false), 420); return () => clearTimeout(x); } }, [error]);
  const push = d => {
    const v = (pin + d).slice(0, 4);
    setPin(v);
    if (v.length === 4) setTimeout(() => { onPin(v); setPin(''); }, 120);
  };
  return (
    <div className="ob fade-in" style={{justifyContent:'center'}}>
      <div style={{textAlign:'center', marginTop:'auto'}}>
        <div style={{width:64, height:64, borderRadius:20, background:'var(--accent-soft)',
             color:'var(--accent)', display:'grid', placeItems:'center', margin:'0 auto 14px'}}><Ic.lock size={26}/></div>
        <div className="dsp" style={{fontSize:22, fontWeight:800}}>
          {mode === 'set' ? t('pin.set','Придумайте PIN') : mode === 'confirm' ? t('pin.again','Повторіть PIN') : t('pin.enter','Введіть PIN')}
        </div>
        <p className="muted" style={{fontSize:13.5, marginTop:6}}>
          {error || t('pin.sub','4 цифри, щоб відкрити базу клієнтів')}
        </p>
        <div className={cx('pin-dots', shake && 'shake')}>
          {[0,1,2,3].map(i => <i key={i} className={cx(i < pin.length && 'on')}/>)}
        </div>
      </div>
      <div className="keypad" style={{marginTop:'auto'}}>
        {[1,2,3,4,5,6,7,8,9].map(d => <button key={d} onClick={() => push(String(d))}>{d}</button>)}
        <button className="flat" onClick={onCancel}>{onCancel ? t('common.cancel') : ''}</button>
        <button onClick={() => push('0')}>0</button>
        <button className="flat" onClick={() => setPin(pin.slice(0, -1))}>⌫</button>
      </div>
    </div>
  );
};

/* Групове тренування — це кілька записів на один час. У списках воно має
   виглядати однією подією: тренер провів одне заняття, а не три. Гроші
   при цьому лишаються окремими в кожного, тому склеюємо тільки показ. */
const byGroup = list => {
  const out = [], seen = new Map();
  list.forEach(s => {
    if (!s.groupId) return void out.push([s]);
    const got = seen.get(s.groupId);
    if (got) got.push(s);
    else { const arr = [s]; seen.set(s.groupId, arr); out.push(arr); }
  });
  return out;
};

/* День одним кадром: скільки з запланованого вже стоїть у розкладі і як
   він розкладений за годинами. Список найближчих тренувань цього не
   показував — з нього не видно ні завантаження, ні вільних вікон. */
const DayLoad = ({list, onOpen}) => {
  const db = useDB();
  const nav = useNav();
  const S = db.settings;
  const goal = Math.max(1, S.dayGoal || 8);
  /* завантаження — про заняття, а не про людей: група з трьох це одне
     заняття в розкладі, хай навіть три записи в грошах */
  const rows = byGroup(list);
  const busy = rows.length;
  const free = Math.max(0, goal - busy);
  const part = Math.min(1, busy / goal);

  const R = 32, LEN = 2 * Math.PI * R;
  const first = list[0] ? new Date(list[0].start).getHours() : null;
  const last = list.length ? new Date(list[list.length - 1].start).getHours() : null;
  /* вільні краї дня показуємо як є: до першого тренування і після останнього */
  const before = first !== null && first > S.dayStart;
  const after = last !== null && last < S.dayEnd - 1;
  const hh = h => String(h).padStart(2, '0') + ':00';

  return (
    <div className="card pad dayload">
      <div className="dl-left">
        <div className="dl-ring">
          <svg className="dl-track" viewBox="0 0 80 80" aria-hidden="true">
            <circle cx="40" cy="40" r={R} className="bg"/>
            <circle cx="40" cy="40" r={R} className="fg" strokeDasharray={LEN}
                    strokeDashoffset={LEN * (1 - part)} transform="rotate(-90 40 40)"/>
          </svg>
          <Ic.dumb size={26}/>
        </div>
        <div className="dl-num num">{busy} / {goal}</div>
        <div className="dl-cap">{t('home.load.of','тренувань')}</div>
        <div className="dl-bar"><i style={{width: Math.round(part * 100) + '%'}}/></div>
        <div className="dl-cap">{Math.round(part * 100)}% {t('home.load','завантаження дня')}</div>
        <div className="dl-legend">
          <span><i className="on"/>{busy} {t('home.load.busy','зайнято')}</span>
          <span><i/>{free} {t('home.load.free','вільно')}</span>
        </div>
      </div>

      <div className="dl-line">
        {before && <div className="dl-free"><b className="num">{hh(S.dayStart)}</b><span>{t('home.load.open','Вільно')}</span></div>}
        {rows.map(row => {
          const s = row[0];
          const names = row.map(x => (byId(db.clients, x.clientId) || {}).name || '—');
          return (
            <button key={s.groupId || s.id} className="dl-item press" onClick={() => onOpen(s)}>
              <b className="num">{fmtTime(s.start)}</b>
              <span className="nm">{row.length > 1 ? names.join(', ') : names[0]}</span>
              <span className="ds">
                {row.length > 1 ? t('cal.group','Групове') + ' · ' + row.length : typeTitle(s.type)}
              </span>
              <Ic.right size={15} className="chev"/>
            </button>
          );
        })}
        {after && <div className="dl-free"><b className="num">{hh(S.dayEnd)}</b><span>{t('home.load.open','Вільно')}</span></div>}
        {free > 0 && (
          <button className="dl-add press" onClick={() => nav.go('session.new')}>
            <Ic.plus size={16}/>{t('home.load.add','Записати ще')}
          </button>
        )}
      </div>
    </div>
  );
};

const Home = ({loading}) => {
  const db = useDB();
  const nav = useNav();
  const [menu, setMenu] = useState(false);
  const [sesOpen, setSesOpen] = useState(null);
  const [fin, setFin] = useState(false);
  const now = new Date();

  const S = db.settings;
  const [dFrom, dTo] = periodRange('day', now);
  const today = stats(db, dFrom, dTo);
  const delta = deltaFor(db, 'day');
  const [mFrom, mTo] = periodRange('month', now);
  const month = stats(db, mFrom, mTo);

  /* Підписка на стан копії потрібна не заради самого стану, а щоб рядок
     нижче зник одразу після того, як копію ввімкнули, — а не колись
     потім, коли екран перемалюється з іншої причини. */
  useCloud();

  /* Чи попереджати про відсутню копію. Умов багато навмисно: кожна з них
     прибирає випадок, у якому рядок був би не порадою, а докучанням. */
  const noCopy = Web.enabled()                        /* без мережі радити нічого */
    && !!(Disk.readMeta() || {}).account                /* демо-режим це не стосується */
    && !Cloud.armed()                                   /* ключа немає — копія й не робиться */
    && S.cloud !== false                                /* вимкнув свідомо — його право */
    && db.clients.length > 0                            /* поки нічого немає, нічого й губити */
    && Date.now() - (S.cloudNag || 0) > CLOUD_NAG;

  const spark = useMemo(() => {
    const start = periodRange('day', addDays(now, -6))[0];
    const box = netByBucket(db, start, addDays(start, 7), false, true);
    return Array.from({length:7}, (_, i) => box.get(iso(addDays(start, i))) || 0);
  }, [db]);

  const upcoming = db.sessions
    .filter(s => s.status === 'planned' && +new Date(s.start) >= now - 30 * 60000)
    .sort((a, b) => +new Date(a.start) - +new Date(b.start));
  const todayList = db.sessions
    .filter(s => sameDay(s.start, now) && s.status !== 'canceled')
    .sort((a, b) => +new Date(a.start) - +new Date(b.start));
  /* сьогоднішній день показуємо цілком, наступні дні — коротким списком */
  const later = upcoming.filter(s => !sameDay(s.start, now)).slice(0, 3);

  const debts = db.sessions.filter(isDebt).sort((a, b) => +new Date(a.start) - +new Date(b.start));
  const debtByClient = useMemo(() => {
    const m = new Map();
    debts.forEach(s => {
      const cur = m.get(s.clientId) || {clientId: s.clientId, sum:0, oldest: s.start, n:0};
      cur.sum += owed(s); cur.n++;
      if (+new Date(s.start) < +new Date(cur.oldest)) cur.oldest = s.start;
      m.set(s.clientId, cur);
    });
    return [...m.values()].sort((a, b) => b.sum - a.sum);
  }, [db.sessions]);

  const lapsed = useMemo(() => db.clients.filter(c => !c.archived).map(c => {
    const cs = clientStats(db, c.id);
    return {c, ...cs};
  }).filter(x => x.lapsedDays !== null && x.lapsedDays >= S.lapseDays && !x.next)
    .sort((a, b) => b.lapsedDays - a.lapsedDays), [db]);

  const ending = db.subs.filter(x => x.used < x.total && x.total - x.used <= 2);
  /* у налаштуваннях написано, що день народження нагадає привітати —
     тож він має бути видно, а не просто лежати в картці */
  const birthdays = useMemo(() => db.clients.filter(c => !c.archived)
    .map(c => ({c, days: bdIn(c.birthday, now)}))
    .filter(x => x.days !== null && x.days <= 7)
    .sort((a, b) => a.days - b.days), [db.clients]);
  const unread = db.notifs.filter(n => !n.read).length;

  if (loading) return <SkScreen/>;

  return (
    <Fragment>
      <div className="appbar">
        <button className="iconbtn" onClick={() => setMenu(true)} aria-label="Меню"><Ic.menu/></button>
        <div style={{flex:1}}/>
        <button className="iconbtn" onClick={() => nav.go('notifs')} aria-label="Сповіщення">
          <Ic.bell/>{unread > 0 && <i className="bell-dot"/>}
        </button>
      </div>

      <div className="screen">
        <div className="between" style={{alignItems:'flex-start'}}>
          <div>
            <div className="h1">{t('home.title','Сьогодні')}</div>
            <div className="h1-sub">{fmtLong(now)}</div>
          </div>
          <button className="iconbtn boxed" onClick={() => nav.tab('cal')} aria-label={t('nav.cal')}>
            <Ic.cal size={20} style={{color:'var(--accent)'}}/>
          </button>
        </div>

        <TrialBar/>

        {/* Приклад видно одразу й прибирається одним дотиком. Без цього
            рядка вигадані клієнти виглядали як чужі справжні дані, а як
            їх позбутись — здогадатись було нізвідки. */}
        {db.demo && (
          <div className="card pad" style={{marginTop:12, display:'flex', gap:12, alignItems:'center'}}>
            <div style={{flex:1, minWidth:0}}>
              <b style={{fontSize:14}}>{t('demo.on','Це приклад')}</b>
              <div className="muted" style={{fontSize:12.5, lineHeight:1.45, marginTop:2}}>
                {t('demo.on.s','Вигадані клієнти й тренування, щоб подивитись, як усе працює. Ваші дані вони не чіпають.')}
              </div>
            </div>
            <Btn kind="sec" size="sm" onClick={() => {
              Act.clearDemo();
              Toaster.ok(t('demo.gone','Приклад прибрано'));
            }}>{t('demo.clear','Прибрати')}</Btn>
          </div>
        )}

        {/* ─── кабінет без копії ───
            Копія робиться тільки там, де є ключ до неї. Кабінети,
            заведені до появи паролів, ключа не мають — і не зберігаються
            нікуди, мовчки. Тренер про це не знає й дізнається в найгірший
            момент: коли телефон загубився разом із базою клієнтів.

            Тому кажемо самі, і на головній, а не в налаштуваннях, куди
            ніхто не заходить. Не одразу: поки клієнтів немає, втрачати
            нічого, і рядок був би просто шумом. «Пізніше» ховає його на
            два тижні — не назавжди, бо ціна помилки не зменшується від
            того, що її відклали. */}
        {noCopy && (
          <div className="card pad" style={{marginTop:12}}>
            <b style={{fontSize:14}}>{t('cloud.nag','Копії ваших даних немає')}</b>
            <div className="muted" style={{fontSize:12.5, lineHeight:1.45, marginTop:2}}>
              {t('cloud.nag.s','Клієнти й тренування є лише на цьому телефоні. Копія на сервері шифрується вашим паролем — ми її не читаємо, але вона поверне базу на новому пристрої.')}
            </div>
            <div style={{display:'flex', gap:8, marginTop:12}}>
              <Btn kind="pri" size="sm" onClick={() => nav.go('settings', {focus:'cloud'})}>
                {t('cloud.nag.go','Увімкнути')}
              </Btn>
              <Btn kind="ghost" size="sm" onClick={() => Act.settings({cloudNag: Date.now()})}>
                {t('cloud.nag.later','Пізніше')}
              </Btn>
            </div>
          </div>
        )}

        {/* дохід */}
        <button className="hero press" style={{marginTop:16, width:'100%', textAlign:'left', display:'block'}}
                onClick={() => nav.go('finance')}>
          <div className="between">
            <span className="lbl">{t('home.income','Дохід сьогодні')}</span>
            <span className={cx('delta', delta >= 0 ? 'pos' : 'neg')}>
              {pct(delta)}{delta >= 0 ? <Ic.up size={13}/> : <Ic.down size={13}/>}
            </span>
          </div>
          {/* Саме зароблене, а не оборот дня. Оборот включає тренування,
              які ще попереду, і вранці показував би повний день як уже
              отриманий — а потім зменшувався б від кожного, хто не
              прийшов. Заплановане поруч, окремим рядком: воно потрібне,
              але це інші гроші. */}
          <div className="val num">{money(today.earned)}</div>
          <div className="sub">
            {nSessions(today.done)}
            {today.planned > 0 && ' · ' + t('home.ahead','ще попереду') + ' ' + money(today.planned)}
          </div>
          <Spark data={spark}/>
        </button>

        {/* три метрики — за поточний місяць */}
        <div className="sechead tight">
          <div className="h2" style={{fontSize:14, color:'var(--ink-2)'}}>
            {t('home.month','Цього місяця')} · {monthWord(now)}
          </div>
          <button className="link" onClick={() => nav.go('finance')}>{t('home.details','Деталі')}</button>
        </div>
        <div className="kpis" style={{marginTop:0}}>
          {[
            {k: t('home.turnover','Оборот'), v: month.gross, ic: <Ic.refresh size={19}/>},
            {k: t('home.gym','Залу'),        v: month.gym,   ic: <Ic.bank size={19}/>},
            {k: t('home.net','Чистими'),     v: month.net,   ic: <Ic.wallet size={19}/>},
          ].map((x, i) => (
            <button key={i} className="kpi press" style={{textAlign:'left'}} onClick={() => setFin(true)}>
              <div className="k">{x.k}</div>
              <div className="v num">{moneyShort(x.v)}</div>
              <div className="ic">{x.ic}</div>
            </button>
          ))}
        </div>

        {/* день одним кадром */}
        <div className="sechead">
          <div className="h2">{t('home.day','День')}</div>
          <button className="link" onClick={() => nav.tab('cal')}>{t('home.all','Дивитись усі')}</button>
        </div>
        {todayList.length === 0 ? (
          <div className="card">
            <Empty icon={<Ic.cal size={28}/>} title={t('home.free','Сьогодні вільно')}
                   text={t('home.free.t','Тренувань не заплановано. Гарний момент, щоб запросити клієнта.')}
                   action={<Btn kind="soft" size="sm" onClick={() => nav.go('session.new')}>
                             <Ic.plus size={17}/>{t('session.new','Нове тренування')}</Btn>}/>
          </div>
        ) : (
          <DayLoad list={todayList} onOpen={setSesOpen}/>
        )}

        {/* найближче — те, що вже за межами сьогодні */}
        {later.length > 0 && (
          <Fragment>
            <div className="sechead">
              <div className="h2">{t('home.upcoming','Найближчі тренування')}</div>
            </div>
            <div className="rows">{later.map(s => <SessionRow key={s.id} s={s} onOpen={setSesOpen} quick/>)}</div>
          </Fragment>
        )}

        {/* борги — блок з'являється лише коли вони є */}
        {debtByClient.length > 0 && (
          <Fragment>
            <div className="sechead">
              <div className="h2">{t('home.debts','Борги клієнтів')}</div>
              {debtByClient.length > 2 && <button className="link" onClick={() => nav.go('debts')}>{t('home.all','Дивитись усі')}</button>}
            </div>
            <div className="stack">
              {debtByClient.slice(0, 2).map(d => <DebtCard key={d.clientId} d={d}/>)}
            </div>
          </Fragment>
        )}

        {/* абонементи, що добігають кінця */}
        {ending.length > 0 && (
          <Fragment>
            <div className="sechead">
              <div className="h2">{t('home.subs','Закінчується абонемент')}</div>
              {ending.length > 2 && <button className="link" onClick={() => nav.go('packages')}>{t('home.all','Дивитись усі')}</button>}
            </div>
            <div className="stack">
              {ending.slice(0, 2).map(x => {
                const c = byId(db.clients, x.clientId);
                if (!c) return null;
                return (
                  <div key={x.id} className="card pad" style={{display:'flex', alignItems:'center', gap:12}}>
                    <button onClick={() => nav.go('client', {id: c.id})}
                            style={{display:'flex', alignItems:'center', gap:12, flex:1, minWidth:0, textAlign:'left'}}>
                      <Avatar name={c.name} photo={c.photo} size={42}/>
                      <div style={{minWidth:0}}>
                        <div className="nm" style={{fontWeight:700, fontSize:14.5}}>{c.name}</div>
                        <div style={{fontSize:12.5, color:'var(--warn)', fontWeight:700, marginTop:2}}>
                          {t('subs.left','Залишилось')} {nSessions(x.total - x.used)}
                        </div>
                      </div>
                    </button>
                    <Btn kind="soft" size="sm" onClick={() => nav.go('packages', {clientId: c.id})}>
                      {t('subs.renew','Продовжити')}
                    </Btn>
                  </div>
                );
              })}
            </div>
          </Fragment>
        )}

        {/* кому час написати */}
        {birthdays.length > 0 && (
          <Fragment>
            <div className="sechead"><div className="h2">{t('home.bd','Дні народження')}</div></div>
            <div className="stack">
              {birthdays.slice(0, 3).map(({c, days}) => (
                <div key={c.id} className="card pad" style={{display:'flex', alignItems:'center', gap:12}}>
                  <button onClick={() => nav.go('client', {id: c.id})}
                          style={{display:'flex', alignItems:'center', gap:12, flex:1, minWidth:0, textAlign:'left'}}>
                    <Avatar name={c.name} photo={c.photo} size={42}/>
                    <div style={{minWidth:0}}>
                      <div className="nm" style={{fontWeight:700, fontSize:14.5}}>{c.name}</div>
                      <div style={{fontSize:12.5, color:'var(--ink-2)', marginTop:2}}>
                        {days === 0 ? t('home.bd.today','сьогодні') : t('home.bd.in','через') + ' ' + nDays(days)}
                        {' · '}{fmtDM(c.birthday + 'T00:00:00')}
                      </div>
                    </div>
                  </button>
                  <Btn kind="soft" size="sm" onClick={() => nav.go('remind', {clientId: c.id, kind:'birthday'})}>
                    {t('home.bd.go','Привітати')}
                  </Btn>
                </div>
              ))}
            </div>
          </Fragment>
        )}

        {lapsed.length > 0 && (
          <Fragment>
            <div className="sechead">
              <div className="h2">{t('home.lapsed','Кому час написати')}</div>
              {lapsed.length > 2 && <button className="link" onClick={() => nav.go('lapsed')}>{t('home.all','Дивитись усі')}</button>}
            </div>
            <div className="stack">
              {lapsed.slice(0, 2).map(x => <LapsedCard key={x.c.id} c={x.c} days={x.lapsedDays} last={x.last}/>)}
            </div>
          </Fragment>
        )}
      </div>

      <Sheet open={fin} onClose={() => setFin(false)} title={t('home.fin','Гроші')}
             sub={t('home.fin.sub','Як склалась сума за сьогодні та за місяць')}>
        <div className="card pad">
          <div className="muted" style={{fontSize:12.5, fontWeight:700, marginBottom:4}}>{t('common.today','Сьогодні')}</div>
          <Rowline k={t('home.turnover','Оборот')} v={money(today.gross)} strong/>
          <Rowline k={t('home.gym','Залу')} v={'−' + money(today.gym)} tone="var(--ink-2)"/>
          <Rowline k={t('home.net','Чистими')} v={money(today.net)} tone="var(--accent)" strong/>
          <Rowline k={t('fin.count','Тренувань')} v={today.count}/>
        </div>
        <div className="card pad" style={{marginTop:9}}>
          <div className="muted" style={{fontSize:12.5, fontWeight:700, marginBottom:4}}>
            {t('home.month','Цього місяця')} · {monthWord(now)}
          </div>
          <Rowline k={t('home.turnover','Оборот')} v={money(month.gross)} strong/>
          <Rowline k={t('home.gym','Залу')} v={'−' + money(month.gym)} tone="var(--ink-2)"/>
          <Rowline k={t('home.net','Чистими')} v={money(month.net)} tone="var(--accent)" strong/>
          {month.salesProfit > 0 && <Rowline k={t('fin.goods','Товари')} v={money(month.salesProfit)} tone="var(--pos)"/>}
          {month.debt > 0 && <Rowline k={t('fin.debt','Не сплачено клієнтами')} v={money(month.debt)} tone="var(--neg)"/>}
        </div>
        <Btn kind="pri" size="lg" wide style={{marginTop:12}} onClick={() => { setFin(false); setTimeout(() => nav.go('finance'), 60); }}>
          <Ic.wallet size={18}/>{t('home.fin.open','Відкрити фінанси')}
        </Btn>
      </Sheet>

      <MainMenu open={menu} onClose={() => setMenu(false)}/>
      {sesOpen && <SessionSheet id={sesOpen.id} onClose={() => setSesOpen(null)}/>}
    </Fragment>
  );
};

/* Нагадування без тиску: з'являється лише в останні дні або якщо оплата
   не пройшла, і не повторюється частіше ніж раз на день. */
const TrialBar = () => {
  const acc = useAccess();
  const nav = useNav();
  const key = 'bar_' + acc.kind + '_' + (acc.left || 0) + '_' + iso(new Date());
  const [hidden, setHidden] = useState(() => { try { return sessionStorage.getItem(key) === '1'; } catch { return false; } });
  const show = (acc.kind === 'TRIAL_ACTIVE' && acc.left <= 3) || acc.kind === 'PAYMENT_FAILED'
            || (acc.kind === 'SUBSCRIPTION_CANCELLED' && acc.until - Date.now() < 5 * DAY);
  if (!show || hidden) return null;
  const text = acc.kind === 'PAYMENT_FAILED' ? t('bar.failed','Оплата не пройшла — дані на місці')
    : acc.kind === 'SUBSCRIPTION_CANCELLED' ? t('bar.cancel','Підписка діє до') + ' ' + fmtDM(acc.until)
    : acc.left === 1 ? t('bar.last','Завтра завершується пробний період')
    : t('bar.left','Залишилось') + ' ' + nDays(acc.left) + ' ' + t('bar.free','безкоштовного доступу');
  return (
    <div className="card pad" style={{marginTop:14, display:'flex', alignItems:'center', gap:10,
         background:'var(--accent-soft)', borderColor:'transparent'}}>
      <Ic.star size={18} style={{color:'var(--accent)', flex:'none'}}/>
      <div style={{flex:1, minWidth:0, fontSize:13, fontWeight:700, color:'var(--accent)'}}>{text}</div>
      <Btn kind="soft" size="sm" onClick={() => nav.go('plans')}>{t('bar.go','Обрати план')}</Btn>
      <button className="mute3" aria-label="×" onClick={() => { try { sessionStorage.setItem(key, '1'); } catch {} setHidden(true); }}>
        <Ic.x size={16}/>
      </button>
    </div>
  );
};

const DebtCard = ({d}) => {
  const db = useDB();
  const nav = useNav();
  const c = byId(db.clients, d.clientId);
  const [pay, setPay] = useState(false);
  const [sum, setSum] = useState(0);
  if (!c) return null;
  const days = Math.floor((Date.now() - +new Date(d.oldest)) / DAY);
  return (
    <div className="card pad" style={{display:'flex', alignItems:'center', gap:12}}>
      <button onClick={() => nav.go('client', {id: c.id})} style={{display:'flex', alignItems:'center', gap:12, flex:1, minWidth:0, textAlign:'left'}}>
        <Avatar name={c.name} photo={c.photo} size={42}/>
        <div style={{minWidth:0}}>
          <div className="nm" style={{fontWeight:700, fontSize:14.5}}>{c.name}</div>
          <div className="money num" style={{fontSize:16, color:'var(--neg)', marginTop:3}}>{money(d.sum)}</div>
          <div style={{fontSize:12.5, color:'var(--neg)', fontWeight:600, opacity:.85}}>
            {days > 0 ? nDays(days) + ' ' + t('debt.overdue','прострочено') : t('debt.today','сьогодні')}
          </div>
        </div>
      </button>
      {/* борг найчастіше закривається тим, що клієнт віддав гроші на місці —
          заради цього не варто заходити в картку й шукати кожне тренування */}
      <div style={{display:'flex', flexDirection:'column', gap:6}}>
        <Btn kind="pri" size="sm" onClick={() => { setSum(d.sum); setPay(true); }}>
          {t('debt.paid','Оплатив')}
        </Btn>
        <Btn kind="soft" size="sm" onClick={() => nav.go('remind', {clientId: c.id, sum: d.sum})}>
          {t('debt.remind','Нагадати')}
        </Btn>
      </div>

      {/* клієнт не завжди віддає все одразу: приніс частину — решта має
          лишитись у боргу, а не зникнути й не висіти повністю */}
      <Sheet open={pay} onClose={() => setPay(false)} title={c.name}
             sub={t('debt.pay.sub','Скільки віддав клієнт')}>
        <Field label={t('debt.pay.sum','Сума')}>
          <Input value={sum} inputMode="numeric" suffix={db.settings.currency}
                 onChange={e => setSum(Math.min(d.sum, +e.target.value.replace(/\D/g,'') || 0))}/>
          <div className="chips" style={{marginTop:8}}>
            {[...new Set([Math.round(d.sum / 2), d.sum])].filter(v => v > 0).map(v => (
              <button key={v} className={cx('chip', sum === v && 'on')} onClick={() => setSum(v)}>
                {v === d.sum ? t('debt.pay.all','Уся сума') : money(v)}
              </button>
            ))}
          </div>
        </Field>
        <div className="card pad">
          <Rowline k={t('debt.pay.was','Борг')} v={money(d.sum)}/>
          <Rowline k={t('debt.pay.left','Лишиться')} v={money(Math.max(0, d.sum - sum))}
                   tone={d.sum - sum > 0 ? 'var(--neg)' : 'var(--pos)'} strong/>
        </div>
        <Btn kind="pri" size="lg" wide style={{marginTop:12}} disabled={sum <= 0} onClick={() => {
          Act.payClient(c.id, sum >= d.sum ? null : sum);
          setPay(false);
          Toaster.ok((sum >= d.sum ? t('debt.paid.ok','Борг закрито') : t('debt.paid.part','Оплату записано'))
                     + ' · ' + money(sum));
        }}>
          {t('debt.pay.do','Записати оплату')} · {money(sum)}
        </Btn>
      </Sheet>
    </div>
  );
};

/* ─────────── картка тренування (шторка з діями) ─────────── */
const SessionSheet = ({id, onClose}) => {
  const db = useDB();
  const nav = useNav();
  const s = byId(db.sessions, id);
  const [confirm, setConfirm] = useState(false);
  const [join, setJoin] = useState(false);
  const [move, setMove] = useState(false);
  const [when, setWhen] = useState(() => new Date());
  if (!s) return null;
  const c = byId(db.clients, s.clientId);
  const sp = split(s.price, db.settings);
  const sub = s.subId ? byId(db.subs, s.subId) : null;
  const past = +new Date(s.start) < Date.now();
  /* решта учасників групового тренування — щоб було видно, з ким воно */
  const mates = s.groupId
    ? db.sessions.filter(x => x.groupId === s.groupId && x.id !== s.id)
        .map(x => (byId(db.clients, x.clientId) || {}).name).filter(Boolean)
    : [];
  /* скільки ще попереду в цій серії, разом із цим */
  const ahead = s.repeatId
    ? db.sessions.filter(x => x.repeatId === s.repeatId && x.status === 'planned'
                              && +new Date(x.start) >= +new Date(s.start)).length
    : 0;

  const close = () => { onClose(); };
  const act = fn => { fn(); onClose(); };

  return (
    <Sheet open onClose={close} title={c ? c.name : t('session.one','Тренування')}
           sub={cap(relDay(s.start)) + ', ' + fmtTime(s.start) + ' · ' + typeTitle(s.type)}>
      <div className="card pad" style={{marginTop:6}}>
        <Rowline k={t('home.turnover','Оборот')} v={money(sp.gross)}/>
        {db.settings.gymMode !== 'none' && <Rowline k={t('home.gym','Залу')} v={'−' + money(sp.gym)} tone="var(--ink-2)"/>}
        <Rowline k={t('home.net','Чистими')} v={money(sp.net)} tone="var(--accent)" strong/>
        <div className="rowline">
          <span style={{color:'var(--ink-2)', fontSize:14, fontWeight:600}}>{t('session.status','Статус')}</span>
          <span className={cx('badge', s.status === 'canceled' ? 'neg' : s.subId ? 'acc' : s.paid ? 'pos' : past ? 'neg' : 'warn')}>
            {payLabel(s)}
          </span>
        </div>
        {sub && (
          <div className="rowline">
            <span style={{color:'var(--ink-2)', fontSize:14, fontWeight:600}}>{t('session.sub','Абонемент')}</span>
            <span style={{fontWeight:700, fontSize:14}}>{sub.used} / {sub.total}</span>
          </div>
        )}
      </div>

      {(mates.length > 0 || join) && (
        <div className="card pad" style={{marginTop:9}}>
          <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('cal.group','Групове')}</div>
          {mates.length > 0 && (
            <div style={{fontSize:13.5, marginTop:3}}>{t('session.mates','Разом із')}: {mates.join(', ')}</div>
          )}
          {join && (
            <div style={{marginTop:9}}>
              <ClientPick value="" onPick={id => {
                const added = Act.joinSession(s.id, id);
                setJoin(false);
                Toaster[added ? 'ok' : 'show'](added ? t('session.joined','Учасника додано')
                                                     : t('session.joined.no','Цей клієнт уже в тренуванні'));
              }}/>
            </div>
          )}
        </div>
      )}

      {s.note && <div className="card pad" style={{marginTop:9, fontSize:13.5, color:'var(--ink-2)'}}>{s.note}</div>}

      <div className="stack" style={{marginTop:12}}>
        {s.status === 'planned' && (
          <Fragment>
            <div className="grid2">
              <Btn kind="pri" onClick={() => act(() => { Act.complete(s.id, true); Toaster.ok(t('session.done.paid','Проведено та оплачено')); })}>
                <Ic.check size={18}/>{t('session.done1','Провів, оплачено')}
              </Btn>
              <Btn kind="sec" onClick={() => act(() => {
                const r = Act.complete(s.id, false);
                Toaster[r.over ? 'bad' : 'show'](r.over
                  ? t('ses.done.over','Абонемент вичерпано — тренування записали як борг')
                  : t('session.done.debt','Проведено, лишився борг'));
              })}>
                {t('session.done2','Провів, без оплати')}
              </Btn>
            </div>
            <Btn kind="sec" wide onClick={() => act(() => { Act.noshow(s.id); Toaster.show(t('session.noshow','Позначено: клієнт не прийшов')); })}>
              {t('session.noshow.btn','Клієнт не прийшов')}
            </Btn>
          </Fragment>
        )}
        {s.status === 'done' && !s.paid && !s.subId && (
          <Btn kind="pri" wide onClick={() => act(() => { Act.pay(s.id); Toaster.ok(t('session.paid','Оплату записано')); })}>
            <Ic.wallet size={18}/>{t('session.pay','Позначити оплату')} · {money(s.price)}
          </Btn>
        )}
        {/* найчастіше прохання клієнта — перенести. Заради цього не варто
            відкривати повне редагування */}
        {s.status !== 'canceled' && (
          <Btn kind="sec" wide onClick={() => { setWhen(new Date(s.start)); setMove(true); }}>
            <Ic.cal size={17}/>{t('session.move','Перенести')}
          </Btn>
        )}

        {/* тренування вже йде, а прийшов ще один — дописати його сюди,
            а не заводити окреме на той самий час */}
        {s.status !== 'canceled' && !join && (
          <Btn kind="sec" wide onClick={() => setJoin(true)}>
            <Ic.users size={17}/>{t('session.join','Додати учасника')}
          </Btn>
        )}
        <div className="grid2">
          <Btn kind="sec" onClick={() => { onClose(); nav.go('session.new', {id: s.id}); }}>
            <Ic.edit size={17}/>{t('common.edit','Редагувати')}
          </Btn>
          <Btn kind="sec" onClick={() => { onClose(); nav.go('client', {id: s.clientId}); }}>
            <Ic.user size={17}/>{t('session.client','Клієнт')}
          </Btn>
        </div>
        {s.status !== 'canceled' && (
          <Btn kind="danger" wide onClick={() => setConfirm(true)}>
            <Ic.x size={17}/>{t('session.cancel','Скасувати тренування')}
          </Btn>
        )}
        {/* клієнт пішов у відпустку або перестав ходити — знімати кожне
            тренування окремо надто довго */}
        {s.repeatId && ahead > 1 && (
          <Btn kind="sec" wide onClick={() => act(() => {
            Act.delSeries(s.repeatId, +new Date(s.start));
            Toaster.show(t('session.series.gone','Прибрано з розкладу') + ': ' + ahead);
          })}>
            {t('session.series.del','Прибрати всі наступні')} · {ahead}
          </Btn>
        )}
        <Sheet open={move} onClose={() => setMove(false)} title={t('session.move','Перенести')}
               sub={mates.length > 0 ? t('session.move.group','Групове переноситься цілком, з усіма учасниками')
                                     : (c ? c.name : '')}>
          <div className="chips" style={{marginBottom:12}}>
            {[[1, t('session.move.d1','+1 день')], [7, t('session.move.w1','+1 тиждень')]].map(([d, tx]) => (
              <button key={d} className="chip" onClick={() => setWhen(addDays(when, d))}>{tx}</button>
            ))}
          </div>
          <Field label={t('common.date','Дата')}>
            <DatePick value={when} onChange={setWhen}/>
          </Field>
          <Field label={t('session.time','Час')}>
            <TimePick value={when} onChange={setWhen}
                      taken={db.sessions.filter(x => x.status !== 'canceled' && sameDay(x.start, when)
                                                     && x.id !== s.id && x.groupId !== s.groupId)
                                        .map(x => fmtTime(x.start))}/>
          </Field>
          <Btn kind="pri" size="lg" wide style={{marginTop:12}} onClick={() => {
            Act.moveSession(s.id, when);
            setMove(false);
            onClose();
            Toaster.ok(t('session.moved','Перенесено') + ' · ' + fmtDM(when) + ', ' + fmtTime(when));
          }}>
            {t('session.move.do','Перенести на')} {fmtDM(when)}, {fmtTime(when)}
          </Btn>
        </Sheet>

        {confirm && (
          <div className="card pad" style={{borderColor:'var(--neg)'}}>
            <b style={{fontSize:14.5}}>{t('session.cancel.q','Скасувати тренування?')}</b>
            <p className="muted" style={{fontSize:13, margin:'6px 0 12px'}}>
              {t('session.cancel.t','Воно лишиться в історії як скасоване і не потрапить у дохід.')}
              {s.groupId && ' ' + t('session.cancel.grp','Це групове заняття — скасуються всі його учасники.')}
            </p>
            <div className="grid2">
              <Btn kind="sec" onClick={() => setConfirm(false)}>{t('common.back','Назад')}</Btn>
              <Btn kind="danger" onClick={() => act(() => { Act.cancel(s.id); Toaster.show(t('session.canceled','Тренування скасовано')); })}>
                {t('session.cancel.yes','Скасувати')}
              </Btn>
            </div>
          </div>
        )}
      </div>
    </Sheet>
  );
};

/* ─────────── форма тренування (створення / редагування) ─────────── */
const SessionForm = ({params, onClose}) => {
  const db = useDB();
  const nav = useNav();
  const edit = params.id ? byId(db.sessions, params.id) : null;
  const S = db.settings;
  const base = edit ? new Date(edit.start) : (() => {
    const d = params.date ? new Date(params.date) : new Date();
    if (!params.date) d.setHours(d.getHours() + 1, 0, 0, 0);
    else if (!params.keepTime) d.setHours(10, 0, 0, 0);
    return d;
  })();

  const [f, setF] = useState({
    /* клієнтів може бути кілька: групове тренування. Редагуємо завжди
       одного — учасник групи лишається самостійним записом. */
    ids: edit ? [edit.clientId] : (params.clientId ? [params.clientId] : []),
    when: base,
    type: edit ? edit.type : 'personal',
    price: edit ? edit.price : clientPrice(db, params.clientId || ''),
    paid: edit ? edit.paid : false,
    subId: edit ? edit.subId : null,
    note: edit ? edit.note : '',
    dur: edit ? edit.dur : 60,
    /* розклад у тренера здебільшого постійний: той самий клієнт, той
       самий день тижня, той самий час. Заводити це руками щотижня —
       найчастіша дурна робота, яку застосунок може зняти. */
    every: 0,          /* через скільки тижнів повторювати; 0 — не повторювати */
    times: 8,          /* скільки разів разом із першим */
  });
  const [err, setErr] = useState('');
  const set = (k, v) => setF(x => ({...x, [k]: v}));

  const one = f.ids.length === 1 ? f.ids[0] : '';     /* коли клієнт один — усі підказки про нього */
  const many = f.ids.length > 1;
  const pick = id => {
    setErr('');
    setF(x => (edit || !x.ids.length) ? {...x, ids:[id]}
              : x.ids.includes(id) ? x : {...x, ids:[...x.ids, id]});
  };
  const drop = id => setF(x => ({...x, ids: x.ids.filter(i => i !== id)}));

  /* абонемент клієнта підставляється сам */
  const sub = useMemo(() => db.subs.find(x => x.clientId === one && x.used < x.total), [db.subs, one]);
  const who = one ? byId(db.clients, one) : null;
  const base$ = clientPrice(db, one);                 /* ціна клієнта або за замовчуванням */

  useEffect(() => {
    if (edit) return;
    /* абонемент завжди чийсь один — у групі його не списати */
    if (many){ setF(x => x.subId ? {...x, subId:null, paid:false} : x); return; }
    if (!one) return;
    if (sub) setF(x => ({...x, subId: sub.id, paid: true, price: Math.round(sub.price / sub.total)}));
    else setF(x => ({...x, subId: null, price: typedPrice(base$, x.type)}));
  }, [one, many]);

  useEffect(() => {
    if (edit) return;
    setF(x => ({...x, dur: SES_TYPES[f.type].dur,
      price: x.subId ? x.price : typedPrice(base$, f.type)}));
  }, [f.type]);

  const taken = db.sessions
    .filter(s => s.status !== 'canceled' && sameDay(s.start, f.when) && (!edit || s.id !== edit.id))
    .map(s => fmtTime(s.start));

  const sp = split(f.price * Math.max(1, f.ids.length), S);   /* у групі ціна — з кожного */
  const conflict = taken.includes(fmtTime(f.when));

  /* Серія на 12 тижнів легко наїжджає на вже зайняті години, і мовчки
     створювати накладки — найгірше, що тут можна зробити: тренер
     побачить це аж у розкладі, коли клієнт уже прийшов. */
  const clash = useMemo(() => {
    if (edit || !f.every) return [];
    const at = fmtTime(f.when);
    const busy = new Set(db.sessions.filter(x => x.status !== 'canceled')
      .map(x => iso(new Date(x.start)) + ' ' + fmtTime(x.start)));
    const out = [];
    for (let k = 1; k < clamp(f.times, 1, 52); k++){
      const d = addDays(f.when, k * 7 * f.every);
      if (busy.has(iso(d) + ' ' + at)) out.push(d);
    }
    return out;
  }, [db.sessions, f.when, f.every, f.times, edit]);

  function save(){
    if (!f.ids.length){ setErr(t('session.err.client','Оберіть клієнта')); return; }
    const common = {start: f.when.toISOString(), type: f.type, price: f.price,
                    paid: f.paid, note: f.note, dur: f.dur};
    if (edit){
      const r = Act.updSession(edit.id, {...common, clientId: f.ids[0], subId: f.subId});
      /* час у групи спільний: якщо посунули одного, решта поїхала б без
         нього — а це те саме заняття. Кнопка «Перенести» так і робить,
         редагування має поводитись однаково */
      if (edit.groupId && common.start !== edit.start) Act.moveSession(edit.id, f.when);
      if (r.over) Toaster.bad(t('ses.done.over','Абонемент вичерпано — тренування записали як борг'));
      else Toaster.ok(t('session.saved','Зміни збережено'));
      onClose();
      return;
    }
    /* один запис на учасника, спільний groupId — так у кожного лишається
       своя оплата, а в календарі вони показуються однією карткою */
    const groupId = many ? uid('grp') : null;
    const repeatId = f.every ? uid('rep') : null;
    const n = f.every ? clamp(f.times, 1, 52) : 1;
    let made = 0;
    for (let k = 0; k < n; k++){
      const when = addDays(f.when, k * 7 * f.every);
      /* абонемент списується за фактом проведення, тож наперед його не
         розписуємо — інакше залишок з'їдався б наступними тижнями */
      const subId = many || k > 0 ? null : f.subId;
      f.ids.forEach(id => Act.addSession({
        ...common, clientId: id, subId, groupId, repeatId,
        start: when.toISOString(),
        status: +when < Date.now() ? 'done' : 'planned',
      }));
      made++;
    }
    Toaster.ok(made > 1 ? t('session.added.rep','Створено тренувань') + ': ' + made
               : many ? t('session.added.many','Групове тренування додано')
               : t('session.added','Тренування додано'));
    onClose();
  }

  return (
    <Page title={edit ? t('session.edit','Тренування') : t('session.new','Нове тренування')} onClose={onClose}
          right={edit && (
            <button className="iconbtn" onClick={() => { Act.delSession(edit.id); Toaster.show(t('session.deleted','Видалено')); onClose(); }}
                    aria-label={t('common.delete')}><Ic.trash size={19}/></button>)}
          footer={<Btn kind="pri" size="lg" wide onClick={save}>{t('session.save','Зберегти тренування')}</Btn>}>
      <Field label={many ? t('session.clients','Клієнти') : t('session.client','Клієнт')}
             hint={err || (edit ? '' : t('session.multi','Оберіть ще одного — і тренування стане груповим'))} bad={!!err}>
        <ClientPick value={edit || !many ? (f.ids[0] || '') : ''} onPick={pick}
                    onCreate={q => nav.go('client.new', {name: q, then:'session'})}/>
        {many && (
          <div className="chips" style={{marginTop:8}}>
            {f.ids.map(id => {
              const c = byId(db.clients, id);
              return (
                <button key={id} className="chip on" onClick={() => drop(id)}>
                  {c ? c.name : '—'} <span style={{opacity:.7, marginLeft:2}}>✕</span>
                </button>
              );
            })}
          </div>
        )}
      </Field>

      <Field label={t('common.date','Дата')}>
        <DatePick value={f.when} onChange={d => set('when', d)}/>
      </Field>

      <Field label={t('session.time','Час')} hint={conflict ? t('session.conflict','На цей час уже є тренування') : null} bad={conflict}>
        <TimePick value={f.when} onChange={d => set('when', d)} taken={taken}/>
      </Field>

      <Field label={t('session.type','Тип тренування')}>
        <div className="chips">
          {Object.entries(SES_TYPES).map(([k, v]) => (
            <button key={k} className={cx('chip', f.type === k && 'on')} onClick={() => set('type', k)}>{typeTitle(k)}</button>
          ))}
        </div>
      </Field>

      <Field label={t('session.price','Вартість')}
             hint={many ? t('session.price.each','Ціна з кожного учасника')
                   : f.subId ? t('session.price.sub','Ціна одного заняття з абонемента')
                   : who && who.price ? t('session.price.fix','Закріплена ціна цього клієнта — можна змінити для цього тренування')
                   : t('session.price.def','Підставлено ціну за замовчуванням — змініть, якщо сьогодні інша сума')}>
        <Input value={f.price} onChange={e => set('price', +e.target.value.replace(/\D/g,'') || 0)} inputMode="numeric" suffix={S.currency}/>
        {!f.subId && (
          <div className="chips" style={{marginTop:8}}>
            {[...new Set([base$, S.price, Math.round(base$ * 1.25), Math.round(base$ * .75)])]
              .filter(v => v > 0).sort((a, b) => a - b).map(v => (
              <button key={v} className={cx('chip', f.price === v && 'on')} onClick={() => set('price', v)}>{money(v)}</button>
            ))}
          </div>
        )}
      </Field>

      <Field label={t('session.payment','Оплата')}>
        <div className="segm">
          <button className={cx(f.subId && 'on')} disabled={!sub || many}
                  onClick={() => sub && setF(x => ({...x, subId: sub.id, paid:true, price: Math.round(sub.price / sub.total)}))}
                  style={{opacity: sub && !many ? 1 : .4}}>{t('pay.package','З абонемента')}</button>
          <button className={cx(!f.subId && f.paid && 'on')} onClick={() => setF(x => ({...x, subId:null, paid:true}))}>{t('pay.paid','Оплачено')}</button>
          <button className={cx(!f.subId && !f.paid && 'on')} onClick={() => setF(x => ({...x, subId:null, paid:false}))}>{t('pay.later','Потім')}</button>
        </div>
      </Field>
      {sub && f.subId && (
        <div className="muted" style={{fontSize:12.5, marginTop:8, marginLeft:2}}>
          {t('session.sub.left','Залишок абонемента')}: {sub.total - sub.used} / {sub.total}
        </div>
      )}
      {many && (
        <div className="muted" style={{fontSize:12.5, marginTop:8, marginLeft:2}}>
          {t('session.sub.solo','Абонемент списується лише в індивідуальному тренуванні — у групі кожен платить окремо')}
        </div>
      )}

      <div className="card pad" style={{marginTop:16, background:'var(--accent-soft)', borderColor:'transparent'}}>
        <Rowline k={t('home.turnover','Оборот')} v={money(sp.gross)}/>
        {S.gymMode !== 'none' && <Rowline k={t('home.gym','Залу')} v={'−' + money(sp.gym)} tone="var(--ink-2)"/>}
        <Rowline k={t('session.toyou','Тренеру')} v={money(sp.net)} tone="var(--accent)" strong/>
      </div>

      {!edit && (
        <Field label={t('session.repeat','Повторювати')}
               hint={f.every ? t('session.repeat.h','Тренування створяться наперед — кожне окремим записом, змінити чи скасувати можна будь-яке')
                             : t('session.repeat.h0','Якщо клієнт ходить у той самий день і час, не заводьте кожне окремо')}>
          <div className="segm">
            {[[0, t('session.repeat.no','Разово')],
              [1, t('session.repeat.1','Щотижня')],
              [2, t('session.repeat.2','Через тиждень')]].map(([v, tx]) => (
              <button key={v} className={cx(f.every === v && 'on')} onClick={() => set('every', v)}>{tx}</button>
            ))}
          </div>
          {f.every > 0 && (
            <div className="chips" style={{marginTop:10}}>
              {[4, 8, 12, 24].map(v => (
                <button key={v} className={cx('chip', f.times === v && 'on')} onClick={() => set('times', v)}>
                  {v} {t('session.repeat.times','разів')}
                </button>
              ))}
            </div>
          )}
          {f.every > 0 && (
            <div className="muted" style={{fontSize:12.5, marginTop:8, marginLeft:2}}>
              {t('session.repeat.last','Останнє')}: {fmtDM(addDays(f.when, (clamp(f.times, 1, 52) - 1) * 7 * f.every))}
            </div>
          )}
          {clash.length > 0 && (
            <div style={{fontSize:12.5, marginTop:6, marginLeft:2, color:'var(--warn)', fontWeight:600}}>
              {t('session.repeat.clash','На цей час уже є тренування')}: {clash.map(fmtDM).join(', ')}
            </div>
          )}
        </Field>
      )}

      <Field label={t('session.note','Нотатка до тренування')}>
        <textarea className="inp" value={f.note} onChange={e => set('note', e.target.value)}
                  placeholder={t('session.note.ph','Напр.: тест на 1ПМ, або прийти на 10 хв раніше')}/>
      </Field>
    </Page>
  );
};

/* ─────────── 5. КАЛЕНДАР ─────────── */
const Calendar = ({loading}) => {
  const db = useDB();
  const nav = useNav();
  const [view, setView] = useState('day');
  const [cur, setCur] = useState(() => d0(new Date()));
  const [open, setOpen] = useState(null);
  const [show, setShow] = useState([]);        /* розкриті групові тренування */
  const toggle = id => setShow(x => x.includes(id) ? x.filter(v => v !== id) : [...x, id]);
  const S = db.settings;

  const sesOf = d => db.sessions.filter(s => sameDay(s.start, d))
    .sort((a, b) => +new Date(a.start) - +new Date(b.start));
  const dayList = sesOf(cur);
  const dayStats = useMemo(() => {
    const [f, tt] = periodRange('day', cur);
    return stats(db, f, tt);
  }, [db, cur]);

  const weekStart = useMemo(() => addDays(cur, -((cur.getDay() + 6) % 7)), [cur]);
  const monthCells = useMemo(() => {
    const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const start = addDays(first, -((first.getDay() + 6) % 7));
    return Array.from({length: 42}, (_, i) => addDays(start, i));
  }, [cur]);

  if (loading) return <SkScreen/>;

  const shift = n => setCur(view === 'month' ? addMonths(cur, n) : addDays(cur, view === 'week' ? n * 7 : n));

  return (
    <Fragment>
      <div className="appbar">
        <button className="iconbtn" onClick={() => shift(-1)} aria-label="−"><Ic.left/></button>
        <button className="title" onClick={() => setCur(d0(new Date()))}>
          {view === 'month' ? fmtMon(cur) : view === 'week'
            ? fmtDMs(weekStart) + ' — ' + fmtDMs(addDays(weekStart, 6))
            : cap(relDay(cur)) + ', ' + fmtDM(cur)}
        </button>
        <button className="iconbtn" onClick={() => shift(1)} aria-label="+"><Ic.right/></button>
      </div>

      <div className="screen">
        <Segm value={view} onChange={setView}
              items={[{v:'day', t:t('common.day','День')}, {v:'week', t:t('common.week','Тиждень')}, {v:'month', t:t('common.month','Місяць')}]}/>

        {view === 'week' && (
          <div className="week-strip" style={{marginTop:12}}>
            {Array.from({length:7}, (_, i) => addDays(weekStart, i)).map((d, i) => {
              const n = sesOf(d).filter(s => s.status !== 'canceled').length;
              return (
                <button key={i} className={cx('week-day', sameDay(d, cur) && 'on')} onClick={() => setCur(d0(d))}>
                  <div className="wd">{fmtDow(d)}</div>
                  <div className="dn num">{d.getDate()}</div>
                  <div className="cnt">{Array.from({length: Math.min(n, 3)}, (_, k) => <i key={k}/>)}</div>
                </button>
              );
            })}
          </div>
        )}

        {view === 'month' && (
          <div style={{marginTop:12}}>
            <div className="cal-grid">
              {DOW_SHORT().map(d => <div key={d} className="cal-dow">{d}</div>)}
            </div>
            <div className="cal-grid">
              {monthCells.map((d, i) => {
                const n = sesOf(d).filter(s => s.status !== 'canceled').length;
                return (
                  <button key={i} className={cx('cal-day', d.getMonth() !== cur.getMonth() && 'out',
                                                sameDay(d, new Date()) && 'today', sameDay(d, cur) && 'on')}
                          onClick={() => setCur(d0(d))}>
                    <span className="num">{d.getDate()}</span>
                    <span className="pips">{Array.from({length: Math.min(n, 3)}, (_, k) => <i key={k}/>)}</span>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* підсумок дня */}
        <div className="card pad" style={{marginTop:14, display:'flex', gap:14, alignItems:'center'}}>
          <div style={{flex:1}}>
            <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{cap(relDay(cur))}</div>
            <div className="dsp" style={{fontSize:19, fontWeight:800, marginTop:2}}>
              {nSessions(byGroup(dayList.filter(s => s.status !== 'canceled')).length)}
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('home.net','Чистими')}</div>
            <div className="money num" style={{fontSize:19, color:'var(--accent)'}}>{money(dayStats.net)}</div>
          </div>
        </div>

        {/* стрічка дня */}
        {dayList.length === 0 ? (
          <div className="card" style={{marginTop:12}}>
            <Empty icon={<Ic.cal size={28}/>} title={t('cal.free','Вільний день')}
                   text={t('cal.free.t','На цю дату тренувань немає.')}
                   action={<Btn kind="soft" size="sm" onClick={() => nav.go('session.new', {date: cur.toISOString()})}>
                             <Ic.plus size={17}/>{t('cal.add','Додати тренування')}</Btn>}/>
          </div>
        ) : view === 'day' ? (
          <div className="tl" style={{marginTop:16}}>
            {Array.from({length: S.dayEnd - S.dayStart + 1}, (_, i) => S.dayStart + i).map(h => {
              const items = dayList.filter(s => new Date(s.start).getHours() === h);
              return (
                <div key={h} className="hr">
                  <div className="lab num">{String(h).padStart(2,'0')}:00</div>
                  {byGroup(items).map(row => {
                    const s = row[0];
                    const group = row.length > 1;
                    const shown = group && !show.includes(s.groupId) ? [] : row;
                    const ready = row.filter(x => x.status === 'planned' && +new Date(x.start) <= Date.now());
                    const total = sum(row, x => x.price);
                    const names = row.map(x => (byId(db.clients, x.clientId) || {}).name || '—');
                    return (
                      <div key={s.groupId || s.id} className={cx('ev', (SES_TYPES[s.type] || SES_TYPES.personal).hue, s.status)}>
                        <div style={{display:'flex', alignItems:'center', gap:10}}>
                          <button style={{flex:1, minWidth:0, textAlign:'left'}}
                                  onClick={() => group ? toggle(s.groupId) : setOpen(s)}>
                            <b>{fmtTime(s.start)} · {group ? t('cal.group','Групове') + ' · ' + row.length + ' · ' + money(total)
                                                            : names[0]}</b>
                            <span className={cx(group && 'who')}>
                              {group ? names.join(', ')
                                     : typeTitle(s.type) + ' · ' + money(s.price) + ' · ' + payLabel(s)}</span>
                          </button>
                          {ready.length > 0 && (
                            <button className="go" onClick={() => {
                              /* Групу проводимо разом, але про вичерпаний
                                 абонемент кажемо окремо: інакше тренер
                                 побачить бадьоре «Проведено» й не дізнається,
                                 що комусь із учасників записався борг. */
                              const over = ready.filter(x => Act.complete(x.id, !!x.subId).over).length;
                              if (over) Toaster.bad(t('ses.done.over.n','Абонемент вичерпано — записали як борг') + ' · ' + over);
                              else Toaster.ok(t('ses.done.ok','Проведено') + ' · ' + money(sum(ready, x => x.price)));
                            }}>
                              <Ic.check size={14}/>{t('ses.done','Проведено')}
                            </button>
                          )}
                        </div>
                        {/* учасників розкриваємо на дотик: у кожного своя оплата,
                            і дістатись до неї треба, але не щоразу */}
                        {group && shown.length > 0 && (
                          <div className="ev-list">
                            {row.map(x => {
                              const who = byId(db.clients, x.clientId);
                              return (
                                <button key={x.id} className="ev-one" onClick={() => setOpen(x)}>
                                  <span className="nm">{who ? who.name : '—'}</span>
                                  <span className="ds">{money(x.price)} · {payLabel(x)}</span>
                                  <Ic.right size={14}/>
                                </button>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        ) : (
          <div className="rows" style={{marginTop:12}}>
            {dayList.map(s => <SessionRow key={s.id} s={s} onOpen={setOpen} quick/>)}
          </div>
        )}
      </div>

      <button className="fab" onClick={() => nav.go('session.new', {date: cur.toISOString()})} aria-label={t('cal.add')}>
        <Ic.plus size={26}/>
      </button>
      {open && <SessionSheet id={open.id} onClose={() => setOpen(null)}/>}
    </Fragment>
  );
};

/* ─────────── 6. КЛІЄНТИ ─────────── */
const Clients = ({loading}) => {
  const db = useDB();
  const nav = useNav();
  const [q, setQ] = useState('');
  const [sort, setSort] = useState('next');

  /* Архів — окремий фільтр, а не порядок сортування: там навмисно
     показуємо саме тих, кого зі списків прибрали. Інакше повернути
     людину звідти було б нічим. */
  const rows = useMemo(() => db.clients.filter(c => sort === 'arch' ? c.archived : !c.archived)
    .map(c => ({c, st: clientStats(db, c.id)})), [db, sort]);
  const found = rows.filter(({c}) => (c.name + ' ' + (c.phone || '') + ' ' + goalTitle(c.goal))
    .toLowerCase().includes(q.trim().toLowerCase()));
  /* «З боргом» і «Без тренування» — це фільтри, а не просто порядок */
  const filtered = found.filter(({st}) =>
    sort === 'debt' ? st.debt > 0
    : sort === 'lapsed' ? (!st.next && (st.lapsedDays === null || st.lapsedDays >= db.settings.lapseDays))
    : true);
  const sorted = [...filtered].sort((a, b) => {
    if (sort === 'name') return a.c.name.localeCompare(b.c.name, 'uk');
    if (sort === 'debt') return b.st.debt - a.st.debt;
    if (sort === 'lapsed') return (b.st.lapsedDays || 9999) - (a.st.lapsedDays || 9999);
    const an = a.st.next ? +new Date(a.st.next.start) : Infinity;
    const bn = b.st.next ? +new Date(b.st.next.start) : Infinity;
    return an - bn;
  });

  if (loading) return <SkScreen/>;

  return (
    <Fragment>
      <div className="appbar">
        <div className="title">{t('nav.clients','Клієнти')} · {db.clients.filter(c => !c.archived).length}</div>
        <button className="iconbtn boxed" onClick={() => nav.go('client.new')} aria-label={t('client.new')}>
          <Ic.plus size={20} style={{color:'var(--accent)'}}/>
        </button>
      </div>

      <div className="screen">
        <div className="search">
          <Ic.search size={18}/>
          <input className="inp" placeholder={t('client.search','Пошук за іменем або телефоном')}
                 value={q} onChange={e => setQ(e.target.value)}/>
        </div>

        <div className="chips" style={{marginTop:10}}>
          {[['next', t('client.sort.next','Найближчі')], ['name', t('client.sort.name','За іменем')],
            ['debt', t('client.sort.debt','З боргом')], ['lapsed', t('client.sort.lapsed','Давно не був')]]
            .concat(db.clients.some(c => c.archived) ? [['arch', t('client.sort.arch','В архіві')]] : [])
            .map(([v, tx]) => (
            <button key={v} className={cx('chip', sort === v && 'on')} onClick={() => setSort(v)}>{tx}</button>
          ))}
        </div>

        {db.clients.length === 0 ? (

                 action={<Btn kind="pri" onClick={() => nav.go('client.new')}><Ic.plus size={18}/>{t('client.new','Новий клієнт')}</Btn>}/>
        ) : sorted.length === 0 && (sort === 'debt' || sort === 'lapsed') ? (
          <Empty icon={<Ic.check size={28}/>}
                 title={sort === 'debt' ? t('client.nodebt','Боргів немає') : t('client.nolapsed','Усі на місці')}
                 text={sort === 'debt' ? t('client.nodebt.t','Усі проведені тренування оплачені.')

                 action={<Btn kind="soft" size="sm" onClick={() => setSort('next')}>{t('client.all','Показати всіх')}</Btn>}/>

                 text={t('client.nofind.t','Перевірте запит або створіть нового клієнта.')}
                 action={<Btn kind="soft" size="sm" onClick={() => nav.go('client.new', {name: q})}>
                           <Ic.plus size={17}/>{t('client.new','Новий клієнт')}</Btn>}/>
        ) : (
          sort === 'lapsed' ? (
          /* у цьому фільтрі головне не перегляд, а написати — тому картка
             з кнопкою, а не звичайний рядок списку */
          <div className="stack" style={{marginTop:12}}>
            {sorted.map(({c, st}) => (
              <LapsedCard key={c.id} c={c} days={st.lapsedDays === null ? 0 : st.lapsedDays} last={st.last}/>
            ))}
