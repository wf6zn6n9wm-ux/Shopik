        {sub && <div className="muted" style={{fontSize:13.5, marginBottom:10}}>{sub}</div>}
        {children}

/* тости */
const Toaster = {
  list: [], subs: new Set(),
  show(text, kind){
    const item = {id: uid('ts'), text, kind};
    Toaster.list = [...Toaster.list, item];
    Toaster.subs.forEach(f => f());
    setTimeout(() => { Toaster.list = Toaster.list.filter(x => x.id !== item.id); Toaster.subs.forEach(f => f()); }, 2600);
  },
  ok: tx => Toaster.show(tx, 'ok'),
  bad: tx => Toaster.show(tx, 'bad'),
};
const ToastHost = () => {
  const [, f] = useState(0);
  useEffect(() => { const fn = () => f(x => x + 1); Toaster.subs.add(fn); return () => Toaster.subs.delete(fn); }, []);
  return (
    <div className="toast-wrap">
      {Toaster.list.map(x => (
        <div key={x.id} className={cx('toast', x.kind)}>
          {x.kind === 'ok' ? <Ic.check size={18}/> : x.kind === 'bad' ? <Ic.warn size={18}/> : <Ic.info size={18}/>}
          <span>{x.text}</span>
        </div>
      ))}
    </div>
  );
};

/* межа помилки: збій одного екрана не кладе застосунок */
class Boundary extends React.Component {
  constructor(p){ super(p); this.state = {err: null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err){ console.error('[screen]', err); }
  render(){
    if (this.state.err) return (
      <div className="screen">
        <ErrorBox text={String(this.state.err.message || this.state.err)}
                  onRetry={() => this.setState({err: null})}/>
      </div>
    );
    return this.props.children;
  }
}

/* площа-лінія з градієнтом */
const Area = ({data, height = 150, fmtV = moneyShort}) => {
  const W = 320, H = height, pad = 6;
  const max = Math.max(1, ...data.map(d => d.v));
  const n = Math.max(1, data.length - 1);
  const px = i => pad + i * ((W - pad * 2) / n);
  const py = v => H - 22 - (v / max) * (H - 40);
  const pts = data.map((d, i) => [px(i), py(d.v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${px(n)} ${H - 22} L${px(0)} ${H - 22} Z`;
  const last = data[data.length - 1];
  return (
    <svg className="chart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{height}}>
      <defs>
        <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--accent)" stopOpacity=".34"/>
          <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
        </linearGradient>
      </defs>
      {[0, .5, 1].map(k => (
        <line key={k} x1="0" x2={W} y1={py(max * k)} y2={py(max * k)} stroke="var(--line)" strokeWidth="1"/>
      ))}
      <path d={area} fill="url(#ag)"/>
      <path d={line} fill="none" stroke="var(--accent)" strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"/>
      {last && <circle cx={px(n)} cy={py(last.v)} r="4" fill="var(--accent)" stroke="var(--surface)" strokeWidth="2.5"/>}
      {data.map((d, i) => (i % Math.ceil(data.length / 6) === 0 || i === data.length - 1) && (
        <text key={i} x={px(i)} y={H - 5} fontSize="9.5" fontWeight="700" fill="var(--ink-3)"
              textAnchor={i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle'}>{d.label}</text>
      ))}
    </svg>
  );
};

/* кільце структури доходу */
const Donut = ({parts, size = 132, center}) => {
  const total = Math.max(1, sum(parts, p => p.v));
  const R = size / 2 - 11, C = 2 * Math.PI * R;
  let off = 0;
  return (
    <div style={{position:'relative', width:size, height:size, flex:'none'}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={R} fill="none" stroke="var(--surface-2)" strokeWidth="13"/>
        {parts.map((p, i) => {
          const len = (p.v / total) * C;
          const el = <circle key={i} cx={size/2} cy={size/2} r={R} fill="none" stroke={p.c} strokeWidth="13"
                             strokeDasharray={`${len} ${C - len}`} strokeDashoffset={-off} strokeLinecap="butt"/>;
          off += len;
          return el;
        })}
      </svg>
      <div style={{position:'absolute', inset:0, display:'grid', placeItems:'center', textAlign:'center'}}>{center}</div>
    </div>
  );
};

/* статус рядка: майбутнє тренування — «Заплановано», а не «Не оплачено» */

/* швидкий вибір дати: сьогодні / завтра / календар */
const DatePick = ({value, onChange}) => {
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(new Date(), i));
  const sel = d0(value);
  const isCustom = !days.some(d => sameDay(d, sel));
  return (
    <div className="chips" style={{marginTop:2}}>
      {days.map((d, i) => (
        <button key={i} className={cx('chip', sameDay(d, sel) && 'on')}
                onClick={() => { const x = new Date(value); const nd = new Date(d); nd.setHours(x.getHours(), x.getMinutes(), 0, 0); onChange(nd); }}>
          {i === 0 ? t('common.today') : i === 1 ? t('common.tomorrow') : fmtDow(d) + ' ' + d.getDate()}
        </button>
      ))}
      <label className={cx('chip', isCustom && 'on')} style={{position:'relative', cursor:'pointer'}}>
        <Ic.cal size={16}/>{isCustom ? fmtDMs(sel) : t('common.date','Дата')}
        <input type="date" value={iso(value)} onChange={e => {
          if (!e.target.value) return;
          const [y, m, dd] = e.target.value.split('-').map(Number);
          const x = new Date(value); x.setFullYear(y, m - 1, dd); onChange(x);
        }} style={{position:'absolute', inset:0, opacity:0, width:'100%', height:'100%'}}/>
      </label>
    </div>
  );
};

/* сітка часу — один тап замість колеса */
const TimePick = ({value, onChange, taken = []}) => {
  const db = useDB();
  const S = db.settings;
  const slots = [];
  for (let h = S.dayStart; h <= S.dayEnd; h++){ slots.push(h + ':00'); if (h < S.dayEnd) slots.push(h + ':30'); }
  const cur = fmtTime(value);
  const norm = s => { const [h, m] = s.split(':').map(Number); return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'); };
  return (
    <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:7, marginTop:2}}>
      {slots.map(s => {
        const busy = taken.includes(norm(s));
        return (
          <button key={s} className={cx('chip', cur === norm(s) && 'on')}
                  style={{width:'100%', justifyContent:'center', opacity: busy && cur !== norm(s) ? .45 : 1}}
                  onClick={() => { const [h, m] = s.split(':').map(Number); const x = new Date(value); x.setHours(h, m, 0, 0); onChange(x); }}>
            {norm(s)}{busy && cur !== norm(s) ? ' •' : ''}
          </button>
        );
      })}

/* ─────────────────── 2. ВХІД / РЕЄСТРАЦІЯ ─────────────────── */
const Auth = ({onReady, save}) => {
  const [mode, setMode] = useState('reg');       // reg | login
  const [f, setF] = useState({login:'', pass:''});
  const [protect, setProtect] = useState(false); // пароль — за бажанням
  const [askPass, setAskPass] = useState(false); // на вході, якщо кабінет захищений
  const [show, setShow] = useState(false);
  const [err, setErr] = useState({});
  const [busy, setBusy] = useState(false);
  const meta0 = Disk.readMeta();
  const hasAcc = !!(meta0 && meta0.account);

  useEffect(() => { if (hasAcc && !save) setMode('login'); }, [hasAcc, save]);
  const set = (k, v) => { setF(x => ({...x, [k]: v})); setErr(x => ({...x, [k]: null})); };

  async function submit(){
    const e = {};
    const login = f.login.trim();
    if (!isLogin(login)) e.login = t('auth.err.login','Введіть пошту або номер телефону');
    if ((protect || askPass) && f.pass.length < 4) e.pass = t('auth.err.pass','Пароль — від 4 символів');
    setErr(e);
    if (Object.keys(e).length) return;
    setBusy(true);
    try {
      const meta = Disk.readMeta() || {};
      const salt = meta.salt || b64(crypto.getRandomValues(new Uint8Array(16)));
      const norm = normLogin(login);
      const hash = (protect || askPass) ? await Vault.hash(f.pass, salt) : null;

      if (mode === 'login'){
        const a = meta.account;
        const match = a && (a.login === norm || a.email === norm);
        if (!match){ setErr({login: t('auth.err.nouser','Такого кабінету на цьому пристрої немає')}); setBusy(false); return; }
        if (a.hash && !askPass){ setAskPass(true); setBusy(false); return; }   /* кабінет під паролем */
        if (a.hash && a.hash !== hash){ setErr({pass: t('auth.err.bad','Пароль не підходить')}); setBusy(false); return; }
        onReady({account: a, fresh:false});
      } else {
        const account = {login: norm, raw: login, kind: isEmail(login) ? 'email' : 'phone',
                         hash, createdAt: Date.now()};
        Disk.writeMeta({...meta, salt, account});
        onReady({account, fresh:true});
      }
    } catch (ex){
      setErr({pass: t('auth.err.crypto','Не вдалося перевірити пароль на цьому пристрої')});
      setBusy(false);
    }
  }

  const title = save ? t('auth.save','Зберегти дані')
              : mode === 'reg' ? t('auth.reg','Створити кабінет') : t('auth.login','З поверненням');
  const sub = save ? t('auth.save.sub','Кабінет прив’яжеться до вашої пошти або номера — дані з демо залишаться на місці.')
            : mode === 'reg' ? t('auth.reg.sub','Достатньо пошти або номера — жодних кодів і підтверджень. Пароль можна не вигадувати.')
            : t('auth.login.sub','Введіть логін, з яким створювали кабінет.');

  return (
    <div className="ob fade-in">
      <div className="brand" style={{marginBottom:24}}><div className="mark"><Ic.dumb size={21}/></div><b>PRO Trainer</b></div>
      <div style={{flex:1}}>
        <div className="dsp" style={{fontSize:27, fontWeight:800, letterSpacing:'-.035em'}}>{title}</div>
        <p className="muted" style={{fontSize:14, marginTop:8}}>{sub}</p>

        <Field label={t('auth.loginlbl','Пошта або телефон')} hint={err.login} bad>
          <Input value={f.login} onChange={e => set('login', e.target.value)}
                 placeholder="trainer@mail.com або 067 123 45 67"
                 autoCapitalize="off" autoCorrect="off" spellCheck="false" bad={!!err.login}/>
        </Field>

        {(protect || askPass) && (
          <Field label={t('auth.pass','Пароль')} hint={err.pass || (protect ? t('auth.pass.hint','Мінімум 4 символи. Знадобиться лише щоб відкрити кабінет на цьому пристрої.') : null)} bad={!!err.pass}>
            <Input value={f.pass} onChange={e => set('pass', e.target.value)} autoFocus
                   type={show ? 'text' : 'password'} placeholder="••••" bad={!!err.pass}
                   suffix={
                     <button onClick={() => setShow(!show)} style={{color:'var(--accent)', fontWeight:700, fontSize:12.5}}>
                       {show ? t('auth.hide','Сховати') : t('auth.show','Показати')}
                     </button>}/>
          </Field>
        )}

        {mode === 'reg' && !protect && (
          <button className="btn ghost sm" style={{marginTop:10, paddingLeft:0}} onClick={() => setProtect(true)}>
            <Ic.lock size={16}/>{t('auth.protect','Захистити паролем (не обов’язково)')}
          </button>
        )}
      </div>

      <div style={{marginTop:20}}>
        <Btn kind="pri" size="lg" wide onClick={submit} disabled={busy}>
          {busy ? t('auth.wait','Хвилинку…') : mode === 'reg' ? t('auth.go','Продовжити') : t('auth.enter','Увійти')}
        </Btn>
        {!save && (
          <button className="btn ghost wide" style={{marginTop:6}}
                  onClick={() => { setErr({}); setAskPass(false); setMode(mode === 'reg' ? 'login' : 'reg'); }}>
            {mode === 'reg' ? t('auth.have','Вже є кабінет — увійти') : t('auth.no','Немає кабінету — створити')}
          </button>
        )}
        {!hasAcc && !save && (
          <button className="btn ghost wide" style={{color:'var(--ink-3)'}} onClick={() => onReady({account:null, fresh:true})}>
            {t('auth.guest','Спробувати без реєстрації')}
          </button>
        )}
      </div>
    </div>
  );
};

/* PIN-замок: потрібен, коли увімкнено шифрування бази */
const PinLock = ({mode, onPin, onCancel, error}) => {
  const [pin, setPin] = useState('');
  const [shake, setShake] = useState(false);
  useEffect(() => { if (error){ setShake(true); setPin(''); const x = setTimeout(() => setShake(false), 420); return () => clearTimeout(x); } }, [error]);
  const push = d => {
    const v = (pin + d).slice(0, 4);
    setPin(v);
    if (v.length === 4) setTimeout(() => { onPin(v); setPin(''); }, 120);
  };
  return (
    <div className="ob fade-in" style={{justifyContent:'center'}}>
      <div style={{textAlign:'center', marginTop:'auto'}}>
        <div style={{width:64, height:64, borderRadius:20, background:'var(--accent-soft)',
             color:'var(--accent)', display:'grid', placeItems:'center', margin:'0 auto 14px'}}><Ic.lock size={26}/></div>
        <div className="dsp" style={{fontSize:22, fontWeight:800}}>
          {mode === 'set' ? t('pin.set','Придумайте PIN') : mode === 'confirm' ? t('pin.again','Повторіть PIN') : t('pin.enter','Введіть PIN')}
        </div>
        <p className="muted" style={{fontSize:13.5, marginTop:6}}>
          {error || t('pin.sub','4 цифри, щоб відкрити базу клієнтів')}
        </p>
        <div className={cx('pin-dots', shake && 'shake')}>
          {[0,1,2,3].map(i => <i key={i} className={cx(i < pin.length && 'on')}/>)}
        </div>
      </div>
      <div className="keypad" style={{marginTop:'auto'}}>
        {[1,2,3,4,5,6,7,8,9].map(d => <button key={d} onClick={() => push(String(d))}>{d}</button>)}
        <button className="flat" onClick={onCancel}>{onCancel ? t('common.cancel') : ''}</button>
        <button onClick={() => push('0')}>0</button>
        <button className="flat" onClick={() => setPin(pin.slice(0, -1))}>⌫</button>
      </div>
    </div>
  );
};

          </div>

          <Rowline k={t('home.gym','Залу')} v={'−' + money(month.gym)} tone="var(--ink-2)"/>
          <Rowline k={t('home.net','Чистими')} v={money(month.net)} tone="var(--accent)" strong/>

          {month.debt > 0 && <Rowline k={t('fin.debt','Не сплачено клієнтами')} v={money(month.debt)} tone="var(--neg)"/>}

        <Btn kind="pri" size="lg" wide style={{marginTop:12}} onClick={() => { setFin(false); setTimeout(() => nav.go('finance'), 60); }}>
          <Ic.wallet size={18}/>{t('home.fin.open','Відкрити фінанси')}

      <MainMenu open={menu} onClose={() => setMenu(false)}/>

  );
};

/* Нагадування без тиску: з'являється лише в останні дні або якщо оплата
   не пройшла, і не повторюється частіше ніж раз на день. */
const TrialBar = () => {
  const acc = useAccess();
  const nav = useNav();
  const key = 'bar_' + acc.kind + '_' + (acc.left || 0) + '_' + iso(new Date());
  const [hidden, setHidden] = useState(() => { try { return sessionStorage.getItem(key) === '1'; } catch { return false; } });
  const show = (acc.kind === 'TRIAL_ACTIVE' && acc.left <= 3) || acc.kind === 'PAYMENT_FAILED'
            || (acc.kind === 'SUBSCRIPTION_CANCELLED' && acc.until - Date.now() < 5 * DAY);
  if (!show || hidden) return null;
  const text = acc.kind === 'PAYMENT_FAILED' ? t('bar.failed','Оплата не пройшла — дані на місці')
    : acc.kind === 'SUBSCRIPTION_CANCELLED' ? t('bar.cancel','Підписка діє до') + ' ' + fmtDM(acc.until)
    : acc.left === 1 ? t('bar.last','Завтра завершується пробний період')
    : t('bar.left','Залишилось') + ' ' + nDays(acc.left) + ' ' + t('bar.free','безкоштовного доступу');
  return (
    <div className="card pad" style={{marginTop:14, display:'flex', alignItems:'center', gap:10,
         background:'var(--accent-soft)', borderColor:'transparent'}}>
      <Ic.star size={18} style={{color:'var(--accent)', flex:'none'}}/>
      <div style={{flex:1, minWidth:0, fontSize:13, fontWeight:700, color:'var(--accent)'}}>{text}</div>
      <Btn kind="soft" size="sm" onClick={() => nav.go('plans')}>{t('bar.go','Обрати план')}</Btn>
      <button className="mute3" aria-label="×" onClick={() => { try { sessionStorage.setItem(key, '1'); } catch {} setHidden(true); }}>
        <Ic.x size={16}/>
      </button>
    </div>
  );
};

const NOTIF_ICON = {
  session: <Ic.dumb size={18}/>, debt: <Ic.card size={18}/>, lapsed: <Ic.msg size={18}/>,
  stock: <Ic.box size={18}/>, pack: <Ic.ticket size={18}/>, booked: <Ic.cal size={18}/>, info: <Ic.info size={18}/>,

const Notifs = () => {
  const db = useDB();
  const nav = useNav();
  useEffect(() => { const x = setTimeout(() => Act.readNotifs(), 900); return () => clearTimeout(x); }, []);
  const groups = useMemo(() => {
    const g = new Map();
    db.notifs.forEach(n => {
      const k = relDay(n.ts);
      if (!g.has(k)) g.set(k, []);
      g.get(k).push(n);
    });
    return [...g.entries()];
  }, [db.notifs]);

  return (
    <Page title={t('menu.notif','Сповіщення')} onClose={nav.back}
          right={db.notifs.length > 0 && (
            <button className="iconbtn" onClick={() => { Act.clearNotifs(); Toaster.ok(t('notif.cleared','Список очищено')); }}
                    aria-label={t('common.delete')}><Ic.trash size={19}/></button>)}>
      {db.notifs.length === 0 ? (
        <Empty icon={<Ic.bell size={30}/>} title={t('notif.empty','Поки тихо')}
               text={t('notif.empty.t','Тут з’являться нагадування про тренування, борги та залишки товарів.')}
               action={<Btn kind="soft" size="sm" onClick={() => nav.go('settings')}>
                         <Ic.gear size={17}/>{t('notif.setup','Налаштувати сповіщення')}</Btn>}/>
      ) : groups.map(([day, items]) => (
        <div key={day}>
          <div className="sechead tight"><div className="h2" style={{fontSize:14, color:'var(--ink-2)'}}>{day}</div></div>
          <div className="rows">
            {items.map(n => (
              <button key={n.id} className="row" onClick={() => {
                if (n.clientId) nav.go('client', {id: n.clientId});
                else if (n.to && ROUTES[n.to]) nav.go(n.to);
                else if (n.to) nav.tab(n.to);          /* вкладка — закриє цю сторінку */
              }}>
                <div style={{width:38, height:38, borderRadius:12,
                     background: n.tone === 'bad' ? 'var(--neg-soft)' : n.tone === 'warn' ? 'var(--warn-soft)' : 'var(--accent-soft)',
                     color: n.tone === 'bad' ? 'var(--neg)' : n.tone === 'warn' ? 'var(--warn)' : 'var(--accent)',
                     display:'grid', placeItems:'center', flex:'none'}}>
                  {NOTIF_ICON[n.type] || NOTIF_ICON.info}
                </div>
                <div style={{flex:1, minWidth:0}}>
                  <div className="nm">{n.title}</div>
                  <div className="ds">{n.body}</div>
                </div>
                <div style={{fontSize:11.5, color:'var(--ink-3)', fontWeight:700}}>{fmtTime(n.ts)}</div>
              </button>
            ))}
          </div>
        </div>
      ))}
    </Page>
  );
};

/* ─────────── картка тренування (шторка з діями) ─────────── */
const SessionSheet = ({id, onClose}) => {
  const db = useDB();
  const nav = useNav();
  const s = byId(db.sessions, id);
  const [confirm, setConfirm] = useState(false);
  if (!s) return null;
  const c = byId(db.clients, s.clientId);
  const sp = split(s.price, db.settings);
  const sub = s.subId ? byId(db.subs, s.subId) : null;
  const past = +new Date(s.start) < Date.now();

  const close = () => { onClose(); };
  const act = fn => { fn(); onClose(); };

  return (
    <Sheet open onClose={close} title={c ? c.name : t('session.one','Тренування')}
           sub={cap(relDay(s.start)) + ', ' + fmtTime(s.start) + ' · ' + typeTitle(s.type)}>
      <div className="card pad" style={{marginTop:6}}>
        <Rowline k={t('home.turnover','Оборот')} v={money(sp.gross)}/>
        {db.settings.gymMode !== 'none' && <Rowline k={t('home.gym','Залу')} v={'−' + money(sp.gym)} tone="var(--ink-2)"/>}
        <Rowline k={t('home.net','Чистими')} v={money(sp.net)} tone="var(--accent)" strong/>
        <div className="rowline">
          <span style={{color:'var(--ink-2)', fontSize:14, fontWeight:600}}>{t('session.status','Статус')}</span>
          <span className={cx('badge', s.status === 'canceled' ? 'neg' : s.subId ? 'acc' : s.paid ? 'pos' : past ? 'neg' : 'warn')}>
            {payLabel(s)}
          </span>
        </div>
        {sub && (
          <div className="rowline">
            <span style={{color:'var(--ink-2)', fontSize:14, fontWeight:600}}>{t('session.sub','Абонемент')}</span>
            <span style={{fontWeight:700, fontSize:14}}>{sub.used} / {sub.total}</span>
          </div>
        )}
      </div>

      {s.note && <div className="card pad" style={{marginTop:9, fontSize:13.5, color:'var(--ink-2)'}}>{s.note}</div>}

      <div className="stack" style={{marginTop:12}}>
        {s.status === 'planned' && (
          <Fragment>
            <div className="grid2">
              <Btn kind="pri" onClick={() => act(() => { Act.complete(s.id, true); Toaster.ok(t('session.done.paid','Проведено та оплачено')); })}>
                <Ic.check size={18}/>{t('session.done1','Провів, оплачено')}
              </Btn>
              <Btn kind="sec" onClick={() => act(() => { Act.complete(s.id, false); Toaster.show(t('session.done.debt','Проведено, лишився борг')); })}>
                {t('session.done2','Провів, без оплати')}
              </Btn>
            </div>
            <Btn kind="sec" wide onClick={() => act(() => { Act.noshow(s.id); Toaster.show(t('session.noshow','Позначено: клієнт не прийшов')); })}>
              {t('session.noshow.btn','Клієнт не прийшов')}
            </Btn>
          </Fragment>
        )}
        {s.status === 'done' && !s.paid && !s.subId && (
          <Btn kind="pri" wide onClick={() => act(() => { Act.pay(s.id); Toaster.ok(t('session.paid','Оплату записано')); })}>
            <Ic.wallet size={18}/>{t('session.pay','Позначити оплату')} · {money(s.price)}
          </Btn>
        )}
        <div className="grid2">
          <Btn kind="sec" onClick={() => { onClose(); nav.go('session.new', {id: s.id}); }}>
            <Ic.edit size={17}/>{t('common.edit','Редагувати')}
          </Btn>
          <Btn kind="sec" onClick={() => { onClose(); nav.go('client', {id: s.clientId}); }}>
            <Ic.user size={17}/>{t('session.client','Клієнт')}
          </Btn>
        </div>
        {s.status !== 'canceled' && (
          <Btn kind="danger" wide onClick={() => setConfirm(true)}>
            <Ic.x size={17}/>{t('session.cancel','Скасувати тренування')}
          </Btn>
        )}
        {confirm && (
          <div className="card pad" style={{borderColor:'var(--neg)'}}>
            <b style={{fontSize:14.5}}>{t('session.cancel.q','Скасувати тренування?')}</b>
            <p className="muted" style={{fontSize:13, margin:'6px 0 12px'}}>
              {t('session.cancel.t','Воно лишиться в історії як скасоване і не потрапить у дохід.')}
            </p>
            <div className="grid2">
              <Btn kind="sec" onClick={() => setConfirm(false)}>{t('common.back','Назад')}</Btn>
              <Btn kind="danger" onClick={() => act(() => { Act.cancel(s.id); Toaster.show(t('session.canceled','Тренування скасовано')); })}>
                {t('session.cancel.yes','Скасувати')}
              </Btn>
            </div>
          </div>
        )}
      </div>
    </Sheet>
  );
};

/* ─────────── форма тренування (створення / редагування) ─────────── */
const SessionForm = ({params, onClose}) => {
  const db = useDB();
  const nav = useNav();
  const edit = params.id ? byId(db.sessions, params.id) : null;
  const S = db.settings;
  const base = edit ? new Date(edit.start) : (() => {
    const d = params.date ? new Date(params.date) : new Date();
    if (!params.date) d.setHours(d.getHours() + 1, 0, 0, 0);
    else if (!params.keepTime) d.setHours(10, 0, 0, 0);
    return d;
  })();

  const [f, setF] = useState({
    clientId: edit ? edit.clientId : (params.clientId || ''),
    when: base,
    type: edit ? edit.type : 'personal',
    price: edit ? edit.price : clientPrice(db, params.clientId || ''),
    paid: edit ? edit.paid : false,
    subId: edit ? edit.subId : null,
    note: edit ? edit.note : '',
    dur: edit ? edit.dur : 60,
  });
  const [err, setErr] = useState('');
  const set = (k, v) => setF(x => ({...x, [k]: v}));

  /* абонемент клієнта підставляється сам */
  const sub = useMemo(() => db.subs.find(x => x.clientId === f.clientId && x.used < x.total), [db.subs, f.clientId]);
  const who = f.clientId ? byId(db.clients, f.clientId) : null;
  const base$ = clientPrice(db, f.clientId);          /* ціна клієнта або за замовчуванням */

  useEffect(() => {
    if (!f.clientId || edit) return;
    if (sub) setF(x => ({...x, subId: sub.id, paid: true, price: Math.round(sub.price / sub.total)}));
    else setF(x => ({...x, subId: null, price: typedPrice(base$, x.type)}));
  }, [f.clientId]);

  useEffect(() => {
    if (edit) return;
    setF(x => ({...x, dur: SES_TYPES[f.type].dur,
      price: x.subId ? x.price : typedPrice(base$, f.type)}));
  }, [f.type]);

  const taken = db.sessions
    .filter(s => s.status !== 'canceled' && sameDay(s.start, f.when) && (!edit || s.id !== edit.id))
    .map(s => fmtTime(s.start));

  const sp = split(f.price, S);
  const conflict = taken.includes(fmtTime(f.when));

  function save(){
    if (!f.clientId){ setErr(t('session.err.client','Оберіть клієнта')); return; }
    const payload = {clientId: f.clientId, start: f.when.toISOString(), type: f.type, price: f.price,
                     paid: f.paid, subId: f.subId, note: f.note, dur: f.dur};
    if (edit) { Act.updSession(edit.id, payload); Toaster.ok(t('session.saved','Зміни збережено')); }
    else { Act.addSession({...payload, status: +f.when < Date.now() ? 'done' : 'planned'}); Toaster.ok(t('session.added','Тренування додано')); }
    onClose();
  }

  return (
    <Page title={edit ? t('session.edit','Тренування') : t('session.new','Нове тренування')} onClose={onClose}
          right={edit && (
            <button className="iconbtn" onClick={() => { Act.delSession(edit.id); Toaster.show(t('session.deleted','Видалено')); onClose(); }}
                    aria-label={t('common.delete')}><Ic.trash size={19}/></button>)}
          footer={<Btn kind="pri" size="lg" wide onClick={save}>{t('session.save','Зберегти тренування')}</Btn>}>
      <Field label={t('session.client','Клієнт')} hint={err} bad>
        <ClientPick value={f.clientId} onPick={id => { set('clientId', id); setErr(''); }}
                    onCreate={q => nav.go('client.new', {name: q, then:'session'})}/>
      </Field>

      <Field label={t('common.date','Дата')}>
        <DatePick value={f.when} onChange={d => set('when', d)}/>
      </Field>

      <Field label={t('session.time','Час')} hint={conflict ? t('session.conflict','На цей час уже є тренування') : null} bad={conflict}>
        <TimePick value={f.when} onChange={d => set('when', d)} taken={taken}/>
      </Field>

      <Field label={t('session.type','Тип тренування')}>
        <div className="chips">
          {Object.entries(SES_TYPES).map(([k, v]) => (
            <button key={k} className={cx('chip', f.type === k && 'on')} onClick={() => set('type', k)}>{typeTitle(k)}</button>
          ))}
        </div>
      </Field>

      <Field label={t('session.price','Вартість')}
             hint={f.subId ? t('session.price.sub','Ціна одного заняття з абонемента')
                   : who && who.price ? t('session.price.fix','Закріплена ціна цього клієнта — можна змінити для цього тренування')
                   : t('session.price.def','Підставлено ціну за замовчуванням — змініть, якщо сьогодні інша сума')}>
        <Input value={f.price} onChange={e => set('price', +e.target.value.replace(/\D/g,'') || 0)} inputMode="numeric" suffix={S.currency}/>
        {!f.subId && (
          <div className="chips" style={{marginTop:8}}>
            {[...new Set([base$, S.price, Math.round(base$ * 1.25), Math.round(base$ * .75)])]
              .filter(v => v > 0).sort((a, b) => a - b).map(v => (
              <button key={v} className={cx('chip', f.price === v && 'on')} onClick={() => set('price', v)}>{money(v)}</button>
            ))}
          </div>
        )}
      </Field>

      <Field label={t('session.payment','Оплата')}>
        <div className="segm">
          <button className={cx(f.subId && 'on')} disabled={!sub}
                  onClick={() => sub && setF(x => ({...x, subId: sub.id, paid:true, price: Math.round(sub.price / sub.total)}))}
                  style={{opacity: sub ? 1 : .4}}>{t('pay.package','З абонемента')}</button>
          <button className={cx(!f.subId && f.paid && 'on')} onClick={() => setF(x => ({...x, subId:null, paid:true}))}>{t('pay.paid','Оплачено')}</button>
          <button className={cx(!f.subId && !f.paid && 'on')} onClick={() => setF(x => ({...x, subId:null, paid:false}))}>{t('pay.later','Потім')}</button>
        </div>
      </Field>
      {sub && f.subId && (
        <div className="muted" style={{fontSize:12.5, marginTop:8, marginLeft:2}}>
          {t('session.sub.left','Залишок абонемента')}: {sub.total - sub.used} / {sub.total}
        </div>
      )}

      <div className="card pad" style={{marginTop:16, background:'var(--accent-soft)', borderColor:'transparent'}}>
        <Rowline k={t('home.turnover','Оборот')} v={money(sp.gross)}/>
        {S.gymMode !== 'none' && <Rowline k={t('home.gym','Залу')} v={'−' + money(sp.gym)} tone="var(--ink-2)"/>}
        <Rowline k={t('session.toyou','Тренеру')} v={money(sp.net)} tone="var(--accent)" strong/>
      </div>

      <Field label={t('session.note','Нотатка до тренування')}>
        <textarea className="inp" value={f.note} onChange={e => set('note', e.target.value)}
                  placeholder={t('session.note.ph','Напр.: тест на 1ПМ, або прийти на 10 хв раніше')}/>
      </Field>
    </Page>
  );
};

/* ─────────── 5. КАЛЕНДАР ─────────── */
const Calendar = ({loading}) => {
  const db = useDB();
  const nav = useNav();
  const [view, setView] = useState('day');
  const [cur, setCur] = useState(() => d0(new Date()));
  const [open, setOpen] = useState(null);
  const S = db.settings;

  const sesOf = d => db.sessions.filter(s => sameDay(s.start, d))
    .sort((a, b) => +new Date(a.start) - +new Date(b.start));
  const dayList = sesOf(cur);
  const dayStats = useMemo(() => {
    const [f, tt] = periodRange('day', cur);
    return stats(db, f, tt);
  }, [db, cur]);

  const weekStart = useMemo(() => addDays(cur, -((cur.getDay() + 6) % 7)), [cur]);
  const monthCells = useMemo(() => {
    const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const start = addDays(first, -((first.getDay() + 6) % 7));
    return Array.from({length: 42}, (_, i) => addDays(start, i));
  }, [cur]);

  if (loading) return <SkScreen/>;

  const shift = n => setCur(view === 'month' ? addMonths(cur, n) : addDays(cur, view === 'week' ? n * 7 : n));

  return (
    <Fragment>
      <div className="appbar">
        <button className="iconbtn" onClick={() => shift(-1)} aria-label="−"><Ic.left/></button>
        <button className="title" onClick={() => setCur(d0(new Date()))}>
          {view === 'month' ? fmtMon(cur) : view === 'week'
            ? fmtDMs(weekStart) + ' — ' + fmtDMs(addDays(weekStart, 6))
            : cap(relDay(cur)) + ', ' + fmtDM(cur)}
        </button>
        <button className="iconbtn" onClick={() => shift(1)} aria-label="+"><Ic.right/></button>
      </div>

      <div className="screen">
        <Segm value={view} onChange={setView}
              items={[{v:'day', t:t('common.day','День')}, {v:'week', t:t('common.week','Тиждень')}, {v:'month', t:t('common.month','Місяць')}]}/>

        {view === 'week' && (
          <div className="week-strip" style={{marginTop:12}}>
            {Array.from({length:7}, (_, i) => addDays(weekStart, i)).map((d, i) => {
              const n = sesOf(d).filter(s => s.status !== 'canceled').length;
              return (
                <button key={i} className={cx('week-day', sameDay(d, cur) && 'on')} onClick={() => setCur(d0(d))}>
                  <div className="wd">{fmtDow(d)}</div>
                  <div className="dn num">{d.getDate()}</div>
                  <div className="cnt">{Array.from({length: Math.min(n, 3)}, (_, k) => <i key={k}/>)}</div>
                </button>
              );
            })}
          </div>
        )}

        {view === 'month' && (
          <div style={{marginTop:12}}>
            <div className="cal-grid">
              {DOW_SHORT().map(d => <div key={d} className="cal-dow">{d}</div>)}
            </div>
            <div className="cal-grid">
              {monthCells.map((d, i) => {
                const n = sesOf(d).filter(s => s.status !== 'canceled').length;
                return (
                  <button key={i} className={cx('cal-day', d.getMonth() !== cur.getMonth() && 'out',
                                                sameDay(d, new Date()) && 'today', sameDay(d, cur) && 'on')}
                          onClick={() => setCur(d0(d))}>
                    <span className="num">{d.getDate()}</span>
                    <span className="pips">{Array.from({length: Math.min(n, 3)}, (_, k) => <i key={k}/>)}</span>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* підсумок дня */}
        <div className="card pad" style={{marginTop:14, display:'flex', gap:14, alignItems:'center'}}>
          <div style={{flex:1}}>
            <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{cap(relDay(cur))}</div>
            <div className="dsp" style={{fontSize:19, fontWeight:800, marginTop:2}}>
              {nSessions(dayList.filter(s => s.status !== 'canceled').length)}
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('home.net','Чистими')}</div>
            <div className="money num" style={{fontSize:19, color:'var(--accent)'}}>{money(dayStats.net)}</div>
          </div>
        </div>

        {/* стрічка дня */}
        {dayList.length === 0 ? (
          <div className="card" style={{marginTop:12}}>
            <Empty icon={<Ic.cal size={28}/>} title={t('cal.free','Вільний день')}
                   text={t('cal.free.t','На цю дату тренувань немає.')}
                   action={<Btn kind="soft" size="sm" onClick={() => nav.go('session.new', {date: cur.toISOString()})}>
                             <Ic.plus size={17}/>{t('cal.add','Додати тренування')}</Btn>}/>
          </div>
        ) : view === 'day' ? (
          <div className="tl" style={{marginTop:16}}>
            {Array.from({length: S.dayEnd - S.dayStart + 1}, (_, i) => S.dayStart + i).map(h => {
              const items = dayList.filter(s => new Date(s.start).getHours() === h);
              return (
                <div key={h} className="hr">
                  <div className="lab num">{String(h).padStart(2,'0')}:00</div>
                  {items.map(s => {
                    const c = byId(db.clients, s.clientId);
                    const canDone = s.status === 'planned' && +new Date(s.start) <= Date.now();
                    return (
                      <div key={s.id} className={cx('ev', (SES_TYPES[s.type] || SES_TYPES.personal).hue, s.status)}
                           style={{display:'flex', alignItems:'center', gap:10}}>
                        <button style={{flex:1, minWidth:0, textAlign:'left'}} onClick={() => setOpen(s)}>
                          <b>{fmtTime(s.start)} · {c ? c.name : '—'}</b>
                          <span>{typeTitle(s.type)} · {money(s.price)} · {payLabel(s)}</span>
                        </button>
                        {canDone && (
                          <button className="go" onClick={() => { Act.complete(s.id, !!s.subId); Toaster.ok(t('ses.done.ok','Проведено') + ' · ' + money(s.price)); }}>
                            <Ic.check size={14}/>{t('ses.done','Проведено')}
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        ) : (
          <div className="rows" style={{marginTop:12}}>
            {dayList.map(s => <SessionRow key={s.id} s={s} onOpen={setOpen} quick/>)}
          </div>
        )}
      </div>

      <button className="fab" onClick={() => nav.go('session.new', {date: cur.toISOString()})} aria-label={t('cal.add')}>
        <Ic.plus size={26}/>
      </button>
      {open && <SessionSheet id={open.id} onClose={() => setOpen(null)}/>}
    </Fragment>
  );
};

/* ─────────── 6. КЛІЄНТИ ─────────── */
const Clients = ({loading}) => {
  const db = useDB();
  const nav = useNav();
  const [q, setQ] = useState('');
  const [sort, setSort] = useState('next');

  const rows = useMemo(() => db.clients.filter(c => !c.archived).map(c => ({c, st: clientStats(db, c.id)})), [db]);
  const found = rows.filter(({c}) => (c.name + ' ' + (c.phone || '') + ' ' + goalTitle(c.goal))
    .toLowerCase().includes(q.trim().toLowerCase()));
  /* «З боргом» і «Без тренування» — це фільтри, а не просто порядок */
  const filtered = found.filter(({st}) =>
    sort === 'debt' ? st.debt > 0
    : sort === 'lapsed' ? (!st.next && (st.lapsedDays === null || st.lapsedDays >= db.settings.lapseDays))
    : true);
  const sorted = [...filtered].sort((a, b) => {
    if (sort === 'name') return a.c.name.localeCompare(b.c.name, 'uk');
    if (sort === 'debt') return b.st.debt - a.st.debt;
    if (sort === 'lapsed') return (b.st.lapsedDays || 9999) - (a.st.lapsedDays || 9999);
    const an = a.st.next ? +new Date(a.st.next.start) : Infinity;
    const bn = b.st.next ? +new Date(b.st.next.start) : Infinity;
    return an - bn;
  });

  if (loading) return <SkScreen/>;

  return (
    <Fragment>
      <div className="appbar">
        <div className="title">{t('nav.clients','Клієнти')} · {db.clients.filter(c => !c.archived).length}</div>
        <button className="iconbtn boxed" onClick={() => nav.go('client.new')} aria-label={t('client.new')}>
          <Ic.plus size={20} style={{color:'var(--accent)'}}/>
        </button>
      </div>

      <div className="screen">
        <div className="search">
          <Ic.search size={18}/>
          <input className="inp" placeholder={t('client.search','Пошук за іменем або телефоном')}
                 value={q} onChange={e => setQ(e.target.value)}/>
        </div>

        <div className="chips" style={{marginTop:10}}>
          {[['next', t('client.sort.next','Найближчі')], ['name', t('client.sort.name','За іменем')],
            ['debt', t('client.sort.debt','З боргом')], ['lapsed', t('client.sort.lapsed','Без тренування')]].map(([v, tx]) => (
            <button key={v} className={cx('chip', sort === v && 'on')} onClick={() => setSort(v)}>{tx}</button>
          ))}
        </div>

        {db.clients.length === 0 ? (
          <Empty icon={<Ic.users size={30}/>} title={t('client.empty','Ще немає клієнтів')}
                 text={t('client.empty.t','Додайте першого клієнта — і зможете планувати тренування та рахувати дохід.')}
                 action={<Btn kind="pri" onClick={() => nav.go('client.new')}><Ic.plus size={18}/>{t('client.new','Новий клієнт')}</Btn>}/>
        ) : sorted.length === 0 && (sort === 'debt' || sort === 'lapsed') ? (
          <Empty icon={<Ic.check size={28}/>}
                 title={sort === 'debt' ? t('client.nodebt','Боргів немає') : t('client.nolapsed','Усі на місці')}
                 text={sort === 'debt' ? t('client.nodebt.t','Усі проведені тренування оплачені.')
                                       : t('client.nolapsed.t','Кожен клієнт або тренувався нещодавно, або вже записаний.')}
                 action={<Btn kind="soft" size="sm" onClick={() => setSort('next')}>{t('client.all','Показати всіх')}</Btn>}/>
        ) : sorted.length === 0 ? (
          <Empty icon={<Ic.search size={28}/>} title={t('client.nofind','Нікого не знайшли')}
                 text={t('client.nofind.t','Перевірте запит або створіть нового клієнта.')}
                 action={<Btn kind="soft" size="sm" onClick={() => nav.go('client.new', {name: q})}>
                           <Ic.plus size={17}/>{t('client.new','Новий клієнт')}</Btn>}/>
        ) : (
          <div className="rows" style={{marginTop:12}}>
            {sorted.map(({c, st}) => (
              <button key={c.id} className="row" onClick={() => nav.go('client', {id: c.id})}>
                <Avatar name={c.name} photo={c.photo} size={46} ring={!!st.sub}/>
                <div style={{flex:1, minWidth:0}}>
                  <div className="nm" style={{display:'flex', alignItems:'center', gap:6}}>
                    <span style={{whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{c.name}</span>
                    {st.debt > 0 && <span className="badge neg">{money(st.debt)}</span>}
                  </div>
                  <div className="ds">
                    {nSessions(st.done)}
                    {st.next ? ' · ' + t('client.next','далі') + ' ' + relDay(st.next.start).toLowerCase() + ', ' + fmtTime(st.next.start)
                             : st.lapsedDays !== null ? ' · ' + nDays(st.lapsedDays) + ' ' + t('lapse.without','без тренувань') : ''}
                  </div>
                </div>
                {st.sub && <span className="badge acc">{st.sub.total - st.sub.used}</span>}
                <Ic.right size={17} className="chev"/>
              </button>
            ))}
          </div>
        )}
      </div>

      <button className="fab" onClick={() => nav.go('client.new')} aria-label={t('client.new')}><Ic.plus size={26}/></button>
    </Fragment>
  );
};

        <div className="card pad" style={{marginTop:9, borderColor:'var(--neg)', display:'flex', gap:12, alignItems:'center'}}>
          <div style={{flex:1}}>
            <b style={{fontSize:14.5, color:'var(--neg)'}}>{t('client.debt.has','Є заборгованість')} · {money(st.debt)}</b>
            <div className="muted" style={{fontSize:12.5, marginTop:2}}>{t('client.debt.t','Неоплачені проведені тренування')}</div>
          </div>

        feed.length === 0 ? (
          <Empty icon={<Ic.clock size={28}/>} title={t('client.hist.empty','Історія порожня')}
                 text={t('client.hist.empty.t','Тут з’являться тренування, покупки й абонементи.')}
                 action={<Btn kind="soft" size="sm" onClick={() => nav.go('session.new', {clientId: c.id})}>

              <button key={i} className="row" onClick={() => it.kind === 'session' && setOpen(it.ref)}>

                             background: it.kind === 'session' ? 'var(--accent-soft)' : it.kind === 'sub' ? 'var(--pos-soft)' : 'var(--surface-2)',
                             color: it.kind === 'session' ? 'var(--accent)' : it.kind === 'sub' ? 'var(--pos)' : 'var(--ink-2)'}}>

                </div>
                <div style={{flex:1, minWidth:0}}>
                  <div className="nm">{it.title}</div>
                  <div className="ds">{fmtDM(it.ts)}{it.kind === 'session' ? ' · ' + fmtTime(it.ts) : ''}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div className="money num" style={{fontSize:14.5,
                       color: it.tag === 'debt' ? 'var(--neg)' : it.tag === 'canceled' ? 'var(--ink-4)' : 'var(--ink)'}}>
                    {it.tag === 'canceled' ? '—' : money(it.amount)}
                  </div>
                  {it.tag === 'debt' && <div style={{fontSize:11, color:'var(--neg)', fontWeight:700}}>{t('pay.debt','Не оплачено')}</div>}
                  {it.tag === 'package' && <div style={{fontSize:11, color:'var(--accent)', fontWeight:700}}>{t('pay.package','З абонемента')}</div>}

        <div style={{marginTop:12}}>
          <div className="card pad">
            <textarea className="inp" style={{minHeight:84}} value={note} onChange={e => setNote(e.target.value)}
                      placeholder={t('note.ph','Напр.: збільшити робочу вагу на наступному тренуванні')}/>
            <Btn kind="pri" wide style={{marginTop:10}} disabled={!note.trim()}
                 onClick={() => { Act.addNote(c.id, note.trim()); setNote(''); Toaster.ok(t('note.added','Нотатку збережено')); }}>

                    <span className="mute3" style={{fontSize:12, fontWeight:700}}>{fmtDM(n.ts)}, {fmtTime(n.ts)}</span>

        <Btn kind="sec" wide onClick={() => nav.go('packages', {clientId: c.id})}><Ic.ticket size={18}/>{t('client.buysub','Оформити абонемент')}</Btn>

              <Btn kind="sec" onClick={() => setDel(false)}>{t('common.cancel','Скасувати')}</Btn>

      {open && <SessionSheet id={open.id} onClose={() => setOpen(null)}/>}

/* ─────────── 8. ДОДАТИ / РЕДАГУВАТИ КЛІЄНТА ─────────── */
const ClientForm = ({params, onClose}) => {
  const db = useDB();
  const nav = useNav();
  const edit = params.id ? byId(db.clients, params.id) : null;
  const [f, setF] = useState({
    name: edit ? edit.name : (params.name || ''),
    phone: edit ? edit.phone : '+380 ',
    goal: edit ? edit.goal : '',
    photo: edit ? edit.photo : '',
    note: edit ? edit.note : '',
    price: edit && edit.price ? String(edit.price) : '',
    birthday: edit ? (edit.birthday || '') : '',
  });
  const [err, setErr] = useState({});
  const set = (k, v) => { setF(x => ({...x, [k]: v})); setErr(x => ({...x, [k]: null})); };

  function photo(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024){ Toaster.bad(t('photo.big','Фото завелике — до 3 МБ')); return; }
    const r = new FileReader();
    r.onload = () => set('photo', r.result);
    r.onerror = () => Toaster.bad(t('photo.err','Не вдалося прочитати фото'));
    r.readAsDataURL(file);
  }

  function save(){
    const e = {};
    if (f.name.trim().length < 2) e.name = t('client.err.name','Вкажіть ім’я');
    setErr(e);
    if (Object.keys(e).length) return;
    const data = {...f, name: f.name.trim(), price: f.price ? +f.price : null};
    if (edit){
      Act.updClient(edit.id, data);
      Toaster.ok(t('client.saved','Зміни збережено'));
      onClose();
    } else {
      const c = Act.addClient(data);
      Toaster.ok(t('client.added','Клієнта додано'));
      onClose();
      if (params.then === 'session') setTimeout(() => nav.go('session.new', {clientId: c.id}), 80);
    }
  }

  return (
    <Page title={edit ? t('client.edit','Редагувати') : t('client.new','Новий клієнт')} onClose={onClose}
          footer={<Btn kind="pri" size="lg" wide onClick={save}>{t('common.save','Зберегти')}</Btn>}>
      <div style={{display:'grid', placeItems:'center', marginTop:6}}>
        <label style={{position:'relative', cursor:'pointer'}}>
          <Avatar name={f.name || '?'} photo={f.photo} size={92}/>
          <div style={{position:'absolute', right:-2, bottom:-2, width:30, height:30, borderRadius:'50%',
                       background:'var(--accent)', color:'#fff', display:'grid', placeItems:'center',
                       border:'3px solid var(--bg)'}}><Ic.plus size={16}/></div>
          <input type="file" accept="image/*" onChange={photo} style={{display:'none'}}/>
        </label>
        {f.photo && <button className="btn ghost sm" style={{color:'var(--ink-3)'}} onClick={() => set('photo','')}>{t('photo.del','Прибрати фото')}</button>}
      </div>

      <Field label={t('client.name','Ім’я')} hint={err.name} bad>
        <Input value={f.name} onChange={e => set('name', e.target.value)} placeholder="Іван Петров" bad={!!err.name} autoFocus={!edit}/>
      </Field>
      <Field label={t('client.phone','Телефон')}>
        <Input value={f.phone} onChange={e => set('phone', phoneMask(e.target.value))} inputMode="tel"/>
      </Field>
      <Field label={t('client.price','Вартість тренування')}
             hint={f.price
               ? t('client.price.fix','Ця сума підставлятиметься в кожне тренування з цим клієнтом')
               : t('client.price.def','Порожньо — береться ціна за замовчуванням, ') + money(db.settings.price)}>
        <Input value={f.price} onChange={e => set('price', e.target.value.replace(/\D/g,''))}
               inputMode="numeric" placeholder={String(db.settings.price)} suffix={db.settings.currency}/>
      </Field>
      <Field label={t('client.bd.full','Дата народження')} hint={t('client.bd.hint','Необов’язково — нагадає привітати')}>
        <Input type="date" value={f.birthday} onChange={e => set('birthday', e.target.value)}/>
      </Field>
      <Field label={t('client.goal','Мета')}>
        <div className="chips">
          {GOALS.map((g, i) => (
            <button key={g} className={cx('chip', f.goal === g && 'on')} onClick={() => set('goal', f.goal === g ? '' : g)}>{goals()[i]}</button>
          ))}
        </div>
      </Field>
      <Field label={t('client.note','Коротка нотатка')}>
        <textarea className="inp" style={{minHeight:80}} value={f.note} onChange={e => set('note', e.target.value)}
                  placeholder={t('client.note.ph','Напр.: травма коліна, працює до 19:00')}/>
      </Field>
    </Page>
  );
};

/* ─────────── повідомлення клієнту (борг / повернення) ─────────── */
const Remind = ({params, onClose}) => {
  const db = useDB();
  const c = byId(db.clients, params.clientId);
  const st = c ? clientStats(db, c.id) : null;
  const name = c ? c.name.split(' ')[0] : '';
  const next = st && st.next ? st.next : null;
  /* тексти лежать у словнику з підстановками — інакше вони б не перекладались */
  const tpl = (params.kind === 'tomorrow' && next
    ? [
        t('msg.next.1', '{name}, привіт! Нагадую про тренування {when} о {time}. Буду чекати!'),
        t('msg.next.2', '{name}, доброго дня! Підтвердіть, будь ласка, тренування {when} о {time}.'),
      ]
    : params.kind === 'lapsed'
    ? [
        t('msg.lapsed.1', '{name}, привіт! Давно вас не було в залі — усе гаразд? Є вільні місця на цьому тижні, можу поставити ваш звичний час.'),
        t('msg.lapsed.2', '{name}, доброго дня! Пропоную повернутись до тренувань — почнемо з легкого відновлювального. Коли зручно?'),
      ]
    : [
        t('msg.debt.1', '{name}, доброго дня! Нагадую про оплату за тренування — {sum}. Дякую!'),
        t('msg.debt.2', '{name}, привіт! Підкажіть, коли зручно закрити оплату за минулі тренування ({sum})?'),
      ]
  ).map(x => fill(x, {name,
    when: next ? relDay(next.start).toLowerCase() : '',
    time: next ? fmtTime(next.start) : '',
    sum: money(params.sum || (st ? st.debt : 0))}));
  const [text, setText] = useState(tpl[0]);
  if (!c) return <Page title="—" onClose={onClose}><ErrorBox title={t('client.gone','Клієнта не знайдено')}/></Page>;

  return (
    <Page title={t('remind.title','Повідомлення')} sub={c.name} onClose={onClose}
          footer={
            <div className="stack">
              <a className="btn pri wide" href={smsHref(c.phone, text)}><Ic.msg size={18}/>{t('remind.sms','Надіслати SMS')}</a>
              <div className="grid2">
                <a className="btn sec" href={telHref(c.phone)}><Ic.phone size={18}/>{t('remind.call','Подзвонити')}</a>
                <Btn kind="sec" onClick={() => {
                  navigator.clipboard && navigator.clipboard.writeText(text);
                  Toaster.ok(t('remind.copied','Текст скопійовано'));
                }}><Ic.copy size={18}/>{t('remind.copy','Копіювати')}</Btn>
              </div>
            </div>}>
      <div className="card pad" style={{marginTop:4, display:'flex', gap:12, alignItems:'center'}}>
        <Avatar name={c.name} photo={c.photo} size={46}/>
        <div style={{flex:1, minWidth:0}}>
          <b style={{fontSize:15}}>{c.name}</b>
          <div className="muted num" style={{fontSize:13}}>{c.phone || t('remind.nophone','Номер не вказано')}</div>
        </div>
        {st && st.debt > 0 && <span className="badge neg">{money(st.debt)}</span>}
      </div>

      <Field label={t('remind.tpl','Шаблон')}>
        <div className="stack">
          {tpl.map((x, i) => (
            <button key={i} className={cx('card pad press')} style={{textAlign:'left', fontSize:13.5, lineHeight:1.5,
                    borderColor: text === x ? 'var(--accent)' : 'var(--line)'}} onClick={() => setText(x)}>{x}</button>
          ))}
        </div>
      </Field>
      <Field label={t('remind.text','Текст повідомлення')}>
        <textarea className="inp" value={text} onChange={e => setText(e.target.value)}/>
      </Field>
    </Page>
  );
};

/* ─────────── борги (повний список) ─────────── */
const Debts = ({onClose}) => {
  const db = useDB();
  const nav = useNav();
  const items = useMemo(() => {
    const m = new Map();
    db.sessions.filter(isDebt).forEach(s => {
      const cur = m.get(s.clientId) || {clientId: s.clientId, sum:0, n:0, oldest: s.start, list:[]};
      cur.sum += s.price; cur.n++; cur.list.push(s);
      if (+new Date(s.start) < +new Date(cur.oldest)) cur.oldest = s.start;
      m.set(s.clientId, cur);
    });
    return [...m.values()].sort((a, b) => b.sum - a.sum);
  }, [db.sessions]);
  const total = sum(items, x => x.sum);

  return (
    <Page title={t('menu.debts','Борги')} onClose={onClose}>
      {items.length === 0 ? (
        <Empty icon={<Ic.check size={30}/>} title={t('debts.none','Боргів немає')}
               text={t('debts.none.t','Усі проведені тренування оплачені. Так тримати.')}/>
      ) : (
        <Fragment>
          <div className="card pad" style={{marginTop:4}}>
            <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('debts.total','Загалом винні')}</div>
            <div className="dsp num" style={{fontSize:28, fontWeight:800, color:'var(--neg)'}}>{money(total)}</div>
            <div className="muted" style={{fontSize:12.5}}>{nClients(items.length)} · {nSessions(sum(items, x => x.n))}</div>
          </div>
          <div className="stack" style={{marginTop:12}}>
            {items.map(d => {
              const c = byId(db.clients, d.clientId);
              if (!c) return null;
              return (
                <div key={d.clientId} className="card pad">
                  <div style={{display:'flex', gap:12, alignItems:'center'}}>
                    <Avatar name={c.name} photo={c.photo} size={44}/>
                    <div style={{flex:1, minWidth:0}}>
                      <b style={{fontSize:15}}>{c.name}</b>
                      <div className="muted" style={{fontSize:12.5}}>
                        {nSessions(d.n)} · {t('debt.from','з')} {fmtDM(d.oldest)}
                      </div>
                    </div>
                    <div className="money num" style={{fontSize:17, color:'var(--neg)'}}>{money(d.sum)}</div>
                  </div>
                  <div className="grid2" style={{marginTop:10}}>
                    <Btn kind="soft" size="sm" onClick={() => nav.go('remind', {clientId: c.id, sum: d.sum})}>
                      <Ic.msg size={16}/>{t('debt.remind','Нагадати')}
                    </Btn>
                    <Btn kind="pri" size="sm" onClick={() => {
                      d.list.forEach(s => Act.pay(s.id));
                      Toaster.ok(t('debt.closed','Борг закрито'));
                    }}><Ic.check size={16}/>{t('debt.pay','Оплачено')}</Btn>
                  </div>
                </div>
              );
            })}
          </div>
        </Fragment>
      )}
    </Page>
  );
};

/* ─────────── кому час написати (повний список) ─────────── */
const Lapsed = ({onClose}) => {
  const db = useDB();
  const nav = useNav();
  const S = db.settings;
  const items = useMemo(() => db.clients.filter(c => !c.archived).map(c => ({c, st: clientStats(db, c.id)}))
    .filter(x => x.st.lapsedDays !== null && x.st.lapsedDays >= S.lapseDays && !x.st.next)
    .sort((a, b) => b.st.lapsedDays - a.st.lapsedDays), [db]);

  return (
    <Page title={t('home.lapsed','Кому час написати')} sub={t('lapse.sub','Не тренувались понад') + ' ' + nDays(S.lapseDays)} onClose={onClose}>
      {items.length === 0 ? (
        <Empty icon={<Ic.fire size={30}/>} title={t('lapse.none','Усі на місці')}
               text={t('lapse.none.t','Ніхто не зник з поля зору — у всіх активних клієнтів є свіжі тренування або запис наперед.')}/>
      ) : (
        <div className="stack" style={{marginTop:4}}>
          {items.map(({c, st}) => <LapsedCard key={c.id} c={c} days={st.lapsedDays} last={st.last}/>)}
        </div>
      )}
    </Page>
  );
};

  if (loading) return <SkScreen/>;

  const [mFrom, mTo] = periodRange('month', new Date());
  const st = stats(db, mFrom, mTo);
  const lowStock = db.products.filter(p => p.stock > 0 && p.stock <= 2).length;
  const outStock = db.products.filter(p => p.stock === 0).length;
  const activeSubs = db.subs.filter(s => s.used < s.total);

  return (
    <Fragment>
      <div className="appbar">
        <div className="title">{t('nav.sales','Продажі')}</div>
        <button className="iconbtn boxed" onClick={() => nav.go(tab === 'goods' ? 'product.new' : 'package.new')}
                aria-label={t('common.add')}><Ic.plus size={20} style={{color:'var(--accent)'}}/></button>
      </div>

      <div className="screen">
        {/* підсумок місяця */}
        <div className="card pad">
          <div className="between">
            <div>
              <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('sales.month','Продажі за')} {fmtMonth(new Date()).toLowerCase()}</div>
              <div className="dsp num" style={{fontSize:26, fontWeight:800, marginTop:2}}>{money(st.salesRevenue)}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div className="muted" style={{fontSize:12.5, fontWeight:700}}>{t('sales.profit','Прибуток')}</div>
              <div className="money num" style={{fontSize:18, color:'var(--pos)'}}>{money(st.salesProfit)}</div>
            </div>
          </div>
          <div className="muted" style={{fontSize:12.5, marginTop:6}}>
            {t('sales.units','Продано одиниць')}: {st.salesCount}
          </div>
        </div>

        <Tabs value={tab} onChange={setTab}
              items={[{v:'goods', t:t('sales.goods','Товари')}, {v:'subs', t:t('sales.subs','Абонементи')}]}/>

        {tab === 'goods' ? (
          <Fragment>
            {(lowStock > 0 || outStock > 0) && (
              <div className="card pad" style={{marginTop:12, display:'flex', gap:10, alignItems:'center',
                   background:'var(--warn-soft)', borderColor:'transparent'}}>
                <Ic.warn size={20} style={{color:'var(--warn)'}}/>
                <div style={{flex:1, fontSize:13, fontWeight:700, color:'var(--warn)'}}>
