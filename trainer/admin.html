<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PRO Trainer — админка</title>
<meta name="theme-color" content="#08080B">
<!--
  Страница только для владельца. Отдельный файл, а не экран приложения:
  тренерам она не нужна и на их устройствах ей делать нечего.

  Пароль живёт в sessionStorage — закрыл вкладку, и его нет. В
  localStorage он пережил бы закрытый ноутбук в кафе.

  Ни одной внешней ссылки: всё внутри файла. Так же, как в приложении.
-->
<style>
  :root{
    --bg:#08080B; --surface:#15151C; --surface-2:#1C1C25; --line:#23232C;
    --ink:#F5F5F8; --ink-2:#9E9EAF; --ink-3:#71717F;
    --accent:#6B4DFF; --accent-soft:rgba(107,77,255,.16);
    --pos:#12B76A; --warn:#F79009; --neg:#F04438;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  html,body{background:var(--bg);color:var(--ink);min-height:100%}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 70px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-size:19px}
  .brand b{font-size:17px;letter-spacing:-.02em}
  .brand span{display:block;font-size:11px;color:var(--ink-3)}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;
       padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
  .btn.pri{background:var(--accent);border-color:transparent}
  .btn:disabled{opacity:.5;cursor:default}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
  @media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi .lbl{font-size:12px;color:var(--ink-3)}
  .kpi .val{font-size:29px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .kpi .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
  .val.acc{color:#a08cff}.val.pos{color:var(--pos)}.val.warn{color:var(--warn)}
  h2{font-size:14px;font-weight:700;margin:26px 0 10px;color:var(--ink-2)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .tag.pay{background:rgba(18,183,106,.15);color:var(--pos)}
  .tag.try{background:var(--accent-soft);color:#a08cff}
  .tag.gift{background:rgba(247,144,9,.15);color:var(--warn)}
  .tag.off{background:var(--surface-2);color:var(--ink-3)}
  .bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
  .bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
  .bars i.zero{background:var(--surface-2)}
  .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:6px}
  .funnel div{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .funnel .bar{height:26px;background:var(--accent);border-radius:7px;min-width:3px}
  .funnel .nm{width:190px;font-size:13px;color:var(--ink-2);flex:none}
  .funnel .n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .gate{min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  .gate input{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;
              padding:13px 15px;font-size:15px;width:min(320px,80vw);outline:none}
  .gate input:focus{border-color:var(--accent)}
  .err{color:var(--neg);font-size:13px;min-height:18px}
  .muted{color:var(--ink-3);font-size:13px;line-height:1.5;max-width:460px}
  .people{display:flex;flex-direction:column;gap:10px}
  .prow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px}
  .pmain{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
  .pmain b{font-size:14px;font-weight:650;word-break:break-all;line-height:1.35}
  .pfacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
  @media(min-width:560px){.pfacts{grid-template-columns:repeat(6,1fr)}}
  .pfacts span{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
  .pfacts b{display:block;font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
  /* Переписка. Она не «ещё одна таблица», а работа: сюда приходят
     вопросы, и на них надо отвечать. Поэтому непрочитанное видно
     издалека, а сама ветка читается как переписка, а не как журнал. */
  .thr{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
       background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;
       margin-bottom:8px;color:var(--ink)}
  .thr.new{border-color:var(--accent)}
  .thr .who{flex:1;min-width:0}
  .thr .who b{display:block;font-size:13.5px;font-weight:650;word-break:break-all}
  .thr .who span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thr .when{flex:none;font-size:11.5px;color:var(--ink-3);text-align:right}
  .dot{display:inline-block;min-width:19px;height:19px;border-radius:999px;background:var(--accent);
       color:#fff;font-size:11px;font-weight:800;line-height:19px;text-align:center;padding:0 5px}
  .talk{display:flex;flex-direction:column;gap:9px;margin:14px 0}
  .bub{max-width:82%;padding:10px 13px;border-radius:15px;font-size:14px;line-height:1.45;
       white-space:pre-wrap;word-break:break-word}
  .bub.t{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px}
  .bub.s{align-self:flex-end;background:var(--accent);border-bottom-right-radius:5px}
  .bub .at{display:block;font-size:10.5px;opacity:.6;margin-top:5px}
  .say{display:flex;gap:9px;align-items:flex-end}
  .say textarea{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink);
                border-radius:14px;padding:12px 14px;font-size:14.5px;outline:none;resize:none;min-height:46px}
  .say textarea:focus{border-color:var(--accent)}
  .note{background:rgba(247,144,9,.12);border:1px solid rgba(247,144,9,.3);color:#ffcd85;
        border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script>
var KEY = 'protrainer.admin';
var root = document.getElementById('root');
var pass = sessionStorage.getItem(KEY) || '';

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* гривня и без копеек: счёт выставляется целыми, дробей тут не бывает */
function money(n){ return (n < 0 ? '−' : '') + Math.round(Math.abs(n)) + ' \u20b4'; }
var MONTHS = ['января','февраля','марта','апреля','мая','июня',
              'июля','августа','сентября','октября','ноября','декабря'];
function monthName(k){
  var p = String(k).split('-');
  return MONTHS[+p[1] - 1] ? MONTHS[+p[1] - 1] + ' ' + p[0] : k;
}
var PLAN_NAME = {monthly: 'месяц', quarterly: '3 месяца', yearly: 'год'};
function planName(x){ return esc(PLAN_NAME[x.plan] || x.plan || '—'); }
function fact(k, v){ return '<div><span>' + k + '</span><b>' + v + '</b></div>'; }
function ago(ts, now){
  if (!ts) return '—';
  var d = Math.floor((now - ts) / 86400000);
  return d <= 0 ? 'сегодня' : d === 1 ? 'вчера' : d + ' дн.';
}

function gate(msg){
  root.innerHTML =
    '<div class="gate">' +
      '<div class="brand"><div class="mark">🏋️</div><div><b>PRO Trainer</b><span>админка</span></div></div>' +
      '<input id="p" type="password" placeholder="Пароль" autofocus>' +
      '<button class="btn pri" id="go">Войти</button>' +
      '<div class="err">' + esc(msg || '') + '</div>' +
    '</div>';
  var inp = document.getElementById('p');
  var go = function(){
    pass = inp.value.trim();
    if (!pass) return;
    sessionStorage.setItem(KEY, pass);
    load();
  };
  document.getElementById('go').onclick = go;
  inp.onkeydown = function(e){ if (e.key === 'Enter') go(); };
}

/* Один вход на сервер для всей страницы: пароль подставляется в одном
   месте, и ответы «не тот пароль» разбираются тоже в одном. */
async function api(qs, opts){
  var o = opts || {};
  return fetch('/api/admin' + (qs || ''), {
    method: o.method || 'GET',
    headers: Object.assign({authorization: 'Bearer ' + pass},
                           o.body ? {'content-type': 'application/json'} : {}),
    body: o.body ? JSON.stringify(o.body) : undefined,
  });
}

async function load(){
  root.innerHTML = '<div class="gate"><div class="muted">Считаю…</div></div>';
  var r, t;
  try {
    r = await api('');
    t = await api('?chat=1');
  } catch (e){
    return gate('Нет связи с сервером');
  }
  if (r.status === 401){ sessionStorage.removeItem(KEY); return gate('Пароль не подходит'); }
  if (r.status === 429) return gate('Слишком много попыток. Подождите четверть часа');
  if (r.status === 503) return gate('ADMIN_PASS не задан в переменных Vercel');
  var d = await r.json().catch(function(){ return null; });
  if (!d || !d.ok) return gate('Сервер ответил непонятно');
  var th = await t.json().catch(function(){ return null; });
  draw(d, (th && th.threads) || []);
}

function bars(series){
  var max = Math.max.apply(null, series.map(function(s){ return s.joined; }).concat([1]));
  return '<div class="bars">' + series.map(function(s){
    return '<i class="' + (s.joined ? '' : 'zero') + '" style="height:' +
           Math.max(2, Math.round(s.joined / max * 118)) + 'px" title="' + s.day + ': ' + s.joined + '"></i>';
  }).join('') + '</div><div class="axis"><span>' + series[0].day + '</span><span>' +
  series[series.length - 1].day + '</span></div>';
}

function funnel(f){
  var rows = [
    ['Завели кабинет', f.joined],
    ['Начали работать', f.works],
    ['Пробный закончился', f.finished],
    ['Оплатили', f.bought],
  ];
  var max = Math.max(f.joined, 1);
  return '<div class="funnel">' + rows.map(function(r){
    var part = max ? Math.round(r[1] / max * 100) : 0;
    return '<div><span class="nm">' + r[0] + '</span>' +
           '<span class="bar" style="width:' + Math.max(3, part * 2.4) + 'px"></span>' +
           '<span class="n">' + r[1] + (r[1] && max ? ' · ' + part + '%' : '') + '</span></div>';
  }).join('') + '</div>';
}

function who(p){
  if (p.paid) return '<span class="tag pay">платит</span>';
  if (p.granted) return '<span class="tag gift">выдана</span>';
  if (p.trial) return '<span class="tag try">пробный</span>';
  return '<span class="tag off">ушёл</span>';
}

function when(ts, now){
  if (!ts) return '';
  var min = Math.floor((now - ts) / 60000);
  if (min < 1) return 'только что';
  if (min < 60) return min + ' мин.';
  if (min < 24 * 60) return Math.floor(min / 60) + ' ч.';
  return new Date(ts).toISOString().slice(5, 10).split('-').reverse().join('.');
}

function threads(list, now){
  var wait = list.filter(function(t){ return t.unread; }).length;
  var html = '<h2>Переписка' + (wait ? ' · ждут ответа: ' + wait : '') + '</h2>';
  if (!list.length)
    return html + '<div class="card"><div class="muted">Пока никто не писал. ' +
      'Экран «Поддержка» есть у каждого тренера в настройках, и его сообщение ' +
      'придёт сюда и в Telegram.</div></div>';
  return html + list.map(function(t){
    return '<button class="thr' + (t.unread ? ' new' : '') + '" onclick="openChat(\'' +
      esc(t.login).replace(/'/g, "\\'") + '\')">' +
      '<div class="who"><b>' + esc(t.login) + '</b>' +
        '<span>' + (t.who === 's' ? 'вы: ' : '') + esc(t.text) + '</span></div>' +
      '<div class="when">' + when(t.at, now) +
        (t.unread ? '<div style="margin-top:5px"><span class="dot">' + t.unread + '</span></div>' : '') +
      '</div></button>';
  }).join('');
}

/* Ветка целиком. Открыли — значит прочитали: сервер гасит счётчик сам,
   иначе «новое» висело бы после того, как ответ уже отправлен. */
async function openChat(login){
  root.innerHTML = '<div class="gate"><div class="muted">Открываю…</div></div>';
  var r = await api('?chat=' + encodeURIComponent(login));
  var d = await r.json().catch(function(){ return null; });
  if (!d || !d.ok) return load();
  var now = Date.now();
  root.innerHTML =
    '<div class="top"><div class="brand"><div class="mark">🏋️</div>' +
      '<div><b>' + esc(d.login) + '</b><span>переписка</span></div></div>' +
      '<div><button class="btn" onclick="openChat(\'' + esc(d.login).replace(/'/g, "\\'") +
      '\')">Обновить</button> <button class="btn" onclick="load()">Назад</button></div></div>' +
    '<div class="talk">' + d.msgs.map(function(m){
      return '<div class="bub ' + (m.who === 's' ? 's' : 't') + '">' + esc(m.text) +
        '<span class="at">' + when(m.at, now) + '</span></div>';
    }).join('') + '</div>' +
    '<div class="say"><textarea id="say" rows="2" placeholder="Ответ тренеру"></textarea>' +
    '<button class="btn pri" id="send">Отправить</button></div>' +
    '<p class="muted" style="margin-top:12px">Отвечать можно и из Telegram — ' +
    'просто ответьте на сообщение бота.</p>';

  var box = document.getElementById('say');
  var send = async function(){
    var text = box.value.trim();
    if (!text) return;
    document.getElementById('send').disabled = true;
    var r = await api('', {method: 'POST', body: {reply: d.login, text: text}});
    if (r.ok) openChat(d.login);
    else { document.getElementById('send').disabled = false; alert('Не отправилось'); }
  };
  document.getElementById('send').onclick = send;
  /* Enter отправляет, Shift+Enter — перевод строки: так же, как в любом
     мессенджере, откуда сюда и приходят. */
  box.onkeydown = function(e){ if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
  box.focus();
}

function draw(d, chats){
  var kb = function(n){ return n ? (n / 1024).toFixed(0) + ' КБ' : '—'; };
  var html = '';

  html += '<div class="top"><div class="brand"><div class="mark">🏋️</div>' +
    '<div><b>PRO Trainer</b><span>админка</span></div></div>' +
    '<div><button class="btn" onclick="load()">Обновить</button> ' +
    '<button class="btn" onclick="sessionStorage.removeItem(\'' + KEY + '\');location.reload()">Выйти</button></div></div>';

  if (d.storage !== 'kv')
    html += '<div class="note">Хранилище — память процесса, а не KV. Числа ничего не значат: ' +
            'записи не переживают перезапуск функции. Проверьте /api/health.</div>';

  html += '<div class="kpis">' +
    '<div class="card kpi"><div class="lbl">Кабинетов</div><div class="val">' + d.count.all + '</div>' +
      '<div class="sub">' + d.count.idle + ' ни разу не сохранили</div></div>' +
    '<div class="card kpi"><div class="lbl">Работают</div><div class="val acc">' + d.count.works + '</div>' +
      '<div class="sub">за неделю — ' + d.count.week + '</div></div>' +
    '<div class="card kpi"><div class="lbl">Платят</div><div class="val pos">' + d.count.paid + '</div>' +
      '<div class="sub">выдано вручную — ' + d.count.granted + '</div></div>' +
    '<div class="card kpi"><div class="lbl">За 30 дней</div><div class="val">' + money(d.money.uah30) + '</div>' +
      '<div class="sub">в месяц ожидается ' + money(d.money.mrr) + '</div></div>' +
  '</div>';

  /* Переписка стоит выше цифр намеренно: цифры подождут, человек с
     вопросом — нет. */
  html += threads(chats || [], d.now);

  html += '<h2>Регистрации по дням</h2><div class="card">' + bars(d.series) + '</div>';
  html += '<h2>Путь тренера</h2><div class="card">' + funnel(d.funnel) +
    '<div class="muted" style="margin-top:10px">«Оплатили» считается только среди тех, у кого пробный уже ' +
    'закончился — иначе цифра занижалась бы каждым новым тренером.</div></div>';

  var langs = Object.keys(d.langs).sort(function(a, b){ return d.langs[b] - d.langs[a]; });
  if (langs.length)
    html += '<h2>Языки</h2><div class="card"><div class="funnel">' + langs.map(function(k){
      return '<div><span class="nm">' + k + '</span><span class="bar" style="width:' +
             Math.max(3, Math.round(d.langs[k] / d.count.all * 240)) + 'px"></span>' +
             '<span class="n">' + d.langs[k] + '</span></div>';
    }).join('') + '</div></div>';

  /* На телефоне широкая таблица прячет самое интересное за правым краем:
     видно почту и дату, а «база», «статус» и «до» уже нет. Поэтому там —
     карточки, и всё про тренера читается сразу. */
  html += '<h2>Тренеры (' + d.people.length + ')</h2><div class="people">' +
    d.people.map(function(p){
      return '<div class="prow">' +
        '<div class="pmain"><b>' + esc(p.login) + '</b>' + who(p) + '</div>' +
        '<div class="pfacts">' +
          fact('завёл', esc(p.since)) +
          fact('был', ago(p.seenAt, d.now)) +
          fact('база', kb(p.size)) +
          fact(p.paid || p.granted ? 'до' : 'пробный до', esc(p.until || p.trialEnds || '—')) +
          fact('устройств', p.devices || '—') +
          fact('язык', esc(p.lang || '—')) +
        '</div></div>';
    }).join('') + '</div>';

  var m = d.money;
  html += '<h2>Продажи</h2>';
  if (!m.pays && !m.backs){
    html += '<div class="card"><div class="muted">Ни одной оплаты.' +
      (d.pay === false
        ? ' И пока не может быть: боевые ключи LiqPay не подключены, кнопка оплаты не работает.'
        : ' Оплата подключена и работает — значит, просто ещё никто не платил.') +
      ' Журнал ведётся с того дня, как появился, — прежние оплаты в него не попадут.</div></div>';
  } else {
    html += '<div class="kpis">' +
      '<div class="card kpi"><div class="lbl">Оплат</div><div class="val">' + m.pays + '</div>' +
        '<div class="sub">плательщиков — ' + m.payers + '</div></div>' +
      '<div class="card kpi"><div class="lbl">Выручка</div><div class="val pos">' + money(m.uahAll) + '</div>' +
        '<div class="sub">средний чек ' + money(m.avg) + '</div></div>' +
      '<div class="card kpi"><div class="lbl">Возвраты</div><div class="val' + (m.backs ? ' warn' : '') + '">' +
        m.backs + '</div><div class="sub">' + money(m.backUah) + '</div></div>' +
      '<div class="card kpi"><div class="lbl">Считаем с</div><div class="val" style="font-size:20px">' +
        esc(m.since || '—') + '</div><div class="sub">раньше не записывалось</div></div>' +
    '</div>';

    html += '<h2>По месяцам</h2><div class="card scroll"><table>' +
      '<tr><th>Месяц</th><th>Оплат</th><th>Плательщиков</th><th>Возвратов</th><th>Выручка</th></tr>' +
      m.byMonth.map(function(x){
        return '<tr><td>' + esc(monthName(x.month)) + '</td>' +
          '<td class="num">' + x.pays + '</td><td class="num">' + x.payers + '</td>' +
          '<td class="num">' + (x.backs || '') + '</td>' +
          '<td class="num">' + money(x.uah) + '</td></tr>';
      }).join('') + '</table></div>';

    if (m.byPlan.length)
      html += '<h2>По тарифам</h2><div class="card scroll"><table>' +
        '<tr><th>Тариф</th><th>Цена</th><th>Оплат</th><th>Выручка</th></tr>' +
        m.byPlan.map(function(x){
          return '<tr><td>' + planName(x) + '</td><td class="num">' + money(x.price) + '</td>' +
            '<td class="num">' + x.pays + '</td><td class="num">' + money(x.uah) + '</td></tr>';
        }).join('') + '</table></div>';

    html += '<h2>По дням</h2><div class="card scroll"><table>' +
      '<tr><th>День</th><th>Оплат</th><th>Возвратов</th><th>Выручка</th></tr>' +
      m.byDay.map(function(x){
        return '<tr><td>' + esc(x.day) + '</td><td class="num">' + x.pays + '</td>' +
          '<td class="num">' + (x.backs || '') + '</td>' +
          '<td class="num">' + money(x.uah) + '</td></tr>';
      }).join('') + '</table>' +
      '<div class="muted" style="margin-top:10px">Дни без движения не показываем — пустая строка ' +
      'ничего не говорит. Возвраты идут со знаком минус в той же выручке.</div></div>';

    html += '<h2>Каждый платёж</h2><div class="card scroll"><table>' +
      '<tr><th>Когда</th><th>Почта</th><th>Тариф</th><th>Сумма</th></tr>' +
      m.last.map(function(p){
        return '<tr><td>' + new Date(p.ts).toISOString().slice(0, 16).replace('T', ' ') + '</td>' +
          '<td>' + esc(p.login) + '</td><td>' + planName({plan: p.plan}) + '</td>' +
          '<td class="num">' + money(p.uah) + '</td></tr>';
      }).join('') + '</table></div>';
  }

  root.innerHTML = html;
}

if (pass) load(); else gate('');
</script>
</body>
</html>
