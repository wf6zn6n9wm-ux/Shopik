<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#FAFAFC" id="metaTheme" />
<meta name="description" content="PRO MASSAGE — рабочий кабинет массажиста: расписание, клиенты, карта тела, заметки, абонементы и доход." />
<title>PRO MASSAGE — кабинет массажиста</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- версию фиксируем: без неё CDN однажды отдаст следующий мажор,
     и приложение перестанет компилироваться без единой нашей правки -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ==================================================================
     PRO MASSAGE · DESIGN SYSTEM (v1)
     ------------------------------------------------------------------
     Рабочее пространство массажиста. Открыл между двумя клиентами — за
     две секунды видно: кто следующий, когда, что сделать, сколько
     заработано.

     ТЕМА     Светлая — основная: белый лист, мягкие карточки, тонкие
              линии. Тёмная — свой набор значений (фиолетовый графит),
              а не инверсия светлой.
     АКЦЕНТ   Violet #5B3FD3 → #7448E8. Градиент только на главном
              действии: hero-карточка и кнопка «+».
     ПАСТЕЛЬ  Категории живут мягкими фонами, не заливками.
     ТИПО     Inter. Числа — tabular-nums, SemiBold.
     РАДИУСЫ  10 / 14 / 18 / 22 / 28 / 999
     СЕТКА    4pt, поля экрана 20, карточки 16–20
     ДВИЖЕНИЕ transform/opacity, ease-out, 140–320ms
     ТАЧ      минимум 44×44, основные действия — большим пальцем снизу
     ================================================================== -->
<style>
  :root{
    /* ── бренд: одинаков в обеих темах ── */
    --violet:#5B3FD3; --violet-2:#7448E8; --violet-3:#4A31B8;
    --grad:linear-gradient(135deg,#5B3FD3 0%,#7448E8 100%);

    /* ── карта тела: от «всё хорошо» к «сильное напряжение» ── */
    --t0:#C9C9D4; --t1:#3EBF8F; --t2:#EFC44B; --t3:#F2994A; --t4:#E5595B;

    /* ── геометрия ── */
    --r-xs:10px; --r-sm:14px; --r-md:18px; --r-lg:22px; --r-xl:28px; --r-pill:999px;
    --tab-h:64px; --pad:20px; --shell:430px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --ease:cubic-bezier(.16,1,.3,1);
    --fast:.14s var(--ease); --mid:.22s var(--ease); --slow:.32s var(--ease);
  }

  /* ── СВЕТЛАЯ (основная) ── */
  :root, html[data-theme="light"]{
    --bg:#FAFAFC; --bg-2:#F2F2F7;
    --card:#FFFFFF; --card-2:#F7F7FA; --card-3:#F0F0F5;
    --ink:#17171C; --ink-2:#858592; --ink-3:#AFAFBA; --ink-4:#C9C9D2;
    --line:#EEEEF3; --line-2:#E3E3EA;
    --violet-soft:#F0ECFE; --violet-soft-2:#E4DCFC; --violet-ink:#5B3FD3;
    --pa-clients:#F4E8FF; --pa-schedule:#FFF0E5; --pa-income:#FFF3DF; --pa-analytics:#EAF0FF;
    --pa-clients-ink:#8B4FD6; --pa-schedule-ink:#E1793A; --pa-income-ink:#D9962A; --pa-analytics-ink:#4A6FD4;
    --pos:#22A06B; --neg:#DB4F4F; --pos-soft:#E7F6EF; --neg-soft:#FDECEC;
    --shadow:0 1px 2px rgba(23,23,28,.04), 0 6px 20px rgba(23,23,28,.05);
    --shadow-sm:0 1px 3px rgba(23,23,28,.05);
    --shadow-lg:0 20px 48px rgba(23,23,28,.14);
    --shadow-violet:0 8px 24px rgba(91,63,211,.28);
    --scrim:rgba(23,23,28,.38);
    --skin:#F0E2DA;
  }

  /* ── ТЁМНАЯ ── */
  /* Не инверсия: фон — тёплый фиолетовый графит, карточки чуть светлее
     фона (в темноте «поднимает» свет, а не рамка), пастель приглушена до
     тонированных подложек, акцент осветлён — на тёмном #5B3FD3 глохнет. */
  html[data-theme="dark"]{
    --bg:#0F0E15; --bg-2:#15141D;
    --card:#1A1924; --card-2:#22212D; --card-3:#2A2937;
    --ink:#F4F4F7; --ink-2:#9E9EAE; --ink-3:#75758A; --ink-4:#55556A;
    --line:#262532; --line-2:#32313F;
    --violet:#8465F0; --violet-2:#9B7CFF; --violet-3:#6D4EDB;
    --grad:linear-gradient(135deg,#5B3FD3 0%,#8465F0 100%);
    --violet-soft:#241F3D; --violet-soft-2:#2E2750; --violet-ink:#A98CFF;
    --pa-clients:#2A2140; --pa-schedule:#33261E; --pa-income:#332B1B; --pa-analytics:#1E2438;
    --pa-clients-ink:#C79BFF; --pa-schedule-ink:#FFA96B; --pa-income-ink:#F5C462; --pa-analytics-ink:#8FAEFF;
    --pos:#3ECF95; --neg:#F27272; --pos-soft:#163025; --neg-soft:#331E1E;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
    --shadow-sm:0 1px 3px rgba(0,0,0,.4);
    --shadow-lg:0 24px 56px rgba(0,0,0,.6);
    --shadow-violet:0 8px 24px rgba(91,63,211,.45);
    --scrim:rgba(6,5,10,.7);
    --skin:#3A3346;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg-2); color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    transition:background var(--mid), color var(--mid);
  }
  h1,h2,h3,h4,p{margin:0}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer; background:none; border:0; padding:0; text-align:left}
  a{color:inherit; text-decoration:none}
  ::selection{background:var(--violet-soft-2)}
  .num{font-variant-numeric:tabular-nums; font-weight:600}
  .cut{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cut2{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  *{scrollbar-width:none}
  *::-webkit-scrollbar{width:0; height:0}

  /* ══ ОБОЛОЧКА ══════════════════════════════════════════════════════
     Телефон — основной носитель. Страницу листает сам документ, а не
     внутренний контейнер: иначе на телефоне адресная строка съедает
     высоту, и нижняя панель уезжает вместе с содержимым.
     Всё, что должно оставаться на экране (навигация, «+», шторки,
     тост), прибито к окну и повторяет ширину колонки. */
  #root{
    max-width:var(--shell); margin-inline:auto; min-height:100vh; min-height:100dvh;
    position:relative; background:var(--bg);
  }
  @media (min-width:900px){
    body{background:var(--bg-2)}
    #root{border-left:1px solid var(--line); border-right:1px solid var(--line)}
  }
  .app{min-height:100vh; min-height:100dvh}
  .scroll{padding:0 var(--pad) calc(var(--tab-h) + 40px + var(--safe-bottom))}

  /* ── шапки ── */
  .top{padding:calc(var(--safe-top) + 14px) 0 6px; display:flex; align-items:flex-start; gap:12px}
  .top-title{font-size:26px; font-weight:700; letter-spacing:-.02em; line-height:1.2}
  .hi{font-size:15px; color:var(--ink-2); font-weight:500}
  .hi-name{font-size:26px; font-weight:700; letter-spacing:-.02em; margin-top:1px}
  .top-bar{
    position:sticky; top:0; z-index:30; background:var(--bg);
    padding:calc(var(--safe-top) + 12px) var(--pad) 12px; margin:0 calc(var(--pad) * -1) 4px;
    display:flex; align-items:center; gap:10px; min-height:56px;
    transition:box-shadow var(--fast), border-color var(--fast);
  }
  .top-bar.stuck{border-bottom:1px solid var(--line)}
  .top-bar h2{font-size:19px; font-weight:600; letter-spacing:-.01em; flex:1; text-align:center}
  .top-bar.left h2{text-align:left}
  .ico-btn{
    width:40px; height:40px; border-radius:var(--r-pill); display:grid; place-items:center;
    color:var(--ink); flex:0 0 40px; position:relative;
    transition:background var(--fast), transform var(--fast);
  }
  .ico-btn:active{background:var(--card-3); transform:scale(.92)}
  .ico-btn svg{width:22px; height:22px}
  .ico-btn .dot{
    position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:50%;
    background:var(--violet); border:2px solid var(--bg);
  }
  .link{color:var(--violet-ink); font-weight:600; font-size:15px}
  .link:active{opacity:.6}

  /* ── карточки ── */
  .card{
    background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow-sm);
    border:1px solid var(--line); margin-bottom:14px; overflow:hidden;
  }
  .card.pad{padding:16px}
  .card-h{display:flex; align-items:center; gap:10px; padding:16px 16px 0}
  .card-h h3{font-size:16px; font-weight:600; letter-spacing:-.01em; flex:1}
  .card-h .side{font-size:13px; color:var(--ink-2); font-weight:500}
  .sec{display:flex; align-items:baseline; gap:10px; margin:22px 0 12px}
  .sec h3{font-size:17px; font-weight:600; letter-spacing:-.01em; flex:1}
  .sec .side{font-size:13px; color:var(--ink-2); font-weight:500}
  .hint{font-size:13px; color:var(--ink-2); line-height:1.5}

  /* ── hero: следующий сеанс ── */
  .hero{
    display:block; width:100%; background:var(--grad); color:#fff; border-radius:var(--r-lg);
    padding:18px; box-shadow:var(--shadow-violet); position:relative; overflow:hidden;
    transition:transform var(--fast);
  }
  .hero:active{transform:scale(.985)}
  .hero::after{
    content:''; position:absolute; right:-40px; top:-60px; width:180px; height:180px;
    border-radius:50%; background:rgba(255,255,255,.08);
  }
  .hero-label{font-size:13px; opacity:.8; font-weight:500}
  .hero-row{display:flex; align-items:center; gap:12px; margin-top:10px; position:relative}
  .hero-bar{width:3px; align-self:stretch; border-radius:2px; background:rgba(255,255,255,.5)}
  .hero-name{font-size:19px; font-weight:600; letter-spacing:-.01em}
  .hero-when{font-size:13px; opacity:.85; margin-top:2px}
  .hero-arrow{
    margin-left:auto; width:38px; height:38px; border-radius:var(--r-pill); flex:0 0 38px;
    background:rgba(255,255,255,.18); display:grid; place-items:center;
  }
  .hero-arrow svg{width:19px; height:19px}
  .hero.calm{background:var(--card); color:var(--ink); box-shadow:var(--shadow-sm); border:1px solid var(--line)}
  .hero.calm .hero-label{color:var(--ink-2); opacity:1}
  .hero.calm .hero-when{color:var(--ink-2); opacity:1}
  .hero.calm::after{display:none}
  .hero.calm .hero-arrow{background:var(--card-3); color:var(--ink-2)}

  /* ── быстрые действия ── */
  .quick{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px}
  .q{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:transform var(--fast);
  }
  .q:active{transform:scale(.94)}
  .q-tile{
    width:100%; aspect-ratio:1/1; border-radius:var(--r-md); display:grid; place-items:center;
  }
  .q-tile svg{width:24px; height:24px}
  .q-name{font-size:12px; color:var(--ink-2); font-weight:500}

  /* ── календарь ── */
  .cal-dow{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-top:12px}
  .cal-dow span{text-align:center; font-size:12px; color:var(--ink-3); font-weight:500}
  .cal-days{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-top:6px}
  .cal-d{
    width:38px; height:38px; justify-self:center; border-radius:var(--r-pill);
    display:grid; place-items:center; position:relative;
    font-size:15px; font-weight:500; color:var(--ink); transition:background var(--fast), color var(--fast);
  }
  .cal-d.off{color:var(--ink-4)}
  .cal-d.today{color:var(--violet-ink); font-weight:600}
  .cal-d.on{background:var(--violet); color:#fff; font-weight:600}
  .cal-d .busy{
    position:absolute; bottom:5px; width:4px; height:4px; border-radius:50%; background:var(--violet);
  }
  .cal-d.on .busy{background:rgba(255,255,255,.85)}

  /* ── неделя (полоса дат) ── */
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:4px 0 10px}
  .wd{display:flex; flex-direction:column; align-items:center; gap:8px; padding:2px 0}
  .wd-n{font-size:12px; color:var(--ink-3); font-weight:500}
  .wd-d{
    width:36px; height:36px; border-radius:var(--r-pill); display:grid; place-items:center;
    font-size:16px; font-weight:600; position:relative; transition:background var(--fast), color var(--fast);
  }
  .wd.on .wd-d{background:var(--violet); color:#fff}
  .wd.on .wd-n{color:var(--violet-ink)}
  .wd-dot{position:absolute; bottom:-7px; width:4px; height:4px; border-radius:50%; background:var(--ink-4)}
  .wd.on .wd-dot{background:var(--violet)}

  /* ── строки списков ── */
  .rows{display:flex; flex-direction:column}
  .row{
    display:flex; align-items:center; gap:12px; padding:14px 16px; width:100%;
    border-top:1px solid var(--line); background:var(--card); transition:background var(--fast);
  }
  .rows .row:first-child{border-top:0}
  .row:active{background:var(--card-2)}
  .row-main{flex:1; min-width:0}
  .row-t{font-size:15px; font-weight:600; letter-spacing:-.01em}
  .row-s{font-size:13px; color:var(--ink-2); margin-top:2px}
  .row-side{font-size:13px; color:var(--ink-2); text-align:right; white-space:nowrap}
  .chev{width:18px; height:18px; color:var(--ink-4); flex:0 0 18px}
  .kv{display:flex; align-items:center; gap:12px; padding:14px 0; border-top:1px solid var(--line)}
  .kv:first-child{border-top:0}
  .kv-k{font-size:15px; color:var(--ink-2); flex:1}
  .kv-v{font-size:15px; font-weight:600; text-align:right}
  .kv-v.acc{color:var(--violet-ink)}

  /* ── аватар ── */
  .av{
    border-radius:50%; background:var(--violet-soft); color:var(--violet-ink);
    display:grid; place-items:center; font-weight:600; flex:0 0 auto; overflow:hidden;
    letter-spacing:-.02em; user-select:none;
  }
  .av img{width:100%; height:100%; object-fit:cover}

  /* ── таймлайн расписания ── */
  .tl{position:relative; padding-left:64px}
  .tl::before{
    content:''; position:absolute; left:56px; top:6px; bottom:6px; width:1px; background:var(--line);
  }
  .tl-item{position:relative; margin-bottom:8px}
  .tl-time{
    position:absolute; left:-64px; top:16px; width:46px; text-align:right;
    font-size:13px; font-weight:600; color:var(--ink-2); font-variant-numeric:tabular-nums;
  }
  .tl-dot{
    position:absolute; left:-11px; top:21px; width:9px; height:9px; border-radius:50%;
    background:var(--violet); box-shadow:0 0 0 3px var(--bg);
  }
  .tl-card{
    display:flex; align-items:center; gap:12px; padding:14px 14px; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
    box-shadow:var(--shadow-sm); transition:transform var(--fast), background var(--fast);
  }
  .tl-card:active{transform:scale(.99)}
  .tl-item.now .tl-time{color:var(--violet-ink)}
  .tl-item.now .tl-card{background:var(--violet-soft); border-color:transparent; box-shadow:none}
  .tl-item.done .tl-card{opacity:.6}
  .tl-item.off .tl-dot{background:var(--ink-4)}
  .day-h{font-size:17px; font-weight:600; letter-spacing:-.01em; margin:20px 0 12px}

  /* ── кнопки ── */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:52px; padding:0 22px; border-radius:var(--r-md); font-size:16px; font-weight:600;
    background:var(--card-2); color:var(--ink); width:100%; transition:transform var(--fast), opacity var(--fast);
  }
  .btn:active{transform:scale(.98); opacity:.9}
  .btn svg{width:19px; height:19px}
  .btn.pri{background:var(--grad); color:#fff; box-shadow:var(--shadow-violet)}
  .btn.ghost{background:transparent; border:1px solid var(--line-2); color:var(--ink)}
  .btn.soft{background:var(--violet-soft); color:var(--violet-ink)}
  .btn.dan{background:var(--neg-soft); color:var(--neg)}
  .btn.sm{height:42px; font-size:14px; padding:0 16px; border-radius:var(--r-sm); width:auto}
  .btn[disabled]{opacity:.45; pointer-events:none}
  .btns{display:flex; gap:10px}
  .btns .btn{flex:1}

  /* три действия в карточке клиента */
  .acts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px}
  .act{
    border-radius:var(--r-md); padding:14px 8px; display:flex; flex-direction:column;
    align-items:center; gap:7px; font-size:12px; font-weight:500; transition:transform var(--fast);
  }
  .act:active{transform:scale(.95)}
  .act svg{width:22px; height:22px}

  /* ── плавающая кнопка ── */
  .fab{
    position:fixed; right:calc(50% - min(50vw, var(--shell) / 2) + 20px);
    bottom:calc(var(--tab-h) + 22px + var(--safe-bottom));
    width:56px; height:56px; border-radius:var(--r-pill); background:var(--grad); color:#fff;
    display:grid; place-items:center; box-shadow:var(--shadow-violet); z-index:35;
    transition:transform var(--mid);
  }
  .fab:active{transform:scale(.9)}
  .fab svg{width:26px; height:26px}

  /* ── нижняя навигация ── */
  .tabs{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0;
    width:min(100%, var(--shell)); z-index:40; display:grid;
    grid-template-columns:repeat(5,1fr); align-items:center;
    height:calc(var(--tab-h) + var(--safe-bottom)); padding-bottom:var(--safe-bottom);
    background:color-mix(in srgb, var(--card) 88%, transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--line);
  }
  .tab{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    height:100%; color:var(--ink-3); font-size:10px; font-weight:500;
    transition:color var(--fast);
  }
  .tab svg{width:23px; height:23px}
  .tab.on{color:var(--violet-ink); font-weight:600}
  .tab-plus{display:grid; place-items:center; height:100%}
  .tab-plus i{
    width:52px; height:52px; border-radius:var(--r-pill); background:var(--grad); color:#fff;
    display:grid; place-items:center; box-shadow:var(--shadow-violet); margin-top:-16px;
    transition:transform var(--mid);
  }
  .tab-plus i svg{width:25px; height:25px}
  .tab-plus:active i{transform:scale(.9) rotate(90deg)}

  /* ── шторки ── */
  .scrim{
    position:fixed; inset:0; background:var(--scrim); z-index:50;
    animation:fade var(--mid) both; backdrop-filter:blur(2px);
  }
  .sheet{
    position:fixed; left:50%; bottom:0; width:min(100%, var(--shell)); z-index:51; background:var(--card);
    border-radius:var(--r-xl) var(--r-xl) 0 0; padding:10px var(--pad) calc(20px + var(--safe-bottom));
    max-height:86vh; overflow-y:auto; animation:rise var(--slow) both; box-shadow:var(--shadow-lg);
  }
  .grab{width:38px; height:5px; border-radius:3px; background:var(--line-2); margin:0 auto 14px}
  .sheet h3{font-size:19px; font-weight:600; letter-spacing:-.01em; margin-bottom:4px}
  .sheet-sub{font-size:14px; color:var(--ink-2); margin-bottom:16px}

const iso = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const fromIso = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };

const relDay = (s, today) => {
  const n = daysBetween(today || iso(new Date()), s);
  if (n === 0) return 'Сегодня';
  if (n === 1) return 'Завтра';
  if (n === -1) return 'Вчера';
  return dateShort(s);
};

const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
};

const firstName = (name) => String(name || '').trim().split(/\s+/)[0] || '';

  const d = String(v || '').replace(/\D/g, '').slice(0, 12);
  if (!d) return '';
  const p = d.startsWith('380') ? d : ('380' + d).slice(0, 12);

function seedDB(){
  const db = emptyDB();
  const R = rnd(20250515);
  const now = new Date();
  const today = iso(now);

  db.clients = CLIENT_SEED.map((c, i) => ({
    id: 'cl_' + (i + 1), name: c.name, phone: c.phone, email: c.email,
    pref: c.pref, dur: serviceById(db, c.pref).dur,
    note: '', created: iso(addDays(now, -c.since)), avatar: null, fav: i < 3,
  }));

  const push = (clientId, date, time, svId, status, extra) => {
    const sv = serviceById(db, svId);
    const a = {
      id: 'ap_' + (db.appts.length + 1), clientId, serviceId: svId, date, time,
      dur: sv.dur, price: sv.price, status, pay: 'cash', subId: null, source: 'pro',
      ...(extra || {}),
    };
    db.appts.push(a);
    return a;
  };

  /* ── история: у каждого клиента свой ритм визитов ── */
  db.clients.forEach((c, i) => {
    const every = [7, 10, 14, 21][Math.floor(R() * 4)];
    let back = c.pref === 'sv_relax' ? 6 : 4;
    for (let d = c.created === today ? 0 : 3; d < 130; d += every){
      const day = addDays(now, -d - back);
      if (dowIdx(day) === 6) continue;                      /* воскресенье — выходной */
      if (iso(day) < c.created) break;
      const svId = R() > 0.75 ? SERVICE_SEED[Math.floor(R() * 5)].id : c.pref;
      const hour = 9 + Math.floor(R() * 9);
      push(c.id, iso(day), pad2(hour) + ':' + (R() > 0.5 ? '00' : '30'), svId, 'done',
           {pay: R() > 0.7 ? 'card' : 'cash'});
    }
  });

  /* ── сегодня и завтра: расписание с референса ── */
  TODAY_PLAN.forEach(p => {
    const c = db.clients[p.i];
    const done = mins(p.time) + serviceById(db, p.sv).dur < now.getHours() * 60 + now.getMinutes();
    push(c.id, today, p.time, p.sv, done ? 'done' : 'planned');
  });
  TOMORROW_PLAN.forEach(p => push(db.clients[p.i].id, iso(addDays(now, 1)), p.time, p.sv, 'planned'));

  /* ── дальше по неделе: живое, но не забитое расписание ── */
  for (let d = 2; d <= 12; d++){
    const day = addDays(now, d);
    if (dowIdx(day) === 6) continue;
    const n = 1 + Math.floor(R() * 3);
    const starts = ['09:30', '11:00', '13:00', '15:30', '18:00'];
    for (let k = 0; k < n; k++){
      const c = db.clients[Math.floor(R() * db.clients.length)];
      push(c.id, iso(day), starts[(k + d) % starts.length], c.pref, 'planned',
           {source: R() > 0.7 ? 'online' : 'pro'});
    }
  }

  /* ── две заявки с сайта ждут решения ── */
  push(db.clients[9].id, iso(addDays(now, 2)), '12:00', 'sv_lymph', 'pending', {source: 'online'});
  push(db.clients[12].id, iso(addDays(now, 3)), '17:00', 'sv_anti', 'pending', {source: 'online'});

  /* ── абонементы ── */
  db.subs = [
    {id: 'sb_1', clientId: 'cl_1', serviceId: 'sv_classic', total: 10, used: 5, price: 10800,
     created: iso(addDays(now, -46)), ends: iso(addDays(now, 44))},

    {id: 'sb_3', clientId: 'cl_5', serviceId: 'sv_anti', total: 10, used: 2, price: 11700,
     created: iso(addDays(now, -12)), ends: iso(addDays(now, 78))},
  ];

  /* ── карта тела: поясница Марии приходит в норму от сеанса к сеансу ── */
  const marks = [
    ['cl_1', -21, {lower: 3, traps: 2, neck: 2}],
    ['cl_1', -14, {lower: 2, traps: 2, neck: 1}],
    ['cl_1', -7,  {lower: 1, traps: 1, neck: 1, shoulders: 0}],
    ['cl_2', -12, {back: 3, legs: 2, glutes: 2}],
    ['cl_2', -4,  {back: 2, legs: 1, glutes: 1}],
    ['cl_3', -9,  {legs: 2, feet: 2, lower: 1}],
    ['cl_4', -6,  {neck: 3, traps: 3, shoulders: 2}],
    ['cl_5', -5,  {glutes: 2, legs: 2}],
  ];
  marks.forEach(([clientId, d, obj]) => {
    Object.keys(obj).forEach(zone => {
      db.marks.push({id: uid('mk'), clientId, date: iso(addDays(now, d)), zone, level: obj[zone]});
    });
  });

  /* ── заметки после сеансов ── */
  db.notes = [
    {id: 'nt_1', clientId: 'cl_1', date: iso(addDays(now, -7)), zones: ['lower', 'traps'],
     state: 'Напряжение уменьшилось', react: 'Положительная', next: 'Повторить сеанс через 7 дней',
     intensity: 'mid',
     raw: 'Сегодня работали с поясницей и правой трапецией. Напряжение уменьшилось, клиент чувствует себя лучше.'},
    {id: 'nt_2', clientId: 'cl_4', date: iso(addDays(now, -6)), zones: ['neck', 'traps'],
     state: 'Сильный зажим справа', react: 'Дискомфорт в начале', next: 'Повторить через 5 дней',

    {id: 'nt_3', clientId: 'cl_2', date: iso(addDays(now, -4)), zones: ['back', 'legs'],
     state: 'После нагрузки, мышцы забиты', react: 'Положительная', next: 'Повторить через 7 дней',
     intensity: 'hard',

  db.clients[0].note = 'Не любит сильное давление на шею. Просит тёплое масло.';
  db.clients[3].note = 'Сидячая работа, шея и трапеция — постоянная зона внимания.';
  return db;
}

/* ───────────────────────── 5. ХРАНИЛИЩЕ ─────────────────────────
   Маленькая шина: состояние в памяти, копия в localStorage, подписчики
   перерисовываются. Redux здесь был бы тяжелее самой задачи. */

const KEY = 'promassage.db.v1';

const Disk = {
  read(){
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const db = JSON.parse(raw);
      /* база без клиентов и без настроек — не база, а обломок: лучше
         пересобрать демо, чем показать пустой кабинет как «ваши данные» */
      if (!db || !Array.isArray(db.clients) || !db.pro) return null;
      return {...emptyDB(), ...db, settings: {...emptyDB().settings, ...(db.settings || {})}};
    } catch (e){ return null; }
  },
  write(db){
    try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
    catch (e){ return false; }
  },
  clear(){ try { localStorage.removeItem(KEY); } catch (e){} },
};

const Store = {
  state: null,
  subs: new Set(),
  init(db){ this.state = db || Disk.read() || seedDB(); Disk.write(this.state); return this.state; },
  on(fn){ this.subs.add(fn); return () => this.subs.delete(fn); },
  set(patch){
    const next = typeof patch === 'function' ? patch(this.state) : {...this.state, ...patch};
    this.state = next;
    Disk.write(next);
    this.subs.forEach(fn => fn(next));
    return next;
  },
};

const useDB = () => {
  const [, force] = useState(0);
  useEffect(() => Store.on(() => force(n => n + 1)), []);
  return Store.state;
};

/* ── действия: единственное место, где база меняется ── */
const Act = {
  saveClient(c){
    Store.set(db => {
      const list = db.clients.slice();
      const i = list.findIndex(x => x.id === c.id);
      if (i >= 0) list[i] = {...list[i], ...c};
      else list.unshift({id: uid('cl'), created: iso(new Date()), fav: false, note: '', avatar: null, ...c});
      return {...db, clients: list};
    });
  },
  delClient(id){
    Store.set(db => ({
      ...db,
      clients: db.clients.filter(c => c.id !== id),
      appts: db.appts.filter(a => a.clientId !== id),
      subs: db.subs.filter(s => s.clientId !== id),
      notes: db.notes.filter(n => n.clientId !== id),
      marks: db.marks.filter(m => m.clientId !== id),
    }));
  },
  saveAppt(a){
    Store.set(db => {
      const list = db.appts.slice();
      const i = list.findIndex(x => x.id === a.id);
      if (i >= 0) list[i] = {...list[i], ...a};
      else list.push({id: uid('ap'), status: 'planned', pay: 'cash', subId: null, source: 'pro', ...a});
      return {...db, appts: list};
    });
  },
  setStatus(id, status){
    Store.set(db => ({...db, appts: db.appts.map(a => a.id === id ? {...a, status} : a)}));
  },
  delAppt(id){ Store.set(db => ({...db, appts: db.appts.filter(a => a.id !== id)})); },

  /* сеанс завершён: статус, оплата, списание абонемента и заметка — одним
     движением, чтобы деньги и абонемент не разъезжались с расписанием */
  finish(apptId, res){
    Store.set(db => {
      const appt = db.appts.find(a => a.id === apptId);
      if (!appt) return db;
      const pay = (res && res.pay) || 'cash';
      let subs = db.subs, price = appt.price, subId = null;
      if (pay === 'sub'){
        const sub = db.subs.find(s => s.clientId === appt.clientId && s.used < s.total);
        if (sub){
          subId = sub.id;
          price = 0;
          subs = db.subs.map(s => s.id === sub.id ? {...s, used: s.used + 1} : s);
        }
      }
      const appts = db.appts.map(a => a.id === apptId ? {...a, status: 'done', pay, subId, price} : a);
      const notes = db.notes.slice(), marks = db.marks.slice();
      if (res && (res.raw || (res.zones || []).length)){
        notes.unshift({
          id: uid('nt'), clientId: appt.clientId, apptId, date: appt.date,
          zones: res.zones || [], state: res.state || '', react: res.react || '',
          next: res.next || '', intensity: res.intensity || 'mid', raw: res.raw || '',
        });
      }
      Object.keys((res && res.levels) || {}).forEach(zone => {
        marks.push({id: uid('mk'), clientId: appt.clientId, date: appt.date, zone, level: res.levels[zone]});
      });
      return {...db, appts, subs, notes, marks};
    });
  },
  addNote(n){
    Store.set(db => ({...db, notes: [{id: uid('nt'), date: iso(new Date()), zones: [], ...n}, ...db.notes]}));
  },
  delNote(id){ Store.set(db => ({...db, notes: db.notes.filter(n => n.id !== id)})); },
  setMark(clientId, zone, level, date){
    Store.set(db => ({...db, marks: [...db.marks, {id: uid('mk'), clientId, zone, level, date: date || iso(new Date())}]}));
  },
  addSub(s){
    Store.set(db => ({...db, subs: [{id: uid('sb'), used: 0, created: iso(new Date()), ...s}, ...db.subs]}));
  },
  saveSub(s){ Store.set(db => ({...db, subs: db.subs.map(x => x.id === s.id ? {...x, ...s} : x)})); },
  delSub(id){ Store.set(db => ({...db, subs: db.subs.filter(s => s.id !== id)})); },
  saveService(s){
    Store.set(db => {
      const list = db.services.slice();
      const i = list.findIndex(x => x.id === s.id);
      if (i >= 0) list[i] = {...list[i], ...s}; else list.push({id: uid('sv'), on: true, ...s});
      return {...db, services: list};
    });
  },
  delService(id){ Store.set(db => ({...db, services: db.services.filter(s => s.id !== id)})); },
  setPro(patch){ Store.set(db => ({...db, pro: {...db.pro, ...patch}})); },
  setSettings(patch){ Store.set(db => ({...db, settings: {...db.settings, ...patch}})); },
  reset(){ Disk.clear(); Store.init(seedDB()); },
  wipe(){ Disk.clear(); Store.init({...emptyDB(), clients: [], appts: []}); },
};

/* ───────────────────────── 6. ВЫБОРКИ ─────────────────────────
   Ни одно число в интерфейсе не хранится: доход, статистика клиента и
   прогресс по зонам считаются из записей. Поэтому они не могут разойтись
   с расписанием. */

const byTime = (a, b) => (a.date === b.date ? mins(a.time) - mins(b.time) : a.date < b.date ? -1 : 1);
const isLive = (a) => a.status === 'planned' || a.status === 'done';

const dayAppts = (db, date) => db.appts.filter(a => a.date === date && a.status !== 'canceled').sort(byTime);
const rangeAppts = (db, from, to) => db.appts.filter(a => a.date >= from && a.date <= to).sort(byTime);
const clientAppts = (db, id) => db.appts.filter(a => a.clientId === id).sort((a, b) => -byTime(a, b));

const nowMins = (d) => d.getHours() * 60 + d.getMinutes();

/* следующий сеанс: сегодня — ещё не начавшийся, иначе ближайший день */
const nextAppt = (db, at) => {
  const now = at || new Date(), today = iso(now), t = nowMins(now);
  const soon = db.appts
    .filter(a => a.status === 'planned' && (a.date > today || (a.date === today && mins(a.time) + a.dur > t)))
    .sort(byTime);
  return soon[0] || null;
};
const minutesUntil = (a, at) => {
  const now = at || new Date();
  return Math.round((fromIso(a.date).getTime() + mins(a.time) * 60000 - now.getTime()) / 60000);
};
const whenLabel = (a, at) => {
  const now = at || new Date();
  const d = daysBetween(iso(now), a.date);
  const day = d === 0 ? 'Сегодня' : d === 1 ? 'Завтра' : dateShort(a.date);
  return day + ', ' + a.time;
};

/* сеанс «идёт прямо сейчас» — по часам, а не по нажатой кнопке */
const runningAppt = (db, at) => {
  const now = at || new Date(), today = iso(now), t = nowMins(now);
  return db.appts.find(a => a.date === today && a.status === 'planned' && mins(a.time) <= t && mins(a.time) + a.dur > t) || null;
};

/* «в среднем 63 минуты» — число, которого не было ни на одном сеансе.
   Массажисту нужна привычная длительность, то есть самая частая. */
const modeDur = (list) => {
  const by = {};
  list.forEach(a => { by[a.dur] = (by[a.dur] || 0) + 1; });
  const top = Object.keys(by).sort((a, b) => by[b] - by[a] || Number(b) - Number(a))[0];
  return top ? Number(top) : 0;
};

const clientStats = (db, id) => {
  const all = clientAppts(db, id).filter(a => a.status !== 'canceled');
  const done = all.filter(a => a.status === 'done');
  const last = done[0] || null;
  const next = all.filter(a => a.status === 'planned').sort(byTime)[0] || null;
  const spent = sum(done, a => a.price);
  const counts = {};
  done.forEach(a => { counts[a.serviceId] = (counts[a.serviceId] || 0) + 1; });
  const top = Object.keys(counts).sort((x, y) => counts[y] - counts[x])[0] || (clientById(db, id) || {}).pref;
  return {
    total: done.length, last, next, spent, top,
    dur: modeDur(done) || (clientById(db, id) || {}).dur || 60,
    days: last ? daysBetween(last.date, iso(new Date())) : null,
  };
};

const subOf = (db, clientId) => db.subs.filter(s => s.clientId === clientId && s.used < s.total)
  .sort((a, b) => (a.ends < b.ends ? -1 : 1))[0] || null;

const periodRange = (kind, at) => {
  const now = at || new Date();
  if (kind === 'day') return [iso(now), iso(now)];
  if (kind === 'week'){ const s = startOfWeek(now); return [iso(s), iso(addDays(s, 6))]; }
  if (kind === 'year') return [iso(new Date(now.getFullYear(), 0, 1)), iso(new Date(now.getFullYear(), 11, 31))];
  return [iso(new Date(now.getFullYear(), now.getMonth(), 1)), iso(new Date(now.getFullYear(), now.getMonth() + 1, 0))];
};

/* деньги считаем только по проведённым: план — это ещё не доход */
const income = (db, from, to) => {
  const rows = db.appts.filter(a => a.status === 'done' && a.date >= from && a.date <= to).sort(byTime);
  const total = sum(rows, a => a.price);
  return {total, count: rows.length, avg: rows.length ? Math.round(total / rows.length) : 0, rows};
};
const growth = (now, was) => (was ? Math.round(((now - was) / was) * 100) : now ? 100 : 0);

/* столбики графика: 7 дней недели или 6 последних месяцев */
const series = (db, kind, at) => {
  const now = at || new Date();
  if (kind === 'month'){
    return Array.from({length: 6}, (_, i) => {
      const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 1);
      const from = iso(d), to = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
      return {label: MONTHS_N[d.getMonth()].slice(0, 3), value: income(db, from, to).total, key: from};
    });
  }
  const s = startOfWeek(now);
  return Array.from({length: 7}, (_, i) => {
    const d = addDays(s, i), k = iso(d);
    return {label: DOW[i], value: income(db, k, k).total, key: k, on: k === iso(now)};
  });
};

const topServices = (db, from, to) => {
  const rows = income(db, from, to).rows, by = {};
  rows.forEach(a => {
    const s = by[a.serviceId] || (by[a.serviceId] = {id: a.serviceId, n: 0, total: 0});
    s.n++; s.total += a.price;
  });
  return Object.values(by).sort((a, b) => b.total - a.total);
};

/* карта тела: последнее состояние зоны и её история по датам */
const zoneLevels = (db, clientId) => {
  const out = {};
  db.marks.filter(m => m.clientId === clientId).sort((a, b) => (a.date < b.date ? -1 : 1))
    .forEach(m => { out[m.zone] = m.level; });
  return out;
};
const zoneHistory = (db, clientId, zone) => db.marks
  .filter(m => m.clientId === clientId && (!zone || m.zone === zone))
  .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

/* динамика: было сильное — стало лёгкое, это и есть результат работы */
const zoneTrend = (db, clientId, zone) => {
  const h = zoneHistory(db, clientId, zone);
  if (h.length < 2) return 0;
  return h[h.length - 1].level - h[0].level;
};

const freeStarts = (db, date, dur, pro) => {
  const p = pro || db.pro;
  const day = fromIso(date);
  if (!p.days.includes(dowIdx(day))) return [];
  const busy = dayAppts(db, date).map(a => [mins(a.time), mins(a.time) + a.dur + (p.gap || 0)]);
  const out = [];
  for (let t = mins(p.hours.from); t + dur <= mins(p.hours.to); t += 30){
    if (!busy.some(([s, e]) => t < e && t + dur > s)) out.push(hhmm(t));
  }
  return out;
};
const overlaps = (db, date, time, dur, skipId) => dayAppts(db, date)
  .some(a => a.id !== skipId && mins(time) < mins(a.time) + a.dur && mins(time) + dur > mins(a.time));

/* что требует внимания: заявки, кончающиеся абонементы, забытые клиенты */
const notifications = (db, at) => {
  const now = at || new Date(), today = iso(now), out = [];
  db.appts.filter(a => a.status === 'pending').forEach(a => out.push({
    id: 'n_' + a.id, kind: 'request', icon: 'globe',
    title: 'Заявка с онлайн-записи',
    text: clientName(db, a.clientId) + ' · ' + relDay(a.date, today) + ', ' + a.time,
    apptId: a.id, clientId: a.clientId,
  }));
  dayAppts(db, today).filter(a => a.status === 'planned' && minutesUntil(a, now) > 0 && minutesUntil(a, now) <= 120)
    .forEach(a => out.push({
      id: 'n_' + a.id, kind: 'soon', icon: 'clock',
      title: 'Скоро сеанс · через ' + minutesUntil(a, now) + ' мин',
      text: clientName(db, a.clientId) + ' · ' + a.time + ' · ' + serviceName(db, a.serviceId),
      apptId: a.id, clientId: a.clientId,
    }));
  db.subs.filter(s => s.total - s.used === 1).forEach(s => out.push({
    id: 'n_' + s.id, kind: 'sub', icon: 'gift',
    title: 'Абонемент заканчивается',
    text: clientName(db, s.clientId) + ' · остался 1 сеанс из ' + s.total,
    clientId: s.clientId,
  }));
  db.clients.forEach(c => {
    const st = clientStats(db, c.id);
    if (st.total >= 3 && st.days !== null && st.days >= 45 && !st.next) out.push({
      id: 'n_lost_' + c.id, kind: 'lost', icon: 'users',
      title: 'Давно не приходил',
      text: c.name + ' · ' + st.days + ' ' + dayWord(st.days) + ' без сеанса',
      clientId: c.id,
    });
  });
  return out;
};

/* ───────────────────────── 7. AI-ЗАМЕТКА ─────────────────────────
   Массажист диктует как говорит: «работали с поясницей, напряжение
   уменьшилось». Разбор идёт на устройстве — без сети и без ключей, а
   значит работает между клиентами в любом кабинете. Результат всегда
   можно поправить руками: это черновик, а не приговор. */

const SIDE = [{re: /прав/, n: 'справа'}, {re: /лев/, n: 'слева'}];

const norm = (s) => String(s || '').toLowerCase().replace(/ё/g, 'е');

function aiNote(raw){
  const text = norm(raw);
  /* зоны — в том порядке, в каком массажист их назвал: он рассказывает
     о сеансе по ходу работы, и этот порядок сам по себе информация */
  const found = [], sides = {};
  ZONES.forEach(z => {
    let at = -1;
    z.syn.some(s => { const i = text.indexOf(norm(s)); if (i >= 0){ at = i; return true; } return false; });
    if (at < 0) return;
    found.push({k: z.k, at});
    const before = text.slice(Math.max(0, at - 22), at);
    const side = SIDE.find(s => s.re.test(before));
    if (side) sides[z.k] = side.n;
  });
  const zones = found.sort((a, b) => a.at - b.at).map(z => z.k);

  const sentences = String(raw || '').split(/[.;!?\n]+/).map(s => s.trim()).filter(Boolean);
  /* говорят без точек — одной длинной фразой через запятые. Тогда режем
     ещё и по запятым, иначе в «Состояние» уезжает весь рассказ целиком. */
  const pick = (re) => {
    const hit = sentences.find(s => re.test(norm(s)));
    if (!hit || hit.length <= 70) return hit || '';
    const part = hit.split(/,\s*/).map(s => s.trim()).filter(Boolean).find(s => re.test(norm(s)));
    return part || hit;
  };
  const state = pick(/напряж|зажим|спазм|тонус|блок|легче|лучше|расслаб|забит|боль/) || sentences[0] || '';

  const good = /лучше|легче|хорош|положительн|расслаб|доволен|приятн|уменьшил/.test(text);
  const bad = /боль|дискомфорт|неприятн|терпел|жалуе|хуже/.test(text);
  const react = good && !bad ? 'Положительная' : bad && good ? 'Смешанная: дискомфорт в начале, к концу лучше'
    : bad ? 'Дискомфорт' : 'Нейтральная';

  const m = text.match(/через\s+(\d+)\s*(дн|день|недел)/);
  let days = 7;
  if (m) days = m[2].startsWith('недел') ? Number(m[1]) * 7 : Number(m[1]);
  else if (/сильн|остр|спазм|зажат/.test(text)) days = 5;
  else if (good) days = 7;

  /* «сильно зажата шея» — это про клиента, а не про нажим: сказанное
     про мягкость важнее, поэтому проверяем её первой */
  const intensity = /мягк|легк|деликат|осторожн|аккуратн/.test(text) ? 'light'
    : /глубок|жестк|интенсивн|сильным нажим|сильно продав/.test(text) ? 'hard' : 'mid';

  return {
    zones,
    zoneText: zones.map(k => zoneName(k) + (sides[k] ? ' ' + sides[k] : '')).join(', '),
    state: state ? state.charAt(0).toUpperCase() + state.slice(1) : 'Без особенностей',
    react,
    next: 'Повторить сеанс через ' + days + ' ' + dayWord(days),
    intensity,
    raw: String(raw || '').trim(),
  };
}

/* распознавание речи там, где браузер умеет; где нет — честно даём
   набрать текст руками, а не показываем мёртвую кнопку */
const speechOk = () => typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition);

function useDictate(onText){
  const [rec, setRec] = useState(false);
  const ref = useRef(null);
  const stop = useCallback(() => { try { ref.current && ref.current.stop(); } catch (e){} setRec(false); }, []);
  const start = useCallback(() => {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!R) return false;
    try {
      const r = new R();
      r.lang = 'ru-RU'; r.interimResults = true; r.continuous = true;
      let acc = '';
      r.onresult = (e) => {
        let live = '';
        for (let i = e.resultIndex; i < e.results.length; i++){
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) acc += t + ' '; else live += t;
        }
        onText((acc + live).trim());
      };
      r.onerror = () => setRec(false);
      r.onend = () => setRec(false);
      r.start();
      ref.current = r;
      setRec(true);
      return true;
    } catch (e){ return false; }
  }, [onText]);
  useEffect(() => stop, [stop]);
  return {rec, start, stop};
}

/* секунды идут сами: экран сеанса должен тикать без нажатий */
function useTick(on, ms){
  const [, force] = useState(0);
  useEffect(() => {
    if (!on) return;
    const t = setInterval(() => force(n => n + 1), ms || 1000);
    return () => clearInterval(t);
  }, [on, ms]);
}

/* ───────────────────────── 8. ПРИМИТИВЫ ─────────────────────────
   Мелкие кирпичи интерфейса. Всё, что повторяется на двух экранах и
   больше, живёт здесь — иначе дизайн-система разъезжается. */

/* ── тост ── */
const Toaster = {fn: null, show(msg){ if (Toaster.fn) Toaster.fn(msg); }};
const say = (m) => Toaster.show(m);

function ToastHost(){
  const [msg, setMsg] = useState(null);
  const timer = useRef(null);
  useEffect(() => {
    Toaster.fn = (m) => {
      setMsg(m);
      clearTimeout(timer.current);
      timer.current = setTimeout(() => setMsg(null), 2300);
    };
    return () => { Toaster.fn = null; clearTimeout(timer.current); };
  }, []);
  if (!msg) return null;
  return <div className="toast" role="status">{msg}</div>;
}

/* ── шторка снизу: основной способ показать форму ── */
function Sheet({open, onClose, title, sub, children, wide}){
  useEffect(() => {
    if (!open) return;
    const esc = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', esc);
    return () => window.removeEventListener('keydown', esc);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <Fragment>
      <div className="scrim" onClick={onClose} />
      <div className="sheet" style={wide ? {maxHeight: '94%'} : null} role="dialog" aria-modal="true">
        <div className="grab" />
        {title ? <h3>{title}</h3> : null}
        {sub ? <div className="sheet-sub">{sub}</div> : null}
        {children}
      </div>
    </Fragment>
  );
}

/* ── график: столбики без осей и сетки, только суть ── */
function Bars({data, onPick, active}){
  const max = Math.max(1, ...data.map(d => d.value));
  const W = 100 / data.length;
  return (
    <svg className="chart" viewBox="0 0 100 60" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gv" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stopColor="#5B3FD3" /><stop offset="100%" stopColor="#7448E8" />
        </linearGradient>
      </defs>
      {data.map((d, i) => {
        const h = Math.max(2, (d.value / max) * 44);
        const on = active === undefined ? d.on : active === i;
        return (
          <rect key={d.key || i} className={'bar-r' + (on ? ' on' : '')} x={i * W + W * 0.22} y={50 - h}
                width={W * 0.56} height={h} rx="1.6"
                onClick={onPick ? () => { tap(); onPick(i); } : undefined} />
        );
      })}
    </svg>
  );
}
const BarLabels = ({data, active}) => (
  <div style={{display: 'grid', gridTemplateColumns: 'repeat(' + data.length + ',1fr)', marginTop: 6}}>
    {data.map((d, i) => (
      <span key={d.key || i} style={{
        textAlign: 'center', fontSize: 11, fontWeight: 500,
        color: (active === undefined ? d.on : active === i) ? 'var(--violet-ink)' : 'var(--ink-3)',
      }}>{d.label}</span>
    ))}
  </div>
);

/* ── календарь месяца ── */
function MiniCalendar({month, value, onPick, busy}){
  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const start = startOfWeek(first);
  const days = Array.from({length: 42}, (_, i) => addDays(start, i));
  const last = new Date(month.getFullYear(), month.getMonth() + 1, 0);
  const rows = Math.ceil((dowIdx(first) + last.getDate()) / 7);
  const today = iso(new Date());
  return (
    <Fragment>
      <div className="cal-dow">{DOW.map(d => <span key={d}>{d}</span>)}</div>
      <div className="cal-days">
        {days.slice(0, rows * 7).map(d => {
          const k = iso(d);
          const out = d.getMonth() !== month.getMonth();
          return (
            <button key={k} className={'cal-d' + (out ? ' off' : '') + (k === today ? ' today' : '') + (k === value ? ' on' : '')}
                    onClick={() => { tap(); onPick(k); }}>
              {d.getDate()}
              {busy && busy[k] && k !== value ? <i className="busy" /> : null}
            </button>
          );
        })}
      </div>
    </Fragment>
  );
}

/* ── полоса недели ── */
function WeekStrip({value, onPick, busy}){
  const start = startOfWeek(fromIso(value));
  return (
    <div className="week">
      {Array.from({length: 7}, (_, i) => {
        const d = addDays(start, i), k = iso(d);
        return (
          <button key={k} className={'wd' + (k === value ? ' on' : '')} onClick={() => { tap(); onPick(k); }}>
            <span className="wd-n">{DOW[i]}</span>
            <span className="wd-d">{d.getDate()}{busy && busy[k] ? <i className="wd-dot" /> : null}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ───────────────────────── 10. РАСПИСАНИЕ ─────────────────────────
   День — главная единица работы: полоса недели сверху, лента сеансов
   ниже, идущий сейчас выделен. */

function Schedule({db, go, date, setDate, openNew}){
  const [filter, setFilter] = useState(null);
  const [fOpen, setFOpen] = useState(false);
  const now = new Date();
  const busy = useMemo(() => {
    const map = {};
    db.appts.forEach(a => { if (a.status !== 'canceled') map[a.date] = true; });
    return map;
  }, [db.appts]);

  const pass = (a) => !filter || a.serviceId === filter;
  const day = dayAppts(db, date).filter(pass);
  const nextDate = iso(addDays(fromIso(date), 1));
  const nextDay = dayAppts(db, nextDate).filter(pass);
  const dayMoney = sum(day.filter(a => a.status === 'done'), a => a.price);
  useTick(true, 30000);

  const item = (a) => {
    const t = mins(a.time);
    const live = a.date === iso(now) && t <= nowMins(now) && t + a.dur > nowMins(now);
    const past = a.date < iso(now) || (a.date === iso(now) && t + a.dur <= nowMins(now));
    return (
      <div key={a.id} className={'tl-item' + (live ? ' now' : '') + (past && a.status === 'done' ? ' done' : '') + (a.status === 'pending' ? ' off' : '')}>
        <span className="tl-time">{a.time}</span>
        <span className="tl-dot" style={a.status === 'pending' ? {background: 'var(--ink-4)'} : null} />
        <button className="tl-card" onClick={() => { tap(); go({k: 'appt', id: a.id}); }}>
          <div className="row-main">
            <div className="row-t cut">{clientName(db, a.clientId)}</div>
            <div className="row-s cut">
              {serviceName(db, a.serviceId)}
              {a.status === 'pending' ? ' · заявка' : ''}
            </div>
          </div>
          <div className="row-side">{durLabel(a.dur)}</div>
          <span className="chev"><Icon n="chev" s={18} /></span>
        </button>
      </div>
    );
  };

  return (
    <div className="screen">
      <TopBar title="Расписание"
        left={<button className="ico-btn" onClick={() => { tap(); setDate(iso(now)); }} aria-label="Сегодня"><Icon n="clock" /></button>}
        right={<button className="ico-btn" onClick={() => { tap(); setFOpen(true); }} aria-label="Фильтр">
          <Icon n="filter" />{filter ? <i className="dot" /> : null}
        </button>} />

      <WeekStrip value={date} busy={busy} onPick={setDate} />

      <div style={{display: 'flex', alignItems: 'center', gap: 10, margin: '10px 0 4px'}}>
        <button className="ico-btn" style={{width: 34, height: 34}} onClick={() => setDate(iso(addDays(fromIso(date), -7)))} aria-label="Прошлая неделя"><Icon n="back" s={18} /></button>
        <div style={{flex: 1, textAlign: 'center', fontSize: 13, color: 'var(--ink-2)', fontWeight: 500}}>
          {monthTitle(fromIso(date))}
        </div>
        <button className="ico-btn" style={{width: 34, height: 34}} onClick={() => setDate(iso(addDays(fromIso(date), 7)))} aria-label="Следующая неделя"><Icon n="chev" s={18} /></button>
      </div>

      <div className="day-h" style={{display: 'flex', alignItems: 'baseline', gap: 10}}>
        <span style={{flex: 1}}>{dateLabel(date)}</span>
        <span style={{fontSize: 13, color: 'var(--ink-2)', fontWeight: 500}}>
          {day.length} {sessWord(day.length)}{dayMoney ? ' · ' + money(dayMoney) : ''}
        </span>
      </div>

      {day.length ? <div className="tl">{day.map(item)}</div> : (
        <Empty icon="calendar" title="День свободен"
               text={'На ' + dateLabel(date).split(',')[0] + ' записей нет. Можно поставить сеанс или отдохнуть.'}
               action={<button className="btn pri" style={{maxWidth: 240, margin: '0 auto'}} onClick={() => openNew(date)}>Записать клиента</button>} />)}

      {nextDay.length ? (
        <Fragment>
          <div className="day-h">{dateLabel(nextDate)}</div>
          <div className="tl">{nextDay.map(item)}</div>
        </Fragment>
      ) : null}

      <Sheet open={fOpen} onClose={() => setFOpen(false)} title="Фильтр" sub="Показывать сеансы по услуге">
        <Chips items={[{k: null, n: 'Все услуги'}].concat(db.services.map(s => ({k: s.id, n: s.name})))}
               value={filter} onChange={(k) => { setFilter(k); setFOpen(false); }} />
        <div style={{height: 14}} />
      </Sheet>
    </div>
  );
}

/* ───────────────────────── 11. КЛИЕНТЫ ───────────────────────── */

function Clients({db, go, openNewClient}){
  const [q, setQ] = useState('');
  const [sort, setSort] = useState('recent');
  const rows = useMemo(() => {
    const term = q.trim().toLowerCase();
    const list = db.clients
      .map(c => ({c, st: clientStats(db, c.id)}))
      .filter(({c}) => !term || c.name.toLowerCase().includes(term) || (c.phone || '').includes(term));
    if (sort === 'abc') return list.sort((a, b) => a.c.name.localeCompare(b.c.name, 'ru'));
    if (sort === 'top') return list.sort((a, b) => b.st.total - a.st.total);
    return list.sort((a, b) => {
      const x = (a.st.last || {}).date || a.c.created, y = (b.st.last || {}).date || b.c.created;
      return x < y ? 1 : x > y ? -1 : 0;
    });
  }, [db, q, sort]);

  return (
    <div className="screen">
      <TopBar title="Клиенты" big
        right={<button className="ico-btn" onClick={() => { tap(); openNewClient(); }} aria-label="Новый клиент"><Icon n="plus" /></button>} />
      <div style={{position: 'relative', marginBottom: 12}}>
        <span style={{position: 'absolute', left: 15, top: 15, color: 'var(--ink-3)'}}><Icon n="search" s={20} /></span>
        <input className="inp" style={{paddingLeft: 44}} placeholder="Имя или телефон"
               value={q} onChange={e => setQ(e.target.value)} />
      </div>
      <Seg items={[{k: 'recent', n: 'Недавние'}, {k: 'abc', n: 'По алфавиту'}, {k: 'top', n: 'Частые'}]}
           value={sort} onChange={setSort} />

      <div style={{height: 14}} />
      {rows.length ? (
        <div className="card">
          <div className="rows">
            {rows.map(({c, st}) => {
              const sub = st.next ? 'Записан · ' + relDay(st.next.date) + ', ' + st.next.time
                : st.last ? 'Был ' + relDay(st.last.date).toLowerCase()

                     title={c.name} sub={sub}
                     side={<span className="num" style={{color: 'var(--ink-3)'}}>{st.total || ''}</span>} />
              );
            })}
          </div>
        </div>
      ) : (
        <Empty icon="users" title={q ? 'Никого не нашли' : 'Клиентов пока нет'}
               text={q ? 'Проверьте имя или номер — возможно, клиент записан иначе.' : 'Добавьте первого клиента, и его история начнёт собираться сама.'}
               action={<button className="btn pri" style={{maxWidth: 240, margin: '0 auto'}} onClick={openNewClient}>Новый клиент</button>} />
      )}
      <div style={{height: 8}} />
      <div className="hint" style={{textAlign: 'center'}}>{db.clients.length} {plural(db.clients.length, 'клиент', 'клиента', 'клиентов')} в базе</div>
    </div>
  );
}

                        {t.short}{tr < 0 ? ' ↓' : tr > 0 ? ' ↑' : ''}
                      </span>
                    </div>
                  );
                }) : <div className="hint">Зоны напряжения не отмечены. Отметьте их после сеанса — прогресс будет виден на графике.</div>}
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-h" style={{paddingBottom: 12}}><h3>История сеансов</h3>
              <span className="side">{history.length}</span>
            </div>
            <div className="rows">
              {history.slice(0, 3).map(a => (
                <Row key={a.id} onClick={() => go({k: 'appt', id: a.id})}
                     title={dateShort(a.date) + ', ' + a.time} sub={serviceName(db, a.serviceId)}
                     side={durLabel(a.dur)} />
              ))}
              {!history.length ? <div style={{padding: 16}} className="hint">Сеансов ещё не было.</div> : null}
            </div>
            {history.length > 3 ? (
              <button className="btn" style={{borderRadius: 0, height: 46, background: 'transparent', color: 'var(--violet-ink)', fontSize: 14, borderTop: '1px solid var(--line)'}}
                      onClick={() => setTab('history')}>Показать все</button>
            ) : null}
          </div>
        </div>
      ) : null}

      {tab === 'history' ? (
        <div className="screen" style={{marginTop: 14}}>
          {st.next ? (
            <div className="card pad" style={{background: 'var(--violet-soft)', border: 0}}>
              <div style={{fontSize: 13, color: 'var(--violet-ink)', fontWeight: 600}}>Ближайшая запись</div>
              <div style={{fontSize: 16, fontWeight: 600, marginTop: 4}}>{whenLabel(st.next)}</div>
              <div style={{fontSize: 14, color: 'var(--ink-2)'}}>{serviceName(db, st.next.serviceId)} · {durLabel(st.next.dur)}</div>
            </div>
          ) : null}
          {history.length ? (
            <div className="card"><div className="rows">
              {history.map(a => (
                <Row key={a.id} onClick={() => go({k: 'appt', id: a.id})}
                     title={dateShort(a.date) + ', ' + a.time}
                     sub={serviceName(db, a.serviceId) + ' · ' + durLabel(a.dur)}
                     side={a.pay === 'sub' ? <span className="badge acc">Абонемент</span> : money(a.price)} />
              ))}
            </div></div>
          ) : <Empty icon="clock" title="История пустая" text="Проведите первый сеанс — он появится здесь." />}
        </div>
      ) : null}

      {tab === 'notes' ? (
        <div className="screen" style={{marginTop: 14}}>
          <button className="btn pri" onClick={() => { tap(); openNote(c.id); }}>
            <Icon n="mic" />Надиктовать заметку
          </button>
          <div style={{height: 14}} />
          {notes.length ? notes.map(n => (
            <div key={n.id} className="card pad">
              <div style={{display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10}}>
                <span style={{fontSize: 13, color: 'var(--ink-2)', flex: 1}}>{dateShort(n.date)}</span>
                {n.intensity ? <span className="badge">{(INTENSITY.find(i => i.k === n.intensity) || {}).n}</span> : null}
                <button className="ico-btn" style={{width: 30, height: 30}} onClick={() => { tap(); Act.delNote(n.id); say('Заметка удалена'); }} aria-label="Удалить">
                  <Icon n="trash" s={16} />
                </button>
              </div>
              {n.zones && n.zones.length ? (
                <div className="kv" style={{padding: '8px 0'}}>
                  <span className="kv-k">Зоны</span>
                  <span className="kv-v" style={{maxWidth: '65%'}}>{n.zoneText || n.zones.map(zoneName).join(', ')}</span>
                </div>
              ) : null}
              {n.state ? <div className="kv" style={{padding: '8px 0'}}><span className="kv-k">Состояние</span><span className="kv-v" style={{maxWidth: '65%'}}>{n.state}</span></div> : null}
              {n.react ? <div className="kv" style={{padding: '8px 0'}}><span className="kv-k">Реакция</span><span className="kv-v" style={{maxWidth: '65%'}}>{n.react}</span></div> : null}
              {n.next ? <div className="kv" style={{padding: '8px 0'}}><span className="kv-k">Рекомендация</span><span className="kv-v acc" style={{maxWidth: '65%'}}>{n.next}</span></div> : null}
              {n.raw ? <div className="hint" style={{marginTop: 10, paddingTop: 10, borderTop: '1px solid var(--line)'}}>«{n.raw}»</div> : null}
            </div>
          )) : (
            <Empty icon="note" title="Заметок пока нет"
                   text="После сеанса надиктуйте пару фраз — приложение само разложит их на зоны, состояние и рекомендацию." />
          )}
        </div>
      ) : null}
    </div>
  );
}

/* ───────────────────────── 13. КАРТА ТЕЛА ─────────────────────────
   Ключевая функция: где у клиента напряжение и как оно меняется от
   сеанса к сеансу. Отмечается в два касания — зона, потом уровень. */

function BodyMap({db, id, back, go}){
  const c = clientById(db, id);
  const levels = zoneLevels(db, id);
  const [zone, setZone] = useState(() => ZONES.find(z => (levels[z.k] || 0) >= 2) || ZONES[4]);
  if (!c) return <Empty icon="users" title="Клиент не найден" action={<button className="btn" onClick={back}>Назад</button>} />;

  const zk = zone.k;
  const hist = zoneHistory(db, id, zk);
  const now = levels[zk];
  const first = hist.length ? hist[0].level : null;
  const trend = hist.length > 1 ? hist[hist.length - 1].level - first : 0;

  const set = (level) => {
    tap(12);
    Act.setMark(id, zk, level);
    say(zone.n + ' — ' + tensionOf(level).n.toLowerCase());
  };

  return (
    <div className="screen">
      <div className="top-bar left">
        <BackBtn onClick={back} />
        <h2 style={{textAlign: 'left'}}>Карта тела</h2>
        <button className="ico-btn" onClick={() => go({k: 'client', id})} aria-label="Клиент">
          <Avatar name={c.name} src={c.avatar} size={32} />
        </button>
      </div>

      <div className="card pad">
        <div className="body-wrap"><BodyFigure levels={levels} sel={zk} onPick={(k) => { setZone(ZONES.find(z => z.k === k)); }} /></div>
        <TensionLegend />
      </div>

      <div className="card pad">
        <div style={{display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 12}}>
          <h3 style={{fontSize: 17, fontWeight: 600, flex: 1}}>{zone.n}</h3>
          <span style={{fontSize: 13, color: 'var(--ink-2)'}}>
            {now === undefined ? 'не отмечено' : tensionOf(now).n.toLowerCase()}
          </span>
        </div>
        <div className="chips">
          {ZONES.map(z => (
            <button key={z.k} className={'chip' + (z.k === zk ? ' on' : '')} onClick={() => { tap(); setZone(z); }}>
              {levels[z.k] !== undefined ? <i style={{display: 'inline-block', width: 7, height: 7, borderRadius: 4, background: tensionOf(levels[z.k]).c, marginRight: 6}} /> : null}
              {z.n}
            </button>
          ))}
        </div>
        <div className="tset">
          {TENSION.slice().reverse().map(t => (
            <button key={t.k} className={now === t.k ? 'on' : ''}
                    style={now === t.k ? {background: t.c + '22', borderColor: t.c} : null}
                    onClick={() => set(t.k)}>
              <i style={{display: 'block', width: 10, height: 10, borderRadius: 5, background: t.c, margin: '0 auto 6px'}} />
              {t.short}
            </button>
          ))}
        </div>
      </div>

      <div className="card pad">
        <div style={{display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 6}}>
          <h3 style={{fontSize: 17, fontWeight: 600, flex: 1}}>История изменений</h3>
          {trend < 0 ? <span className="badge pos">Лучше на {Math.abs(trend)}</span> : trend > 0 ? <span className="badge neg">Хуже на {trend}</span> : null}
        </div>
        {hist.length ? (
          <div style={{marginTop: 8}}>
            {hist.map(m => {
              const t = tensionOf(m.level);
              return (
                <div className="prog" key={m.id}>
                  <span className="prog-d">{fromIso(m.date).getDate() + '.' + pad2(fromIso(m.date).getMonth() + 1)}</span>
                  <span className="prog-line"><i style={{width: ((m.level + 1) / 4) * 100 + '%', background: t.c}} /></span>
                  <span className="prog-v" style={{color: t.c}}>{t.short}</span>
                </div>
              );
            })}
          </div>
        ) : <div className="hint" style={{marginTop: 6}}>Отметьте уровень напряжения — история начнёт собираться, и прогресс будет виден на этом графике.</div>}
      </div>

      <div className="card pad">
        <h3 style={{fontSize: 17, fontWeight: 600, marginBottom: 10}}>Все зоны</h3>
        {ZONES.map(z => {
          const lv = levels[z.k];
          const t = lv === undefined ? null : tensionOf(lv);
          const tr = zoneTrend(db, id, z.k);
          return (
            <button key={z.k} className="kv" style={{width: '100%'}} onClick={() => { tap(); setZone(z); }}>
              <span className="kv-k" style={{color: 'var(--ink)', display: 'flex', alignItems: 'center', gap: 10}}>
                <i style={{width: 9, height: 9, borderRadius: 5, background: t ? t.c : 'var(--t0)'}} />{z.n}
              </span>
              <span className="kv-v" style={{color: t ? t.c : 'var(--ink-3)', fontWeight: 600}}>
                {t ? t.short : '—'}{tr < 0 ? ' ↓' : tr > 0 ? ' ↑' : ''}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ───────────────────────── 14. СЕАНС ─────────────────────────
   Экран, который смотрят краем глаза с масляными руками: крупный
   таймер, две кнопки, ничего лишнего. После «Завершить» — короткий
   разбор: зоны, интенсивность, заметка и оплата. */

Act.runStart = (apptId) => Store.set(db => ({...db, run: {apptId, at: Date.now(), acc: 0, paused: false}}));
Act.runPause = () => Store.set(db => db.run ? ({...db, run: {...db.run, acc: runSeconds(db.run), paused: true}}) : db);
Act.runResume = () => Store.set(db => db.run ? ({...db, run: {...db.run, at: Date.now(), paused: false}}) : db);
Act.runStop = () => Store.set(db => ({...db, run: null}));

const runSeconds = (run, at) => {
  if (!run) return 0;
  const base = run.acc || 0;
  return run.paused ? Math.round(base) : Math.round(base + ((at || Date.now()) - run.at) / 1000);
};

function SessionScreen({db, id, back, go}){
  const a = db.appts.find(x => x.id === id);
  const run = db.run && db.run.apptId === id ? db.run : null;
  const [phase, setPhase] = useState('run');
  const [zones, setZones] = useState([]);
  const [levels, setLevels] = useState({});
  const [intensity, setIntensity] = useState('mid');
  const [pay, setPay] = useState('cash');
  const [raw, setRaw] = useState('');
  const [note, setNote] = useState(null);
  const dict = useDictate(setRaw);
  useTick(!!run && !run.paused, 1000);

  if (!a) return <Empty icon="clock" title="Сеанс не найден" action={<button className="btn" onClick={back}>Назад</button>} />;

  const c = clientById(db, a.clientId) || {name: 'Клиент'};
  const total = a.dur * 60;
  const spent = runSeconds(run);
  const left = total - spent;
  const ring = clamp(spent / total, 0, 1);
  const sub = subOf(db, a.clientId);

  const parse = () => {
    const res = aiNote(raw);
    setNote(res);
    setZones(z => Array.from(new Set([...z, ...res.zones])));
    setIntensity(res.intensity);
    tap(14);
    say('Заметка разобрана — проверьте и поправьте');
  };

  const finish = () => {
    Act.finish(a.id, {
      zones, levels, intensity, pay,
      raw: (note && note.raw) || raw,
      state: note ? note.state : '',
      react: note ? note.react : '',
      next: note ? note.next : '',
      zoneText: note ? note.zoneText : zones.map(zoneName).join(', '),
    });
    Act.runStop();
    tap(20);
    say('Сеанс завершён' + (pay === 'sub' && sub ? ' · списан 1 сеанс абонемента' : pay === 'sub' ? '' : ' · ' + money(a.price)));
    go({k: 'client', id: a.clientId});
  };

  if (phase === 'wrap') return (
    <div className="screen">
      <div className="top-bar left">
        <BackBtn onClick={() => setPhase('run')} />
        <h2 style={{textAlign: 'left'}}>Как прошёл сеанс?</h2>
      </div>

      <div className="card pad">
        <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
          <Avatar name={c.name} src={c.avatar} size={46} />
          <div style={{flex: 1, minWidth: 0}}>
            <div className="row-t cut">{c.name}</div>
            <div className="row-s">{serviceName(db, a.serviceId)} · {clock(spent)}</div>
          </div>
        </div>
      </div>

      <div className="card pad">
        <h3 style={{fontSize: 16, fontWeight: 600, marginBottom: 10}}>Зоны, с которыми работали</h3>
        <Chips multi items={ZONES.map(z => ({k: z.k, n: z.n}))} value={zones} onChange={setZones} />
        {zones.length ? (
          <div style={{marginTop: 16}}>
            {zones.map(k => (
              <div key={k} style={{marginBottom: 12}}>
                <div className="lab">{zoneName(k)} — напряжение</div>
                <div className="tset" style={{marginTop: 0}}>
                  {TENSION.slice().reverse().map(t => (
                    <button key={t.k} className={levels[k] === t.k ? 'on' : ''}
                            style={levels[k] === t.k ? {background: t.c + '22', borderColor: t.c} : null}
                            onClick={() => { tap(); setLevels(l => ({...l, [k]: t.k})); }}>{t.short}</button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        ) : null}
      </div>

      <div className="card pad">
        <h3 style={{fontSize: 16, fontWeight: 600, marginBottom: 10}}>Интенсивность</h3>
        <Seg items={INTENSITY.map(i => ({k: i.k, n: i.n}))} value={intensity} onChange={setIntensity} />
      </div>

      <AiNoteBlock raw={raw} setRaw={setRaw} note={note} setNote={setNote} dict={dict} onParse={parse} />

      <div className="card pad">
        <h3 style={{fontSize: 16, fontWeight: 600, marginBottom: 10}}>Оплата</h3>
        <Seg items={PAY_KINDS.map(p => ({k: p.k, n: p.n}))} value={pay} onChange={setPay} />
        <div className="kv" style={{marginTop: 12}}>
          <span className="kv-k">К оплате</span>
          <span className="kv-v num">{pay === 'sub' && sub ? 'Абонемент · ' + (sub.total - sub.used - 1) + ' после списания' : money(a.price)}</span>
        </div>
        {pay === 'sub' && !sub ? <div className="hint" style={{color: 'var(--neg)'}}>У клиента нет активного абонемента — оплата запишется как наличные.</div> : null}
      </div>

      <button className="btn pri" onClick={finish}><Icon n="check" />Сохранить и завершить</button>
      <div style={{height: 12}} />
    </div>
  );

  return (
    <div className="screen">
      <div className="top-bar left">
        <BackBtn onClick={back} />
        <h2 style={{textAlign: 'left'}}>Сеанс</h2>
        <button className="ico-btn" onClick={() => go({k: 'client', id: a.clientId})} aria-label="Клиент"><Icon n="users" /></button>
      </div>

      <div style={{textAlign: 'center', marginTop: 4}}>
        <div style={{display: 'flex', justifyContent: 'center'}}><Avatar name={c.name} src={c.avatar} size={60} /></div>
        <h1 style={{fontSize: 22, fontWeight: 700, letterSpacing: '-.02em', marginTop: 10}}>{c.name}</h1>
        <div style={{fontSize: 14, color: 'var(--ink-2)', marginTop: 2}}>
          {serviceName(db, a.serviceId)} · {durLabel(a.dur)}
        </div>
      </div>

      <div className="timer-wrap">
        <svg className="timer-svg" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="44" stroke="var(--card-3)" strokeWidth="7" />
          <circle cx="50" cy="50" r="44" stroke="url(#gr)" strokeWidth="7"
                  strokeDasharray={2 * Math.PI * 44}
                  strokeDashoffset={2 * Math.PI * 44 * (1 - ring)} />
          <defs>
            <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stopColor="#5B3FD3" /><stop offset="100%" stopColor="#7448E8" />
            </linearGradient>
          </defs>
        </svg>
        <div className="timer-in">
          <div>
            <div className="timer-n">{clock(run ? Math.max(0, left) : total)}</div>
            <div className="timer-s">
              {!run ? 'Готов начать' : run.paused ? 'Пауза' : left > 0 ? 'осталось' : 'сверх времени ' + clock(-left)}
            </div>
          </div>
        </div>
      </div>

      <div style={{height: 12}} />
      {!run ? (
        <button className="btn pri" onClick={() => { tap(14); Act.runStart(a.id); }}><Icon n="play" />Начать сеанс</button>
      ) : (
        <div className="btns">
          <button className="btn" onClick={() => { tap(); run.paused ? Act.runResume() : Act.runPause(); }}>
            <Icon n={run.paused ? 'play' : 'pause'} />{run.paused ? 'Продолжить' : 'Пауза'}
          </button>
          <button className="btn pri" onClick={() => { tap(14); setPhase('wrap'); }}><Icon n="check" />Завершить</button>
        </div>
      )}

      <div className="card pad" style={{marginTop: 18}}>
        <div className="kv"><span className="kv-k">Начало по плану</span><span className="kv-v num">{a.time}</span></div>
        <div className="kv"><span className="kv-k">Стоимость</span><span className="kv-v num">{money(a.price)}</span></div>
        {sub ? <div className="kv"><span className="kv-k">Абонемент</span><span className="kv-v acc">{sub.used} из {sub.total}</span></div> : null}
      </div>

      {db.notes.filter(n => n.clientId === a.clientId).slice(0, 1).map(n => (
        <div className="card pad" key={n.id}>
          <div style={{fontSize: 13, color: 'var(--ink-2)', marginBottom: 6}}>Прошлый раз · {dateShort(n.date)}</div>
          <div style={{fontSize: 14}}>{n.state}</div>
          {n.next ? <div style={{fontSize: 14, color: 'var(--violet-ink)', marginTop: 6, fontWeight: 500}}>{n.next}</div> : null}
        </div>
      ))}
    </div>
  );
}

/* ── AI-заметка: диктовка и разбор ───────────────────────────────
   Голос → текст → структура. Разбор идёт на устройстве, поэтому
   работает без сети; результат правится руками. */
function AiNoteBlock({raw, setRaw, note, setNote, dict, onParse, compact}){
  const canSpeak = speechOk();
  return (
    <div className="card pad">
      <div style={{display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12}}>
        <h3 style={{fontSize: 16, fontWeight: 600, flex: 1}}>Заметка после сеанса</h3>
        <span className="badge acc"><Icon n="spark" s={13} />AI</span>
      </div>

      <button className={'btn ' + (dict.rec ? 'dan' : 'soft')} style={{height: 58}}
              onClick={() => {
                tap(12);
                if (dict.rec) return dict.stop();
                if (!canSpeak) return say('Браузер не умеет распознавать речь — наберите текст ниже');
                dict.start();
              }}>
        {dict.rec ? <Fragment><i className="rec-dot" />Идёт запись — нажмите, чтобы остановить</Fragment>
                  : <Fragment><Icon n="mic" />Надиктовать заметку</Fragment>}
      </button>

      <div style={{height: 12}} />
      <textarea className="inp" value={raw} onChange={e => setRaw(e.target.value)}
                placeholder="Например: сегодня работали с поясницей и правой трапецией, напряжение уменьшилось, клиент чувствует себя лучше" />
      <div className="btns" style={{marginTop: 10}}>
        <button className="btn sm" style={{flex: 1}} disabled={!raw.trim()} onClick={onParse}>
          <Icon n="spark" />Разобрать
        </button>
        {note ? <button className="btn sm ghost" style={{flex: '0 0 auto'}} onClick={() => { setNote(null); }}>Сбросить</button> : null}
      </div>

      {note ? (
        <div style={{marginTop: 14, paddingTop: 4, borderTop: '1px solid var(--line)'}}>
          <Field label="Зоны">
            <Input value={note.zoneText} onChange={e => setNote({...note, zoneText: e.target.value})} />
          </Field>
          <Field label="Состояние">
            <Input value={note.state} onChange={e => setNote({...note, state: e.target.value})} />
          </Field>
          <Field label="Реакция">
            <Input value={note.react} onChange={e => setNote({...note, react: e.target.value})} />
          </Field>
          <Field label="Рекомендация">
            <Input value={note.next} onChange={e => setNote({...note, next: e.target.value})} />
          </Field>
          {compact ? null : <div className="hint">Черновик собран из ваших слов — поправьте, если что-то не так.</div>}
        </div>
      ) : null}
    </div>
  );
}

/* отдельная шторка «надиктовать» — из карточки клиента, вне сеанса */
function NoteSheet({open, onClose, db, clientId}){
  const [raw, setRaw] = useState('');
  const [note, setNote] = useState(null);
  const dict = useDictate(setRaw);
  const c = clientById(db, clientId);
  if (!open || !c) return null;
  const save = () => {
    const res = note || aiNote(raw);
    Act.addNote({
      clientId, zones: res.zones || [], zoneText: res.zoneText, state: res.state,
      react: res.react, next: res.next, intensity: res.intensity, raw: raw.trim(),
    });
    say('Заметка сохранена');
    setRaw(''); setNote(null);
    onClose();
  };
  return (
    <Sheet open={open} onClose={onClose} title="Заметка" sub={c.name} wide>
      <AiNoteBlock raw={raw} setRaw={setRaw} note={note} setNote={setNote} dict={dict}
                   onParse={() => { setNote(aiNote(raw)); tap(); }} compact />
      <button className="btn pri" disabled={!raw.trim()} onClick={save}>Сохранить заметку</button>
