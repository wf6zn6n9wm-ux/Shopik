}

/* ───────────────────────── 15. ДОХОД ─────────────────────────
   Деньги считаются из проведённых сеансов. Никакого ручного ввода:
   провёл сеанс — доход обновился. */

function Income({db, back}){
  const [period, setPeriod] = useState('day');
  const now = new Date();
  const [from, to] = periodRange(period, now);
  const cur = income(db, from, to);
  const prevFrom = period === 'day' ? iso(addDays(now, -1))
    : period === 'week' ? iso(addDays(fromIso(from), -7))
    : iso(new Date(now.getFullYear(), now.getMonth() - 1, 1));
  const prevTo = period === 'day' ? iso(addDays(now, -1))
    : period === 'week' ? iso(addDays(fromIso(to), -7))
    : iso(new Date(now.getFullYear(), now.getMonth(), 0));
  const prev = income(db, prevFrom, prevTo);
  const g = growth(cur.total, prev.total);

  const week = income(db, ...periodRange('week', now));
  const month = income(db, ...periodRange('month', now));
  const chart = series(db, period === 'month' ? 'month' : 'week', now);
  const [pick, setPick] = useState(undefined);
  const tops = topServices(db, from, to);

  return (
    <div className="screen">
      <div className="top-bar left"><BackBtn onClick={back} /><h2 style={{textAlign: 'left'}}>Доход</h2></div>

      <Seg items={[{k: 'day', n: 'Сегодня'}, {k: 'week', n: 'Неделя'}, {k: 'month', n: 'Месяц'}]}
           value={period} onChange={(k) => { setPeriod(k); setPick(undefined); }} />
      <div style={{height: 14}} />

      <div className="money-hero">
        <div className="k">{period === 'day' ? 'Сегодня' : period === 'week' ? 'Эта неделя' : 'Этот месяц'}</div>
        <div className="v">{money(cur.total)}</div>
        <div className="r">
          <div>Сеансов<b className="num">{cur.count}</b></div>
          <div>Средний чек<b className="num">{money(cur.avg)}</b></div>
          <div>К прошлому<b className="num">{g > 0 ? '+' : ''}{g}%</b></div>
        </div>
      </div>

      <div className="card pad" style={{marginTop: 14}}>
        <div style={{display: 'flex', alignItems: 'baseline', marginBottom: 12}}>
          <h3 style={{fontSize: 16, fontWeight: 600, flex: 1}}>{period === 'month' ? 'Полгода' : 'По дням недели'}</h3>
          <span style={{fontSize: 13, color: 'var(--ink-2)'}}>
            {pick !== undefined ? money(chart[pick].value) : money(sum(chart, d => d.value))}
          </span>
        </div>
        <Bars data={chart} active={pick} onPick={setPick} />
        <BarLabels data={chart} active={pick} />
      </div>

      <div className="stat-grid">
        <div className="stat"><div className="stat-k">Неделя</div><div className="stat-v">{money(week.total)}</div></div>
        <div className="stat"><div className="stat-k">Месяц</div><div className="stat-v">{money(month.total)}</div></div>
      </div>

      <div className="sec"><h3>Услуги за период</h3></div>
      {tops.length ? (
        <div className="card"><div className="rows">
          {tops.map(s => (
            <Row key={s.id} chevron={false} title={serviceName(db, s.id)}
                 sub={s.n + ' ' + sessWord(s.n)} side={<b className="num">{money(s.total)}</b>} />
          ))}
        </div></div>
      ) : <div className="card pad"><div className="hint">За период сеансов не было.</div></div>}

      <div className="sec"><h3>Оплаты</h3><span className="side">{cur.count}</span></div>
      {cur.rows.length ? (
        <div className="card"><div className="rows">
          {cur.rows.slice().reverse().slice(0, 30).map(a => (
            <Row key={a.id} chevron={false} left={<Avatar name={clientName(db, a.clientId)} size={38} />}
                 title={clientName(db, a.clientId)}
                 sub={relDay(a.date) + ', ' + a.time + ' · ' + serviceName(db, a.serviceId)}
                 side={a.pay === 'sub' ? <span className="badge acc">Абонемент</span> : <b className="num">{money(a.price)}</b>} />
          ))}
        </div></div>
      ) : <div className="card pad"><div className="hint">Оплат за период нет.</div></div>}
    </div>
  );
}

/* ───────────────────────── 16. АНАЛИТИКА ───────────────────────── */

function Analytics({db, back, go}){
  const now = new Date();
  const [from, to] = periodRange('month', now);
  const cur = income(db, from, to);
  const prev = income(db, iso(new Date(now.getFullYear(), now.getMonth() - 1, 1)), iso(new Date(now.getFullYear(), now.getMonth(), 0)));
  const chart = series(db, 'month', now);

  const newClients = db.clients.filter(c => c.created >= from).length;
  const active = db.clients.filter(c => clientStats(db, c.id).days !== null && clientStats(db, c.id).days <= 45).length;
  const back45 = db.clients.filter(c => clientStats(db, c.id).total >= 2).length;
  const retention = db.clients.length ? Math.round((back45 / db.clients.length) * 100) : 0;

  /* загрузка: сколько рабочих часов месяца реально занято сеансами */
  const workDays = Array.from({length: daysBetween(from, to) + 1}, (_, i) => addDays(fromIso(from), i))
    .filter(d => db.pro.days.includes(dowIdx(d)) && iso(d) <= iso(now));
  const capacity = workDays.length * (mins(db.pro.hours.to) - mins(db.pro.hours.from));
  const busyMin = sum(cur.rows, a => a.dur);
  const load = capacity ? Math.round((busyMin / capacity) * 100) : 0;

  /* часы пик: когда клиенты чаще всего приходят */
  const hours = {};
  db.appts.filter(a => a.status === 'done').forEach(a => {
    const h = Math.floor(mins(a.time) / 60);
    hours[h] = (hours[h] || 0) + 1;
  });
  const peak = Object.keys(hours).sort((a, b) => hours[b] - hours[a]).slice(0, 3).map(Number).sort((a, b) => a - b);
  const tops = topServices(db, from, to);
  const zoneCount = {};
  db.marks.forEach(m => { if (m.level >= 2) zoneCount[m.zone] = (zoneCount[m.zone] || 0) + 1; });
  const zoneTop = Object.keys(zoneCount).sort((a, b) => zoneCount[b] - zoneCount[a]).slice(0, 3);

  return (
    <div className="screen">
      <div className="top-bar left"><BackBtn onClick={back} /><h2 style={{textAlign: 'left'}}>Аналитика</h2></div>

      <div className="stat-grid" style={{marginTop: 6}}>
        <div className="stat"><div className="stat-k">Доход за месяц</div><div className="stat-v">{money(cur.total)}</div>
          <div style={{fontSize: 12, marginTop: 4, color: growth(cur.total, prev.total) >= 0 ? 'var(--pos)' : 'var(--neg)'}}>
            {growth(cur.total, prev.total) >= 0 ? '+' : ''}{growth(cur.total, prev.total)}% к прошлому
          </div>
        </div>
        <div className="stat"><div className="stat-k">Сеансов</div><div className="stat-v num">{cur.count}</div>
          <div style={{fontSize: 12, marginTop: 4, color: 'var(--ink-2)'}}>средний {money(cur.avg)}</div>
        </div>
        <div className="stat"><div className="stat-k">Загрузка</div><div className="stat-v num">{load}%</div>
          <div className="bar" style={{marginTop: 8}}><i style={{width: clamp(load, 0, 100) + '%'}} /></div>
        </div>
        <div className="stat"><div className="stat-k">Возвращаются</div><div className="stat-v num">{retention}%</div>
          <div style={{fontSize: 12, marginTop: 4, color: 'var(--ink-2)'}}>{active} активных</div>
        </div>
      </div>

      <div className="card pad" style={{marginTop: 14}}>
        <h3 style={{fontSize: 16, fontWeight: 600, marginBottom: 12}}>Доход по месяцам</h3>
        <Bars data={chart} />
        <BarLabels data={chart} />
      </div>

      <div className="card pad">
        <h3 style={{fontSize: 16, fontWeight: 600, marginBottom: 10}}>Что приносит деньги</h3>
        {tops.length ? tops.map(s => {
          const share = cur.total ? Math.round((s.total / cur.total) * 100) : 0;
          return (
            <div key={s.id} style={{marginBottom: 12}}>
              <div style={{display: 'flex', gap: 10, fontSize: 14, marginBottom: 6}}>
                <span style={{flex: 1}} className="cut">{serviceName(db, s.id)}</span>
                <span className="num" style={{color: 'var(--ink-2)'}}>{share}%</span>
                <b className="num">{money(s.total)}</b>
              </div>
              <div className="bar"><i style={{width: share + '%'}} /></div>
            </div>
          );
        }) : <div className="hint">Данных за месяц пока нет.</div>}
      </div>

      <div className="card pad">
        <h3 style={{fontSize: 16, fontWeight: 600, marginBottom: 10}}>Наблюдения</h3>
        <div className="kv"><span className="kv-k">Новых клиентов за месяц</span><span className="kv-v num">{newClients}</span></div>
        <div className="kv"><span className="kv-k">Часы пик</span><span className="kv-v">{peak.length ? peak.map(h => pad2(h) + ':00').join(', ') : '—'}</span></div>
        <div className="kv"><span className="kv-k">Частые зоны напряжения</span><span className="kv-v">{zoneTop.length ? zoneTop.map(zoneName).join(', ') : '—'}</span></div>
        <div className="kv"><span className="kv-k">Активных абонементов</span><span className="kv-v num">{db.subs.filter(s => s.used < s.total).length}</span></div>
      </div>

      <button className="btn soft" onClick={() => go({k: 'income'})}><Icon n="wallet" />Открыть доход</button>
      <div style={{height: 12}} />
    </div>
  );
}

/* ───────────────────────── 17. АБОНЕМЕНТЫ ───────────────────────── */

function Subs({db, back, go, openNew, client}){
  const active = db.subs.filter(s => s.used < s.total);
  const closed = db.subs.filter(s => s.used >= s.total);
  const mine = client ? active.filter(s => s.clientId === client) : active;
  const money_ = sum(active, s => s.price);

  const card = (s, dim) => {
    const left = s.total - s.used;
    const pc = Math.round((s.used / s.total) * 100);
    return (
      <div className="card pad" key={s.id} style={dim ? {opacity: .6} : null}>
        <div style={{display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12}}>
          <Avatar name={clientName(db, s.clientId)} size={42} />
          <button style={{flex: 1, minWidth: 0}} onClick={() => go({k: 'client', id: s.clientId})}>
            <div className="row-t cut">{clientName(db, s.clientId)}</div>
            <div className="row-s cut">{serviceName(db, s.serviceId)} · {s.total} {sessWord(s.total)}</div>
          </button>
          <span className={'badge' + (left <= 1 ? ' neg' : ' acc')}>{left ? 'осталось ' + left : 'закрыт'}</span>
        </div>
        <div className="bar"><i style={{width: pc + '%'}} /></div>
        <div style={{display: 'flex', marginTop: 10, fontSize: 13, color: 'var(--ink-2)'}}>
          <span style={{flex: 1}}>Использовано {s.used} из {s.total}</span>
          <span className="num">{money(s.price)}</span>
        </div>
        {!dim ? (
          <div className="btns" style={{marginTop: 12}}>
            <button className="btn sm" onClick={() => { tap(); Act.saveSub({id: s.id, used: clamp(s.used + 1, 0, s.total)}); say('Списан 1 сеанс'); }}>
              Списать сеанс
            </button>
            <button className="btn sm ghost" onClick={() => { tap(); Act.delSub(s.id); say('Абонемент удалён'); }}>Удалить</button>
          </div>
        ) : null}
      </div>
    );
  };

  return (
    <div className="screen">
      <div className="top-bar left"><BackBtn onClick={back} /><h2 style={{textAlign: 'left'}}>Абонементы</h2>
        <button className="ico-btn" onClick={() => { tap(); openNew(client); }} aria-label="Создать"><Icon n="plus" /></button>
      </div>

      <div className="card pad" style={{background: 'var(--violet-soft)', border: 0}}>
        <div style={{display: 'flex', gap: 20}}>
          <div><div style={{fontSize: 13, color: 'var(--ink-2)'}}>Активных</div><div className="stat-v num">{active.length}</div></div>
          <div><div style={{fontSize: 13, color: 'var(--ink-2)'}}>Оплачено вперёд</div><div className="stat-v num">{money(money_)}</div></div>
        </div>
      </div>

      {mine.length ? mine.map(s => card(s)) : (
        <Empty icon="gift" title="Абонементов нет"
               text="Абонемент держит клиента рядом: он платит вперёд и возвращается по расписанию."
               action={<button className="btn pri" style={{maxWidth: 260, margin: '0 auto'}} onClick={() => openNew(client)}>+ Создать абонемент</button>} />
      )}

      {mine.length ? <button className="btn soft" onClick={() => { tap(); openNew(client); }}><Icon n="plus" />Создать абонемент</button> : null}

      {closed.length ? (
        <Fragment>
          <div className="sec"><h3>Закрытые</h3><span className="side">{closed.length}</span></div>
          {closed.map(s => card(s, true))}
        </Fragment>
      ) : null}
      <div style={{height: 12}} />
    </div>
  );
}

              {slots.slice(0, 12).map(t => (

/* ───────────────────────── 21. ЗАПИСЬ ─────────────────────────
   Карточка одной записи: что за сеанс, и что с ним можно сделать. */

function ApptPage({db, id, back, go, openEdit}){
  const a = db.appts.find(x => x.id === id);
  if (!a) return <Empty icon="calendar" title="Запись не найдена" action={<button className="btn" onClick={back}>Назад</button>} />;
  const c = clientById(db, a.clientId) || {name: 'Клиент'};
  const st = clientStats(db, a.clientId);
  const sub = subOf(db, a.clientId);
  const note = db.notes.find(n => n.clientId === a.clientId);
  const past = a.date < iso(new Date());
  const remind = 'Здравствуйте, ' + firstName(c.name) + '! Напоминаю: ' + relDay(a.date).toLowerCase() +
    ' в ' + a.time + ' — ' + serviceName(db, a.serviceId).toLowerCase() + '. До встречи!';

  return (
    <div className="screen">
      <div className="top-bar left">
        <BackBtn onClick={back} />
        <span style={{flex: 1}} />
        {a.status !== 'done' ? <button className="link" onClick={() => { tap(); openEdit(a); }}>Изменить</button> : null}
      </div>

      <div className="card pad" style={{background: 'var(--violet-soft)', border: 0}}>
        <div style={{fontSize: 13, color: 'var(--violet-ink)', fontWeight: 600}}>
          {a.status === 'done' ? 'Проведён' : a.status === 'pending' ? 'Заявка с сайта'
            : a.status === 'canceled' ? 'Отменён' : relDay(a.date) + ', ' + a.time}
        </div>
        <div style={{display: 'flex', alignItems: 'center', gap: 12, marginTop: 12}}>
          <Avatar name={c.name} src={c.avatar} size={52} />
          <button style={{flex: 1, minWidth: 0}} onClick={() => go({k: 'client', id: a.clientId})}>
            <div style={{fontSize: 19, fontWeight: 600, letterSpacing: '-.01em'}} className="cut">{c.name}</div>
            <div style={{fontSize: 14, color: 'var(--ink-2)'}}>{c.phone}</div>
          </button>
          <span className="chev"><Icon n="chev" s={18} /></span>
        </div>
      </div>

      <div className="card pad">
        <div className="kv"><span className="kv-k">Услуга</span><span className="kv-v">{serviceName(db, a.serviceId)}</span></div>
        <div className="kv"><span className="kv-k">Дата</span><span className="kv-v">{dateLabel(a.date)}</span></div>
        <div className="kv"><span className="kv-k">Время</span><span className="kv-v num">{a.time} – {hhmm(mins(a.time) + a.dur)}</span></div>
        <div className="kv"><span className="kv-k">Длительность</span><span className="kv-v">{durLabel(a.dur)}</span></div>
        <div className="kv"><span className="kv-k">Стоимость</span><span className="kv-v num">{a.pay === 'sub' ? 'Абонемент' : money(a.price)}</span></div>
        {sub ? <div className="kv"><span className="kv-k">Абонемент клиента</span><span className="kv-v acc">{sub.used} из {sub.total}</span></div> : null}
        <div className="kv"><span className="kv-k">Всего сеансов у клиента</span><span className="kv-v num">{st.total}</span></div>
      </div>

      {note ? (
        <div className="card pad">
          <div style={{fontSize: 13, color: 'var(--ink-2)', marginBottom: 6}}>Прошлая заметка · {dateShort(note.date)}</div>
          <div style={{fontSize: 15}}>{note.state}</div>
          {note.zoneText || (note.zones || []).length ? (
            <div style={{fontSize: 14, color: 'var(--ink-2)', marginTop: 6}}>
              Зоны: {note.zoneText || note.zones.map(zoneName).join(', ')}
            </div>
          ) : null}
          {note.next ? <div style={{fontSize: 14, color: 'var(--violet-ink)', marginTop: 8, fontWeight: 500}}>{note.next}</div> : null}
        </div>
      ) : null}

      {a.status === 'pending' ? (
        <div className="btns">
          <button className="btn pri" onClick={() => { tap(); Act.setStatus(a.id, 'planned'); say('Заявка подтверждена'); }}>
            <Icon n="check" />Подтвердить
          </button>
          <button className="btn ghost" onClick={() => { tap(); Act.setStatus(a.id, 'canceled'); say('Заявка отклонена'); back(); }}>Отклонить</button>
        </div>
      ) : a.status === 'planned' ? (
        <Fragment>
          <button className="btn pri" onClick={() => { tap(14); go({k: 'session', id: a.id}); }}>
            <Icon n="play" />{past ? 'Провести сеанс' : 'Начать сеанс'}
          </button>
          <div style={{height: 10}} />
          <div className="btns">
            <a className="btn" href={'sms:' + String(c.phone || '').replace(/\s/g, '') + '?body=' + encodeURIComponent(remind)}>
              <Icon n="chat" />Напомнить
            </a>
            <button className="btn ghost" onClick={() => { tap(); Act.setStatus(a.id, 'canceled'); say('Сеанс отменён'); back(); }}>Отменить</button>
          </div>
        </Fragment>
      ) : a.status === 'canceled' ? (
        <button className="btn" onClick={() => { tap(); Act.setStatus(a.id, 'planned'); say('Сеанс восстановлен'); }}>Вернуть в расписание</button>
      ) : (
        <Fragment>
          <button className="btn soft" onClick={() => { tap(); go({k: 'client', id: a.clientId}); }}><Icon n="users" />Карточка клиента</button>
          <div style={{height: 10}} />
          <button className="btn ghost" onClick={() => { tap(); go({k: 'body', id: a.clientId}); }}><Icon n="body" />Карта тела</button>
        </Fragment>
      )}
      <div style={{height: 14}} />
    </div>
  );
}

/* ───────────────────────── 22. ФОРМЫ ─────────────────────────
   Форма — всегда шторка снизу: рука уже внизу экрана, туда и приходит
   интерфейс. Полей минимум, остальное подставляется само. */

function ApptForm({open, onClose, db, init}){
  const base = init || {};
  const [clientId, setClientId] = useState(base.clientId || (db.clients[0] || {}).id);
  const [serviceId, setServiceId] = useState(base.serviceId || (db.services[0] || {}).id);
  const [date, setDate] = useState(base.date || iso(new Date()));
  const [time, setTime] = useState(base.time || '');
  const sv = serviceById(db, serviceId);
  const slots = useMemo(() => freeStarts(db, date, sv ? sv.dur : 60), [db, date, serviceId]);
  const busy = time && overlaps(db, date, time, sv ? sv.dur : 60, base.id);

  if (!open) return null;
  const save = () => {
    if (!clientId) return say('Сначала добавьте клиента');
    if (!time) return say('Выберите время');
    Act.saveAppt({
      id: base.id, clientId, serviceId, date, time,
      dur: sv.dur, price: sv.price, status: base.status === 'done' ? 'done' : (base.status || 'planned'),
      source: base.source || 'pro',
    });
    tap(12);
    say(base.id ? 'Запись обновлена' : 'Клиент записан на ' + relDay(date).toLowerCase() + ', ' + time);
    onClose();
  };

  return (
    <Sheet open={open} onClose={onClose} wide title={base.id ? 'Изменить запись' : 'Новая запись'}
           sub={base.id ? null : 'Клиент, услуга и время — больше ничего не нужно'}>
      <Field label="Клиент">
        <select className="inp" value={clientId} onChange={e => setClientId(e.target.value)}>
          {db.clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </Field>
      <Field label="Услуга">
        <select className="inp" value={serviceId} onChange={e => setServiceId(e.target.value)}>
          {db.services.filter(s => s.on || s.id === serviceId).map(s => (
            <option key={s.id} value={s.id}>{s.name} · {s.dur} мин · {s.price} ₴</option>
          ))}
        </select>
      </Field>
      <Field label="Дата"><Input type="date" value={date} onChange={e => setDate(e.target.value)} /></Field>
      <Field label="Время" hint={busy ? 'В это время уже есть сеанс' : slots.length ? 'Свободные окна с учётом перерыва' : 'В этот день вы не работаете — время можно поставить вручную'}>
        <div className="chips" style={{marginBottom: 10}}>
          {slots.slice(0, 14).map(t => (
            <button key={t} className={'chip' + (t === time ? ' on' : '')} onClick={() => { tap(); setTime(t); }}>{t}</button>
          ))}
        </div>
        <Input type="time" value={time} onChange={e => setTime(e.target.value)} />
      </Field>
      <div className="kv"><span className="kv-k">Стоимость</span><span className="kv-v num">{money(sv ? sv.price : 0)}</span></div>
      <div style={{height: 14}} />
      <button className="btn pri" onClick={save} disabled={!!busy}>{base.id ? 'Сохранить' : 'Записать'}</button>
      {base.id ? (
        <Fragment>
          <div style={{height: 8}} />
          <button className="btn dan" onClick={() => { tap(); Act.delAppt(base.id); say('Запись удалена'); onClose(); }}>Удалить запись</button>
        </Fragment>
      ) : null}
      <div style={{height: 10}} />
    </Sheet>
  );
}

function ClientForm({open, onClose, db, init}){
  const base = init || {};
  const [name, setName] = useState(base.name || '');
  const [phone, setPhone] = useState(base.phone || '');
  const [email, setEmail] = useState(base.email || '');
  const [pref, setPref] = useState(base.pref || (db.services[0] || {}).id);
  const [note, setNote] = useState(base.note || '');
  const [del, setDel] = useState(false);
  if (!open) return null;

  const save = () => {
    if (name.trim().length < 2) return say('Как зовут клиента?');
    if (phone && !isPhone(phone)) return say('Проверьте номер телефона');
    if (email && !isEmail(email)) return say('Проверьте почту');
    Act.saveClient({
      id: base.id, name: name.trim(), phone: phone.trim(), email: email.trim(),
      pref, dur: serviceById(db, pref).dur, note: note.trim(),
    });
    tap(12);
    say(base.id ? 'Изменения сохранены' : firstName(name) + ' в базе');
    onClose();
  };

  return (
    <Sheet open={open} onClose={onClose} wide title={base.id ? 'Клиент' : 'Новый клиент'}
           sub={base.id ? null : 'Имя обязательно, остальное можно позже'}>
      <Field label="Имя и фамилия"><Input value={name} onChange={e => setName(e.target.value)} placeholder="Мария Иванова" /></Field>
      <Field label="Телефон">
        <Input value={phone} onChange={e => setPhone(e.target.value)} onBlur={e => setPhone(phoneMask(e.target.value))}
               inputMode="tel" placeholder="+380 50 123 45 67" />
      </Field>
      <Field label="Почта"><Input value={email} onChange={e => setEmail(e.target.value)} inputMode="email" placeholder="maria@gmail.com" /></Field>
      <Field label="Предпочтительный массаж">
        <select className="inp" value={pref} onChange={e => setPref(e.target.value)}>
          {db.services.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </Field>
      <Field label="Личное правило" hint="То, что важно помнить перед сеансом">
        <textarea className="inp" style={{minHeight: 80}} value={note} onChange={e => setNote(e.target.value)}
                  placeholder="Не любит сильное давление на шею" />
      </Field>
      <button className="btn pri" onClick={save}>{base.id ? 'Сохранить' : 'Добавить клиента'}</button>
      {base.id ? (
        <Fragment>
          <div style={{height: 8}} />
          {del ? (
            <button className="btn dan" onClick={() => { Act.delClient(base.id); say('Клиент удалён'); onClose(); }}>
              Точно удалить — вместе с историей
            </button>
          ) : (
            <button className="btn ghost" onClick={() => { tap(); setDel(true); }}>Удалить клиента</button>
          )}
        </Fragment>
      ) : null}
      <div style={{height: 10}} />
    </Sheet>
  );
}

function ServiceForm({open, onClose, init}){
  const base = init || {};
  const [name, setName] = useState(base.name || '');
  const [dur, setDur] = useState(base.dur || 60);
  const [price, setPrice] = useState(base.price || 1000);
  const [on, setOn] = useState(base.on !== false);
  if (!open) return null;
  return (
    <Sheet open={open} onClose={onClose} title={base.id ? 'Услуга' : 'Новая услуга'}>
      <Field label="Название"><Input value={name} onChange={e => setName(e.target.value)} placeholder="Классический массаж" /></Field>
      <div style={{display: 'flex', gap: 12}}>
        <Field label="Минут"><Input type="number" value={dur} onChange={e => setDur(Number(e.target.value))} inputMode="numeric" /></Field>
        <Field label="Цена, ₴"><Input type="number" value={price} onChange={e => setPrice(Number(e.target.value))} inputMode="numeric" /></Field>
      </div>
      <div className="kv"><span className="kv-k">Показывать в онлайн-записи</span><Switch on={on} onChange={setOn} /></div>
      <div style={{height: 14}} />
      <button className="btn pri" onClick={() => {
        if (name.trim().length < 2) return say('Как называется услуга?');
        Act.saveService({id: base.id, name: name.trim(), dur: clamp(dur, 15, 240), price: Math.max(0, price), on});
        say('Услуга сохранена'); onClose();
      }}>Сохранить</button>
      {base.id ? (
        <Fragment>
          <div style={{height: 8}} />
          <button className="btn ghost" onClick={() => { Act.delService(base.id); say('Услуга удалена'); onClose(); }}>Удалить</button>
        </Fragment>
      ) : null}
      <div style={{height: 10}} />
    </Sheet>

function SubForm({open, onClose, db, client}){
  const [clientId, setClientId] = useState(client || (db.clients[0] || {}).id);
  const [plan, setPlan] = useState(10);
  const [total, setTotal] = useState(10);
  const [serviceId, setServiceId] = useState((db.services[0] || {}).id);
  const sv = serviceById(db, serviceId);
  const n = plan === 0 ? total : plan;
  /* абонемент выгоднее разовых: 10% скидки — иначе в нём нет смысла */
  const price = Math.round(n * (sv ? sv.price : 0) * 0.9);
  if (!open) return null;
  return (
    <Sheet open={open} onClose={onClose} wide title="Новый абонемент" sub="Клиент платит вперёд и возвращается по расписанию">
      <Field label="Клиент">
        <select className="inp" value={clientId} onChange={e => setClientId(e.target.value)}>
          {db.clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </Field>
      <Field label="Услуга">
        <select className="inp" value={serviceId} onChange={e => setServiceId(e.target.value)}>
          {db.services.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </Field>
      <Field label="Сколько сеансов">
        <Chips items={SUB_PLANS.map(p => ({k: p.k, n: p.n}))} value={plan} onChange={setPlan} />
      </Field>
      {plan === 0 ? (
        <Field label="Количество"><Input type="number" value={total} onChange={e => setTotal(Number(e.target.value))} inputMode="numeric" /></Field>
      ) : null}
      <div className="card pad" style={{background: 'var(--violet-soft)', border: 0}}>
        <div className="kv"><span className="kv-k">Сеансов</span><span className="kv-v num">{n}</span></div>
        <div className="kv"><span className="kv-k">Без абонемента</span><span className="kv-v num">{money(n * (sv ? sv.price : 0))}</span></div>
        <div className="kv"><span className="kv-k">Цена абонемента</span><span className="kv-v acc num">{money(price)}</span></div>
      </div>
      <div style={{height: 14}} />
      <button className="btn pri" onClick={() => {
        if (!clientId) return say('Сначала добавьте клиента');
        if (n < 2) return say('В абонементе должно быть хотя бы два сеанса');
        Act.addSub({clientId, serviceId, total: n, price, ends: iso(addDays(new Date(), 90))});
        tap(12); say('Абонемент на ' + n + ' ' + sessWord(n) + ' создан'); onClose();
      }}>Создать абонемент</button>
      <div style={{height: 10}} />
    </Sheet>
  );
}

/* быстрая оплата: провели сеанс без записи — деньги не теряются */
function PayForm({open, onClose, db}){
  const [clientId, setClientId] = useState((db.clients[0] || {}).id);
  const [serviceId, setServiceId] = useState((db.services[0] || {}).id);
  const [pay, setPay] = useState('cash');
  const sv = serviceById(db, serviceId);
  const [price, setPrice] = useState(sv ? sv.price : 0);
  useEffect(() => { setPrice(sv ? sv.price : 0); }, [serviceId]);
  if (!open) return null;
  return (
    <Sheet open={open} onClose={onClose} title="Оплата" sub="Сеанс уже прошёл — запишем его задним числом">
      <Field label="Клиент">
        <select className="inp" value={clientId} onChange={e => setClientId(e.target.value)}>
          {db.clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </Field>
      <Field label="Услуга">
        <select className="inp" value={serviceId} onChange={e => setServiceId(e.target.value)}>
          {db.services.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </Field>
      <Field label="Сумма, ₴"><Input type="number" value={price} onChange={e => setPrice(Number(e.target.value))} inputMode="numeric" /></Field>
      <Field label="Чем платит"><Seg items={PAY_KINDS.map(p => ({k: p.k, n: p.n}))} value={pay} onChange={setPay} /></Field>
      <button className="btn pri" onClick={() => {
        if (!clientId) return say('Сначала добавьте клиента');
        const now = new Date();
        const id = uid('ap');
        Act.saveAppt({
          id, clientId, serviceId, date: iso(now), time: hhmm(nowMins(now) - (sv ? sv.dur : 60)),
          dur: sv ? sv.dur : 60, price: Math.max(0, price), status: 'planned',
        });
        Act.finish(id, {pay, zones: [], levels: {}});
        tap(12); say('Оплата записана · ' + money(price)); onClose();
      }}>Записать оплату</button>
      <div style={{height: 10}} />
    </Sheet>
  );
}

/* ───────────────────────── 23. ОБОЛОЧКА ─────────────────────────
   Пять кнопок внизу, стек экранов сверху. Центральная «+» — самое
   заметное действие в приложении: из неё начинается всё остальное. */

function PlusSheet({open, onClose, db, onPick}){
  const items = [
    {k: 'appt',   n: 'Новая запись',   s: 'Клиент, услуга, время',      i: 'calendar', bg: 'var(--pa-schedule)', c: 'var(--pa-schedule-ink)'},
    {k: 'client', n: 'Новый клиент',   s: 'Добавить в базу',            i: 'users',    bg: 'var(--pa-clients)',  c: 'var(--pa-clients-ink)'},
    {k: 'session', n: 'Новый сеанс',   s: 'Начать прямо сейчас',        i: 'play',     bg: 'var(--violet-soft)', c: 'var(--violet-ink)'},
    {k: 'pay',    n: 'Добавить оплату', s: 'Сеанс уже прошёл',          i: 'wallet',   bg: 'var(--pa-income)',   c: 'var(--pa-income-ink)'},
  ];
  return (
    <Sheet open={open} onClose={onClose} title="Что добавим?">
      <div className="sheet-acts">
        {items.map(i => (
          <button key={i.k} className="sa" onClick={() => { tap(); onPick(i.k); }}>
            <span className="sa-ic" style={{background: i.bg, color: i.c}}><Icon n={i.i} /></span>
            <span style={{flex: 1}}>
              <span className="sa-t" style={{display: 'block'}}>{i.n}</span>
              <span className="sa-s">{i.s}</span>
            </span>
            <span className="chev"><Icon n="chev" s={18} /></span>
          </button>
        ))}
      </div>
      <div style={{height: 8}} />
    </Sheet>
  );
}

const TABS = [
  {k: 'home', n: 'Главная', i: 'home'},
  {k: 'clients', n: 'Клиенты', i: 'users'},
  {k: 'plus'},
  {k: 'schedule', n: 'Расписание', i: 'calendar'},
  {k: 'more', n: 'Ещё', i: 'more'},
];
const ROOT = ['home', 'clients', 'schedule', 'more'];

function TabBar({tab, onTab, onPlus}){
  return (
    <nav className="tabs">
      {TABS.map((t, i) => t.k === 'plus' ? (
        <button key="plus" className="tab-plus" onClick={() => { tap(12); onPlus(); }} aria-label="Добавить">
          <i><Icon n="plus" /></i>
        </button>
      ) : (
        <button key={t.k} className={'tab' + (tab === t.k ? ' on' : '')} onClick={() => { tap(); onTab(t.k); }}>
          <Icon n={t.i} /><span>{t.n}</span>
        </button>
      ))}
    </nav>
  );
}

function applyTheme(theme){
  if (typeof document === 'undefined') return;
  document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
  const meta = document.getElementById('metaTheme');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0F0E15' : '#FAFAFC');
}

function App(){
  const db = useDB();
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]);
  const [date, setDate] = useState(() => iso(new Date()));
  const [sheet, setSheet] = useState(null);
  const page = stack[stack.length - 1] || null;

  useEffect(() => { applyTheme(db.settings.theme); }, [db.settings.theme]);
  /* новый экран начинается сверху, а не с той же прокрутки, что прошлый */
  useEffect(() => { window.scrollTo(0, 0); }, [tab, stack.length]);

  const go = useCallback((route) => {
    if (!route) return;
    if (ROOT.includes(route.k)){
      if (route.date) setDate(route.date);
      setStack([]);
      setTab(route.k);
      return;
    }
    setStack(s => [...s, route]);
  }, []);
  const back = useCallback(() => setStack(s => s.slice(0, -1)), []);
  const onTab = useCallback((k) => { setStack([]); setTab(k); }, []);

  const openAppt = (init) => setSheet({k: 'appt', init});
  const openClient = (init) => setSheet({k: 'client', init});

  const plusPick = (k) => {
    setSheet(null);
    if (k === 'appt') return setSheet({k: 'appt', init: {date}});
    if (k === 'client') return setSheet({k: 'client', init: null});
    if (k === 'pay') return setSheet({k: 'pay'});
    if (k === 'session'){
      const now = new Date();
      const live = runningAppt(db, now) || dayAppts(db, iso(now)).find(a => a.status === 'planned');
      if (live) return go({k: 'session', id: live.id});
      say('На сегодня записей нет — создайте запись');
      return setSheet({k: 'appt', init: {date: iso(now)}});
    }
  };

  let body;
  if (page && page.k === 'client') body = <ClientPage db={db} id={page.id} go={go} back={back} openEdit={openClient} openAppt={openAppt} openNote={(id) => setSheet({k: 'note', id})} />;
  else if (page && page.k === 'body') body = <BodyMap db={db} id={page.id} back={back} go={go} />;
  else if (page && page.k === 'session') body = <SessionScreen db={db} id={page.id} back={back} go={go} />;
  else if (page && page.k === 'appt') body = <ApptPage db={db} id={page.id} back={back} go={go} openEdit={openAppt} />;
  else if (page && page.k === 'income') body = <Income db={db} back={back} />;
  else if (page && page.k === 'analytics') body = <Analytics db={db} back={back} go={go} />;
  else if (page && page.k === 'subs') body = <Subs db={db} back={back} go={go} client={page.client} openNew={(c) => setSheet({k: 'sub', client: c})} />;
  else if (page && page.k === 'settings') body = <Settings db={db} back={back} go={go} openService={(sv) => setSheet({k: 'service', init: sv})} />;
  else if (page && page.k === 'booking') body = <Booking db={db} back={back} openAppt={openAppt} />;
  else if (page && page.k === 'notifs') body = <Notifs db={db} back={back} go={go} />;
  else if (tab === 'clients') body = <Clients db={db} go={go} openNewClient={() => openClient(null)} />;
  else if (tab === 'schedule') body = <Schedule db={db} go={go} date={date} setDate={setDate} openNew={(d) => openAppt({date: d})} />;
  else if (tab === 'more') body = <More db={db} go={go} />;
  else body = <Home db={db} go={go} today={iso(new Date())} />;

  return (
    <div className="app">
      <div className="scroll">{body}</div>

        {tab === 'schedule' && !page ? (
          <button className="fab" onClick={() => { tap(12); openAppt({date}); }} aria-label="Новая запись"><Icon n="plus" /></button>
        ) : null}

        <TabBar tab={tab} onTab={onTab} onPlus={() => setSheet({k: 'plus'})} />

        <PlusSheet open={!!sheet && sheet.k === 'plus'} onClose={() => setSheet(null)} db={db} onPick={plusPick} />
        <ApptForm open={!!sheet && sheet.k === 'appt'} onClose={() => setSheet(null)} db={db} init={sheet && sheet.init} />
        <ClientForm open={!!sheet && sheet.k === 'client'} onClose={() => setSheet(null)} db={db} init={sheet && sheet.init} />
        <ServiceForm open={!!sheet && sheet.k === 'service'} onClose={() => setSheet(null)} init={sheet && sheet.init} />
        <SubForm open={!!sheet && sheet.k === 'sub'} onClose={() => setSheet(null)} db={db} client={sheet && sheet.client} />
        <PayForm open={!!sheet && sheet.k === 'pay'} onClose={() => setSheet(null)} db={db} />
      <NoteSheet open={!!sheet && sheet.k === 'note'} onClose={() => setSheet(null)} db={db} clientId={sheet && sheet.id} />
      <ToastHost />
    </div>
  );
}

/* ── запуск ───────────────────────────────────────────────────────
   Короткий скелет вместо белого экрана: за это время база читается с
   диска, и приложение открывается уже с данными. */
function Boot(){
  const [ready, setReady] = useState(false);
  useEffect(() => {
    Store.init();
    applyTheme(Store.state.settings.theme);
    const t = setTimeout(() => setReady(true), 420);
    return () => clearTimeout(t);
  }, []);
  if (!ready) return (
    <div className="app"><div className="scroll">
      <div className="top">
        <div style={{flex: 1}}>
          <div className="sk line" style={{width: 110}} />
          <div className="sk line" style={{width: 160, height: 24}} />
        </div>
        <div className="sk" style={{width: 44, height: 44, borderRadius: 22}} />
      </div>
      <Skeleton />
    </div></div>
  );
  return <App />;
}

const root = typeof document !== 'undefined' ? document.getElementById('root') : null;
if (root && typeof ReactDOM !== 'undefined' && ReactDOM.createRoot) ReactDOM.createRoot(root).render(<Boot />);
</script>
</body>
</html>
