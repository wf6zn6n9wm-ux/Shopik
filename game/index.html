<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Найди предметы — игра-искалка</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Найди предметы" />
<meta name="theme-color" content="#1b1030" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231b1030'/%3E%3Ccircle cx='78' cy='78' r='34' fill='none' stroke='%23f8c14a' stroke-width='12'/%3E%3Cpath d='M104 104l34 34' stroke='%23f8c14a' stroke-width='16' stroke-linecap='round'/%3E%3C/svg%3E" />

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#160c26; --bg2:#1e123a;
    --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --ink:#f4eefb; --muted:rgba(244,238,251,.6); --muted2:rgba(244,238,251,.38);
    --gold:#f8c14a; --gold2:#f0a52e;
    --violet:#a97bff; --pink:#ff6fae; --green:#4ade80; --red:#ff6b6b; --sky:#5ec8ff;
    --grad:linear-gradient(135deg,#a97bff,#ff6fae);
    --grad-gold:linear-gradient(135deg,#f8c14a,#f0a52e);
    --tray-h:118px;
  }
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Color Emoji","Apple Color Emoji",sans-serif;
    background:var(--bg); color:var(--ink);
    overflow:hidden; overscroll-behavior:none; user-select:none; -webkit-user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column}
  .hide{display:none !important}

  /* ============ MENU (стиль Journey) ============ */
  #menu{position:absolute; inset:0; display:flex; flex-direction:column; background:#f3e8d2; overflow:hidden}
  .m-header{
    position:relative; flex:none; z-index:1; overflow:hidden;
    padding:calc(env(safe-area-inset-top) + 16px) 18px 44px;
    background:linear-gradient(180deg,#8b62dd 0%,#7a4fd0 100%);
    display:flex; align-items:center; gap:12px;
  }
  .m-header .spark{position:absolute; color:rgba(255,255,255,.75); pointer-events:none; text-shadow:0 0 8px rgba(255,255,255,.4)}
  .m-avatar{
    width:58px;height:58px;flex:none;border-radius:14px;background:#f3e8d2;border:3px solid #fff;
    display:grid;place-items:center;font-size:32px; box-shadow:0 4px 0 rgba(0,0,0,.15); z-index:2;
  }
  .m-logo{
    flex:1; text-align:center; z-index:2;
    font-family:'Comic Sans MS','Chalkboard SE','Segoe Print',system-ui,cursive;
    font-size:38px; font-weight:800; color:#ffd36b; transform:rotate(-3deg); line-height:1;
    text-shadow:2px 0 #a45a12,-2px 0 #a45a12,0 2px #a45a12,0 -2px #a45a12,2px 2px #a45a12,-2px 2px 0 #a45a12,0 5px 0 #7a3f0c;
  }
  .m-gear{
    width:54px;height:54px;flex:none;border:none;border-radius:50%;background:#fff;color:#5a4a2a;font-size:24px;
    display:grid;place-items:center;cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.15); z-index:2;
  }
  .m-gear:active{transform:translateY(2px)}
  .m-body{
    position:relative; flex:1; margin-top:-26px; background:#f3e8d2; border-radius:26px 26px 0 0;
    overflow-y:auto; -webkit-overflow-scrolling:touch; padding:26px 0 16px; z-index:2;
  }
  .m-tab{
    display:inline-block; margin:0 0 14px 18px; background:#fff; border:2px solid #e0d3b4; border-bottom:none;
    padding:8px 20px; border-radius:14px 14px 0 0; font-weight:800; color:#4a3d6b; font-size:15px;
    box-shadow:0 -2px 6px rgba(0,0,0,.04);
  }
  .m-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:0 16px}
  .card{
    position:relative; text-align:left; background:#fffdf6; border:2.5px solid #e2d6b8; border-radius:20px;
    padding:0 0 12px; cursor:pointer; overflow:hidden; box-shadow:0 4px 0 rgba(120,95,45,.16);
    transition:transform .1s ease; color:inherit; display:flex; flex-direction:column;
  }
  .card:active{transform:translateY(2px)}
  .card.locked{cursor:default; box-shadow:0 4px 0 rgba(120,95,45,.1)}
  .card-top{padding:12px 8px 8px; text-align:center}
  .card-top h3{margin:0; font-size:15.5px; font-weight:800; color:#2c2348}
  .card-top p{margin:2px 0 0; font-size:11.5px; font-weight:700; color:#9186ac}
  .card-thumb{position:relative; margin:0 10px; height:118px; border-radius:14px; overflow:hidden; border:2px solid rgba(30,20,50,.14)}
  .card-thumb .te{position:absolute; transform:translate(-50%,-50%); filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
  .card-badge{position:absolute; top:7px; left:7px; z-index:3; font-size:17px; background:#fff; border-radius:8px;
    padding:1px 6px; box-shadow:0 2px 4px rgba(0,0,0,.2); border:1.5px solid rgba(0,0,0,.08)}
  .card-lock{position:absolute; inset:0; z-index:4; background:rgba(24,18,40,.5); display:grid; place-items:center; color:#fff; font-size:34px}
  .card-counter{position:absolute; left:50%; bottom:8px; transform:translateX(-50%); z-index:3;
    background:#fff; border:2px solid rgba(0,0,0,.1); border-radius:11px; padding:3px 14px;
    font-weight:800; font-size:13px; color:#2c2348; box-shadow:0 2px 5px rgba(0,0,0,.25)}
  .card-foot{padding:10px 10px 0}
  .play{
    display:block; width:100%; border:none; cursor:pointer; border-radius:13px; padding:11px; font-size:15.5px; font-weight:800;
    color:#fff; background:linear-gradient(180deg,#84df5f,#57c22f); box-shadow:0 3px 0 #3d9421; text-shadow:0 1px 1px rgba(0,0,0,.2);
  }
  .play:active{transform:translateY(2px); box-shadow:0 1px 0 #3d9421}
  .locked-text{text-align:center; font-size:12.5px; font-weight:800; color:#9d9070; line-height:1.35; padding:6px 6px 2px}
  .card-stars{display:flex; justify-content:center; gap:3px; margin-top:8px; font-size:14px}
  .card-stars i{filter:grayscale(1) opacity(.28); font-style:normal}
  .card-stars i.on{filter:none}
  .m-nav{
    flex:none; display:flex; align-items:flex-end; justify-content:space-around;
    background:#eaddc0; border-top:2px solid #d8c9a4; padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
  }
  .m-nav button{border:none; background:none; cursor:pointer; font-size:24px; color:#8a7c58;
    display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 8px; border-radius:12px}
  .m-nav button:active{background:rgba(0,0,0,.05)}
  .m-nav .center{
    background:#fff; margin-top:-26px; border:2.5px solid #d8c9a4; border-radius:18px; padding:8px 18px;
    font-size:30px; box-shadow:0 5px 12px rgba(0,0,0,.15);
  }
  .m-nav .center span{font-size:12px; font-weight:800; color:#2c2348}

  /* ============ GAME ============ */
  #game{position:absolute; inset:0; display:flex; flex-direction:column; background:#0d0718}
  .topbar{
    position:relative; z-index:6; display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
    background:linear-gradient(180deg, rgba(13,7,24,.92), rgba(13,7,24,.55) 70%, transparent);
  }
  .icon-btn{
    width:42px;height:42px;flex:none;border:none;border-radius:14px;background:rgba(255,255,255,.1);
    color:var(--ink); font-size:19px; display:grid;place-items:center; cursor:pointer; backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.12);
  }
  .icon-btn:active{transform:scale(.92)}
  .topmid{flex:1; text-align:center; min-width:0}
  .topmid .t{font-size:14.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .topmid .pbar{height:6px; border-radius:99px; background:rgba(255,255,255,.12); margin-top:6px; overflow:hidden}
  .topmid .pfill{height:100%; width:0; background:var(--grad-gold); border-radius:99px; transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .chip-time{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:58px; padding:5px 10px; border-radius:12px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
  }
  .chip-time b{font-size:15px; font-variant-numeric:tabular-nums; font-weight:800}
  .chip-time span{font-size:9px; color:var(--muted); letter-spacing:.1em}

  #viewport{position:relative; flex:1; overflow:hidden; touch-action:none; background:#0d0718}
  #world{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform}
  .amb{position:absolute; pointer-events:none; transform:translate(-50%,-50%); filter:blur(.4px)}
  .obj{
    position:absolute; transform:translate(-50%,-50%) rotate(var(--r)); border:none; background:none; padding:0; margin:0;
    line-height:1; cursor:pointer; filter:drop-shadow(0 3px 4px rgba(0,0,0,.45)); transition:opacity .25s, transform .25s;
  }
  .obj.found{opacity:.25; filter:grayscale(1) drop-shadow(0 0 0 transparent); pointer-events:none}
  .obj.hintpulse{animation:hintpulse 1.1s ease-in-out 2}
  @keyframes hintpulse{0%,100%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}50%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.55)}}
  .ring{position:absolute; width:10px;height:10px;border-radius:50%; pointer-events:none; transform:translate(-50%,-50%); z-index:50}
  .ring.good{box-shadow:0 0 0 3px var(--green); animation:ringpop .55s ease-out forwards}
  .ring.bad{box-shadow:0 0 0 3px var(--red); animation:ringpop .45s ease-out forwards}
  @keyframes ringpop{0%{opacity:1;width:10px;height:10px}100%{opacity:0;width:120px;height:120px}}
  .flabel{position:absolute; transform:translate(-50%,-50%); pointer-events:none; z-index:60;
    background:rgba(20,10,36,.9); border:1px solid var(--line); color:#fff; font-size:12px; font-weight:700;
    padding:4px 9px; border-radius:99px; white-space:nowrap; animation:floatup 1s ease-out forwards}
  @keyframes floatup{0%{opacity:0; margin-top:6px}20%{opacity:1}100%{opacity:0; margin-top:-26px}}

  .fabs{position:absolute; right:12px; bottom:calc(var(--tray-h) + 14px); z-index:6; display:flex; flex-direction:column; gap:12px}
  .fab{
    width:56px;height:56px;border-radius:18px;border:none;cursor:pointer; position:relative;
    display:grid;place-items:center; font-size:23px; color:#3a2409;
    background:var(--grad-gold); box-shadow:0 10px 24px -8px rgba(248,193,74,.8);
  }
  .fab.ghost{background:rgba(255,255,255,.12); color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,.14)}
  .fab:active{transform:scale(.93)}
  .fab .badge{position:absolute; top:-6px; right:-6px; min-width:22px;height:22px;padding:0 5px;border-radius:11px;
    background:var(--red); color:#fff; font-size:12px; font-weight:800; display:grid;place-items:center; border:2px solid #0d0718}

  .tray{
    position:relative; z-index:6; height:var(--tray-h); flex:none;
    background:linear-gradient(180deg, rgba(13,7,24,.4), #14092a 40%);
    border-top:1px solid rgba(255,255,255,.08);
    padding:10px 0 calc(env(safe-area-inset-bottom) + 8px);
  }
  .tray-scroll{display:flex; gap:10px; overflow-x:auto; padding:0 14px; height:100%; align-items:center; scrollbar-width:none}
  .tray-scroll::-webkit-scrollbar{display:none}
  .tcard{
    flex:none; width:72px; height:88px; border-radius:16px; background:var(--card); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; position:relative;
    transition:transform .2s, opacity .3s;
  }
  .tcard .e{font-size:32px; line-height:1}
  .tcard .nm{font-size:10px; color:var(--muted); max-width:66px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tcard .cnt{position:absolute; top:-7px; right:-7px; min-width:24px;height:24px;padding:0 5px;border-radius:12px;
    background:var(--grad); color:#fff; font-size:13px; font-weight:800; display:grid;place-items:center; border:2px solid #14092a}
  .tcard.done{opacity:.45}
  .tcard.done .e{filter:grayscale(1)}
  .tcard.done .cnt{background:var(--green); font-size:12px}
  .tcard.bump{transform:translateY(-6px) scale(1.06)}

  /* ============ MODAL ============ */
  .overlay{position:absolute; inset:0; z-index:20; background:rgba(8,4,16,.72); backdrop-filter:blur(6px);
    display:grid; place-items:center; padding:22px; animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{width:100%; max-width:380px; background:linear-gradient(180deg,#241541,#1a0e30); border:1px solid var(--line);
    border-radius:26px; padding:26px 22px; text-align:center; box-shadow:0 30px 70px -20px rgba(0,0,0,.8)}
  .modal .big{font-size:52px; margin-bottom:6px}
  .modal h2{margin:2px 0 6px; font-size:23px; font-weight:800}
  .modal p{margin:0 0 4px; color:var(--muted); font-size:14px}
  .win-stars{font-size:40px; letter-spacing:6px; margin:14px 0 6px}
  .win-stars i{font-style:normal; filter:grayscale(1) opacity(.3); transition:filter .3s}
  .win-stars i.on{filter:none; animation:starpop .4s ease}
  @keyframes starpop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
  .win-meta{display:flex; gap:10px; margin:14px 0 20px}
  .win-meta .m{flex:1; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:14px; padding:10px}
  .win-meta .m b{display:block; font-size:19px; font-weight:800}
  .win-meta .m span{font-size:11px; color:var(--muted)}
  .btn{display:block; width:100%; border:none; cursor:pointer; border-radius:16px; padding:15px; font-size:16px; font-weight:800;
    color:#3a2409; background:var(--grad-gold); margin-top:10px}
  .btn.sec{background:rgba(255,255,255,.09); color:#fff; border:1px solid var(--line)}
  .btn:active{transform:scale(.98)}
  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--line)}
  .settings-row:last-of-type{border-bottom:none}
  .switch{width:52px;height:30px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;cursor:pointer;transition:.2s;flex:none}
  .switch.on{background:var(--green)}
  .switch b{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
  .switch.on b{left:25px}
  .toast{position:absolute; left:50%; bottom:calc(var(--tray-h) + 30px); transform:translateX(-50%); z-index:15;
    background:rgba(20,10,36,.94); border:1px solid var(--line); color:#fff; padding:10px 16px; border-radius:99px;
    font-size:13.5px; font-weight:600; animation:toast 2s ease forwards; pointer-events:none; white-space:nowrap}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
</style>
</head>
<body>
<div id="app">

  <!-- ===================== MENU ===================== -->
  <section id="menu">
    <div class="m-header">
      <span class="spark" style="top:22%;left:26%;font-size:14px">✦</span>
      <span class="spark" style="top:58%;left:20%;font-size:20px">✦</span>
      <span class="spark" style="top:30%;left:62%;font-size:12px">✦</span>
      <span class="spark" style="top:64%;left:72%;font-size:16px">✦</span>
      <span class="spark" style="top:16%;left:84%;font-size:13px">✦</span>
      <div class="m-avatar">🦫</div>
      <div class="m-logo">Искалка</div>
      <button class="m-gear" id="btn-menu-settings">⚙️</button>
    </div>
    <div class="m-body">
      <div class="m-tab">Классика</div>
      <div class="m-grid" id="levels"></div>
    </div>
    <nav class="m-nav">
      <button data-nav="collection">🔎<span style="font-size:10px">Находки</span></button>
      <button data-nav="shop">🏪<span style="font-size:10px">Магазин</span></button>
      <button class="center" data-nav="home">✈️<span>Главная</span></button>
      <button data-nav="daily">🗓️<span style="font-size:10px">День</span></button>
      <button data-nav="awards">🏅<span style="font-size:10px">Награды</span></button>
    </nav>
  </section>

  <!-- ===================== GAME ===================== -->
  <section id="game" class="hide">
    <div class="topbar">
      <button class="icon-btn" id="btn-home">🏠</button>
      <div class="topmid">
        <div class="t" id="lv-title">—</div>
        <div class="pbar"><div class="pfill" id="pfill"></div></div>
      </div>
      <div class="chip-time"><b id="clock">0:00</b><span id="found-lbl">0/0</span></div>
      <button class="icon-btn" id="btn-settings">⚙️</button>
    </div>

    <div id="viewport">
      <div id="world"></div>
    </div>

    <div class="fabs">
      <button class="fab ghost" id="btn-zoomreset" title="Сбросить масштаб">⤢</button>
      <button class="fab" id="btn-hint" title="Подсказка">🔍<span class="badge" id="hint-badge">3</span></button>
    </div>

    <div class="tray">
      <div class="tray-scroll" id="tray"></div>
    </div>
  </section>

</div>

<script>
"use strict";
/* ------------------------------------------------------------------ */
/* Утилиты                                                            */
/* ------------------------------------------------------------------ */
const $ = s => document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function fmt(s){const m=Math.floor(s/60),ss=s%60;return m+":"+String(ss).padStart(2,"0")}

/* ------------------------------------------------------------------ */
/* Данные сцен                                                        */
/* ------------------------------------------------------------------ */
const WORLD_W = 1000, WORLD_H = 1740;

const SCENES = [
  {
    id:"winter",
    title:"Уютное дупло",
    sub:"Зимний вечер в дереве с белками",
    emoji:"🌰",
    thumbBg:"radial-gradient(120% 120% at 50% 0%,#2a3f6e,#5a3a1e 60%,#3a2412)",
    par:80,
    bg:`
      radial-gradient(120% 55% at 50% 0%, #0e1b3d 0%, #16264f 30%, transparent 62%),
      radial-gradient(100% 60% at 50% 100%, #4a2f16 0%, #3a2412 45%, #241407 100%),
      linear-gradient(180deg,#0c1730 0%,#2c1c10 46%,#1c1108 100%)`,
    ambient:[["❄️",120,80,60,.5],["❄️",860,120,52,.5],["⭐",300,60,40,.7],["⭐",700,180,34,.6],
             ["🌙",90,110,90,.9],["🎄",900,300,120,.5],["🌲",70,340,150,.4],["🪵",500,1400,120,.35]],
    decoys:["🍄","🌲","❄️","🔑","📚","🕰️","🐿️","🦊","🦉","🍎","🫖","🎄","🌟","💡","🪑","🖼️","🧸","🪟","🛷","🧦","🍯","🕸️","🐌","🪺","🍂"],
    targets:[
      {e:"🧣",name:"Шарф",count:3},
      {e:"⛄",name:"Снеговик",count:3},
      {e:"👠",name:"Туфли",count:2},
      {e:"☕",name:"Какао",count:3},
      {e:"🥕",name:"Морковь",count:3},
      {e:"🎁",name:"Подарок",count:4},
      {e:"🕯️",name:"Свеча",count:3},
      {e:"🍪",name:"Печенье",count:3},
    ],
  },
  {
    id:"greece",
    title:"Греческий дворик",
    sub:"Санторини: белые дома и синее море",
    emoji:"🏛️",
    thumbBg:"radial-gradient(120% 120% at 50% 0%,#8fd3ff,#eef4fb 55%,#2b7fc4)",
    par:85,
    bg:`
      radial-gradient(120% 45% at 50% 0%, #7ec8f5 0%, #bfe4fb 35%, transparent 60%),
      radial-gradient(110% 45% at 50% 100%, #1c7fc0 0%, #2b93d1 40%, transparent 75%),
      linear-gradient(180deg,#aee0fb 0%,#e9f3fb 40%,#dfeef8 60%,#2e93cf 100%)`,

const SAVE_KEY = "hidden_object_progress_v1";
let save = load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d&&d.stars)return d}catch(e){}
  return {stars:{}, sound:true};
}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

/* ------------------------------------------------------------------ */
/* Звук                                                               */
/* ------------------------------------------------------------------ */
let AC=null;
function beep(freq,dur,type,vol){
  if(!save.sound)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=freq;
    g.gain.setValueAtTime(0,AC.currentTime);
    g.gain.linearRampToValueAtTime(vol||.15,AC.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(dur||.15));
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+(dur||.15));
  }catch(e){}
}
const sGood=()=>{beep(660,.09,"triangle",.16);setTimeout(()=>beep(990,.12,"triangle",.16),70)};
const sBad =()=>beep(150,.16,"sawtooth",.12);
const sWin =()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.22,"triangle",.16),i*130))};
const sTap =()=>beep(440,.05,"sine",.08);

/* ------------------------------------------------------------------ */
/* Построение расстановки предметов                                   */
/* ------------------------------------------------------------------ */
function buildLayout(scene){
  const rnd = mulberry32(hash(scene.id)+7);
  const placed=[];
  const pad=64, topPad=110, botPad=90;
  function tryPlace(size){
    for(let k=0;k<80;k++){
      const x=pad+rnd()*(WORLD_W-2*pad);
      const y=topPad+rnd()*(WORLD_H-topPad-botPad);
      let ok=true;
      for(const p of placed){
        const md=(size+p.size)*0.42+6;
        if(Math.abs(x-p.x)<md && Math.abs(y-p.y)<md){ok=false;break}
      }
      if(ok)return {x,y,size};
    }
    // запасной вариант — просто где угодно
    return {x:pad+rnd()*(WORLD_W-2*pad), y:topPad+rnd()*(WORLD_H-topPad-botPad), size};
  }
  let id=0;
  const objects=[];
  // цели
  scene.targets.forEach((t,ti)=>{
    for(let i=0;i<t.count;i++){
      const size=44+Math.floor(rnd()*20);
      const pos=tryPlace(size);placed.push(pos);
      objects.push({id:id++, e:t.e, x:pos.x, y:pos.y, size:pos.size,
        rot:(rnd()*40-20), target:ti, found:false});
    }
  });
  // декорации-обманки
  const decoyCount=44;
  for(let i=0;i<decoyCount;i++){
    const e=scene.decoys[Math.floor(rnd()*scene.decoys.length)];
    const size=36+Math.floor(rnd()*26);
    const pos=tryPlace(size);placed.push(pos);
    objects.push({id:id++, e, x:pos.x, y:pos.y, size:pos.size,
      rot:(rnd()*40-20), target:-1, found:false});
  }
  // случайный z-порядок, чтобы предметы частично перекрывались
  objects.forEach(o=>o.z=Math.floor(rnd()*100));
  objects.sort((a,b)=>a.z-b.z);
  return objects;
}

let tickTimer=null;
function startGame(idx){
  const scene=SCENES[idx];
  const objects=buildLayout(scene);
  const remaining=scene.targets.map(t=>t.count);
  const total=remaining.reduce((a,b)=>a+b,0);
  G={idx,scene,objects,remaining,total,found:0,time:0,hints:3,wrongTaps:0,over:false};

  $("#menu").classList.add("hide");
  $("#game").classList.remove("hide");
  $("#lv-title").textContent=scene.title;
  $("#hint-badge").textContent=G.hints;

  // фон
  viewport.style.background=scene.bg;
  const inkFab = scene.ink||"#fff";

  // мир
  world.style.width=WORLD_W+"px";
  world.style.height=WORLD_H+"px";
  world.innerHTML="";
  // ambient
  (scene.ambient||[]).forEach(a=>{
    const [e,x,y,s,o]=a;
    const d=document.createElement("div");
    d.className="amb";d.textContent=e;
    d.style.left=x+"px";d.style.top=y+"px";d.style.fontSize=s+"px";d.style.opacity=o;
    world.appendChild(d);
  });
  // объекты
  objects.forEach(o=>{
    const b=document.createElement("button");
    b.className="obj";b.dataset.id=o.id;
    b.textContent=o.e;
    b.style.left=o.x+"px";b.style.top=o.y+"px";
    b.style.fontSize=o.size+"px";
    b.style.setProperty("--r",o.rot+"deg");
    b.style.zIndex=10+o.z;
    world.appendChild(b);
    o.el=b;
  });

  renderTray();
  updateHUD();
  resetView();
  clearInterval(tickTimer);
  tickTimer=setInterval(()=>{
    if(G.over)return;
    G.time++;
    $("#clock").textContent=fmt(G.time);
  },1000);
}

function renderTray(){
  const tray=$("#tray");tray.innerHTML="";
  G.scene.targets.forEach((t,i)=>{
    const done=G.remaining[i]<=0;
    const c=document.createElement("div");
    c.className="tcard"+(done?" done":"");
    c.dataset.ti=i;
    c.innerHTML=`<div class="e">${t.e}</div><div class="nm">${t.name}</div>
      <div class="cnt">${done?"✓":G.remaining[i]}</div>`;
    tray.appendChild(c);
  });
}
function updateHUD(){
  $("#found-lbl").textContent=G.found+"/"+G.total;
  $("#clock").textContent=fmt(G.time);
  $("#pfill").style.width=(100*G.found/G.total)+"%";
}

/* ------------------------------------------------------------------ */
/* Тап по предмету                                                    */
/* ------------------------------------------------------------------ */
function hitAt(clientX,clientY){
  const el=document.elementFromPoint(clientX,clientY);
  if(!el)return null;
  const btn=el.closest?el.closest(".obj"):null;
  return btn;
}
function ripple(clientX,clientY,good){
  const r=document.createElement("div");
  r.className="ring "+(good?"good":"bad");
  const vp=viewport.getBoundingClientRect();
  r.style.left=(clientX-vp.left)+"px";
  r.style.top=(clientY-vp.top)+"px";
  viewport.appendChild(r);
  setTimeout(()=>r.remove(),600);
}
function floatLabel(obj,text){
  const vp=viewport.getBoundingClientRect();
  const rect=obj.el.getBoundingClientRect();
  const l=document.createElement("div");
  l.className="flabel";l.textContent=text;
  l.style.left=(rect.left+rect.width/2-vp.left)+"px";
  l.style.top=(rect.top+rect.height/2-vp.top)+"px";
  viewport.appendChild(l);
  setTimeout(()=>l.remove(),1000);
}
function handleTap(clientX,clientY){
  if(!G||G.over)return;
  const btn=hitAt(clientX,clientY);
  if(!btn){ return; }
  const id=+btn.dataset.id;
  const obj=G.objects.find(o=>o.id===id);
  if(!obj||obj.found)return;
  if(obj.target>=0 && G.remaining[obj.target]>0){
    // найдено!
    obj.found=true;
    obj.el.classList.add("found");
    G.remaining[obj.target]--;
    G.found++;
    sGood();
    ripple(clientX,clientY,true);
    const t=G.scene.targets[obj.target];
    floatLabel(obj,t.name);
    // обновить карточку
    const card=document.querySelector('.tcard[data-ti="'+obj.target+'"]');
    if(card){
      card.classList.add("bump");
      setTimeout(()=>card.classList.remove("bump"),220);
      if(G.remaining[obj.target]<=0){card.classList.add("done");card.querySelector(".cnt").textContent="✓"}
      else card.querySelector(".cnt").textContent=G.remaining[obj.target];
    }
    updateHUD();
    if(G.found>=G.total)win();
  }else{
    // мимо / обманка
    G.wrongTaps++;
    G.time+=2; // штраф
    sBad();
    ripple(clientX,clientY,false);
  }
}

/* ------------------------------------------------------------------ */
/* Пан / зум                                                          */
/* ------------------------------------------------------------------ */
let view={scale:1,tx:0,ty:0,min:1,max:3};
const pointers=new Map();
let gesture=null; // {mode:'pan'|'pinch', ...}
let downInfo=null; // для распознавания тапа

function applyView(){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const sw=WORLD_W*view.scale, sh=WORLD_H*view.scale;
  // ограничение панорамирования
  if(sw<=vw) view.tx=(vw-sw)/2; else view.tx=Math.min(0,Math.max(vw-sw,view.tx));
  if(sh<=vh) view.ty=(vh-sh)/2; else view.ty=Math.min(0,Math.max(vh-sh,view.ty));
  world.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.scale})`;
}
function resetView(){
  const vw=viewport.clientWidth;
  view.min=vw/WORLD_W;
  view.scale=view.min;
  view.max=view.min*3.2;
  view.tx=0;view.ty=0;
  applyView();
}
function centerOn(wx,wy,targetScale){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  view.scale=Math.min(view.max,Math.max(view.min,targetScale||view.scale));
  view.tx=vw/2 - wx*view.scale;
  view.ty=vh/2 - wy*view.scale;
  applyView();
}

viewport.addEventListener("pointerdown",e=>{
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    downInfo={x:e.clientX,y:e.clientY,t:Date.now(),moved:0};
    gesture={mode:"pan",lastX:e.clientX,lastY:e.clientY};
  }else if(pointers.size===2){
    const pts=[...pointers.values()];
    const dx=pts[0].x-pts[1].x, dy=pts[0].y-pts[1].y;
    gesture={mode:"pinch",startDist:Math.hypot(dx,dy),startScale:view.scale,
      cx:(pts[0].x+pts[1].x)/2, cy:(pts[0].y+pts[1].y)/2};
    downInfo=null;
  }
},{passive:false});

viewport.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!gesture)return;
  if(gesture.mode==="pinch" && pointers.size>=2){
    const pts=[...pointers.values()];
    const dx=pts[0].x-pts[1].x, dy=pts[0].y-pts[1].y;
    const dist=Math.hypot(dx,dy);
    const ns=Math.min(view.max,Math.max(view.min,gesture.startScale*dist/gesture.startDist));
    // зум вокруг центра щипка
    const vp=viewport.getBoundingClientRect();
    const cx=gesture.cx-vp.left, cy=gesture.cy-vp.top;
    const wx=(cx-view.tx)/view.scale, wy=(cy-view.ty)/view.scale;
    view.scale=ns;
    view.tx=cx-wx*view.scale;
    view.ty=cy-wy*view.scale;
    applyView();
  }else if(gesture.mode==="pan"){
    const dx=e.clientX-gesture.lastX, dy=e.clientY-gesture.lastY;
    gesture.lastX=e.clientX;gesture.lastY=e.clientY;
    view.tx+=dx;view.ty+=dy;
    if(downInfo)downInfo.moved+=Math.abs(dx)+Math.abs(dy);
    applyView();
  }
},{passive:false});

function endPointer(e){
  const wasTap = downInfo && pointers.size===1 && downInfo.moved<10 && (Date.now()-downInfo.t)<400;
  pointers.delete(e.pointerId);
  try{viewport.releasePointerCapture(e.pointerId)}catch(_){}
  if(pointers.size===0){
    if(wasTap) handleTap(e.clientX,e.clientY);
    gesture=null;downInfo=null;
  }else if(pointers.size===1){
    const p=[...pointers.entries()][0][1];
    gesture={mode:"pan",lastX:p.x,lastY:p.y};
    downInfo=null;
  }
}
viewport.addEventListener("pointerup",endPointer);
viewport.addEventListener("pointercancel",endPointer);

// колесо мыши — зум (для десктопа)
viewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const vp=viewport.getBoundingClientRect();
  const cx=e.clientX-vp.left, cy=e.clientY-vp.top;
  const wx=(cx-view.tx)/view.scale, wy=(cy-view.ty)/view.scale;
  const ns=Math.min(view.max,Math.max(view.min,view.scale*(e.deltaY<0?1.15:0.87)));
  view.scale=ns;view.tx=cx-wx*view.scale;view.ty=cy-wy*view.scale;
  applyView();
},{passive:false});

/* ------------------------------------------------------------------ */
/* Подсказка                                                          */
/* ------------------------------------------------------------------ */
function useHint(){
  if(!G||G.over)return;
  if(G.hints<=0){toast("Подсказки закончились 😅");return}
  const left=G.objects.filter(o=>o.target>=0 && !o.found);
  if(!left.length)return;
  const o=left[Math.floor(Math.random()*left.length)];
  G.hints--;
  $("#hint-badge").textContent=G.hints;
  centerOn(o.x,o.y,Math.min(view.max, Math.max(view.scale, view.min*2)));
  setTimeout(()=>{
    o.el.classList.add("hintpulse");
    setTimeout(()=>o.el.classList.remove("hintpulse"),2400);
  },260);
  sTap();
  toast("Ищи: "+G.scene.targets[o.target].name);
}

/* ------------------------------------------------------------------ */
/* Победа                                                             */
/* ------------------------------------------------------------------ */
function stfor(){
  // звёзды по времени и подсказкам
  const par=G.scene.par;
  let stars=1;
  if(G.time<=par*1.7 && G.hints>=1) stars=2;
  if(G.time<=par && G.hints>=2 && G.wrongTaps<=6) stars=3;
  return stars;
}
function win(){
  G.over=true;
  clearInterval(tickTimer);
  sWin();
  const stars=stfor();
  const prev=save.stars[G.scene.id]||0;
  if(stars>prev){save.stars[G.scene.id]=stars;persist()}
  const isLast=G.idx>=SCENES.length-1;
  const nextLocked=isLast;
  const ov=document.createElement("div");
  ov.className="overlay";ov.id="win-ov";
  ov.innerHTML=`
    <div class="modal">
      <div class="big">🎉</div>
      <h2>Уровень пройден!</h2>
      <p>${G.scene.title}</p>
      <div class="win-stars">${[0,1,2].map(k=>`<i class="${k<stars?'on':''}" style="animation-delay:${k*.18}s">⭐</i>`).join("")}</div>
      <div class="win-meta">
        <div class="m"><b>${fmt(G.time)}</b><span>время</span></div>
        <div class="m"><b>${G.total}</b><span>найдено</span></div>
        <div class="m"><b>${3-G.hints}/3</b><span>подсказок</span></div>
      </div>
      ${nextLocked
        ? `<button class="btn" id="w-menu">🏠 В меню</button>`
        : `<button class="btn" id="w-next">Следующий уровень ▶</button>
           <button class="btn sec" id="w-menu">В меню</button>`}
      <button class="btn sec" id="w-replay">↻ Заново</button>
    </div>`;
  $("#game").appendChild(ov);
  const nx=$("#w-next");if(nx)nx.onclick=()=>{ov.remove();startGame(G.idx+1)};
  $("#w-menu").onclick=()=>{ov.remove();goMenu()};
  $("#w-replay").onclick=()=>{ov.remove();startGame(G.idx)};
}

window.addEventListener("resize",()=>{if(G&&!G.over)applyView()});

/* ------------------------------------------------------------------ */
renderMenu();
</script>
