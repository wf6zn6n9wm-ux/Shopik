<title>Холодильник+</title>
<style>
/*FONTS*/

/* ═══════════════════════════════════════════════════════════════════════
   ХОЛОДИЛЬНИК+ · DESIGN TOKENS
   ───────────────────────────────────────────────────────────────────────
   Один інтерфейс, дві теми. Жоден компонент нижче не знає, яка тема
   активна: усі кольори беруться із семантичних токенів. Щоб змінити
   вигляд усього застосунку, правити треба лише два блоки нижче.

   Тема стоїть на <html data-t="light|dark">. Значення system розвʼязується
   в JS у light або dark, тому в розмітці третього стану не існує.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  /* ── Поверхні ───────────────────────────────────────────────────── */
  --bg:#F3E5E5;              /* тло застосунку */
  --bg-2:#F7EBEB;            /* друге тло: панелі, шапка */
  --surface:#F9EEEE;         /* картка */
  --surface-2:#FCEFF0;       /* піднята картка, поле вводу */
  --border:#E8D5D7;          /* волосяна лінія */
  --border-2:#DFC8CB;        /* помітніша межа: контурні кнопки */

  /* ── Текст ──────────────────────────────────────────────────────── */
  --text:#242126;            /* заголовки й основне */
  --text-2:#6F6870;          /* підписи під назвою */
  --text-3:#726C70;          /* мітки секцій · 4.52:1 (задане #9C949A давало 2.60) */
  --text-ph:#91898D;         /* плейсхолдер · 3.04:1 (задане #AFA5AA давало 2.13) */

  /* ── Акцент ─────────────────────────────────────────────────────── */
  --accent:#E83D72;
  --accent-press:#D83265;
  --accent-light:#F5A6BD;
  --accent-soft:#F9DCE5;     /* тло під акцентом */
  --on-accent:#FFFFFF;       /* текст і знаки на акценті */

  /* ── Статуси продукту ───────────────────────────────────────────── */
  --ok:#2C7A50;      --ok-bg:#DCEEE2;
  --warn:#9A560E;    --warn-bg:#FBE6CC;
  --crit:#B22334;    --crit-bg:#FBDBDD;

  /* ── Навігація ──────────────────────────────────────────────────── */
  --nav-off:#6E666A;         /* підпис вкладки · 4.55:1 (задане #8F858A давало 2.91) */
  --nav-bg:rgba(247,235,235,.92);

  /* ── Тіні ───────────────────────────────────────────────────────── */
  --sh-1:0 1px 2px rgba(36,33,38,.045);
  --sh-2:0 2px 6px rgba(36,33,38,.05), 0 14px 30px -18px rgba(36,33,38,.28);
  --sh-fab:0 8px 20px -6px rgba(232,61,114,.5), 0 2px 6px rgba(36,33,38,.14);
  --sh-nav:0 -1px 0 var(--border);

  /* ── Геометрія · спільна для обох тем ───────────────────────────── */
  --r-xs:10px; --r-sm:14px; --r-md:18px; --r-lg:22px; --r-xl:28px; --r-full:999px;
  --gut:20px;                /* бічне поле екрана */
  --gap:8px;                 /* між картками в списку */
}

/* ── Темна тема · ті самі імена, інші значення ─────────────────────── */
@media (prefers-color-scheme:dark){ :root:not([data-t="light"]){
  --bg:#080D13; --bg-2:#0B1118; --surface:#0E171E; --surface-2:#122027;
  --border:#1C343B; --border-2:#24424A;
  --text:#F4F7F7; --text-2:#AAB8BB; --text-3:#718185; --text-ph:#617074;
  --accent:#39D0C0; --accent-press:#249E95; --accent-light:#45E1D0;
  --accent-soft:#123A3B; --on-accent:#04211F;
  --ok:#5FE0B4;   --ok-bg:#0F2E2A;
  --warn:#F0B44E; --warn-bg:#31250F;
  --crit:#FF7A85; --crit-bg:#33161A;
  --nav-off:#718185;
  --nav-bg:rgba(11,17,24,.92);
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 8px rgba(0,0,0,.45);
  --sh-fab:0 8px 24px -6px rgba(57,208,192,.42), 0 2px 8px rgba(0,0,0,.5);
  --sh-nav:0 -1px 0 var(--border);
} }
:root[data-t="dark"]{
  --bg:#080D13; --bg-2:#0B1118; --surface:#0E171E; --surface-2:#122027;
  --border:#1C343B; --border-2:#24424A;
  --text:#F4F7F7; --text-2:#AAB8BB; --text-3:#718185; --text-ph:#617074;
  --accent:#39D0C0; --accent-press:#249E95; --accent-light:#45E1D0;
  --accent-soft:#123A3B; --on-accent:#04211F;
  --ok:#5FE0B4;   --ok-bg:#0F2E2A;
  --warn:#F0B44E; --warn-bg:#31250F;
  --crit:#FF7A85; --crit-bg:#33161A;
  --nav-off:#718185;
  --nav-bg:rgba(11,17,24,.92);
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 8px rgba(0,0,0,.45);
  --sh-fab:0 8px 24px -6px rgba(57,208,192,.42), 0 2px 8px rgba(0,0,0,.5);
  --sh-nav:0 -1px 0 var(--border);
}

/* ═══ ОСНОВА ══════════════════════════════════════════════════════════ */
html,body{height:100%}
*{box-sizing:border-box}
body{
  margin:0; overflow:hidden; background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',
    system-ui,Roboto,sans-serif;
}
.mono{font-family:'JBMono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

#app{
  position:fixed; inset:0; max-width:560px; margin:0 auto;
  display:flex; flex-direction:column; overflow:hidden;
  background:var(--bg); color:var(--text);
  font:inherit; font-size:16px; line-height:1.35;
  padding-top:env(safe-area-inset-top);
}
.body{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;
  scrollbar-width:none;padding-bottom:18px;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{width:0}
.body > *{flex:none}

button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ═══ ІКОНКИ ══════════════════════════════════════════════════════════
   Один стиль на обидві теми: контурні, товщина 2, колір успадковується.
   Тема ніколи не змінює іконку — тільки її колір. */
.i{width:24px;height:24px;flex:none;display:block;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.s20{width:20px;height:20px}
.i.s18{width:18px;height:18px;stroke-width:2.2}
.i.s28{width:28px;height:28px}

/* ═══ ШАПКА ЕКРАНА ════════════════════════════════════════════════════ */
.hd{margin:14px var(--gut) 0;display:flex;align-items:center;gap:10px;min-height:38px}
.hd h2{all:unset;display:block;flex:1;font-size:28px;font-weight:700;line-height:1.12;
  letter-spacing:-.022em;color:var(--text);text-wrap:balance}
.hd .back{display:flex;align-items:center;justify-content:center;width:36px;height:36px;
  margin-left:-8px;border:0;background:var(--surface);border-radius:var(--r-full);
  color:var(--text);cursor:pointer;padding:0;box-shadow:var(--sh-1)}
.plus{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border-radius:var(--r-full);color:var(--accent);
  box-shadow:var(--sh-1)}
.sub{display:flex;justify-content:space-between;align-items:baseline;
  margin:3px var(--gut) 0;gap:10px}
.sub b{font-size:14px;font-weight:500;color:var(--text-2);letter-spacing:-.01em}
.sub span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);white-space:nowrap}

/* ═══ СЕКЦІЯ ══════════════════════════════════════════════════════════ */
.sec{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--text-3);
  padding:22px var(--gut) 9px;display:flex;justify-content:space-between;gap:10px;
  text-transform:uppercase}
.sec button{background:none;border:0;font:inherit;font-size:12px;font-weight:600;
  color:var(--accent);cursor:pointer;text-transform:none;letter-spacing:0}
.hint{margin:0 var(--gut);font-size:13px;color:var(--text-2);line-height:1.5}
.hint b{color:var(--text);font-weight:600}
.empty{padding:34px var(--gut);text-align:center;color:var(--text-3);font-size:15px}

/* ═══ КАРТКА-РЯДОК ════════════════════════════════════════════════════ */
.row{display:flex;align-items:center;gap:12px;margin:0 var(--gut) var(--gap);
  padding:14px 16px;width:calc(100% - var(--gut) * 2);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--sh-1);font:inherit;color:inherit;text-align:left;cursor:pointer;
  transition:transform .12s ease, background .12s ease}
button.row:active{transform:scale(.985);background:var(--surface-2)}
.row.flat{cursor:default}
.row.g4{margin-bottom:calc(var(--gap) + 8px)}
.row > span:not(.thumb):not(.d){flex:1;min-width:0}
.row .n{display:block;font-size:16px;font-weight:600;letter-spacing:-.012em;color:var(--text);
  overflow:hidden;text-overflow:ellipsis}
.row .u{display:block;font-size:12.5px;color:var(--text-2);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:12.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;
  color:var(--text-2);display:flex;align-items:center;gap:4px}
/* Іконка-бейдж продукту зліва */
.row .thumb{width:44px;height:44px;flex:none;display:flex;align-items:center;
  justify-content:center;border-radius:var(--r-sm);background:var(--bg-2);color:var(--text-2)}
.row .thumb.cr{background:var(--crit-bg);color:var(--crit)}
.row .thumb.wr{background:var(--warn-bg);color:var(--warn)}
.row .thumb.ok{background:var(--bg-2);color:var(--text-2)}

.cr{color:var(--crit)} .wr{color:var(--warn)} .ok{color:var(--ok)}

/* Пігулка статусу праворуч */
.row .d.cr,.row .d.wr{padding:5px 10px;border-radius:var(--r-full);
  font-size:11.5px;font-weight:700;letter-spacing:.01em}
.row .d.cr{background:var(--crit-bg);color:var(--crit)}
.row .d.wr{background:var(--warn-bg);color:var(--warn)}
.row .d.ok{color:var(--text-2);font-weight:500}

/* ═══ БЛОК СТАНУ (Прострочено / Останній день) ════════════════════════ */
.blk{display:flex;align-items:center;gap:14px;margin:0 var(--gut) var(--gap);
  padding:16px;width:calc(100% - var(--gut) * 2);border:0;border-radius:var(--r-lg);
  text-align:left;font:inherit;cursor:pointer;box-shadow:var(--sh-1)}
.blk .g{width:46px;height:46px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:19px;font-weight:700;border-radius:var(--r-full);
  background:rgba(255,255,255,.34);color:inherit}
:root[data-t="dark"] .blk .g{background:rgba(255,255,255,.09)}
.blk b{display:block;font-size:16px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.blk s{display:block;font-size:13px;margin-top:3px;opacity:.86;text-decoration:none}
.b-red{background:var(--crit-bg);color:var(--crit)}
.b-am{background:var(--warn-bg);color:var(--warn)}
.b-ok{background:var(--ok-bg);color:var(--ok)}

/* ═══ СТАТИСТИКА ══════════════════════════════════════════════════════ */
.facts{margin:0 var(--gut) var(--gap);display:grid;
  grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:var(--gap)}
.facts div{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);padding:14px 8px 12px;text-align:center;box-shadow:var(--sh-1)}
.facts b{display:block;font-size:24px;font-weight:700;line-height:1.05;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;color:var(--text)}
.facts span{display:block;margin-top:4px;font-size:11.5px;font-weight:500;color:var(--text-2)}

/* ═══ ПЛИТКИ-ПЕРЕХОДИ ═════════════════════════════════════════════════ */
.tiles{margin:0 var(--gut) var(--gap);display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:15px 15px 13px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:9px;
  transition:transform .12s ease}
.tile:active{transform:scale(.98)}
.tile .cap{width:40px;height:40px;border-radius:var(--r-sm);background:var(--accent-soft);
  color:var(--accent);display:flex;align-items:center;justify-content:center}
.tile b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.015em}
.tile s{display:block;font-size:12.5px;color:var(--text-2);text-decoration:none;margin-top:1px}
.tile .foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.tile .cnt{font-size:13px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:var(--r-full);padding:3px 10px}
.tile .foot .i{color:var(--text-3)}

/* ═══ КНОПКИ ══════════════════════════════════════════════════════════ */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:calc(100% - var(--gut) * 2);margin:16px var(--gut) 0;padding:16px 18px;
  background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--r-md);
  font:inherit;font-size:16px;font-weight:650;letter-spacing:-.012em;cursor:pointer;
  box-shadow:var(--sh-1);transition:transform .12s ease, background .12s ease}
.btn:active{transform:scale(.985);background:var(--accent-press)}
.btn.gh{background:var(--surface);color:var(--text);border:1px solid var(--border-2);
  box-shadow:none}
.btn.gh:active{background:var(--surface-2)}
.btn.rd{background:var(--crit-bg);color:var(--crit);box-shadow:none}
.btn.sm{padding:11px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn3{display:flex;gap:var(--gap);margin:16px var(--gut) 0}
.btn3 .btn{margin:0;flex:1;width:auto;padding:14px 8px;font-size:14px}

/* ═══ ПОЛЯ ВВОДУ ══════════════════════════════════════════════════════ */
.fld{margin:14px var(--gut) 0}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);
  margin-bottom:7px;letter-spacing:-.005em}
.fld input,.fld select{width:100%;font:inherit;font-size:16px;padding:14px 16px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text);-webkit-appearance:none;appearance:none}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.fld input::placeholder{color:var(--text-ph)}
.two{display:flex;gap:var(--gap);margin:14px var(--gut) 0}
.two .fld{margin:0;flex:1;min-width:0}

/* Поле пошуку з іконкою */
.search{position:relative;margin:14px var(--gut) 0}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none}
.search input{width:100%;font:inherit;font-size:16px;padding:13px 16px 13px 46px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-full);
  color:var(--text);-webkit-appearance:none}
.search input::placeholder{color:var(--text-ph)}
.search input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}

/* ═══ ЧІПИ-ФІЛЬТРИ ════════════════════════════════════════════════════ */
.chips{display:flex;flex:none;flex-wrap:wrap;gap:7px;margin:12px var(--gut) 0}
.chips.scroll{flex:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  margin-right:0;padding-right:var(--gut);scroll-padding-left:var(--gut)}
.chips.scroll .chip{flex:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:14px;font-weight:550;padding:9px 15px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  border-radius:var(--r-full);cursor:pointer;white-space:nowrap;
  transition:background .12s ease}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);
  font-weight:650}

/* ═══ ПЕРЕМИКАЧ ТЕМИ (сегменти) ═══════════════════════════════════════ */
.seg{display:flex;gap:4px;margin:12px var(--gut) 0;padding:4px;
  background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-sm)}
.seg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:11px 4px 9px;border:0;background:none;border-radius:var(--r-xs);
  font:inherit;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer}
.seg button.on{background:var(--surface-2);color:var(--accent);box-shadow:var(--sh-1)}

/* ═══ ПЕРЕМИКАЧ (iOS switch) ══════════════════════════════════════════ */
.sw{display:flex;justify-content:space-between;align-items:center;gap:14px;
  margin:0 var(--gut) var(--gap);padding:14px 16px;width:calc(100% - var(--gut) * 2);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  font:inherit;color:inherit;text-align:left;cursor:pointer;box-shadow:var(--sh-1)}
.sw .n{display:block;font-size:16px;font-weight:600;letter-spacing:-.012em;color:var(--text)}
.sw .u{display:block;font-size:12.5px;color:var(--text-2);margin-top:3px}
.sw i{width:51px;height:31px;flex:none;border:0;border-radius:var(--r-full);
  background:var(--border-2);position:relative;font-style:normal;
  transition:background .18s ease}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;
  border-radius:var(--r-full);background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22);
  transition:transform .18s ease}
.sw i.on{background:var(--accent)}
.sw i.on::after{transform:translateX(20px)}
@media (prefers-reduced-motion:reduce){.sw i,.sw i::after{transition:none}}

/* ═══ СПИСОК ПОКУПОК ══════════════════════════════════════════════════ */
.chk{display:flex;align-items:center;gap:13px;margin:0 var(--gut) var(--gap);
  padding:14px 16px;width:calc(100% - var(--gut) * 2);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-md);font:inherit;color:inherit;
  text-align:left;cursor:pointer;box-shadow:var(--sh-1)}
.chk i{width:26px;height:26px;flex:none;border:2px solid var(--border-2);
  border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;font-style:normal;color:transparent}
.chk i.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk .n{flex:1;min-width:0;font-size:16px;font-weight:600;color:var(--text);
  letter-spacing:-.012em}
.chk .u{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px;font-weight:400}
.chk.done .n{color:var(--text-3);text-decoration:line-through}

/* ═══ ВЕЛИКІ КНОПКИ ВИБОРУ ════════════════════════════════════════════ */
.big{display:flex;gap:14px;align-items:center;margin:0 var(--gut) var(--gap);
  padding:16px;width:calc(100% - var(--gut) * 2);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-lg);font:inherit;color:inherit;
  text-align:left;cursor:pointer;box-shadow:var(--sh-1);transition:transform .12s ease}
.big:active{transform:scale(.985)}
.big + .big{margin-top:0}
.big.hero{background:var(--accent);border-color:var(--accent);color:var(--on-accent);
  box-shadow:var(--sh-fab)}
.big .ic{width:46px;height:46px;flex:none;display:flex;align-items:center;
  justify-content:center;border-radius:var(--r-sm);background:var(--accent-soft);
  color:var(--accent);font-size:18px;font-weight:700}
.big.hero .ic{background:rgba(255,255,255,.22);color:var(--on-accent)}
:root[data-t="dark"] .big.hero .ic{background:rgba(4,33,31,.18)}
.big b{display:block;font-size:16px;font-weight:650;letter-spacing:-.015em;line-height:1.2}
.big s{display:block;font-size:12.5px;margin-top:3px;opacity:.8;text-decoration:none}

/* ═══ НИЖНЯ НАВІГАЦІЯ ═════════════════════════════════════════════════ */
.tabs{display:flex;flex:none;margin-top:auto;background:var(--nav-bg);

  box-shadow:var(--sh-nav);padding-bottom:calc(env(safe-area-inset-bottom) + 6px);
  position:relative;z-index:4}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 2px 4px;font:inherit;font-size:10.5px;font-weight:600;letter-spacing:-.005em;
  color:var(--nav-off);background:none;border:0;cursor:pointer}
.tabs button.on{color:var(--accent)}
.tabs button.add{color:var(--accent);font-weight:650}
.tabs .addmark{width:54px;height:54px;margin:-26px 0 1px;border-radius:var(--r-full);
  background:var(--accent);color:var(--on-accent);display:flex;align-items:center;
  justify-content:center;box-shadow:var(--sh-fab);
  border:4px solid var(--bg);transition:transform .12s ease}
.tabs .add:active .addmark{transform:scale(.94)}

/* ═══ БАНЕР НАГАДУВАННЯ ═══════════════════════════════════════════════ */
.push{margin:14px var(--gut) 0;padding:15px 16px;display:flex;gap:12px;align-items:center;
  background:var(--crit-bg);color:var(--crit);border-radius:var(--r-lg)}
.push b{display:block;font-size:15px;font-weight:700;letter-spacing:-.015em}
.push s{display:block;font-size:13px;text-decoration:none;opacity:.9;margin-top:2px}
.push button{background:none;border:0;color:inherit;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none}

/* ═══ ВИНОСКИ ТА ПОВІДОМЛЕННЯ ═════════════════════════════════════════ */
.stamp{margin:14px var(--gut) 0;padding:14px 16px;border-radius:var(--r-md);
  background:var(--crit-bg);color:var(--crit);display:flex;justify-content:space-between;
  align-items:center;gap:10px}
.stamp b{font-size:15px;font-weight:650;letter-spacing:-.015em}
.stamp .mono{font-size:13px;font-weight:600}
.stamp.g{background:var(--ok-bg);color:var(--ok)}
.stamp.a{background:var(--warn-bg);color:var(--warn)}
.stamp.n{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.err{margin:14px var(--gut) 0;padding:14px 16px;border-radius:var(--r-md);
  background:var(--crit-bg);color:var(--crit);font-size:13.5px;line-height:1.5}
.busy{margin:14px var(--gut) 0;padding:20px;border-radius:var(--r-md);text-align:center;
  background:var(--surface);border:1px dashed var(--border-2);color:var(--text-2);

/* ═══ КБЖУ ════════════════════════════════════════════════════════════ */

.wbar i{display:block}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:13px 16px}
.wrow b{display:block;font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--text)}
.wrow > div span{font-size:12.5px;color:var(--text-2)}
.wnum{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--text);

.lnk{background:none;border:0;padding:6px;cursor:pointer;color:var(--crit);flex:none;

.kcal{margin:0 var(--gut);display:flex;gap:7px;flex-wrap:wrap}

/* ═══ ГРАФІКИ ═════════════════════════════════════════════════════════ */

/* ═══ ФОТО ТА ФАЙЛИ ═══════════════════════════════════════════════════ */
.filebtn{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;
  width:calc(100% - var(--gut) * 2);margin:16px var(--gut) 0;padding:16px 18px;

  border-radius:var(--r-md);font-size:16px;font-weight:650;letter-spacing:-.012em;
  cursor:pointer;box-shadow:var(--sh-1)}
.filebtn.gh{background:var(--surface);color:var(--text);border:1px solid var(--border-2);

.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.toast{position:fixed;left:var(--gut);right:var(--gut);

.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent-light);font:inherit;

:root[data-t="dark"] .toast button{color:var(--accent)}

    // Перерахунок тут дав би гірше число: у пропущених позицій ми не тягнемо

    const sum = r2(rec.lines.reduce((a,l) => a + l.sum, 0));

    const sumOk = Math.abs(missing) <= 0.011;
    const expVat = r2(rec.total - rec.total / (1 + rec.rate/100));
    const vatOk = Math.abs(expVat - rec.vat) <= 0.011;
    return { sum, missing, sumOk, expVat, vatOk, share: r2(sum / rec.total),

    const near = [[1,''], [0.75,'¾'], [2/3,'⅔'], [0.5,'½'], [1/3,'⅓'], [0.25,'¼']]
      .find(f => Math.abs(f[0] - x) < 0.04);
    return near ? near[1] : Math.round(x * 100) + '%';
  }
  const leftOf = (i) => (i.left === undefined ? 1 : i.left);

  function eatPart(id, share) {
    const idx = S.items.findIndex(x => x.id === id);
    if (idx < 0) return;
    const i = S.items[idx];
    const before = leftOf(i);
    const take = Math.min(before, share);
    const rest = Math.round((before - take) * 100) / 100;
    const gone = rest <= 0.02;
    // У журнал іде пропорційна ціна — інакше звіт покаже, ніби зʼїли лосося
    // на 240 ₴, тоді як зʼїли чверть.
    S.journal.push({ name:i.name, act:'eaten', price:Math.round((i.price || 0) * take), date:TODAY });
    if (gone) { S.items.splice(idx, 1); if (UI.card === id) { UI.card = null; UI.edit = false; } }
    else i.left = rest;
    toast('Зʼїдено ' + (frac(take) || 'усе') + ' · ' + i.name, () => {
      if (gone) S.items.splice(idx, 0, i); else i.left = before;
      S.journal.pop(); save(); render();
    });
    save();
  }

  function writeOff(id, act, silent) {
    const idx = S.items.findIndex(i => i.id === id);
    if (idx < 0) return;
    const item = S.items[idx];
    S.items.splice(idx, 1);
    S.journal.push({ name:item.name, act, price:Math.round((item.price || 0) * leftOf(item)), date:TODAY });
    if (UI.card === id) { UI.card = null; UI.edit = false; }
    if (!silent) toast(act === 'eaten' ? '«' + item.name + '» з’їдено' : '«' + item.name + '» викинуто',
      () => { S.items.splice(idx, 0, item); S.journal.pop(); save(); render(); });
    save();
  }

  // Відповідь api/receipt.js → та сама модель, якою малюються демо-чеки.
  // Один екран, два джерела: демо не має власного коду відображення.
  function mapLive(j) {
    const r = j.receipt || {}, v = j.validation || {}, sm = v.sum || {}, vt = v.vat || {};
    const item = (o) => ({ name:o.name || o.raw || '—',
      qty:(o.quantity || 1) + ' ' + (o.unit || 'шт'), sum:Number(o.line_total) || 0,
      cat:o.category || 'unknown', src:o.category_source || 'unknown', food:true,
      ean:o.barcode || '', expires:o.expires_on || '' });
    const skip = (o) => ({ name:o.name || o.raw || '—', qty:'', sum:0, cat:'nonfood',
      src:'dictionary', food:false, ean:'', why:o.reason || 'не їжа' });
    const lines_sum = Number(sm.lines_sum) || 0, total = Number(r.total) || 0;
    return {
      id:'live', live:true, title:'Чек із камери',
      store:(j.store && j.store.name) || 'магазин не видно',
      date:r.date || TODAY,
      when:r.date ? fmt(r.date) + (r.time ? ' ' + r.time : '') : 'щойно',
      total, vat:Number(r.vat_amount) || 0, rate:Number(r.vat_rate) || 20,
      cut:v.verdict === 'reshoot',
      lines:[...(j.items || []).map(item), ...(j.skipped || []).map(skip)],
      // Вердикт сервера, а не власний перерахунок.
      v:{ sum:lines_sum, missing:Number(sm.missing) || 0, sumOk:!!sm.ok,
          expVat:Number(vt.expected) || 0, vatOk:vt.ok !== false,
          share:Number(v.recognized_share) || (total ? r2(lines_sum / total) : 0),
          verdict:v.verdict || 'ok', reasons:v.reasons || [] },
    };
  }

    if (!S.api) { UI.err = 'Спершу вкажіть адресу ендпоінта: Ще → Налаштування → Сканер.'; render(); return; }
    UI.busy = true; UI.err = ''; UI.liveRec = null; render();
    const done = () => { UI.busy = false; save(); render(); };
    fetch(S.api, { method:'POST', headers:{ 'content-type':'application/json' },
                   body:JSON.stringify({ image:UI.photo }) })
      .then(r => r.text().then(txt => {
        let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('HTTP ' + r.status + ' · відповідь не JSON'); }
        if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      }))
      .then(j => {
        const rec = mapLive(j);
        if (!rec.lines.length) throw new Error('У кадрі не знайдено жодної позиції.');

        UI.err = 'Запит не пройшов · ' + (e && e.message ? e.message : 'мережа')

          + 'відкрийте завантажений файл у браузері.';

  }

  // ── Гроші й ритм ────────────────────────────────────────────────────
  // Усе нижче рахується з чеків. Людина не вводить нічого: ціну, дату
  // й магазин ми вже прочитали, коли сканували чек.
  const gap = (a, b) => Math.round((D(b) - D(a)) / 864e5);

  function purchases() {
    const m = {};
    S.receipts.forEach(r => (r.lines || []).forEach(l => {
      (m[l.name] = m[l.name] || []).push({ date:r.date, price:l.sum, store:r.store, cat:l.cat });
    }));
    Object.values(m).forEach(a => a.sort((x, y) => x.date < y.date ? -1 : 1));
    return m;
  }

  const fridgeValue = () => Math.round(S.items.reduce((a, i) => a + (i.price || 0) * leftOf(i), 0));
  const spentIn = (days) => { const from = addDays(TODAY, -days);
    return Math.round(S.receipts.filter(r => r.date >= from).reduce((a, r) => a + r.total, 0)); };
  const thrownIn = (days) => { const from = addDays(TODAY, -days);
    return Math.round(S.journal.filter(j => j.act === 'thrown' && j.date >= from)
      .reduce((a, j) => a + j.price, 0)); };

  // Нахил прямої по всіх покупках (найменші квадрати). Один розпродаж
  // не збиває картину, а число означає рівно те, що написано під ним:
  // на скільки річ подорожчала за півроку спостережень.
  const SPAN = 182;
  function trend(buys) {
    const t0 = D(buys[0].date);
    const xs = buys.map(b => (D(b.date) - t0) / 864e5), ys = buys.map(b => b.price);
    const n = xs.length;
    const mx = xs.reduce((a, x) => a + x, 0) / n, my = ys.reduce((a, y) => a + y, 0) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
    if (!den) return null;
    const slope = num / den;                       // ₴ на день
    const was = my - slope * mx;                   // ціна на початок спостережень
    if (was <= 0) return null;
    const span = Math.min(SPAN, xs[n-1] || 1);
    return { was, now: was + slope * span, pct: slope * span / was * 100 };
  }

  function inflation() {
    return Object.entries(purchases())
      .filter(([, b]) => b.length >= 4)
      .map(([name, b]) => { const t = trend(b); return t && { name, n:b.length, ...t }; })
      .filter(Boolean)
      .sort((a, b) => b.pct - a.pct);
  }

  function basketInflation() {
    const all = inflation();
    if (!all.length) return null;
    const w = all.reduce((a, x) => a + x.n, 0);
    return all.reduce((a, x) => a + x.pct * x.n, 0) / w;
  }

  // Порівнюємо тільки спільні позиції. Інакше «дорожчий магазин» — це
  // просто той, де ти одного разу взяв каву.
  function storeIndex() {
    const idx = {};
    Object.values(purchases()).forEach(buys => {
      const by = {};
      buys.forEach(b => { (by[b.store] = by[b.store] || []).push(b.price); });
      const names = Object.keys(by);
      if (names.length < 2) return;
      const avgs = names.map(n => [n, by[n].reduce((a, p) => a + p, 0) / by[n].length]);
      const best = Math.min(...avgs.map(a => a[1]));
      avgs.forEach(([n, v]) => { (idx[n] = idx[n] || []).push(v / best); });
    });
    return Object.entries(idx)
      .map(([store, a]) => ({ store, idx: a.reduce((x, y) => x + y, 0) / a.length, n:a.length }))
      .sort((a, b) => a.idx - b.idx);
  }

  // Медіана проміжків стійкіша за середнє: одна відпустка не робить
  // із щотижневого молока щомісячне.
  function rhythm() {
    return Object.entries(purchases())
      .filter(([, b]) => b.length >= 3)
      .map(([name, b]) => {
        const gaps = [];
        for (let i = 1; i < b.length; i++) gaps.push(gap(b[i-1].date, b[i].date));
        gaps.sort((x, y) => x - y);
        const med = gaps[Math.floor(gaps.length / 2)];
        const since = gap(b[b.length-1].date, TODAY);
        return { name, med, since, due: since - med, n:b.length,
          price: b[b.length-1].price, cat: b[b.length-1].cat };
      })
      .sort((a, b) => (stocked(a.name) - stocked(b.name)) || (b.due - a.due));
  }

  // Чи є ця річ зараз у холодильнику з запасом. Якщо є — нагадувати не треба.
  const stocked = (name) => S.items.some(i => i.name === name && daysLeft(i.expires) > 1);
  const dueSoon = () => rhythm().filter(r => r.due >= -1 && !stocked(r.name)
    && !S.list.some(l => l.name === r.name));

  function toList(name, note) {
    if (!S.list.some(l => l.name === name)) {
      S.list.push({ id:uid(), name, note: note || 'додано вручну', got:false });
      save();
    }
  }

  function cookRecipe(rec) {
    const hits = rec.need.map(n => S.items.find(i => i.name === n)).filter(Boolean);
    const snapshot = hits.map(i => ({ i, idx:S.items.indexOf(i) }));
    hits.forEach(i => writeOff(i.id, 'eaten', true));
    toast('Списано ' + hits.length + ' · «' + rec.name + '»', () => {
      snapshot.sort((a,b) => a.idx - b.idx).forEach(s => S.items.splice(s.idx, 0, s.i));
      S.journal.splice(S.journal.length - hits.length, hits.length);
      save(); render();
    });
  }

        + '</b><s>' + esc([...td,...sn].map(i=>i.name).join(', ')).slice(0,40) + '</s></span></button>';
      if (!ex.length && !td.length && !sn.length) h += '<button class="blk b-ok" data-go="soon">'
        + '<span class="g">✓</span><span><b>Все свіже</b><s>Нічого не горить</s></span></button>';
    }

    const list = visible();
    const filtering = S.q || S.place !== 'all' || S.cat !== 'all';
    h += '<p class="sec"><span>' + (filtering ? 'Знайдено ' + list.length : 'Далі за терміном') + '</span></p>';
    if (!list.length) h += '<p class="empty">Нічого не знайшлося.</p>';
    const show = filtering ? list : list.filter(i => daysLeft(i.expires) > 2).slice(0, 6);
    show.forEach((i, k) => { h += rowItem(i, k === show.length - 1); });
    if (!show.length && list.length) h += '<p class="hint">Усі позиції потребують уваги.</p>';

    h += '<div class="facts"><div><b>' + S.items.length + '</b><span>усього</span></div>'
      + '<div><b>' + attention().length + '</b><span>увага</span></div>'
      + '<div><b>' + pct() + '%</b><span>свіжі</span></div></div>';
    return h;
  }

  function vEmpty() {
    return head('Холодильник', { plus:true, l:'Порожньо', r:'0 ПОЗИЦІЙ' })
      + '<p class="hint" style="margin-top:16px;line-height:1.6">Найшвидший спосіб — сфотографувати чек. Десять позицій потраплять у холодильник за три секунди, з термінами.</p>'
      + '<div style="margin-top:16px">'
      + '<button class="big hero" data-go="scan"><span class="ic">◉</span><span><b>Сфотографувати чек</b><s>Найшвидше · терміни підставляться самі</s></span></button>'
      + '<button class="big" data-go="voice"><span class="ic">◍</span><span><b>Сказати голосом</b><s>«Поклав молоко, фарш і шпинат»</s></span></button>'
      + '<button class="big" data-go="barcode"><span class="ic">▤</span><span><b>Сканувати штрихкод</b><s>Назва й термін із бази</s></span></button>'
      + '<button class="big" data-go="manual"><span class="ic">✎</span><span><b>Ввести вручну</b><s>Якщо хочеться контролю</s></span></button>'
      + '</div>';

  function vSoon() {
    const ex = expired(), td = todayGone(), sn = soon();
    let h = head('Скоро', { l:attention().length + ' позицій', r:'ЗА ТЕРМІНОМ' });
    if (!attention().length) {
      const n = sorted()[0];
      return h + '<p class="empty">Нічого не горить.' + (n ? ' Наступне — ' + esc(n.name) + ', ' + fmt(n.expires) + '.' : '') + '</p>';
    }
    const group = (list, cls, label) => {
      if (!list.length) return '';
      let g = '<div class="stamp ' + cls + '"><b>' + label + '</b><span class="mono">' + list.length + '</span></div>';
      list.forEach(i => {
        const st = statusOf(i);
        g += '<button class="row" data-card="' + i.id + '" style="margin-top:9px">'
          + '<span><span class="n">' + esc(i.name) + '</span><span class="u">' + esc(i.qty)
          + ' · ' + esc(i.place) + ' · до ' + fmt(i.expires) + '</span></span>'
          + '<span class="d ' + st.cls + '">' + st.text + '</span></button>'
          + '<div class="btn3" style="margin-bottom:14px">'
          + '<button class="btn" data-eat="' + i.id + '">З’їдено</button>'
          + '<button class="btn gh" data-tolist="' + i.id + '">У список</button>'
          + '<button class="btn rd" data-throw="' + i.id + '">Викинуто</button></div>'
          + (canFreeze(i) ? '<button class="btn gh sm" data-freeze="' + i.id
              + '" style="margin-top:7px;margin-bottom:14px">Заморозити замість викидати · +'
              + FREEZE_DAYS[i.cat] + ' дн</button>' : '');
      });
      return g;
    };
    h += group(ex, '', 'Вжити до · минуло') + group(td, 'a', 'Останній день') + group(sn, 'a', 'Найближчі дні');

    const avail = RECIPES.map(rc => ({ rc, hits: rc.need.filter(n => S.items.some(i => i.name === n)) }))
      .filter(x => x.hits.length >= 2 && x.rc.need.some(n => attention().some(i => i.name === n)));
    if (avail.length) {
      h += '<p class="sec"><span>Ідеї з того, що горить</span></p>';
      avail.slice(0,3).forEach(({ rc, hits }) => {
        h += '<div class="row flat"><span><span class="n">' + esc(rc.name) + '</span>'
          + '<span class="u">' + rc.min + ' хв · ' + esc(hits.join(', ')) + '</span></span>'
          + '<span class="d ok">' + hits.length + '/' + rc.need.length + '</span></div>'
          + '<button class="btn sm gh" data-cook="' + rc.id + '" style="margin-top:8px;margin-bottom:6px">Зробив — списати ' + hits.length + '</button>';
      });
    }
    return h;
  }

  function vCard() {
    const i = S.items.find(x => x.id === UI.card);
    if (!i) { UI.card = null; return vFridge(); }
    if (UI.edit) return vEdit(i);
    const st = statusOf(i), d = daysLeft(i.expires);
    const tone = st.tone === 'red' ? 'b-red' : st.tone === 'am' ? 'b-am' : 'b-ok';
    return head(i.name, { back:'fridge', l:i.qty + ' · ' + i.place, r:i.ean ? 'EAN ' + i.ean.slice(0,7) + '…' : (LABEL[i.cat] || 'Інше') })
      + '<div class="blk ' + tone + '" style="cursor:default"><span class="g">' + (d < 0 ? '!' : d) + '</span>'
      + '<span><b>' + (d < 0 ? 'Прострочено' : d === 0 ? 'Останній день' : 'Ще ' + d + ' дн')
      + '</b><s>Термін до ' + fmt(i.expires) + '</s></span></div>'
      + '<p class="sec"><span>Звідки взявся</span><button data-edit="1">Редагувати</button></p>'
      + flatRow('Категорія', (LABEL[i.cat] || 'Інше') + ' · ' + (i.src === 'dictionary' ? 'зі словника' : i.src === 'model' ? 'визначила модель' : 'вказано вручну'),
          i.src === 'dictionary' ? 'Точно' : 'Перевірте', i.src === 'dictionary' ? 'ok' : 'wr')
      + flatRow('Термін', 'середній для категорії · ' + (SHELF[i.cat] ?? 5) + ' дн', 'Змінити', '', true)
      + '<p class="sec"><span>Твоя історія з ним</span></p>'
      + flatRow('Купував', 'за останні 3 місяці', String(i.bought), '')
      + flatRow('Викидав', i.thrown ? 'варто брати менше' : 'жодного разу', String(i.thrown), i.thrown ? 'cr' : 'ok', true)
      + (i.thrown >= 2 ? '<p class="hint" style="margin-top:11px">Порада: бери одну упаковку замість двох або заморозь одразу.</p>' : '')
      + (S.nutr && nutrOf(i) ? '<p class="sec"><span>КБЖУ</span></p>' + kcalHtml(i) : '')
      + (S.nutr && globalEan(i.ean) && !i.nutr
          ? (UI.busy ? '<div class="busy">Питаю Open Food Facts…</div>'
            : '<button class="btn gh" data-off="' + i.id + '" style="margin-top:10px">Уточнити КБЖУ за штрихкодом</button>')
          : '')
      + (UI.err ? '<div class="err">' + esc(UI.err) + '</div>' : '')
      + '<p class="sec"><span>Зʼїв частину</span><span style="text-transform:none;letter-spacing:0">'
      + (leftOf(i) < 1 ? 'лишилось ' + frac(leftOf(i)) : 'ціла упаковка') + '</span></p>'
      + '<div class="chips">' + FRACTIONS.map(f =>
          '<button class="chip" data-part="' + i.id + '" data-share="' + f[0] + '">'
          + f[1] + ' зʼїв</button>').join('') + '</div>'
      + (canFreeze(i)
          ? '<button class="btn gh" data-freeze="' + i.id + '" style="margin-top:14px">Заморозити · до '
            + fmt(addDays(TODAY, FREEZE_DAYS[i.cat])) + '</button>'
          : i.place === PLACE_FREEZER
            ? '<button class="btn gh" data-unfreeze="' + i.id + '" style="margin-top:14px">Розморозити · зʼїсти за '
              + (SHELF[i.cat] ?? 5) + ' дн</button>'
            : '')
      + '<div class="btn3" style="margin-top:14px">'
      + '<button class="btn" data-eat="' + i.id + '">З’їдено</button>'
      + '<button class="btn gh" data-tolist="' + i.id + '">У список</button>'
      + '<button class="btn rd" data-throw="' + i.id + '">Викинуто</button></div>';
  }

  function vEdit(i) {

      + '</div><p class="sec"><span>Категорія</span></p><div class="chips">'

  function vAdd() {

      + '<p class="hint" style="margin-top:14px;line-height:1.6">Перші три не потребують друку. Ручний ввід стоїть останнім навмисно.</p>'

      + '<button class="big" data-go="voice"><span class="ic">' + svgi('mic') + '</span><span><b>Голосом</b><s>Просто скажи, що поклав</s></span></button>'
      + '<button class="big" data-go="barcode"><span class="ic">' + svgi('barcode') + '</span><span><b>Штрихкод</b><s>Назва й термін із бази EAN</s></span></button>'
      + '<button class="big" data-go="manual"><span class="ic">' + svgi('pencil') + '</span><span><b>Вручну</b><s>Повний контроль над карткою</s></span></button>'

  function vScan() {
    const rec = UI.liveRec || (UI.scan ? RECEIPTS.find(r => r.id === UI.scan) : null);
    return rec ? vReceiptScan(rec) : vScanStart();
  }

  function vScanStart() {
    let h = head('Фото чека', { back:'add', l:'Зніміть свій або відкрийте демо',
      r:S.api ? 'ЖИВИЙ' : 'БЕЗ СЕРВЕРА' })
      + '<label class="filebtn">Зняти чек камерою'
      + '<input type="file" accept="image/*" capture="environment" id="shot"></label>'
      + '<label class="filebtn gh" style="margin-top:7px">Обрати фото з галереї'
      + '<input type="file" accept="image/*" id="pick"></label>';

    if (UI.photo) h += '<div class="shot"><img src="' + UI.photo + '" alt="Знятий чек"></div>';
    if (UI.busy) h += '<div class="busy">Читаю чек…</div>';
    else if (UI.photo) h += '<button class="btn" data-send="1" style="margin-top:12px">Розпізнати чек</button>'
      + '<button class="btn gh" data-nophoto="1" style="margin-top:7px">Прибрати фото</button>';
    if (UI.err) h += '<div class="err">' + esc(UI.err) + '</div>';

    if (!S.api) {
      h += '<p class="hint" style="margin-top:12px;line-height:1.6">Адресу сервера розпізнавання не вказано, '
        + 'тому фото поки нікуди не піде. Ендпоінт — окремий проєкт: <span class="mono">POST /api/receipt</span> '
        + 'з тілом <span class="mono">{"image":"data:image/jpeg;base64,…"}</span>.</p>'
        + '<button class="btn gh" data-go="settings" style="margin-top:10px">Вказати адресу сервера</button>';
    } else {
      h += '<p class="hint" style="margin-top:12px">Фото піде на <span class="mono">' + esc(hostOf(S.api))
        + '</span> і не збережеться ніде більше.</p>';
    }

    h += '<p class="sec"><span>Демо-чеки</span><span style="text-transform:none;letter-spacing:0">без сервера</span></p>'
      + '<p class="hint">Два з трьох — справжні чеки. Третій навмисно поганий: обрізаний зверху.</p><div style="margin-top:12px">';
    RECEIPTS.forEach((r) => {
      const v = validate(r);
      h += '<button class="big" data-scan="' + r.id + '">'
        + '<span class="ic">' + svgi(v.verdict === 'ok' ? 'receipt' : 'alert') + '</span>'
        + '<span><b>' + esc(r.title) + '</b><s>' + plural(r.lines.length, ['позиція','позиції','позицій']) + ' · ' + uah(r.total)
        + ' · ' + (v.verdict === 'ok' ? 'сходиться' : 'не сходиться') + '</s></span></button>';
    });
    return h + '</div>';
  }

  function vReceiptScan(rec) {
    const v = validate(rec);
    const food = rec.lines.filter(l => l.food), skip = rec.lines.filter(l => !l.food);
    const ok = v.verdict === 'ok';
    let h = head('Чек', { back:'scan', l:rec.store, r:rec.when })
      + (rec.live && UI.photo ? '<div class="shot"><img src="' + UI.photo + '" alt="Знятий чек"></div>' : '')
      + '<div class="lens">' + (rec.live && UI.photo ? '' : '<div class="pp" style="height:' + (rec.cut ? 86 : 146) + 'px">'
      + '<i></i>'.repeat(rec.cut ? 4 : 8) + '</div>') + '<span class="bd" style="background:'
      + (ok ? 'var(--ok)' : 'var(--crit)') + ';color:' + (ok ? 'var(--on-accent)' : 'var(--on-accent)') + '">'
      + (ok ? 'Чек зійшовся · ' + v.sum.toFixed(2) + ' = ' + rec.total.toFixed(2)
            : 'Не вистачає ' + v.missing.toFixed(2) + ' ₴') + '</span></div>';

    if (!ok) {
      h += '<div class="stamp" style="margin-top:12px"><b>Верх чека не в кадрі</b><span class="mono">'
        + rec.lines.length + ' з ~' + Math.round(rec.lines.length / Math.max(v.share, 0.05)) + '</span></div>'
        + '<p class="hint" style="margin-top:10px">Розпізнано ' + v.sum.toFixed(2) + ' ₴ із ' + rec.total.toFixed(2) + ' ₴. '
        + (v.vatOk ? '' : 'ПДВ ' + rec.vat.toFixed(2) + ' ₴ не сходиться зі ставкою ' + rec.rate
          + '% — очікували ' + v.expVat.toFixed(2) + ' ₴, отже вище є позиції за іншою ставкою.') + '</p>';
    }
    h += '<p class="sec"><span>Розпізнано · ' + food.length + '</span></p>';
    food.forEach((l, k) => {
      const d = SHELF[l.cat] ?? SHELF.unknown;
      h += flatRow(l.name, l.qty + ' · ' + l.sum.toFixed(2) + ' ₴' + (l.ean ? ' · ' + l.ean.slice(0,4) + '…' : ''),
        d >= 90 ? Math.round(d/30) + ' міс' : d + ' дн', l.src === 'dictionary' ? 'ok' : 'wr',
        k === food.length - 1 && !skip.length);
    });
    skip.forEach((l, k) => {
      h += flatRow(l.name, (l.sum ? l.sum.toFixed(2) + ' ₴ · ' : '') + (l.why || 'не їжа'),
        'Пропущено', '', k === skip.length - 1);
    });

    const model = food.find(l => l.src === 'model'), ean = food.find(l => EAN_DB[l.ean]);
    h += '<p class="sec"><span>Терміни підставлені самі</span></p><p class="hint">'
      + (ean ? '«' + esc(ean.name.split(' ')[0]) + '» — з бази EAN за штрихкодом. ' : '')
      + (model ? '«' + esc(model.name.split(' ')[0]) + '» — категорію дала модель, перевірте дату. ' : '')
      + 'Після додавання можна виправити в картці.</p>';

    h += ok
      ? '<button class="btn" data-add="' + rec.id + '">Додати ' + food.length + ' в холодильник</button>'
      : '<button class="btn" data-go="scan">Перезняти повністю</button>'
        + '<button class="btn gh" data-add="' + rec.id + '" style="margin-top:7px">Додати ' + food.length + ', решту вручну</button>';
    return h;
  }

    if (sp) {

      h += '<div class="split"><i class="sp" style="flex:' + Math.max(sp - th, 1) + '"></i>'
        + '<i class="th" style="flex:' + Math.max(th, 0.001) + '"></i></div>'

      top.forEach(x => {
        h += '<div class="b"><span class="n">' + esc(x.name) + '</span>'

          + '<i class="' + (x.pct > 0 ? 'up' : '') + '" style="width:'

          + '<s>' + x.was.toFixed(2) + ' → ' + x.now.toFixed(2) + ' ₴ · ' + x.n + ' покупок</s></div>';
      });

      st.forEach((x, k) => {

  function vReport() {
    const weeks = [['2026-07-15','2026-07-21','15.07'], ['2026-07-22','2026-07-28','22.07'],
      ['2026-07-29','2026-08-04','29.07'], ['2026-08-05','2026-08-11','Цей']].map(w => {
      const inW = S.journal.filter(j => j.date >= w[0] && j.date <= w[1]);
      const e = inW.filter(j => j.act === 'eaten'), t = inW.filter(j => j.act === 'thrown');
      return { label:w[2], eaten:e.length, thrown:t.length,
        eSum:e.reduce((a,j)=>a+j.price,0), tSum:t.reduce((a,j)=>a+j.price,0) };
    });
    const cur = weeks[3], max = Math.max(1, ...weeks.map(w => Math.max(w.eaten, w.thrown)));
    const weak = {};
    S.journal.filter(j => j.act === 'thrown').forEach(j => { weak[j.name] = (weak[j.name] || 0) + 1; });
    const weakList = Object.entries(weak).sort((a,b) => b[1] - a[1]).slice(0,3);

    let h = head('Тиждень', { back:'more', l:'05–11 серпня', r:'7 ДНІВ' })
      + '<div class="facts" style="border-top:0;margin-top:10px">'
      + '<div><b class="ok">' + cur.eaten + '</b><span>зʼїли · ' + cur.eSum + ' ₴</span></div>'
      + '<div><b class="cr">' + cur.thrown + '</b><span>викинули · ' + cur.tSum + ' ₴</span></div>'
      + '<div><b>' + (cur.eSum - cur.tSum >= 0 ? '+' : '') + (cur.eSum - cur.tSum) + '</b><span>баланс, ₴</span></div></div>'
      + '<p class="sec"><span>Чотири тижні</span></p><div class="chart">';
    weeks.forEach(w => {
      h += '<div class="g"><i style="height:' + Math.max(3, w.eaten/max*100) + '%;background:var(--ok)"></i>'
        + '<i style="height:' + Math.max(3, w.thrown/max*100) + '%;background:var(--crit)"></i></div>';
    });
    h += '</div><div class="xax">' + weeks.map(w => '<span>' + w.label + '</span>').join('') + '</div>'
      + '<p class="sec"><span>Слабкі місця</span></p>';
    if (!weakList.length) h += '<p class="hint">Нічого не викидали. Так тримати.</p>';
    weakList.forEach(([n, c], k) => {
      h += flatRow(n, 'викинуто ' + c + '×', c >= 2 ? 'Бери менше' : 'Стеж', c >= 2 ? 'cr' : 'wr', k === weakList.length - 1);
    });
    return h + '<button class="btn" data-go="money">Скільки це в грошах</button>'
      + '<button class="btn gh" style="margin-top:7px">Поділитися звітом</button>';
  }

      + '</div><p class="hint" style="margin-top:10px">Морозилка й шафа множать термін придатності: заморозка — до 180 днів, суха бакалія — до року.</p>'
      + '<p class="sec"><span>Дані</span></p>'
      + flatRow('Позицій у холодильнику', 'зберігаються на пристрої', String(S.items.length), '')
      + flatRow('Записів у журналі', 'основа для звіту', String(S.journal.length), '')
      + flatRow('Чеків в історії', 'зберігаються цілком', String(S.receipts.length), '', true)
      + '<button class="btn gh" data-export="1" style="margin-top:12px">Вивантажити все у файл</button>'
      + '<label class="filebtn gh" style="margin-top:7px">Завантажити з файла'
      + '<input type="file" accept="application/json,.json" id="imp2"></label>'
      + '<p class="sec"><span>Про цю збірку</span></p>'
      + '<p class="hint" style="line-height:1.6">Шрифт заголовків — системний як підставка: e-Ukraine підставимо перед релізом, тому пропорції справжні, а характер ще ні. Моноширинний — справжній JetBrains Mono.</p>'
      + '<p class="hint" style="margin-top:9px;line-height:1.6">Розпізнавання працює на записаному витягу з двох справжніх чеків. Логіка перевірки — та сама, що в коді ендпоінта: сума позицій проти підсумку, ПДВ проти ставки.</p>'
      + '<p class="hint" style="margin-top:9px;line-height:1.6">Дані зберігаються лише в цьому браузері й нікуди не йдуть.</p>'
      + '<button class="btn gh" data-reset="1" style="margin-top:14px">Скинути все</button>';
  }

  const VIEWS = { onboard:vOnboard, fridge:vFridge, soon:vSoon, add:vAdd, scan:vScan,
    voice:vVoice, barcode:vBarcode, manual:vManual, list:vList, more:vMore, cats:vCats,
    report:vReport, family:vFamily, settings:vSettings, receipts:vReceipts,
    money:vMoney, rhythm:vRhythm };
  const TABS = [['fridge','Холодильник','fridge'], ['soon','Скоро','clock'],
    ['add','+','plus'], ['list','Список','cart'], ['more','Ще','more']];

  function render() {
    applyTheme();
    const v = document.getElementById('view');
    v.innerHTML = !S.onboarded ? vOnboard()
      : UI.card ? vCard()
      : (S.view === 'receipts' && UI.hist) ? vReceipt()
      : (VIEWS[S.view] || vFridge)();
    v.scrollTop = 0;
    document.getElementById('tabs').innerHTML = TABS.map(([k, l, icon]) =>
      k === 'add'
        ? '<button class="add' + (S.view === 'add' ? ' on' : '') + '" data-tab="add" aria-label="Додати">'
          + '<span class="addmark">' + svgi('plus', 's28') + '</span>Додати</button>'
        : '<button class="' + (S.view === k && !UI.card ? 'on' : '') + '" data-tab="' + k + '">'
          + svgi(icon) + l + '</button>'
    ).join('');
    save();
  }

  // ── Події ───────────────────────────────────────────────────────────
  const APP = document.getElementById('app');

  APP.addEventListener('input', (e) => {
    if (e.target.id === 'q') { S.q = e.target.value; const p = e.target.selectionStart; render();
      const n = document.getElementById('q'); if (n) { n.focus(); n.setSelectionRange(p, p); } }
    if (e.target.id === 'm-name') UI.draft.name = e.target.value;
    if (e.target.id === 'm-qty') UI.draft.qty = e.target.value;
    if (e.target.id === 'm-date') UI.draft.expires = e.target.value;
    // Адресу не перемальовуємо на кожну літеру — інакше поле втрачає фокус.
    if (e.target.id === 's-api') { S.api = e.target.value.trim(); save(); }
  });

  // Файли: камера, галерея, імпорт стану.
  APP.addEventListener('change', (e) => {
    const t = e.target, f = t.files && t.files[0];
    if (!f) return;
    if (t.id === 'shot' || t.id === 'pick') {
      UI.err = ''; UI.liveRec = null;
      fileToDataUrl(f, (url) => { UI.photo = url; render(); });
    } else if (t.id === 'imp' || t.id === 'imp2') {
      const fr = new FileReader();
      fr.onload = () => importState(String(fr.result));
      fr.onerror = () => toast('Не вдалося прочитати файл');
      fr.readAsText(f);
    }
    t.value = '';
  });

  APP.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab],[data-go],[data-card],[data-eat],[data-throw],[data-tolist],'
      + '[data-tog],[data-del],[data-shop],[data-buy],[data-scan],[data-add],[data-theme],[data-reset],'
      + '[data-place],[data-push],[data-cook],[data-edit],[data-eplace],[data-ecat],[data-save],'
      + '[data-mcat],[data-mplace],[data-madd],[data-voice],[data-voiceadd],[data-bcadd],[data-bcnext],'
      + '[data-ladd],[data-lquick],[data-notify],[data-onb],[data-invite],'
      + '[data-freeze],[data-unfreeze],[data-part],[data-cat],[data-send],[data-nophoto],'
      + '[data-hist],[data-histdel],[data-nutr],[data-export],[data-off],[data-apiclear],[data-rhadd]');
    if (!t) return;
    const d = t.dataset;
    const goto = (v) => { S.view = v; UI.card = null; UI.edit = false; UI.err = '';
      if (v !== 'scan') { UI.scan = null; UI.liveRec = null; }
      if (v !== 'receipts') UI.hist = null;
      if (v !== 'manual') UI.draft = null; };

    if (d.tab) { goto(d.tab); }
    else if (d.go) {
      if (d.go === 'card') { UI.edit = false; }
      else if (d.go === 'scan' && (UI.scan || UI.liveRec)) { UI.scan = null; UI.liveRec = null; }
      else if (d.go === 'receipts' && UI.hist) { UI.hist = null; }
      else goto(d.go);
    }
    else if (d.card) { UI.card = d.card; UI.edit = false; }
    else if (d.scan) { UI.scan = d.scan; }
    else if (d.add) {
      const r = d.add === 'live' ? UI.liveRec : RECEIPTS.find(x => x.id === d.add);
      if (r) addFromReceipt(r);
    }
    else if (d.send) { sendPhoto(); return; }
    else if (d.nophoto) { UI.photo = null; UI.err = ''; }
    else if (d.off) { offLookup(d.off); return; }
    else if (d.hist) { UI.hist = d.hist; }
    else if (d.histdel) { S.receipts = S.receipts.filter(x => x.id !== d.histdel); UI.hist = null; }
    else if (d.export) { exportState(); return; }
    else if (d.apiclear) { S.api = ''; toast('Адресу прибрано'); }
    else if (d.nutr) { S.nutr = !S.nutr; }
    else if (d.rhadd) {
      const soon = dueSoon();
      if (!soon.length) return;
      const before = S.list.slice();
      soon.forEach(r => toList(r.name, 'за ритмом · зазвичай кожні ' + r.med + ' дн'));
      S.view = 'list';
      toast('Додано ' + soon.length + ' за ритмом покупок',
        () => { S.list = before; save(); render(); });
    }
    else if (d.onb) { S.onboarded = true; goto(d.onb === 'scan' ? 'scan' : 'fridge'); }
    else if (d.eat) { writeOff(d.eat, 'eaten'); }
    else if (d.throw) { writeOff(d.throw, 'thrown'); }
    else if (d.tolist) { const i = S.items.find(x => x.id === d.tolist);
      if (i) { toList(i.name, 'з холодильника'); toast('«' + i.name + '» у списку покупок'); } }
    else if (d.place) { S.place = d.place; }
    else if (d.cat) { S.cat = d.cat; if (S.view === 'cats') { S.view = 'fridge'; UI.card = null; } }
    else if (d.freeze) { freeze(d.freeze); }
    else if (d.unfreeze) { unfreeze(d.unfreeze); }
    else if (d.part) { eatPart(d.part, parseFloat(d.share)); }
    else if (d.push) { S.pushSeen = true; }
    else if (d.cook) { const rc = RECIPES.find(r => r.id === d.cook); if (rc) cookRecipe(rc); }
    else if (d.edit) { UI.edit = true; }
    else if (d.eplace || d.ecat) {
      const i = S.items.find(x => x.id === UI.card);
      if (i) { if (d.eplace) i.place = d.eplace; if (d.ecat) i.cat = d.ecat; }
    }
    else if (d.save) {
      const i = S.items.find(x => x.id === d.save);
      if (i) {
        const n = document.getElementById('e-name'), q = document.getElementById('e-qty'),
              dt = document.getElementById('e-date');
        if (n && n.value.trim()) i.name = n.value.trim();
        if (q && q.value.trim()) i.qty = q.value.trim();
        if (dt && dt.value) i.expires = dt.value;
        i.src = 'manual';
      }
      UI.edit = false; toast('Збережено');
    }
    else if (d.mcat) { UI.draft.cat = d.mcat; UI.draft.expires = addDays(TODAY, SHELF[d.mcat] ?? 5);
      if (d.mcat === 'frozen') UI.draft.place = PLACE_FREEZER; }
    else if (d.mplace) { UI.draft.place = d.mplace; }
    else if (d.madd) {
      const n = document.getElementById('m-name');
      const name = (n ? n.value : UI.draft.name).trim();
      if (!name) return;
      const q = document.getElementById('m-qty'), dt = document.getElementById('m-date');
      addItem({ name, qty:(q && q.value) || '1 шт', cat:UI.draft.cat, place:UI.draft.place,
        expires:(dt && dt.value) || UI.draft.expires, src:'manual' });
      UI.draft = null; goto('fridge'); toast('«' + name + '» у холодильнику');
    }
    else if (d.voice !== undefined && d.voice !== null && t.hasAttribute('data-voice')) { UI.voice = d.voice === '1' ? 1 : 0; }
    else if (d.voiceadd) {
      [['Молоко 2,5%','dairy_milk'],['Фарш яловичий','meat_raw'],['Шпинат','veg_leafy']]
        .forEach(([n, c]) => addItem({ name:n, cat:c, src:'voice' }));
      UI.voice = 0; goto('fridge'); toast('Додано 3 · кількість уточніть у картці');
    }
    else if (d.bcadd) {
      const p = EAN_DB[d.bcadd];
      addItem({ name:p.name, qty:p.qty, cat:p.cat, price:p.price, ean:d.bcadd, src:'dictionary' });
      goto('fridge'); toast('«' + p.name + '» додано з бази EAN');
    }
    else if (d.bcnext) { UI.bc += 1; }
    else if (d.ladd) {
      const n = document.getElementById('l-name');
      const name = n && n.value.trim();
      if (!name) return;
      toList(name, 'додано вручну'); n.value = ''; toast('«' + name + '» у списку');
    }
    else if (d.lquick) { toList(d.lquick, 'часта покупка'); }
    else if (d.tog) { const l = S.list.find(x => x.id === d.tog); if (l) l.got = !l.got; }
    else if (d.del) { S.list = S.list.filter(x => x.id !== d.del); }
    else if (d.shop) { S.shopping = d.shop === '1'; }
    else if (d.buy) {
      const got = S.list.filter(l => l.got);
      got.forEach(l => addItem({ name:l.name, cat:'unknown', src:'unknown' }));
      S.list = S.list.filter(l => !l.got);
      S.shopping = false; goto('fridge');
      toast('Додано ' + got.length + ' · терміни треба перевірити');
    }
    else if (d.invite) { toast('Посилання-запрошення скопійовано'); }
    else if (d.notify) { S.notify = !S.notify; if (S.notify) S.pushSeen = false; }
    else if (d.theme) { S.theme = d.theme; applyTheme(); }
    else if (d.reset) { S = fresh(); UI = freshUI(); }
    render();
  });

  document.getElementById('undo').addEventListener('click', () => {
    if (undoFn) { undoFn(); undoFn = null; }
    document.getElementById('toast').classList.remove('show');
  });
  render();
})();
</script>
