<title>Холодильник+ · сам холодильник</title>
<style>
/*FONTS*/

/* ─────────────────────────────────────────────────────────────────────
   Метафора: застосунок — це і є холодильник, а не список про нього.
   Дверцята ліворуч на завісах, камера з полицями, морозилка внизу
   шухлядою. Кухня навколо темніє разом із темою пристрою — але лампа
   всередині світить завжди, тому інтер'єр не інвертується ніколи.
   ───────────────────────────────────────────────────────────────── */
:root{
  --room:#C9CFD3;          /* кухня навколо */
  --roomln:#AEB6BB;
  --steel:#D3DADE;         /* корпус */
  --steel2:#B6C0C6;
  --seal:#8E999F;          /* ущільнювач */
  --in:#EAF0F3;            /* стінка камери */
  --in2:#D6E1E7;
  --frost:#DCE9F0;         /* морозилка */
  --glass:#F7FBFD;
  --edge:#94A6B0;
  --ink:#101A1F;
  --dim:#5A6C76;
  --cr:#D8271B; --crd:#8E1710;
  --am:#E39400; --amd:#8A5A00;
  --ok:#1E7A4A;
  --lamp:#FFF6D8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --room:#171B1E; --roomln:#23292D; --steel:#454F55; --steel2:#333C42; --seal:#232A2F; }
}
:root[data-theme="dark"]{ --room:#171B1E; --roomln:#23292D; --steel:#454F55; --steel2:#333C42; --seal:#232A2F; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);overflow:hidden;
  font-family:'Jura',ui-sans-serif,system-ui,sans-serif;font-weight:500;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cr);outline-offset:2px}

#app{position:fixed;inset:0;display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;background:var(--room)}

/* ── Верхня панель: шильдик приладу ─────────────────────────────────── */
.plate{flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg,var(--steel),var(--steel2));
  border-bottom:2px solid var(--seal)}
.plate .mark{font-family:'Mono';font-size:12px;font-weight:700;letter-spacing:.2em;
  color:var(--ink);white-space:nowrap}
.plate .temp{margin-left:auto;font-family:'Mono';font-size:11px;font-weight:700;
  letter-spacing:.08em;background:var(--ink);color:var(--glass);padding:4px 8px}
.plate .cnt{font-family:'Mono';font-size:11px;letter-spacing:.08em;color:var(--ink);opacity:.75}

/* ── Корпус ─────────────────────────────────────────────────────────── */
.cab{flex:1;min-height:0;position:relative;margin:10px;
  border:3px solid var(--seal);background:var(--in);
  perspective:1100px;perspective-origin:50% 42%;overflow:hidden}

/* світло лампи згори */
.cab::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(120% 55% at 50% -8%, rgba(255,246,216,.5), rgba(255,246,216,0) 62%)}

.zone{position:absolute;inset:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--in),var(--in2));
  transform-origin:left center;backface-visibility:hidden}
/* Дверцята: сталева панель, що відходить на завісах і відкриває полиці. */
.door-p{position:absolute;inset:0;z-index:9;pointer-events:none;
  transform-origin:left center;
  background:linear-gradient(100deg,var(--steel2),var(--steel) 55%,var(--steel2));
  border-right:3px solid var(--seal);
  animation:dOpen .5s cubic-bezier(.4,.06,.24,1) forwards}
.door-p.rev{transform-origin:right center;border-right:0;border-left:3px solid var(--seal);
  animation-name:dOpenR}
.door-p i{position:absolute;right:14px;top:24%;bottom:24%;width:9px;
  background:linear-gradient(90deg,var(--seal),var(--steel));box-shadow:0 0 0 1px var(--seal)}
.door-p.rev i{right:auto;left:14px}
@keyframes dOpen{from{transform:none;opacity:1}to{transform:rotateY(-104deg);opacity:0}}
@keyframes dOpenR{from{transform:none;opacity:1}to{transform:rotateY(104deg);opacity:0}}
@media (prefers-reduced-motion:reduce){ .door-p{display:none} }

.zscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:12px 12px 8px;display:flex;flex-direction:column;gap:0}

/* ── Полиця ─────────────────────────────────────────────────────────── */
.shelf{position:relative;padding-bottom:11px;margin-bottom:15px;
  flex:1 1 auto;min-height:100px;display:flex;flex-direction:column;justify-content:flex-end}
.shelf .lbl{position:absolute;left:0;top:-2px;font-family:'Mono';font-size:8.5px;
  font-weight:700;letter-spacing:.18em;color:var(--dim);pointer-events:none}
.goods{display:flex;align-items:flex-end;gap:9px;min-height:86px;padding:14px 2px 0;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.goods::-webkit-scrollbar{display:none}
/* скло полиці: тонка плита з підсвіченим торцем */
.glass{position:absolute;left:0;right:0;bottom:0;height:7px;
  background:linear-gradient(180deg,var(--glass),#C8D6DE);
  border-top:1px solid #FFF;box-shadow:0 2px 0 rgba(16,26,31,.16)}
.glass::after{content:'';position:absolute;left:0;right:0;top:3px;height:1px;background:rgba(255,255,255,.85)}

/* ── Річ на полиці ──────────────────────────────────────────────────── */
.thing{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;
  width:54px;position:relative;padding-bottom:2px}
.thing svg{display:block;overflow:visible;filter:drop-shadow(0 2px 0 rgba(16,26,31,.15))}
.thing svg *{vector-effect:non-scaling-stroke}
.thing .nm{font-family:'Mono';font-size:8px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;text-align:center;line-height:1.3;color:var(--ink);
  width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow-wrap:anywhere}
.thing .tag{position:absolute;top:-3px;right:-2px;font-family:'Mono';font-size:8px;
  font-weight:700;letter-spacing:.04em;padding:2px 4px;color:#fff;background:var(--cr);
  z-index:2;white-space:nowrap}
.thing.am .tag{background:var(--am);color:#241700}
.thing.dimmed{opacity:.22}
.thing:active svg{transform:translateY(1px)}

/* ── Шухляда овочів і морозилка ─────────────────────────────────────── */
.drawer{flex:none;margin:0 0 12px;border:2px solid var(--edge);
  background:linear-gradient(180deg,rgba(247,251,253,.75),rgba(200,214,222,.65))}
.drawer > .dh{display:flex;align-items:center;gap:8px;padding:7px 10px;width:100%;
  border-bottom:2px solid var(--edge);text-align:left}
.drawer .dh .t{font-family:'Mono';font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--ink)}
.drawer .dh .c{margin-left:auto;font-family:'Mono';font-size:9px;letter-spacing:.08em;color:var(--dim)}
.drawer .dh .grip{width:26px;height:5px;background:var(--edge);flex:none}
.drawer .goods{min-height:74px;padding:10px 10px 12px}
.drawer.freeze{background:linear-gradient(180deg,var(--frost),#C7DCE8);border-color:#8FA9B8}
.drawer.freeze .dh{border-color:#8FA9B8}
.drawer.shut .goods{display:none}
.drawer.shut .dh{border-bottom:0}

/* ── Завіса: смужка сусідньої зони по краю ──────────────────────────── */
.hinge{position:absolute;top:0;bottom:0;width:26px;z-index:5;
  background:linear-gradient(90deg,var(--steel2),var(--steel));
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.hinge.l{left:0;border-right:2px solid var(--seal)}
.hinge.r{right:0;border-left:2px solid var(--seal)}
.hinge span{font-family:'Mono';font-size:8.5px;font-weight:700;letter-spacing:.22em;
  writing-mode:vertical-rl;text-orientation:mixed;color:var(--ink);opacity:.85}
.hinge.l span{transform:rotate(180deg)}
.zscroll{padding-left:38px;padding-right:38px}
.zscroll.no-l{padding-left:14px}
.zscroll.no-r{padding-right:14px}

/* ── Порожня полиця ─────────────────────────────────────────────────── */
.bare{font-family:'Mono';font-size:9px;letter-spacing:.14em;color:var(--dim);
  align-self:flex-end;padding:0 0 8px 2px;opacity:.7}

/* ── Нижня панель ───────────────────────────────────────────────────── */
.bar{flex:none;display:flex;gap:2px;padding:0 10px calc(10px + env(safe-area-inset-bottom));
  background:var(--room)}
.bar button{flex:1;padding:12px 4px 11px;font-family:'Mono';font-size:9.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.55;
  border-top:3px solid transparent}
.bar button.on{opacity:1;border-top-color:var(--ink)}

/* ── Пошук ──────────────────────────────────────────────────────────── */
.find{flex:none;display:flex;align-items:center;gap:8px;margin:0 10px;
  border:2px solid var(--seal);border-top:0;background:var(--steel);padding:0 10px}
.find input{flex:1;font:inherit;font-family:'Mono';font-size:11px;letter-spacing:.06em;
  background:none;border:0;padding:9px 0;color:var(--ink);min-width:0}
.find input::placeholder{color:var(--ink);opacity:.45}
.find .hit{font-family:'Mono';font-size:9px;font-weight:700;letter-spacing:.1em;
  color:var(--ink);opacity:.7;white-space:nowrap}

/* ── Картка речі ────────────────────────────────────────────────────── */
.sheet{position:absolute;inset:auto 0 0 0;z-index:20;background:var(--glass);
  border-top:3px solid var(--ink);padding:14px 16px 18px;
  transform:translateY(101%);transition:transform .3s cubic-bezier(.3,.8,.35,1)}
.sheet.up{transform:none}
@media (prefers-reduced-motion:reduce){ .sheet{transition:none} }
.sheet h3{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
.sheet .sub{font-family:'Mono';font-size:10px;letter-spacing:.08em;color:var(--dim);
  margin-top:3px;text-transform:uppercase}
.sheet .st{display:inline-block;margin-top:11px;font-family:'Mono';font-size:11px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;
  background:var(--ink);color:var(--glass)}
.sheet .st.cr{background:var(--cr);color:#fff}
.sheet .st.am{background:var(--am);color:#241700}
.sheet .acts{display:flex;gap:6px;margin-top:14px}
.sheet .acts button{flex:1;padding:12px 4px;font-family:'Mono';font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--glass)}
.sheet .acts button.gh{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.sheet .acts button.rd{background:var(--cr);color:#fff}
.sheet .x{position:absolute;top:10px;right:12px;font-family:'Mono';font-size:16px;
  font-weight:700;line-height:1;padding:4px 6px}

/* ── Список: чесний запасний вид ────────────────────────────────────── */
.list{position:absolute;inset:0;z-index:8;background:var(--in);overflow-y:auto;padding:12px}
.list .note{font-family:'Mono';font-size:9.5px;line-height:1.7;letter-spacing:.04em;
  color:var(--dim);border-left:3px solid var(--edge);padding-left:9px;margin-bottom:12px}
.list .row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 2px;border-bottom:1px solid var(--edge)}
.list .row .nm{font-size:15px;font-weight:700}
.list .row .u{display:block;font-family:'Mono';font-size:9px;letter-spacing:.06em;
  color:var(--dim);margin-top:2px;text-transform:uppercase}
.list .row .d{margin-left:auto;font-family:'Mono';font-size:9.5px;font-weight:700;
  letter-spacing:.08em;padding:4px 6px;white-space:nowrap;
  background:var(--ink);color:var(--glass)}
.list .row .d.cr{background:var(--cr);color:#fff}
.list .row .d.am{background:var(--am);color:#241700}
.list .row .d.ok{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--edge)}

.toast{position:absolute;left:10px;right:10px;bottom:10px;z-index:30;background:var(--ink);
  color:var(--glass);padding:11px 13px;display:flex;align-items:center;gap:10px;
  font-family:'Mono';font-size:10.5px;letter-spacing:.05em;
  transform:translateY(140%);transition:transform .26s cubic-bezier(.3,.8,.35,1)}
.toast.up{transform:none}
.toast button{margin-left:auto;font-family:'Mono';font-size:10px;font-weight:700;
  letter-spacing:.12em;text-decoration:underline;flex:none}
</style>

    ['Пельмені','800 г','морозилка','frozen',150],
    ['Гречка','900 г','шафа 2','grocery_dry',400],
    ['Йогурт питний','330 мл','полиця 3','dairy_yogurt',9],
  ];
  let items = seed.map((r,i) => ({ id:'i'+i, name:r[0], qty:r[1], place:r[2],
    cat:r[3], expires:add(TODAY, r[4]) }));

  const UI = { zone:'main', open:{ 'ящик':true, 'морозилка':false }, pick:null, q:'', list:false };
  let undoFn = null, tTimer = null, doorTimer = null;

  // Панель існує рівно поки триває змах. Знімає її таймер, а не подія
  // анімації: якщо анімацію вимкнено чи придушено, вміст усе одно
  // відкриється — просто без видовища.
  function swingDoor(dir) {
    const cab = document.getElementById('cab');
    const old = cab.querySelector('.door-p');
    if (old) old.remove();
    const p = document.createElement('div');
    p.className = 'door-p' + (dir === 'r' ? ' rev' : '');
    p.setAttribute('aria-hidden', 'true');
    p.innerHTML = '<i></i>';
    cab.appendChild(p);
    clearTimeout(doorTimer);
    doorTimer = setTimeout(() => p.remove(), 520);
  }

  const state = i => { const d = days(i.expires);
    return d < 0 ? 'cr' : d === 0 ? 'am' : d <= 2 ? 'am' : 'ok'; };
  const tagOf = i => { const d = days(i.expires);
    return d < 0 ? (d === -1 ? 'ВЧОРА' : d + ' ДН') : d === 0 ? 'СЬОГОДНІ' : d <= 2 ? '+' + d + ' ДН' : ''; };
  const matches = i => !UI.q || i.name.toLowerCase().includes(UI.q);

  function thingHtml(i) {
    const [sh, w, h] = SHAPE[i.cat] || SHAPE.unknown;
    const st = state(i), tag = tagOf(i);
    const dim = UI.q && !matches(i) ? ' dimmed' : '';
    const stroke = st === 'cr' ? 'var(--crd)' : st === 'am' ? 'var(--amd)' : 'var(--ink)';
    const fill = st === 'cr' ? '#F0A79F' : (FILL[i.cat] || FILL.unknown);
    return '<button class="thing ' + st + dim + '" data-pick="' + i.id + '" title="' + esc(i.name) + '">'
      + (tag ? '<span class="tag">' + tag + '</span>' : '')
      + '<svg width="' + w + '" height="' + h + '" fill="' + fill + '" stroke="' + stroke
      + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'
      + '<use href="#s-' + sh + '"/></svg>'
      + '<span class="nm">' + esc(i.name) + '</span></button>';
  }

  const on = (place) => items.filter(i => i.place === place);

  function shelfHtml(label, place) {
    const list = on(place);
    return '<div class="shelf"><span class="lbl">' + label + '</span>'
      + '<div class="goods">' + (list.length ? list.map(thingHtml).join('')
          : '<span class="bare">порожньо</span>') + '</div>'
      + '<div class="glass"></div></div>';
  }

  function drawerHtml(label, place, freeze) {
    const list = on(place), shut = !UI.open[place];
    return '<div class="drawer' + (freeze ? ' freeze' : '') + (shut ? ' shut' : '') + '">'
      + '<button class="dh" data-drawer="' + place + '" aria-expanded="' + !shut + '">'
      + '<span class="grip"></span><span class="t">' + label + '</span>'
      + '<span class="c">' + (shut ? 'ВІДСУНУТИ · ' + list.length : list.length + ' ШТ') + '</span></button>'
      + '<div class="goods">' + (list.length ? list.map(thingHtml).join('')
          : '<span class="bare">порожньо</span>') + '</div></div>';
  }

  function zoneHtml(z) {
    const idx = ZONES.indexOf(z);
    const prev = ZONES[idx - 1], next = ZONES[idx + 1];
    let h = '<div class="zone" data-zone="' + z.id + '">';
    if (prev) h += '<button class="hinge l" data-go="' + prev.id + '"><span>' + prev.side + '</span></button>';
    if (next) h += '<button class="hinge r" data-go="' + next.id + '"><span>' + next.side + '</span></button>';
    h += '<div class="zscroll' + (prev ? '' : ' no-l') + (next ? '' : ' no-r') + '">';
    z.shelves.forEach(s => { h += shelfHtml(s[0], s[1]); });
    (z.drawers || []).forEach(d => { h += drawerHtml(d[0], d[1], d[2]); });
    return h + '</div></div>';
  }

  function listHtml() {
    const sorted = [...items].sort((a,b) => D(a.expires) - D(b.expires));
    let h = '<div class="list"><p class="note">СПИСКОМ — ЗАПАСНИЙ ВИД. ПОЛИЦІ ЧЕСНО ПОКАЗУЮТЬ '
      + 'ДО ПʼЯТИ РЕЧЕЙ У РЯД; НА СОРОКА ПОЗИЦІЯХ ШУКАТИ ПОГЛЯДОМ СТАЄ ДОВШЕ, НІЖ ЧИТАТИ.</p>';
    sorted.forEach(i => {
      const st = state(i), d = days(i.expires);
      h += '<button class="row" data-pick="' + i.id + '">'
        + '<span><span class="nm">' + esc(i.name) + '</span>'
        + '<span class="u">' + esc(i.qty) + ' · ' + esc(i.place) + '</span></span>'
        + '<span class="d ' + st + '">' + (d < 0 ? 'ПРОСТРОЧЕНО' : d === 0 ? 'СЬОГОДНІ' : fmt(i.expires)) + '</span></button>';
    });
    return h + '</div>';
  }

  function sheetHtml() {
    const i = items.find(x => x.id === UI.pick);
    if (!i) return '';
    const st = state(i), d = days(i.expires);
    return '<div class="sheet up"><button class="x" data-close="1" aria-label="Закрити">✕</button>'
      + '<h3>' + esc(i.name) + '</h3>'
      + '<div class="sub">' + esc(i.qty) + ' · ' + esc(i.place) + '</div>'
      + '<span class="st ' + st + '">' + (d < 0 ? 'Прострочено ' + (-d) + ' дн тому'
          : d === 0 ? 'Останній день' : 'Ще ' + d + ' дн · до ' + fmt(i.expires)) + '</span>'
      + '<div class="acts"><button data-eat="' + i.id + '">Зʼїдено</button>'
      + '<button class="gh" data-move="' + i.id + '">Переставити</button>'
      + '<button class="rd" data-throw="' + i.id + '">Викинуто</button></div></div>';
  }

  function render(swing) {
    const cab = document.getElementById('cab');
    cab.innerHTML = UI.list ? listHtml() : zoneHtml(ZONES.find(z => z.id === UI.zone));
    if (UI.pick) cab.insertAdjacentHTML('beforeend', sheetHtml());
    if (swing && !UI.list) swingDoor(swing);
    document.getElementById('bar').innerHTML = ZONES.map(z =>
      '<button class="' + (!UI.list && UI.zone === z.id ? 'on' : '') + '" data-go="' + z.id + '">'
      + z.name + '</button>').join('')
      + '<button class="' + (UI.list ? 'on' : '') + '" data-list="1">Списком</button>';
    const bad = items.filter(i => days(i.expires) <= 0).length;
    document.getElementById('cnt').textContent = items.length + ' речей'
      + (bad ? ' · ' + bad + ' горить' : '');
    const hits = UI.q ? items.filter(matches).length : 0;
    document.getElementById('hit').textContent = UI.q ? hits + ' ЗНАЙДЕНО' : '';
  }

  function toast(msg, fn) {
    document.getElementById('tmsg').textContent = msg;
    undoFn = fn || null;
    document.getElementById('undo').style.display = fn ? '' : 'none';
    const t = document.getElementById('toast');
    t.classList.add('up');
    clearTimeout(tTimer);
    tTimer = setTimeout(() => t.classList.remove('up'), 4200);
  }

  function remove(id, word) {
    const k = items.findIndex(x => x.id === id);
    if (k < 0) return;
    const it = items[k];
    items.splice(k, 1);
    UI.pick = null;
    toast('«' + it.name + '» ' + word, () => { items.splice(k, 0, it); render(); });
  }

  // Переставити — по колу між зонами. У справжньому холодильнику
  // річ пересувають рукою; тут це один тап, бо перетягування пальцем
  // на полиці шириною 52 px не працює.
  const PLACES = ['полиця 1','полиця 2','полиця 3','ящик','морозилка',
                  'дверцята 1','дверцята 2','дверцята 3','шафа 1','шафа 2'];
  function move(id) {
    const i = items.find(x => x.id === id);
    if (!i) return;
    const was = i.place;
    i.place = PLACES[(PLACES.indexOf(was) + 1) % PLACES.length];
    if (i.place === 'морозилка' || i.place === 'ящик') UI.open[i.place] = true;
    UI.zone = i.place.startsWith('дверцята') ? 'door' : i.place.startsWith('шафа') ? 'pantry' : 'main';
    toast('«' + i.name + '» → ' + i.place, () => { i.place = was; render(); });
  }

  document.getElementById('app').addEventListener('click', (e) => {
    const t = e.target.closest('[data-go],[data-pick],[data-drawer],[data-list],[data-close],[data-eat],[data-throw],[data-move]');
    if (!t) return;
    const d = t.dataset;
    let swing = null;
    if (d.go) {
      if (!UI.list && d.go !== UI.zone) {
        swing = ZONES.findIndex(z => z.id === d.go) > ZONES.findIndex(z => z.id === UI.zone) ? 'r' : 'l';
      }
      UI.zone = d.go; UI.list = false; UI.pick = null;
    }
    else if (d.list) { UI.list = true; UI.pick = null; }
    else if (d.pick) { UI.pick = UI.pick === d.pick ? null : d.pick; }
    else if (d.drawer) { UI.open[d.drawer] = !UI.open[d.drawer]; }
    else if (d.close) { UI.pick = null; }
    else if (d.eat) { remove(d.eat, 'зʼїдено'); }
    else if (d.throw) { remove(d.throw, 'викинуто'); }
    else if (d.move) { move(d.move); }
    render(swing);
  });

  document.getElementById('q').addEventListener('input', (e) => {
    UI.q = e.target.value.trim().toLowerCase();
    // Знайдене підсвічується прямо на полиці — решта гасне.
    // Це і є відповідь на «де в мене сир»: не рядок у списку, а місце.
    const first = UI.q && items.find(matches);
    if (first) UI.zone = first.place.startsWith('дверцята') ? 'door'
      : first.place.startsWith('шафа') ? 'pantry' : 'main';
    if (first && (first.place === 'ящик' || first.place === 'морозилка')) UI.open[first.place] = true;
    UI.list = false;
    render();
  });

  document.getElementById('undo').addEventListener('click', () => {
    if (undoFn) { undoFn(); undoFn = null; }
    document.getElementById('toast').classList.remove('up');
  });

  render();
  // Перше, що бачить людина, — як відчиняються дверцята.
  if (!matchMedia('(prefers-reduced-motion:reduce)').matches) swingDoor('l');
})();
</script>
