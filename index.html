<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Гантеля — тримай слово або втрать ставку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html,body{background:#0b0d12;}
  *{-webkit-tap-highlight-color:transparent;}
  .no-scrollbar::-webkit-scrollbar{display:none;}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
  @keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{0%{transform:translateY(12px);opacity:0}100%{transform:translateY(0);opacity:1}}
  .rise{animation:rise .3s ease}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{animation:spin 1s linear infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
const { useState, useEffect, useRef } = React;

/* ---------- Telegram Mini App SDK ---------- */
const tg = (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
const haptic = (type) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch {} };
const tapHaptic = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch {} };
const BOT_LINK = 'https://t.me/GantelyaBot'; // TODO: замінити на реальний бот/мініапп
function tgShare(text) {
  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(BOT_LINK) + '&text=' + encodeURIComponent(text));
    return true;
  }
  return false;
}

const _mkIcon = (inner) => (props) => React.createElement('svg', Object.assign({xmlns:'http://www.w3.org/2000/svg', width:24, height:24, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round'}, props, {dangerouslySetInnerHTML:{__html: inner}}));
const Dumbbell = _mkIcon('<path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/>');
const Camera = _mkIcon('<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>');
const Wallet = _mkIcon('<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>');
const UserIcon = _mkIcon('<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>');
const HomeIcon = _mkIcon('<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>');
const Check = _mkIcon('<polyline points="20 6 9 17 4 12"/>');
const X = _mkIcon('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>');
const ArrowLeft = _mkIcon('<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>');
const ChevronRight = _mkIcon('<polyline points="9 18 15 12 9 6"/>');
const Share2 = _mkIcon('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>');
const Shield = _mkIcon('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>');
const Clock = _mkIcon('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>');
const Upload = _mkIcon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>');
const Sparkles = _mkIcon('<path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/>');
const AlertTriangle = _mkIcon('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>');
const CreditCard = _mkIcon('<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>');
const Coins = _mkIcon('<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>');
const Flame = _mkIcon('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>');
const Heart = _mkIcon('<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>');

const MULT = 2; // виконав челендж — забираєш ставку × MULT

function usePersist(key, initial) {
  const [v, setV] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }, [key, v]);
  return [v, setV];
}

const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const fmt = (n) => Math.round(n).toLocaleString('uk-UA');
const todayKey = () => new Date().toISOString().slice(0, 10);

/* ---------- невеличкі UI-хелпери ---------- */
function Ring({ value, max, size = 168 }) {
  const r = size / 2 - 12;
  const c = 2 * Math.PI * r;
  const pct = Math.min(1, value / max);
  return (
    <svg width={size} height={size} className="rotate-[-90deg]">
      <circle cx={size/2} cy={size/2} r={r} stroke="#1c2230" strokeWidth="12" fill="none" />
      <circle cx={size/2} cy={size/2} r={r} stroke="url(#g)" strokeWidth="12" fill="none"
        strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - pct)}
        style={{ transition: 'stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)' }} />
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stopColor="#3b82f6" />
          <stop offset="1" stopColor="#fbbf24" />
        </linearGradient>
      </defs>
    </svg>
  );
}

function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div className="fixed left-1/2 -translate-x-1/2 top-4 z-50 pop">
      <div className="bg-white text-black text-sm font-semibold px-4 py-2.5 rounded-full shadow-xl">{msg}</div>
    </div>
  );
}

/* ================= APP ================= */
function App() {
  const [page, setPage] = usePersist('g_page', 'home');
  const [balance, setBalance] = usePersist('g_balance', 0);
  const [challenge, setChallenge] = usePersist('g_challenge', null);
  const [txns, setTxns] = usePersist('g_txns', []);
  const [withdrawals, setWithdrawals] = usePersist('g_wd', []);
  const [seenIntro, setSeenIntro] = usePersist('g_intro', false);
  const [toast, setToast] = useState('');
  const [showCreate, setShowCreate] = useState(false);

  const notify = (m) => { setToast(m); setTimeout(() => setToast(''), 1900); };
  const addTxn = (t) => setTxns((p) => [{ id: uid(), ts: Date.now(), ...t }, ...p].slice(0, 60));

  useEffect(() => {
    if (!tg) return;
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor && tg.setHeaderColor('#0b0d12');
      tg.setBackgroundColor && tg.setBackgroundColor('#0b0d12');
    } catch {}
  }, []);

  /* --- дії з челленджем --- */
  function createChallenge({ stake, days }) {
    if (balance < stake) { notify('Недостатньо коштів — поповни гаманець'); return false; }
    setBalance((b) => b - stake);
    addTxn({ type: 'stake', amount: -stake, note: `Ставка · ${days} днів` });
    setChallenge({
      stake, days,
      done: 0, status: 'active',
      createdAt: Date.now(), lastCheckin: null, checkins: [],
    });
    setShowCreate(false);
    setPage('home');
    notify('Челендж створено 💪');
    return true;
  }

  function applyCheckin(res, imgThumb) {
    setChallenge((ch) => {
      if (!ch || ch.status !== 'active') return ch;
      const entry = { ts: Date.now(), verdict: res.verdict, confidence: res.confidence, reason: res.reason, img: imgThumb, demo: !!res.demo };
      if (res.verdict === 'gym') {
        const done = ch.done + 1;
        const won = done >= ch.days;
        if (won) {
          setBalance((b) => b + ch.stake * MULT);
          addTxn({ type: 'win', amount: ch.stake * MULT, note: 'Челендж пройдено — виплата ×2' });
        }
        haptic('success');
        return { ...ch, done, lastCheckin: todayKey(), status: won ? 'won' : 'active', checkins: [entry, ...ch.checkins] };
      }
      haptic('error');
      return { ...ch, checkins: [entry, ...ch.checkins] };
    });
  }

  function failChallenge() {
    setChallenge((ch) => {
      if (!ch || ch.status !== 'active') return ch;
      addTxn({ type: 'burn', amount: 0, note: `Зрив — ${fmt(ch.stake)} ₴ згоріли` });
      return { ...ch, status: 'failed', failedAt: Date.now() };
    });
    haptic('warning');
    notify('Челендж зірвано. Ставка згоріла 🔥');
  }

  function resetChallenge() { setChallenge(null); setPage('home'); }

  /* --- гаманець --- */
  function topup(amount, method) {
    setBalance((b) => b + amount);
    addTxn({ type: 'topup', amount, method, note: method === 'usdt' ? 'Поповнення USDT' : 'Поповнення карткою' });
    notify(`+${fmt(amount)} ₴ зараховано`);
  }
  function requestWithdraw(amount, dest, method) {
    if (amount > balance) { notify('Сума більша за баланс'); return false; }
    setBalance((b) => b - amount);
    setWithdrawals((p) => [{ id: uid(), ts: Date.now(), amount, dest, method, status: 'processing' }, ...p]);
    addTxn({ type: 'withdraw', amount: -amount, method, note: 'Заявка на вивід' });
    notify('Заявку прийнято · до 24 год');
    return true;
  }
  function markWithdrawDone(id) {
    setWithdrawals((p) => p.map((w) => w.id === id ? { ...w, status: 'done', doneAt: Date.now() } : w));
    notify('Вивід виконано');
  }

  if (!seenIntro) return <Intro onDone={() => setSeenIntro(true)} />;

  return (
    <div className="min-h-screen text-slate-100 max-w-md mx-auto relative pb-24" style={{ background: 'radial-gradient(120% 60% at 50% 0%, #131a2b 0%, #0b0d12 55%)' }}>
      <Toast msg={toast} />
      {page === 'home' && <Home {...{ challenge, balance, setPage, onCreate: () => setShowCreate(true), onFail: failChallenge, onReset: resetChallenge }} />}
      {page === 'checkin' && <Checkin {...{ challenge, applyCheckin, setPage, notify }} />}
      {page === 'wallet' && <WalletPage {...{ balance, txns, withdrawals, topup, requestWithdraw, markWithdrawDone }} />}
      {page === 'profile' && <Profile {...{ challenge, notify }} />}

      {showCreate && <CreateSheet {...{ balance, onClose: () => setShowCreate(false), onCreate: createChallenge, goWallet: () => { setShowCreate(false); setPage('wallet'); } }} />}

      <Nav page={page} setPage={setPage} />
    </div>
  );
}

/* ---------- Онбординг ---------- */
function Intro({ onDone }) {
  const steps = [
    { icon: <Dumbbell size={34}/>, t: 'Постав на себе', d: 'Кидаєш 500 ₴, що 21 день ходиш у зал. Тримаєш слово — забираєш удвічі більше.' },
    { icon: <Camera size={34}/>, t: 'Щодня — фото', d: 'Кожен день кидаєш фото з тренування. Це твій пруф.' },
    { icon: <Sparkles size={34}/>, t: 'AI-рефері вирішує', d: 'AI дивиться на фото і каже: зал це чи диван. Обдурити важко.' },
    { icon: <Coins size={34}/>, t: 'Виконав — забираєш ×2', d: 'Пройшов усі дні — отримуєш ставку у подвійному розмірі. Зірвався — гроші згорають.' },
  ];
  const [i, setI] = useState(0);
  const s = steps[i];
  return (
    <div className="min-h-screen max-w-md mx-auto flex flex-col text-slate-100 px-6 py-10" style={{ background: 'radial-gradient(120% 60% at 50% 0%, #131a2b 0%, #0b0d12 55%)' }}>
      <div className="flex-1 flex flex-col items-center justify-center text-center">
        <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-blue-500 to-amber-400 grid place-items-center text-black mb-8 pop" key={i}>{s.icon}</div>
        <h1 className="text-2xl font-extrabold mb-3">{s.t}</h1>
        <p className="text-slate-300 leading-relaxed max-w-xs">{s.d}</p>
      </div>
      <div className="flex gap-1.5 justify-center mb-6">
        {steps.map((_, k) => <div key={k} className={`h-1.5 rounded-full transition-all ${k === i ? 'w-6 bg-white' : 'w-1.5 bg-white/25'}`} />)}
      </div>
      <button onClick={() => i < steps.length - 1 ? setI(i + 1) : onDone()}
        className="w-full py-4 rounded-2xl bg-white text-black font-bold text-lg active:scale-[.98] transition">
        {i < steps.length - 1 ? 'Далі' : 'Почати'}
      </button>
    </div>
  );
}

/* ---------- Головна ---------- */
function Home({ challenge, balance, setPage, onCreate, onFail, onReset }) {
  return (
    <div className="px-5 pt-8">
      <div className="flex items-center justify-between mb-6">
        <div className="flex items-center gap-2">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-amber-400 grid place-items-center text-black"><Dumbbell size={20}/></div>
          <span className="font-extrabold text-lg tracking-tight">Гантеля</span>
        </div>
        <button onClick={() => setPage('wallet')} className="flex items-center gap-1.5 bg-white/5 border border-white/10 rounded-full px-3 py-1.5 text-sm">
          <Wallet size={15} className="text-amber-300"/><span className="font-semibold">{fmt(balance)} ₴</span>
        </button>
      </div>

      {!challenge && (
        <div className="rise">
          <div className="rounded-3xl border border-white/10 bg-white/[0.03] p-6 text-center">
            <div className="w-16 h-16 mx-auto rounded-2xl bg-blue-500/15 text-blue-300 grid place-items-center mb-4"><Dumbbell size={30}/></div>
            <h2 className="text-xl font-bold mb-2">Ще немає челленджу</h2>
            <p className="text-slate-400 text-sm mb-5">Постав на себе гроші й тримай слово. Виконаєш — ×2, зірвешся — згорять.</p>
            <button onClick={onCreate} className="w-full py-3.5 rounded-2xl bg-white text-black font-bold active:scale-[.98] transition">Створити челендж</button>
          </div>
        </div>
      )}

      {challenge && <ChallengeCard {...{ challenge, setPage, onFail, onReset, onCreate }} />}
    </div>
  );
}

function ChallengeCard({ challenge: ch, setPage, onFail, onReset, onCreate }) {
  const checkedToday = ch.lastCheckin === todayKey();
  const left = ch.days - ch.done;

  if (ch.status === 'won') return (
    <div className="rise rounded-3xl border border-emerald-500/30 bg-emerald-500/10 p-6 text-center">
      <div className="text-5xl mb-3">🏆</div>
      <h2 className="text-2xl font-extrabold mb-1">Ти зробив це!</h2>
      <p className="text-slate-300 text-sm mb-1">{ch.days} днів пройдено. Виплата <b>{fmt(ch.stake * MULT)} ₴</b> (×2) зарахована на баланс.</p>
      <p className="text-emerald-300 text-sm mb-5">Дисципліна &gt; мотивація 🔥</p>
      <button onClick={onCreate} className="w-full py-3.5 rounded-2xl bg-white text-black font-bold mb-2">Новий челендж</button>
      <button onClick={onReset} className="w-full py-3 rounded-2xl bg-white/5 border border-white/10 text-slate-300 text-sm">Закрити</button>
    </div>
  );

  if (ch.status === 'failed') return (
    <div className="rise rounded-3xl border border-red-500/30 bg-red-500/10 p-6 text-center">
      <div className="text-5xl mb-3">🔥</div>
      <h2 className="text-2xl font-extrabold mb-1">Ставка згоріла</h2>
      <p className="text-slate-300 text-sm mb-1">Пропущено день — <b>{fmt(ch.stake)} ₴</b> згоріли.</p>
      <p className="text-slate-400 text-sm mb-5">Дисципліна коштує грошей. Спробуй ще.</p>
      <button onClick={onCreate} className="w-full py-3.5 rounded-2xl bg-white text-black font-bold mb-2">Спробувати знову</button>
      <button onClick={onReset} className="w-full py-3 rounded-2xl bg-white/5 border border-white/10 text-slate-300 text-sm">Закрити</button>
    </div>
  );

  return (
    <div className="rise space-y-4">
      <div className="rounded-3xl border border-white/10 bg-white/[0.03] p-6 flex flex-col items-center">
        <div className="relative grid place-items-center">
          <Ring value={ch.done} max={ch.days} />
          <div className="absolute text-center">
            <div className="text-4xl font-extrabold leading-none">{ch.done}<span className="text-slate-500 text-2xl">/{ch.days}</span></div>
            <div className="text-slate-400 text-xs mt-1 uppercase tracking-wide">днів у залі</div>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-2 w-full mt-6 text-center">
          <Stat icon={<Coins size={16}/>} label="Ставка" val={`${fmt(ch.stake)} ₴`} />
          <Stat icon={<Flame size={16}/>} label="Лишилось" val={`${left} дн.`} />
          <Stat icon={<Shield size={16}/>} label="Виграш" val={`${fmt(ch.stake * MULT)} ₴`} />
        </div>
      </div>

      <div className="rounded-2xl border border-white/10 bg-white/[0.03] p-4 flex items-center justify-between gap-3">
        <div className="flex items-center gap-3 min-w-0">
          <div className="w-9 h-9 rounded-xl bg-emerald-500/15 text-emerald-300 grid place-items-center shrink-0"><Coins size={18}/></div>
          <div className="min-w-0">
            <div className="text-xs text-slate-400">Виконаєш челендж — забираєш</div>
            <div className="font-bold">{fmt(ch.stake * MULT)} ₴ <span className="text-emerald-300">×2</span></div>
          </div>
        </div>
        <span className="text-xs font-semibold text-red-300 bg-red-500/10 border border-red-500/20 rounded-full px-2.5 py-1 shrink-0">🔥 −{fmt(ch.stake)} ₴</span>
      </div>

      {checkedToday ? (
        <div className="rounded-2xl border border-emerald-500/25 bg-emerald-500/10 p-4 flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-300 grid place-items-center"><Check size={20}/></div>
          <div><div className="font-semibold">Чек-ін зараховано ✅</div><div className="text-xs text-slate-400">Повертайся завтра за наступним днем</div></div>
        </div>
      ) : (
        <button onClick={() => setPage('checkin')} className="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-500 to-amber-400 text-black font-extrabold text-lg flex items-center justify-center gap-2 active:scale-[.98] transition">
          <Camera size={22}/> Зробити чек-ін
        </button>
      )}

      <div className="rounded-2xl border border-white/[0.06] bg-white/[0.02] p-3">
        <div className="text-[11px] text-slate-500 uppercase tracking-wide mb-2 px-1">Демо-режим прототипу</div>
        <button onClick={onFail} className="w-full py-2.5 rounded-xl bg-red-500/10 text-red-300 text-sm font-medium border border-red-500/20">Змоделювати зрив (спалити ставку)</button>
      </div>
    </div>
  );
}

function Stat({ icon, label, val }) {
  return (
    <div className="bg-white/[0.03] border border-white/[0.06] rounded-2xl py-3">
      <div className="flex justify-center text-slate-400 mb-1">{icon}</div>
      <div className="font-bold text-sm">{val}</div>
      <div className="text-[10px] text-slate-500 uppercase tracking-wide">{label}</div>
    </div>
  );
}

/* ---------- Чек-ін з AI-рефері ---------- */
// Стискаємо фото перед відправкою: макс. 1024px по більшій стороні, JPEG q0.8.
// Телефонні фото бувають >4.5 МБ — це ліміт тіла serverless-функції Vercel.
function fileToParts(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const max = 1024;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          const dataUrl = c.toDataURL('image/jpeg', 0.8);
          resolve({ dataUrl, base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
        } catch (e) {
          const dataUrl = r.result;
          resolve({ dataUrl, base64: dataUrl.split(',')[1], mediaType: file.type || 'image/jpeg' });
        }
      };
      img.onerror = () => {
        const dataUrl = r.result;
        resolve({ dataUrl, base64: dataUrl.split(',')[1], mediaType: file.type || 'image/jpeg' });
      };
      img.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function Checkin({ challenge, applyCheckin, setPage, notify }) {
  const [img, setImg] = useState(null);        // {dataUrl, base64, mediaType}
  const [state, setState] = useState('idle');  // idle | judging | done | offline
  const [result, setResult] = useState(null);
  const fileRef = useRef(null);

  if (!challenge || challenge.status !== 'active') {
    return (
      <div className="px-5 pt-8">
        <Back setPage={setPage} />
        <div className="text-center text-slate-400 mt-20">Немає активного челленджу.</div>
      </div>
    );
  }

  async function pick(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const parts = await fileToParts(f);
    setImg(parts); setState('idle'); setResult(null);
  }

  async function judge() {
    if (!img) return;
    setState('judging');
    try {
      const resp = await fetch('/api/referee', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ image: img.base64, mediaType: img.mediaType }),
      });
      if (!resp.ok) throw new Error('offline');
      const data = await resp.json();
      setResult(data);
      setState('done');
      applyCheckin(data, img.dataUrl);
    } catch (err) {
      setState('offline');
    }
  }

  function demoVerdict(v) {
    const map = {
      gym: { verdict: 'gym', confidence: 0.9, reason: 'Демо: зараховано як тренування.', demo: true },
      couch: { verdict: 'couch', confidence: 0.9, reason: 'Демо: це не схоже на зал.', demo: true },
    };
    const r = map[v];
    setResult(r); setState('done'); applyCheckin(r, img ? img.dataUrl : null);
  }

  const v = result && result.verdict;
  const good = v === 'gym';

  return (
    <div className="px-5 pt-8">
      <Back setPage={setPage} title="Чек-ін дня" />

      <div className="mt-4 rounded-3xl border border-white/10 bg-white/[0.03] overflow-hidden">
        <div className="aspect-[4/5] bg-black/30 relative grid place-items-center">
          {img ? <img src={img.dataUrl} className="w-full h-full object-cover" alt="checkin" />
            : <div className="text-center text-slate-500 px-8">
                <Camera size={40} className="mx-auto mb-3 opacity-60"/>
                <div className="text-sm">Зроби фото з тренування</div>
              </div>}

          {state === 'judging' && (
            <div className="absolute inset-0 bg-black/60 grid place-items-center backdrop-blur-sm">
              <div className="text-center">
                <div className="w-12 h-12 border-white/20 border-t-white rounded-full spin mx-auto mb-3" style={{borderWidth:3}} />
                <div className="text-sm font-medium">AI-рефері дивиться…</div>
              </div>
            </div>
          )}

          {state === 'done' && result && (
            <div className={`absolute inset-0 grid place-items-center backdrop-blur-sm pop ${good ? 'bg-emerald-600/70' : 'bg-red-600/70'}`}>
              <div className="text-center px-6">
                <div className="text-6xl mb-2">{good ? '💪' : (v === 'couch' ? '🛋️' : '🤔')}</div>
                <div className="text-2xl font-extrabold">{good ? 'Залік!' : (v === 'couch' ? 'Не зараховано' : 'Незрозуміло')}</div>
                <div className="text-sm text-white/90 mt-1">{result.reason}</div>
                {typeof result.confidence === 'number' &&
                  <div className="text-xs text-white/70 mt-2">впевненість {Math.round(result.confidence * 100)}%{result.demo ? ' · демо' : ''}</div>}
              </div>
            </div>
          )}
        </div>
      </div>

      <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={pick} className="hidden" />

      {state === 'idle' && (
        <div className="mt-4 space-y-3">
          <button onClick={() => fileRef.current && fileRef.current.click()}
            className="w-full py-4 rounded-2xl bg-white/5 border border-white/10 font-semibold flex items-center justify-center gap-2">
            <Upload size={20}/> {img ? 'Інше фото' : 'Обрати / зняти фото'}
          </button>
          {img && (
            <button onClick={judge} className="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-500 to-amber-400 text-black font-extrabold text-lg flex items-center justify-center gap-2 active:scale-[.98] transition">
              <Sparkles size={20}/> Відправити рефері
            </button>
          )}
        </div>
      )}

      {state === 'offline' && (
        <div className="mt-4 rise">
          <div className="rounded-2xl border border-amber-500/30 bg-amber-500/10 p-4 flex gap-3 mb-3">
            <AlertTriangle size={20} className="text-amber-300 shrink-0 mt-0.5"/>
            <div className="text-sm text-amber-100">
              AI-рефері доступний лише на задеплоєній версії з ключем <code className="text-amber-300">ANTHROPIC_API_KEY</code>. Нижче — демо-вердикт, щоб пройти сценарій.
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <button onClick={() => demoVerdict('gym')} className="py-3.5 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-200 font-semibold">Демо: зал 💪</button>
            <button onClick={() => demoVerdict('couch')} className="py-3.5 rounded-2xl bg-red-500/15 border border-red-500/30 text-red-200 font-semibold">Демо: диван 🛋️</button>
          </div>
        </div>
      )}

      {state === 'done' && (
        <div className="mt-4 space-y-3 rise">
          {good
            ? <button onClick={() => setPage('home')} className="w-full py-4 rounded-2xl bg-white text-black font-bold">Готово · день {challenge.done + 1}</button>
            : <>
                <button onClick={() => { setImg(null); setState('idle'); setResult(null); }} className="w-full py-4 rounded-2xl bg-white text-black font-bold">Спробувати інше фото</button>
                <button onClick={() => setPage('home')} className="w-full py-3 rounded-2xl bg-white/5 border border-white/10 text-slate-300">Пізніше</button>
              </>}
        </div>
      )}
    </div>
  );
}

  ];
  return (
    <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30">
      <div className="mx-4 mb-4 rounded-2xl bg-[#141822]/90 backdrop-blur border border-white/10 flex justify-around py-2 shadow-2xl">
        {items.map(([k, l, Icon]) => {
          const active = page === k || (k === 'home' && page === 'checkin');
          return (
            <button key={k} onClick={() => setPage(k)} className={`flex flex-col items-center gap-1 px-5 py-1.5 rounded-xl transition ${active ? 'text-white' : 'text-slate-500'}`}>
              <Icon size={22} />
              <span className="text-[10px] font-medium">{l}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
