<style>
  :root{
    --bg:#0b1210; --bg2:#0f1a16;
    --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.03);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
    --muted:rgba(255,255,255,.48); --muted2:rgba(255,255,255,.30);
    --emerald:#34d399; --emerald2:#10b981; --teal:#2dd4bf;
    --amber:#fbbf24; --sky:#38bdf8; --red:#f87171;
    --grad:linear-gradient(135deg,#34d399,#10b981);
    --grad-gold:linear-gradient(135deg,#fbbf24,#f59e0b);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  html,body{background:var(--bg);color:#fff;min-height:100%;}
  body{overscroll-behavior-y:none;
    background:
      radial-gradient(120% 60% at 100% 0%,rgba(16,185,129,.12),transparent 55%),
      radial-gradient(90% 50% at 0% 100%,rgba(45,212,191,.08),transparent 55%),
      var(--bg);}
  ::-webkit-scrollbar{display:none;}
  button{cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
  input{font-size:16px;color:#fff;outline:none;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top);}

  .wrap{padding:10px 16px 120px;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .center{justify-content:center;}
  .gap1{gap:4px;} .gap2{gap:8px;} .gap3{gap:12px;}
  .col{display:flex;flex-direction:column;}
  .flex1{flex:1;}
  .wrapf{flex-wrap:wrap;}
  .mt1{margin-top:4px;} .mt2{margin-top:8px;} .mt3{margin-top:12px;} .mt4{margin-top:16px;} .mt5{margin-top:20px;} .mt6{margin-top:24px;}
  .mb2{margin-bottom:8px;} .mb3{margin-bottom:12px;} .mb4{margin-bottom:16px;}
  .muted{color:var(--muted);} .muted2{color:var(--muted2);}
  .small{font-size:12.5px;} .xs{font-size:11px;} .tiny{font-size:10px;}
  .b{font-weight:700;} .sb{font-weight:600;} .eb{font-weight:800;}
  .ct{text-align:center;} .right{text-align:right;}
  .em{color:var(--emerald);} .am{color:var(--amber);} .rd{color:var(--red);} .sky{color:var(--sky);}
  .up{text-transform:uppercase;letter-spacing:.08em;}
  .nowrap{white-space:nowrap;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;}
  .p3{padding:12px;} .p4{padding:16px;} .p5{padding:20px;}

  .btn{border-radius:16px;padding:14px;font-weight:700;width:100%;transition:transform .1s,opacity .2s;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--grad);color:#04140e;box-shadow:0 10px 26px rgba(16,185,129,.28);}
  .btn-gold{background:var(--grad-gold);color:#2a1a02;box-shadow:0 10px 26px rgba(245,158,11,.24);}
  .btn-ghost{background:var(--card2);border:1px solid var(--line);color:#fff;}
  .btn-danger{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red);}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .btn-sm{width:auto;padding:9px 15px;font-size:13px;border-radius:13px;}

  .input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:15px;
    padding:14px 15px;transition:border-color .2s;}
  .input:focus{border-color:rgba(52,211,153,.6);}
  .input::placeholder{color:var(--muted2);}
  .lbl{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 3px;}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:.06em;padding:5px 9px;border-radius:999px;}
  .pill-sale{background:rgba(56,189,248,.14);color:#7dd3fc;}
  .pill-sold{background:rgba(52,211,153,.14);color:var(--emerald);}
  .pill-settled{background:rgba(255,255,255,.08);color:var(--muted);}

  /* header */
  .hd{padding:14px 16px 2px;}
  .logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#04140e;font-weight:900;font-size:20px;box-shadow:0 8px 20px rgba(16,185,129,.30);}
  .rolesw{display:flex;gap:4px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:4px;}
  .rolesw button{flex:1;padding:9px 6px;border-radius:11px;font-size:12.5px;font-weight:800;color:var(--muted);
    transition:all .18s;line-height:1.05;}
  .rolesw button .rn{font-size:10px;font-weight:700;opacity:.7;display:block;margin-top:1px;}
  .rolesw button.on.owner{background:linear-gradient(135deg,rgba(56,189,248,.9),rgba(14,165,233,.9));color:#04121c;}
  .rolesw button.on.manager{background:var(--grad-gold);color:#2a1a02;}
  .rolepill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:8px 13px;border-radius:11px;}
  .rolepill.owner{background:rgba(56,189,248,.16);color:#7dd3fc;}
  .rolepill.manager{background:rgba(251,191,36,.16);color:var(--amber);}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot.on{background:var(--emerald);box-shadow:0 0 8px var(--emerald);} .dot.off{background:var(--muted2);}

  /* hero balance */
  .hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;
    border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.34);}
  .hero.owner{background:linear-gradient(160deg,#0b2536 0%,#0e2b2a 60%,#0c1a18 100%);}
  .hero.manager{background:linear-gradient(160deg,#2e2410 0%,#26301f 55%,#101a14 100%);}
  .hero::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 108% -10%,rgba(52,211,153,.18),transparent 52%);}
  .hero>*{position:relative;}
  .hero-cap{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;}
  .hero-big{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin-top:6px;}
  .hero-sub{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.4;}

  /* stat grid */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;}
  .stat .k{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25;}
  .stat .v{font-size:19px;font-weight:800;margin-top:6px;letter-spacing:-.01em;}
  .stat .v.sm{font-size:16px;}

  /* deal card */
  .deal{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:15px 15px 14px;margin-bottom:12px;overflow:hidden;}
  .deal .acc{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .deal .acc.sale{background:var(--sky);} .deal .acc.sold{background:var(--emerald);}
  .deal .acc.settled{background:rgba(255,255,255,.25);}
  .dname{font-size:16px;font-weight:800;line-height:1.2;padding-right:6px;}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;}
  .kv .kk{color:var(--muted);}
  .kv .vv{font-weight:700;}
  .split{background:rgba(0,0,0,.22);border:1px solid var(--line2);border-radius:14px;padding:11px 12px;margin-top:10px;}
  .divi{height:1px;background:var(--line2);margin:8px 0;}

  /* section head */
  .sh{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:22px 3px 12px;}

  /* quick chips */
  .chip{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;
    padding:8px 12px;font-size:12.5px;font-weight:700;color:#fff;}
  .chip:active{transform:scale(.96);}

  /* explainer */
  .exp{background:linear-gradient(180deg,rgba(52,211,153,.08),rgba(52,211,153,.02));
    border:1px solid rgba(52,211,153,.22);border-radius:20px;padding:16px;}
  .exp .fl{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .exp .fl .op{color:var(--muted);}
  .formula{font-size:12.5px;color:var(--muted);line-height:1.55;}

  /* onboarding / invite */
  .onb{border-radius:22px;padding:20px;border:1px solid var(--line);background:var(--card);}
  .invb{border-radius:20px;padding:16px;background:linear-gradient(180deg,rgba(56,189,248,.10),rgba(56,189,248,.02));
    border:1px solid rgba(56,189,248,.25);margin-bottom:16px;}
  .codebox{font-size:30px;font-weight:900;letter-spacing:.22em;text-align:center;padding:14px;border-radius:14px;
    background:rgba(0,0,0,.32);border:1px dashed var(--line);margin:10px 0;color:#fff;}
  .orline{display:flex;align-items:center;gap:10px;margin:18px 0;}
  .orline .ln{flex:1;height:1px;background:var(--line);}

  /* empty */
  .empty{text-align:center;padding:38px 20px;}
  .empty .ic{font-size:54px;}
  .empty .t{font-size:17px;font-weight:800;margin-top:12px;}
  .empty .d{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.5;}

  /* settings */
  .cfg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;}
  .range{width:100%;-webkit-appearance:none;height:6px;border-radius:999px;outline:none;margin-top:4px;
    background:linear-gradient(90deg,var(--amber) var(--fill,30%),rgba(255,255,255,.12) var(--fill,30%));}
  .range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4);border:3px solid var(--amber);}
  .range[disabled]{opacity:.6;}
  .banner{border-radius:14px;padding:11px 13px;font-size:12px;line-height:1.45;margin-bottom:12px;}
  .banner.demo{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.25);color:#fcd9a0;}
  .banner.live{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.25);color:#a7f3d0;}

  /* toast */
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:100px;z-index:60;
    background:rgba(20,30,26,.96);border:1px solid var(--line);border-radius:14px;padding:12px 18px;
    font-size:13.5px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;max-width:88%;text-align:center;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  /* bottom nav */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid var(--line);
    background:rgba(11,18,16,.92);backdrop-filter:blur(20px);padding-bottom:env(safe-area-inset-bottom);}
  .nav-in{max-width:480px;margin:0 auto;display:flex;}
  .nav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--muted2);font-size:10.5px;font-weight:700;transition:color .18s;}
  .nav button.on{color:var(--emerald);}
  .nav button svg{width:23px;height:23px;}
  .nav.hide{display:none;}

  /* modal */
  .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s;}
  .ov.on{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:480px;background:var(--bg2);border:1px solid var(--line);
    border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(30px);transition:transform .26s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow-y:auto;}
  .ov.on .sheet{transform:translateY(0);}
  .grab{width:38px;height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin:0 auto 14px;}
  .sh-title{font-size:19px;font-weight:900;}

  .anim{animation:fade .3s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* splash */
  .splash{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--emerald);animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>

<script>
"use strict";
const KEY='profit_state_v1';
const DEFAULTS={
  settings:{sharePct:30, currency:'грн', ownerName:'Я', managerName:'Управляющая'},
  role:'owner', tab:'deals', deals:[]
};
function loadLocal(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.settings) return {...DEFAULTS,...r, settings:{...DEFAULTS.settings,...r.settings}};
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
let S=loadLocal();               // локальное состояние (демо-режим + UI: tab)
function saveLocal(){ localStorage.setItem(KEY, JSON.stringify(S)); }

// сетевое состояние
let ONLINE=false, SHOP=null, DEALS=[], MYNAME='';

// текущий «вид» — единый источник для рендера (демо или онлайн)
const V={online:false, role:'owner', deals:[], sharePct:30, currency:'грн', ownerName:'Я', managerName:'Управляющая', shop:null};
function buildView(){
  V.online=ONLINE;
  if(ONLINE){
    V.shop=SHOP;
    if(SHOP){
      V.role=SHOP.role; V.deals=DEALS; V.sharePct=SHOP.sharePct; V.currency=SHOP.currency||'грн';
      const partner=SHOP.partner;
      if(SHOP.role==='owner'){ V.ownerName=SHOP.me.name||'Владелец'; V.managerName=partner?partner.name:'Управляющая'; }
      else{ V.managerName=SHOP.me.name||'Управляющая'; V.ownerName=partner?partner.name:'Владелец'; }
    }else{
      // онлайн, но магазина ещё нет → экран онбординга (нейтральные значения)
      V.role='owner'; V.deals=[]; V.sharePct=30; V.currency='грн'; V.ownerName='Владелец'; V.managerName='Управляющая';
    }
  }else{
    V.shop=null; V.role=S.role; V.deals=S.deals;
    V.sharePct=S.settings.sharePct; V.currency=S.settings.currency;
    V.ownerName=S.settings.ownerName; V.managerName=S.settings.managerName;
  }
}

/* --- helpers --- */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(n){
  n=Math.round(Number(n)||0);
  const s=Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (n<0?'−':'')+s+' '+V.currency;
}
function num(v){ return Math.max(0, Math.round(Number(String(v).replace(/[^\d.-]/g,''))||0)); }
let uidc=0;
function uid(){ return 'd'+Date.now().toString(36)+(uidc++).toString(36); }

/* --- business logic --- */
function calc(d){
  const pct=V.sharePct/100;
  const net=(d.salePrice||0)-(d.purchase||0)-(d.salary||0);
  const mgrShare=Math.round(net*pct);
  const ownShare=net-mgrShare;
  return {net, mgrShare, ownShare,
    mgrTotal:(d.purchase||0)+(d.salary||0)+mgrShare, // возврат вложенного + зарплата + доля
    ownTotal:ownShare};
}
function totals(){
  const t={turnover:0,net:0,salaryTotal:0,mgrEarn:0,ownProfit:0,
    investedNow:0,investedAll:0,mgrWithdrawable:0,mgrWithdrawn:0,
    ownReceivable:0,ownReceived:0,soldCount:0,saleCount:0};
  V.deals.forEach(d=>{
    t.investedAll+=d.purchase||0;
    if(d.status==='onsale'){ t.investedNow+=d.purchase||0; t.saleCount++; return; }
    const c=calc(d); t.soldCount++;
    t.turnover+=d.salePrice||0; t.net+=c.net; t.salaryTotal+=d.salary||0;
    t.mgrEarn+=(d.salary||0)+c.mgrShare; t.ownProfit+=c.ownShare;
    if(d.settled){ t.mgrWithdrawn+=c.mgrTotal; t.ownReceived+=c.ownShare; }
    else { t.mgrWithdrawable+=c.mgrTotal; t.ownReceivable+=c.ownShare; }
  });
  return t;
}

/* --- toast --- */
let toT;
function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(toT); toT=setTimeout(()=>el.classList.remove('on'),2100); }

/* ============ NETWORK ============ */
function tgInitData(){ try{ return (window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)||''; }catch(e){ return ''; } }
async function api(action, extra){
  const r=await fetch('/api/profit',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({action, initData:tgInitData()}, extra||{}))});
  return r.json();
}
const ERR={forbidden:'Менять это может только владелец', not_found:'Товар не найден',
  shop_full:'В магазине уже двое', not_configured:'Сервер не подключён', bad_auth:'Ошибка входа Telegram',
  rate_limited:'Слишком часто — подождите', bad_code:'Неверный код', bad_input:'Проверьте введённые данные',
  no_shop:'Сначала создайте или войдите в магазин'};
function applyState(j){ if('shop' in j){ SHOP=j.shop||null; DEALS=j.deals||[]; } if(j.me&&j.me.name) MYNAME=j.me.name; }
async function apiCall(action, extra, okMsg){
  try{
    const j=await api(action, extra);
    if(!j || j.ok===false){ toast(ERR[j&&j.reason]||'Не удалось, попробуйте ещё раз'); return false; }
    applyState(j); buildView(); render(); if(okMsg) toast(okMsg);
    return true;
  }catch(e){ toast('Нет связи с сервером'); return false; }
}
async function boot(){
  const initData=tgInitData();
  if(!initData){ ONLINE=false; buildView(); render(); hideSplash(); return; } // не в Telegram → демо
  try{
    const j=await api('state');
    if(!j || j.reason==='not_configured' || j.reason==='bad_auth'){ ONLINE=false; buildView(); render(); hideSplash(); return; }
    ONLINE=true; applyState(j);
    // авто-вход по коду из ссылки-приглашения (?startapp=CODE)
    const sp=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.start_param)||'';
    if(!SHOP && sp){ await apiCall('shop_join',{code:sp}); hideSplash(); return; }
    buildView(); render(); hideSplash();
  }catch(e){ ONLINE=false; buildView(); render(); hideSplash(); }
}
function hideSplash(){ const s=$('splash'); if(s){ s.style.opacity='0'; s.style.transition='opacity .3s'; setTimeout(()=>s.remove(),320); } }

        <span class="row gap1 small muted"><span class="dot ${linked?'on':'off'}"></span>${linked?esc(partnerName):'ждём партнёра'}</span></div>`;
    } else { rs.innerHTML=''; }
  }else{
    rs.className='rolesw mt3';
    rs.innerHTML=`<button data-role="owner">Владелец<span class="rn">${esc(S.settings.ownerName)}</span></button>
      <button data-role="manager">Управляющая<span class="rn">${esc(S.settings.managerName)}</span></button>`;
    rs.querySelectorAll('button').forEach(b=>{const on=b.dataset.role===V.role;b.classList.toggle('on',on);
      b.classList.toggle('owner',b.dataset.role==='owner');b.classList.toggle('manager',b.dataset.role==='manager');});
  }
  if(!V.online){ rs.className='rolesw mt3'; } else { rs.className='mt3'; }

  const onboarding=V.online && !V.shop;
  $('navBar').classList.toggle('hide', onboarding);
  document.querySelectorAll('#nav button').forEach(b=> b.classList.toggle('on', b.dataset.tab===S.tab));

  const v=$('view');
  if(onboarding) v.innerHTML=viewOnboard();

}

function dealCard(d){
  const isOwner=V.role==='owner';
  const c=calc(d);
  let status = d.status==='onsale'
    ? '<span class="pill pill-sale">в продаже</span>'
    : (d.settled?'<span class="pill pill-settled">рассчитано</span>':'<span class="pill pill-sold">продано</span>');
  let body='';
  body+=`<div class="kv"><span class="kk">Закупка</span><span class="vv">${money(d.purchase)}</span></div>`;
  if(d.status==='onsale'){
    body+=`<div class="small muted" style="margin-top:2px">Деньги вложила: <b class="am">${esc(V.managerName)}</b></div>`;

      ? `<div class="row gap2 mt3"><button class="btn btn-ghost btn-sm" data-act="editDeal" data-id="${d.id}">Изменить</button><button class="btn btn-primary btn-sm flex1" data-act="sell" data-id="${d.id}">Внести продажу</button></div>`
      : `<button class="btn btn-gold btn-sm mt3" data-act="sell" data-id="${d.id}">Внести продажу</button>`;
    return dealWrap(d,status,body);
  }
  body+=`<div class="kv"><span class="kk">Продажа</span><span class="vv">${money(d.salePrice)}</span></div>`;
  body+=`<div class="kv"><span class="kk">Зарплата</span><span class="vv am">${money(d.salary)}</span></div>`;
  body+=`<div class="split">`;
  body+=`<div class="kv" style="padding:2px 0"><span class="kk">Чистая прибыль</span><span class="vv em">${money(c.net)}</span></div>`;
  body+=`<div class="divi"></div>`;
  body+=`<div class="kv" style="padding:2px 0"><span class="kk">${esc(V.managerName)} · ${V.sharePct}%</span><span class="vv am">${money(c.mgrShare)}</span></div>`;
  body+=`<div class="kv" style="padding:2px 0"><span class="kk">${esc(V.ownerName)} · ${100-V.sharePct}%</span><span class="vv sky">${money(c.ownShare)}</span></div>`;
  body+=`</div>`;
  if(isOwner){
    body+=`<div class="kv" style="margin-top:9px"><span class="kk">${d.settled?'Получено':'К получению'}, вам</span><span class="vv sky">${money(c.ownTotal)}</span></div>`;
  }else{
    body+=`<div class="kv" style="margin-top:9px"><span class="kk">${d.settled?'Забрано':'Можно забрать'} <span class="muted2">(вложенное+ЗП+доля)</span></span><span class="vv am">${money(c.mgrTotal)}</span></div>`;
  }
  body+=`<div class="row gap2 mt3">`;
  if(isOwner) body+=`<button class="btn btn-ghost btn-sm" data-act="editSold" data-id="${d.id}">Изменить</button>`;
  body+= d.settled
    ? `<button class="btn btn-ghost btn-sm flex1" data-act="unsettle" data-id="${d.id}">Вернуть в «к расчёту»</button>`
    : `<button class="btn ${isOwner?'btn-primary':'btn-gold'} btn-sm flex1" data-act="settle" data-id="${d.id}">Рассчитаться</button>`;
  body+=`</div>`;
  return dealWrap(d,status,body);
}
function dealWrap(d,status,body){
  const accls = d.status==='onsale'?'sale':(d.settled?'settled':'sold');
  return `<div class="deal"><div class="acc ${accls}"></div>
    <div class="row between" style="align-items:flex-start">
      <div class="dname flex1">${esc(d.name||'Без названия')}</div>${status}
    </div>${body}</div>`;
}
function viewDeals(){
  const isOwner=V.role==='owner';
  let h='';
  if(V.online && V.shop && !V.shop.linked) h+=inviteBanner();
  h+= isOwner
    ? `<button class="btn btn-primary" data-act="addDeal"><span style="font-size:18px;line-height:1">＋</span> Добавить товар (закупку)</button>`
    : `<div class="card p4 row gap3"><div style="font-size:30px">📥</div><div class="flex1"><div class="sb">Товар заводит владелец</div><div class="small muted mt1">Он вносит закупку. Ты вносишь продажу и зарплату по проданным.</div></div></div>`;

  const onsale=V.deals.filter(d=>d.status==='onsale');
  const sold=V.deals.filter(d=>d.status==='sold'&&!d.settled);
  const settled=V.deals.filter(d=>d.status==='sold'&&d.settled);

  if(!V.deals.length){
    h+=`<div class="empty"><div class="ic">👟</div><div class="t">Пока нет товаров</div>
      <div class="d">${isOwner?'Добавь первую закупку — например «Nike Air Max», закупка 2000 ₴. Управляющая позже внесёт продажу.':'Как только владелец добавит закупку, ты сможешь внести продажу.'}</div></div>`;
    h+=explainerCard();
    return h;
  }
  if(onsale.length){ h+=`<div class="sh">В продаже · ${onsale.length}</div>`; onsale.forEach(d=>h+=dealCard(d)); }
  if(sold.length){ h+=`<div class="sh">Продано · к расчёту · ${sold.length}</div>`; sold.forEach(d=>h+=dealCard(d)); }
  if(settled.length){ h+=`<div class="sh">Рассчитано · ${settled.length}</div>`; settled.forEach(d=>h+=dealCard(d)); }
  return h;
}

    </div>
    <button class="btn btn-primary mt4" data-act="${edit?'saveDeal':'createDeal'}" ${edit?`data-id="${d.id}"`:''}>${edit?'Сохранить':'Добавить товар'}</button>
    ${edit?`<button class="btn btn-danger mt2" data-act="delDeal" data-id="${d.id}">Удалить товар</button>`:''}
  `);
  setTimeout(()=>$('fName')&&$('fName').focus(),200);
}
function sheetSell(d){
  const editing = d.status==='sold';
  const c=V.currency;
  openSheet(`
    <div class="sh-title">${editing?'Изменить продажу':'Внести продажу'}</div>
    <div class="small muted mt1 mb4">${esc(d.name)} · закупка ${money(d.purchase)}</div>
    <div class="lbl">Продажа (за сколько продали), ${esc(c)}</div>
    <input class="input" id="fSale" inputmode="numeric" value="${editing?d.salePrice:''}" placeholder="4000" oninput="previewSplit(${d.purchase})">
    <div class="row gap2 mt3 wrapf">
      ${[3000,3500,4000,4500].map(x=>`<button class="chip" data-fill="fSale" data-val="${x}" data-preview="${d.purchase}">${x}</button>`).join('')}
    </div>
    <div class="lbl mt4">Зарплата с этой продажи, ${esc(c)}</div>
    <input class="input" id="fSalary" inputmode="numeric" value="${editing?d.salary:''}" placeholder="200" oninput="previewSplit(${d.purchase})">
    <div class="small muted mt2 mb2">Быстрые кнопки — перенести значение в зарплату:</div>
    <div class="row gap2 wrapf">
      <button class="chip" data-fill="fSalary" data-val="200" data-preview="${d.purchase}">200</button>
      <button class="chip" data-salpct="5" data-preview="${d.purchase}">5% продажи</button>
      <button class="chip" data-salpct="10" data-preview="${d.purchase}">10% продажи</button>
      <button class="chip" data-fill="fSalary" data-val="0" data-preview="${d.purchase}">Без ЗП</button>
    </div>
    <div class="split mt4" id="preview"></div>
    <button class="btn btn-gold mt4" data-act="${editing?'updateSell':'saveSell'}" data-id="${d.id}">${editing?'Сохранить':'Провести продажу'}</button>
  `);
  previewSplit(d.purchase);
  setTimeout(()=>$('fSale')&&$('fSale').focus(),200);
}
function previewSplit(purchase){
  const sale=num($('fSale')?$('fSale').value:0);
  const salary=num($('fSalary')?$('fSalary').value:0);
  const pct=V.sharePct/100;
  const net=sale-purchase-salary;
  const ms=Math.round(net*pct), os=net-ms;
  const el=$('preview'); if(!el) return;
  el.innerHTML=`
    <div class="kv" style="padding:3px 0"><span class="kk">Чистая прибыль</span><span class="vv ${net<0?'rd':'em'}">${money(net)}</span></div>
    <div class="divi"></div>
    <div class="kv" style="padding:3px 0"><span class="kk">${esc(V.managerName)} (${V.sharePct}%) + вложенное + ЗП</span><span class="vv am">${money(purchase+salary+ms)}</span></div>
    <div class="kv" style="padding:3px 0"><span class="kk">${esc(V.ownerName)} (${100-V.sharePct}%)</span><span class="vv sky">${money(os)}</span></div>`;
}
window.previewSplit=previewSplit;

/* ============ ACTIONS ============ */
document.addEventListener('click',e=>{
  const roleBtn=e.target.closest('#rolesw button');
  if(roleBtn){ S.role=roleBtn.dataset.role; saveLocal(); buildView(); render(); return; }
  const navBtn=e.target.closest('#nav button');
  if(navBtn){ S.tab=navBtn.dataset.tab; saveLocal(); render(); return; }

  const fill=e.target.closest('[data-fill]');
  if(fill){ const inp=$(fill.dataset.fill); if(inp){ inp.value=fill.dataset.val; if(fill.dataset.preview!=null) previewSplit(+fill.dataset.preview); } return; }
  const salpct=e.target.closest('[data-salpct]');
  if(salpct){ const sale=num($('fSale')?$('fSale').value:0); const inp=$('fSalary'); if(inp){ inp.value=Math.round(sale*(+salpct.dataset.salpct)/100); previewSplit(+salpct.dataset.preview); } return; }
  const setpct=e.target.closest('[data-setpct]');
  if(setpct){ const v=+setpct.dataset.setpct;
    if(V.online){ apiCall('settings_save',{share_pct:v},'Доля: '+v+'%'); }
    else{ S.settings.sharePct=v; saveLocal(); buildView(); render(); toast('Доля управляющей: '+v+'%'); }
    return; }

  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  const d=id?V.deals.find(x=>x.id===id):null;

  /* ---- onboarding ---- */
  if(act==='createShop'){ apiCall('shop_create', null); return; }
  if(act==='joinShop'){
    const code=($('joinCode').value||'').toUpperCase().trim();
    if(code.length<4){ toast('Введите код'); return; }
    apiCall('shop_join',{code}); return;
  }
  if(act==='copyCode'){
    const code=V.shop&&V.shop.inviteCode||'';
    try{ navigator.clipboard.writeText(code); toast('Код скопирован: '+code); }
    catch(e){ toast('Код: '+code); }
    return;
  }

  /* ---- deals ---- */
  if(act==='addDeal'){ sheetAddDeal(null); return; }
  if(act==='editDeal'||act==='editSold'){ sheetAddDeal(d); return; }
  if(act==='sell'){ sheetSell(d); return; }

  if(act==='createDeal'){
    const name=$('fName').value.trim(), p=num($('fPurchase').value);
    if(!name){ toast('Введи название'); return; }
    if(!p){ toast('Введи сумму закупки'); return; }
    if(V.online){ apiCall('deal_add',{name,purchase:p},'Товар добавлен').then(ok=>{ if(ok) closeSheet(); }); }
    else{ S.deals.unshift({id:uid(),name,purchase:p,salePrice:0,salary:0,status:'onsale',settled:false,createdAt:Date.now()});
      saveLocal(); closeSheet(); buildView(); render(); toast('Товар добавлен'); }
    return;
  }
  if(act==='saveDeal'){
    const name=$('fName').value.trim()||d.name, p=num($('fPurchase').value);
    if(V.online){ apiCall('deal_edit',{id,name,purchase:p},'Сохранено').then(ok=>{ if(ok) closeSheet(); }); }
    else{ d.name=name; d.purchase=p; saveLocal(); closeSheet(); buildView(); render(); toast('Сохранено'); }
    return;
  }
  if(act==='delDeal'){
    if(V.online){ apiCall('deal_delete',{id},'Удалено').then(ok=>{ if(ok) closeSheet(); }); }
    else{ S.deals=S.deals.filter(x=>x.id!==id); saveLocal(); closeSheet(); buildView(); render(); toast('Удалено'); }
    return;
  }
  if(act==='saveSell'||act==='updateSell'){
    const sale=num($('fSale').value);
    if(!sale){ toast('Введи сумму продажи'); return; }
    const salary=num($('fSalary').value);
    if(V.online){ apiCall('deal_sell',{id,sale,salary},'Продажа проведена').then(ok=>{ if(ok) closeSheet(); }); }
    else{ d.salePrice=sale; d.salary=salary; d.status='sold'; d.soldAt=Date.now();
      saveLocal(); closeSheet(); buildView(); render(); toast('Продажа проведена'); }
    return;
  }
  if(act==='settle'){
    if(V.online){ apiCall('deal_settle',{id,settled:true},'Рассчитано ✓'); }
    else{ d.settled=true; saveLocal(); buildView(); render(); toast('Рассчитано ✓'); }
    return;
  }
  if(act==='unsettle'){
    if(V.online){ apiCall('deal_settle',{id,settled:false}); }
    else{ d.settled=false; saveLocal(); buildView(); render(); }
    return;
  }

  /* ---- settings ---- */
  if(act==='saveCurOnline'){ apiCall('settings_save',{currency:$('cfgCur').value.trim()||'грн'},'Сохранено'); return; }
  if(act==='saveCfg'){
    S.settings.ownerName=$('cfgOwner').value.trim()||'Я';
    S.settings.managerName=$('cfgMgr').value.trim()||'Управляющая';
    S.settings.currency=$('cfgCur').value.trim()||'грн';
    saveLocal(); buildView(); render(); toast('Настройки сохранены');
    return;
  }
  if(act==='reset'){
    if(confirm('Удалить все товары? Настройки останутся.')){ S.deals=[]; saveLocal(); buildView(); render(); toast('Очищено'); }
    return;
  }
});

/* --- Telegram chrome --- */
try{ const tg=window.Telegram&&window.Telegram.WebApp; if(tg){ tg.ready(); tg.expand&&tg.expand(); tg.setHeaderColor&&tg.setHeaderColor('#0b1210'); } }catch(e){}

boot();
</script>
