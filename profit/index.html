<style>
  :root{
    --bg:#0b1210; --bg2:#0f1a16;
    --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.03);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
    --muted:rgba(255,255,255,.48); --muted2:rgba(255,255,255,.30);
    --emerald:#34d399; --emerald2:#10b981; --teal:#2dd4bf;
    --amber:#fbbf24; --sky:#38bdf8; --red:#f87171;
    --grad:linear-gradient(135deg,#34d399,#10b981);
    --grad-gold:linear-gradient(135deg,#fbbf24,#f59e0b);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  html,body{background:var(--bg);color:#fff;min-height:100%;}
  body{overscroll-behavior-y:none;
    background:radial-gradient(120% 60% at 100% 0%,rgba(16,185,129,.12),transparent 55%),
      radial-gradient(90% 50% at 0% 100%,rgba(45,212,191,.08),transparent 55%),var(--bg);}
  ::-webkit-scrollbar{display:none;}
  button{cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
  input{font-size:16px;color:#fff;outline:none;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top);}

  .wrap{padding:10px 16px 120px;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .gap1{gap:4px;} .gap2{gap:8px;} .gap3{gap:12px;}
  .col{display:flex;flex-direction:column;}
  .flex1{flex:1;}
  .wrapf{flex-wrap:wrap;}
  .mt1{margin-top:4px;} .mt2{margin-top:8px;} .mt3{margin-top:12px;} .mt4{margin-top:16px;} .mt5{margin-top:20px;} .mt6{margin-top:24px;}
  .mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;} .mb3{margin-bottom:12px;} .mb4{margin-bottom:16px;}
  .muted{color:var(--muted);} .muted2{color:var(--muted2);}
  .small{font-size:12.5px;} .xs{font-size:11px;} .tiny{font-size:10px;}
  .b{font-weight:700;} .sb{font-weight:600;} .eb{font-weight:800;}
  .ct{text-align:center;} .right{text-align:right;}
  .em{color:var(--emerald);} .am{color:var(--amber);} .rd{color:var(--red);} .sky{color:var(--sky);}
  .up{text-transform:uppercase;letter-spacing:.08em;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;}
  .p3{padding:12px;} .p4{padding:16px;} .p5{padding:20px;}

  .btn{border-radius:16px;padding:14px;font-weight:700;width:100%;transition:transform .1s,opacity .2s;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--grad);color:#04140e;box-shadow:0 10px 26px rgba(16,185,129,.28);}
  .btn-gold{background:var(--grad-gold);color:#2a1a02;box-shadow:0 10px 26px rgba(245,158,11,.24);}
  .btn-ghost{background:var(--card2);border:1px solid var(--line);color:#fff;}
  .btn-danger{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red);}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .btn-sm{width:auto;padding:9px 14px;font-size:13px;border-radius:13px;}

  .input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:15px;
    padding:14px 15px;transition:border-color .2s;}
  .input:focus{border-color:rgba(52,211,153,.6);}
  .input::placeholder{color:var(--muted2);}
  .lbl{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 3px;}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:.06em;padding:5px 9px;border-radius:999px;}
  .pill-sold{background:rgba(52,211,153,.14);color:var(--emerald);}
  .pill-settled{background:rgba(255,255,255,.08);color:var(--muted);}
  .pill-warn{background:rgba(251,191,36,.14);color:var(--amber);}

  .hd{padding:14px 16px 2px;}
  .logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#04140e;font-weight:900;font-size:20px;box-shadow:0 8px 20px rgba(16,185,129,.30);}
  .rolesw{display:flex;gap:4px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:4px;}
  .rolesw button{flex:1;padding:9px 6px;border-radius:11px;font-size:12.5px;font-weight:800;color:var(--muted);transition:all .18s;line-height:1.05;}
  .rolesw button .rn{font-size:10px;font-weight:700;opacity:.7;display:block;margin-top:1px;}
  .rolesw button.on.owner{background:linear-gradient(135deg,rgba(56,189,248,.9),rgba(14,165,233,.9));color:#04121c;}
  .rolesw button.on.manager{background:var(--grad-gold);color:#2a1a02;}
  .rolepill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:8px 13px;border-radius:11px;}
  .rolepill.owner{background:rgba(56,189,248,.16);color:#7dd3fc;}
  .rolepill.manager{background:rgba(251,191,36,.16);color:var(--amber);}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot.on{background:var(--emerald);box-shadow:0 0 8px var(--emerald);} .dot.off{background:var(--muted2);}

  .hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.34);}
  .hero.owner{background:linear-gradient(160deg,#0b2536 0%,#0e2b2a 60%,#0c1a18 100%);}
  .hero.manager{background:linear-gradient(160deg,#2e2410 0%,#26301f 55%,#101a14 100%);}
  .hero::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 108% -10%,rgba(52,211,153,.18),transparent 52%);}
  .hero>*{position:relative;}
  .hero-cap{font-size:12px;font-weight:700;color:var(--muted);}
  .hero-big{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin-top:6px;}
  .hero-sub{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.4;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;}
  .stat .k{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25;}
  .stat .v{font-size:19px;font-weight:800;margin-top:6px;letter-spacing:-.01em;}
  .stat .v.sm{font-size:16px;}

  /* product */
  .seg{display:flex;gap:4px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px;}
  .seg button{flex:1;padding:9px;border-radius:11px;font-size:13px;font-weight:800;color:var(--muted);transition:all .18s;}
  .seg button.on{background:var(--grad);color:#04140e;}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;}
  .pbar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);margin:9px 0 8px;overflow:hidden;}
  .pbar-fill{height:100%;background:var(--grad);border-radius:999px;min-width:3px;}
  .pline{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;}
  .folder{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;}
  .folder .frow{display:flex;align-items:center;gap:12px;}
  .folder .frow:active{opacity:.7;}
  .ficon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;
    background:radial-gradient(circle at 50% 35%,rgba(52,211,153,.20),rgba(16,185,129,.06));flex:0 0 44px;}
  .fname{font-size:16px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prod{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;overflow:hidden;}
  .pthumb{width:66px;height:66px;border-radius:15px;object-fit:cover;background:rgba(255,255,255,.06);flex:0 0 66px;
    display:flex;align-items:center;justify-content:center;font-size:30px;border:1px solid var(--line2);}
  .pname{font-size:16px;font-weight:800;line-height:1.2;}
  .sizes{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .szpill{font-size:12px;font-weight:800;padding:5px 9px;border-radius:9px;background:rgba(52,211,153,.12);color:var(--emerald);}
  .szpill.zero{background:rgba(255,255,255,.05);color:var(--muted2);}
  .szpill.sel{background:var(--grad-gold);color:#2a1a02;}
  .lot{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 0;border-top:1px solid var(--line2);}
  .lot .sz{font-weight:800;min-width:34px;}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;}
  .kv .kk{color:var(--muted);}
  .kv .vv{font-weight:700;}
  .split{background:rgba(0,0,0,.22);border:1px solid var(--line2);border-radius:14px;padding:11px 12px;margin-top:10px;}
  .divi{height:1px;background:var(--line2);margin:8px 0;}
  .sh{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:22px 3px 12px;}
  .acc{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .acc.sold{background:var(--emerald);} .acc.settled{background:rgba(255,255,255,.25);}

  .chip{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:12.5px;font-weight:700;color:#fff;}
  .chip:active{transform:scale(.96);}
  .chip.on{background:var(--grad-gold);color:#2a1a02;border-color:transparent;}

  .exp{background:linear-gradient(180deg,rgba(52,211,153,.08),rgba(52,211,153,.02));border:1px solid rgba(52,211,153,.22);border-radius:20px;padding:16px;}
  .exp .fl{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .exp .fl .op{color:var(--muted);}
  .formula{font-size:12.5px;color:var(--muted);line-height:1.55;}

  .onb{border-radius:22px;padding:20px;border:1px solid var(--line);background:var(--card);}
  .invb{border-radius:20px;padding:16px;background:linear-gradient(180deg,rgba(56,189,248,.10),rgba(56,189,248,.02));border:1px solid rgba(56,189,248,.25);margin-bottom:16px;}
  .codebox{font-size:30px;font-weight:900;letter-spacing:.22em;text-align:center;padding:14px;border-radius:14px;background:rgba(0,0,0,.32);border:1px dashed var(--line);margin:10px 0;color:#fff;}
  .orline{display:flex;align-items:center;gap:10px;margin:18px 0;}
  .orline .ln{flex:1;height:1px;background:var(--line);}

  .empty{text-align:center;padding:34px 20px;}
  .empty .ic{font-size:52px;}
  .empty .t{font-size:17px;font-weight:800;margin-top:12px;}
  .empty .d{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.5;}

  .cfg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;}
  .range{width:100%;-webkit-appearance:none;height:6px;border-radius:999px;outline:none;margin-top:4px;
    background:linear-gradient(90deg,var(--amber) var(--fill,30%),rgba(255,255,255,.12) var(--fill,30%));}
  .range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4);border:3px solid var(--amber);}
  .range[disabled]{opacity:.6;}
  .banner{border-radius:14px;padding:11px 13px;font-size:12px;line-height:1.45;margin-bottom:12px;}
  .banner.demo{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.25);color:#fcd9a0;}
  .banner.live{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.25);color:#a7f3d0;}

  .photobox{width:100%;height:180px;border-radius:16px;border:1px dashed var(--line);background:rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px;}
  .photobox img{width:100%;height:100%;object-fit:cover;}
  .photobox .ph{color:var(--muted2);font-size:13px;text-align:center;}

  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:100px;z-index:60;
    background:rgba(20,30,26,.96);border:1px solid var(--line);border-radius:14px;padding:12px 18px;
    font-size:13.5px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;max-width:88%;text-align:center;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid var(--line);
    background:rgba(11,18,16,.92);backdrop-filter:blur(20px);padding-bottom:env(safe-area-inset-bottom);}
  .nav-in{max-width:480px;margin:0 auto;display:flex;}
  .nav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted2);font-size:10.5px;font-weight:700;transition:color .18s;}
  .nav button.on{color:var(--emerald);}
  .nav button svg{width:23px;height:23px;}
  .nav.hide{display:none;}

  .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s;}
  .ov.on{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:480px;background:var(--bg2);border:1px solid var(--line);border-radius:26px 26px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .26s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow-y:auto;}
  .ov.on .sheet{transform:translateY(0);}
  .grab{width:38px;height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin:0 auto 14px;}
  .sh-title{font-size:19px;font-weight:900;}

  .anim{animation:fade .3s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .splash{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--emerald);animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>

          <div class="b" style="font-size:17px;line-height:1;">Доля</div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

<script>
"use strict";
const KEY='profit_state_v2';
const DEFAULTS={ settings:{sharePct:30, salaryPct:0, currency:'грн', ownerName:'Я', managerName:'Управляющая'}, role:'owner', tab:'stock', periodMode:'month', folders:[], products:[], sales:[] };
function loadLocal(){
  try{ const r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.settings) return {...DEFAULTS,...r, settings:{...DEFAULTS.settings,...r.settings}}; }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
let S=loadLocal();
function saveLocal(){ localStorage.setItem(KEY, JSON.stringify(S)); }

let ONLINE=false, SHOP=null, FOLDERS=[], PRODUCTS=[], SALES=[];
let curFolder=null;   // открытая папка (id) или null = обзор
const V={online:false, role:'owner', folders:[], products:[], sales:[], sharePct:30, salaryPct:0, currency:'грн', ownerName:'Я', managerName:'Управляющая', shop:null};
function buildView(){
  V.online=ONLINE;
  if(ONLINE){
    V.shop=SHOP;
    if(SHOP){
      V.role=SHOP.role; V.folders=FOLDERS; V.products=PRODUCTS; V.sales=SALES; V.sharePct=SHOP.sharePct; V.salaryPct=SHOP.salaryPct==null?0:SHOP.salaryPct; V.currency=SHOP.currency||'грн';
      const p=SHOP.partner;
      if(SHOP.role==='owner'){ V.ownerName=SHOP.me.name||'Владелец'; V.managerName=p?p.name:'Управляющая'; }
      else{ V.managerName=SHOP.me.name||'Управляющая'; V.ownerName=p?p.name:'Владелец'; }
    }else{ V.role='owner'; V.folders=[]; V.products=[]; V.sales=[]; V.sharePct=30; V.salaryPct=0; V.currency='грн'; V.ownerName='Владелец'; V.managerName='Управляющая'; }
  }else{
    V.shop=null; V.role=S.role; V.folders=S.folders||[]; V.products=S.products; V.sales=S.sales;
    V.sharePct=S.settings.sharePct; V.salaryPct=S.settings.salaryPct||0; V.currency=S.settings.currency; V.ownerName=S.settings.ownerName; V.managerName=S.settings.managerName;
  }
}

const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(n){ n=Math.round(Number(n)||0); const s=Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); return (n<0?'−':'')+s+' '+V.currency; }
function num(v){ return Math.max(0, Math.round(Number(String(v).replace(/[^\d.-]/g,''))||0)); }
let uidc=0; function uid(){ return 'x'+Date.now().toString(36)+(uidc++).toString(36); }

/* --- бизнес-логика --- */
function lotCost(l){ return (l.purchase||0)+(l.shipping==null?0:(l.shipping||0)); }
function prodAgg(p){
  const bySize={}; let total=0, missing=false, cmin=Infinity, cmax=0;
  (p.stock||[]).forEach(l=>{
    bySize[l.size]=(bySize[l.size]||0)+(l.qty||0); total+=(l.qty||0);
    if(l.shipping==null) missing=true;
    const c=lotCost(l); if(c<cmin)cmin=c; if(c>cmax)cmax=c;
  });
  return {bySize, total, missing, cmin:cmin===Infinity?0:cmin, cmax};
}
function fifoLot(p,size){ return (p.stock||[]).filter(l=>l.size===size&&(l.qty||0)>0)[0]||null; }
function calcSale(s){
  // Закупку вкладывает управляющая → ей возврат себестоимости + её доля прибыли.
  // Зарплата — расход на продавца (уходит продавцу), в доход сторон не входит.
  const pct=V.sharePct/100;
  const net=(s.sale||0)-(s.cost||0)-(s.salary||0);
  const mgrShare=Math.round(net*pct), ownShare=net-mgrShare;
  return {net, mgrShare, ownShare, mgrTotal:(s.cost||0)+mgrShare, ownTotal:ownShare};
}
function totals(){
  const t={stockValue:0,pairsInStock:0,turnover:0,net:0,salaryTotal:0,mgrEarn:0,ownProfit:0,costReturn:0,
    mgrWithdrawable:0,mgrWithdrawn:0,ownReceivable:0,ownReceived:0,soldCount:0};
  V.products.forEach(p=>(p.stock||[]).forEach(l=>{ t.stockValue+=(l.qty||0)*lotCost(l); t.pairsInStock+=(l.qty||0); }));
  V.sales.forEach(s=>{ const c=calcSale(s); t.soldCount++;
    t.turnover+=s.sale||0; t.net+=c.net; t.salaryTotal+=s.salary||0;
    t.mgrEarn+=c.mgrShare; t.ownProfit+=c.ownShare; t.costReturn+=s.cost||0;
    if(s.settled){ t.mgrWithdrawn+=c.mgrTotal; t.ownReceived+=c.ownTotal; }
    else{ t.mgrWithdrawable+=c.mgrTotal; t.ownReceivable+=c.ownTotal; }
  });
  return t;
}

async function api(action, extra){
  const r=await fetch('/api/profit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action, initData:tgInitData()}, extra||{}))});

const ERR={forbidden:'Менять это может только владелец',not_found:'Не найдено',shop_full:'В магазине уже двое',not_configured:'Сервер не подключён',bad_auth:'Ошибка входа Telegram',rate_limited:'Слишком часто — подождите',bad_code:'Неверный код',bad_input:'Проверьте введённые данные',out_of_stock:'Нет в наличии этого размера',no_shop:'Сначала создайте или войдите в магазин',folders_off:'Сначала выполни SQL для папок (в чате)'};
function applyState(j){ if('shop' in j){ SHOP=j.shop||null; FOLDERS=j.folders||[]; PRODUCTS=j.products||[]; SALES=j.sales||[]; } }
async function apiCall(action, extra, okMsg){
  try{
    const j=await api(action, extra);
    if(!j || j.ok===false){ toast(ERR[j&&j.reason]||'Не удалось, попробуйте ещё раз'); return false; }
    applyState(j); buildView(); render(); if(okMsg) toast(okMsg); return true;
  }catch(e){ toast('Нет связи с сервером'); return false; }
}
async function boot(){
  const initData=tgInitData();
  if(!initData){ ONLINE=false; buildView(); render(); hideSplash(); return; }
  try{
    const j=await api('state');
    if(!j || j.reason==='not_configured' || j.reason==='bad_auth'){ ONLINE=false; buildView(); render(); hideSplash(); return; }
    ONLINE=true; applyState(j);
    const sp=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.start_param)||'';
    if(!SHOP && sp){ await apiCall('shop_join',{code:sp}); hideSplash(); return; }
    buildView(); render(); hideSplash();
  }catch(e){ ONLINE=false; buildView(); render(); hideSplash(); }
}

let sheetPhoto=null;
function pickPhoto(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image();
      img.onload=()=>{ const max=560; let w=img.width,h=img.height; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
        const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
        sheetPhoto=c.toDataURL('image/jpeg',0.7); const box=$('photoBox'); if(box) box.innerHTML=`<img src="${sheetPhoto}">`; };
      img.onerror=()=>toast('Не удалось открыть фото'); img.src=rd.result; };
    rd.onerror=()=>toast('Не удалось открыть фото'); rd.readAsDataURL(f); };
  inp.click();
}

/* ---- ИТОГИ ---- */
const MON_SHORT=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MON_FULL=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function periodKey(soldAt, mode){
  const d = soldAt ? new Date(soldAt) : null; if(!d || isNaN(d.getTime())) return null;
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return mode==='day' ? y+'-'+m+'-'+day : y+'-'+m;
}
function periodLabel(key, mode){
  const p=key.split('-').map(Number);
  return mode==='day' ? p[2]+' '+MON_SHORT[p[1]-1]+' '+p[0] : MON_FULL[p[1]-1]+' '+p[0];
}
function salesByPeriod(mode){
  const bk={};
  V.sales.forEach(s=>{ const k=periodKey(s.soldAt, mode); if(!k) return;
    const b=bk[k]||(bk[k]={key:k,turnover:0,net:0,mgrShare:0,ownShare:0,salary:0,count:0});
    const c=calcSale(s); b.turnover+=s.sale||0; b.net+=c.net; b.mgrShare+=c.mgrShare; b.ownShare+=c.ownShare; b.salary+=s.salary||0; b.count++; });
  return Object.values(bk).sort((a,b)=> a.key<b.key?1:-1);
}

    const barW=Math.max(3,Math.round(Math.abs(r.net)/maxNet*100));
    h+=`<div class="pcard">

    <div class="split mt4" id="preview"></div>
    <button class="btn btn-gold mt4" data-act="saveSell" data-pid="${p.id}">Провести продажу</button>`);

function onSaleInput(){ if(salaryAuto && V.salaryPct>0){ const s=num($('fSale').value); const inp=$('fSalary'); if(inp) inp.value=s?Math.round(s*V.salaryPct/100):''; } previewSell(); }

window.onSaleInput=onSaleInput; window.onSalaryInput=onSalaryInput;
// зарплата продавцу: если поле есть (у владельца) — из него; иначе авто по % (у управляющей)
function saleSalary(sale){ const el=$('fSalary'); if(el) return num(el.value); return Math.round((sale||0)*(V.salaryPct||0)/100); }
function selSizeCost(){
  const p=V.products.find(x=>x.id===sellSel.pid); if(!p||!sellSel.size) return 0;
  const l=fifoLot(p,sellSel.size); return l?lotCost(l):0;
}
function previewSell(){
  const cost=selSizeCost();
  const sale=num($('fSale')?$('fSale').value:0), salary=saleSalary(sale);
  const pct=V.sharePct/100, net=sale-cost-salary, ms=Math.round(net*pct), os=net-ms;
  const el=$('preview'); if(!el) return;
  el.innerHTML=`
    <div class="kv" style="padding:3px 0"><span class="kk">Себестоимость пары</span><span class="vv">${money(cost)}</span></div>
    ${salary?`<div class="kv" style="padding:3px 0"><span class="kk">Зарплата продавцу</span><span class="vv am">−${money(salary)}</span></div>`:''}
    <div class="kv" style="padding:3px 0"><span class="kk">Чистая прибыль</span><span class="vv ${net<0?'rd':'em'}">${money(net)}</span></div>
    <div class="divi"></div>
    <div class="kv" style="padding:3px 0"><span class="kk">${esc(V.managerName)}: вложенное + доля (${V.sharePct}%)</span><span class="vv am">${money(cost+ms)}</span></div>
    <div class="kv" style="padding:3px 0"><span class="kk">${esc(V.ownerName)}: доля (${100-V.sharePct}%)</span><span class="vv sky">${money(os)}</span></div>`;
}
window.previewSell=previewSell;

  if(navBtn){ S.tab=navBtn.dataset.tab; saveLocal(); render(); return; }

  if(perBtn){ S.periodMode=perBtn.dataset.period; saveLocal(); render(); return; }

  if(selsize){ sellSel.size=selsize.dataset.selsize; document.querySelectorAll('#sizeRow .chip').forEach(c=>c.classList.toggle('on',c.dataset.selsize===sellSel.size)); previewSell(); return; }

  const fill=e.target.closest('[data-fill]');
  if(fill){ const inp=$(fill.dataset.fill); if(inp){ inp.value=fill.dataset.val; if(fill.dataset.fill==='fSalary') salaryAuto=false; if(fill.dataset.pv) previewSell(); } return; }
  const salpct=e.target.closest('[data-salpct]');
  if(salpct){ salaryAuto=false; const sale=num($('fSale')?$('fSale').value:0); const inp=$('fSalary'); if(inp){ inp.value=Math.round(sale*(+salpct.dataset.salpct)/100); previewSell(); } return; }
  const setpct=e.target.closest('[data-setpct]');
  if(setpct){ const v=+setpct.dataset.setpct; if(V.online){ apiCall('settings_save',{share_pct:v},'Доля: '+v+'%'); } else { S.settings.sharePct=v; saveLocal(); buildView(); render(); toast('Доля: '+v+'%'); } return; }
  const setsal=e.target.closest('[data-setsal]');
  if(setsal){ const v=+setsal.dataset.setsal; if(V.online){ apiCall('settings_save',{salary_pct:v},'Зарплата: '+v+'%'); } else { S.settings.salaryPct=v; saveLocal(); buildView(); render(); toast('Зарплата: '+v+'% от продажи'); } return; }

  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id, pid=a.dataset.pid;
  const prod=pid?V.products.find(x=>x.id===pid):null;

  // onboarding
  if(act==='createShop'){ apiCall('shop_create',null); return; }
  if(act==='joinShop'){ const code=($('joinCode').value||'').toUpperCase().trim(); if(code.length<4){ toast('Введите код'); return; } apiCall('shop_join',{code}); return; }
  if(act==='copyCode'){ const code=V.shop&&V.shop.inviteCode||''; try{ navigator.clipboard.writeText(code); toast('Код скопирован: '+code); }catch(e){ toast('Код: '+code); } return; }

  // folders
  if(act==='openFolder'){ curFolder=id; render(); return; }
  if(act==='folderBack'){ curFolder=null; render(); return; }
  if(act==='addFolder'){ sheetFolderEdit(null); return; }
  if(act==='editFolder'){ const f=V.folders.find(x=>x.id===id); if(f) sheetFolderEdit(f); return; }
  if(act==='createFolder'){
    const name=$('fFolderName').value.trim(); if(!name){ toast('Введи название папки'); return; }
    if(V.online){ apiCall('folder_add',{name},'Папка создана').then(ok=>{ if(ok) closeSheet(); }); }
    else{ S.folders.push({id:uid(),name}); saveLocal(); closeSheet(); buildView(); render(); toast('Папка создана'); }
    return;
  }
  if(act==='saveFolder'){
    const name=$('fFolderName').value.trim(); if(!name){ toast('Введи название'); return; }
    if(V.online){ apiCall('folder_edit',{id,name},'Сохранено').then(ok=>{ if(ok) closeSheet(); }); }
    else{ const f=S.folders.find(x=>x.id===id); if(f)f.name=name; saveLocal(); closeSheet(); buildView(); render(); toast('Сохранено'); }
    return;
  }
  if(act==='delFolder'){
    if(!confirm('Удалить папку? Товары внутри останутся (перейдут в «Без папки»).')) return;
    if(V.online){ apiCall('folder_delete',{id},'Папка удалена').then(ok=>{ if(ok&&curFolder===id){ curFolder=null; render(); } }); }
    else{ S.folders=S.folders.filter(x=>x.id!==id); S.products.forEach(p=>{ if(p.folderId===id) p.folderId=null; }); if(curFolder===id) curFolder=null; saveLocal(); buildView(); render(); toast('Папка удалена'); }
    return;
  }

  // product
  if(act==='addProduct'){ sheetProduct(null, a.dataset.folder||curFolder||null); return; }
  if(act==='editProduct'){ sheetProduct(prod); return; }
  if(act==='clearPhoto'){ sheetPhoto=null; const box=$('photoBox'); if(box) box.innerHTML='<div class="ph">Фото товара<br>(необязательно)</div>'; return; }
  if(act==='createProduct'){
    const name=$('fName').value.trim(); if(!name){ toast('Введи название'); return; }
    if(V.online){ apiCall('product_add',{name,photo:sheetPhoto,folder_id:sheetFolder},'Модель добавлена').then(ok=>{ if(ok) closeSheet(); }); }
    else{ S.products.unshift({id:uid(),name,photo:sheetPhoto,folderId:sheetFolder||null,stock:[]}); saveLocal(); closeSheet(); buildView(); render(); toast('Модель добавлена'); }
    return;
  }
  if(act==='saveProduct'){
    const name=$('fName').value.trim()||prod.name;
    if(V.online){ apiCall('product_edit',{id:pid,name,photo:sheetPhoto,folder_id:sheetFolder},'Сохранено').then(ok=>{ if(ok) closeSheet(); }); }
    else{ prod.name=name; prod.photo=sheetPhoto; prod.folderId=sheetFolder||null; saveLocal(); closeSheet(); buildView(); render(); toast('Сохранено'); }
    return;
  }
  if(act==='delProduct'){
    if(!confirm('Удалить модель со всеми размерами?')) return;
    if(V.online){ apiCall('product_delete',{id:pid},'Удалено'); }
    else{ S.products=S.products.filter(x=>x.id!==pid); saveLocal(); buildView(); render(); toast('Удалено'); }
    return;
  }

  // stock
  if(act==='addStock'){ sheetStock(pid); return; }
  if(act==='editLot'){ const p=V.products.find(x=>x.id===a.dataset.pid)|| V.products.find(x=>(x.stock||[]).some(l=>l.id===id)); const lot=p&&p.stock.find(l=>l.id===id); if(lot) sheetStockEdit(lot); return; }
  if(act==='addSizeRow'){
    const sz=a.dataset.size; const cont=$('stockRows'); if(!cont) return;
    // если есть строка с пустым размером — заполним её, иначе добавим новую
    let empty=null; cont.querySelectorAll('.strow').forEach(r=>{ if(!empty && !r.querySelector('.strow-size').value.trim()) empty=r; });
    if(empty){ empty.querySelector('.strow-size').value=sz; if(!empty.querySelector('.strow-qty').value.trim()) empty.querySelector('.strow-qty').value='1'; }
    else cont.insertAdjacentHTML('beforeend', stockRowHtml(sz,1));
    return;
  }
  if(act==='addRow'){ const cont=$('stockRows'); if(cont) cont.insertAdjacentHTML('beforeend', stockRowHtml('',1)); return; }
  if(act==='rmRow'){ const row=a.closest('.strow'); const cont=$('stockRows'); if(row&&cont&&cont.querySelectorAll('.strow').length>1) row.remove(); else if(row){ row.querySelector('.strow-size').value=''; } return; }
  if(act==='createStockMulti'){
    const items=[...document.querySelectorAll('#stockRows .strow')].map(r=>({size:(r.querySelector('.strow-size').value||'').trim(), qty:Math.max(1,num(r.querySelector('.strow-qty').value)||1)})).filter(x=>x.size);
    const purchase=num($('fPurch').value);
    if(!items.length){ toast('Добавь хотя бы один размер'); return; }
    if(!purchase){ toast('Укажи себестоимость за пару'); return; }
    if(V.online){ apiCall('stock_bulk',{product_id:pid,purchase,items},'Добавлено на склад').then(ok=>{ if(ok) closeSheet(); }); }
    else{ items.forEach(it=>prod.stock.push({id:uid(),size:it.size,qty:it.qty,purchase,shipping:null})); saveLocal(); closeSheet(); buildView(); render(); toast('Добавлено на склад'); }
    return;
  }
  if(act==='saveLot'){
    const size=($('fSize').value||'').trim(), qty=num($('fQty').value), purchase=num($('fPurch').value);
    if(V.online){ apiCall('stock_edit',{id,size,qty,purchase},'Сохранено').then(ok=>{ if(ok) closeSheet(); }); }
    else{ V.products.forEach(p=>(p.stock||[]).forEach(l=>{ if(l.id===id){ l.size=size;l.qty=qty;l.purchase=purchase; } })); saveLocal(); closeSheet(); buildView(); render(); toast('Сохранено'); }
    return;
  }
  if(act==='delLot'){
    if(V.online){ apiCall('stock_delete',{id},'Удалено').then(ok=>{ if(ok) closeSheet(); }); }
    else{ V.products.forEach(p=>{ p.stock=(p.stock||[]).filter(l=>l.id!==id); }); saveLocal(); closeSheet(); buildView(); render(); toast('Удалено'); }
    return;
  }
  if(act==='saveShip'){
    const shipping=num($('fShip2').value);
    if(V.online){ apiCall('stock_ship',{id,shipping},'Доставка внесена').then(ok=>{ if(ok) closeSheet(); }); }
    else{ V.products.forEach(p=>(p.stock||[]).forEach(l=>{ if(l.id===id) l.shipping=shipping; })); saveLocal(); closeSheet(); buildView(); render(); toast('Доставка внесена'); }
    return;
  }

  // sell
  if(act==='sell'){ if(prodAgg(prod).total<=0){ toast('Нет пар в наличии'); return; } sheetSell(prod); return; }
  if(act==='saveSell'){
    if(!sellSel.size){ toast('Выбери размер'); return; }
    const sale=num($('fSale').value); if(!sale){ toast('Введи цену продажи'); return; }
    const salary=saleSalary(sale);
    if(V.online){ apiCall('sale_add',{product_id:pid,size:sellSel.size,sale,salary},'Продажа проведена').then(ok=>{ if(ok) closeSheet(); }); }
    else{
      const p=S.products.find(x=>x.id===pid); const lot=fifoLot(p,sellSel.size);
      if(!lot){ toast('Нет в наличии'); return; }
      const cost=lotCost(lot); lot.qty-=1;
      S.sales.unshift({id:uid(),productId:pid,name:p.name,size:sellSel.size,sale,salary,cost,settled:false,soldAt:Date.now()});
      saveLocal(); closeSheet(); buildView(); render(); toast('Продажа проведена');
    }
    return;
  }
  if(act==='settle'){ if(V.online){ apiCall('sale_settle',{id,settled:true},'Рассчитано ✓'); } else { const s=S.sales.find(x=>x.id===id); if(s)s.settled=true; saveLocal(); buildView(); render(); toast('Рассчитано ✓'); } return; }
  if(act==='unsettle'){ if(V.online){ apiCall('sale_settle',{id,settled:false}); } else { const s=S.sales.find(x=>x.id===id); if(s)s.settled=false; saveLocal(); buildView(); render(); } return; }
  if(act==='delSale'){
    if(!confirm('Отменить продажу и вернуть пару на склад?')) return;
    if(V.online){ apiCall('sale_delete',{id},'Продажа отменена'); }
    else{ const s=S.sales.find(x=>x.id===id); if(s){ const p=S.products.find(x=>x.id===s.productId); if(p){ const l=(p.stock||[]).filter(x=>x.size===s.size)[0]; if(l) l.qty+=1; } S.sales=S.sales.filter(x=>x.id!==id); } saveLocal(); buildView(); render(); toast('Продажа отменена'); }
    return;
  }

  // settings
  if(act==='saveCurOnline'){ apiCall('settings_save',{currency:$('cfgCur').value.trim()||'грн'},'Сохранено'); return; }
  if(act==='saveCfg'){ S.settings.ownerName=$('cfgOwner').value.trim()||'Я'; S.settings.managerName=$('cfgMgr').value.trim()||'Управляющая'; S.settings.currency=$('cfgCur').value.trim()||'грн'; saveLocal(); buildView(); render(); toast('Настройки сохранены'); return; }
  if(act==='reset'){ if(confirm('Очистить склад и продажи? Настройки останутся.')){ S.products=[]; S.sales=[]; S.folders=[]; curFolder=null; saveLocal(); buildView(); render(); toast('Очищено'); } return; }
});

try{ const tg=window.Telegram&&window.Telegram.WebApp; if(tg){ tg.ready(); tg.expand&&tg.expand(); tg.setHeaderColor&&tg.setHeaderColor('#0b1210'); } }catch(e){}
boot();
</script>
</body>
</html>
