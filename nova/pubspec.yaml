name: nova
description: "Kavio — универсальная Business OS для бизнеса по записи."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1   # state management
  go_router: ^14.2.0         # официальная навигация: deep links + web
  drift: ^2.18.0             # local-first БД (SQLite), offline-first
  drift_flutter: ^0.2.0      # кроссплатформенное открытие БД (вкл. web)
  path_provider: ^2.1.3
  url_launcher: ^6.3.0       # звонок/сообщение/WhatsApp из карточки клиента
  intl: ^0.20.2              # форматирование дат/времени/валюты (пиннится flutter_localizations)

  # --- Опциональные интеграции (адаптеры к портам, см. docs/INTEGRATIONS.md) ---
  # Раскомментируйте нужное и подключите адаптер + override провайдера.
  # firebase_core: ^3.1.0
  # firebase_crashlytics: ^4.0.0      # → CrashReporter
  # firebase_analytics: ^11.0.0       # → AnalyticsService
  # firebase_remote_config: ^5.0.0    # → RemoteConfigService (feature flags)
  # sentry_flutter: ^8.3.0            # → CrashReporter (альтернатива)
  # in_app_purchase: ^3.2.0          # → BillingService (Apple IAP / Play Billing)
  # flutter_stripe: ^11.0.0          # → BillingService (Stripe, web)
  # supabase_flutter: ^2.5.0         # → AuthService / бэкенд-синк

dev_dependencies:
  drift_dev: ^2.18.0         # кодогенерация Drift
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true   # генерация локализаций (i18n) из lib/l10n/*.arb
  # Inter бандлится локально (offline-first). Положите файл
  # assets/fonts/Inter-Variable.ttf (см. assets/fonts/README.md) и раскомментируйте
  # блок ниже — после этого типографика становится пиксель-в-пиксель.
  # Пока файла нет, приложение собирается и работает на системном шрифте.
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Variable.ttf
