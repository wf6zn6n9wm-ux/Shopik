# Стандартный набор Flutter-линтов. Без строгих доп-правил, создающих шум —
# цель: чистый `flutter analyze` без лишних info-замечаний.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"        # генерируется Drift (build_runner)
    - "lib/l10n/app_localizations*.dart"  # генерируется gen-l10n
