<style>
  :root{
    --bg:#0b0d12; --bg2:#131a2b;
    --surface:rgba(255,255,255,.03); --surface2:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
    --txt:#e7ecf3; --mut:#9aa6b8; --mut2:#6b7688;
    --blue:#3b82f6; --amber:#fbbf24;
    --good:#34d399; --goodbg:rgba(52,211,153,.12); --goodln:rgba(52,211,153,.28);
    --bad:#f87171; --badbg:rgba(248,113,113,.12); --badln:rgba(248,113,113,.28);
    --warn:#fbbf24; --warnbg:rgba(251,191,36,.10); --warnln:rgba(251,191,36,.28);
    --grad:linear-gradient(120deg,var(--blue),var(--amber));
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
    --sp:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg)}
  #wrap{
    font-family:var(--font); color:var(--txt);
    max-width:430px; margin:0 auto; min-height:100dvh; position:relative;
    padding-bottom:96px;
    background:radial-gradient(120% 55% at 50% 0%,var(--bg2) 0%,var(--bg) 55%);
    -webkit-font-smoothing:antialiased;
  }
  .pad{padding:30px 20px 0}
  h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  .num{font-variant-numeric:tabular-nums}

  /* buttons */
  .btn{width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:16px;transition:transform .12s var(--sp),opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:#fff;color:#0b0d12}
  .btn-grad{background:var(--grad);color:#0b0d12}
  .btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--txt);font-weight:700}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .btn-sm{padding:11px;font-size:14px;border-radius:14px;font-weight:700}

  /* cards */
  .card{border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:22px}
  .card2{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px}
  .row{display:flex;align-items:center;gap:12px}
  .between{display:flex;align-items:center;justify-content:space-between}
  .stack>*+*{margin-top:14px}
  .mut{color:var(--mut)} .mut2{color:var(--mut2)}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut2)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}

  /* header */
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px}
  .logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#0b0d12}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}

  /* ring */
  .ringwrap{position:relative;display:grid;place-items:center}
  .ringc{position:absolute;text-align:center}

  /* grids */
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:12px 6px;text-align:center}
  .stat .v{font-weight:800;font-size:14px;margin-top:3px}
  .stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut2);margin-top:2px}

  .seg{display:flex;gap:6px;background:rgba(255,255,255,.04);padding:5px;border-radius:16px}
  .seg button{flex:1;padding:10px;border-radius:12px;font-size:14px;font-weight:700;color:var(--mut);transition:.15s}
  .seg button.on{background:#fff;color:#0b0d12}

  .pill{padding:12px;border-radius:12px;font-weight:800;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--txt);transition:.12s}
  .pill.on{background:#fff;color:#0b0d12;border-color:#fff}

  .field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--txt);font-size:16px;outline:none;transition:border-color .15s}
  .field:focus{border-color:rgba(255,255,255,.35)}
  .field.big{font-size:19px;font-weight:700}

  .method{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;transition:.12s}
  .method.on{background:#fff;color:#0b0d12;border-color:#fff}
  .method .t{font-weight:700;font-size:14px;margin-top:8px}
  .method .s{font-size:12px;color:var(--mut2)}
  .method.on .s{color:rgba(0,0,0,.55)}

  .radio{width:20px;height:20px;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
  .radio.on{border-color:#fff}
  .radio .dot{width:10px;height:10px;border-radius:999px;background:#fff}

  /* checkin */
  .frame{border:1px solid var(--line);background:var(--surface);border-radius:24px;overflow:hidden}
  .shot{aspect-ratio:4/5;background:rgba(0,0,0,.35);position:relative;display:grid;place-items:center}
  .shot img{width:100%;height:100%;object-fit:cover}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;backdrop-filter:blur(3px);text-align:center;padding:24px}
  .spinner{width:46px;height:46px;border-radius:999px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin 1s linear infinite;margin:0 auto 12px}

  /* nav */
  nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:30}
  .navbar{margin:0 16px 16px;border-radius:20px;background:rgba(20,24,34,.92);backdrop-filter:blur(12px);border:1px solid var(--line);display:flex;justify-content:space-around;padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .navbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 18px;border-radius:14px;color:var(--mut2);font-size:10px;font-weight:600;transition:.15s}
  .navbtn.on{color:#fff}

  /* toast + sheet */
  #toast{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:center;z-index:60;pointer-events:none}
  #toast .t{background:#fff;color:#0b0d12;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
  .sheet{position:fixed;left:0;right:0;margin:0 auto;bottom:0;width:100%;max-width:430px;background:#12151d;border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 20px 30px;max-height:92dvh;overflow:auto;z-index:41}
  .sheet::-webkit-scrollbar{display:none}
  .close{width:36px;height:36px;border-radius:999px;background:var(--surface);display:grid;place-items:center}
  .dot-progress{display:flex;gap:6px;justify-content:center}
  .dot-progress i{height:6px;width:6px;border-radius:999px;background:rgba(255,255,255,.25);transition:.2s}
  .dot-progress i.on{width:24px;background:#fff}

  .demo-note{border:1px dashed var(--warnln);background:var(--warnbg);border-radius:16px;padding:12px 14px;font-size:12.5px;color:#f4d58a;line-height:1.45}
  .streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cell{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800}
  .cell.done{background:var(--goodbg);border:1px solid var(--goodln);color:var(--good)}
  .cell.today{background:var(--grad);color:#0b0d12;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
  .cell.pend{background:var(--surface);border:1px solid var(--line2);color:var(--mut2)}
  code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;font-size:.85em}

  .pop{animation:pop .28s var(--sp)} .rise{animation:rise .3s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>

<div id="wrap"><div id="app"></div></div>
<div id="toast"></div>
<input type="file" id="filepick" accept="image/*" capture="environment" hidden />

<script>
(function(){
  "use strict";
  const KEY="gantelya_demo_v1";
  const ICON={
    dumbbell:'<path d="m6.5 6.5 11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7"/>',
    camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
    wallet:'<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>',
    user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
    spark:'<path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/>',
    check:'<polyline points="20 6 9 17 4 12"/>',
    share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>',
    flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
    coins:'<circle cx="8" cy="8" r="6"/><path d="M18.1 10.4A6 6 0 1 1 10.3 18"/><path d="M7 6h1v4"/>',
    card:'<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>',
    back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
    x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    warn:'<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17"/>',
  };
  const svg=(n,s)=>`<svg width="${s||24}" height="${s||24}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
  const fmt=n=>Math.round(n).toLocaleString("uk-UA");
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const today=()=>new Date().toISOString().slice(0,10);
  const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

  const def={page:"intro",introI:0,seenIntro:false,balance:0,challenge:null,txns:[],wds:[],history:[]};
  let S=load();
  const ui={createOpen:false,stake:500,days:21,wtab:"topup",
    tuMethod:"card",tuAmount:"",wdMethod:"card",wdAmount:"",wdDest:"",
    ci:{img:null,state:"idle",result:null}};

  function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s?Object.assign({},def,s):Object.assign({},def);}catch(e){return Object.assign({},def);}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({page:S.page,seenIntro:S.seenIntro,balance:S.balance,challenge:S.challenge,txns:S.txns,wds:S.wds,history:S.history}));}catch(e){}}
  function addTxn(t){S.txns.unshift(Object.assign({id:uid(),ts:Date.now()},t));S.txns=S.txns.slice(0,60);}

  let toastT;
  function toast(m){const b=document.getElementById("toast");b.innerHTML=`<div class="t pop">${esc(m)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>b.innerHTML="",1900);}

  /* ---------- views ---------- */
  function ring(v,max){const size=170,r=size/2-12,c=2*Math.PI*r,off=c*(1-Math.min(1,v/max));
    return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#1c2230" stroke-width="12" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="url(#g)" stroke-width="12" fill="none" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s var(--sp)"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs></svg>`;}

  function intro(){
    const steps=[
      {i:"dumbbell",t:"Постав на себе",d:"Кидаєш 500 ₴, що 21 день ходиш у зал. Тримаєш слово — забираєш удвічі більше."},
      {i:"camera",t:"Щодня — фото",d:"Кожен день кидаєш фото з тренування. Це твій пруф."},
      {i:"spark",t:"AI-рефері вирішує",d:"AI дивиться на фото і каже: зал це чи диван. Обдурити важко."},
      {i:"coins",t:"Виконав — забираєш ×2",d:"Пройшов усі дні — отримуєш ставку у подвійному розмірі. Зірвався — гроші згорають."},
    ];
    const s=steps[S.introI],last=S.introI===steps.length-1;
    return `<div style="min-height:100dvh;display:flex;flex-direction:column;padding:40px 24px">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
        <div class="pop" style="width:80px;height:80px;border-radius:24px;background:var(--grad);display:grid;place-items:center;color:#0b0d12;margin-bottom:32px">${svg(s.i,34)}</div>
        <h1 style="font-size:26px;font-weight:800;margin-bottom:12px">${s.t}</h1>
        <p class="mut" style="line-height:1.6;max-width:300px">${s.d}</p>
      </div>
      <div class="dot-progress" style="margin-bottom:24px">${steps.map((_,k)=>`<i class="${k===S.introI?'on':''}"></i>`).join("")}</div>
      <button class="btn btn-primary" data-act="intro-next">${last?"Почати":"Далі"}</button>
    </div>`;
  }

  function header(){
    return `<div class="between" style="margin-bottom:24px">
      <div class="brand"><div class="logo">${svg("dumbbell",20)}</div>Гантеля</div>
      <button class="chip" data-act="go" data-page="wallet"><span style="color:var(--amber)">${svg("wallet",15)}</span><span class="num">${fmt(S.balance)} ₴</span></button>
    </div>`;
  }

  function home(){
    let body;
    const ch=S.challenge;
    if(!ch){
      body=`<div class="card rise" style="text-align:center">
        <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:18px;background:rgba(59,130,246,.15);color:#93c5fd;display:grid;place-items:center">${svg("dumbbell",30)}</div>
        <h2 style="font-size:21px;font-weight:800;margin-bottom:8px">Ще немає челленджу</h2>
        <p class="mut" style="font-size:14px;margin-bottom:20px">Постав на себе гроші й тримай слово. Виконаєш — ×2, зірвешся — згорять.</p>
        <button class="btn btn-primary" data-act="create-open">Створити челендж</button>
      </div>`;
    } else if(ch.status==="won"){
      body=cardResult("🏆","Ти зробив це!",`${ch.days} днів пройдено. Виплата <b>${fmt(ch.stake*2)} ₴</b> (×2) зарахована на баланс.`,"Дисципліна &gt; мотивація 🔥","good");
    } else if(ch.status==="failed"){
      body=cardResult("🔥","Ставка згоріла",`Пропущено день — <b>${fmt(ch.stake)} ₴</b> згоріли.`,"Дисципліна коштує грошей. Спробуй ще.","bad");
    } else {
      const checkedToday=ch.lastCheckin===today(), left=ch.days-ch.done;
      body=`<div class="stack rise">
        <div class="card" style="display:flex;flex-direction:column;align-items:center">
          <div class="ringwrap">${ring(ch.done,ch.days)}
            <div class="ringc"><div style="font-size:40px;font-weight:800;line-height:1" class="num">${ch.done}<span style="color:var(--mut2);font-size:24px">/${ch.days}</span></div>
            <div class="eyebrow" style="margin-top:4px">днів у залі</div></div>
          </div>
          <div class="g3" style="width:100%;margin-top:22px">
            ${stat("coins","Ставка",fmt(ch.stake)+" ₴")}${stat("flame","Лишилось",left+" дн.")}${stat("shield","Виграш",fmt(ch.stake*2)+" ₴")}
          </div>
        </div>
        <div class="card2 between">
          <div class="row" style="min-width:0"><div style="width:36px;height:36px;border-radius:11px;background:var(--goodbg);color:var(--good);display:grid;place-items:center;flex:0 0 auto">${svg("coins",18)}</div>
          <div style="min-width:0"><div class="mut" style="font-size:12px">Виконаєш челендж — забираєш</div>
          <div style="font-weight:800" class="num">${fmt(ch.stake*2)} ₴ <span style="color:var(--good)">×2</span></div></div></div>
          <span class="badge" style="color:#fca5a5;background:var(--badbg);border:1px solid var(--badln);flex:0 0 auto">🔥 −${fmt(ch.stake)} ₴</span>
        </div>
        ${streakGrid(ch)}
        ${checkedToday
          ? `<div class="card2 row" style="border-color:var(--goodln);background:var(--goodbg)">
              <div style="width:36px;height:36px;border-radius:11px;background:rgba(52,211,153,.2);color:var(--good);display:grid;place-items:center">${svg("check",20)}</div>
              <div><div style="font-weight:700">Чек-ін зараховано ✅</div><div class="mut" style="font-size:12px">Повертайся завтра за наступним днем</div></div></div>`
          : `<button class="btn btn-grad" data-act="go" data-page="checkin">${svg("camera",22)} Зробити чек-ін</button>`}
        <div style="border:1px solid var(--line2);background:rgba(255,255,255,.02);border-radius:16px;padding:12px">
          <div class="eyebrow" style="margin-bottom:8px;padding:0 4px">Демо-режим прототипу</div>
          <button class="btn btn-sm" style="background:var(--badbg);color:#fca5a5;border:1px solid var(--badln)" data-act="fail">Змоделювати зрив (спалити ставку)</button>
        </div>
      </div>`;
    }
    return `<div class="pad">${header()}${body}</div>`;
  }
  function stat(i,l,v){return `<div class="stat"><div class="mut">${svg(i,16)}</div><div class="v num">${v}</div><div class="l">${l}</div></div>`;}
  function streakGrid(ch){
    let cells="";
    for(let i=0;i<ch.days;i++){
      if(i<ch.done) cells+=`<div class="cell done">✓</div>`;
      else if(i===ch.done) cells+=`<div class="cell today">${i+1}</div>`;
      else cells+=`<div class="cell pend">${i+1}</div>`;
    }
    return `<div class="card2"><div class="eyebrow" style="margin-bottom:10px">Твої дні</div><div class="streak">${cells}</div></div>`;
  }
  function cardResult(emoji,title,html,sub,kind){
    const ln=kind==="good"?"var(--goodln)":"var(--badln)", bg=kind==="good"?"var(--goodbg)":"var(--badbg)";
    return `<div class="card rise" style="text-align:center;border-color:${ln};background:${bg}">
      <div style="font-size:48px;margin-bottom:12px">${emoji}</div>
      <h2 style="font-size:23px;font-weight:800;margin-bottom:4px">${title}</h2>
      <p class="mut" style="font-size:14px;margin-bottom:4px">${html}</p>
      <p style="font-size:14px;margin-bottom:20px;color:${kind==="good"?"var(--good)":"var(--mut)"}">${sub}</p>

  /* ---------- actions ---------- */
  function createChallenge(){
    if(S.balance<ui.stake){toast("Недостатньо коштів");return;}

    const ch=S.challenge;if(!ch||ch.status!=="active")return;
    const reasons={gym:"Демо: зараховано як тренування.",couch:"Демо: це не схоже на зал."};
    ui.ci.result={verdict,confidence:.9,reason:reasons[verdict]};

    ui.ci.state="done";save();render();

  app.addEventListener("click",function(e){

    if(a==="intro-next"){if(S.introI<3){S.introI++;}else{S.seenIntro=true;S.page="home";save();}render();return;}
    if(a==="go"){S.page=el.dataset.page;if(S.page==="checkin"){ui.ci={img:null,state:"idle",result:null};}save();render();return;}
    if(a==="create-open"){ui.createOpen=true;render();return;}
    if(a==="create-close"){ui.createOpen=false;render();return;}
    if(a==="set-stake"){ui.stake=+v;render();return;}
    if(a==="set-days"){ui.days=+v;render();return;}
    if(a==="create-confirm"){createChallenge();return;}
    if(a==="create-topup"){ui.createOpen=false;S.page="wallet";save();render();return;}
    if(a==="fail"){failChallenge();return;}
    if(a==="reset"){S.challenge=null;S.page="home";save();render();return;}
    if(a==="pick"){document.getElementById("filepick").click();return;}
    if(a==="judge"){ui.ci.state="judging";render();setTimeout(()=>applyCheckin(v),1200);return;}
    if(a==="ci-retry"){ui.ci={img:null,state:"idle",result:null};render();return;}
    if(a==="wtab"){ui.wtab=k;render();return;}
    if(a==="tu-method"){ui.tuMethod=k;render();return;}
    if(a==="tu-quick"){ui.tuAmount=v;render();return;}
    if(a==="tu-submit"){const amt=parseInt(ui.tuAmount,10)||0;if(amt<50)return;S.balance+=amt;addTxn({type:"topup",amount:amt,note:ui.tuMethod==="usdt"?"Поповнення USDT":"Поповнення карткою"});ui.tuAmount="";save();render();toast("+"+fmt(amt)+" ₴ зараховано");return;}
    if(a==="wd-method"){ui.wdMethod=k;render();return;}
    if(a==="wd-submit"){const amt=parseInt(ui.wdAmount,10)||0;if(amt<50||amt>S.balance||ui.wdDest.trim().length<6)return;S.balance-=amt;S.wds.unshift({id:uid(),ts:Date.now(),amount:amt,dest:ui.wdDest.trim(),method:ui.wdMethod,status:"processing"});addTxn({type:"withdraw",amount:-amt,note:"Заявка на вивід"});ui.wdAmount="";ui.wdDest="";save();render();toast("Заявку прийнято · до 24 год");return;}
    if(a==="wd-done"){const p=S.wds.find(w=>w.status==="processing");if(p){p.status="done";save();render();toast("Вивід виконано");}return;}

  app.addEventListener("input",function(e){
    const el=e.target;if(!el.dataset||!el.dataset.model)return;
    let val=el.value;if(el.dataset.numeric)val=val.replace(/\D/g,"");
    if(val!==el.value)el.value=val;
    ui[el.dataset.model]=val;
    // live-update submit buttons without full re-render (keeps focus)
    if(el.dataset.model==="stakeCustom"){
      ui.stake=parseInt(val,10)||0; const P=ui.stake*2;
      const a=document.getElementById("sumStake"); if(a)a.textContent=fmt(ui.stake)+" ₴";
      const b=document.getElementById("sumPrize"); if(b)b.textContent=fmt(P)+" ₴ ×2";
      const c=document.getElementById("sumBurn"); if(c)c.textContent="−"+fmt(ui.stake)+" ₴";
      document.querySelectorAll('[data-act="set-stake"]').forEach(btn=>btn.classList.toggle("on",+btn.dataset.v===ui.stake));
    }
    if(el.dataset.model==="tuAmount"){const a=parseInt(val,10)||0;const b=document.getElementById("tuBtn");if(b){b.disabled=a<50;b.innerHTML='Поповнити на <span class="num">'+fmt(a)+'</span> ₴';}}
    if(el.dataset.model==="wdAmount"||el.dataset.model==="wdDest"){const a=parseInt(ui.wdAmount,10)||0;const ok=a>=50&&a<=S.balance&&ui.wdDest.trim().length>=6;const b=document.getElementById("wdBtn");if(b)b.disabled=!ok;}
  });

  document.getElementById("filepick").addEventListener("change",function(e){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{ui.ci.img=r.result;ui.ci.state="idle";ui.ci.result=null;render();};r.readAsDataURL(f);
    e.target.value="";
  });

  render();
})();
</script>
