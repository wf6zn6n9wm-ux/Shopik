<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#22C55E" />
<title>Urok+ — оплата пройшла</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
  /* Сторінка коротка й самодостатня: людина потрапляє сюди з банку і
     їй потрібно одне — зрозуміти, що все добре, і повернутись. */
  :root{--accent:#22C55E;--bg:#FFFFFF;--surface-2:#F4F5F7;--ink:#0C1015;--ink-2:#6B7280;--ink-3:#9AA1AB;}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0B0D10;--surface-2:#1E2228;--ink:#F3F5F7;--ink-2:#9AA3AE;--ink-3:#6E7883;}
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);display:grid;place-items:center;
    font-family:ui-sans-serif,-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;padding:24px;}
  .wrap{max-width:420px;text-align:center;}
  .mark{width:76px;height:76px;border-radius:26px;background:var(--accent);color:#fff;display:grid;
    place-items:center;margin:0 auto 22px;}
  h1{font-size:26px;font-weight:800;letter-spacing:-.04em;margin:0 0 10px;}
  .sub{color:var(--ink-2);font-size:15px;line-height:1.55;margin:0 0 26px;}
  .go{display:block;height:56px;line-height:56px;border-radius:18px;background:var(--accent);color:#fff;
    font-weight:800;font-size:16px;text-decoration:none;}
  .note{color:var(--ink-3);font-size:12.5px;line-height:1.5;margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
         stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.6l5 5 10-11"/></svg>
  </div>
  <h1 id="h1">Оплата пройшла</h1>
  <p class="sub" id="sub">Поверніться в застосунок і натисніть «Відновити доступ» — підписка ввімкнеться.</p>
  <a class="go" id="go" href="./">Відкрити застосунок</a>
  <p class="note" id="note"></p>
</div>
<script>
var Q = new URLSearchParams(location.search);
var LANG = ['uk', 'ru', 'en'].indexOf(Q.get('lang')) >= 0 ? Q.get('lang') : 'uk';
document.documentElement.lang = LANG;
var T = {
  uk: {h: 'Оплата пройшла', s: 'Поверніться в застосунок і натисніть «Відновити доступ» — підписка ввімкнеться.',
       g: 'Відкрити застосунок', n: 'Квитанцію надішле банк на вашу пошту. Керувати підпискою можна в застосунку: Профіль → Підписка.'},
  ru: {h: 'Оплата прошла', s: 'Вернитесь в приложение и нажмите «Восстановить доступ» — подписка включится.',
       g: 'Открыть приложение', n: 'Квитанцию пришлёт банк на вашу почту. Управлять подпиской можно в приложении: Профиль → Подписка.'},
  en: {h: 'Payment received', s: 'Go back to the app and tap “Restore access” — the subscription will switch on.',
       g: 'Open the app', n: 'The bank will email you a receipt. You can manage the subscription in the app: Profile → Subscription.'}
}[LANG];
document.getElementById('h1').textContent = T.h;
document.getElementById('sub').textContent = T.s;
document.getElementById('go').textContent = T.g;
document.getElementById('note').textContent = T.n;
</script>
</body>
</html>
