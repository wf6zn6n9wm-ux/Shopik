<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#22C55E" />
<title>Urok+ — оформлення підписки</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Onest:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Сторінка навмисне автономна: ніякого React і жодної спільної збірки
     із застосунком. Вона має відкриватися з листа, з месенджера і з
     застосунку — і працювати, навіть якщо решта сайту лежить. Токени
     повторюють дизайн-систему Urok+, але живуть тут своєю копією. */
  :root{
    --accent:#22C55E; --accent-3:#16A34A; --accent-ink:#fff;
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F5F7;
    --ink:#0C1015; --ink-2:#6B7280; --ink-3:#9AA1AB;
    --line:#EDEFF2; --line-2:#E1E4E9;
    --shadow:0 1px 2px rgba(12,16,21,.05), 0 6px 16px -12px rgba(12,16,21,.16);
    --r:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0B0D10; --surface:#171A1F; --surface-2:#1E2228;
      --ink:#F3F5F7; --ink-2:#9AA3AE; --ink-3:#6E7883;
      --line:#22262C; --line-2:#2C323A;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 20px -16px rgba(0,0,0,.9);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Manrope',ui-sans-serif,-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:460px;margin:0 auto;padding:28px 18px 40px;}
  .brand{font-family:'Onest',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.045em;}
  .brand i{color:var(--accent);font-style:normal;}
  h1{font-family:'Onest',sans-serif;font-size:27px;font-weight:800;letter-spacing:-.04em;
    line-height:1.15;margin:22px 0 8px;}
  .sub{color:var(--ink-2);font-size:14.5px;margin:0 0 22px;}
  .plans{display:grid;gap:14px;}
  .plan{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:15px;border-radius:var(--r);border:1.5px solid var(--line-2);background:var(--surface);
    color:inherit;font:inherit;cursor:pointer;transition:border-color .2s,background .2s,transform .16s;}
  .plan:active{transform:scale(.99);}
  .plan[aria-pressed="true"]{border-color:var(--accent);background:rgba(34,197,94,.10);}
  /* назва й підпис — окремими рядками: інлайнові span злипаються */
  .plan .col{display:block;flex:1;min-width:0;}
  .plan .name{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.02em;}
  .plan .per{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px;}
  .plan .amt{margin-left:auto;text-align:right;flex:none;}
  .plan .now{font-family:'Onest',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;}
  .plan .was{display:block;font-size:12px;font-weight:700;color:var(--ink-3);text-decoration:line-through;
    margin-top:2px;}
  .plan .save{position:absolute;top:-9px;right:14px;background:var(--accent);color:var(--accent-ink);
    font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;}
  .go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;margin-top:20px;
    border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);
    font:800 16px/1 'Manrope',sans-serif;letter-spacing:-.015em;cursor:pointer;
    box-shadow:0 12px 24px -14px var(--accent);transition:transform .16s,opacity .2s;}
  .go:active{transform:scale(.98);}
  .go[disabled]{opacity:.5;cursor:default;}
  .note{color:var(--ink-3);font-size:12.5px;line-height:1.5;margin:14px 2px 0;}
  .field{display:block;margin-top:18px;}
  .field span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 2px 7px;}
  .field input{width:100%;height:52px;padding:0 15px;border-radius:14px;background:var(--surface-2);
    border:1.5px solid transparent;color:var(--ink);font:600 15px 'Manrope',sans-serif;}
  .field input:focus{outline:0;border-color:var(--accent);background:var(--surface);}
  .field input.err{border-color:#EF4444;}
  .msg{margin-top:16px;padding:14px 15px;border-radius:var(--r);background:var(--surface-2);
    font-size:14px;line-height:1.5;}
  .msg b{display:block;margin-bottom:4px;font-size:14.5px;}
  .msg a{color:var(--accent);font-weight:700;text-decoration:none;}
  .langs{display:flex;gap:8px;margin-top:26px;justify-content:center;}
  .langs button{border:0;background:var(--surface-2);color:var(--ink-2);border-radius:999px;
    padding:7px 13px;font:700 13px 'Manrope',sans-serif;cursor:pointer;}
  .langs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);}
  .back{display:inline-block;margin-top:22px;color:var(--ink-2);font-size:13.5px;font-weight:700;
    text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Urok<i>+</i></div>
  <h1 id="h1">Оформлення підписки</h1>
  <p class="sub" id="sub">Повний доступ до Urok+. Оплата карткою через LiqPay.</p>

  <div class="plans" id="plans"></div>

  <label class="field">
    <span id="maillbl">Пошта для доступу</span>
    <input id="mail" type="email" inputmode="email" autocomplete="email" placeholder="mail@example.com" />
  </label>
  <p class="note" id="mailhint"></p>

  <button class="go" id="go">Перейти до оплати</button>
  <p class="note" id="note"></p>
  <div class="msg" id="msg" hidden></div>

  <div class="langs" id="langs"></div>
  <a class="back" id="back" href="./">← Повернутись у застосунок</a>
</div>

<script>
/* Ціни мають збігатися з PRODUCTS у src/10-core.js — за цим стежить
   tests/smoke.js, інакше сайт і застосунок одного дня почнуть обіцяти
   різні суми. renews — чи продовжується підписка сама: у LiqPay є
   місячна й річна періодичність, тримісячної немає. */
var PLANS = [
  {id: 'yearly',    months: 12, price: 1490, renews: true},
  {id: 'quarterly', months: 3,  price: 399,  renews: false},
  {id: 'monthly',   months: 1,  price: 149,  renews: true}
];

/* Серверна функція, яка підписує запит і відправляє в LiqPay. Якщо
   ключів немає — вона відповість 503, і сторінка чесно про це скаже,
   а не поведе в нікуди. */
var CHECKOUT = 'api/checkout';
var SUPPORT = 'https://t.me/urokplus';

var T = {
  uk: {
    title: 'Оформлення підписки',
    sub: 'Повний доступ до Urok+. Оплата карткою через LiqPay.',
    go: 'Перейти до оплати',
    names: {yearly: 'Річна підписка', quarterly: 'Підписка на 3 місяці', monthly: 'Місячна підписка'},
    per: {yearly: 'на рік', quarterly: 'разова оплата за 3 місяці', monthly: 'щомісяця'},
    permonth: '{price} на місяць',
    renews: 'Продовжується автоматично',
    once: 'Разовий платіж, без автопродовження',
    mail: 'Пошта для доступу',
    mailHint: 'На неї прив\'яжемо підписку — цю саму пошту введете в застосунку.',
    mailBad: 'Перевірте адресу пошти',
    save: '−{n}%',
    note: 'Після оплати поверніться в застосунок і натисніть «Відновити покупки» — підписка активується. Дані вашої картки ми не бачимо й не зберігаємо.',
    soonT: 'Оплата на сайті ще налаштовується',
    soonD: 'Платіжний сервіс під\'єднуємо просто зараз. Напишіть нам — оформимо підписку вручну й повідомимо, щойно кнопка запрацює.',
    write: 'Написати в Telegram',
    back: '← Повернутись у застосунок'
  },
  ru: {
    title: 'Оформление подписки',
    sub: 'Полный доступ к Urok+. Оплата картой через LiqPay.',
    go: 'Перейти к оплате',
    names: {yearly: 'Годовая подписка', quarterly: 'Подписка на 3 месяца', monthly: 'Месячная подписка'},
    per: {yearly: 'в год', quarterly: 'разовая оплата за 3 месяца', monthly: 'ежемесячно'},
    permonth: '{price} в месяц',
    renews: 'Продлевается автоматически',
    once: 'Разовый платёж, без автопродления',
    mail: 'Почта для доступа',
    mailHint: 'К ней привяжем подписку — эту же почту введёте в приложении.',
    mailBad: 'Проверьте адрес почты',
    save: '−{n}%',
    note: 'После оплаты вернитесь в приложение и нажмите «Восстановить покупки» — подписка активируется. Данные вашей карты мы не видим и не храним.',
    soonT: 'Оплата на сайте ещё настраивается',
    soonD: 'Платёжный сервис подключаем прямо сейчас. Напишите нам — оформим подписку вручную и сообщим, как только кнопка заработает.',
    write: 'Написать в Telegram',
    back: '← Вернуться в приложение'
  },
  en: {
    title: 'Subscribe',
    sub: 'Full access to Urok+. Card payment via LiqPay.',
    go: 'Go to payment',
    names: {yearly: 'Yearly plan', quarterly: '3-month plan', monthly: 'Monthly plan'},
    per: {yearly: 'per year', quarterly: 'one-off payment for 3 months', monthly: 'per month'},
    permonth: '{price} per month',
    renews: 'Renews automatically',
    once: 'One-off payment, no auto-renewal',
    mail: 'Email for access',
    mailHint: 'We tie the subscription to it — you will enter the same email in the app.',
    mailBad: 'Check the email address',
    save: '−{n}%',
    note: 'After paying, come back to the app and tap “Restore purchases” — the subscription activates. We never see or store your card details.',
    soonT: 'Website payment is being set up',
    soonD: 'We are connecting the payment provider right now. Write to us — we will set the subscription up manually and let you know when the button works.',
    write: 'Message us on Telegram',
    back: '← Back to the app'
  }
};

var Q = new URLSearchParams(location.search);
var LANG = ['uk', 'ru', 'en'].indexOf(Q.get('lang')) >= 0 ? Q.get('lang') : 'uk';
var plan = PLANS.some(function(p){ return p.id === Q.get('plan'); }) ? Q.get('plan') : 'yearly';
/* Пристрій і пошту приносить застосунок — щоб людина не вводила те,
   що вже й так відомо, а ліцензія одразу лягла на потрібний пристрій. */
var DEVICE = Q.get('device') || '';

/* Гривня пишеться після числа й без копійок: ціни в нас цілі. */
var money = function(v){
  return String(Math.round(Number(v))).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0') + '\u00A0₴';
};
var monthly = function(p){ return p.price / p.months; };
var saving = function(p){
  var base = PLANS.filter(function(x){ return x.id === 'monthly'; })[0];
  return Math.round((1 - monthly(p) / monthly(base)) * 100);
};
var best = Math.max.apply(null, PLANS.map(saving));

function render(){
  var t = T[LANG];
  if (Q.get('login') && !document.getElementById('mail').value)
    document.getElementById('mail').value = Q.get('login');
  document.documentElement.lang = LANG;
  document.getElementById('h1').textContent = t.title;
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('go').textContent = t.go;
  document.getElementById('note').textContent = t.note;
  document.getElementById('maillbl').textContent = t.mail;
  document.getElementById('mailhint').textContent = t.mailHint;
  document.getElementById('back').textContent = t.back;

  document.getElementById('plans').innerHTML = PLANS.map(function(p){
    var pct = saving(p);
    var badge = pct > 0 && pct === best
      ? '<span class="save">' + t.save.replace('{n}', pct) + '</span>' : '';
    var per = p.months > 1
      ? t.permonth.replace('{price}', money(monthly(p)))
      : t.per[p.id];
    return '<button class="plan" type="button" data-plan="' + p.id + '"'
      + ' aria-pressed="' + (p.id === plan) + '">' + badge
      + '<span class="col"><span class="name">' + t.names[p.id] + '</span>'
      + '<span class="per">' + per + '</span>'
      + '<span class="per">' + (p.renews ? t.renews : t.once) + '</span></span>'
      + '<span class="amt"><span class="now">' + money(p.price) + '</span></span></button>';
  }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('.plan'), function(el){
    el.addEventListener('click', function(){
      plan = el.getAttribute('data-plan');
      render();
    });
  });

  document.getElementById('langs').innerHTML = ['uk', 'ru', 'en'].map(function(l){
    return '<button type="button" data-lang="' + l + '" aria-current="' + (l === LANG) + '">'
      + ({uk: 'Українська', ru: 'Русский', en: 'English'}[l]) + '</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function(el){
    el.addEventListener('click', function(){
      LANG = el.getAttribute('data-lang');
      render();
    });
  });
}

document.getElementById('go').addEventListener('click', function(){
  var t = T[LANG];
  var mail = document.getElementById('mail');
  /* Без пошти платіж нікуди прив'язати: гроші прийдуть, а доступ ні. */
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value.trim())){
    mail.classList.add('err');
    mail.focus();
    var m0 = document.getElementById('msg');
    m0.hidden = false;
    m0.textContent = t.mailBad;
    return;
  }
  mail.classList.remove('err');
  if (!CHECKOUT){
    var msg = document.getElementById('msg');
    msg.hidden = false;
    msg.innerHTML = '<b>' + t.soonT + '</b>' + t.soonD
      + '<br><a href="' + SUPPORT + '" target="_blank" rel="noopener">' + t.write + '</a>';
    msg.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    return;
  }
  location.href = CHECKOUT + '?' + new URLSearchParams({
    plan: plan, lang: LANG, login: mail.value.trim().toLowerCase(), device: DEVICE
  }).toString();
});

render();
</script>
</body>
</html>
